version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "nexusnova-latest-full-apk-recovery-20260823"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/NexusNovaAndroid"
    target-branch: "nexusnova-latest-full-apk-recovery-20260823"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/functions"
    target-branch: "nexusnova-latest-full-apk-recovery-20260823"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 5
