name: AI Photo Canva-Class Phase 2 Final OTA

on:
  push:
    branches: [ai-photo-canva-class-phase2-review]
    paths:
      - '.github/workflows/ai-photo-canva-phase2-final-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PHASE2_VERIFIED_SOURCE: de76e10bf43f6f5893e6cd5d5fb00179f0409d6e
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish_phase2_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved Phase 2 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is only the OTA workflow over verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PHASE2_VERIFIED_SOURCE"
          changed="$(git diff --name-only "$PHASE2_VERIFIED_SOURCE" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/ai-photo-canva-phase2-final-ota.yml'
          echo 'Verified Phase 2 source parent preserved: PASS'

      - name: Verify Phase 2 wiring and fullscreen protection
        shell: bash
        run: |
          set -euo pipefail
          BASE=e0e5d61d6f97df635431475ea6b673d5e347a975
          for file in \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/ai-photo-focus-interaction.js \
            fresh-rebuild/src/features/apps/ai-photo-canva-workspace.js \
            fresh-rebuild/src/features/apps/ai-photo-design-canvas.js \
            fresh-rebuild/src/features/apps/ai-photo-design-tools.js \
            fresh-rebuild/src/features/apps/ai-photo-project-store.js \
            fresh-rebuild/src/features/apps/data/ai-photo-templates.js; do
            test -s "$file"
            node --check "$file"
          done
          grep -Fq 'installSliderOnlyFocus' fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq 'installAiPhotoCanvaWorkspace' fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq 'Search 1000+ templates' fresh-rebuild/src/features/apps/ai-photo-canva-workspace.js
          grep -Fq 'pointerdown' fresh-rebuild/src/features/apps/ai-photo-focus-interaction.js
          for path in \
            fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css \
            fresh-rebuild/src/features/apps/app-screen.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js \
            fresh-rebuild/src/features/apps/premium-prayer-safe.js \
            fresh-rebuild/src/features/apps/pakistan-suite.js \
            fresh-rebuild/src/features/apps/news-suite.js \
            fresh-rebuild/src/features/apps/articles-suite.js \
            fresh-rebuild/src/features/apps/live-feed-premium-skin.js \
            fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js \
            fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css; do
            test "$(git rev-parse "$BASE:$path")" = "$(git hash-object "$path")" || { echo "Protected file changed: $path" >&2; exit 1; }
          done
          cp fresh-rebuild/src/features/apps/data/ai-photo-templates.js /tmp/templates.mjs
          node --input-type=module - <<'NODE'
          const m=await import('file:///tmp/templates.mjs');
          if(m.NEXUSNOVA_TEMPLATES.length!==1000)throw new Error('Template count mismatch');
          if(m.NEXUSNOVA_TEMPLATE_CATEGORIES.length!==20)throw new Error('Category count mismatch');
          console.log('Phase 2 wiring + fullscreen protection: PASS');
          NODE

      - name: Build cumulative differential OTA
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ | grep -v '^fresh-rebuild/src/emergency-sos.js$' || true)"
          test -z "$deleted" || { echo 'Unexpected deleted fresh-rebuild files:' >&2; printf '%s\n' "$deleted" >&2; exit 1; }
          rm -rf /tmp/nx-phase2-ota
          mkdir -p /tmp/nx-phase2-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-phase2-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-phase2-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)
          test -f /tmp/nx-phase2-ota/files/index.html || cp fresh-rebuild/index.html /tmp/nx-phase2-ota/files/index.html
          required=(
            index.html
            assets/styles/ai-photo-route-fullscreen.css
            src/features/apps/app-screen.js
            src/features/apps/ai-photo-studio.js
            src/features/apps/ai-photo-studio-flagship.js
            src/features/apps/ai-photo-studio-review.js
            src/features/apps/premium-studio-suite.js
            src/features/apps/ai-photo-live-preview-engine.js
            src/features/apps/ai-photo-design-canvas.js
            src/features/apps/ai-photo-design-tools.js
            src/features/apps/ai-photo-project-store.js
            src/features/apps/ai-photo-studio-ai.js
            src/features/apps/ai-photo-focus-interaction.js
            src/features/apps/ai-photo-canva-workspace.js
            src/features/apps/data/ai-photo-templates.js
          )
          for f in "${required[@]}"; do test -s "/tmp/nx-phase2-ota/files/$f" || { echo "Missing OTA file: $f" >&2; exit 1; }; done
          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-phase2-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_DIFF_BASE'],'version':os.environ['GITHUB_SHA'],'source':os.environ['PHASE2_VERIFIED_SOURCE'],'files':files}
          Path('/tmp/nx-phase2-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Phase 2 OTA files:',len(files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish Phase 2 OTA
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-phase2-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-phase2-public
          cd /tmp/nx-phase2-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-phase2-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo Canva-Class Phase 2 OTA $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_SHA/ota"
          curl -fsSL "$BASE_URL/manifest.json" -o /tmp/public.json
          python3 - "$GITHUB_SHA" "$OTA_BUNDLED_BASE" "$PHASE2_VERIFIED_SOURCE" <<'PY'
          import json,sys
          m=json.load(open('/tmp/public.json',encoding='utf-8'))
          expected,base,source=sys.argv[1:4]
          assert m.get('schema')==2
          assert m.get('base')==base
          assert m.get('version')==expected
          assert m.get('source')==source
          required={
            'index.html','assets/styles/ai-photo-route-fullscreen.css','src/features/apps/app-screen.js',
            'src/features/apps/ai-photo-studio.js','src/features/apps/ai-photo-studio-flagship.js',
            'src/features/apps/ai-photo-studio-review.js','src/features/apps/ai-photo-focus-interaction.js',
            'src/features/apps/ai-photo-canva-workspace.js','src/features/apps/data/ai-photo-templates.js'
          }
          paths={x.get('path') for x in m.get('files',[])}
          assert required <= paths
          PY
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          m=json.load(open('/tmp/public.json',encoding='utf-8'))
          public_sha=os.environ['PUBLIC_SHA']
          base=f'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/{public_sha}/ota/files/'
          for item in m['files']:
              url=base+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=20).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Exact public Phase 2 OTA verified:',len(m['files']),'files')
          PY
