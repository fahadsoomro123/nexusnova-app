name: AI Photo Studio Flagship Review OTA

on:
  push:
    branches: [nova-sol57-pro-v128-ai-photo-canva-review]
    paths:
      - 'fresh-rebuild/src/features/apps/ai-photo-studio.js'
      - 'fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js'
      - 'fresh-rebuild/src/features/apps/ai-photo-studio-review.js'
      - 'fresh-rebuild/src/features/apps/premium-studio-suite.js'
      - '.github/workflows/ai-photo-canva-review-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish_review_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify full AI Photo flagship source
        shell: bash
        run: |
          set -euo pipefail
          FLAG=fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js
          WRAP=fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          SUITE=fresh-rebuild/src/features/apps/premium-studio-suite.js
          node --check "$FLAG"
          node --check "$WRAP"
          node --check "$SUITE"
          grep -Fq 'data-photo-canvas' "$FLAG"
          grep -Fq 'data-photo-crop' "$FLAG"
          grep -Fq 'data-mask-base="linear"' "$FLAG"
          grep -Fq 'data-mask-brush="add"' "$FLAG"
          grep -Fq 'data-local-tool="heal"' "$FLAG"
          grep -Fq 'data-local-tool="clone"' "$FLAG"
          grep -Fq 'data-local-tool="smooth"' "$FLAG"
          grep -Fq 'data-curve-canvas' "$FLAG"
          grep -Fq 'data-photo-histogram' "$FLAG"
          grep -Fq 'data-copy-edits' "$FLAG"
          grep -Fq 'data-save-preset' "$FLAG"
          grep -Fq 'data-photo-ai="auto"' "$FLAG"
          grep -Fq 'data-photo-ai="denoise"' "$FLAG"
          grep -Fq 'No external website redirect' "$FLAG"
          if grep -Eq 'runwayml\.com|firefly\.adobe\.com|canva\.com/ai-image-generator|data-photo-provider' "$FLAG" "$WRAP"; then
            echo 'External AI redirect found in active AI Photo renderer' >&2
            exit 1
          fi
          grep -Fq "from './ai-photo-studio-review.js'" "$SUITE"
          grep -Fq "'ai-photo-studio': renderAiPhotoStudio" "$SUITE"
          echo 'AI Photo full flagship source: PASS'

      - name: Build differential OTA
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ || true)"
          test -z "$deleted" || { printf '%s\n' "$deleted" >&2; exit 1; }
          rm -rf /tmp/nx-photo-ota
          mkdir -p /tmp/nx-photo-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-photo-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-photo-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)
          for required in \
            src/features/apps/ai-photo-studio-flagship.js \
            src/features/apps/ai-photo-studio-review.js \
            src/features/apps/premium-studio-suite.js; do
            test -s "/tmp/nx-photo-ota/files/$required"
          done
          test -f /tmp/nx-photo-ota/files/index.html || cp fresh-rebuild/index.html /tmp/nx-photo-ota/files/index.html
          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-photo-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          paths={x['path'] for x in files}
          required={'index.html','src/features/apps/ai-photo-studio-flagship.js','src/features/apps/ai-photo-studio-review.js','src/features/apps/premium-studio-suite.js'}
          assert required <= paths,(required-paths)
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_DIFF_BASE'],'version':os.environ['GITHUB_SHA'],'files':files}
          Path('/tmp/nx-photo-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('AI Photo flagship OTA files:',len(files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish public flagship review OTA
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-photo-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-photo-public
          cd /tmp/nx-photo-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-photo-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo full flagship review OTA $GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"

      - name: Verify anonymous public OTA end-to-end
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_OTA_BRANCH/ota"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/manifest.json?sha=$GITHUB_SHA&n=$attempt" -o /tmp/public.json || true
            if python3 - "$GITHUB_SHA" "$OTA_BUNDLED_BASE" <<'PY'
          import json,sys
          try:m=json.load(open('/tmp/public.json',encoding='utf-8'))
          except:raise SystemExit(1)
          expected,base=sys.argv[1],sys.argv[2]
          assert m.get('schema')==2 and m.get('base')==base and m.get('version')==expected
          paths={x.get('path') for x in m.get('files',[])}
          required={'src/features/apps/ai-photo-studio-flagship.js','src/features/apps/ai-photo-studio-review.js','src/features/apps/premium-studio-suite.js'}
          assert required <= paths
          PY
            then break; fi
            test "$attempt" -lt 6 || exit 1
            sleep 5
          done
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          m=json.load(open('/tmp/public.json',encoding='utf-8'))
          base='https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/files/'
          for item in m['files']:
              url=base+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=20).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Anonymous public AI Photo flagship OTA verified:',len(m['files']),'files')
          PY
