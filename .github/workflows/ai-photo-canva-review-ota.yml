name: AI Photo Recovery Phase 1 OTA

on:
  push:
    branches: [batch17-20-preota-review]
    paths:
      - '.github/workflows/ai-photo-canva-review-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish_recovery_phase1_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify enhanced AI Photo + Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            fresh-rebuild/src/features/apps/ai-photo-studio.js
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js
            fresh-rebuild/src/features/apps/premium-studio-suite.js
            fresh-rebuild/src/features/apps/ai-photo-live-preview-engine.js
            fresh-rebuild/src/features/apps/ai-photo-design-canvas.js
            fresh-rebuild/src/features/apps/ai-photo-design-tools.js
            fresh-rebuild/src/features/apps/ai-photo-project-store.js
            fresh-rebuild/src/features/apps/ai-photo-studio-ai.js
          )
          for f in "${files[@]}"; do test -s "$f"; node --check "$f"; done
          test -s fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css
          grep -Fq "renderAiPhotoStudioFlagship as renderAiPhotoStudio" fresh-rebuild/src/features/apps/ai-photo-studio.js
          grep -Fq "from './ai-photo-studio-review.js'" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-photo-studio': renderAiPhotoStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq 'data-photo-canvas' fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js
          grep -Fq 'data-photo-ai="auto"' fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js
          echo 'Enhanced AI Photo + Phase 1 source: PASS'

      - name: Build cumulative differential OTA
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ | grep -v '^fresh-rebuild/src/emergency-sos.js$' || true)"
          test -z "$deleted" || { echo 'Unexpected deleted fresh-rebuild files:' >&2; printf '%s\n' "$deleted" >&2; exit 1; }
          rm -rf /tmp/nx-photo-ota
          mkdir -p /tmp/nx-photo-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-photo-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-photo-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)
          test -f /tmp/nx-photo-ota/files/index.html || cp fresh-rebuild/index.html /tmp/nx-photo-ota/files/index.html
          required=(
            index.html
            assets/styles/ai-photo-route-fullscreen.css
            src/features/apps/ai-photo-studio.js
            src/features/apps/ai-photo-studio-flagship.js
            src/features/apps/ai-photo-studio-review.js
            src/features/apps/premium-studio-suite.js
            src/features/apps/ai-photo-live-preview-engine.js
            src/features/apps/ai-photo-design-canvas.js
            src/features/apps/ai-photo-design-tools.js
            src/features/apps/ai-photo-project-store.js
            src/features/apps/ai-photo-studio-ai.js
          )
          for f in "${required[@]}"; do test -s "/tmp/nx-photo-ota/files/$f"; done
          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-photo-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_DIFF_BASE'],'version':os.environ['GITHUB_SHA'],'files':files}
          Path('/tmp/nx-photo-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Recovery Phase 1 OTA files:',len(files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish new unique OTA version
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-photo-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-photo-public
          cd /tmp/nx-photo-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-photo-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo recovery + Phase 1 OTA $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_SHA/ota"
          curl -fsSL "$BASE_URL/manifest.json" -o /tmp/public.json
          python3 - "$GITHUB_SHA" "$OTA_BUNDLED_BASE" <<'PY'
          import json,sys
          m=json.load(open('/tmp/public.json',encoding='utf-8'))
          expected,base=sys.argv[1],sys.argv[2]
          assert m.get('schema')==2
          assert m.get('base')==base
          assert m.get('version')==expected
          required={
            'index.html','assets/styles/ai-photo-route-fullscreen.css',
            'src/features/apps/ai-photo-studio.js',
            'src/features/apps/ai-photo-studio-flagship.js',
            'src/features/apps/ai-photo-live-preview-engine.js'
          }
          paths={x.get('path') for x in m.get('files',[])}
          assert required <= paths
          PY
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          m=json.load(open('/tmp/public.json',encoding='utf-8'))
          public_sha=os.environ['PUBLIC_SHA']
          base=f'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/{public_sha}/ota/files/'
          for item in m['files']:
              url=base+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=20).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Exact public recovery Phase 1 OTA verified:',len(m['files']),'files')
          PY
