name: AI Photo Puter Native Apply Bridge

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-cloudflare-plan-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: ai-photo-real-canva-ai-generator-correction
          fetch-depth: 0

      - name: Guard and patch MainActivity only
        shell: bash
        run: |
          set -euo pipefail
          FILE='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
          EXPECTED='a4b3c6691e5e3b63d3851429a19a4d1797b8fd9d'
          ACTUAL="$(git hash-object "$FILE")"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::MainActivity baseline changed: $ACTUAL"; exit 2; }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          settings_old='''        settings.domStorageEnabled = true\n        settings.databaseEnabled = true\n'''
          settings_new='''        settings.domStorageEnabled = true\n        settings.databaseEnabled = true\n        // Puter authentication opens a user-initiated popup. Multiple windows\n        // are enabled only for the guarded isolated child WebView below.\n        settings.setSupportMultipleWindows(true)\n        settings.javaScriptCanOpenWindowsAutomatically = true\n'''
          chrome_old='''        webView.webChromeClient = object : WebChromeClient() {\n'''
          chrome_new='''        webView.webChromeClient = object : WebChromeClient() {\n            override fun onCreateWindow(\n                view: WebView?,\n                isDialog: Boolean,\n                isUserGesture: Boolean,\n                resultMsg: android.os.Message?\n            ): Boolean {\n                if (view !== webView || !isTrustedAppPage(view)) return false\n                return NexusPuterPopupManager.open(\n                    this@MainActivity,\n                    resultMsg,\n                    isUserGesture\n                )\n            }\n\n'''
          if s.count(settings_old)!=1: raise SystemExit('settings anchor missing/ambiguous')
          if s.count(chrome_old)!=1: raise SystemExit('WebChromeClient anchor missing/ambiguous')
          if 'NexusPuterPopupManager.open(' in s: raise SystemExit('Puter popup patch already present')
          s=s.replace(settings_old,settings_new,1).replace(chrome_old,chrome_new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "$FILE" || { echo "::error::Unexpected files changed: $changed"; exit 3; }
          grep -F 'settings.setSupportMultipleWindows(true)' "$FILE"
          grep -F 'settings.javaScriptCanOpenWindowsAutomatically = true' "$FILE"
          grep -F 'NexusPuterPopupManager.open(' "$FILE"

      - name: Commit approved native Puter support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI'
          git config user.email 'actions@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          git commit -m 'Enable isolated Puter auth popup in Android WebView'
          git push origin HEAD:ai-photo-real-canva-ai-generator-correction
