name: AI Photo Final Phone RC (Signed, No OTA)

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-final-phone-rc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  APP_SOURCE: 956bcb3d2051f2b7a3953ee8c555c20750b6bc9e
  APPROVED_QA_RUN: '34019263488'
  VERSION_CODE: '2026090699'
  VERSION_NAME: '1.0.14-ai-photo-phone-rc1'
  RELEASE_APK: 'NexusNova-AI-PHOTO-FINAL-RC-v1.0.14-SIGNED.apk'
  EXPECTED_SIGNER_SHA256: '30052faf26f112d88d48061b88e6a698371ef0cdc4203122a9350529405a716c'

jobs:
  signed_phone_rc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact fully-tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          fetch-depth: 0

      - name: Require exact successful exhaustive QA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVED_QA_RUN}" \
            -o /tmp/approved-run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/approved-run.json',encoding='utf-8'))
          assert run['head_sha']==os.environ['APP_SOURCE'], (run['head_sha'],os.environ['APP_SOURCE'])
          assert run['status']=='completed', run['status']
          assert run['conclusion']=='success', run['conclusion']
          print('Exact exhaustive QA source/run: PASS')
          PY

      - name: Recheck release-critical AI Photo contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in fresh-rebuild/src/features/apps/ai-photo-*.js; do node --check "$file"; done
          node --check fresh-rebuild/src/features/apps/data/ai-photo-templates.js
          node --check fresh-rebuild/src/main.js
          test "$(grep -o 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js | wc -l)" -eq 1
          test "$(grep -F "root.dataset.aiPhotoFlagship='flagship-repair-v16'" fresh-rebuild/src/features/apps/ai-photo-studio-review.js | wc -l)" -eq 1
          grep -Fq 'const val BUNDLED_WEB_BASE = "8d1aaaee6f28b974a8c8b3ff213beb1318ec7405"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'Reset OTA overlay for bundled base' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          echo 'Release-critical AI Photo + stale-overlay contracts: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-ai-photo-final-rc.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject RC version and permanent signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = '+os.environ['VERSION_CODE'],t,count=1)
          t,n2=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "'+os.environ['VERSION_NAME']+'"',t,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Android version fields not found')
          signing='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          marker='    buildTypes {\n'
          if marker not in t: raise SystemExit('buildTypes block not found')
          t=t.replace(marker,signing+marker,1)
          release='        release {\n'
          if release not in t: raise SystemExit('release block not found')
          t=t.replace(release,release+'            signingConfig = signingConfigs.getByName("nexusRelease")\n',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build signed phone RC from canonical web source
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          cd ..
          diff -qr fresh-rebuild NexusNovaAndroid/app/src/main/assets/www
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk')
          root=Path('fresh-rebuild')
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              checked=0
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(root).as_posix()
                  name='assets/www/'+rel
                  if name not in names: raise SystemExit(f'APK missing canonical asset {rel}')
                  if z.read(name)!=p.read_bytes(): raise SystemExit(f'APK asset mismatch {rel}')
                  checked+=1
          print('Canonical APK asset byte check: PASS',checked)
          PY

      - name: Verify package version and permanent signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -Fq "package: name='com.nexusnova.app'" /tmp/badging.txt
          grep -Fq "versionCode='$VERSION_CODE'" /tmp/badging.txt
          grep -Fq "versionName='$VERSION_NAME'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -Eq 'Verified using v(2|3) scheme .*: true' /tmp/signature.txt
          CERT="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V[0-9.]* Signer: certificate SHA-256 digest: //p' /tmp/signature.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT"
          test "$CERT" = "$EXPECTED_SIGNER_SHA256"
          sha256sum "$APK" | tee /tmp/phone-rc.sha256
          stat -c '%s' "$APK" > /tmp/phone-rc.size
          printf 'Source: %s\nQA run: %s\nVersion: %s (%s)\nPackage: com.nexusnova.app\nSigner SHA-256: %s\nOTA publish: NO\nUser acceptance: PENDING\n' "$APP_SOURCE" "$APPROVED_QA_RUN" "$VERSION_NAME" "$VERSION_CODE" "$CERT" > /tmp/phone-rc-status.txt
          echo 'Package/version/permanent signer: PASS'

      - name: Stage signed phone RC artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phone-rc
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "/tmp/phone-rc/$RELEASE_APK"
          cp /tmp/phone-rc.sha256 "/tmp/phone-rc/$RELEASE_APK.sha256"
          cp /tmp/phone-rc-status.txt /tmp/phone-rc/STATUS.txt

      - name: Upload signed phone RC privately
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-AI-Photo-Final-Phone-RC-${{ env.APP_SOURCE }}
          path: /tmp/phone-rc
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}" || true
