name: AI Photo Flagship Internal QA (No Release)

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - 'fresh-rebuild/src/features/apps/ai-photo-*.js'
      - 'fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css'
      - 'fresh-rebuild/assets/visuals/ai-photo-*'
      - 'fresh-rebuild/src/main.js'
      - 'fresh-rebuild/src/features/apps/data/ai-photo-templates.js'
      - 'tools/ai-photo-flagship-qa/**'
      - 'tools/ai-photo-locked-visual/**'
      - 'AI-PHOTO-*.md'
      - '.github/workflows/ai-photo-flagship-internal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax, scope, provider, and release safety
        shell: bash
        run: |
          set -euo pipefail
          for file in fresh-rebuild/src/features/apps/ai-photo-*.js; do
            node --check "$file"
          done
          node --check fresh-rebuild/src/features/apps/data/ai-photo-templates.js
          node --check fresh-rebuild/src/main.js
          node --check tools/ai-photo-flagship-qa/firebase-stub.mjs
          node --check tools/ai-photo-flagship-qa/behavior-qa.mjs
          BASE=9ef070ba55f76506851a1366fc9dc3863e50578d
          git diff --check "$BASE" HEAD
          for protected in \
            fresh-rebuild/src/features/apps/app-screen.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/ai-photo-focus-interaction.js; do
            git diff --quiet "$BASE" HEAD -- "$protected"
          done
          git diff --quiet "$BASE" HEAD -- \
            .github/workflows/ai-photo-locked-visual-approved-release.yml \
            .github/workflows/ai-photo-locked-visual-signed-apk-retry.yml \
            .github/workflows/ai-photo-premium-home-final-ota.yml \
            .github/workflows/ai-photo-premium-puter-signed-apk.yml
          test "$(grep -o 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js | wc -l)" -eq 1
          if grep -Ein 'api[_-]?key|bearer ' fresh-rebuild/src/features/apps/ai-photo-quick-tools.js fresh-rebuild/src/features/apps/ai-photo-navigation.js; then
            echo 'Unexpected credential-like text in repaired modules.' >&2
            exit 1
          fi
          echo 'PASS — protected product/release files unchanged; Puter remains keyless with one generation call site.'

      - name: Dark UI text visibility contract
        shell: bash
        run: |
          set -euo pipefail
          CSS=fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css
          grep -Fq 'Readability firewall for the dark AI Photo Studio UI' "$CSS"
          grep -Fq -- '--nx-ai-photo-readable: #f7f8ff' "$CSS"
          grep -Fq -- '--nx-ai-photo-readable-soft: #d8deeb' "$CSS"
          grep -Fq 'select option' "$CSS"
          grep -Fq 'background-color: #121722 !important' "$CSS"
          grep -Fq '::placeholder' "$CSS"
          grep -Fq 'color: #aeb8ca !important' "$CSS"
          grep -Fq '.nxps-home-return' "$CSS"
          grep -Fq '.nx-photo-tool' "$CSS"
          grep -Fq '.nxv3-btn' "$CSS"
          grep -Fq '.nx-photo-ai-actions button' "$CSS"
          echo 'PASS — AI Photo buttons, menus, selects/options, inputs, placeholders and editor controls have a bright-text firewall.'

      - name: Approved reference asset integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('fresh-rebuild/assets/visuals/ai-photo-locked-reference-manifest.json','utf8'));
          if(manifest.image_generation!=='FORBIDDEN'||manifest.generated!==false)throw new Error('No-image-generation contract changed');
          for(const asset of manifest.derived_assets){
            const path=`fresh-rebuild/${asset.path}`;
            const hash=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            if(hash!==asset.sha256)throw new Error(`${path} checksum mismatch`);
          }
          console.log(`PASS — ${manifest.derived_assets.length} source-derived visual assets match the locked manifest.`);
          NODE

      - name: Template count contract
        shell: bash
        run: |
          set -euo pipefail
          cp fresh-rebuild/src/features/apps/data/ai-photo-templates.js /tmp/ai-photo-templates.mjs
          node --input-type=module <<'NODE'
          const m=await import('file:///tmp/ai-photo-templates.mjs');
          if(m.NEXUSNOVA_TEMPLATES.length!==1000)throw new Error('Template total is not 1000');
          if(m.NEXUSNOVA_TEMPLATE_CATEGORIES.length!==20)throw new Error('Category total is not 20');
          for(const category of m.NEXUSNOVA_TEMPLATE_CATEGORIES){
            const count=m.NEXUSNOVA_TEMPLATES.filter(template=>template.category===category.id).length;
            if(count!==50)throw new Error(`${category.id} has ${count} templates`);
          }
          console.log('PASS — exactly 1000 templates across 20 categories × 50.');
          NODE

      - name: Full browser interaction QA
        id: behavior
        shell: bash
        run: bash tools/ai-photo-flagship-qa/run-qa.sh

      - name: Five Android viewport Home and Generator render QA
        id: render
        if: always()
        shell: bash
        run: bash tools/ai-photo-locked-visual/render-qa.sh

      - name: Upload internal QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-photo-flagship-internal-qa-${{ github.sha }}
          path: |
            qa-artifacts/ai-photo-flagship
            qa-artifacts/ai-photo-locked-render
          if-no-files-found: warn
          retention-days: 7

      - name: Java 17
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        if: always()
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android debug build and canonical asset sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd ..
          diff -qr fresh-rebuild NexusNovaAndroid/app/src/main/assets/www
          echo 'PASS — debug APK compiled and canonical repaired sources were copied byte-for-byte. No APK was published.'

      - name: Upload tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-AI-Photo-latest-debug-${{ github.sha }}
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
