name: AI Photo Latest Signed Test APK

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-latest-signed-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_SOURCE: 62908b21aa1ff14c99795b697c0fd8805d3f557b
  PREVIOUS_RELEASE_SOURCE: 80233fbc1802b80949ee388d72a00cce1358edbf
  VERSION_CODE: '2026090508'
  VERSION_NAME: '1.0.17-ai-photo-runtime-fix-test'
  APK_NAME: 'NexusNova-AI-PHOTO-FLAGSHIP-v1.0.17-RUNTIME-FIX-TEST-SIGNED.apk'
  EXPECTED_SIGNER_SHA256: '30052faf26f112d88d48061b88e6a698371ef0cdc4203122a9350529405a716c'
  OLD_BUNDLED_BASE: '8d1aaaee6f28b974a8c8b3ff213beb1318ec7405'

jobs:
  signed_test_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact QA-passed AI Photo source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          fetch-depth: 0

      - name: Require exact source and sanitize concurrent Travel work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE"
          git cat-file -e "$PREVIOUS_RELEASE_SOURCE^{commit}"
          git checkout "$PREVIOUS_RELEASE_SOURCE" -- \
            fresh-rebuild/src/features/apps/travel-hotels.js \
            fresh-rebuild/src/features/apps/travel-suite.js
          rm -f fresh-rebuild/src/features/apps/travel-suite-v4.js
          test -z "$(git diff --name-only "$APP_SOURCE" -- \
            'fresh-rebuild/src/features/apps/ai-photo-*' \
            fresh-rebuild/src/features/apps/data/ai-photo-templates.js \
            'fresh-rebuild/assets/visuals/ai-photo-*' \
            fresh-rebuild/src/main.js)"
          echo 'Source/snapshot safety: PASS'

      - name: Re-run AI Photo browser QA
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ai-photo-flagship-qa/run-qa.sh
          bash tools/ai-photo-locked-visual/render-qa.sh

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent NexusNova signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent NexusNova keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-permanent.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject OTA reset no-cache version and permanent signer
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          ota=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          text=ota.read_text(encoding='utf-8')
          old=f'const val BUNDLED_WEB_BASE = "{os.environ["OLD_BUNDLED_BASE"]}"'
          new=f'const val BUNDLED_WEB_BASE = "{os.environ["APP_SOURCE"]}"'
          if text.count(old)!=1: raise SystemExit('OTA bundled base marker mismatch')
          ota.write_text(text.replace(old,new,1),encoding='utf-8')
          main=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          text=main.read_text(encoding='utf-8')
          old='settings.cacheMode = WebSettings.LOAD_DEFAULT'
          new='settings.cacheMode = WebSettings.LOAD_NO_CACHE'
          if text.count(old)!=1: raise SystemExit('WebView cache mode marker mismatch')
          main.write_text(text.replace(old,new,1),encoding='utf-8')
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = '+os.environ['VERSION_CODE'],t,count=1)
          t,n2=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "'+os.environ['VERSION_NAME']+'"',t,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Android version fields not found')
          signing='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          marker='    buildTypes {\n'
          if marker not in t: raise SystemExit('buildTypes block not found')
          t=t.replace(marker,signing+marker,1)
          debug='        debug {\n'
          if debug not in t: raise SystemExit('debug block not found')
          t=t.replace(debug,debug+'            signingConfig = signingConfigs.getByName("nexusRelease")\n',1)
          p.write_text(t,encoding='utf-8')
          PY
          grep -Fq "const val BUNDLED_WEB_BASE = \"$APP_SOURCE\"" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'settings.cacheMode = WebSettings.LOAD_NO_CACHE' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          echo 'Runtime stale-overlay/cache bypass injection: PASS'

      - name: Build fast installable signed test APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify canonical assets embedded byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          APK='NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          diff -qr fresh-rebuild NexusNovaAndroid/app/src/main/assets/www
          for rel in \
            src/features/apps/ai-photo-studio-review.js \
            src/features/apps/ai-photo-design-delight-v13.js \
            src/features/apps/ai-photo-contextual-contrast-v1.js \
            src/features/apps/ai-photo-enhance-flagship-v12.js; do
            src="fresh-rebuild/$rel"
            out="/tmp/$(basename "$rel").embedded"
            unzip -p "$APK" "assets/www/$rel" > "$out"
            test -s "$out"
            cmp -s "$src" "$out"
            echo "Embedded byte match: $rel"
          done
          : > /tmp/all-dex-strings.txt
          mapfile -t DEX_FILES < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          test "${#DEX_FILES[@]}" -ge 1
          for dex in "${DEX_FILES[@]}"; do
            unzip -p "$APK" "$dex" | strings >> /tmp/all-dex-strings.txt
          done
          grep -Fq "$APP_SOURCE" /tmp/all-dex-strings.txt
          if grep -Fq "$OLD_BUNDLED_BASE" /tmp/all-dex-strings.txt; then
            echo 'Old OTA bundled base still present in APK multidex strings' >&2
            exit 1
          fi
          echo 'PASS — latest Designer, contrast and Enhance code plus new OTA baseline are physically inside APK.'

      - name: Verify permanent signer package and higher version
        shell: bash
        run: |
          set -euo pipefail
          APK='NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-verify.txt
          SIGNER="$(grep -m1 'certificate SHA-256 digest:' /tmp/apk-verify.txt | sed -E 's/^.*certificate SHA-256 digest: //' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$SIGNER" = "$EXPECTED_SIGNER_SHA256"
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/apk-package.txt
          grep -Fq "name='com.nexusnova.app'" /tmp/apk-package.txt
          grep -Fq "versionCode='$VERSION_CODE'" /tmp/apk-package.txt
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          sha256sum "$RUNNER_TEMP/$APK_NAME" | tee "$RUNNER_TEMP/$APK_NAME.sha256"
          echo "Permanent signer match: PASS — $SIGNER"

      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-AI-Photo-v1.0.17-RUNTIME-FIX-TEST-SIGNED
          path: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
            ${{ runner.temp }}/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
