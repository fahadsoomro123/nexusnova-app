name: AI Photo Locked Visual Approved Release

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-locked-visual-approved-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_SOURCE: 80233fbc1802b80949ee388d72a00cce1358edbf
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public
  PUBLIC_APK_BRANCH: main
  VERSION_CODE: '2026090503'
  VERSION_NAME: '1.0.12-ai-photo-phone-fixes'
  RELEASE_APK: 'NexusNova-AI-PHOTO-PHONE-FIXES-v1.0.12-SIGNED.apk'
  PREVIOUS_APK: 'NexusNova-AI-PHOTO-LOCKED-v1.0.11-SIGNED.apk'

jobs:
  publish_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact internally-approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          fetch-depth: 0

      - name: Freeze source and reverify locked visual contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE"
          files=(
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js
            fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js
            fresh-rebuild/src/features/apps/ai-photo-locked-reference-assets-v1.js
            fresh-rebuild/src/features/apps/ai-photo-puter-generator.js
            fresh-rebuild/src/features/apps/ai-photo-studio-ai.js
            fresh-rebuild/src/features/apps/data/ai-photo-templates.js
          )
          for f in "${files[@]}"; do test -s "$f"; node --check "$f"; done
          test -s fresh-rebuild/assets/visuals/ai-photo-locked-featured.webp
          test -s fresh-rebuild/assets/visuals/ai-photo-locked-recent.webp
          test -s fresh-rebuild/assets/visuals/ai-photo-locked-styles.webp
          grep -Fq 'NexusNova AI Photo Studio' fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js
          grep -Fq 'AI Image Generator' fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js
          grep -Fq 'Creative Styles' fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js
          grep -Fq "['custom','▱','Custom','Custom']" fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js
          grep -Fq 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js
          cp fresh-rebuild/src/features/apps/data/ai-photo-templates.js /tmp/templates.mjs
          node --input-type=module - <<'NODE'
          const m=await import('file:///tmp/templates.mjs');
          if(m.NEXUSNOVA_TEMPLATES.length!==1000) throw new Error('Template count mismatch');
          if(m.NEXUSNOVA_TEMPLATE_CATEGORIES.length!==20) throw new Error('Category count mismatch');
          NODE
          echo 'Exact locked visual source reverified: PASS'

      - name: Build cumulative locked visual OTA
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$OTA_BUNDLED_BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$OTA_BUNDLED_BASE" "$APP_SOURCE" -- fresh-rebuild/ | grep -v '^fresh-rebuild/src/emergency-sos.js$' || true)"
          test -z "$deleted" || { echo 'Unexpected deleted fresh-rebuild files:' >&2; printf '%s\n' "$deleted" >&2; exit 1; }
          rm -rf /tmp/nx-locked-ota
          mkdir -p /tmp/nx-locked-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            [ -f "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-locked-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-locked-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$OTA_BUNDLED_BASE" "$APP_SOURCE" -- fresh-rebuild/)
          test -f /tmp/nx-locked-ota/files/index.html || cp fresh-rebuild/index.html /tmp/nx-locked-ota/files/index.html
          required=(
            index.html
            assets/styles/ai-photo-route-fullscreen.css
            assets/visuals/ai-photo-locked-featured.webp
            assets/visuals/ai-photo-locked-recent.webp
            assets/visuals/ai-photo-locked-styles.webp
            src/features/apps/app-screen.js
            src/features/apps/ai-photo-studio-flagship.js
            src/features/apps/ai-photo-studio-review.js
            src/features/apps/ai-photo-locked-visual-v1.js
            src/features/apps/ai-photo-locked-reference-assets-v1.js
            src/features/apps/ai-photo-phone-feedback-v1.js
            src/features/apps/ai-photo-canva-workspace-v3.js
            src/features/apps/ai-photo-puter-generator.js
            src/features/apps/ai-photo-studio-ai.js
            src/features/apps/data/ai-photo-templates.js
          )
          for f in "${required[@]}"; do test -s "/tmp/nx-locked-ota/files/$f" || { echo "Missing OTA file: $f" >&2; exit 1; }; done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-locked-ota/files')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes()
              rows.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)})
          assert len(rows)<=2000
          assert sum(x['size'] for x in rows)<=60*1024*1024
          m={'schema':2,'base':os.environ['OTA_BUNDLED_BASE'],'version':os.environ['APP_SOURCE'],'source':os.environ['APP_SOURCE'],'release':'ai-photo-phone-fixes-v1.0.12','files':rows}
          Path('/tmp/nx-locked-ota/manifest.json').write_text(json.dumps(m,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('OTA files',len(rows),'bytes',sum(x['size'] for x in rows))
          PY

      - name: Require OTA credential
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_TOKEN"

      - name: Publish approved OTA
        id: ota_publish
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/nexusnova-locked-ota-public"
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_REPO.git" "$PUB"
          cd "$PUB"
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-locked-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo phone fixes OTA $APP_SOURCE"
          PUBLISH_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "publish_sha=$PUBLISH_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify public OTA byte-for-byte
        env:
          PUBLISH_SHA: ${{ steps.ota_publish.outputs.publish_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_REPO/$PUBLISH_SHA/ota"
          curl -fsSL "$BASE_URL/manifest.json" -o /tmp/public-manifest.json
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          from pathlib import Path
          local=json.loads(Path('/tmp/nx-locked-ota/manifest.json').read_text())
          public=json.loads(Path('/tmp/public-manifest.json').read_text())
          assert public==local
          base=f"https://raw.githubusercontent.com/{os.environ['PUBLIC_REPO']}/{os.environ['PUBLISH_SHA']}/ota/files/"
          for item in public['files']:
              path=item['path']
              url=base+'/'.join(urllib.parse.quote(x,safe='') for x in path.split('/'))
              data=urllib.request.urlopen(url,timeout=25).read()
              assert len(data)==item['size'],path
              assert hashlib.sha256(data).hexdigest()==item['sha256'],path
          print('Public OTA byte-for-byte PASS',len(public['files']))
          PY

  signed_apk:
    needs: publish_ota
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact internally-approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE }}
          fetch-depth: 0

      - name: Freeze exact source and verify web to Android mirrors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE"
          cmp fresh-rebuild/src/features/apps/ai-photo-locked-visual-v1.js NexusNovaAndroid/app/src/main/assets/www/src/features/apps/ai-photo-locked-visual-v1.js
          cmp fresh-rebuild/src/features/apps/ai-photo-locked-reference-assets-v1.js NexusNovaAndroid/app/src/main/assets/www/src/features/apps/ai-photo-locked-reference-assets-v1.js
          cmp fresh-rebuild/src/features/apps/ai-photo-studio-review.js NexusNovaAndroid/app/src/main/assets/www/src/features/apps/ai-photo-studio-review.js
          cmp fresh-rebuild/assets/visuals/ai-photo-locked-featured.webp NexusNovaAndroid/app/src/main/assets/www/assets/visuals/ai-photo-locked-featured.webp
          cmp fresh-rebuild/assets/visuals/ai-photo-locked-recent.webp NexusNovaAndroid/app/src/main/assets/www/assets/visuals/ai-photo-locked-recent.webp
          cmp fresh-rebuild/assets/visuals/ai-photo-locked-styles.webp NexusNovaAndroid/app/src/main/assets/www/assets/visuals/ai-photo-locked-styles.webp
          echo 'Exact locked visual Android asset mirrors: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-ai-photo-phone-fixes-v1.0.12.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject release version and signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = '+os.environ['VERSION_CODE'],t,count=1)
          t,n2=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "'+os.environ['VERSION_NAME']+'"',t,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Android version fields not found')
          signing='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          marker='    buildTypes {\n'
          if marker not in t: raise SystemExit('buildTypes block not found')
          t=t.replace(marker,signing+marker,1)
          release='        release {\n'
          if release not in t: raise SystemExit('release block not found')
          t=t.replace(release,release+'            signingConfig = signingConfigs.getByName("nexusRelease")\n',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify permanent signature identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/new-signature.txt
          grep -Eq 'Verified using v(2|3) scheme .*: true' /tmp/new-signature.txt
          NEW_CERT="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V[0-9.]* Signer: certificate SHA-256 digest: //p' /tmp/new-signature.txt | head -1)"
          test -n "$NEW_CERT"
          curl -fsSL "https://raw.githubusercontent.com/$PUBLIC_REPO/$PUBLIC_APK_BRANCH/downloads/$PREVIOUS_APK" -o /tmp/previous.apk
          "$APKSIGNER" verify --print-certs /tmp/previous.apk | tee /tmp/old-signature.txt
          OLD_CERT="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V[0-9.]* Signer: certificate SHA-256 digest: //p' /tmp/old-signature.txt | head -1)"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "SIGNER_CERT_SHA256=$NEW_CERT" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee /tmp/release.sha256
          stat -c '%s' "$APK" > /tmp/release.size
          echo 'Permanent signer continuity: PASS'

      - name: Require public APK credential
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_TOKEN"

      - name: Publish signed APK
        id: apk_publish
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/nexusnova-ai-photo-locked-public"
          git clone --depth 1 --branch "$PUBLIC_APK_BRANCH" "https://github.com/$PUBLIC_REPO.git" "$PUB"
          cd "$PUB"
          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p downloads
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" "downloads/$RELEASE_APK"
          sha256sum "downloads/$RELEASE_APK" > "downloads/$RELEASE_APK.sha256"
          printf 'NexusNova AI Photo Studio phone-fixes signed APK\nSource: %s\nVersion: %s (%s)\nPermanent signature: PASS\nSigner SHA-256: %s\nStatus: READY FOR FAHAD PHONE FINAL ACCEPTANCE\n' "$APP_SOURCE" "$VERSION_NAME" "$VERSION_CODE" "$SIGNER_CERT_SHA256" > downloads/NexusNova-AI-PHOTO-LOCKED-STATUS.txt
          git add -f "downloads/$RELEASE_APK" "downloads/$RELEASE_APK.sha256" downloads/NexusNova-AI-PHOTO-LOCKED-STATUS.txt
          git commit -m "Publish AI Photo phone fixes signed APK $APP_SOURCE"
          PUBLISH_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_APK_BRANCH"
          echo "publish_sha=$PUBLISH_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous public APK byte-for-byte
        env:
          PUBLISH_SHA: ${{ steps.apk_publish.outputs.publish_sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/$PUBLIC_REPO/$PUBLISH_SHA/downloads/$RELEASE_APK"
          curl -fsSL "$URL" -o /tmp/public.apk
          test "$(stat -c '%s' /tmp/public.apk)" = "$(cat /tmp/release.size)"
          LOCAL_SHA="$(awk '{print $1}' /tmp/release.sha256)"
          PUBLIC_SHA256="$(sha256sum /tmp/public.apk | awk '{print $1}')"
          test "$LOCAL_SHA" = "$PUBLIC_SHA256"
          echo "PUBLIC_APK_SHA256=$PUBLIC_SHA256" >> "$GITHUB_ENV"
          echo 'Anonymous public APK byte-for-byte: PASS'

      - name: Release summary
        shell: bash
        run: |
          echo "Source=$APP_SOURCE"
          echo "Version=$VERSION_NAME"
          echo "VersionCode=$VERSION_CODE"
          echo "APK=$RELEASE_APK"
          echo "SHA256=$PUBLIC_APK_SHA256"
          echo "Signer=$SIGNER_CERT_SHA256"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}" || true
