name: AI Photo Numbered OTA Proof Release

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-ota-proof-dot-release.yml'

permissions:
  contents: read

env:
  VERIFIED_SOURCE: a719c9aaca3836852be129084e04cf66170643b4
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  OTA_PROOF_NUMBER: '1'
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish_numbered_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact OTA trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock trigger to exact clean bundled source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_SOURCE"
          changed="$(git diff --name-only "$VERIFIED_SOURCE" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/ai-photo-ota-proof-dot-release.yml'
          test "$(git rev-parse "$VERIFIED_SOURCE:fresh-rebuild")" = "$(git rev-parse "$GITHUB_SHA:fresh-rebuild")"
          ! grep -Fq 'nx-ai-photo-ota-proof-badge' fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          echo 'Bundled/source web has NO OTA proof badge: PASS'

      - name: Full browser regression for clean OTA web source
        shell: bash
        run: bash tools/ai-photo-flagship-qa/run-qa.sh

      - name: Build full snapshot and inject OTA-only number badge
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$OTA_BUNDLED_BASE^{commit}"
          rm -rf /tmp/nexusnova-numbered-ota
          mkdir -p /tmp/nexusnova-numbered-ota/files
          export SOURCE_TREE="$(git rev-parse "$VERIFIED_SOURCE:fresh-rebuild")"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          source=Path('fresh-rebuild')
          dest=Path('/tmp/nexusnova-numbered-ota/files')
          for p in sorted(x for x in source.rglob('*') if x.is_file()):
              rel=p.relative_to(source)
              if any(part.startswith('.') for part in rel.parts):
                  continue
              out=dest/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,out)

          review=dest/'src/features/apps/ai-photo-studio-review.js'
          text=review.read_text(encoding='utf-8')
          marker="const root=renderFlagshipAiPhotoStudio();"
          if text.count(marker) != 1:
              raise SystemExit('Could not locate unique AI Photo render root for OTA badge injection')
          number=os.environ['OTA_PROOF_NUMBER']
          injection=f'''const root=renderFlagshipAiPhotoStudio();\n  const otaProofBadge=document.createElement('span');\n  otaProofBadge.id='nx-ai-photo-ota-proof-badge';\n  otaProofBadge.textContent='{number}';\n  otaProofBadge.setAttribute('aria-label','OTA {number} active');\n  Object.assign(otaProofBadge.style,{{position:'fixed',top:'8px',right:'8px',minWidth:'20px',height:'20px',padding:'0 5px',display:'grid',placeItems:'center',borderRadius:'10px',background:'#22c55e',color:'#06130a',font:'800 12px/1 system-ui,sans-serif',border:'2px solid rgba(255,255,255,.95)',boxShadow:'0 0 0 2px rgba(34,197,94,.28),0 0 12px rgba(34,197,94,.85)',zIndex:'2147483647',pointerEvents:'none'}});\n  root.append(otaProofBadge);'''
          review.write_text(text.replace(marker,injection,1),encoding='utf-8')

          files=[]
          total=0
          for p in sorted(x for x in dest.rglob('*') if x.is_file()):
              rel=p.relative_to(dest)
              data=p.read_bytes()
              files.append({'path':rel.as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
              total += len(data)

          if not files or not any(x['path']=='index.html' for x in files):
              raise SystemExit('OTA entry point missing')
          if len(files) > 2000 or total > 60*1024*1024:
              raise SystemExit('OTA package exceeds safety limits')
          required={
              'index.html','sw.js','src/main.js',
              'src/features/apps/ai-photo-studio-review.js',
              'src/features/apps/ai-photo-design-flagship-v22.js',
              'src/features/apps/ai-photo-batch-v23.js',
              'src/features/apps/ai-photo-projects-export-v24.js'
          }
          paths={x['path'] for x in files}
          missing=required-paths
          if missing:
              raise SystemExit('Missing OTA critical files: '+', '.join(sorted(missing)))
          manifest={
              'schema':2,
              'base':os.environ['OTA_BUNDLED_BASE'],
              'version':os.environ['GITHUB_SHA'],
              'source':os.environ['VERIFIED_SOURCE'],
              'source_tree':os.environ['SOURCE_TREE'],
              'proof_number':number,
              'files':files,
          }
          Path('/tmp/nexusnova-numbered-ota/manifest.json').write_text(
              json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8'
          )
          print('Numbered OTA files:',len(files))
          print('Numbered OTA bytes:',total)
          print('OTA proof number:',number)
          PY
          node --check /tmp/nexusnova-numbered-ota/files/src/features/apps/ai-photo-studio-review.js
          grep -Fq "id='nx-ai-photo-ota-proof-badge'" /tmp/nexusnova-numbered-ota/files/src/features/apps/ai-photo-studio-review.js
          grep -Fq "textContent='${OTA_PROOF_NUMBER}'" /tmp/nexusnova-numbered-ota/files/src/features/apps/ai-photo-studio-review.js

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish numbered snapshot to public OTA channel
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nexusnova-numbered-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nexusnova-numbered-public
          cd /tmp/nexusnova-numbered-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nexusnova-numbered-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo OTA proof ${OTA_PROOF_NUMBER} $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA and numbered proof
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BRANCH_BASE="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_OTA_BRANCH/ota"
          for attempt in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BRANCH_BASE/manifest.json?v=$GITHUB_SHA&n=$attempt" -o /tmp/public-manifest.json; then
              if python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          assert m.get('schema')==2
          assert m.get('base')==os.environ['OTA_BUNDLED_BASE']
          assert m.get('version')==os.environ['GITHUB_SHA']
          assert m.get('source')==os.environ['VERIFIED_SOURCE']
          assert str(m.get('proof_number'))==os.environ['OTA_PROOF_NUMBER']
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 12 ]; then echo 'Public OTA manifest did not converge' >&2; exit 1; fi
            sleep 5
          done
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          exact=f'https://raw.githubusercontent.com/{os.environ["PUBLIC_OTA_REPO"]}/{os.environ["PUBLIC_SHA"]}/ota/files/'
          for item in m['files']:
              url=exact+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=25).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Exact public numbered OTA verified:',len(m['files']),'files')
          PY
          curl -fsSL -H 'Cache-Control: no-cache, no-store' \
            "$BRANCH_BASE/files/src/features/apps/ai-photo-studio-review.js?v=$GITHUB_SHA&n=phone" \
            -o /tmp/review.js
          grep -Fq "nx-ai-photo-ota-proof-badge" /tmp/review.js
          grep -Fq "textContent='${OTA_PROOF_NUMBER}'" /tmp/review.js
          echo "PUBLIC OTA ${OTA_PROOF_NUMBER} READY — badge exists only in OTA package, not bundled source."
