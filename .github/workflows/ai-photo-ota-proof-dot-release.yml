name: AI Photo Temporary OTA Proof Dot Release

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-ota-proof-dot-release.yml'

permissions:
  contents: read

env:
  VERIFIED_SOURCE: cfd206ed66d8e8a79169e1b85af319d142eb3cc4
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish_proof_dot_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact OTA trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock trigger to exact proof-dot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_SOURCE"
          changed="$(git diff --name-only "$VERIFIED_SOURCE" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/ai-photo-ota-proof-dot-release.yml'
          test "$(git rev-parse "$VERIFIED_SOURCE:fresh-rebuild")" = "$(git rev-parse "$GITHUB_SHA:fresh-rebuild")"
          echo 'Proof-dot OTA trigger is workflow-only over exact source: PASS'

      - name: Verify temporary proof dot contract
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq "nx-ai-photo-ota-proof-dot" fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq "background:'#22c55e'" fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq "root.dataset.aiPhotoFlagship='flagship-repair-v16'" fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          test "$(grep -o 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js | wc -l)" -eq 1
          echo 'Temporary green OTA proof dot contract: PASS'

      - name: Full browser regression for OTA-only web source
        shell: bash
        run: bash tools/ai-photo-flagship-qa/run-qa.sh

      - name: Build complete web snapshot for installed APK OTA base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$OTA_BUNDLED_BASE^{commit}"
          rm -rf /tmp/nexusnova-proof-dot-ota
          mkdir -p /tmp/nexusnova-proof-dot-ota/files
          export SOURCE_TREE="$(git rev-parse "$VERIFIED_SOURCE:fresh-rebuild")"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source=Path('fresh-rebuild')
          dest=Path('/tmp/nexusnova-proof-dot-ota/files')
          files=[]
          total=0
          for p in sorted(x for x in source.rglob('*') if x.is_file()):
              rel=p.relative_to(source)
              if any(part.startswith('.') for part in rel.parts):
                  continue
              data=p.read_bytes()
              out=dest/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              files.append({'path':rel.as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
              total += len(data)
          if not files or not any(x['path']=='index.html' for x in files):
              raise SystemExit('OTA entry point missing')
          if len(files) > 2000 or total > 60*1024*1024:
              raise SystemExit('OTA package exceeds safety limits')
          required={
              'index.html','sw.js','src/main.js',
              'src/features/apps/ai-photo-studio-review.js',
              'src/features/apps/ai-photo-design-flagship-v22.js',
              'src/features/apps/ai-photo-batch-v23.js',
              'src/features/apps/ai-photo-projects-export-v24.js'
          }
          paths={x['path'] for x in files}
          missing=required-paths
          if missing:
              raise SystemExit('Missing OTA critical files: '+', '.join(sorted(missing)))
          manifest={
              'schema':2,
              'base':os.environ['OTA_BUNDLED_BASE'],
              'version':os.environ['GITHUB_SHA'],
              'source':os.environ['VERIFIED_SOURCE'],
              'source_tree':os.environ['SOURCE_TREE'],
              'files':files,
          }
          Path('/tmp/nexusnova-proof-dot-ota/manifest.json').write_text(
              json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8'
          )
          print('Proof-dot full snapshot files:',len(files))
          print('Proof-dot full snapshot bytes:',total)
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish proof-dot snapshot to public OTA channel
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nexusnova-proof-dot-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nexusnova-proof-dot-public
          cd /tmp/nexusnova-proof-dot-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nexusnova-proof-dot-ota/. ota/
          git add -A ota
          git commit -m "Publish AI Photo temporary OTA proof dot $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA and visible proof marker
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BRANCH_BASE="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_OTA_BRANCH/ota"
          for attempt in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BRANCH_BASE/manifest.json?v=$GITHUB_SHA&n=$attempt" -o /tmp/public-manifest.json; then
              if python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          assert m.get('schema')==2
          assert m.get('base')==os.environ['OTA_BUNDLED_BASE']
          assert m.get('version')==os.environ['GITHUB_SHA']
          assert m.get('source')==os.environ['VERIFIED_SOURCE']
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 12 ]; then echo 'Public OTA manifest did not converge' >&2; exit 1; fi
            sleep 5
          done
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          exact=f'https://raw.githubusercontent.com/{os.environ["PUBLIC_OTA_REPO"]}/{os.environ["PUBLIC_SHA"]}/ota/files/'
          for item in m['files']:
              url=exact+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=25).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Exact public proof-dot OTA verified:',len(m['files']),'files')
          PY
          curl -fsSL -H 'Cache-Control: no-cache, no-store' \
            "$BRANCH_BASE/files/src/features/apps/ai-photo-studio-review.js?v=$GITHUB_SHA&n=phone" \
            -o /tmp/review.js
          grep -Fq 'nx-ai-photo-ota-proof-dot' /tmp/review.js
          grep -Fq "background:'#22c55e'" /tmp/review.js
          echo 'PUBLIC OTA PROOF DOT READY — open AI Photo and look at the top-right green dot.'
