name: AI Photo Premium Studio Final OTA

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-premium-home-final-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  VERIFIED_PREOTA_SOURCE: 0f7099c26c068efbbbe93af037f77f026d430b36
  VISUAL_BASELINE: 0c7d9514b30add3d4929172cc1427472382b2dd8
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze verified pre-OTA source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_PREOTA_SOURCE"
          changed="$(git diff --name-only "$VERIFIED_PREOTA_SOURCE" "$GITHUB_SHA")"
          test "$changed" = '.github/workflows/ai-photo-premium-home-final-ota.yml'
          echo 'Verified pre-OTA source parent frozen: PASS'

      - name: Reverify premium upgrade and protected fullscreen
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            fresh-rebuild/src/features/apps/ai-photo-studio-home.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/ai-photo-puter-generator.js \
            fresh-rebuild/src/features/apps/ai-photo-canva-workspace-v3.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-ai.js \
            fresh-rebuild/src/features/apps/data/ai-photo-templates.js; do
            test -s "$file"
            node --check "$file"
          done
          grep -Fq 'installAiPhotoStudioHome' fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq 'Generate with AI' fresh-rebuild/src/features/apps/ai-photo-studio-home.js
          grep -Fq 'Edit a Photo' fresh-rebuild/src/features/apps/ai-photo-studio-home.js
          grep -Fq 'Templates 1000+' fresh-rebuild/src/features/apps/ai-photo-studio-home.js
          grep -Fq 'My Creations' fresh-rebuild/src/features/apps/ai-photo-studio-home.js
          grep -Fq 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js
          grep -Fq 'Use in Design' fresh-rebuild/src/features/apps/ai-photo-puter-generator.js
          grep -Fq 'Edit Photo' fresh-rebuild/src/features/apps/ai-photo-puter-generator.js
          cp fresh-rebuild/src/features/apps/data/ai-photo-templates.js /tmp/templates.mjs
          node --input-type=module - <<'NODE'
          const m=await import('file:///tmp/templates.mjs');
          if(m.NEXUSNOVA_TEMPLATES.length!==1000)throw new Error('Template count mismatch');
          if(m.NEXUSNOVA_TEMPLATE_CATEGORIES.length!==20)throw new Error('Category count mismatch');
          if(!m.searchTemplates({query:'coffee logo',limit:20}).items.length)throw new Error('Multi-word template search failed');
          NODE
          for path in \
            fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css \
            fresh-rebuild/src/features/apps/app-screen.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/ai-photo-focus-interaction.js \
            fresh-rebuild/src/features/apps/ai-photo-canva-workspace-v3.js \
            fresh-rebuild/src/features/apps/ai-photo-puter-generator.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-ai.js \
            fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js \
            fresh-rebuild/src/features/apps/premium-prayer-safe.js \
            fresh-rebuild/src/features/apps/pakistan-suite.js \
            fresh-rebuild/src/features/apps/news-suite.js \
            fresh-rebuild/src/features/apps/articles-suite.js \
            fresh-rebuild/src/features/apps/live-feed-premium-skin.js \
            fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js \
            fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css; do
            test "$(git rev-parse "$VISUAL_BASELINE:$path")" = "$(git hash-object "$path")" || { echo "Protected file changed after approved baseline: $path" >&2; exit 1; }
          done
          CSS=fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css
          grep -Fq 'height: 100dvh' "$CSS"
          grep -Fq '.nx-ai-photo-route-back' "$CSS"
          grep -Fq 'body.nx-ai-photo-route-active .nx-dock' "$CSS"
          grep -Fq '#nxEmergencySosButton' "$CSS"
          grep -Fq 'overflow: hidden !important' "$CSS"
          echo 'Premium source + protected fullscreen: PASS'

      - name: Build cumulative OTA from bundled base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ | grep -v '^fresh-rebuild/src/emergency-sos.js$' || true)"
          test -z "$deleted" || { echo 'Unexpected deleted fresh-rebuild files:' >&2; printf '%s\n' "$deleted" >&2; exit 1; }
          rm -rf /tmp/nx-premium-photo-ota
          mkdir -p /tmp/nx-premium-photo-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            [ -f "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-premium-photo-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-premium-photo-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)
          test -f /tmp/nx-premium-photo-ota/files/index.html || cp fresh-rebuild/index.html /tmp/nx-premium-photo-ota/files/index.html
          required=(
            index.html
            assets/styles/ai-photo-route-fullscreen.css
            assets/styles/nova-hub-compact-icons-v2.css
            src/features/apps/app-screen.js
            src/features/apps/ai-photo-studio-flagship.js
            src/features/apps/ai-photo-studio-review.js
            src/features/apps/ai-photo-studio-home.js
            src/features/apps/ai-photo-live-preview-engine.js
            src/features/apps/ai-photo-focus-interaction.js
            src/features/apps/ai-photo-design-canvas.js
            src/features/apps/ai-photo-design-tools.js
            src/features/apps/ai-photo-project-store.js
            src/features/apps/ai-photo-studio-ai.js
            src/features/apps/ai-photo-canva-workspace-v3.js
            src/features/apps/ai-photo-puter-generator.js
            src/features/apps/data/ai-photo-templates.js
            src/features/apps/premium-studio-suite.js
          )
          for f in "${required[@]}"; do test -s "/tmp/nx-premium-photo-ota/files/$f" || { echo "Missing OTA file: $f" >&2; exit 1; }; done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-premium-photo-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          assert len(files)<=2000
          assert sum(x['size'] for x in files)<=60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_BUNDLED_BASE'],'version':os.environ['GITHUB_SHA'],'source':os.environ['VERIFIED_PREOTA_SOURCE'],'release':'ai-photo-premium-studio','files':files}
          Path('/tmp/nx-premium-photo-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Premium AI Photo OTA files:',len(files),'bytes:',sum(x['size'] for x in files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish approved OTA
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-premium-photo-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-premium-photo-public
          cd /tmp/nx-premium-photo-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-premium-photo-ota/. ota/
          git add -A ota
          git commit -m "Publish premium AI Photo Studio OTA $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_SHA/ota"
          curl -fsSL "$BASE_URL/manifest.json" -o /tmp/public.json
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          from pathlib import Path
          local=json.loads(Path('/tmp/nx-premium-photo-ota/manifest.json').read_text())
          public=json.loads(Path('/tmp/public.json').read_text())
          assert public==local
          assert public['schema']==2
          assert public['base']==os.environ['OTA_BUNDLED_BASE']
          assert public['version']==os.environ['GITHUB_SHA']
          assert public['source']==os.environ['VERIFIED_PREOTA_SOURCE']
          assert public['release']=='ai-photo-premium-studio'
          entries={x['path']:x for x in public['files']}
          required={
            'index.html','assets/styles/ai-photo-route-fullscreen.css','assets/styles/nova-hub-compact-icons-v2.css',
            'src/features/apps/app-screen.js','src/features/apps/ai-photo-studio-flagship.js',
            'src/features/apps/ai-photo-studio-review.js','src/features/apps/ai-photo-studio-home.js',
            'src/features/apps/ai-photo-canva-workspace-v3.js','src/features/apps/ai-photo-puter-generator.js',
            'src/features/apps/ai-photo-studio-ai.js','src/features/apps/data/ai-photo-templates.js'
          }
          assert required<=set(entries)
          base=f"https://raw.githubusercontent.com/{os.environ['PUBLIC_OTA_REPO']}/{os.environ['PUBLIC_SHA']}/ota/files/"
          for path,item in entries.items():
              url=base+'/'.join(urllib.parse.quote(p,safe='') for p in path.split('/'))
              data=urllib.request.urlopen(url,timeout=25).read()
              assert len(data)==item['size'],path
              assert hashlib.sha256(data).hexdigest()==item['sha256'],path
          print('Exact public premium AI Photo OTA verified:',len(entries),'files',os.environ['PUBLIC_SHA'])
          PY
