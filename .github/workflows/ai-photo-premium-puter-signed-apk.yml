name: AI Photo Premium Puter Signed APK

on:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/ai-photo-premium-puter-signed-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFIED_APP_SOURCE: 0f7099c26c068efbbbe93af037f77f026d430b36
  VERSION_CODE: '2026090402'
  VERSION_NAME: '1.0.9-ai-photo-puter'
  REVIEW_APK: 'NexusNova-AI-PHOTO-PUTER-v1.0.9-SIGNED.apk'
  PUBLIC_REPO: 'fahadsoomro123/nexusnova-website'
  PUBLIC_BRANCH: 'main'

jobs:
  signed_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze verified app source
        shell: bash
        run: |
          set -euo pipefail
          allowed='^\.github/workflows/(ai-photo-premium-home-final-ota\.yml|ai-photo-premium-puter-signed-apk\.yml)$'
          unexpected="$(git diff --name-only "$VERIFIED_APP_SOURCE" "$GITHUB_SHA" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected app/source changes after verified source:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          echo 'Verified app source frozen: PASS'

      - name: Verify Photo Studio + Puter + fullscreen contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            fresh-rebuild/src/features/apps/ai-photo-studio-home.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-ai.js \
            fresh-rebuild/src/features/apps/ai-photo-puter-generator.js \
            fresh-rebuild/src/features/apps/ai-photo-canva-workspace-v3.js \
            fresh-rebuild/src/features/apps/data/ai-photo-templates.js; do
            test -s "$file"
            node --check "$file"
          done
          grep -Fq 'installAiPhotoStudioHome' fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          grep -Fq 'Generate with AI' fresh-rebuild/src/features/apps/ai-photo-studio-home.js
          grep -Fq 'puter.ai.txt2img' fresh-rebuild/src/features/apps/ai-photo-studio-ai.js
          grep -Fq 'Use in Design' fresh-rebuild/src/features/apps/ai-photo-puter-generator.js
          grep -Fq 'Edit Photo' fresh-rebuild/src/features/apps/ai-photo-puter-generator.js
          cp fresh-rebuild/src/features/apps/data/ai-photo-templates.js /tmp/templates.mjs
          node --input-type=module - <<'NODE'
          const m=await import('file:///tmp/templates.mjs');
          if(m.NEXUSNOVA_TEMPLATES.length!==1000)throw new Error('Template count mismatch');
          if(m.NEXUSNOVA_TEMPLATE_CATEGORIES.length!==20)throw new Error('Category count mismatch');
          NODE
          CSS=fresh-rebuild/assets/styles/ai-photo-route-fullscreen.css
          grep -Fq 'height: 100dvh' "$CSS"
          grep -Fq '.nx-ai-photo-route-back' "$CSS"
          grep -Fq 'body.nx-ai-photo-route-active .nx-dock' "$CSS"
          grep -Fq '#nxEmergencySosButton' "$CSS"
          MAIN='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
          POP='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusPuterPopupManager.kt'
          grep -Fq 'settings.setSupportMultipleWindows(true)' "$MAIN"
          grep -Fq 'settings.javaScriptCanOpenWindowsAutomatically = true' "$MAIN"
          grep -Fq 'NexusPuterPopupManager.open(' "$MAIN"
          grep -Fq 'host == "puter.com" || host.endsWith(".puter.com")' "$POP"
          grep -Fq 'WebSettings.MIXED_CONTENT_NEVER_ALLOW' "$POP"
          echo 'Photo Studio + Puter native auth + fullscreen contracts: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-premium-photo-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject release version and signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = '+os.environ['VERSION_CODE'],t,count=1)
          t,n2=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "'+os.environ['VERSION_NAME']+'"',t,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Android version fields not found')
          signing='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          marker='    buildTypes {\n'
          if marker not in t: raise SystemExit('buildTypes block not found')
          t=t.replace(marker,signing+marker,1)
          release='        release {\n'
          if release not in t: raise SystemExit('release block not found')
          t=t.replace(release,release+'            signingConfig = signingConfigs.getByName("nexusRelease")\n',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

      - name: Verify exact generated web assets and native Puter classes
        shell: bash
        run: |
          set -euo pipefail
          for rel in \
            src/features/apps/ai-photo-studio-home.js \
            src/features/apps/ai-photo-studio-review.js \
            src/features/apps/ai-photo-studio-ai.js \
            src/features/apps/ai-photo-puter-generator.js \
            src/features/apps/ai-photo-canva-workspace-v3.js \
            src/features/apps/data/ai-photo-templates.js \
            assets/styles/ai-photo-route-fullscreen.css \
            assets/styles/nova-hub-compact-icons-v2.css; do
            cmp "fresh-rebuild/$rel" "NexusNovaAndroid/app/src/main/assets/www/$rel"
          done
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusPuterPopupManager.kt
          echo 'Exact Photo Studio assets + native Puter source: PASS'

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/photo-puter-signature.txt
          grep -Eq 'Verified using v(2|3) scheme .*: true' /tmp/photo-puter-signature.txt
          sha256sum "$APK" | tee /tmp/photo-puter.sha256
          stat -c '%s' "$APK" > /tmp/photo-puter.size

      - name: Require public download credential
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_TOKEN"

      - name: Publish signed APK for phone test
        id: publish
        env:
          PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/nexusnova-photo-puter-public"
          git clone --depth 1 --branch "$PUBLIC_BRANCH" "https://github.com/$PUBLIC_REPO.git" "$PUB"
          cd "$PUB"
          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p downloads
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" "downloads/$REVIEW_APK"
          sha256sum "downloads/$REVIEW_APK" > "downloads/$REVIEW_APK.sha256"
          printf 'NexusNova AI Photo Studio Premium + Puter signed phone-test APK\nSource: %s\nVerified app source: %s\nVersion: %s (%s)\nPermanent signature: PASS\nPuter native popup auth: bundled\nStatus: READY FOR FAHAD PHONE TEST — NOT YET PHONE-APPROVED\n' "$GITHUB_SHA" "$VERIFIED_APP_SOURCE" "$VERSION_NAME" "$VERSION_CODE" > downloads/NexusNova-AI-PHOTO-PUTER-STATUS.txt
          git add -f "downloads/$REVIEW_APK" "downloads/$REVIEW_APK.sha256" downloads/NexusNova-AI-PHOTO-PUTER-STATUS.txt
          git commit -m "Publish premium AI Photo Puter signed APK $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous public APK byte-for-byte
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/$PUBLIC_REPO/$PUBLIC_SHA/downloads/$REVIEW_APK"
          curl -fsSL "$URL" -o /tmp/public-photo-puter.apk
          test "$(stat -c '%s' /tmp/public-photo-puter.apk)" = "$(cat /tmp/photo-puter.size)"
          LOCAL_SHA="$(awk '{print $1}' /tmp/photo-puter.sha256)"
          PUBLIC_SHA256="$(sha256sum /tmp/public-photo-puter.apk | awk '{print $1}')"
          test "$LOCAL_SHA" = "$PUBLIC_SHA256"
          echo "PUBLIC_APK_SHA256=$PUBLIC_SHA256" >> "$GITHUB_ENV"
          echo 'Anonymous public signed APK byte-for-byte: PASS'

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}" || true
