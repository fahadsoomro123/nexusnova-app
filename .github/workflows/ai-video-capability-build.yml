name: AI Video Capability Parity Build

on:
  push:
    branches:
      - agent/ai-video-capability-parity-20261004
    paths:
      - 'NexusNovaAndroid/**'
      - 'fresh-rebuild/**'
      - '.github/workflows/ai-video-capability-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-video-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Compile debug Android tests
        run: gradle -p NexusNovaAndroid :app:compileDebugAndroidTestKotlin --stacktrace --no-daemon

      - name: Upload emitted debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-ai-video-studio-debug-apk-${{ github.sha }}
          path: |
            NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            NexusNovaAndroid/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7
