name: AI Video Flagship Self Check

on:
  push:
    branches:
      - agent/ai-video-flagship-fast
    paths:
      - 'fresh-rebuild/src/features/apps/ai-video-studio-flagship.js'
      - 'fresh-rebuild/src/features/apps/premium-studio-suite.js'
      - '.github/workflows/ai-video-flagship-selfcheck.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check flagship editor syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/premium-studio-suite.js
      - name: Verify renderer wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          suite=Path('fresh-rebuild/src/features/apps/premium-studio-suite.js').read_text()
          editor=Path('fresh-rebuild/src/features/apps/ai-video-studio-flagship.js')
          assert editor.exists(), 'flagship renderer missing'
          assert "from './ai-video-studio-flagship.js'" in suite, 'suite not routed to flagship renderer'
          assert "'ai-video-studio': renderAiVideoStudio" in suite, 'renderer map missing'
          print('AI Video flagship self-check: PASS')
          PY
