name: AI Video Flagship Self Check

on:
  push:
    branches: [agent/ai-video-flagship-main]
  pull_request:
    paths:
      - 'fresh-rebuild/src/features/apps/ai-video-studio-flagship.js'
      - 'fresh-rebuild/src/features/apps/premium-studio-suite.js'

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/premium-studio-suite.js
      - name: Runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "ai-video-studio-flagship.js" fresh-rebuild/src/features/apps/premium-studio-suite.js
          ! grep -Fq "root.querySelector('[data-up]').addEventListener" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          ! grep -Fq "root.querySelector('[data-down]').addEventListener" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "sourceDuration=clip.out" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "sourceKey:id" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "sources:new Map()" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "nx-video-toolbar{min-height:0;display:flex" fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          echo "AI Video flagship contract: PASS"
