name: NexusNova Android WebView Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/app/src/main/res/xml/network_security_config.xml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/BrowserActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/PhonebookStore.kt'
      - '.github/scripts/android-webview-security-readiness.py'
      - '.github/workflows/android-webview-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android WebView security contract
        run: python3 .github/scripts/android-webview-security-readiness.py

      - name: Validate network security XML
        run: python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('NexusNovaAndroid/app/src/main/res/xml/network_security_config.xml')
          ET.parse('NexusNovaAndroid/app/src/main/AndroidManifest.xml')
          print('Android XML syntax: PASS')
          PY
