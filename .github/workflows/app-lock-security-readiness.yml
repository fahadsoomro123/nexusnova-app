name: NexusNova App Lock Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'js/nexusnova-security-lock-v1.js'
      - '.github/scripts/app-lock-security-readiness.py'
      - '.github/workflows/app-lock-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-lock-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate App Lock security contract
        run: python3 .github/scripts/app-lock-security-readiness.py

      - name: Check App Lock JavaScript syntax
        run: node --check js/nexusnova-security-lock-v1.js
