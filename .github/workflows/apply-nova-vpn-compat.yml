name: Align Nova VPN with AdMob patch contract
on:
  push:
    branches: [nexusnova-fresh-rebuild-20260820]
    paths:
      - '.nova-vpn-compat/**'
      - '.github/workflows/apply-nova-vpn-compat.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python .nova-vpn-compat/reorder.py
          git diff --check
          python NexusNovaAndroid/patch_admob.py
          git checkout -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'ACTION_SHOW_REWARDED_AD -> adManager.showRewarded(' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          git checkout -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          python .nova-vpn-compat/reorder.py
      - run: |
          set -euo pipefail
          git config user.name 'NexusNova VPN Source Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          git commit -m 'vpn: preserve AdMob patch compatibility'
          git pull --rebase origin nexusnova-fresh-rebuild-20260820
          git push origin HEAD:nexusnova-fresh-rebuild-20260820
