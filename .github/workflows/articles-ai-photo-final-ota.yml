name: Articles Final Fix + AI Photo Stable Restore OTA

on:
  push:
    branches: [batch17-20-preota-review]
    paths:
      - '.github/workflows/articles-ai-photo-final-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  STABLE_AI_PHOTO: 7f70ec07fbac48e9fd384b0b5dfd336e72432760
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  restore_fix_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: batch17-20-preota-review

      - name: Restore exact AI Photo stable bytes and fix Articles root causes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$STABLE_AI_PHOTO^{commit}"

          # AI Photo must remain the exact last stable review implementation.
          for path in \
            fresh-rebuild/src/features/apps/ai-photo-studio.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/premium-studio-core.js \
            fresh-rebuild/src/features/apps/premium-studio-suite.js; do
            git checkout "$STABLE_AI_PHOTO" -- "$path"
            test "$(git rev-parse "$STABLE_AI_PHOTO:$path")" = "$(git rev-parse ":$path")"
          done

          python3 - <<'PY'
          from pathlib import Path

          skin=Path('fresh-rebuild/src/features/apps/live-feed-premium-skin.js')
          text=skin.read_text(encoding='utf-8')
          old="  articles: () => wrap(articleRenderers.articles, 'nx-feed-desk--articles', 'NEXUSNOVA EDITORIAL DESK', 'DIRECT WEBSITE FEED • SAFE SITE LINKS', 'SITE SYNC')"
          new="  articles: () => articleRenderers.articles()"
          if new not in text:
              if old not in text:
                  raise SystemExit('Articles wrapper target not found')
              text=text.replace(old,new,1)
          skin.write_text(text,encoding='utf-8')

          css=Path('fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css')
          c=css.read_text(encoding='utf-8')
          marker='/* ARTICLES FINAL PHONE FIX v2 */'
          if marker not in c:
              c += '''\n\n/* ARTICLES FINAL PHONE FIX v2 */\n.nx-b4-articles .nxa3-card[hidden]{display:none!important}\n/* Defensive flattening for any stale cached premium-feed wrapper. */\n.nx-b4-articles-screen .nx-feed-desk--articles{width:100%!important;height:100dvh!important;min-height:0!important;max-height:100dvh!important;display:block!important;padding:0!important;overflow:hidden!important;background:transparent!important;box-shadow:none!important}\n.nx-b4-articles-screen .nx-feed-desk--articles>.nx-feed-cockpit{display:none!important}\n.nx-b4-articles-screen .nx-feed-desk--articles>.nx-feed-body{width:100%!important;height:100%!important;min-height:0!important;max-height:100%!important;padding:0!important;overflow:hidden!important}\n'''
          css.write_text(c,encoding='utf-8')
          PY

          node --check fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/ai-photo-studio-review.js
          node --check fresh-rebuild/src/features/apps/live-feed-premium-skin.js
          node --check fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js
          grep -Fq "articles: () => articleRenderers.articles()" fresh-rebuild/src/features/apps/live-feed-premium-skin.js
          grep -Fq '.nxa3-card[hidden]{display:none!important}' fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css

          # Core Articles feed/data engine stays byte-identical.
          test "$(git rev-parse HEAD:fresh-rebuild/src/features/apps/articles-suite.js)" = "$(git rev-parse 1ac2203239130937df09c6be6d4bbb0f87725c5f:fresh-rebuild/src/features/apps/articles-suite.js)"

          # Completed apps remain byte-identical.
          for path in \
            fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js \
            fresh-rebuild/src/features/apps/premium-prayer-safe.js \
            fresh-rebuild/src/features/apps/pakistan-suite.js \
            fresh-rebuild/src/features/apps/news-suite.js \
            fresh-rebuild/src/features/apps/batch3-tools-13-16-fullscreen.js \
            fresh-rebuild/assets/styles/batch3-tools-13-16-fullscreen.css; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse 1ac2203239130937df09c6be6d4bbb0f87725c5f:$path)"
          done

      - name: Commit permanent scoped restore/fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            fresh-rebuild/src/features/apps/ai-photo-studio.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/premium-studio-core.js \
            fresh-rebuild/src/features/apps/premium-studio-suite.js \
            fresh-rebuild/src/features/apps/live-feed-premium-skin.js \
            fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css
          if ! git diff --cached --quiet; then
            git commit -m 'Restore stable AI Photo and fix Articles phone layout'
            git push origin HEAD:batch17-20-preota-review
          fi
          echo "PATCHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify final source scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PATCHED_SHA"
          for path in \
            fresh-rebuild/src/features/apps/ai-photo-studio.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-flagship.js \
            fresh-rebuild/src/features/apps/ai-photo-studio-review.js \
            fresh-rebuild/src/features/apps/premium-studio-core.js \
            fresh-rebuild/src/features/apps/premium-studio-suite.js; do
            test "$(git rev-parse "$STABLE_AI_PHOTO:$path")" = "$(git rev-parse "$PATCHED_SHA:$path")"
          done
          git diff --unified=0 "${PATCHED_SHA}^" "$PATCHED_SHA" -- fresh-rebuild/src/features/apps/live-feed-premium-skin.js | tee /tmp/skin.diff
          grep -Fq "articles: () => articleRenderers.articles()" /tmp/skin.diff
          ! grep -Eq '^[+-].*(pakistan:|news:)' /tmp/skin.diff

      - name: Build cumulative verified OTA
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          rm -rf /tmp/nx-final-ota
          mkdir -p /tmp/nx-final-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-final-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-final-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$PATCHED_SHA" -- fresh-rebuild/)

          # Force exact stable AI Photo files into the OTA even if already identical to the base/diff.
          for rel in \
            src/features/apps/ai-photo-studio.js \
            src/features/apps/ai-photo-studio-flagship.js \
            src/features/apps/ai-photo-studio-review.js \
            src/features/apps/premium-studio-core.js \
            src/features/apps/premium-studio-suite.js; do
            mkdir -p "/tmp/nx-final-ota/files/$(dirname "$rel")"
            cp "fresh-rebuild/$rel" "/tmp/nx-final-ota/files/$rel"
          done

          for required in \
            index.html \
            assets/styles/batch4-tools-17-20-fullscreen.css \
            src/features/apps/batch4-tools-17-20-fullscreen.js \
            src/features/apps/live-feed-premium-skin.js \
            src/features/apps/articles-suite.js \
            src/features/apps/ai-photo-studio.js \
            src/features/apps/ai-photo-studio-flagship.js \
            src/features/apps/ai-photo-studio-review.js \
            src/features/apps/premium-studio-core.js \
            src/features/apps/premium-studio-suite.js \
            src/features/apps/premium-qibla-safe-v2.js \
            src/features/apps/premium-prayer-safe.js \
            src/features/apps/pakistan-suite.js \
            src/features/apps/news-suite.js; do
            test -s "/tmp/nx-final-ota/files/$required" || { echo "Missing OTA file: $required" >&2; exit 1; }
          done

          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-final-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_BUNDLED_BASE'],'version':os.environ['PATCHED_SHA'],'files':files}
          Path('/tmp/nx-final-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Final OTA files:',len(files),'bytes:',sum(x['size'] for x in files))
          PY

      - name: Require OTA credential
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish final approved OTA
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-final-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-final-public
          cd /tmp/nx-final-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-final-ota/. ota/
          git add -A ota
          git commit -m "Publish Articles fix + AI Photo stable restore OTA $PATCHED_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_SHA/ota"
          curl --fail --silent --show-error --location "$BASE_URL/manifest.json" -o /tmp/public-final.json
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          local=json.loads(Path('/tmp/nx-final-ota/manifest.json').read_text())
          public=json.loads(Path('/tmp/public-final.json').read_text())
          assert public == local
          assert public['version'] == os.environ['PATCHED_SHA']
          entries={x['path']:x for x in public['files']}
          required={
            'assets/styles/batch4-tools-17-20-fullscreen.css',
            'src/features/apps/live-feed-premium-skin.js',
            'src/features/apps/ai-photo-studio.js',
            'src/features/apps/ai-photo-studio-flagship.js',
            'src/features/apps/ai-photo-studio-review.js'
          }
          assert required <= set(entries)
          base=f"https://raw.githubusercontent.com/{os.environ['PUBLIC_OTA_REPO']}/{os.environ['PUBLIC_SHA']}/ota/files/"
          for path in sorted(required):
              data=urllib.request.urlopen(base+path,timeout=20).read()
              assert hashlib.sha256(data).hexdigest()==entries[path]['sha256']
          print('Public final OTA verified:',os.environ['PUBLIC_SHA'])
          PY
