name: NexusNova Batch 17-20 Review OTA

on:
  push:
    branches: [batch17-20-preota-review]
    paths:
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css'
      - 'fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js'
      - '.github/workflows/batch4-tools-17-20-review-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEW_BASE: 1ac2203239130937df09c6be6d4bbb0f87725c5f
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  batch4_review_ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved Batch 17-20 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved scope and protected apps
        shell: bash
        run: |
          set -euo pipefail
          JS=fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js
          CSS=fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css
          INDEX=fresh-rebuild/index.html
          node --check "$JS"
          test -s "$CSS"
          test -s "$INDEX"
          grep -Fq './assets/styles/batch4-tools-17-20-fullscreen.css?review=batch4-17-20-v1' "$INDEX"
          grep -Fq './src/features/apps/batch4-tools-17-20-fullscreen.js?review=batch4-17-20-v1' "$INDEX"
          grep -Fq 'height:100dvh!important' "$CSS"
          grep -Fq 'overflow:hidden!important' "$CSS"
          grep -Fq 'html.nx-b4-active .nx-dock' "$CSS"
          grep -Fq 'loadDriveTrackState' "$JS"
          ! grep -Fq 'watchPosition(' "$JS"
          ! grep -Fq 'getCurrentPosition(' "$JS"

          for path in \
            fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js \
            fresh-rebuild/src/features/apps/premium-prayer-safe.js \
            fresh-rebuild/src/features/apps/pakistan-suite.js \
            fresh-rebuild/src/features/apps/news-suite.js \
            fresh-rebuild/assets/styles/batch3-tools-13-16-fullscreen.css \
            fresh-rebuild/src/features/apps/batch3-tools-13-16-fullscreen.js \
            fresh-rebuild/src/features/apps/articles-suite.js \
            fresh-rebuild/src/features/apps/location-suite.js \
            fresh-rebuild/src/features/apps/premium-drive-native-v2.js \
            fresh-rebuild/src/core/drive-track-persistence.js; do
            test "$(git rev-parse "$REVIEW_BASE:$path")" = "$(git rev-parse "HEAD:$path")" || { echo "Protected/core engine changed: $path" >&2; exit 1; }
          done

          allowed='^(fresh-rebuild/index.html|fresh-rebuild/assets/styles/batch4-tools-17-20-fullscreen.css|fresh-rebuild/src/features/apps/batch4-tools-17-20-fullscreen.js|.github/workflows/batch4-17-20-preota-ci.yml|.github/workflows/batch4-tools-17-20-review-ota.yml)$'
          unexpected="$(git diff --name-only "$REVIEW_BASE" HEAD | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo 'Unexpected Batch 17-20 review changes:' >&2; printf '%s\n' "$unexpected" >&2; exit 1; }

      - name: Build cumulative differential OTA
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"

          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ || true)"
          unexpected_deleted="$(printf '%s\n' "$deleted" | sed '/^$/d' | grep -Ev '^fresh-rebuild/src/emergency-sos\.js$' || true)"
          test -z "$unexpected_deleted" || { echo 'Unexpected deleted runtime files:' >&2; printf '%s\n' "$unexpected_deleted" >&2; exit 1; }

          rm -rf /tmp/nx-b4-ota
          mkdir -p /tmp/nx-b4-ota/files
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-b4-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-b4-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)

          for required in \
            index.html \
            assets/styles/batch4-tools-17-20-fullscreen.css \
            src/features/apps/batch4-tools-17-20-fullscreen.js \
            src/features/apps/articles-suite.js \
            src/features/apps/premium-prayer-safe.js \
            src/features/apps/premium-qibla-safe-v2.js \
            src/features/apps/pakistan-suite.js \
            src/features/apps/news-suite.js; do
            test -s "/tmp/nx-b4-ota/files/$required" || { echo "Missing cumulative OTA file: $required" >&2; exit 1; }
          done

          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-b4-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          paths={x['path'] for x in files}
          required={
              'index.html',
              'assets/styles/batch4-tools-17-20-fullscreen.css',
              'src/features/apps/batch4-tools-17-20-fullscreen.js',
              'src/features/apps/articles-suite.js',
              'src/features/apps/premium-prayer-safe.js',
              'src/features/apps/premium-qibla-safe-v2.js',
              'src/features/apps/pakistan-suite.js',
              'src/features/apps/news-suite.js'
          }
          assert required <= paths,(required-paths)
          assert 'src/emergency-sos.js' not in paths
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_DIFF_BASE'],'version':os.environ['GITHUB_SHA'],'files':files}
          Path('/tmp/nx-b4-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Batch 17-20 OTA files:',len(files),'bytes:',sum(x['size'] for x in files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish approved Batch 17-20 OTA
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-b4-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-b4-public
          cd /tmp/nx-b4-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-b4-ota/. ota/
          git add -A ota
          git commit -m "Publish Batch 17-20 review OTA $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_SHA/ota"
          curl --fail --silent --show-error --location "$BASE_URL/manifest.json" -o /tmp/public-manifest.json
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          local=json.loads(Path('/tmp/nx-b4-ota/manifest.json').read_text())
          public=json.loads(Path('/tmp/public-manifest.json').read_text())
          assert public == local
          assert public['version'] == os.environ['GITHUB_SHA']
          required={
              'index.html',
              'assets/styles/batch4-tools-17-20-fullscreen.css',
              'src/features/apps/batch4-tools-17-20-fullscreen.js',
              'src/features/apps/articles-suite.js'
          }
          entries={x['path']:x for x in public['files']}
          assert required <= set(entries)
          base=f"https://raw.githubusercontent.com/{os.environ['PUBLIC_OTA_REPO']}/{os.environ['PUBLIC_SHA']}/ota/files/"
          for path in sorted(required):
              data=urllib.request.urlopen(base+path,timeout=20).read()
              assert hashlib.sha256(data).hexdigest() == entries[path]['sha256']
          print('Public Batch 17-20 OTA verified:',os.environ['PUBLIC_SHA'])
          PY
