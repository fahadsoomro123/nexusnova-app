name: Build bf6961 Production Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-bf6961:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      SOURCE_SHA: bf6961dd4e9970b4203741780b0435877be5e5f8
      RELEASE_VERSION_CODE: 27000044
      RELEASE_VERSION_NAME: 1.0.44-video-diagnostic-bf6961
    steps:
      - name: Checkout exact bf6961 source
        uses: actions/checkout@v4
        with:
          ref: bf6961dd4e9970b4203741780b0435877be5e5f8
          path: build-src
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build-src rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA"

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode production release keystore
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject release signing and safe upgrade version
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 27000044', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.44-video-diagnostic-bf6961"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Version injection failed")
          if 'signingConfigs {' not in s:
              signing = '''    signingConfigs {
          create("release") {
              storeFile = file("nexusnova-release.jks")
              storePassword = System.getenv("KEYSTORE_PASSWORD")
              keyAlias = System.getenv("KEY_ALIAS")
              keyPassword = System.getenv("KEY_PASSWORD")
          }
      }

  '''
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build exact bf6961 signed release
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        env:
          GITHUB_SHA: bf6961dd4e9970b4203741780b0435877be5e5f8
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK identity and source
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -Fq '30:05:2F:AF:26:F1:12:D8:8D:48:06:1B:88:E6:A6:98:37:1E:F0:CD:C4:20:31:22:A9:35:05:29:40:5A:71:6C' /tmp/apksigner.txt
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='27000044'"
          echo "$badging" | grep -q "versionName='1.0.44-video-diagnostic-bf6961'"
          unzip -l "$apk" | grep -Fq 'assets/www/assets/js/nn-ota-updater.js'
          mkdir -p signed-output
          cp "$apk" signed-output/NexusNova-bf6961-PRODUCTION-SIGNED.apk
          sha256sum signed-output/NexusNova-bf6961-PRODUCTION-SIGNED.apk > signed-output/NexusNova-bf6961-PRODUCTION-SIGNED.apk.sha256
          printf '%s\n' "$SOURCE_SHA" > signed-output/SOURCE-SHA.txt

      - name: Upload production signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-bf6961-PRODUCTION-SIGNED
          path: build-src/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 7
