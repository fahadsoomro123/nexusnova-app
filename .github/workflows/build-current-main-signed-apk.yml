name: Build Verified Current Main Signed APK

on:
  push:
    branches: [main, travel-fare-lens-final]
    paths:
      - '.github/workflows/build-current-main-signed-apk.yml'
      - 'release-trigger/signed-public-apk.txt'
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout exact current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build-src
          fetch-depth: 1

      - name: Lock exact bundled web baseline
        shell: bash
        run: |
          set -euo pipefail
          export PUBLIC_SHA="$(git -C build-src rev-parse HEAD)"
          test "${#PUBLIC_SHA}" = 40
          echo "PUBLIC_SHA=$PUBLIC_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          s=p.read_text(encoding='utf-8')
          sha=os.environ['PUBLIC_SHA']
          s,n=re.subn(r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"',f'const val BUNDLED_WEB_BASE = "{sha}"',s,count=1)
          if n != 1:
              raise SystemExit('Could not inject exact bundled web baseline')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify branch-specific Travel payload
        shell: bash
        run: |
          set -euo pipefail
          WEB='build-src/fresh-rebuild'
          test -s "$WEB/index.html"
          node --check "$WEB/src/main.js"
          node --check "$WEB/src/core/firebase-backend.js"
          node --check "$WEB/src/core/drive-cloud-store.js"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            test -s "$WEB/assets/icons/nova-hub/travel.webp"
            grep -Eq "id: ['\"]travel['\"]" "$WEB/src/features/hub/app-registry.js"
            grep -Fq "const ICON_ONLY_HUB_APP_IDS = new Set(['travel']);" "$WEB/src/features/hub/hub-screen.js"
            grep -Fq 'if (ICON_ONLY_HUB_APP_IDS.has(appId)) return;' "$WEB/src/features/hub/hub-screen.js"
            ! grep -Fq "./travel-suite.js" "$WEB/src/features/apps/app-screen.js"
            ! grep -Fq "./travel-integrations.js" "$WEB/src/features/apps/app-screen.js"
            ! grep -Fq 'src/features/apps/travel-' "$WEB/index.html"
            if find "$WEB/src/features/apps" -maxdepth 1 -type f -name 'travel-*.js' -print | grep -q .; then
              echo 'ERROR: Travel runtime JS still present on main build'
              exit 1
            fi
            if find "$WEB/assets/travel" -type f -print 2>/dev/null | grep -q .; then
              echo 'ERROR: Travel-only assets still present on main build'
              exit 1
            fi
          else
            grep -Fq 'fare-lens' "$WEB/index.html"
            test -s "$WEB/src/features/apps/travel-phone-layout-v31.js"
            grep -Fq 'nexusnova-travel' "$WEB/src/core/backend-adapter.js"
            ! grep -RIn --exclude-dir=.git --exclude='*.map' -- '#020611' "$WEB" || true
          fi

      - name: Restore proven production auth in build workspace
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Apply production auth only to packaged workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js build-src/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js build-src/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json build-src/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' build-src/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' build-src/fresh-rebuild/src/core/firebase-backend.js
          ! grep -Fq 'public-mirror auth shim' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -Fq 'public-qa-' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -Fq 'nexusnova_public_qa_user_v1' build-src/fresh-rebuild/src/core/auth-service.js

      - name: Install Firestore smoke-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run mining and Firestore security validation
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/mining-architecture-smoke.mjs
          npx --yes firebase-tools@latest emulators:exec --project demo-nexusnova-rules --only firestore "node .github/scripts/firestore-rules-smoke.mjs"
          python3 .github/scripts/android-webview-security-readiness.py
          python3 .github/scripts/firebase-security-readiness.py

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode permanent release keystore
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          chmod 600 app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject Firebase-repair release version and signing
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 26091502',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.39-firebase-repair"',s,count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify APK package, version, signature and Firebase payload
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/nexusnova-apksigner.txt
          badging="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26091502'"
          echo "$badging" | grep -q "versionName='1.0.39-firebase-repair'"

          if [ "$GITHUB_REF_NAME" = "travel-fare-lens-final" ]; then
            unzip -l "$APK" > /tmp/apk-list.txt
            grep -Fq 'assets/www/src/features/apps/travel-phone-layout-v31.js' /tmp/apk-list.txt
            grep -Fq 'assets/www/src/features/apps/travel-phone-interaction-v28.js' /tmp/apk-list.txt
          fi

          mkdir -p /tmp/nx-apk
          unzip -q "$APK" 'assets/www/src/core/auth-service.js' 'assets/www/src/core/firebase-backend.js' 'assets/www/src/core/drive-cloud-store.js' -d /tmp/nx-apk
          grep -Fq 'signInWithEmailAndPassword' /tmp/nx-apk/assets/www/src/core/auth-service.js
          grep -Fq 'waitForFirebaseUser' /tmp/nx-apk/assets/www/src/core/firebase-backend.js
          grep -Fq "doc(firestoreDb, 'users', active.uid)" /tmp/nx-apk/assets/www/src/core/firebase-backend.js
          ! grep -Fq 'public-mirror auth shim' /tmp/nx-apk/assets/www/src/core/auth-service.js
          ! grep -Fq 'public-qa-' /tmp/nx-apk/assets/www/src/core/auth-service.js
          ! grep -Fq 'nexusnova_public_qa_user_v1' /tmp/nx-apk/assets/www/src/core/auth-service.js

          mkdir -p signed-output
          cp "$APK" signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk
          sha256sum signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk | tee signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk.sha256

          if [ "$GITHUB_REF_NAME" = "travel-fare-lens-final" ]; then
            printf '%s\n' "$PUBLIC_SHA" > signed-output/PUBLIC-SOURCE-SHA.txt
            printf '%s\n' 'BUILD_CHANNEL=travel-fare-lens-final' > signed-output/BUILD-CHANNEL.txt
          fi

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED
          path: build-src/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 14
