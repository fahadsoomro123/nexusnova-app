name: Build Verified Current Main Signed APK
on:
  push:
    branches: [main, travel-fare-lens-final]
    paths: ['.github/workflows/build-current-main-signed-apk.yml','release-trigger/signed-public-apk.txt','fresh-rebuild/**','NexusNovaAndroid/**','.github/scripts/mining-architecture-smoke.mjs','.github/scripts/firestore-rules-smoke.mjs','.github/scripts/android-webview-security-readiness.py','.github/scripts/firebase-security-readiness.py']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"; test -n "$KEYSTORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
      - name: Checkout exact current source
        uses: actions/checkout@v4
        with: { ref: ${{ github.sha }}, fetch-depth: 1 }
      - name: Verify real Firebase Auth, Mining, Drive and Travel source
        run: |
          set -euo pipefail
          AUTH=fresh-rebuild/src/core/auth-service.js
          BACKEND=fresh-rebuild/src/core/firebase-backend.js
          TRAVEL=fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'signInWithEmailAndPassword' "$AUTH"
          grep -Fq 'createUserWithEmailAndPassword' "$AUTH"
          grep -Fq 'onAuthStateChanged' "$AUTH"
          grep -Fq 'signOut' "$AUTH"
          grep -Fq "projectId: 'nexusnova-6ade2'" "$AUTH"
          grep -Fq 'waitForFirebaseUser' "$BACKEND"
          grep -Fq "doc(firestoreDb, 'users', active.uid)" "$BACKEND"
          grep -Fq 'nexusnova-6ade2.web.app/api/travel' "$TRAVEL"
          ! grep -Fq 'public-mirror auth shim' "$AUTH"
          ! grep -Fq 'public-qa-' "$AUTH"
          ! grep -Fq 'nexusnova_public_qa_user_v1' "$AUTH"
          ! grep -Fq 'PUBLIC_DISABLED_ERROR' "$BACKEND"
      - name: Run source syntax and security checks
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/core/auth-service.js
          node --check fresh-rebuild/src/core/firebase-backend.js
          node --check fresh-rebuild/src/core/drive-cloud-store.js
          node --check fresh-rebuild/src/nova-vehicle-premium-ui.js
          node --check fresh-rebuild/src/features/apps/travel-fare-lens.js
          node --check fresh-rebuild/src/main.js
          python3 .github/scripts/android-webview-security-readiness.py
          python3 .github/scripts/firebase-security-readiness.py
          for needle in public-qa- public-qa-local nexusnova_public_qa_user_v1 PUBLIC_DISABLED_ERROR; do
            ! grep -RIn --exclude-dir=.git --exclude='*.map' "$needle" fresh-rebuild NexusNovaAndroid/app/src/main/assets/www
          done
          ! grep -RInE --exclude-dir=.git --exclude='*.map' -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}' fresh-rebuild NexusNovaAndroid
      - name: Install Firestore smoke-test dependencies
        run: npm install --no-save --no-package-lock @firebase/rules-unit-testing firebase
      - name: Setup Java 21 for Firebase emulator validation
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Run mining and Firestore security smoke tests
        run: |
          set -euo pipefail
          node .github/scripts/mining-architecture-smoke.mjs
          npx --yes firebase-tools@latest emulators:exec --project demo-nexusnova-rules --only firestore "node .github/scripts/firestore-rules-smoke.mjs"
      - name: Setup Java 17 for Android build
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Decode permanent release keystore
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          chmod 600 app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Inject Firebase-repair release version and signing
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts'); s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 26091507',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.39-firebase-repair"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('Version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s: s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s: s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK package, version, signature and embedded real Firebase
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/nexusnova-apksigner.txt
          badging="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26091507'"
          echo "$badging" | grep -q "versionName='1.0.39-firebase-repair'"
          unzip -q "$APK" 'assets/www/src/core/auth-service.js' 'assets/www/src/core/firebase-backend.js' 'assets/www/src/core/drive-cloud-store.js' -d /tmp/nx-apk
          grep -Fq 'signInWithEmailAndPassword' /tmp/nx-apk/assets/www/src/core/auth-service.js
          grep -Fq 'waitForFirebaseUser' /tmp/nx-apk/assets/www/src/core/firebase-backend.js
          grep -Fq "doc(firestoreDb, 'users', active.uid)" /tmp/nx-apk/assets/www/src/core/firebase-backend.js
          ! grep -Fq 'public-mirror auth shim' /tmp/nx-apk/assets/www/src/core/auth-service.js
          ! grep -Fq 'public-qa-' /tmp/nx-apk/assets/www/src/core/auth-service.js
          ! grep -Fq 'nexusnova_public_qa_user_v1' /tmp/nx-apk/assets/www/src/core/auth-service.js
          unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/travel-fare-lens.js'
          mkdir -p signed-output
          cp "$APK" signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk
          sha256sum signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk | tee signed-output/NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > signed-output/SOURCE-COMMIT-SHA.txt
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.39-FIREBASE-REPAIR-SIGNED
          path: NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 14
