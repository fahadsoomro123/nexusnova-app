name: Build NexusNova Autopilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexusNovaAndroid/autopilot/**'
      - 'NexusNovaAndroid/settings.gradle.kts'
      - '.github/workflows/build-nexusnova-autopilot-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > autopilot/nexusnova-release.jks
          test -s autopilot/nexusnova-release.jks
          keytool -list -keystore autopilot/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed Autopilot APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_AUTOPILOT_KEYSTORE_FILE="nexusnova-release.jks"
          # The Gradle module resolves this path relative to NexusNovaAndroid/autopilot.
          gradle --no-daemon :autopilot:clean :autopilot:assembleRelease

      - name: Verify APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='autopilot/build/outputs/apk/release/autopilot-release.apk'
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          badging="$($AAPT dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.autopilot'"
          echo "$badging" | grep -q "versionCode='10001'"
          echo "$badging" | grep -q "versionName='1.0.0'"
          sha256sum "$apk" | tee autopilot-release.apk.sha256

      - name: Package artifact
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p autopilot-output
          cp autopilot/build/outputs/apk/release/autopilot-release.apk autopilot-output/NexusNova-Autopilot-v1.0.0-SIGNED.apk
          sha256sum autopilot-output/NexusNova-Autopilot-v1.0.0-SIGNED.apk > autopilot-output/NexusNova-Autopilot-v1.0.0-SIGNED.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Autopilot-v1.0.0-SIGNED
          path: NexusNovaAndroid/autopilot-output/*
          if-no-files-found: error
          retention-days: 30
