name: Build OTA12 Native-Fix Signed APK

on:
  push:
    branches:
      - ota11-video-import-flagship-fix
    paths:
      - '.github/workflows/build-ota12-native-fix-apk.yml'
      - 'NexusNovaAndroid/**'
      - 'fresh-rebuild/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

    steps:
      - name: Checkout exact native-fix branch
        uses: actions/checkout@v4
        with:
          ref: ota11-video-import-flagship-fix
          fetch-depth: 1

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify OTA12-compatible native baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const val BUNDLED_WEB_BASE = "28ad58de566e42621dad6198aa01be885ccc9769"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'allowContentAccess = true' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_OPEN_DOCUMENT' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'FLAG_GRANT_READ_URI_PERMISSION' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'acceptedExtensionMatches' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Sync canonical fresh web source into Android assets
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          rm -rf NexusNovaAndroid/app/src/main/assets/www
          mkdir -p NexusNovaAndroid/app/src/main/assets/www
          cp -a fresh-rebuild/. NexusNovaAndroid/app/src/main/assets/www/

      - name: Inject release version and permanent signing
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 27091222', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.22-ota12-native-fix"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version anchors missing')

          signing = '''    signingConfigs {
          create("ota12Release") {
              storeFile = file("nexusnova-release.jks")
              storePassword = System.getenv("KEYSTORE_PASSWORD")
              keyAlias = System.getenv("KEY_ALIAS")
              keyPassword = System.getenv("KEY_PASSWORD")
          }
      }

      '''
          if 'create("ota12Release")' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig = signingConfigs.getByName("ota12Release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("ota12Release")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature and OTA native fix
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -s "$apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          badging="$("$AAPT" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='27091222'"
          echo "$badging" | grep -q "versionName='1.0.22-ota12-native-fix'"

          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk"             'assets/www/index.html'             'assets/www/src/features/apps/ai-video-studio-flagship.js' -d "$d"

          grep -Fq 'OTA12 • ACTIVE' "$d/assets/www/index.html"
          grep -Fq 'nx-video-file-input' "$d/assets/www/src/features/apps/ai-video-studio-flagship.js"
          echo "PASS — signed APK contains OTA12 proof payload and native media-fix source."
          
          mkdir -p signed-output
          cp "$apk" signed-output/NexusNova-v1.0.22-OTA12-NATIVE-FIX-SIGNED.apk
          sha256sum signed-output/NexusNova-v1.0.22-OTA12-NATIVE-FIX-SIGNED.apk > signed-output/NexusNova-v1.0.22-OTA12-NATIVE-FIX-SIGNED.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > signed-output/SOURCE-COMMIT.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.22-OTA12-NATIVE-FIX-SIGNED
          path: NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 14
