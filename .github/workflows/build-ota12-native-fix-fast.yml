name: Fast OTA12 Native Fix APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NexusNovaAndroid/app/build.gradle.kts"
      - "NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt"
      - "NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt"
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - ".github/workflows/build-ota12-native-fix-fast.yml"

jobs:
  build-signed-ota12-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify native media fix and release identity
        id: release_identity
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          grep -Fq 'settings.allowContentAccess = true' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'Intent.ACTION_OPEN_DOCUMENT' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'FLAG_GRANT_READ_URI_PERMISSION' app/src/main/java/com/nexusnova/app/MainActivity.kt

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)"
          VERSION_CODE="$(grep -m1 'versionCode' app/build.gradle.kts | tr -cd '0-9')"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 27000042

          echo "PASS — native picker fix verified."
          echo "PASS — release identity verified: $VERSION_NAME ($VERSION_CODE)."
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/nexusnova-release.jks
          keytool -list -keystore /tmp/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$unsigned" && test -s "$unsigned"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)"
          VERSION_CODE="$(grep -m1 'versionCode' app/build.gradle.kts | tr -cd '0-9')"
          APK_NAME="NexusNova-v${VERSION_NAME}-OTA12-NATIVE-FIX.apk"

          rm -rf bootstrap-output
          mkdir -p bootstrap-output
          "$ZIPALIGN" -p -f 4 "$unsigned" bootstrap-output/unaligned.apk
          "$APKSIGNER" sign             --ks /tmp/nexusnova-release.jks             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out "bootstrap-output/$APK_NAME"             bootstrap-output/unaligned.apk

          CERTS="$($APKSIGNER verify --verbose --print-certs "bootstrap-output/$APK_NAME" 2>&1)"
          printf '%s\n' "$CERTS"
          printf '%s\n' "$CERTS" | grep -Fq 'certificate SHA-256 digest: 30052faf26f112d88d48061b88e6a698371ef0cdc4203122a9350529405a716c'

          sha256sum "bootstrap-output/$APK_NAME" > "bootstrap-output/$APK_NAME.sha256"
          echo "PASS — signed $VERSION_NAME APK verified with the expected NexusNova signing certificate ($VERSION_CODE)."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v${{ steps.release_identity.outputs.version_name }}-OTA12-NATIVE-FIX
          path: NexusNovaAndroid/bootstrap-output/NexusNova-v${{ steps.release_identity.outputs.version_name }}-OTA12-NATIVE-FIX.apk*
          if-no-files-found: error
          retention-days: 14
