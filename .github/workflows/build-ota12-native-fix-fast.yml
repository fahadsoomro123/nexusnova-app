name: Fast OTA12 Native Fix APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NexusNovaAndroid/app/build.gradle.kts"
      - "NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt"
      - "NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt"
      - ".github/workflows/build-ota12-native-fix-fast.yml"

jobs:
  build-signed-ota12-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify native media fix and release identity
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          grep -Fq 'settings.allowContentAccess = true' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'Intent.ACTION_OPEN_DOCUMENT' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'FLAG_GRANT_READ_URI_PERMISSION' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'versionCode = 27000042' app/build.gradle.kts
          grep -Fq 'versionName = "1.0.42-OTA12-native-fix"' app/build.gradle.kts
          echo "PASS — native picker fix and v1.0.42 identity verified."

      - name: Build release APK
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/nexusnova-release.jks
          keytool -list -keystore /tmp/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$unsigned" && test -s "$unsigned"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          rm -rf bootstrap-output
          mkdir -p bootstrap-output
          "$ZIPALIGN" -p -f 4 "$unsigned" bootstrap-output/unaligned.apk
          "$APKSIGNER" sign             --ks /tmp/nexusnova-release.jks             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out bootstrap-output/NexusNova-v1.0.42-OTA12-NATIVE-FIX.apk             bootstrap-output/unaligned.apk

          "$APKSIGNER" verify --verbose --print-certs bootstrap-output/NexusNova-v1.0.42-OTA12-NATIVE-FIX.apk

          sha256sum bootstrap-output/NexusNova-v1.0.42-OTA12-NATIVE-FIX.apk > bootstrap-output/NexusNova-v1.0.42-OTA12-NATIVE-FIX.apk.sha256
          echo "PASS — signed v1.0.42 APK verified."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.42-OTA12-NATIVE-FIX
          path: NexusNovaAndroid/bootstrap-output/NexusNova-v1.0.42-OTA12-NATIVE-FIX.apk*
          if-no-files-found: error
          retention-days: 14
