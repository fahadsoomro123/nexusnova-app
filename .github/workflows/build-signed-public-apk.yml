name: Build Signed Public APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-signed-public-apk.yml'
      - 'release-trigger/signed-public-apk.txt'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Check required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing NEXUSNOVA_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing NEXUSNOVA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing NEXUSNOVA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing NEXUSNOVA_KEY_PASSWORD"; exit 1; }

      - name: Checkout public Android source
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app-public-build
          ref: main
          path: public-build

      - name: Checkout proven production auth baseline
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Restore production auth only in signed workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js public-build/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js public-build/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json public-build/NexusNovaAndroid/app/google-services.json
          test -s public-build/fresh-rebuild/src/core/firebase-backend.js
          test -s public-build/fresh-rebuild/src/core/auth-service.js
          test -s public-build/NexusNovaAndroid/app/google-services.json

      - name: Verify signed workspace uses real auth and History hotfix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getAuth' public-build/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'waitForFirebaseUser' public-build/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' public-build/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' public-build/fresh-rebuild/src/core/firebase-backend.js
          ! grep -q 'public-mirror auth shim' public-build/fresh-rebuild/src/core/auth-service.js
          grep -q 'drive-history-v2-hotfix-3' public-build/fresh-rebuild/src/nova-vehicle-premium-ui.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks || { echo "Keystore decode failed"; exit 1; }

      - name: Inject release signing and high version config
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s, n_code = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 26090801', s, count=1)
          s, n_name = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.24-owner-recovery"', s, count=1)
          if n_code != 1 or n_name != 1:
              raise SystemExit('Version injection failed')
          signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file("nexusnova-release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          '''
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          release = '        release {\n'
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(release, release + '            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature and package identity
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "APK missing"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26090801'"
          echo "$badging" | grep -q "versionName='1.0.24-owner-recovery'"

      - name: Verify packaged production web auth
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          checkdir="$(mktemp -d)"
          trap 'rm -rf "$checkdir"' EXIT
          unzip -q "$apk" 'assets/www/src/core/firebase-backend.js' 'assets/www/src/core/auth-service.js' -d "$checkdir"
          backend="$checkdir/assets/www/src/core/firebase-backend.js"
          auth="$checkdir/assets/www/src/core/auth-service.js"
          test -s "$backend"
          test -s "$auth"
          grep -q 'waitForFirebaseUser' "$backend"
          grep -q 'signInWithEmailAndPassword' "$auth"
          ! grep -q 'PUBLIC_DISABLED_ERROR' "$backend"
          ! grep -q 'public-mirror auth shim' "$auth"

      - name: Package APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.24-SIGNED-HIGHCODE.apk
          sha256sum signed-output/NexusNova-v1.0.24-SIGNED-HIGHCODE.apk > signed-output/NexusNova-v1.0.24-SIGNED-HIGHCODE.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.24-SIGNED-HIGHCODE
          path: public-build/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 7
