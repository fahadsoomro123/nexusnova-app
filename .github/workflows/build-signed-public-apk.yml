name: Build Signed Public APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-signed-public-apk.yml'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: [self-hosted, Windows, X64]
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Check required signing secrets
        shell: pwsh
        run: |
          if (-not $env:KEYSTORE_B64) { throw "Missing NEXUSNOVA_KEYSTORE_BASE64" }
          if (-not $env:KEYSTORE_PASSWORD) { throw "Missing NEXUSNOVA_KEYSTORE_PASSWORD" }
          if (-not $env:KEY_ALIAS) { throw "Missing NEXUSNOVA_KEY_ALIAS" }
          if (-not $env:KEY_PASSWORD) { throw "Missing NEXUSNOVA_KEY_PASSWORD" }

      - name: Checkout public Android source
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app-public-build
          ref: main
          path: public-build

      - name: Decode keystore
        shell: pwsh
        working-directory: public-build\NexusNovaAndroid
        run: |
          [IO.File]::WriteAllBytes("app/nexusnova-release.jks", [Convert]::FromBase64String($env:KEYSTORE_B64))
          if (-not (Test-Path "app/nexusnova-release.jks")) { throw "Keystore decode failed" }

      - name: Inject release signing config
        shell: pwsh
        working-directory: public-build\NexusNovaAndroid
        run: |
          $p = "app/build.gradle.kts"
          $s = Get-Content $p -Raw
          $s = $s.Replace('versionCode = 1', 'versionCode = 1022')
          $s = $s.Replace('versionName = "1.0.0"', 'versionName = "1.0.22"')
          $signing = @'
    signingConfigs {
        create("release") {
            storeFile = file("nexusnova-release.jks")
            storePassword = System.getenv("KEYSTORE_PASSWORD")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASSWORD")
        }
    }

'@
          if ($s -notmatch 'signingConfigs \{') { $s = $s.Replace('    buildTypes {', $signing + '    buildTypes {') }
          $s = $s.Replace("        release {`n", "        release {`n            signingConfig = signingConfigs.getByName(`"release`")`n")
          Set-Content -Path $p -Value $s

      - name: Build signed release APK
        shell: pwsh
        working-directory: public-build\NexusNovaAndroid
        run: .\gradlew.bat --no-daemon clean assembleRelease

      - name: Verify APK signature
        shell: pwsh
        working-directory: public-build\NexusNovaAndroid
        run: |
          $apk = "app/build/outputs/apk/release/app-release.apk"
          if (-not (Test-Path $apk)) { throw "APK missing" }
          $apksigner = Join-Path $env:ANDROID_HOME "build-tools\35.0.0\apksigner.bat"
          & $apksigner verify --verbose $apk

      - name: Package APK
        shell: pwsh
        working-directory: public-build\NexusNovaAndroid
        run: |
          New-Item -ItemType Directory -Force -Path signed-output | Out-Null
          Copy-Item app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.22-SIGNED.apk
          Get-FileHash signed-output/NexusNova-v1.0.22-SIGNED.apk -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  NexusNova-v1.0.22-SIGNED.apk" } | Set-Content signed-output/NexusNova-v1.0.22-SIGNED.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.22-SIGNED
          path: public-build\NexusNovaAndroid\signed-output\*
          if-no-files-found: error
          retention-days: 7
