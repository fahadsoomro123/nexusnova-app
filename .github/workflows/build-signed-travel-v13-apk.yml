name: Build Signed Travel V13 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-signed-travel-v13-apk.yml'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout exact current NexusNova source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build-src
          fetch-depth: 1

      - name: Lock exact bundled web baseline
        shell: bash
        run: |
          set -euo pipefail
          export PUBLIC_SHA="$(git -C build-src rev-parse HEAD)"
          test "${#PUBLIC_SHA}" = 40
          echo "PUBLIC_SHA=$PUBLIC_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          s=p.read_text(encoding='utf-8')
          sha=os.environ['PUBLIC_SHA']
          s,n=re.subn(r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"',f'const val BUNDLED_WEB_BASE = "{sha}"',s,count=1)
          if n != 1:
              raise SystemExit('Could not inject exact bundled web baseline')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq "const val BUNDLED_WEB_BASE = \"$PUBLIC_SHA\"" build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Verify Travel V13 source chain before build
        shell: bash
        run: |
          set -euo pipefail
          base='build-src/fresh-rebuild/src/features/apps'
          index='build-src/fresh-rebuild/index.html'
          for f in travel-phone-layout-v31.js travel-phone-layout-v32.js travel-futuristic-v13.js travel-futuristic-v13-integrity.js travel-edge-client.js; do
            test -s "$base/$f"
          done
          node --check "$base/travel-phone-layout-v31.js"
          node --check "$base/travel-phone-layout-v32.js"
          node --check "$base/travel-futuristic-v13.js"
          node --check "$base/travel-futuristic-v13-integrity.js"
          node --check "$base/travel-edge-client.js"
          grep -Fq "travel-phone-layout-v31.js?ota=travel-v31-final-owner" "$index"
          grep -Fq "import './travel-phone-layout-v32.js'" "$base/travel-phone-layout-v31.js"
          grep -Fq "import('./travel-futuristic-v13.js')" "$base/travel-phone-layout-v32.js"
          grep -Fq "import('./travel-futuristic-v13-integrity.js')" "$base/travel-phone-layout-v32.js"
          grep -Fq "const BRAND_URL='https://nexusnovatools.com/'" "$base/travel-futuristic-v13.js"
          grep -Fq 'searchWorldwideHotels' "$base/travel-futuristic-v13.js"
          grep -Fq 'nn-v13-compare' "$base/travel-futuristic-v13.js"
          grep -Fq 'data-v13-route' "$base/travel-futuristic-v13.js"
          grep -Fq "window.NexusBrowserAndroid?.postMessage" "$base/travel-futuristic-v13-integrity.js"
          grep -Fq 'external browser fallback blocked' "$base/travel-futuristic-v13-integrity.js"
          ! grep -Eq 'window\.open\s*\(|openExternal' "$base/travel-futuristic-v13-integrity.js"

      - name: Checkout proven production auth baseline
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Restore production auth only in signed workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js build-src/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js build-src/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json build-src/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' build-src/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' build-src/fresh-rebuild/src/core/firebase-backend.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks

      - name: Inject V13 release version and signing
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 26091213',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.37-travel-v13"',s,count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signature package version and V13 payload
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26091213'"
          echo "$badging" | grep -q "versionName='1.0.37-travel-v13'"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" \
            'assets/www/index.html' \
            'assets/www/src/features/apps/travel-phone-layout-v31.js' \
            'assets/www/src/features/apps/travel-phone-layout-v32.js' \
            'assets/www/src/features/apps/travel-futuristic-v13.js' \
            'assets/www/src/features/apps/travel-futuristic-v13-integrity.js' \
            'assets/www/src/features/apps/travel-edge-client.js' \
            'assets/www/src/core/firebase-backend.js' \
            'assets/www/src/core/auth-service.js' -d "$d"
          grep -Fq "travel-phone-layout-v31.js?ota=travel-v31-final-owner" "$d/assets/www/index.html"
          grep -Fq "import './travel-phone-layout-v32.js'" "$d/assets/www/src/features/apps/travel-phone-layout-v31.js"
          grep -Fq "import('./travel-futuristic-v13.js')" "$d/assets/www/src/features/apps/travel-phone-layout-v32.js"
          grep -Fq "import('./travel-futuristic-v13-integrity.js')" "$d/assets/www/src/features/apps/travel-phone-layout-v32.js"
          grep -Fq "const BRAND_URL='https://nexusnovatools.com/'" "$d/assets/www/src/features/apps/travel-futuristic-v13.js"
          grep -Fq 'nn-v13-compare' "$d/assets/www/src/features/apps/travel-futuristic-v13.js"
          grep -Fq "window.NexusBrowserAndroid?.postMessage" "$d/assets/www/src/features/apps/travel-futuristic-v13-integrity.js"
          ! grep -Eq 'window\.open\s*\(|openExternal' "$d/assets/www/src/features/apps/travel-futuristic-v13-integrity.js"
          grep -q 'waitForFirebaseUser' "$d/assets/www/src/core/firebase-backend.js"
          grep -q 'signInWithEmailAndPassword' "$d/assets/www/src/core/auth-service.js"
          echo "SIGNED V13 APK VERIFIED from source $PUBLIC_SHA"

      - name: Package signed APK
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.37-SIGNED-TRAVEL-V13.apk
          sha256sum signed-output/NexusNova-v1.0.37-SIGNED-TRAVEL-V13.apk > signed-output/NexusNova-v1.0.37-SIGNED-TRAVEL-V13.apk.sha256
          printf '%s\n' "$PUBLIC_SHA" > signed-output/PUBLIC-SOURCE-SHA.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.37-SIGNED-TRAVEL-V13
          path: build-src/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 7
