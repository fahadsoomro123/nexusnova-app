name: Build Signed Travel V27 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-signed-travel-v27-apk.yml'
      - 'release-trigger/signed-travel-v27-apk.txt'

permissions:
  contents: read

jobs:
  signed-travel-v27:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_SOURCE_SHA: 5ce5518f81271fd2e4b8029403b7e74d8d6d2291
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

    steps:
      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout exact approved public source
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app-public-build
          ref: ${{ env.PUBLIC_SOURCE_SHA }}
          path: public-build

      - name: Verify exact source and approved Travel V27 payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-build rev-parse HEAD)" = "$PUBLIC_SOURCE_SHA"
          test -s public-build/fresh-rebuild/src/features/apps/travel-hyper3d-layout-v21.js
          test -s public-build/fresh-rebuild/src/features/apps/travel-hyper3d-hd-v23.js
          test -s public-build/fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js
          test -s public-build/fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js
          test -s public-build/fresh-rebuild/src/features/apps/travel-clean-ui-v27.js
          grep -Fq 'left:0!important' public-build/fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js
          grep -Fq 'width:min(278px,calc(100vw - 44px))!important' public-build/fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js
          grep -Fq '.nn-ota-badge{display:none!important' public-build/fresh-rebuild/src/features/apps/travel-clean-ui-v27.js
          grep -Fq "root.querySelectorAll('.nn-ota-badge').forEach(node=>node.remove())" public-build/fresh-rebuild/src/features/apps/travel-clean-ui-v27.js
          grep -Fq 'travel-clean-ui-v27.js' public-build/fresh-rebuild/index.html
          grep -Fq 'travel-passenger-popover-v26.js' public-build/fresh-rebuild/index.html
          grep -Fq 'travel-hyper3d-flagship-v25.js' public-build/fresh-rebuild/index.html
          grep -Fq 'travel-hyper3d-hd-v23.js' public-build/fresh-rebuild/index.html

      - name: Checkout proven production auth baseline
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Restore production auth in signed workspace only
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js public-build/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js public-build/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json public-build/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' public-build/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' public-build/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' public-build/fresh-rebuild/src/core/firebase-backend.js
          ! grep -q 'public-mirror auth shim' public-build/fresh-rebuild/src/core/auth-service.js

      - name: Preserve current Drive recovery gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drive-history-v2-hotfix-4' public-build/fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -q 'nova-drive-recover-feedback' public-build/fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "closest?.('[data-nx-approved]')" public-build/fresh-rebuild/src/nova-drive-history-v2-hotfix.js
          grep -q 'hydrateDriveTrackState' public-build/fresh-rebuild/src/nova-drive-recover-feedback.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks

      - name: Inject signed Travel V27 version
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 26090901',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.26-travel-v27"',s,count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          release='        release {\n'
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s=s.replace(release,release+'            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signature package and version
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26090901'"
          echo "$badging" | grep -q "versionName='1.0.26-travel-v27'"

      - name: Verify packaged Travel V27 and production auth
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" \
            'assets/www/index.html' \
            'assets/www/src/features/apps/travel-hyper3d-layout-v21.js' \
            'assets/www/src/features/apps/travel-hyper3d-hd-v23.js' \
            'assets/www/src/features/apps/travel-hyper3d-flagship-v25.js' \
            'assets/www/src/features/apps/travel-passenger-popover-v26.js' \
            'assets/www/src/features/apps/travel-clean-ui-v27.js' \
            'assets/www/src/core/firebase-backend.js' \
            'assets/www/src/core/auth-service.js' -d "$d"
          grep -Fq 'travel-clean-ui-v27.js' "$d/assets/www/index.html"
          grep -Fq 'travel-passenger-popover-v26.js' "$d/assets/www/index.html"
          grep -Fq 'left:0!important' "$d/assets/www/src/features/apps/travel-passenger-popover-v26.js"
          grep -Fq 'width:min(278px,calc(100vw - 44px))!important' "$d/assets/www/src/features/apps/travel-passenger-popover-v26.js"
          grep -Fq '.nn-ota-badge{display:none!important' "$d/assets/www/src/features/apps/travel-clean-ui-v27.js"
          grep -q 'waitForFirebaseUser' "$d/assets/www/src/core/firebase-backend.js"
          grep -q 'signInWithEmailAndPassword' "$d/assets/www/src/core/auth-service.js"

      - name: Package signed Travel V27 APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.26-SIGNED-TRAVEL-V27.apk
          sha256sum signed-output/NexusNova-v1.0.26-SIGNED-TRAVEL-V27.apk > signed-output/NexusNova-v1.0.26-SIGNED-TRAVEL-V27.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.26-SIGNED-TRAVEL-V27
          path: public-build/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 7
