name: Build Signed Travel V30 WebView Fix APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-signed-travel-v28-restore-apk.yml'
      - 'release-trigger/signed-travel-v28-restore-apk.txt'

permissions:
  contents: read

jobs:
  signed-travel-v28-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APPROVED_PUBLIC_SHA: 5ce5518f81271fd2e4b8029403b7e74d8d6d2291
      V28_PATCH_SHA: 7bf4aae57388984b9554e23bc85775f41595ea7f
      APPROVED_OTA_SHA: 8aaf0769b88abd3728e65f7c2f545018dc8c1f82
      OTA_REVISION_BLOB_SHA: 9a134017df1c044b70d8b7ed2d558e22d3d36323
      RESTORE_BUNDLE_ID: 7bf4aae57388984b9554e23bc85775f41595ea7f
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

    steps:
      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout exact approved Travel source
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app-public-build
          ref: ${{ env.APPROVED_PUBLIC_SHA }}
          path: public-build

      - name: Checkout exact V28 tested interaction patches
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app-public-build
          ref: ${{ env.V28_PATCH_SHA }}
          path: v28-patch
          sparse-checkout: |
            fresh-rebuild/src/features/apps/travel-phone-interaction-v28.js
            fresh-rebuild/src/features/apps/travel-phone-interaction-v28-native-select-fix.js
          sparse-checkout-cone-mode: false

      - name: Verify approved source and stage only V28 patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-build rev-parse HEAD)" = "$APPROVED_PUBLIC_SHA"
          test "$(git -C v28-patch rev-parse HEAD)" = "$V28_PATCH_SHA"
          for f in travel-phone-interaction-v28.js travel-phone-interaction-v28-native-select-fix.js; do
            node --check "v28-patch/fresh-rebuild/src/features/apps/$f"
            cp "v28-patch/fresh-rebuild/src/features/apps/$f" "public-build/fresh-rebuild/src/features/apps/$f"
          done
          grep -q 'phoneInteractionV28' public-build/fresh-rebuild/src/features/apps/travel-phone-interaction-v28.js
          grep -q "menu.dataset.open='true'" public-build/fresh-rebuild/src/features/apps/travel-phone-interaction-v28-native-select-fix.js

      - name: Checkout exact approved OTA recovery file
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-website
          ref: ${{ env.APPROVED_OTA_SHA }}
          path: approved-ota
          sparse-checkout: |
            ota/files/src/features/apps/travel-ota-revision-v13.js
          sparse-checkout-cone-mode: false

      - name: Stage exact approved OTA recovery file
        shell: bash
        run: |
          set -euo pipefail
          rel='ota/files/src/features/apps/travel-ota-revision-v13.js'
          src="approved-ota/$rel"
          dst='public-build/fresh-rebuild/src/features/apps/travel-ota-revision-v13.js'
          test -s "$src"
          actual="$(git -C approved-ota hash-object "$rel")"
          echo "Travel recovery blob: $actual"
          test "$actual" = "$OTA_REVISION_BLOB_SHA"
          cp "$src" "$dst"

      - name: Stage exact approved V27 plus V28 loader composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public-build/fresh-rebuild/index.html')
          lines=p.read_text(encoding='utf-8').splitlines()
          marker='travel-exit-isolation-v10.js'
          names=[
              'travel-result-details-v1.js',
              'travel-ota-revision-v13.js',
              'travel-hyper3d-layout-v21.js',
              'travel-hyper3d-hd-v23.js',
              'travel-hyper3d-flagship-v25.js',
              'travel-passenger-popover-v26.js',
              'travel-clean-ui-v27.js',
              'travel-phone-interaction-v28.js',
              'travel-phone-interaction-v28-native-select-fix.js',
          ]
          lines=[line for line in lines if not any(name in line for name in names)]
          try:
              idx=next(i for i,line in enumerate(lines) if marker in line)
          except StopIteration:
              raise SystemExit('Travel exit-isolation loader marker missing')
          ordered=[
              'travel-ota-revision-v13.js',
              'travel-hyper3d-layout-v21.js',
              'travel-hyper3d-hd-v23.js',
              'travel-hyper3d-flagship-v25.js',
              'travel-passenger-popover-v26.js',
              'travel-clean-ui-v27.js',
              'travel-phone-interaction-v28.js',
              'travel-phone-interaction-v28-native-select-fix.js',
          ]
          block=[f'  <script type="module" src="./src/features/apps/{name}?bundle=travel-v28-restore"></script>' for name in ordered]
          lines[idx+1:idx+1]=block
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          for name in travel-ota-revision-v13.js travel-hyper3d-layout-v21.js travel-hyper3d-hd-v23.js travel-hyper3d-flagship-v25.js travel-passenger-popover-v26.js travel-clean-ui-v27.js travel-phone-interaction-v28.js travel-phone-interaction-v28-native-select-fix.js; do
            grep -Fq "$name?bundle=travel-v28-restore" public-build/fresh-rebuild/index.html
          done
          ! grep -Fq 'travel-result-details-v1.js' public-build/fresh-rebuild/index.html

      - name: Force one-time OTA restore identity in Android shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('public-build/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          s=p.read_text(encoding='utf-8')
          new=os.environ['RESTORE_BUNDLE_ID']
          s,n=re.subn(r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"',f'const val BUNDLED_WEB_BASE = "{new}"',s,count=1)
          if n != 1:
              raise SystemExit('Could not inject restore bundle identity')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq "const val BUNDLED_WEB_BASE = \"$RESTORE_BUNDLE_ID\"" public-build/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -q 'versionsRoot.deleteRecursively()' public-build/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -q 'if (base != BUNDLED_WEB_BASE)' public-build/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Checkout proven production auth baseline
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Restore production auth in signed workspace only
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js public-build/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js public-build/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json public-build/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' public-build/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' public-build/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' public-build/fresh-rebuild/src/core/firebase-backend.js
          ! grep -q 'public-mirror auth shim' public-build/fresh-rebuild/src/core/auth-service.js

      - name: Preserve current Drive recovery gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drive-history-v2-hotfix-4' public-build/fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -q 'nova-drive-recover-feedback' public-build/fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "closest?.('[data-nx-approved]')" public-build/fresh-rebuild/src/nova-drive-history-v2-hotfix.js
          grep -q 'hydrateDriveTrackState' public-build/fresh-rebuild/src/nova-drive-recover-feedback.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks

      - name: Inject signed Travel V28 restore version
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 26090930',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.30-travel-webview-fix"',s,count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          release='        release {\n'
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s=s.replace(release,release+'            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signature package version and restore payload
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26090930'"
          echo "$badging" | grep -q "versionName='1.0.30-travel-webview-fix'"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" \
            'assets/www/index.html' \
            'assets/www/src/features/apps/travel-hyper3d-layout-v21.js' \
            'assets/www/src/features/apps/travel-hyper3d-hd-v23.js' \
            'assets/www/src/features/apps/travel-hyper3d-flagship-v25.js' \
            'assets/www/src/features/apps/travel-passenger-popover-v26.js' \
            'assets/www/src/features/apps/travel-clean-ui-v27.js' \
            'assets/www/src/features/apps/travel-ota-revision-v13.js' \
            'assets/www/src/features/apps/travel-phone-interaction-v28.js' \
            'assets/www/src/features/apps/travel-phone-interaction-v28-native-select-fix.js' \
            'assets/www/src/core/firebase-backend.js' \
            'assets/www/src/core/auth-service.js' -d "$d"
          for name in travel-ota-revision-v13.js travel-hyper3d-layout-v21.js travel-hyper3d-hd-v23.js travel-hyper3d-flagship-v25.js travel-passenger-popover-v26.js travel-clean-ui-v27.js travel-phone-interaction-v28.js travel-phone-interaction-v28-native-select-fix.js; do
            grep -Fq "$name?bundle=travel-v28-restore" "$d/assets/www/index.html"
          done
          ! grep -Fq 'travel-result-details-v1.js' "$d/assets/www/index.html"
          grep -Fq 'width:min(278px,calc(100vw - 44px))!important' "$d/assets/www/src/features/apps/travel-passenger-popover-v26.js"
          grep -Fq '.nn-ota-badge{display:none!important' "$d/assets/www/src/features/apps/travel-clean-ui-v27.js"
          grep -q 'phoneInteractionV28' "$d/assets/www/src/features/apps/travel-phone-interaction-v28.js"
          grep -q "menu.dataset.open='true'" "$d/assets/www/src/features/apps/travel-phone-interaction-v28-native-select-fix.js"
          actual="$(git hash-object "$d/assets/www/src/features/apps/travel-ota-revision-v13.js")"
          test "$actual" = "$OTA_REVISION_BLOB_SHA"
          grep -q 'waitForFirebaseUser' "$d/assets/www/src/core/firebase-backend.js"
          grep -q 'signInWithEmailAndPassword' "$d/assets/www/src/core/auth-service.js"

      - name: Package signed Travel V28 restore APK
        shell: bash
        working-directory: public-build/NexusNovaAndroid
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.30-SIGNED-TRAVEL-WEBVIEW-FIX.apk
          sha256sum signed-output/NexusNova-v1.0.30-SIGNED-TRAVEL-WEBVIEW-FIX.apk > signed-output/NexusNova-v1.0.30-SIGNED-TRAVEL-WEBVIEW-FIX.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.30-SIGNED-TRAVEL-WEBVIEW-FIX
          path: public-build/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 7
