name: Build NexusNova Travel Fare Lens APK

on:
  workflow_dispatch:
  push:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - '.github/workflows/build-travel-fare-lens-apk.yml'
      - 'NexusNovaAndroid/**'
      - 'fresh-rebuild/**'

permissions:
  contents: read

concurrency:
  group: nexusnova-travel-fare-lens-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Fare Lens source
        run: |
          set -euo pipefail
          test -s fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'fareLensRenderers' fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/travel-fare-lens.js
          node --check functions/travelSearch.js

      - name: Build installable debug APK
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s app/src/main/assets/www/src/features/apps/travel-fare-lens.js
          grep -Fq 'LIVE FLIGHT TRACKER' app/src/main/assets/www/src/features/apps/travel-fare-lens.js
          grep -Fq 'First Class' app/src/main/assets/www/src/features/apps/travel-fare-lens.js
          mkdir -p "$GITHUB_WORKSPACE/travel-apk"
          cp "$APK" "$GITHUB_WORKSPACE/travel-apk/NexusNova-Travel-Fare-Lens-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/travel-apk/NexusNova-Travel-Fare-Lens-debug.apk" > "$GITHUB_WORKSPACE/travel-apk/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Travel-Fare-Lens-debug-apk
          path: travel-apk/
          if-no-files-found: error
          retention-days: 7
