name: Build Nova Hub Travel APK

on:
  push:
    branches: [travel-apk-preview-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Travel branch
        uses: actions/checkout@v4

      - name: Attach new Travel renderer to Nova Hub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fresh-rebuild/src/features/apps/app-screen.js')
          s=p.read_text(encoding='utf-8')
          marker="const rendererSources = [\n"
          line="  ['./travel-hub-new.js', 'travelHubRenderers'],\n"
          if line not in s:
              s=s.replace(marker, marker+line, 1)
          p.write_text(s,encoding='utf-8')

          p=Path('fresh-rebuild/src/features/hub/hub-screen.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const ICON_ONLY_HUB_APP_IDS = new Set(['travel']);", "const ICON_ONLY_HUB_APP_IDS = new Set();")
          p.write_text(s,encoding='utf-8')
          PY

          grep -Fq "['./travel-hub-new.js', 'travelHubRenderers']" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "const ICON_ONLY_HUB_APP_IDS = new Set();" fresh-rebuild/src/features/hub/hub-screen.js

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android debug APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Travel Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Travel-Hub-APK
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
