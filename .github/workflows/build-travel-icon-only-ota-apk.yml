name: NexusNova Signed APK — Travel Icon Only + OTA

on:
  push:
    branches:
      - build/1.0.41-travel-icon-only-ota
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      SOURCE_SHA: b8aa3393af20235fb70cf771f7bc7f84b05ebbf3

    steps:
      - name: Checkout exact Travel icon-only baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: build-src
          fetch-depth: 1

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Verify Travel is icon-only and OTA engine is present
        shell: bash
        run: |
          set -euo pipefail
          index='build-src/fresh-rebuild/index.html'
          registry='build-src/fresh-rebuild/src/features/hub/app-registry.js'
          app_screen='build-src/fresh-rebuild/src/features/apps/app-screen.js'
          ota='build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
          main='build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'

          test -s "$index"
          test -s "$registry"
          test -s "$app_screen"
          test -s "$ota"
          test -s "$main"

          # Travel icon/entry remains in Nova Hub.
          grep -Fq "{ id: 'travel', name: 'Travel'" "$registry"
          grep -Fq "icon: 'travel'" "$registry"

          # No Travel runtime is loaded by the app shell.
          ! grep -Eqi 'travel-[a-z0-9_-]+\\.(js|css)' "$index"
          ! grep -Eqi 'travel-[a-z0-9_-]+\\.(js|css)' "$app_screen"
          ! grep -Eqi 'travel[-_ ]+(fare|phone|hotel|flight|bus|train|trip|runtime|futuristic|edge|lens)' "$app_screen"

          # No Travel runtime files remain in the packaged fresh-rebuild tree.
          if find build-src/fresh-rebuild -type f -iname '*travel*' -print -quit | grep -q .; then
            echo 'Travel-named runtime files still exist in fresh-rebuild'
            find build-src/fresh-rebuild -type f -iname '*travel*' -print
            exit 1
          fi

          # OTA manager and startup hook are present.
          grep -Fq 'private val otaWebManager by lazy' "$main"
          grep -Fq 'checkForWebUpdate()' "$main"
          grep -Fq 'const val MANIFEST_SCHEMA = 2' "$ota"
          grep -Fq 'const val MANIFEST_URL =' "$ota"
          grep -Fq 'versionsRoot.deleteRecursively()' "$ota"
          grep -Fq 'if (base != BUNDLED_WEB_BASE)' "$ota"

          # Lock the OTA engine baseline to this exact APK source snapshot.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          s = p.read_text(encoding='utf-8')
          source = 'b8aa3393af20235fb70cf771f7bc7f84b05ebbf3'
          s, n = re.subn(r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"', f'const val BUNDLED_WEB_BASE = "{source}"', s, count=1)
          if n != 1:
              raise SystemExit('BUNDLED_WEB_BASE injection failed')
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'const val BUNDLED_WEB_BASE = "b8aa3393af20235fb70cf771f7bc7f84b05ebbf3"' "$ota"

          # Production auth files are replaced from the known-good auth baseline during build.

      - name: Restore known production Firebase auth/config
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Apply production auth to signed workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js build-src/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js build-src/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json build-src/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' build-src/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' build-src/fresh-rebuild/src/core/firebase-backend.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Configure higher-version release signing
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'versionCode\\s*=\\s*\\d+', 'versionCode = 27000041', s, count=1)
          s, n2 = re.subn(r'versionName\\s*=\\s*"[^"]+"', 'versionName = "1.0.41-travel-icon-only-ota"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signature package version Travel purge and OTA payload
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          badging="$($AAPT dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='27000041'"
          echo "$badging" | grep -q "versionName='1.0.41-travel-icon-only-ota'"

          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" \
            'assets/www/index.html' \
            'assets/www/src/features/hub/app-registry.js' \
            'assets/www/src/features/apps/app-screen.js' \
            'assets/www/src/main.js' \
            -d "$d"

          test -s "$d/assets/www/index.html"
          grep -Fq "{ id: 'travel', name: 'Travel'" "$d/assets/www/src/features/hub/app-registry.js"
          grep -Fq "icon: 'travel'" "$d/assets/www/src/features/hub/app-registry.js"
          ! grep -Eqi 'travel-[a-z0-9_-]+\\.(js|css)' "$d/assets/www/index.html"
          ! grep -Eqi 'travel-[a-z0-9_-]+\\.(js|css)' "$d/assets/www/src/features/apps/app-screen.js"
          ! grep -Fqi 'travel-phone' "$d/assets/www/src/main.js"
          ! grep -Fqi 'travel-futuristic' "$d/assets/www/src/main.js"

          ota='src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
          grep -Fq 'const val BUNDLED_WEB_BASE = "b8aa3393af20235fb70cf771f7bc7f84b05ebbf3"' "$ota"
          grep -Fq 'const val MANIFEST_SCHEMA = 2' "$ota"

      - name: Package verified APK
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-ICON-ONLY-OTA.apk
          sha256sum signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-ICON-ONLY-OTA.apk > signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-ICON-ONLY-OTA.apk.sha256
          printf '%s\n' "$SOURCE_SHA" > signed-output/PUBLIC-SOURCE-SHA.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.41-SIGNED-TRAVEL-ICON-ONLY-OTA
          path: build-src/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 14
