name: Build Signed Travel Update APK V2
# MASTER-REPAIR-TRIGGER-2026-09-15

on:
  push:
    branches: [travel-fare-lens-final]
    paths:
      - '.github/workflows/build-travel-update-apk-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify signing inputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing and repair Travel/Firebase assets
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 26091245', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.45-master-repair"', s, count=1)
          signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s)

          web_root = Path('../fresh-rebuild')
          firebase = web_root / 'src/core/firebase-backend.js'
          if 'PUBLIC_BUILD_FIREBASE_DISABLED' in firebase.read_text():
              raise SystemExit('Sanitized Firebase backend detected; expected live implementation')

          travel_files = [
              web_root / 'src/features/apps/travel-fare-lens.js',
              web_root / 'src/features/apps/travel-master-enhancer.js',
              web_root / 'src/features/apps/travel-flight-status-ui.js',
          ]
          old_api = "const API_BASE=String(globalThis.NexusNovaTravelConfig?.apiBase||'/api/travel').replace(/\\/$/,'');"
          new_api = "const API_BASE='https://nexusnova-6ade2.web.app/api/travel';"
          for tp in travel_files:
              t = tp.read_text()
              if old_api in t:
                  t = t.replace(old_api, new_api, 1)
              elif 'const API_BASE=' not in t:
                  raise SystemExit(f'No Travel API base found in {tp}')
              if tp.name == 'travel-fare-lens.js':
                  t = re.sub(r'<style>.*?</style>', '<style></style>', t, count=1, flags=re.S)
                  if '#020611' in t or '#07111f' in t:
                      raise SystemExit('Legacy dark Travel renderer still present')
              tp.write_text(t)
          print('APK preparation complete: live Firebase backend, absolute Travel API base, legacy inline Fare Lens CSS removed.')
          PY

      - name: Build release
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK identity, signing and bundled runtime
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk" | head -n1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='26091245'"
          echo "$badging" | grep -q "versionName='1.0.45-master-repair'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee cert.txt
          actual="$(sed -n 's/.*SHA-256 digest: //p' cert.txt | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n1)"
          expected='30052faf26f112d88d48061b88e6a698371ef0cdc4203122a9350529405a716c'
          test -n "$actual"
          test "$actual" = "$expected"
          echo "Signing certificate MATCH"

          tmp="$(mktemp -d)"
          unzip -q "$apk" 'assets/www/*' -d "$tmp"
          test -f "$tmp/assets/www/src/core/firebase-backend.js"
          ! grep -q 'PUBLIC_BUILD_FIREBASE_DISABLED' "$tmp/assets/www/src/core/firebase-backend.js"
          ! grep -q '#020611' "$tmp/assets/www/src/features/apps/travel-fare-lens.js"
          ! grep -q '#07111f' "$tmp/assets/www/src/features/apps/travel-fare-lens.js"
          grep -q 'https://nexusnova-6ade2.web.app/api/travel' "$tmp/assets/www/src/features/apps/travel-fare-lens.js"
          grep -qi '#087f5b' "$tmp/assets/www/assets/styles/fare-lens-flagship-v1.css"
          echo "Bundled runtime verification PASSED"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.45-MASTER-REPAIR.apk
          sha256sum signed-output/NexusNova-v1.0.45-MASTER-REPAIR.apk > signed-output/NexusNova-v1.0.45-MASTER-REPAIR.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.45-MASTER-REPAIR
          path: signed-output/*
          retention-days: 14
