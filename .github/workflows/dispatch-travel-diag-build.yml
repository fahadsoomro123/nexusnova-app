name: Dispatch Signed Travel Diagnostic Build

on:
  workflow_dispatch:
  push:
    branches: [repo-cleanup-v2-20260911]
    paths:
      - '.github/workflows/dispatch-travel-diag-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch proven signed Travel build at current branch HEAD
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-travel-card-fill-apk.yml',
              ref: 'repo-cleanup-v2-20260911'
            });

