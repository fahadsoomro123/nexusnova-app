name: NexusNova Exact Pre-0900 Historical Build

on:
  push:
    branches:
      - agent/exact-pre-0900-working
    paths:
      - '.github/workflows/exact-pre-0900-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact checkpoint branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove application source is unchanged from 0b6b856
        run: |
          git diff --exit-code 0b6b856e25204d40b7172482cd2886ff30e80325 -- \
            index.html page2.html referral.html styles.css manifest.webmanifest css js \
            NexusNovaAndroid \
            ':!NexusNovaAndroid/app/build/**'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare deterministic Android web shell
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Synchronize mining boost countdown state
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Enforce rewarded test-only production guard
        run: python3 NexusNovaAndroid/patch_rewarded_test_contract.py

      - name: Apply TEST mining reward preview and booster FX
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx.py

      - name: Harden TEST reward cooldown idempotence FX timing and safe scroll
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py

      - name: Enforce TEST cooldown across boost entry points
        run: python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Prevent wasted TEST boost ads in final two hours
        run: python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py

      - name: Enforce single-owner authoritative TEST mining timer
        run: python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Apply UMP privacy options bridge
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Defer Caller ID setup until feature use
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Reset stale WebView shell once
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Apply historical native shell and startup stabilization
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Check historical web JavaScript syntax
        run: |
          node --check NexusNovaAndroid/app/src/main/assets/www/js/rewards-security-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-daily-secure-claim-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-admob-nexus-pass-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-daily-ad-test-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-watch-ad-reward-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-nova-vault-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-file-vault-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-security-lock-v1.js

      - name: Compile exact historical Android debug APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Upload exact pre-0900 APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-EXACT-PRE-0900-HISTORICAL-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
