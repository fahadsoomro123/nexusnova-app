name: NexusNova Restored Signed APK Build
on:
  push:
    branches: [build/restore-apk-20260914]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleRelease
      - name: Sign and verify
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          KS="$RUNNER_TEMP/nexusnova-release.jks"
          ALIGNED="$RUNNER_TEMP/nexusnova-aligned.apk"
          SIGNED="$GITHUB_WORKSPACE/NexusNova-v1.0.21-RESTORED-SIGNED.apk"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          test -s "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KS" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" > "$GITHUB_WORKSPACE/NexusNova-v1.0.21-RESTORED-SIGNED.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.21-RESTORED-SIGNED
          path: |
            NexusNova-v1.0.21-RESTORED-SIGNED.apk
            NexusNova-v1.0.21-RESTORED-SIGNED.apk.sha256
          retention-days: 7
