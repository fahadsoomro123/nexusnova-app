name: NexusNova Fast Public Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public build snapshot
        uses: actions/checkout@v4

      - name: Reject secret-looking credentials in public mirror
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git \
            'AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}' .; then
            echo 'Public-build safety gate failed: credential-like material detected.' >&2
            exit 1
          fi
          echo 'Public-build credential scan passed.'

      - name: Verify Firebase is disabled in public snapshot
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_BUILD_FIREBASE_DISABLED' NexusNovaAndroid/app/google-services.json
          if grep -q 'firebase.initializeApp' fresh-rebuild/sw.js; then
            echo 'Public service worker must not initialize Firebase with credentials.' >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build NexusNova debug APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Fast-Public-Debug
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
