name: NexusNova FCM Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'functions/notifications.js'
      - 'js/nexusnova-fcm-v1.js'
      - 'sw.js'
      - 'firestore.rules'
      - '.github/scripts/fcm-security-readiness.py'
      - '.github/workflows/fcm-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fcm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FCM security contract
        run: python3 .github/scripts/fcm-security-readiness.py

      - name: Check notification code syntax
        run: |
          node --check functions/notifications.js
          node --check js/nexusnova-fcm-v1.js
          node --check sw.js
