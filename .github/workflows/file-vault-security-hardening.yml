name: NexusNova File Vault Security Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/harden_file_vault.py'
      - '.github/scripts/harden_file_vault_runtime_test.py'
      - '.github/scripts/file-vault-security-readiness.py'
      - '.github/workflows/file-vault-security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply File Vault privacy hardening
        run: |
          python3 .github/scripts/harden_file_vault.py
          python3 .github/scripts/harden_file_vault_runtime_test.py

      - name: Validate File Vault security contract
        run: python3 .github/scripts/file-vault-security-readiness.py

      - name: Check JavaScript syntax
        run: |
          node --check js/nexusnova-file-vault-v1.js
          node --check .github/scripts/nexusnova-documents-vault-security-runtime.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local NexusNova origin
        shell: bash
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>runtime</title>' > .runtime-origin.html
          python3 -m http.server 4173 > /tmp/nexusnova-vault-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.runtime-origin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-vault-http.log || true
          exit 1

      - name: Run File Vault browser regression
        run: node .github/scripts/nexusnova-documents-vault-security-runtime.mjs

      - name: Verify clean patch
        run: git diff --check

      - name: Commit File Vault hardening
        run: |
          if git diff --quiet -- js/nexusnova-file-vault-v1.js .github/scripts/nexusnova-documents-vault-security-runtime.mjs; then
            echo 'File Vault hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/nexusnova-file-vault-v1.js .github/scripts/nexusnova-documents-vault-security-runtime.mjs
          git commit -m 'Harden local File Vault privacy and key derivation'
          git push origin HEAD:main
