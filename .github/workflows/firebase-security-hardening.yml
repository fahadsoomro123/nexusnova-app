name: NexusNova Firebase Security Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/harden_daily_reward_rules.py'
      - '.github/scripts/harden_auth_appcheck.py'
      - '.github/workflows/firebase-security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove direct Daily Reward value write
        run: python3 .github/scripts/harden_daily_reward_rules.py

      - name: Configure login App Check key
        run: python3 .github/scripts/harden_auth_appcheck.py

      - name: Verify security contract
        run: |
          git diff --check
          if grep -A20 'match /users/{uid}' firestore.rules | grep -q 'validDailyReward()'; then
            echo 'Direct Daily Reward write is still allowed.' >&2
            exit 1
          fi
          grep -q "exports.claimDailyReward=protectedCallable" functions/index.js
          grep -q "window.nexusSecureClaimDaily" js/nexusnova-daily-secure-claim-v1.js
          grep -q 'initializeAppCheck' index.html
          grep -q 'ReCaptchaEnterpriseProvider' index.html
          grep -q '6LfEc4QtAAAAAOohkqSv0p76iwPTeHI98hqVlwIs' index.html

      - name: Commit hardened Firebase security files
        run: |
          if git diff --quiet -- firestore.rules index.html; then
            echo 'No Firebase security changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules index.html
          git commit -m 'Harden Firebase reward and App Check paths'
          git push origin HEAD:main
