name: NexusNova Firebase Security Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/harden_daily_reward_rules.py'
      - '.github/scripts/remove_legacy_daily_reward_rule.py'
      - '.github/scripts/harden_auth_appcheck.py'
      - '.github/scripts/harden_verified_user_writes.py'
      - '.github/scripts/harden_signup_auth_ui.py'
      - '.github/scripts/firebase-security-readiness.py'
      - '.github/workflows/firebase-security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove direct Daily Reward value write
        run: python3 .github/scripts/harden_daily_reward_rules.py

      - name: Remove dead Daily Reward rule helper
        run: python3 .github/scripts/remove_legacy_daily_reward_rule.py

      - name: Configure login App Check key
        run: python3 .github/scripts/harden_auth_appcheck.py

      - name: Require verified email for chat and marketplace writes
        run: python3 .github/scripts/harden_verified_user_writes.py

      - name: Harden new-account password and enumeration UX
        run: python3 .github/scripts/harden_signup_auth_ui.py

      - name: Verify security contract
        run: |
          git diff --check
          if grep -q 'function validDailyReward()' firestore.rules; then
            echo 'Legacy direct Daily Reward rule helper still exists.' >&2
            exit 1
          fi
          grep -q "exports.claimDailyReward=protectedCallable" functions/index.js
          grep -q "window.nexusSecureClaimDaily" js/nexusnova-daily-secure-claim-v1.js
          grep -q 'initializeAppCheck' index.html
          grep -q 'ReCaptchaEnterpriseProvider' index.html
          grep -q '6LfEc4QtAAAAAOohkqSv0p76iwPTeHI98hqVlwIs' index.html
          grep -q 'email_verified == true && validChatMessage()' firestore.rules
          grep -q 'email_verified == true && validListingCreate()' firestore.rules
          grep -q 'email_verified == true && validOrderCreate()' firestore.rules
          grep -q '!loginMode && password.length < 10' index.html
          grep -q 'Unable to create this account. Try Login' index.html

      - name: Run full Firebase security readiness before bot commit
        run: python3 .github/scripts/firebase-security-readiness.py

      - name: Check security JavaScript syntax
        run: |
          node --check js/nexusnova-daily-secure-claim-v1.js
          node --check js/rewards-security-v1.js
          node --check sw.js
          node --check functions/index.js

      - name: Commit hardened Firebase security files
        run: |
          if git diff --quiet -- firestore.rules index.html; then
            echo 'No Firebase security changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules index.html
          git commit -m 'Harden Firebase security defaults'
          git push origin HEAD:main
