name: NexusNova Firebase Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'index.html'
      - 'js/page2.js'
      - 'js/page2-core.js'
      - 'js/rewards-security-v1.js'
      - 'js/nexusnova-daily-secure-claim-v1.js'
      - 'functions/index.js'
      - '.github/scripts/firebase-security-readiness.py'
      - '.github/workflows/firebase-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Firebase security contract
        run: python3 .github/scripts/firebase-security-readiness.py

      - name: Check secure Daily bridge syntax
        run: node --check js/nexusnova-daily-secure-claim-v1.js

      - name: Check rewards security syntax
        run: node --check js/rewards-security-v1.js

      - name: Check Functions syntax
        run: node --check functions/index.js
