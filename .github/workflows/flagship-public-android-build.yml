name: NexusNova Flagship Public Android Build

on:
  workflow_dispatch:
  push:
    branches: [nexusnova-flagship-optimization]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create isolated public build snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexusnova-public-build
          mkdir -p /tmp/nexusnova-public-build
          cp -a . /tmp/nexusnova-public-build

          cd /tmp/nexusnova-public-build
          grep -RIl --exclude-dir=.git 'AIza[0-9A-Za-z_-]\{35\}' . | while IFS= read -r file; do
            sed -E -i 's/AIza[0-9A-Za-z_-]{35}/PUBLIC_BUILD_FIREBASE_DISABLED/g' "$file"
          done

          echo 'Temporary public snapshot prepared.'

      - name: Verify public snapshot contains no credential-like material
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nexusnova-public-build
          if grep -RInE --exclude-dir=.git             'AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}' .; then
            echo 'Public-build safety gate failed: credential-like material remains.' >&2
            exit 1
          fi
          echo 'Public-build credential scan passed.'

      - name: Verify Firebase is disabled in public snapshot
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_BUILD_FIREBASE_DISABLED' /tmp/nexusnova-public-build/NexusNovaAndroid/app/google-services.json
          if grep -q 'firebase.initializeApp' /tmp/nexusnova-public-build/fresh-rebuild/sw.js; then
            echo 'Public service worker must not initialize Firebase with credentials.' >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build NexusNova debug APK
        working-directory: /tmp/nexusnova-public-build/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Record APK evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "APK size: ${APK_SIZE_BYTES} bytes"
          echo "APK SHA-256: ${APK_SHA256}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Flagship-Public-Debug
          path: /tmp/nexusnova-public-build/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
