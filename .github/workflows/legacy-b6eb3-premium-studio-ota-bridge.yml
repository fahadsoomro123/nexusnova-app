name: Legacy b6eb3 Premium Studio OTA Bridge

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/legacy-b6eb3-premium-studio-ota-bridge.yml'

permissions:
  contents: read

env:
  OTA_BUNDLED_BASE: b6eb3d191ee35b58c0ffe14334674ea2c60d3b72
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify legacy bridge safety and Premium Studio source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$OTA_BUNDLED_BASE^{commit}"
          deleted="$(git diff --name-only --diff-filter=D "$OTA_BUNDLED_BASE" "$GITHUB_SHA" -- fresh-rebuild/ || true)"
          if [ -n "$deleted" ]; then
            echo 'Legacy atomic OTA cannot represent deleted bundled web files:' >&2
            printf '%s\n' "$deleted" >&2
            exit 1
          fi
          node --check fresh-rebuild/src/features/apps/ai-photo-studio.js
          node --check fresh-rebuild/src/features/apps/ai-video-studio.js
          node --check fresh-rebuild/src/features/apps/pdf-pro-studio.js
          node --check fresh-rebuild/src/features/apps/ai-transcribe-studio.js
          node --check fresh-rebuild/src/features/apps/ai-writing-studio.js
          node --check fresh-rebuild/src/features/apps/digital-sign-studio.js
          node --check fresh-rebuild/src/features/apps/premium-studio-core.js
          node --check fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-photo-studio': renderAiPhotoStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-video-studio': renderAiVideoStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'pdf-pro': renderPdfProStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-transcribe': renderAiTranscribeStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-writing-pro': renderAiWritingStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'digital-sign': renderDigitalSignStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          for icon in ai-photo-studio ai-video-studio pdf-pro ai-transcribe ai-writing-pro digital-sign; do
            test -s "fresh-rebuild/assets/icons/nova-hub/$icon.webp"
          done

      - name: Build legacy differential OTA package
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          ROOT=/tmp/nexusnova-legacy-ota
          rm -rf "$ROOT"
          mkdir -p "$ROOT/files"
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            test -f "$full"
            mkdir -p "$ROOT/files/$(dirname "$rel")"
            cp "$full" "$ROOT/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)
          if [ ! -f "$ROOT/files/index.html" ]; then
            cp fresh-rebuild/index.html "$ROOT/files/index.html"
          fi
          export OTA_ROOT="$ROOT" OTA_VERSION="$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['OTA_ROOT'])/'files'
          files=[]
          total=0
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes(); total += len(data)
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          if not any(x['path']=='index.html' for x in files): raise SystemExit('index.html missing')
          required={
            'src/features/apps/ai-photo-studio.js','src/features/apps/ai-video-studio.js',
            'src/features/apps/pdf-pro-studio.js','src/features/apps/ai-transcribe-studio.js',
            'src/features/apps/ai-writing-studio.js','src/features/apps/digital-sign-studio.js',
            'src/features/apps/premium-studio-core.js','src/features/apps/premium-studio-suite.js',
            'assets/icons/nova-hub/ai-photo-studio.webp','assets/icons/nova-hub/ai-video-studio.webp',
            'assets/icons/nova-hub/pdf-pro.webp','assets/icons/nova-hub/ai-transcribe.webp',
            'assets/icons/nova-hub/ai-writing-pro.webp','assets/icons/nova-hub/digital-sign.webp'
          }
          present={x['path'] for x in files}
          missing=sorted(required-present)
          if missing: raise SystemExit('required Premium Studio OTA files missing: '+', '.join(missing))
          if total > 60*1024*1024: raise SystemExit(f'OTA too large: {total}')
          manifest={'schema':2,'base':os.environ['OTA_BUNDLED_BASE'],'version':os.environ['OTA_VERSION'],'files':files}
          (Path(os.environ['OTA_ROOT'])/'manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Legacy OTA files:',len(files),'bytes:',total)
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish legacy public OTA bridge
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/nexusnova-legacy-public"
          rm -rf "$PUB"
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" "$PUB"
          cd "$PUB"
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota
          mkdir -p ota
          cp -a /tmp/nexusnova-legacy-ota/. ota/
          git add -A ota
          git commit -m "Publish legacy b6eb3 Premium Studio OTA $GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"

      - name: Verify public legacy OTA end-to-end
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_OTA_BRANCH/ota"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/manifest.json?sha=$GITHUB_SHA&n=$attempt" -o /tmp/public-manifest.json; then
              if python3 - "$GITHUB_SHA" "$OTA_BUNDLED_BASE" <<'PY'
          import json, sys
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          version,base=sys.argv[1],sys.argv[2]
          assert m.get('schema')==2,m
          assert m.get('version')==version,(m.get('version'),version)
          assert m.get('base')==base,(m.get('base'),base)
          paths={x.get('path') for x in m.get('files',[])}
          assert 'src/features/apps/premium-studio-suite.js' in paths
          assert 'assets/icons/nova-hub/digital-sign.webp' in paths
          PY
              then break; fi
            fi
            if [ "$attempt" -eq 6 ]; then echo 'Legacy public OTA manifest did not converge' >&2; exit 1; fi
            sleep 5
          done
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          m=json.load(open('/tmp/public-manifest.json',encoding='utf-8'))
          base='https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/files/'
          for item in m['files']:
              url=base+'/'.join(urllib.parse.quote(p,safe='') for p in item['path'].split('/'))
              data=urllib.request.urlopen(url,timeout=20).read()
              assert len(data)==item['size'],item['path']
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
          print('Legacy public OTA verified:',len(m['files']),'files')
          PY
