name: NexusNova Marketplace Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '.github/scripts/marketplace-security-readiness.py'
      - '.github/workflows/marketplace-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace order-fraud rules
        run: python3 .github/scripts/marketplace-security-readiness.py
