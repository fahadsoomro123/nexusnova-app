name: NexusNova Mining Boost Security Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/harden_mining_boost_value.py'
      - '.github/scripts/harden_mining_boost_tests.py'
      - '.github/scripts/mining-boost-security-readiness.py'
      - '.github/workflows/mining-boost-security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-mining-boost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Mining Boost proof-only hardening
        run: |
          python3 .github/scripts/harden_mining_boost_value.py
          python3 .github/scripts/harden_mining_boost_tests.py

      - name: Validate Mining Boost security contract
        run: |
          python3 .github/scripts/mining-boost-security-readiness.py
          python3 .github/scripts/firebase-security-readiness.py
          git diff --check

      - name: Check modified source and test syntax
        run: |
          node --check js/nexusnova-admob-nexus-pass-v1.js
          node --check js/nexusnova-rewarded-ads-config-v1.js
          node --check .github/scripts/nexusnova-rewarded-ads-runtime.mjs
          node --check .github/scripts/mining-boost-rules-smoke.mjs
          python3 -m py_compile NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focused test dependencies
        run: |
          npm install --no-save playwright@1.55.0 firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.1
          npx playwright install --with-deps chromium

      - name: Start local NexusNova origin
        shell: bash
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>runtime</title>' > .runtime-origin.html
          python3 -m http.server 4173 > /tmp/nexusnova-mining-boost-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.runtime-origin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-mining-boost-http.log || true
          exit 1

      - name: Run Mining Boost rewarded browser regression
        run: node .github/scripts/nexusnova-rewarded-ads-runtime.mjs

      - name: Run Mining Boost Firestore attack regression
        run: npx firebase emulators:exec --only firestore --project demo-nexusnova-rules "node .github/scripts/mining-boost-rules-smoke.mjs"

      - name: Commit Mining Boost hardening
        run: |
          if git diff --quiet -- firestore.rules js/nexusnova-admob-nexus-pass-v1.js js/nexusnova-rewarded-ads-config-v1.js NexusNovaAndroid/patch_mining_boost_sync.py .github/scripts/mining-boost-rules-smoke.mjs .github/scripts/nexusnova-rewarded-ads-runtime.mjs .github/scripts/firebase-security-readiness.py .github/workflows/nexusnova-android-build.yml; then
            echo 'Mining Boost hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules js/nexusnova-admob-nexus-pass-v1.js js/nexusnova-rewarded-ads-config-v1.js NexusNovaAndroid/patch_mining_boost_sync.py .github/scripts/mining-boost-rules-smoke.mjs .github/scripts/nexusnova-rewarded-ads-runtime.mjs .github/scripts/firebase-security-readiness.py .github/workflows/nexusnova-android-build.yml
          git commit -m 'Disable client-authorized Mining Boost value changes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
