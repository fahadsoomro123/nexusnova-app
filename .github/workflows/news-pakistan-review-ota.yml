name: NexusNova News Pakistan Review OTA

on:
  push:
    branches: [nova-sol57-pro-v128-news-pakistan-fix-v1]
    paths:
      - 'fresh-rebuild/src/features/apps/pakistan-suite.js'
      - 'fresh-rebuild/src/features/apps/news-resilient.js'
      - '.github/workflows/news-pakistan-review-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTECTED_BASE: 6775e7b52c7884dab9017427863e12b8a4770a42
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  validate_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate News and Pakistan fixes only
        shell: bash
        run: |
          set -euo pipefail
          PK=fresh-rebuild/src/features/apps/pakistan-suite.js
          NEWS=fresh-rebuild/src/features/apps/news-resilient.js
          QIBLA=fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js

          node --check "$PK"
          node --check "$NEWS"

          grep -Fq 'function bridgeFeed' "$PK"
          grep -Fq "action:'fetchNews'" "$PK"
          grep -Fq 'async function liveFeed' "$PK"
          grep -Fq 'function pageSize' "$PK"
          grep -Fq 'nx-pk-v5' "$PK"
          grep -Fq 'overflow:hidden' "$PK"
          grep -Fq 'data-pk-prev' "$PK"
          grep -Fq 'data-pk-next' "$PK"
          grep -Fq 'No cached or fabricated headline' "$PK"

          grep -Fq 'function bridgeFeed' "$NEWS"
          grep -Fq "action:'fetchNews'" "$NEWS"
          grep -Fq 'function pageSize' "$NEWS"
          grep -Fq 'nx-news-v5' "$NEWS"
          grep -Fq 'overflow:hidden' "$NEWS"
          grep -Fq 'data-news-prev' "$NEWS"
          grep -Fq 'data-news-next' "$NEWS"
          grep -Fq 'No cached or invented headlines' "$NEWS"

          ! grep -Eq 'localStorage|sessionStorage|CacheStorage|caches\.' "$PK"
          ! grep -Eq 'localStorage|sessionStorage|CacheStorage|caches\.' "$NEWS"

          # User-approved Qibla V5 and assets must remain byte-identical.
          git diff --quiet "$PROTECTED_BASE" "$GITHUB_SHA" -- "$QIBLA"
          git diff --quiet "$PROTECTED_BASE" "$GITHUB_SHA" -- fresh-rebuild/assets/qibla/

          allowed='^(fresh-rebuild/src/features/apps/pakistan-suite\.js|fresh-rebuild/src/features/apps/news-resilient\.js|\.github/workflows/news-pakistan-review-ota\.yml)$'
          unexpected="$(git diff --name-only "$PROTECTED_BASE" "$GITHUB_SHA" | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo 'Unexpected files changed:' >&2; printf '%s\n' "$unexpected" >&2; exit 1; }
          echo 'News + Pakistan scope/syntax/zero-scroll/native-bridge contract: PASS'

      - name: Build differential OTA preserving approved Qibla V5
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"
          rm -rf /tmp/nx-news-pk-ota
          mkdir -p /tmp/nx-news-pk-ota/files

          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ || true)"
          unexpected_deleted="$(printf '%s\n' "$deleted" | sed '/^$/d' | grep -Ev '^fresh-rebuild/src/emergency-sos\.js$' || true)"
          test -z "$unexpected_deleted" || { echo 'Unexpected deleted runtime files:' >&2; printf '%s\n' "$unexpected_deleted" >&2; exit 1; }

          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            mkdir -p "/tmp/nx-news-pk-ota/files/$(dirname "$rel")"
            cp "$full" "/tmp/nx-news-pk-ota/files/$rel"
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)

          test -s /tmp/nx-news-pk-ota/files/src/features/apps/pakistan-suite.js
          test -s /tmp/nx-news-pk-ota/files/src/features/apps/news-resilient.js
          test -s /tmp/nx-news-pk-ota/files/src/features/apps/premium-qibla-safe-v2.js
          test -s /tmp/nx-news-pk-ota/files/assets/qibla/qibla-purple-gold-face.webp
          test -s /tmp/nx-news-pk-ota/files/assets/qibla/qibla-purple-gold-pointer.png

          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/nx-news-pk-ota/files')
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              files.append({'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          paths={x['path'] for x in files}
          required={
            'src/features/apps/pakistan-suite.js',
            'src/features/apps/news-resilient.js',
            'src/features/apps/premium-qibla-safe-v2.js',
            'assets/qibla/qibla-purple-gold-face.webp',
            'assets/qibla/qibla-purple-gold-pointer.png'
          }
          assert required <= paths, required-paths
          assert len(files) <= 2000
          assert sum(x['size'] for x in files) <= 60*1024*1024
          manifest={'schema':2,'base':os.environ['OTA_DIFF_BASE'],'version':os.environ['GITHUB_SHA'],'files':files}
          Path('/tmp/nx-news-pk-ota/manifest.json').write_text(json.dumps(manifest,separators=(',',':'),sort_keys=True),encoding='utf-8')
          print('Review OTA files:',len(files))
          PY

      - name: Require public OTA credential
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: test -n "$PUBLIC_OTA_TOKEN"

      - name: Publish News Pakistan review OTA
        id: publish
        shell: bash
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nx-news-pk-public
          git clone --depth 1 --branch "$PUBLIC_OTA_BRANCH" "https://github.com/$PUBLIC_OTA_REPO.git" /tmp/nx-news-pk-public
          cd /tmp/nx-news-pk-public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf ota && mkdir -p ota
          cp -a /tmp/nx-news-pk-ota/. ota/
          git add -A ota
          git commit -m "Publish News Pakistan review OTA $GITHUB_SHA"
          PUBLIC_SHA="$(git rev-parse HEAD)"
          AUTH="$(printf 'x-access-token:%s' "$PUBLIC_OTA_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$PUBLIC_OTA_BRANCH"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify public OTA end-to-end
        shell: bash
        env:
          PUBLIC_SHA: ${{ steps.publish.outputs.public_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SHA"
          BASE_URL="https://raw.githubusercontent.com/$PUBLIC_OTA_REPO/$PUBLIC_OTA_BRANCH/ota"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL/manifest.json?sha=$PUBLIC_SHA" -o /tmp/public-manifest.json
          python3 - <<'PY'
          import json,os
          m=json.load(open('/tmp/public-manifest.json'))
          assert m['schema']==2
          assert m['version']==os.environ['GITHUB_SHA']
          paths={x['path'] for x in m['files']}
          assert 'src/features/apps/pakistan-suite.js' in paths
          assert 'src/features/apps/news-resilient.js' in paths
          assert 'src/features/apps/premium-qibla-safe-v2.js' in paths
          PY
          for rel in src/features/apps/pakistan-suite.js src/features/apps/news-resilient.js src/features/apps/premium-qibla-safe-v2.js; do
            curl -fsSL --retry 5 --retry-delay 2 "$BASE_URL/files/$rel?sha=$PUBLIC_SHA" -o "/tmp/$(basename "$rel")"
            cmp -s "fresh-rebuild/$rel" "/tmp/$(basename "$rel")"
          done
          echo "PUBLIC_OTA_SHA=$PUBLIC_SHA"
          echo 'News + Pakistan review OTA verified end-to-end: PASS'
