name: NexusNova Actions Push Probe V2

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/actions-probe-v2.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish push probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Actions Probe'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-actions-probe
          git worktree add /tmp/nx-actions-probe origin/apk-builds
          cd /tmp/nx-actions-probe
          printf 'triggered_from=%s\nresult=PASS\n' "$GITHUB_SHA" > actions-push-probe-v2.txt
          git add actions-push-probe-v2.txt
          git commit -m "Record actions push probe $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
