name: NexusNova Actions Push Probe V2

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/actions-probe-v2.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-vpn-disconnect-access-20260825
          fetch-depth: 0
      - name: Apply VPN disconnect accessibility fix
        shell: bash
        run: |
          set -euo pipefail
          bash tools/fix-vpn-disconnect-access.sh
          git config user.name 'NexusNova Android Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt
          git commit -m 'fix(vpn): keep disconnect control above server list'
          git push origin HEAD:nexusnova-vpn-disconnect-access-20260825
      - name: Publish push probe result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin apk-builds
          rm -rf /tmp/nx-actions-probe
          git worktree add /tmp/nx-actions-probe origin/apk-builds
          cd /tmp/nx-actions-probe
          printf 'triggered_from=%s\nresult=PASS\nvpn_fix=APPLIED\n' "$GITHUB_SHA" > actions-push-probe-v2.txt
          git add actions-push-probe-v2.txt
          git commit -m "Record actions push probe $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
