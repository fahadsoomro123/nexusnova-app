name: NexusNova Ad Monetization Guard

on:
  push:
    branches:
      - main
      - codex-final-audit
    paths:
      - 'js/nexusnova-ad-placements-v1.js'
      - 'js/nexusnova-watch-ad-reward-v1.js'
      - 'js/page2.js'
      - 'functions/admobRewardedSsv.js'
      - 'functions/index.js'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/patch_admob.py'
      - 'firebase-public/**'
      - 'firebase.json'
      - '.github/scripts/nexusnova-ad-monetization-smoke.mjs'
      - '.github/workflows/nexusnova-ad-monetization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monetization-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run monetization security regression guard
        run: node .github/scripts/nexusnova-ad-monetization-smoke.mjs
