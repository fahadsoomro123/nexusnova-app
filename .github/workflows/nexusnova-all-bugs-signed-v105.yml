name: NexusNova All Bugs Signed v1.0.5

on:
  push:
    branches: [all-bugs-native-drive-v1, nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - '.github/workflows/nexusnova-all-bugs-signed-v105.yml'
      - 'release-trigger/all-bugs-v105.txt'
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
      - 'scripts/patch-native-drive.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks

jobs:
  verify-build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bugfix source tree
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            all-bugs-native-drive-v1|nexusnova-latest-full-apk-recovery-20260823) ;;
            *) echo "Unexpected build branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          test -s fresh-rebuild/src/runtime-bugfixes-v1.js
          test -s fresh-rebuild/src/features/apps/native-drive-suite.js
          test -s fresh-rebuild/src/features/apps/news-resilient.js
          test -s fresh-rebuild/src/features/apps/articles-suite.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          test -s scripts/patch-native-drive.py
          grep -Fq "nativeDriveRenderers" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "FOREGROUND_SERVICE_LOCATION" NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq "NexusDriveForegroundService" NexusNovaAndroid/app/src/main/AndroidManifest.xml
          node --check fresh-rebuild/src/runtime-bugfixes-v1.js
          node --check fresh-rebuild/src/features/apps/native-drive-suite.js
          node --check fresh-rebuild/src/features/apps/news-resilient.js
          node --check fresh-rebuild/src/features/apps/articles-suite.js
          node --check fresh-rebuild/src/features/apps/app-screen.js

      - name: Stage current Fresh app into Android assets
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp -a fresh-rebuild/. "$WEB/"
          printf 'source_commit=%s\nsource_tree=fresh-rebuild\nrelease=v1.0.5-vc6\n' "$GITHUB_SHA" > "$WEB/NEXUSNOVA_SOURCE.txt"
          test -s "$WEB/src/features/apps/native-drive-suite.js"
          test -s "$WEB/src/runtime-bugfixes-v1.js"

      - name: Wire OTA launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          def ensure(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'OTA anchor missing: {label}')
              s = s.replace(old, new, 1)
          ensure(
              '    private var rendererCrashRecoveries = 0\n',
              '    private var rendererCrashRecoveries = 0\n    private val otaWebManager by lazy { NexusOtaWebManager(this) }\n    private var otaCheckStarted = false\n',
              'fields')
          ensure(
              '                return assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)\n',
              '                return otaWebManager.intercept(uri)\n                    ?: assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)\n',
              'intercept')
          old_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isProductionOrigin(uri) || usingOfflineFallback) return\n                finishedWatchdogToken = mainFrameWatchdogToken\n                scheduleBlankScreenCheck(target, mainFrameWatchdogToken)\n            }\n'''
          new_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isLocalOrigin(uri) || otaCheckStarted) return\n                otaCheckStarted = true\n                otaWebManager.checkForUpdate { updated ->\n                    if (!updated) return@checkForUpdate\n                    runOnUiThread {\n                        if (!isFinishing && !isDestroyed && target === webView) target.reload()\n                    }\n                }\n            }\n'''
          ensure(old_finished, new_finished, 'page finished')
          ensure(
              '                runCatching { target.destroy() }\n\n                if (isFinishing || isDestroyed) return true\n',
              '                runCatching { target.destroy() }\n\n                if (didCrash && otaWebManager.rollbackToBundled()) {\n                    window.decorView.postDelayed({\n                        if (!isFinishing && !isDestroyed) rebuildWebViewAfterRendererExit()\n                    }, RENDERER_CRASH_RECOVERY_DELAY_MS)\n                    return true\n                }\n\n                if (isFinishing || isDestroyed) return true\n',
              'rollback')
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'otaWebManager.checkForUpdate' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Wire native Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          test -s "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.5 vc6 and permanent signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,a=re.subn(r'versionCode\s*=\s*\d+','versionCode = 6',s,count=1)
          s,b=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "1.0.5"',s,count=1)
          if a!=1 or b!=1: raise SystemExit('Version anchors missing')
          block='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s=s.replace('    buildTypes {\n',block+'    buildTypes {\n',1)
          line='            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s=s.replace('        release {\n','        release {\n'+line,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/all-bugs-v105-build.log"

      - name: Verify APK signature and source
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/all-bugs-v105-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/all-bugs-v105-signature.txt"
          unzip -p "$APK" assets/www/NEXUSNOVA_SOURCE.txt | tee "$GITHUB_WORKSPACE/all-bugs-v105-source.txt"
          grep -Fq "source_commit=$GITHUB_SHA" "$GITHUB_WORKSPACE/all-bugs-v105-source.txt"

      - name: Prepare verified APK package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/all-bugs-v105-output"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.5-vc6-ALL-BUGS-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.5-vc6-ALL-BUGS-SIGNED.apk" > "$OUT/SHA256.txt"
          cp all-bugs-v105-build.log "$OUT/build.log"
          cp all-bugs-v105-signature.txt "$OUT/signature.txt"
          cp all-bugs-v105-source.txt "$OUT/source.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.5 vc6 ALL BUGS SIGNED
          Source commit: $GITHUB_SHA
          Fresh UI wiring: PASS
          Native Drive foreground service: PASS
          Native Drive JS bridge: PASS
          News/Articles source validation: PASS
          Speed/Qibla/Dock source validation: PASS
          OTA updater wired: PASS
          Release compile: PASS
          Permanent signature verification: PASS
          RESULT: SIGNED APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.5-vc6-ALL-BUGS-SIGNED
          path: all-bugs-v105-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified package to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v105-publish
          git worktree add /tmp/nx-v105-publish origin/apk-builds
          cd /tmp/nx-v105-publish
          rm -rf all-bugs-v1.0.5-vc6
          mkdir -p all-bugs-v1.0.5-vc6
          cp -a "$GITHUB_WORKSPACE/all-bugs-v105-output"/. all-bugs-v1.0.5-vc6/
          git add -A all-bugs-v1.0.5-vc6
          git commit -m "Publish NexusNova v1.0.5 vc6 all-bugs signed $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
