name: NexusNova Android Build Check

on:
  push:
    branches:
      - main
      - codex-final-audit
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Restore same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Defer Caller ID setup until feature use
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Compile Android debug APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Android-ModernToolchain-AdMob-test-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
