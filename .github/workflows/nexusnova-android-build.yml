name: NexusNova Android UX-Only Build Check

on:
  push:
    branches:
      - 'agent/ux-only-friend-bugs'
    paths:
      - 'NexusNovaAndroid/**'
      - 'js/final-integrity-fix.js'
      - 'js/nexusnova-ux-simplify-v1.js'
      - 'js/nexusnova-speedtest-app-v4.js'
      - 'css/nexusnova-speedtest-app-v4.css'
      - '.github/workflows/nexusnova-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove branch changed only approved UX files
        run: |
          git diff --name-only 0b6b856e25204d40b7172482cd2886ff30e80325...HEAD > /tmp/nx_changed.txt
          cat /tmp/nx_changed.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/nexusnova-android-build.yml|\
              NexusNovaAndroid/patch_ux_only_friend_bugs.py|\
              js/final-integrity-fix.js|\
              js/nexusnova-ux-simplify-v1.js|\
              js/nexusnova-speedtest-app-v4.js|\
              css/nexusnova-speedtest-app-v4.css) ;;
              *) echo "UNAPPROVED CHANGE: $file"; exit 1 ;;
            esac
          done < /tmp/nx_changed.txt

      - name: Prove mining reward wallet auth and backend sources are unchanged
        run: |
          git diff --exit-code 0b6b856e25204d40b7172482cd2886ff30e80325 -- \
            js/rewards-security-v1.js \
            js/nexusnova-admob-nexus-pass-v1.js \
            js/page2-core.js \
            js/wallet-actions-v2.js \
            firestore.rules functions page2.html index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare deterministic Android web shell
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Synchronize existing mining boost countdown state
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply existing Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply existing native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Enforce existing rewarded TEST contract
        run: python3 NexusNovaAndroid/patch_rewarded_test_contract.py

      - name: Apply existing TEST mining reward preview and booster FX
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx.py

      - name: Apply existing TEST reward hardening
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py

      - name: Apply existing TEST cooldown gate
        run: python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Apply existing final-two-hours guard
        run: python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py

      - name: Apply existing authoritative TEST mining timer
        run: python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Apply existing UMP privacy bridge
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore existing same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Apply isolated white-flash premium-exit UX patch
        run: python3 NexusNovaAndroid/patch_ux_only_friend_bugs.py

      - name: Keep existing deferred Caller ID setup
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Keep existing stale WebView reset
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Keep historical native shell startup path
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Verify UX-only contract before compile
        run: |
          grep -q 'nexusnova-ux-simplify-v1.js' NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js
          grep -q 'nexusnova-speedtest-app-v4.js' NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js
          grep -q 'id="nxUxBack"' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ux-simplify-v1.js
          grep -q '← PREVIOUS' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ux-simplify-v1.js
          grep -q 'NEXT PAGE →' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ux-simplify-v1.js
          grep -q 'systemBack:handleSystemBack' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ux-simplify-v1.js
          grep -q "TAB_ID = 'tab-speed-test'" NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-speedtest-app-v4.js
          grep -q 'data-nx-speedtest-v4' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-speedtest-app-v4.js
          grep -q '#tab-tools .nexus-tool-chip\[data-tool="speed"\]' NexusNovaAndroid/app/src/main/assets/www/css/nexusnova-speedtest-app-v4.css
          grep -q '.nx-speed4-gauge' NexusNovaAndroid/app/src/main/assets/www/css/nexusnova-speedtest-app-v4.css
          grep -q 'webView.setBackgroundColor(android.graphics.Color.rgb(0, 18, 25))' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'showNexusExitDialog()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'NEXUSNOVA SYSTEM' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'STAY IN NEXUSNOVA' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'EXIT APP' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'NEXUS_SYSTEM_BACK_SCRIPT' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -q 'moveTaskToBack(true)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Check UX JavaScript syntax
        run: |
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ux-simplify-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-speedtest-app-v4.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js

      - name: Compile Android TEST APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Upload UX-only TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-UX-ONLY-FRIEND-BUGS-TEST-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
