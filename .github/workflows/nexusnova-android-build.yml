name: NexusNova Android Build Check

on:
  push:
    branches:
      - main
      - codex-final-audit
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Compile Android debug APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon
