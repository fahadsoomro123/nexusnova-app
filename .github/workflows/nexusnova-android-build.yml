name: NexusNova Deep-Audit Final Candidate

on:
  push:
    branches:
      - 'agent/ux-only-friend-bugs'
    paths:
      - 'NexusNovaAndroid/**'
      - 'js/final-integrity-fix.js'
      - 'js/nexusnova-ux-simplify-v1.js'
      - 'js/nexusnova-speedtest-app-v4.js'
      - 'js/nexusnova-branding-v1.js'
      - 'js/nexusnova-network-guardian-v1.js'
      - 'css/nexusnova-speedtest-app-v4.css'
      - 'css/nexusnova-branding-v1.css'
      - 'css/nexusnova-network-guardian-v1.css'
      - '.github/workflows/nexusnova-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove branch changed only approved UX files
        run: |
          git diff --name-only 0b6b856e25204d40b7172482cd2886ff30e80325...HEAD > /tmp/nx_changed.txt
          cat /tmp/nx_changed.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/nexusnova-android-build.yml|\
              NexusNovaAndroid/patch_ux_only_friend_bugs.py|\
              NexusNovaAndroid/patch_speedtest_observer_guard.py|\
              NexusNovaAndroid/patch_modern_back_dispatcher.py|\
              NexusNovaAndroid/patch_optional_camera_feature.py|\
              js/final-integrity-fix.js|\
              js/nexusnova-ux-simplify-v1.js|\
              js/nexusnova-speedtest-app-v4.js|\
              js/nexusnova-branding-v1.js|\
              js/nexusnova-network-guardian-v1.js|\
              css/nexusnova-speedtest-app-v4.css|\
              css/nexusnova-branding-v1.css|\
              css/nexusnova-network-guardian-v1.css) ;;
              *) echo "UNAPPROVED CHANGE: $file"; exit 1 ;;
            esac
          done < /tmp/nx_changed.txt

      - name: Prove mining reward wallet auth and backend sources are unchanged
        run: |
          git diff --exit-code 0b6b856e25204d40b7172482cd2886ff30e80325 -- \
            js/rewards-security-v1.js \
            js/nexusnova-admob-nexus-pass-v1.js \
            js/page2-core.js \
            js/wallet-actions-v2.js \
            firestore.rules functions page2.html index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare deterministic Android web shell
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Fix Speed Test observer self-trigger loop
        run: python3 NexusNovaAndroid/patch_speedtest_observer_guard.py

      - name: Synchronize existing mining boost countdown state
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply existing Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply existing native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Enforce existing rewarded TEST contract
        run: python3 NexusNovaAndroid/patch_rewarded_test_contract.py

      - name: Apply existing TEST mining reward preview and booster FX
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx.py

      - name: Apply existing TEST reward hardening
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py

      - name: Apply existing TEST cooldown gate
        run: python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Apply existing final-two-hours guard
        run: python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py

      - name: Apply existing authoritative TEST mining timer
        run: python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Apply existing UMP privacy bridge
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore existing same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Apply isolated white-flash splash-exit premium-speed UX patch
        run: python3 NexusNovaAndroid/patch_ux_only_friend_bugs.py

      - name: Migrate app and browser Back to Android dispatcher
        run: python3 NexusNovaAndroid/patch_modern_back_dispatcher.py

      - name: Declare camera hardware optional
        run: python3 NexusNovaAndroid/patch_optional_camera_feature.py

      - name: Keep existing deferred Caller ID setup
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Keep existing stale WebView reset
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Keep historical native shell startup path
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Verify final UX network and manifest contract before compile
        run: |
          WEB=NexusNovaAndroid/app/src/main/assets/www
          MAIN=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          BROWSER=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/BrowserActivity.kt
          MANIFEST=NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -q 'nexusnova-ux-simplify-v1.js' "$WEB/js/final-integrity-fix.js"
          grep -q 'nexusnova-speedtest-app-v4.js' "$WEB/js/final-integrity-fix.js"
          grep -q 'nexusnova-branding-v1.js' "$WEB/js/final-integrity-fix.js"
          grep -q 'nexusnova-network-guardian-v1.js' "$WEB/js/final-integrity-fix.js"
          grep -q '__nxNetworkGuardianV1' "$WEB/js/nexusnova-network-guardian-v1.js"
          grep -q 'Offline • live features will resume when internet returns' "$WEB/js/nexusnova-network-guardian-v1.js"
          grep -q '.nx-network-guardian-toast' "$WEB/css/nexusnova-network-guardian-v1.css"
          grep -q '__nxBrandingV1' "$WEB/js/nexusnova-branding-v1.js"
          grep -q 'NEXUSNOVA • SECURE UTILITY GRID' "$WEB/js/nexusnova-branding-v1.js"
          grep -q 'nx-brand-mining-seal' "$WEB/js/nexusnova-branding-v1.js"
          grep -q 'brandCoreCards' "$WEB/js/nexusnova-branding-v1.js"
          grep -q 'nx-brand-app-badge' "$WEB/js/nexusnova-branding-v1.js"
          grep -q '.nx-brand-chip' "$WEB/css/nexusnova-branding-v1.css"
          grep -q '.nx-brand-app-badge' "$WEB/css/nexusnova-branding-v1.css"
          grep -q 'id="nxUxBack"' "$WEB/js/nexusnova-ux-simplify-v1.js"
          grep -q '← PREVIOUS' "$WEB/js/nexusnova-ux-simplify-v1.js"
          grep -q 'NEXT PAGE →' "$WEB/js/nexusnova-ux-simplify-v1.js"
          grep -q 'systemBack:handleSystemBack' "$WEB/js/nexusnova-ux-simplify-v1.js"
          grep -q "TAB_ID = 'tab-speed-test'" "$WEB/js/nexusnova-speedtest-app-v4.js"
          grep -q 'data-nx-speedtest-v4' "$WEB/js/nexusnova-speedtest-app-v4.js"
          grep -q "if (label.textContent !== nextLabel) label.textContent = nextLabel;" "$WEB/js/nexusnova-speedtest-app-v4.js"
          grep -q '#tab-tools .nexus-tool-chip\[data-tool="speed"\]' "$WEB/css/nexusnova-speedtest-app-v4.css"
          grep -q '.nx-speed4-gauge' "$WEB/css/nexusnova-speedtest-app-v4.css"
          grep -q 'nx-speed4-premium-launcher-v5' "$WEB/css/nexusnova-speedtest-app-v4.css"
          grep -q 'nxSpeedLauncherGlow' "$WEB/css/nexusnova-speedtest-app-v4.css"
          grep -q 'webView.setBackgroundColor(android.graphics.Color.rgb(0, 18, 25))' "$MAIN"
          grep -q 'showNexusExitDialog()' "$MAIN"
          grep -q 'NEXUSNOVA OS' "$MAIN"
          grep -q 'SUPER APP • SECURE • CONNECTED' "$MAIN"
          grep -q 'STAY IN NEXUSNOVA' "$MAIN"
          grep -q 'EXIT APP' "$MAIN"
          grep -q 'startOrbit(orbitA, 360f, 10000L)' "$MAIN"
          grep -q 'startOrbit(orbitB, -360f, 8000L)' "$MAIN"
          grep -q 'startPulse(halo)' "$MAIN"
          grep -q 'NEXUS_SYSTEM_BACK_SCRIPT' "$MAIN"
          grep -q 'onBackPressedDispatcher.addCallback' "$MAIN"
          grep -q 'handleNexusBackPressed()' "$MAIN"
          grep -q 'onBackPressedDispatcher.addCallback' "$BROWSER"
          grep -q '<uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          grep -q '<uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          ! grep -q 'override fun onBackPressed()' "$MAIN"
          ! grep -q 'override fun onBackPressed()' "$BROWSER"
          ! grep -q 'moveTaskToBack(true)' "$MAIN"

      - name: Check every bundled JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find "$WEB/js" -type f -name '*.js' -print0)

      - name: Deep static HTML and local-reference audit
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter

          root = Path('NexusNovaAndroid/app/src/main/assets/www').resolve()
          targets = [root/'index.html', root/'page2.html', root/'referral.html']

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if data.get('id'): self.ids.append(data['id'])
                  attr = 'src' if tag in {'script','img'} else 'href' if tag == 'link' else None
                  if attr and data.get(attr): self.refs.append(data[attr])

          for html in targets:
              parser=AuditParser(); parser.feed(html.read_text(encoding='utf-8', errors='replace'))
              dup=[key for key,count in Counter(parser.ids).items() if count > 1]
              if dup: raise SystemExit(f'{html.name}: duplicate ids: {dup[:20]}')
              seen=Counter(parser.refs)
              duplicate_refs=[ref for ref,count in seen.items() if count > 1]
              if duplicate_refs: raise SystemExit(f'{html.name}: duplicate local/script references: {duplicate_refs[:20]}')
              for raw in parser.refs:
                  value=raw.strip()
                  if not value or value.startswith(('#','data:','blob:','javascript:','mailto:','tel:')): continue
                  parts=urlsplit(value)
                  if parts.scheme or parts.netloc: continue
                  rel=parts.path
                  if not rel: continue
                  candidate=(html.parent/rel).resolve()
                  try: candidate.relative_to(root)
                  except ValueError: raise SystemExit(f'{html.name}: reference escapes bundle: {value}')
                  if not candidate.exists(): raise SystemExit(f'{html.name}: missing local reference: {value}')
              print(f'{html.name}: {len(parser.ids)} ids, {len(parser.refs)} local/resource refs — PASS')
          PY

      - name: Android lint
        run: gradle -p NexusNovaAndroid :app:lintDebug --stacktrace --no-daemon

      - name: Compile Android final candidate APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Verify compiled APK contains final modules
        run: |
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > /tmp/nx_apk_files.txt
          grep -q 'assets/www/js/nexusnova-network-guardian-v1.js' /tmp/nx_apk_files.txt
          grep -q 'assets/www/css/nexusnova-network-guardian-v1.css' /tmp/nx_apk_files.txt
          grep -q 'assets/www/js/nexusnova-branding-v1.js' /tmp/nx_apk_files.txt
          grep -q 'assets/www/js/nexusnova-speedtest-app-v4.js' /tmp/nx_apk_files.txt
          grep -q 'assets/www/js/nexusnova-ux-simplify-v1.js' /tmp/nx_apk_files.txt
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload deep-audited final candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-DEEP-AUDITED-FINAL-CANDIDATE-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
