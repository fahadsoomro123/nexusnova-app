name: NexusNova Android Build Check

on:
  push:
    branches:
      - main
      - codex-final-audit
    paths:
      - 'NexusNovaAndroid/**'
      - 'index.html'
      - 'page2.html'
      - 'referral.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/nexusnova-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare deterministic Android web shell
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Synchronize mining boost countdown state
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Apply UMP privacy options bridge
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Defer Caller ID setup until feature use
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Reset stale WebView shell once
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Apply deterministic native shell and startup stabilization
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Verify native shell before compile
        run: |
          grep -q 'nxAndroidNativeShellBootstrap' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'window.__nexusInteractiveReady = true' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q '!window.__nexusAndroidShell' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'android-mining-boost-sync-v1' NexusNovaAndroid/app/src/main/assets/www/js/rewards-security-v1.js
          grep -q 'nexusSecureAdoptMiningState' NexusNovaAndroid/app/src/main/assets/www/js/rewards-security-v1.js
          grep -q 'nexusSecureAdoptMiningState(result)' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-admob-nexus-pass-v1.js
          grep -q 'nexusSecureSyncMining?.({ force:true })' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-admob-nexus-pass-v1.js
          grep -q 'NATIVE_SHELL_PATH = "/nexusnova-native/"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'interceptNativeShell' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'scheduleInteractiveShellCheck' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'scheduleNativeAdInitialization' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Compile Android test and production variants
        run: gradle -p NexusNovaAndroid :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify ad, privacy, and recovery build separation
        run: |
          grep -q 'NEXUS_ADS_TEST_MODE' NexusNovaAndroid/app/build.gradle.kts
          grep -q 'ca-app-pub-3940256099942544~3347511713' NexusNovaAndroid/app/build.gradle.kts
          grep -q 'ca-app-pub-5070673529890078~1824799663' NexusNovaAndroid/app/build.gradle.kts
          grep -q 'NexusAdConsentManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'ssvIdentityReady' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -q 'nexusnova:ad-privacy-event' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'showAdPrivacyOptions' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'WEB_SHELL_RECOVERY_EPOCH' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'resetStaleWebShellOnce' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'REWARDED_FALLBACK_STAGGER_MS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -q 'INTERSTITIAL_STARTUP_STAGGER_MS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt

      - name: Upload Android debug TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Android-Stability-TEST-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned production release candidate
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Android-PRODUCTION-unsigned-apk
          path: NexusNovaAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
