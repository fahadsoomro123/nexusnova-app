name: NexusNova Android Launch Smoke

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-android-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build exact TEST APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on Android emulator and reject runtime crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.nexusnova.app
            adb shell monkey -p com.nexusnova.app -c android.intent.category.LAUNCHER 1
            sleep 12
            adb logcat -d -v brief > /tmp/nexusnova-logcat.txt
            cat /tmp/nexusnova-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.nexusnova\.app.*has died|AndroidRuntime.*com\.nexusnova\.app' /tmp/nexusnova-logcat.txt; then
              echo 'NexusNova runtime crash detected.' >&2
              exit 1
            fi
            PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
            if [ -z "$PID" ]; then
              echo 'NexusNova process is not alive after launch.' >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F 'com.nexusnova.app/.MainActivity'
            echo "PASS: NexusNova stayed alive after launch; pid=$PID"
