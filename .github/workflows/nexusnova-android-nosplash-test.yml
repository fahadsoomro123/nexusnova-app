name: NexusNova Android No-Splash TEST

on:
  push:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-android-nosplash-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-nosplash-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android TEST shell
        run: |
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py
          python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_deferred_caller_setup.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_android_disable_blocking_splash.py

      - name: Verify splash cannot block
        run: |
          grep -q 'nx-android-test-no-blocking-html-splash-v1' NexusNovaAndroid/app/src/main/assets/www/index.html
          grep -q 'nx-android-test-no-blocking-html-splash-v1' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'id="nxSplash" aria-hidden="true" style="display:none!important' NexusNovaAndroid/app/src/main/assets/www/index.html
          grep -q 'id="nxSplash" aria-hidden="true" style="display:none!important' NexusNovaAndroid/app/src/main/assets/www/page2.html

      - name: Compile no-splash TEST APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Upload no-splash TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Android-NoSplash-TEST-apk
          path: NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
