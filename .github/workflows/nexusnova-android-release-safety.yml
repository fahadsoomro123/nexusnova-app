name: NexusNova Android Release Safety

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdConsentManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt'
      - '.github/workflows/nexusnova-permanent-signed-release.yml'
      - '.github/scripts/android-release-safety-readiness.py'
      - '.github/workflows/nexusnova-android-release-safety.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release safety audit
        id: audit
        shell: bash
        run: |
          set +e
          python3 .github/scripts/android-release-safety-readiness.py > /tmp/android-release-safety.txt 2>&1
          code=$?
          set -e
          cat /tmp/android-release-safety.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish release safety report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "Source commit: $GITHUB_SHA"
          } >> /tmp/android-release-safety.txt
          git config user.name 'NexusNova Android Safety Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nexusnova-android-safety
          git worktree add /tmp/nexusnova-android-safety origin/apk-builds
          cd /tmp/nexusnova-android-safety
          mkdir -p app-audit
          cp /tmp/android-release-safety.txt app-audit/ANDROID-RELEASE-SAFETY.txt
          git add app-audit/ANDROID-RELEASE-SAFETY.txt
          git commit -m "Audit NexusNova Android release safety $GITHUB_SHA" || exit 0
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Fail on release safety regression
        if: steps.audit.outputs.code != '0'
        run: exit 1
