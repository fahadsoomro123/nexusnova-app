name: NexusNova Apply Known Web Bugfixes

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - '.github/workflows/nexusnova-apply-known-web-bugfixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - name: Apply exact isolated fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          speed = Path('fresh-rebuild/src/features/apps/premium-nova-internet-speed.js')
          text = speed.read_text(encoding='utf-8')
          old = """  const loadPrevious = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(NIS_RESULT_KEY) || 'null');
      if (saved && Number.isFinite(saved.download) && Number.isFinite(saved.upload)) applyResult(saved);
    } catch {}
  };"""
          new = """  const loadPrevious = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(NIS_RESULT_KEY) || 'null');
      if (saved && Number.isFinite(saved.download) && Number.isFinite(saved.upload)) {
        applyResult(saved);
        return saved;
      }
    } catch {}
    return null;
  };"""
          if text.count(old) != 1:
              raise SystemExit(f'Speed loadPrevious anchor count was {text.count(old)}, expected 1')
          text = text.replace(old, new, 1)
          old_init = "  updateOnline(); loadPrevious(); paintMeter(Number(localStorage.getItem(NIS_RESULT_KEY) ? JSON.parse(localStorage.getItem(NIS_RESULT_KEY)).download : 0) || 0, 'DOWNLOAD');"
          new_init = "  updateOnline();\n  const previous = loadPrevious();\n  paintMeter(Number(previous?.download) || 0, 'DOWNLOAD');"
          if text.count(old_init) != 1:
              raise SystemExit(f'Speed init anchor count was {text.count(old_init)}, expected 1')
          speed.write_text(text.replace(old_init, new_init, 1), encoding='utf-8')

          wallet = Path('fresh-rebuild/src/features/apps/core-apps.js')
          text = wallet.read_text(encoding='utf-8')
          old = """  connect.addEventListener('click', () => refresh({ requestAccounts:true }));
  refresh();
  const p = provider();
  p?.on?.('accountsChanged', () => refresh());
  p?.on?.('chainChanged', () => refresh());
  root.__cleanup = () => off?.();
  return root;"""
          new = """  connect.addEventListener('click', () => refresh({ requestAccounts:true }));
  refresh();
  const p = provider();
  const handleAccountsChanged = () => refresh();
  const handleChainChanged = () => refresh();
  p?.on?.('accountsChanged', handleAccountsChanged);
  p?.on?.('chainChanged', handleChainChanged);
  root.__cleanup = () => {
    off?.();
    p?.removeListener?.('accountsChanged', handleAccountsChanged);
    p?.removeListener?.('chainChanged', handleChainChanged);
  };
  return root;"""
          if text.count(old) != 1:
              raise SystemExit(f'Wallet listener anchor count was {text.count(old)}, expected 1')
          wallet.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify diff and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- fresh-rebuild/src/features/apps/premium-nova-internet-speed.js fresh-rebuild/src/features/apps/core-apps.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/core-apps.js

      - name: Commit exact fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Bugfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/premium-nova-internet-speed.js fresh-rebuild/src/features/apps/core-apps.js
          git commit -m 'fix: clean web runtime edge cases'
          git pull --rebase origin nexusnova-latest-full-apk-recovery-20260823
          git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823
