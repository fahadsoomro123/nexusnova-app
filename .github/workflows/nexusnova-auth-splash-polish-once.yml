name: NexusNova Auth Splash Polish Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nexusnova-auth-splash-polish-once.yml'

permissions:
  contents: write

jobs:
  patch-auth-splash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only auth splash timing and mobile position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'var minMs = 3200;' not in s:
              old = 'var minMs = 2800;'
              if old not in s:
                  raise SystemExit('Expected auth splash timing marker not found')
              s = s.replace(old, 'var minMs = 3200;', 1)

          marker = 'nxAuthMobileSplashPolish'
          if marker not in s:
              style = '''\n<style id="nxAuthMobileSplashPolish">\n@media(max-width:700px){\n  #nxSplash{\n    min-height:100dvh!important;\n    padding:max(12px,env(safe-area-inset-top)) 16px calc(7vh + max(18px,env(safe-area-inset-bottom)))!important;\n  }\n}\n</style>\n'''
              if '</head>' not in s:
                  raise SystemExit('index.html head closing tag not found')
              s = s.replace('</head>', style + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit auth splash polish
        run: |
          if git diff --quiet -- index.html; then
            echo "Auth splash already polished"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "polish auth splash timing and mobile position"
          git push
