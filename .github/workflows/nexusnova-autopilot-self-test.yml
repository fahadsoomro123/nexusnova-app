name: NexusNova Autopilot Self-Test

on:
  push:
    paths:
      - "autopilot-e2e-test/**"
      - ".github/workflows/nexusnova-autopilot-self-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-healing-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deterministic transient-failure probe
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_AUTOPILOT_E2E attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" -eq 1 ]; then
            echo "temporary failure: deterministic Autopilot self-healing probe" >&2
            exit 1
          fi
          test -f autopilot-e2e-test/trigger.txt
          echo "Autopilot self-healing probe recovered successfully on rerun."

      - name: Write verification marker
        if: success()
        shell: bash
        run: |
          printf 'Autopilot E2E recovery verified on run %s, attempt %s.\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > AUTOPILOT_E2E_VERIFIED.md
