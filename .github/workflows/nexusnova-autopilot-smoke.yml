name: NexusNova Autopilot Smoke Test

on:
  push:
    paths:
      - "autopilot-smoke/trigger.txt"

permissions:
  contents: write

jobs:
  transient-recovery-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Controlled transient failure / recovery
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUS_AUTOPILOT_SMOKE: temporary failure test; run attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" -eq 1 ]; then
            echo "temporary failure: deliberate first-attempt smoke condition"
            exit 1
          fi
          echo "NEXUS_AUTOPILOT_SMOKE: recovery succeeded on attempt ${GITHUB_RUN_ATTEMPT}"

      - name: Write recovery proof
        if: success()
        shell: bash
        run: |
          cat > autopilot-smoke/RECOVERY_VERIFIED.md <<EOF
          # NexusNova Autopilot Recovery Verified

          - Result: PASS
          - Workflow: NexusNova Autopilot Smoke Test
          - Recovery mechanism: GitHub-free transient-failure rerun
          - First attempt: intentionally failed with `temporary failure`
          - Recovery attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit tested: ${GITHUB_SHA}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autopilot-smoke/RECOVERY_VERIFIED.md
          git commit -m "test(autopilot): record recovery proof"
          git push
