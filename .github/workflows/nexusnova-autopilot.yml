name: NexusNova Autopilot
run-name: NexusNova Autopilot • ${{ inputs.engine || 'AUTO' }}

on:
  workflow_dispatch:
    inputs:
      mission:
        description: "What should Autopilot complete?"
        required: true
        type: string
      branch:
        description: "Branch to work on"
        required: true
        default: "main"
        type: string
      engine:
        description: "Engine: auto selects AI when configured, otherwise GitHub-free"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - github-free
          - ai
  workflow_run:
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: nexusnova-autopilot-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  MAX_AUTOPILOT_REPAIRS: "3"
  MAX_FREE_RERUNS: "2"

jobs:
  auto-heal-failed-workflow:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'NexusNova Autopilot' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout failed workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard repair loop
        shell: bash
        run: |
          set -euo pipefail
          repairs="$(git log -100 --format='%s' | grep -c '^autopilot: repair failed workflow ' || true)"
          echo "Recent Autopilot repair commits on this branch: $repairs"
          if [ "$repairs" -ge "$MAX_AUTOPILOT_REPAIRS" ]; then
            echo "Autopilot safety ceiling reached ($MAX_AUTOPILOT_REPAIRS repairs). Stopping."
            exit 1
          fi

      - name: Collect failure context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --log-failed > /tmp/nexusnova-failure.log || true
          gh run view "$RUN_ID" --json name,conclusion,headBranch,headSha,runAttempt,workflowName > /tmp/nexusnova-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID" > /tmp/nexusnova-workflow.json
          printf '%s\n' "$HEAD_BRANCH" > /tmp/nexusnova-branch.txt
          test -s /tmp/nexusnova-run.json
          test -s /tmp/nexusnova-workflow.json

      - name: Smart engine detection
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "engine=ai" >> "$GITHUB_OUTPUT"
            echo "NEXUS_ENGINE=AI"
          else
            echo "engine=github-free" >> "$GITHUB_OUTPUT"
            echo "NEXUS_ENGINE=GITHUB_FREE"
          fi

      - name: GitHub-free inspect and safe rerun
        if: steps.detect.outputs.engine == 'github-free'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          logs=/tmp/nexusnova-failure.log
          attempt='${{ github.event.workflow_run.run_attempt }}'
          echo "GitHub-free engine selected. Attempt=$attempt"

          if [ "$attempt" -ge "$MAX_FREE_RERUNS" ]; then
            echo "Free rerun ceiling reached ($MAX_FREE_RERUNS)."
            exit 1
          fi

          # Inspect the failure without AI. Retry only when evidence strongly indicates
          # a transient GitHub/runner/network/service failure rather than a source error.
          if grep -Eqi '(rate limit|timed out|timeout|503|502|504|connection reset|connection refused|temporary failure|network is unreachable|failed to download|could not resolve host|runner.*unavailable|service unavailable|no space left on device)' "$logs"; then
            echo "Transient infrastructure signature detected; rerunning failed jobs."
            gh run rerun "$RUN_ID" --failed
          else
            echo "No safe transient signature found. No blind rerun performed."
            exit 1
          fi

      - name: AI autonomous repair
        if: steps.detect.outputs.engine == 'ai'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: /tmp/nexusnova-codex-result.txt
          prompt: |
            You are the NexusNova CI Autopilot repair engineer.

            A GitHub Actions workflow has FAILED. Diagnose the actual root cause from the provided run metadata/logs, inspect the relevant repository files, implement the smallest correct fix, and verify it.

            COST-AWARE RULES:
            - Prefer one coherent root-cause fix over repeated experimentation.
            - Avoid unnecessary repo-wide scans and repeated builds.
            - Once verification passes, stop.

            HARD RULES:
            1. Work only on the checked-out failed workflow branch/commit.
            2. Never expose, print, copy, or modify secrets, signing keys, keystores, tokens, API credentials, or private credentials.
            3. Never disable tests, verification, security checks, or hide failures.
            4. Preserve intended product behavior and architecture.
            5. Run the most relevant tests/build/verification after the fix.
            6. Iterate only when real verification evidence requires another correction.
            7. Do NOT commit or push. Leave correct changes in the working tree.

            RUN METADATA: /tmp/nexusnova-run.json
            WORKFLOW METADATA: /tmp/nexusnova-workflow.json
            FAILED LOGS: /tmp/nexusnova-failure.log
            BRANCH: /tmp/nexusnova-branch.txt

            At the end report root cause, files changed, verification performed, and readiness for rerun.

      - name: Push AI repair and rerun
        if: steps.detect.outputs.engine == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "AI made no source changes; refusing a blind loop."
            exit 1
          fi
          git config user.name "NexusNova Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "autopilot: repair failed workflow ${RUN_ID}"
          git push origin "HEAD:${HEAD_BRANCH}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/dispatches" -f ref="${HEAD_BRANCH}" -f 'inputs[mission]=Autopilot recovery verification after repair' -f "inputs[branch]=${HEAD_BRANCH}" -f 'inputs[engine]=auto'
          echo "AI repair pushed; recovery verification dispatched."

  manual-mission:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Smart engine detection
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.engine }}'
          if [ "$requested" = "github-free" ]; then
            selected=github-free
          elif [ "$requested" = "ai" ] && [ -n "${OPENAI_API_KEY:-}" ]; then
            selected=ai
          elif [ "$requested" = "auto" ] && [ -n "${OPENAI_API_KEY:-}" ]; then
            selected=ai
          else
            selected=github-free
          fi
          echo "engine=$selected" >> "$GITHUB_OUTPUT"
          echo "NEXUS_ENGINE=$selected"

      - name: Run AI autonomous mission
        if: steps.detect.outputs.engine == 'ai'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are NexusNova Autopilot. Complete this mission end-to-end in the checked-out repository:

            ${{ inputs.mission }}

            Inspect the architecture first. Make the smallest robust production-quality change. Run relevant tests/checks/build/verification. Diagnose real failures and fix them. Avoid unnecessary scans and rebuilds. Never expose or modify secrets, credentials, signing keys, keystores, or tokens. Never disable tests or security checks. Do NOT commit or push. Stop when verification genuinely passes or a concrete blocker remains.

            Final report: files changed, root cause, commands run, verification passed, artifact/result, blocker if any.

      - name: Run GitHub-free mission mode
        if: steps.detect.outputs.engine == 'github-free'
        shell: bash
        run: |
          set -euo pipefail
          echo "NexusNova selected GitHub-free mode."
          echo "This mode keeps execution, inspection and safe workflow retry on GitHub-hosted runners without invoking an AI API."
          echo "For autonomous source-code reasoning/fixing, configure the AI engine and use AUTO."

      - name: Push AI mission result
        if: steps.detect.outputs.engine == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "AI mission produced no source changes."
            exit 0
          fi
          git config user.name "NexusNova Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git diff --cached --quiet || git commit -m "autopilot: complete requested mission"
          git push origin "HEAD:${{ inputs.branch }}"
