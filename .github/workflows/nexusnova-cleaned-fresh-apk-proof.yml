name: NexusNova Cleaned Fresh APK Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-cleaned-fresh-apk-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate cleaned owners
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/final-integrity-fix.js
          node --check js/final-integrity-fix-core.js
          node --check js/nexusnova-ad-settings-v2.js
          node --check js/nexusnova-existing-app-ad-hotfix-v2.js
          test ! -e js/nexusnova-existing-app-ad-hotfix-v1.js
          ! grep -Fq 'nexusnova-existing-app-ad-hotfix-v1.js' js/final-integrity-fix.js
          ! grep -Fq 'nexusnova-allapps-experience-v2.js' js/final-integrity-fix-core.js
          grep -Fq 'nexusnova-allapps-experience-v2.js?v=2' js/core-failsafe.js
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' js/final-integrity-fix.js

      - name: Prepare Android shell
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_legal_pages.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_essential_settings_v3.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_nova_vault_10x_ads.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py
          python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Verify staged shell
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          node --check "$WEB/js/final-integrity-fix.js"
          node --check "$WEB/js/final-integrity-fix-core.js"
          node --check "$WEB/js/nexusnova-ad-settings-v2.js"
          test ! -e "$WEB/js/nexusnova-existing-app-ad-hotfix-v1.js"
          test ! -e "$WEB/js/nexusnova-allapps-order-guard-v4.js"
          test ! -e "$WEB/js/ticker-fix.js"
          grep -Fq 'nx-single-startup-owner-v4' "$WEB/js/page2.js"
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' "$WEB/js/final-integrity-fix.js"
          test -s "$WEB/privacy-policy.html"
          test -s "$WEB/account-deletion.html"

      - name: Set build identity
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 116',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.1.6-cleaned-fresh-test"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('version identity update failed')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Assemble APK
        id: assemble
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cp NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk NexusNova-v1.1.6-CleanedFresh-TEST.apk
          sha256sum NexusNova-v1.1.6-CleanedFresh-TEST.apk > NexusNova-v1.1.6-CleanedFresh-TEST.sha256

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.1.6-CleanedFresh-TEST
          path: |
            NexusNova-v1.1.6-CleanedFresh-TEST.apk
            NexusNova-v1.1.6-CleanedFresh-TEST.sha256
          retention-days: 14

      - name: Publish success APK
        id: publish
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-fresh-proof
          git worktree add /tmp/nx-fresh-proof origin/apk-builds
          cp NexusNova-v1.1.6-CleanedFresh-TEST.apk /tmp/nx-fresh-proof/
          cp NexusNova-v1.1.6-CleanedFresh-TEST.sha256 /tmp/nx-fresh-proof/
          APK_SHA=$(awk '{print $1}' NexusNova-v1.1.6-CleanedFresh-TEST.sha256)
          cat > /tmp/nx-fresh-proof/NexusNova-v1.1.6-CleanedFresh-TEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          build_status=success
          validate=${{ steps.validate.outcome }}
          prepare=${{ steps.prepare.outcome }}
          staged=${{ steps.staged.outcome }}
          version=${{ steps.version.outcome }}
          assemble=${{ steps.assemble.outcome }}
          package=${{ steps.package.outcome }}
          upload=${{ steps.upload.outcome }}
          version_code=116
          version_name=1.1.6-cleaned-fresh-test
          base_apk_sha256=0b39e681f4d1baff7c901c22e16acc34fe3141a06890ae7b0cb954d5cf2b8b06
          apk_sha256=${APK_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-fresh-proof/NexusNova-v1.1.6-CleanedFresh-TEST.txt
          cd /tmp/nx-fresh-proof
          git add NexusNova-v1.1.6-CleanedFresh-TEST.apk NexusNova-v1.1.6-CleanedFresh-TEST.sha256 NexusNova-v1.1.6-CleanedFresh-TEST.txt
          git commit -m "Publish v1.1.6 cleaned fresh APK ${GITHUB_SHA}" || true
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Publish failure proof
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-fresh-fail
          git worktree add /tmp/nx-fresh-fail origin/apk-builds
          cat > /tmp/nx-fresh-fail/NexusNova-v1.1.6-CleanedFresh-TEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          build_status=failure
          validate=${{ steps.validate.outcome }}
          prepare=${{ steps.prepare.outcome }}
          staged=${{ steps.staged.outcome }}
          version=${{ steps.version.outcome }}
          assemble=${{ steps.assemble.outcome }}
          package=${{ steps.package.outcome }}
          upload=${{ steps.upload.outcome }}
          base_apk_sha256=0b39e681f4d1baff7c901c22e16acc34fe3141a06890ae7b0cb954d5cf2b8b06
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-fresh-fail/NexusNova-v1.1.6-CleanedFresh-TEST.txt
          cd /tmp/nx-fresh-fail
          git add NexusNova-v1.1.6-CleanedFresh-TEST.txt
          git commit -m "Record v1.1.6 cleaned fresh build failure ${GITHUB_SHA}" || true
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
