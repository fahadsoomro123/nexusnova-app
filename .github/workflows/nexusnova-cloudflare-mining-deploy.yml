name: NexusNova Cloudflare Mining Deploy

on:
  push:
    branches:
      - nova-sol57-pro-v128
    paths:
      - 'cloudflare/nova-mining-rewards-worker/**'
      - '.github/workflows/nexusnova-cloudflare-mining-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-cloudflare-mining-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cloudflare-mining-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v2 Worker syntax and safety markers
        run: |
          node --check cloudflare/nova-mining-rewards-worker/src/index-v2.js
          grep -F "NOVA_MAX_BOOSTER_USES = 2" cloudflare/nova-mining-rewards-worker/src/index-v2.js
          grep -F "NOVA_MAX_RAIN_USES = 4" cloudflare/nova-mining-rewards-worker/src/index-v2.js
          grep -F "novaVaultPending:inv.pendingVaults" cloudflare/nova-mining-rewards-worker/src/index-v2.js
          grep -F "miningActive:true" cloudflare/nova-mining-rewards-worker/src/index-v2.js
          grep -F "ads_do_not_grant_mining_or_token_value" cloudflare/nova-mining-rewards-worker/src/index-v2.js
          if grep -F "WATCH_REWARD_NVX" cloudflare/nova-mining-rewards-worker/src/index-v2.js; then
            echo '::error::Direct ad-to-NVX marker found in Cloudflare v2 worker.'
            exit 1
          fi

      - name: Require deployment and Firestore credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CLOUDFLARE_API_TOKEN is not configured.'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured.'; exit 2; }
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo '::error::Firebase service-account JSON GitHub secret is not configured.'; exit 3; }
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
          assert data.get('client_email'), 'service account client_email missing'
          assert 'BEGIN PRIVATE KEY' in data.get('private_key',''), 'service account private_key missing'
          assert data.get('project_id') == 'nexusnova-6ade2', 'unexpected Firebase project'
          print('Firebase service-account JSON: VALID for nexusnova-6ade2')
          PY

      - name: Verify service account can read Firestore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/datastore']
          )
          creds.refresh(Request())
          project=info['project_id']
          # A deliberately nonexistent, non-reserved document safely tests
          # Firestore document-get IAM. 404 means auth/IAM succeeded.
          url=f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents/users/nexusnova-cloudflare-permission-probe-do-not-create'
          response=requests.get(url, headers={'Authorization': f'Bearer {creds.token}'}, timeout=15)
          if response.status_code not in (200, 404):
              try:
                  err=response.json().get('error', {})
              except Exception:
                  err={}
              print(f'::error::Firestore IAM probe HTTP {response.status_code} status={err.get("status","unknown")}')
              print(f'::error::{str(err.get("message","Firestore access denied"))[:260]}')
              raise SystemExit(4)
          print(f'Firestore service-account document-get probe: PASS (HTTP {response.status_code})')
          PY

      - name: Refresh Cloudflare runtime Firestore credential
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@latest secret put FIREBASE_SERVICE_ACCOUNT_JSON --config cloudflare/nova-mining-rewards-worker/wrangler.toml

      - name: Deploy nova-mining-rewards v2
        run: npx --yes wrangler@latest deploy --config cloudflare/nova-mining-rewards-worker/wrangler.toml

      - name: Verify live Worker health
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          body="$(curl --fail --silent --show-error --max-time 15 https://nova-mining-rewards.fahadsoomro123.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -F '"version":"v2"'
          echo "$body" | grep -F '"functionsDependency":false'
          echo "$body" | grep -F '"serviceAccountReady":true'
