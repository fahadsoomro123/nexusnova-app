name: NexusNova v1.1.5 Dedupe Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-dedupe-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        id: syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/final-integrity-fix.js
          node --check js/final-integrity-fix-core.js
          node --check js/nexusnova-ad-settings-v2.js
          node --check js/nexusnova-existing-app-ad-hotfix-v2.js
          node --check js/core-failsafe.js
          node --check js/nexusnova-page2-core-launch-v2.js
          node --check js/nexusnova-page2-after-core-v2.js

      - name: Validate single runtime owners
        id: owners
        shell: bash
        run: |
          set -euo pipefail
          test ! -e js/nexusnova-existing-app-ad-hotfix-v1.js
          ! grep -Fq 'nexusnova-existing-app-ad-hotfix-v1.js' js/final-integrity-fix.js
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' js/final-integrity-fix.js

          ! grep -Fq 'nexusnova-ad-placements-v1.js' js/final-integrity-fix.js
          ! grep -Fq 'nexusnova-watch-ad-reward-v1.js' js/final-integrity-fix.js
          ! grep -Fq 'nexusnova-nova-vault-v1.js' js/final-integrity-fix.js

          grep -Fq "await import('./nexusnova-ad-placements-v1.js?v=3')" js/nexusnova-page2-after-core-v2.js
          grep -Fq "await import('./nexusnova-watch-ad-reward-v1.js?v=1')" js/nexusnova-page2-after-core-v2.js
          grep -Fq "await import('./nexusnova-ad-privacy-v1.js?v=1')" js/nexusnova-page2-after-core-v2.js
          grep -Fq "await import('./nexusnova-nova-vault-v1.js?v=2')" js/nexusnova-page2-after-core-v2.js
          grep -Fq "await import('./nexusnova-daily-ad-test-v1.js?v=5')" js/nexusnova-page2-core-launch-v2.js

          grep -Fq 'nexusnova-admob-diagnostics-v1.js' js/nexusnova-ad-settings-v2.js
          ! grep -Fq "src:'./js/nexusnova-ad-placements-v1.js" js/nexusnova-ad-settings-v2.js
          ! grep -Fq "src:'./js/nexusnova-watch-ad-reward-v1.js" js/nexusnova-ad-settings-v2.js
          ! grep -Fq "src:'./js/nexusnova-ad-privacy-v1.js" js/nexusnova-ad-settings-v2.js
          ! grep -Fq "src:'./js/nexusnova-daily-ad-test-v1.js" js/nexusnova-ad-settings-v2.js

          grep -Fq 'nexusnova-allapps-experience-v2.js?v=2' js/core-failsafe.js
          ! grep -Fq "loadGuard('./js/nexusnova-allapps-experience-v2.js" js/final-integrity-fix-core.js

      - name: Validate dead files removed
        id: deadfiles
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            js/final-integrity-core.js \
            js/nexusnova-allapps-experience-v1.js \
            js/nexusnova-allapps-order-guard-v4.js \
            js/nexusnova-allapps-order-guard-v6.js \
            js/nexusnova-android-mining-modern-v2.js \
            js/nexusnova-android-ux-repair-v1.js \
            js/nexusnova-page2-bootstrap-v2.js \
            js/nexusnova-premium-settings-v1.js \
            js/ticker-fix.js \
            css/nexusnova-paper-reader-v1.css \
            css/nexusnova-speed-meter-v3.css \
            css/nexusnova-tools-futuristic-v1.css; do
            test ! -e "$file" || { echo "Dead file returned: $file" >&2; exit 1; }
          done

      - name: Regenerate Android web shell and revalidate
        id: android
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          WEB=NexusNovaAndroid/app/src/main/assets/www
          node --check "$WEB/js/final-integrity-fix.js"
          node --check "$WEB/js/final-integrity-fix-core.js"
          node --check "$WEB/js/nexusnova-ad-settings-v2.js"
          test ! -e "$WEB/js/nexusnova-existing-app-ad-hotfix-v1.js"
          test ! -e "$WEB/js/nexusnova-allapps-order-guard-v4.js"
          test ! -e "$WEB/js/ticker-fix.js"
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' "$WEB/js/final-integrity-fix.js"
          ! grep -Fq "loadGuard('./js/nexusnova-allapps-experience-v2.js" "$WEB/js/final-integrity-fix-core.js"

      - name: Publish validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-dedupe-audit
          git worktree add /tmp/nx-dedupe-audit origin/apk-builds
          cat > /tmp/nx-dedupe-audit/NexusNova-v1.1.5-Dedupe-Cleanup.txt <<EOF
          source_commit=${GITHUB_SHA}
          job_status=${{ job.status }}
          syntax=${{ steps.syntax.outcome }}
          owners=${{ steps.owners.outcome }}
          deadfiles=${{ steps.deadfiles.outcome }}
          android_regeneration=${{ steps.android.outcome }}
          canonical_base=c4105cd3f08474aa4212d1f85f7cd8a7eba06c15
          base_apk_sha256=0b39e681f4d1baff7c901c22e16acc34fe3141a06890ae7b0cb954d5cf2b8b06
          EOF
          sed -i 's/^          //' /tmp/nx-dedupe-audit/NexusNova-v1.1.5-Dedupe-Cleanup.txt
          cd /tmp/nx-dedupe-audit
          git add NexusNova-v1.1.5-Dedupe-Cleanup.txt
          git commit -m "Record v1.1.5 dedupe validation ${GITHUB_SHA}" || true
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
