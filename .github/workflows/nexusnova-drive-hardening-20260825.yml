name: NexusNova Drive Hardening 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-drive-hardening-20260825.yml'

permissions:
  contents: write

jobs:
  patch-drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - name: Harden Nova Drive GPS tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('fresh-rebuild/src/features/apps/premium-drive-tools.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('const MAX_GPS_ACCURACY_M = 30;', 'const MAX_GPS_ACCURACY_M = 50;'),
              ('const MAX_FIX_GAP_MS = 8000;', 'const MAX_FIX_GAP_MS = 25000;'),
              ("status.textContent='Waiting for a precise GPS fix…';lastFix=null;ride.speedKmh=0;paint();return;",
               "status.textContent='Waiting for a precise GPS fix…';ride.speedKmh=0;paint();return;"),
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              elif new not in s:
                  raise SystemExit(f'Nova Drive hardening anchor missing: {old[:80]}')

          if 'const MAX_GPS_ACCURACY_M = 50;' not in s:
              raise SystemExit('Nova Drive accuracy hardening not present')
          if 'const MAX_FIX_GAP_MS = 25000;' not in s:
              raise SystemExit('Nova Drive GPS gap hardening not present')
          if "Waiting for a precise GPS fix…';lastFix=null" in s:
              raise SystemExit('Nova Drive still drops last good fix on temporary poor accuracy')

          p.write_text(s, encoding='utf-8')
          print('NOVA_DRIVE_HARDENING=PASS')
          PY

          git config user.name 'NexusNova Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/premium-drive-tools.js
          if git diff --cached --quiet; then
            echo 'No Drive changes needed.'
          else
            git commit -m 'fix: improve Nova Drive distance retention'
            git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823
          fi
