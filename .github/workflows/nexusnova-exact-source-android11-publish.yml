name: NexusNova Exact Source Android 11 Publish

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-exact-source-android11-publish.yml'
      - 'fresh-rebuild/CI-BUILD-TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-exact-source-android11-publish
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark checkout PASS
        shell: bash
        run: echo 'checkout-pass' > CI-STAGE.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mark Python PASS
        shell: bash
        run: echo 'python-pass' > CI-STAGE.txt

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Mark Java PASS
        shell: bash
        run: echo 'java-pass' > CI-STAGE.txt

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Mark Gradle PASS
        shell: bash
        run: echo 'gradle-pass' > CI-STAGE.txt

      - name: Prepare exact fresh rebuild bundle
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'prepare-running' > CI-STAGE.txt
          python NexusNovaAndroid/prepare_fresh_rebuild.py 2>&1 | tee prepare-log.txt
          test -s NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
          echo 'prepare-pass' > CI-STAGE.txt

      - name: Build exact TEST APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          echo 'build-running' > "$GITHUB_WORKSPACE/CI-STAGE.txt"
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'build-pass' > "$GITHUB_WORKSPACE/CI-STAGE.txt"

      - name: Create Android 11 runtime smoke
        shell: bash
        run: |
          echo 'runtime-script-ready' > CI-STAGE.txt
          cat > runtime-smoke.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo 'emulator-script-running' > "$GITHUB_WORKSPACE/CI-STAGE.txt"
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb install -r "$APK" 2>&1 | tee "$GITHUB_WORKSPACE/adb-install.txt"

          echo 'main-running' > "$GITHUB_WORKSPACE/CI-STAGE.txt"
          adb logcat -c
          adb shell am force-stop com.nexusnova.app || true
          adb shell am start -W -n com.nexusnova.app/.MainActivity 2>&1 | tee "$GITHUB_WORKSPACE/main-launch.txt"
          grep -q 'Activity: com.nexusnova.app/.MainActivity' "$GITHUB_WORKSPACE/main-launch.txt"
          sleep 18
          MAIN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$MAIN_PID"
          adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/main-activity-state.txt"
          grep -E -q 'mResumedActivity:.*com\.nexusnova\.app/.MainActivity|topResumedActivity=.*com\.nexusnova\.app/.MainActivity|ResumedActivity:.*com\.nexusnova\.app/.MainActivity' "$GITHUB_WORKSPACE/main-activity-state.txt"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/main-launch-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/main-launch-logcat.txt"; then
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/main-screen.png"
          test -s "$GITHUB_WORKSPACE/main-screen.png"
          echo 'main-pass' > "$GITHUB_WORKSPACE/CI-STAGE.txt"

          echo 'vpn-running' > "$GITHUB_WORKSPACE/CI-STAGE.txt"
          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token 2>&1 | tee "$GITHUB_WORKSPACE/vpn-launch.txt"
          grep -q 'Activity: com.nexusnova.app/.NovaVpnActivity' "$GITHUB_WORKSPACE/vpn-launch.txt"
          sleep 12
          VPN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$VPN_PID"
          adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/vpn-activity-state.txt"
          grep -E -q 'mResumedActivity:.*com\.nexusnova\.app/.NovaVpnActivity|topResumedActivity=.*com\.nexusnova\.app/.NovaVpnActivity|ResumedActivity:.*com\.nexusnova\.app/.NovaVpnActivity' "$GITHUB_WORKSPACE/vpn-activity-state.txt"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/vpn-launch-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/vpn-launch-logcat.txt"; then
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/vpn-screen.png"
          test -s "$GITHUB_WORKSPACE/vpn-screen.png"
          echo 'vpn-pass' > "$GITHUB_WORKSPACE/CI-STAGE.txt"

          {
            echo "RUNTIME_MAIN_PASS pid=$MAIN_PID"
            echo "RUNTIME_VPN_PASS pid=$VPN_PID"
          } > "$GITHUB_WORKSPACE/RUNTIME-SMOKE.txt"
          BASH
          chmod +x runtime-smoke.sh

      - name: Android 11 Main + VPN runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/runtime-smoke.sh"

      - name: Mark runtime PASS
        shell: bash
        run: echo 'runtime-pass' > CI-STAGE.txt

      - name: Package proof bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'package-running' > CI-STAGE.txt
          mkdir -p exact-source-output
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" exact-source-output/NexusNova-Exact-Source-Android11-TEST.apk
          sha256sum exact-source-output/NexusNova-Exact-Source-Android11-TEST.apk > exact-source-output/SHA256.txt
          cp RUNTIME-SMOKE.txt CI-STAGE.txt adb-install.txt main-launch.txt main-activity-state.txt main-launch-logcat.txt main-screen.png vpn-launch.txt vpn-activity-state.txt vpn-launch-logcat.txt vpn-screen.png exact-source-output/
          {
            echo 'NexusNova Exact Source Android 11 TEST APK'
            echo "Source commit: $GITHUB_SHA"
            echo 'Gradle build: PASS'
            echo 'Android 11 MainActivity runtime: PASS'
            echo 'Android 11 NovaVpnActivity runtime: PASS'
            echo 'RESULT: PASS'
          } > exact-source-output/BUILD-STATUS.txt
          echo 'package-pass' > CI-STAGE.txt
          cp CI-STAGE.txt exact-source-output/CI-STAGE.txt

      - name: Upload exact proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-exact-source-android11-proof
          path: exact-source-output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish PASS APK and proof to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Exact Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-exact-publish
          git worktree add /tmp/nx-exact-publish origin/apk-builds
          cd /tmp/nx-exact-publish
          rm -rf exact-source-android11 exact-source-android11-failure
          mkdir -p exact-source-android11
          cp -a "$GITHUB_WORKSPACE/exact-source-output/." exact-source-android11/
          git add -A exact-source-android11 exact-source-android11-failure
          git commit -m "Publish exact Android 11 PASS $GITHUB_SHA"
          git push origin HEAD:apk-builds

      - name: Publish failure diagnostics to apk-builds
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p failure-output
          {
            echo 'NexusNova Exact Source Android 11 workflow failure'
            echo "Source commit: $GITHUB_SHA"
            echo -n 'Last stage: '
            if [ -f CI-STAGE.txt ]; then cat CI-STAGE.txt; else echo 'before-stage-marker'; fi
            echo 'RESULT: FAIL'
          } > failure-output/FAILURE-STATUS.txt
          for f in CI-STAGE.txt prepare-log.txt build-log.txt adb-install.txt main-launch.txt main-activity-state.txt main-launch-logcat.txt vpn-launch.txt vpn-activity-state.txt vpn-launch-logcat.txt; do
            [ -f "$f" ] && cp "$f" failure-output/ || true
          done
          git config user.name 'NexusNova Exact Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          rm -rf /tmp/nx-exact-failure
          git worktree add /tmp/nx-exact-failure origin/apk-builds || exit 0
          cd /tmp/nx-exact-failure
          rm -rf exact-source-android11-failure
          mkdir -p exact-source-android11-failure
          cp -a "$GITHUB_WORKSPACE/failure-output/." exact-source-android11-failure/
          git add -A exact-source-android11-failure
          git commit -m "Publish exact Android 11 FAIL $GITHUB_SHA" || exit 0
          git push origin HEAD:apk-builds || true
