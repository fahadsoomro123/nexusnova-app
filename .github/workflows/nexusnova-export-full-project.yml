name: NexusNova Export Full Project

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths: ['.github/workflows/nexusnova-export-full-project.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact tracked project archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=NexusNova-CURRENT-CLEAN-PROJECT.zip
          git archive --format=zip --output="$ZIP" HEAD
          cat > NEXUSNOVA-DISASTER-HANDOFF.txt <<EOF
          NEXUSNOVA CURRENT CLEAN PROJECT HANDOFF
          Repository: fahadsoomro123/nexusnova-app
          Branch: nexusnova-latest-full-apk-recovery-20260823
          Source commit: $GITHUB_SHA
          Canonical modern app: fresh-rebuild/
          Android project: NexusNovaAndroid/
          Phone-PASS Golden baseline: e6176f721216e3e0c3130c8811a4123bcafce8cc

          CURRENT STATE:
          The Mine/WebView startup crash was fixed and physically confirmed on the user's phone.
          Subsequent work on this branch includes bounded WebView renderer recovery and repository cleanup.

          SOURCE RULE:
          fresh-rebuild/ is the canonical modern app source for APK packaging.
          Do not replace it with the legacy root page2 shell.
          Do not modify Golden backup branches during normal bug-fix work.
          EOF
          zip -q "$ZIP" NEXUSNOVA-DISASTER-HANDOFF.txt
          sha256sum "$ZIP" > NexusNova-CURRENT-CLEAN-PROJECT.sha256
          printf 'source_commit=%s\nbranch=%s\narchive=git-archive-HEAD-plus-disaster-handoff\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > PROJECT-EXPORT-STATUS.txt

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-CURRENT-CLEAN-PROJECT
          path: |
            NexusNova-CURRENT-CLEAN-PROJECT.zip
            NexusNova-CURRENT-CLEAN-PROJECT.sha256
            PROJECT-EXPORT-STATUS.txt
          retention-days: 14

      - name: Publish project ZIP to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Export Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-export
          git worktree add /tmp/nx-export origin/apk-builds
          cd /tmp/nx-export
          rm -rf clean-project-export
          mkdir -p clean-project-export
          cp "$GITHUB_WORKSPACE/NexusNova-CURRENT-CLEAN-PROJECT.zip" clean-project-export/
          cp "$GITHUB_WORKSPACE/NexusNova-CURRENT-CLEAN-PROJECT.sha256" clean-project-export/
          cp "$GITHUB_WORKSPACE/PROJECT-EXPORT-STATUS.txt" clean-project-export/
          git add -A clean-project-export
          git commit -m "Publish current clean NexusNova project export $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
