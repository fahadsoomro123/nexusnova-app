name: NexusNova Golden Disaster Backup Export

on:
  push:
    branches: [nexusnova-golden-export-20260823]
    paths: ['.github/workflows/nexusnova-export-full-project.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact phone-PASS project archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=e6176f721216e3e0c3130c8811a4123bcafce8cc
          ZIP=NexusNova-GOLDEN-PHONE-PASS-20260823.zip
          git archive --format=zip --output="$ZIP" "$SOURCE"
          cat > NEXUSNOVA-GOLDEN-RESTORE.txt <<EOF
          NEXUSNOVA GOLDEN DISASTER BACKUP
          Repository: fahadsoomro123/nexusnova-app
          Golden branch: nexusnova-golden-phone-pass-20260823
          Phone-PASS source commit: $SOURCE
          Canonical modern app: fresh-rebuild/
          Android project: NexusNovaAndroid/
          Physical phone result: Mine crash fixed; app remained open on 23 Aug 2026.
          Restore rule: restore this exact commit/branch first; do not mix partial files from later broken states.
          EOF
          zip -q "$ZIP" NEXUSNOVA-GOLDEN-RESTORE.txt
          sha256sum "$ZIP" > NexusNova-GOLDEN-PHONE-PASS-20260823.sha256
          printf 'source_commit=%s\ngolden_branch=%s\nphone_pass=yes\narchive=git-archive-exact-source-plus-restore-note\n' "$SOURCE" 'nexusnova-golden-phone-pass-20260823' > GOLDEN-BACKUP-STATUS.txt

      - name: Upload golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-GOLDEN-PHONE-PASS-20260823
          path: |
            NexusNova-GOLDEN-PHONE-PASS-20260823.zip
            NexusNova-GOLDEN-PHONE-PASS-20260823.sha256
            GOLDEN-BACKUP-STATUS.txt
          retention-days: 30

      - name: Publish golden ZIP to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Golden Backup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-golden-export
          git worktree add /tmp/nx-golden-export origin/apk-builds
          cd /tmp/nx-golden-export
          rm -rf golden-disaster-backup-20260823
          mkdir -p golden-disaster-backup-20260823
          cp "$GITHUB_WORKSPACE/NexusNova-GOLDEN-PHONE-PASS-20260823.zip" golden-disaster-backup-20260823/
          cp "$GITHUB_WORKSPACE/NexusNova-GOLDEN-PHONE-PASS-20260823.sha256" golden-disaster-backup-20260823/
          cp "$GITHUB_WORKSPACE/GOLDEN-BACKUP-STATUS.txt" golden-disaster-backup-20260823/
          git add -A golden-disaster-backup-20260823
          git commit -m "Publish Golden disaster backup e6176f721216e3e0c3130c8811a4123bcafce8cc"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
