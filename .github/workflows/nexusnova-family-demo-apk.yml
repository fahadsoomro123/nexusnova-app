name: NexusNova Family Demo Stability APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'page2.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'NexusNovaAndroid/**'
      - '.github/scripts/nexusnova-dashboard-splash-deep-test.mjs'
      - '.github/workflows/nexusnova-family-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium startup test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare deterministic Android web shell
        id: prepare
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Apply family demo web stability fixes
        id: family_patch
        run: python3 NexusNovaAndroid/patch_family_demo_web_v1.py

      - name: Correct auth profile helper
        id: auth_helper
        run: python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py

      - name: Apply startup reveal v2 compatibility patch
        id: startup_v2
        run: python3 NexusNovaAndroid/patch_startup_reveal_v2.py

      - name: Apply bounded Android startup escape v3
        id: startup_v3
        run: python3 NexusNovaAndroid/patch_native_startup_escape_v3.py

      - name: Synchronize mining boost countdown state
        id: mining_sync
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply Android viewport lock
        id: viewport
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply native AdMob bridge
        id: admob
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Enforce rewarded test-only production guard
        id: reward_contract
        run: python3 NexusNovaAndroid/patch_rewarded_test_contract.py

      - name: Apply TEST mining reward preview and booster FX
        id: boost_fx
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx.py

      - name: Harden TEST reward cooldown, idempotence, FX timing and safe scroll
        id: boost_hardening
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py

      - name: Enforce TEST cooldown across all boost entry points
        id: boost_cooldown
        run: python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Prevent wasted TEST boost ads in final two hours
        id: boost_final2h
        continue-on-error: true
        run: python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py

      - name: Enforce single-owner authoritative TEST mining timer
        id: boost_timer
        continue-on-error: true
        run: python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Apply UMP privacy options bridge
        id: privacy
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore same-device session
        id: session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Defer Caller ID setup until feature use
        id: caller
        continue-on-error: true
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Reset stale remote WebView shell once
        id: reset_shell
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Apply deterministic native shell
        id: native_shell
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Add native WebView splash release independent of page JavaScript
        id: native_splash_v4
        run: python3 NexusNovaAndroid/patch_native_splash_release_v4.py

      - name: Disable reload/fallback bounce for packaged native shell
        id: no_bounce
        run: python3 NexusNovaAndroid/patch_native_no_bounce_v1.py

      - name: Remove Android post-login blocking overlays only
        id: dashboard_lockfix
        shell: bash
        run: |
          set -euo pipefail
          sha256sum NexusNovaAndroid/app/src/main/assets/www/index.html | awk '{print $1}' > /tmp/nx-signin-before.sha
          python3 - <<'PY'
          from pathlib import Path

          root = Path('NexusNovaAndroid/app/src/main/assets/www')
          page_path = root / 'page2.html'
          launcher_path = root / 'js/page2.js'
          gradle_path = Path('NexusNovaAndroid/app/build.gradle.kts')
          page = page_path.read_text(encoding='utf-8')
          launcher = launcher_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          # Dashboard only. index.html / the approved sign-in screen is untouched.
          old = '<div id="nxSplash" aria-hidden="false">'
          new = '<!-- nx-android-dashboard-startup-lockfix-v1 -->\n<div id="nxSplash" aria-hidden="true" style="display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important">'
          if old not in page:
              old = '<div id="nxSplash" aria-hidden="true">'
          if old not in page:
              raise SystemExit('Dashboard splash markup not found')
          page = page.replace(old, new, 1)

          # Never flash fabricated default mining values while Firestore restores.
          page = page.replace('<div class="balance-amount" id="balance">0.0000</div>', '<div class="balance-amount" id="balance">—</div>', 1)
          page = page.replace('<div class="balance-usd" id="usdValue">$ 0.00 USD</div>', '<div class="balance-usd" id="usdValue">SYNCING SECURE BALANCE</div>', 1)
          page = page.replace('<span id="btnText">START MINING</span>', '<span id="btnText">SYNCING MINING</span>', 1)
          page = page.replace('        MINER OFFLINE\n', '        CHECKING SECURE SESSION\n', 1)

          # The current launcher can create a second full-screen readiness shield.
          # Suppress only that overlay in the packaged Android dashboard.
          if 'nx-android-dashboard-no-secondary-shield-v1' not in launcher:
              anchor = '  function installShield() {\n'
              block = '''  function installShield() {\n    // nx-android-dashboard-no-secondary-shield-v1\n    const androidDashboard = window.__nexusAndroidShell === true || location.pathname.startsWith('/nexusnova-native/') || new URLSearchParams(location.search).get('nxAndroid') === '1';\n    if (androidDashboard) {\n      const oldSplash = document.getElementById('nxSplash');\n      if (oldSplash) {\n        oldSplash.style.setProperty('display','none','important');\n        oldSplash.style.setProperty('visibility','hidden','important');\n        oldSplash.style.setProperty('opacity','0','important');\n        oldSplash.style.setProperty('pointer-events','none','important');\n      }\n      return;\n    }\n'''
              if anchor not in launcher:
                  raise SystemExit('Secondary startup shield anchor missing')
              launcher = launcher.replace(anchor, block, 1)

          # Distinguish this build from the two failed startup APKs.
          gradle = gradle.replace('versionCode = 4', 'versionCode = 5', 1)
          gradle = gradle.replace('versionName = "1.1.2-startup-escape"', 'versionName = "1.1.3-deep-startup"', 1)

          page_path.write_text(page, encoding='utf-8')
          launcher_path.write_text(launcher, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          PY
          sha256sum NexusNovaAndroid/app/src/main/assets/www/index.html | awk '{print $1}' > /tmp/nx-signin-after.sha
          cmp /tmp/nx-signin-before.sha /tmp/nx-signin-after.sha
          echo 'Target startup patch left the sign-in document byte-for-byte unchanged.'

      - name: Verify deep startup contract before runtime test
        id: verify
        run: |
          python3 -m py_compile NexusNovaAndroid/patch_family_demo_web_v1.py NexusNovaAndroid/patch_family_auth_recursion_fix.py NexusNovaAndroid/patch_startup_reveal_v2.py NexusNovaAndroid/patch_native_startup_escape_v3.py NexusNovaAndroid/patch_native_splash_release_v4.py NexusNovaAndroid/patch_native_no_bounce_v1.py
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-auth-page-v2.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-core-launch-v2.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-after-core-v2.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/page2.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-account-deletion-settings-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/rewards-security-v1.js
          grep -q 'nx-family-auth-persistence-v1' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-auth-page-v2.js
          grep -q 'await createUserProfile(user);' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-auth-page-v2.js
          grep -q 'nx-family-dashboard-persistence-v1' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-core-launch-v2.js
          grep -q 'nx-family-presentation-first-v1' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-after-core-v2.js
          grep -q 'nx-android-dashboard-startup-lockfix-v1' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'id="nxSplash" aria-hidden="true" style="display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important"' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'nx-android-dashboard-no-secondary-shield-v1' NexusNovaAndroid/app/src/main/assets/www/js/page2.js
          grep -q 'id="balance">—</div>' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'SYNCING SECURE BALANCE' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'SYNCING MINING' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'CHECKING SECURE SESSION' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'NexusNova Essential Settings v3' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-account-deletion-settings-v1.js
          grep -q 'account-deletion.html' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-account-deletion-settings-v1.js
          grep -q 'privacy-policy.html' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-account-deletion-settings-v1.js
          grep -q 'nx-native-no-bounce-v1' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'NATIVE_SHELL_PATH = "/nexusnova-native/"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'scheduleNativeSplashRelease(target) // nx-native-splash-release-v4' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(2_600L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(4_800L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(8_000L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'versionCode = 5' NexusNovaAndroid/app/build.gradle.kts
          grep -q 'versionName = "1.1.3-deep-startup"' NexusNovaAndroid/app/build.gradle.kts

      - name: Start exact prepared Android shell locally
        id: server
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/nexusnova-startup-deep-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/NexusNovaAndroid/app/src/main/assets/www/page2.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-startup-deep-http.log || true
          exit 1

      - name: Deep runtime - no helper may hide the splash
        id: deep_runtime
        run: node .github/scripts/nexusnova-dashboard-splash-deep-test.mjs

      # IMPORTANT: APK compilation is after the non-cheating runtime regression.
      # If splash/dashboard startup fails, no v1.1.3 APK is produced.
      - name: Compile signed TEST APK only after startup PASS
        id: compile
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare named APK
        id: name_apk
        run: |
          cp NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk NexusNova-v1.1.3-DeepStartup-TEST.apk
          test -s NexusNova-v1.1.3-DeepStartup-TEST.apk

      - name: Upload deep-startup TEST APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.1.3-DeepStartup-TEST
          path: NexusNova-v1.1.3-DeepStartup-TEST.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and deep startup status to apk-builds branch
        if: always()
        run: |
          git config user.name "NexusNova Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin apk-builds
          git worktree add /tmp/nexusnova-apk-publish origin/apk-builds
          if [ -s NexusNova-v1.1.3-DeepStartup-TEST.apk ]; then
            cp NexusNova-v1.1.3-DeepStartup-TEST.apk /tmp/nexusnova-apk-publish/NexusNova-v1.1.3-DeepStartup-TEST.apk
            APK_STATE=present
          else
            APK_STATE=missing
          fi
          cat > /tmp/nexusnova-apk-publish/NexusNova-v1.1.3-DeepStartup-TEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          job_status=${{ job.status }}
          apk=${APK_STATE}
          prepare=${{ steps.prepare.outcome }}
          family_patch=${{ steps.family_patch.outcome }}
          auth_helper=${{ steps.auth_helper.outcome }}
          startup_v2=${{ steps.startup_v2.outcome }}
          startup_v3=${{ steps.startup_v3.outcome }}
          mining_sync=${{ steps.mining_sync.outcome }}
          viewport=${{ steps.viewport.outcome }}
          admob=${{ steps.admob.outcome }}
          reward_contract=${{ steps.reward_contract.outcome }}
          boost_fx=${{ steps.boost_fx.outcome }}
          boost_hardening=${{ steps.boost_hardening.outcome }}
          boost_cooldown=${{ steps.boost_cooldown.outcome }}
          boost_final2h=${{ steps.boost_final2h.outcome }}
          boost_timer=${{ steps.boost_timer.outcome }}
          privacy=${{ steps.privacy.outcome }}
          session=${{ steps.session.outcome }}
          caller=${{ steps.caller.outcome }}
          reset_shell=${{ steps.reset_shell.outcome }}
          native_shell=${{ steps.native_shell.outcome }}
          native_splash_v4=${{ steps.native_splash_v4.outcome }}
          no_bounce=${{ steps.no_bounce.outcome }}
          dashboard_lockfix=${{ steps.dashboard_lockfix.outcome }}
          verify=${{ steps.verify.outcome }}
          server=${{ steps.server.outcome }}
          deep_runtime=${{ steps.deep_runtime.outcome }}
          compile=${{ steps.compile.outcome }}
          name_apk=${{ steps.name_apk.outcome }}
          upload=${{ steps.upload.outcome }}
          sign_in_target_patch=untouched-by-hash
          runtime_external_network=blocked
          runtime_test_manual_splash_release=no
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nexusnova-apk-publish/NexusNova-v1.1.3-DeepStartup-TEST.txt
          cd /tmp/nexusnova-apk-publish
          git add NexusNova-v1.1.3-DeepStartup-TEST.txt
          if [ -f NexusNova-v1.1.3-DeepStartup-TEST.apk ]; then git add NexusNova-v1.1.3-DeepStartup-TEST.apk; fi
          git commit -m "DeepStartup APK status ${GITHUB_SHA}" || true
          git push origin HEAD:apk-builds
