name: NexusNova Legacy APK Build - Manual Hold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Final-gate hold
        run: |
          echo 'Legacy automatic APK publishing is intentionally disabled.'
          echo 'Build only after the current startup, Nova Vault 10x, ads, Settings, sign-in hash and Kotlin gates all pass.'
