name: NexusNova v1.1.4 Final Gate TEST APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-final-gated-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-final-gated-apk
  cancel-in-progress: true

jobs:
  final-gated-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve approved sign-in source hash
        id: signin_before
        shell: bash
        run: |
          set -euo pipefail
          sha256sum index.html | awk '{print $1}' > /tmp/nx-final-signin-before.sha
          echo "source_commit=${GITHUB_SHA}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install focused runtime test dependencies
        id: deps
        run: |
          npm install --no-save playwright@1.55.0 firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.1
          npx playwright install --with-deps chromium

      - name: Source syntax and root-fix contracts
        id: source_contract
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nexusnova-existing-app-ad-hotfix-v2.js
          node --check js/final-integrity-fix.js
          node --check js/nexusnova-nova-vault-10x-v1.js
          node --check js/nexusnova-hub-ad-gate-v1.js
          node --check js/nexusnova-account-deletion-settings-v1.js
          node --check functions/index.js
          node --check functions/novaVault10x.js
          node --check functions/admobRewardedSsvV2.js
          node --check .github/scripts/nova-vault-10x-runtime.mjs
          node --check .github/scripts/nova-vault-10x-rules-smoke.mjs
          node --check .github/scripts/nexusnova-settings-essential-runtime.mjs
          node --check .github/scripts/nexusnova-dashboard-splash-deep-test.mjs
          grep -Fq 'if (button.id !== WATCH_BUTTON_ID) button.id = WATCH_BUTTON_ID;' js/nexusnova-existing-app-ad-hotfix-v2.js
          grep -Fq "if (button.getAttribute('onclick') !== 'watchAdReward()')" js/nexusnova-existing-app-ad-hotfix-v2.js
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' js/final-integrity-fix.js
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' sw.js
          grep -Fq 'nexusnova-nova-vault-10x-v1.js?v=1' js/nexusnova-page2-after-core-v2.js
          grep -Fq 'nexusnova-hub-ad-gate-v1.js?v=1' js/nexusnova-page2-after-core-v2.js
          grep -Fq 'NexusNova Essential Settings v3' js/nexusnova-account-deletion-settings-v1.js
          echo 'PASS source/root-fix contracts.'

      - name: Python patch syntax contracts
        id: patch_syntax
        run: |
          python3 -m py_compile \
            NexusNovaAndroid/prepare_native_web_shell.py \
            NexusNovaAndroid/patch_legal_pages.py \
            NexusNovaAndroid/patch_family_demo_web_v1.py \
            NexusNovaAndroid/patch_essential_settings_v3.py \
            NexusNovaAndroid/patch_family_auth_recursion_fix.py \
            NexusNovaAndroid/patch_startup_reveal_v2.py \
            NexusNovaAndroid/patch_native_startup_escape_v3.py \
            NexusNovaAndroid/patch_mining_boost_sync.py \
            NexusNovaAndroid/patch_viewport.py \
            NexusNovaAndroid/patch_admob.py \
            NexusNovaAndroid/patch_nova_vault_10x_ads.py \
            NexusNovaAndroid/patch_rewarded_test_contract.py \
            NexusNovaAndroid/patch_test_boost_reward_fx.py \
            NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py \
            NexusNovaAndroid/patch_test_boost_cooldown_gate.py \
            NexusNovaAndroid/patch_ad_privacy.py \
            NexusNovaAndroid/patch_session_restore.py \
            NexusNovaAndroid/patch_web_shell_reset.py \
            NexusNovaAndroid/patch_native_shell.py \
            NexusNovaAndroid/patch_native_splash_release_v4.py \
            NexusNovaAndroid/patch_native_no_bounce_v1.py \
            NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Start local proof server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/nx-final-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.github/fixtures/runtime-origin.html >/dev/null; then
              echo 'PASS local proof server.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nx-final-http.log || true
          exit 1

      - name: Source runtime - Nova Vault10x ads and observer regression
        id: vault_runtime
        run: node .github/scripts/nova-vault-10x-runtime.mjs

      - name: Source runtime - essential Settings and Delete Account
        id: settings_source
        run: node .github/scripts/nexusnova-settings-essential-runtime.mjs

      - name: Firestore attack tests for 10x credits
        id: rules
        run: npx firebase emulators:exec --only firestore --project demo-nexusnova-finalgate "node .github/scripts/nova-vault-10x-rules-smoke.mjs"

      - name: Prepare exact proven Android shell
        id: prepare_android
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_legal_pages.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_essential_settings_v3.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_nova_vault_10x_ads.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py
          python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Set final TEST build identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 114', text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.1.4-finalgate-test"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not set final TEST build identity')
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq 'versionCode = 114' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.4-finalgate-test"' NexusNovaAndroid/app/build.gradle.kts

      - name: Verify staged Android root fix features and legal contracts
        id: native_static
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          grep -Fq 'nx-android-dashboard-startup-lockfix-v1' "$WEB/page2.html"
          grep -Fq 'nx-android-dashboard-no-secondary-shield-v1' "$WEB/js/page2.js"
          grep -Fq 'if (button.id !== WATCH_BUTTON_ID) button.id = WATCH_BUTTON_ID;' "$WEB/js/nexusnova-existing-app-ad-hotfix-v2.js"
          grep -Fq "if (button.getAttribute('onclick') !== 'watchAdReward()')" "$WEB/js/nexusnova-existing-app-ad-hotfix-v2.js"
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' "$WEB/js/final-integrity-fix.js"
          grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1' "$WEB/sw.js"
          grep -Fq 'nexusnova-nova-vault-10x-v1.js?v=1' "$WEB/js/nexusnova-page2-after-core-v2.js"
          grep -Fq 'nexusnova-hub-ad-gate-v1.js?v=1' "$WEB/js/nexusnova-page2-after-core-v2.js"
          grep -Fq 'NexusNova Essential Settings v3' "$WEB/js/nexusnova-account-deletion-settings-v1.js"
          grep -Fq 'nxAccountDeletionSettingsRow' "$WEB/js/nexusnova-account-deletion-settings-v1.js"
          grep -Fq 'REWARD_PURPOSE_VAULT_10X' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'nova-vault-10x' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'ssvIdentityReady' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'INTERSTITIAL_ALLOWED_FEATURES' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          test -s "$WEB/privacy-policy.html"
          test -s "$WEB/account-deletion.html"
          echo 'PASS staged Android root fix/features/legal contracts.'

      - name: Runtime - staged Android essential Settings
        id: settings_staged
        env:
          NX_SETTINGS_SCRIPT_PATH: /NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-account-deletion-settings-v1.js
          NX_SETTINGS_LABEL: final-staged-android
        run: node .github/scripts/nexusnova-settings-essential-runtime.mjs

      - name: Deep Android startup proof with external network blocked
        id: startup_runtime
        run: node .github/scripts/nexusnova-dashboard-splash-deep-test.mjs

      - name: Prove sign-in source remained byte-for-byte untouched
        id: signin_after
        shell: bash
        run: |
          set -euo pipefail
          sha256sum index.html | awk '{print $1}' > /tmp/nx-final-signin-after.sha
          cmp /tmp/nx-final-signin-before.sha /tmp/nx-final-signin-after.sha
          echo 'PASS sign-in source untouched by final build preparation.'

      - name: Compile native Kotlin after all runtime gates
        id: kotlin
        run: gradle -p NexusNovaAndroid :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Assemble final TEST APK only after every proof gate
        id: assemble
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Verify actual APK contains the proven startup and feature fixes
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/www/js/nexusnova-existing-app-ad-hotfix-v2.js | grep -Fq 'if (button.id !== WATCH_BUTTON_ID) button.id = WATCH_BUTTON_ID;'
          unzip -p "$APK" assets/www/js/nexusnova-existing-app-ad-hotfix-v2.js | grep -Fq "if (button.getAttribute('onclick') !== 'watchAdReward()')"
          unzip -p "$APK" assets/www/js/final-integrity-fix.js | grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1'
          unzip -p "$APK" assets/www/sw.js | grep -Fq 'nexusnova-existing-app-ad-hotfix-v2.js?v=20260819-observerfix1'
          unzip -p "$APK" assets/www/page2.html | grep -Fq 'nx-android-dashboard-startup-lockfix-v1'
          unzip -p "$APK" assets/www/js/page2.js | grep -Fq 'nx-android-dashboard-no-secondary-shield-v1'
          unzip -p "$APK" assets/www/js/nexusnova-page2-after-core-v2.js | grep -Fq 'nexusnova-nova-vault-10x-v1.js?v=1'
          unzip -p "$APK" assets/www/js/nexusnova-page2-after-core-v2.js | grep -Fq 'nexusnova-hub-ad-gate-v1.js?v=1'
          unzip -p "$APK" assets/www/js/nexusnova-account-deletion-settings-v1.js | grep -Fq 'NexusNova Essential Settings v3'
          unzip -p "$APK" assets/www/js/nexusnova-nova-vault-10x-v1.js | grep -Fq "const PURPOSE = 'nova-vault-10x'"
          sha256sum "$APK" | tee /tmp/nx-final-apk.sha256
          echo 'PASS actual APK contains proven startup/Vault10x/ads/Settings fixes.'

      - name: Name final TEST APK
        id: name_apk
        shell: bash
        run: |
          set -euo pipefail
          cp NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk NexusNova-v1.1.4-FinalGate-TEST.apk
          test -s NexusNova-v1.1.4-FinalGate-TEST.apk

      - name: Upload final gated TEST APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.1.4-FinalGate-TEST
          path: NexusNova-v1.1.4-FinalGate-TEST.apk
          if-no-files-found: error

      - name: Publish successful final APK and proof status to apk-builds
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Final Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-final-apk-publish
          git worktree add /tmp/nx-final-apk-publish origin/apk-builds
          cp NexusNova-v1.1.4-FinalGate-TEST.apk /tmp/nx-final-apk-publish/NexusNova-v1.1.4-FinalGate-TEST.apk
          APK_SHA=$(sha256sum NexusNova-v1.1.4-FinalGate-TEST.apk | awk '{print $1}')
          cat > /tmp/nx-final-apk-publish/NexusNova-v1.1.4-FinalGate-TEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          job_status=success
          apk=present
          source_contract=success
          patch_syntax=success
          vault_runtime=success
          settings_source=success
          firestore_rules=success
          prepare_android=success
          native_static=success
          settings_staged=success
          startup_runtime=success
          external_network_during_startup_test=blocked
          runtime_test_manual_splash_release=no
          signin_source=untouched-by-hash
          kotlin=success
          assemble=success
          apk_verify=success
          upload=success
          version_code=114
          version_name=1.1.4-finalgate-test
          ads_mode=debug-test-inventory
          test_rewarded_value_changes=forbidden
          apk_sha256=${APK_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-final-apk-publish/NexusNova-v1.1.4-FinalGate-TEST.txt
          cd /tmp/nx-final-apk-publish
          git add NexusNova-v1.1.4-FinalGate-TEST.apk NexusNova-v1.1.4-FinalGate-TEST.txt
          git commit -m "FinalGate TEST APK ${GITHUB_SHA}"
          git push origin HEAD:apk-builds
