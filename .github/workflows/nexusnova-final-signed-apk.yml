name: NexusNova Final Signed APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      TRAVEL_SOURCE_SHA: 5677f071d8c5af6b66a0b2ad89847854978c291d

    steps:
      - name: Checkout Travel runtime source with OTA engine
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TRAVEL_SOURCE_SHA }}
          path: build-src
          fetch-depth: 1

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Verify Travel runtime and OTA engine
        shell: bash
        run: |
          set -euo pipefail
          test -s build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -s build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'private val otaWebManager by lazy' build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'checkForWebUpdate()' build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'const val MANIFEST_SCHEMA = 2' build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'const val MANIFEST_URL = "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/manifest.json"' build-src/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -s build-src/fresh-rebuild/index.html
          test -s build-src/fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          node --check build-src/fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          grep -Fq 'travel-phone-layout-v31.js?ota=travel-v31-final-owner' build-src/fresh-rebuild/index.html
          grep -Fq 'nova-drive-gold-maptiler-v14-production.js' build-src/fresh-rebuild/src/nova-vehicle-premium-ui.js

      - name: Restore known production auth and Firebase config
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Apply production auth to packaged workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js build-src/fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js build-src/fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json build-src/NexusNovaAndroid/app/google-services.json
          grep -q 'waitForFirebaseUser' build-src/fresh-rebuild/src/core/firebase-backend.js
          grep -q 'signInWithEmailAndPassword' build-src/fresh-rebuild/src/core/auth-service.js
          ! grep -q 'PUBLIC_DISABLED_ERROR' build-src/fresh-rebuild/src/core/firebase-backend.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Configure release signing and upgrade version
        shell: bash
        working-directory: build-src/NexusNovaAndroid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 27000041', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.41-travel-ota"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version injection failed')
          signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature, upgrade version and OTA payload
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          badging="$($AAPT dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='27000041'"
          echo "$badging" | grep -q "versionName='1.0.41-travel-ota'"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" \
            'assets/www/index.html' \
            'assets/www/src/features/apps/travel-phone-layout-v31.js' \
            'assets/www/src/nova-vehicle-premium-ui.js' \
            'assets/www/src/core/firebase-backend.js' \
            'assets/www/src/core/auth-service.js' -d "$d"
          grep -Fq 'travel-phone-layout-v31.js?ota=travel-v31-final-owner' "$d/assets/www/index.html"
          grep -Fq 'nova-drive-gold-maptiler-v14-production.js' "$d/assets/www/src/nova-vehicle-premium-ui.js"
          grep -q 'waitForFirebaseUser' "$d/assets/www/src/core/firebase-backend.js"
          grep -q 'signInWithEmailAndPassword' "$d/assets/www/src/core/auth-service.js"

      - name: Package verified release
        working-directory: build-src/NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp app/build/outputs/apk/release/app-release.apk signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-OTA.apk
          sha256sum signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-OTA.apk > signed-output/NexusNova-v1.0.41-SIGNED-TRAVEL-OTA.apk.sha256
          printf '%s\n' "$TRAVEL_SOURCE_SHA" > signed-output/PUBLIC-SOURCE-SHA.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.41-SIGNED-TRAVEL-OTA
          path: build-src/NexusNovaAndroid/signed-output/*
          if-no-files-found: error
          retention-days: 14
