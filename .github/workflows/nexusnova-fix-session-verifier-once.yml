name: NexusNova Fix Session Verifier Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-fix-session-verifier-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update verifier ownership and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/patch_session_restore.py')
          s=p.read_text(encoding='utf-8')
          old_path="integrity_path = Path('NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js')\n"
          new_path=old_path + "after_core_path = Path('NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-after-core-v2.js')\n"
          if 'after_core_path =' not in s:
              if old_path not in s: raise SystemExit('integrity path anchor missing')
              s=s.replace(old_path,new_path,1)
          old="""for token in [
    'nexusnova-ux-simplify-v1.js',
    'nexusnova-existing-app-ad-hotfix-v2.js',
    'nexusnova-ad-placements-v1.js',
    'nexusnova-watch-ad-reward-v1.js',
    'nexusnova-speedtest-app-v4.js',
]:
    if token not in integrity:
        raise SystemExit('Android recent loader missing: ' + token)
"""
          new="""for token in [
    'nexusnova-ux-simplify-v1.js',
    'nexusnova-existing-app-ad-hotfix-v2.js',
    'nexusnova-speedtest-app-v4.js',
]:
    if token not in integrity:
        raise SystemExit('Android recent loader missing: ' + token)

# Clean single-owner architecture: ad placements and Watch Ad are owned by the
# post-core bootstrap, not final-integrity-fix.js. Verify the real owner instead
# of requiring duplicate loader references.
if not after_core_path.exists():
    raise SystemExit('Android post-core loader missing from bundled shell')
after_core = after_core_path.read_text(encoding='utf-8')
for token in [
    'nexusnova-ad-placements-v1.js',
    'nexusnova-watch-ad-reward-v1.js',
]:
    if token not in after_core:
        raise SystemExit('Android post-core loader missing: ' + token)
"""
          if old not in s:
              raise SystemExit('legacy loader verifier block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile NexusNovaAndroid/patch_session_restore.py
          grep -Fq 'after_core_path' NexusNovaAndroid/patch_session_restore.py
          grep -Fq 'Clean single-owner architecture' NexusNovaAndroid/patch_session_restore.py
          git config user.name 'NexusNova Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/nexusnova-fix-session-verifier-once.yml
          git add NexusNovaAndroid/patch_session_restore.py
          git commit -m 'Align session verifier with single-owner runtime loaders'
          git pull --rebase origin main
          git push origin HEAD:main
