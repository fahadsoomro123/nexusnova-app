name: NexusNova Fix V4 Publish Pathspec 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-fix-v4-publish-pathspec-20260825.yml'

permissions:
  contents: write

jobs:
  patch-active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0
      - name: Harden signed output staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('tools/build-permanent-signed-v4.sh'),
              Path('.github/workflows/nexusnova-permanent-signed-release-once.yml'),
          ]
          old = 'git add -A permanent-signed-release permanent-signed-release-failure'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Publish pathspec anchor missing in {path}')
              path.write_text(text.replace(old, 'git add -A', 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'NexusNova Build Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/build-permanent-signed-v4.sh .github/workflows/nexusnova-permanent-signed-release-once.yml
          git commit -m 'build: harden signed release output staging'
          git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823
