name: NexusNova Free CI

on:
  push:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
  pull_request:
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-free-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android preflight
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -d app
          test -d autopilot
          echo "Android project structure: PASS"

      - name: Compile and test without signing
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :autopilot:assembleDebug :tracker:assembleDebug
          gradle --no-daemon test
          echo "Unsigned debug builds + tests: PASS"

      - name: Autopilot module verification
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='autopilot/build/outputs/apk/debug/autopilot-debug.apk'
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          badging="$($AAPT dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.autopilot'"
          echo "Autopilot debug APK identity: PASS"

      - name: CI summary
        if: always()
        run: |
          {
            echo "### NexusNova Free CI"
            echo "- Android structure checked"
            echo "- Unsigned debug builds checked"
            echo "- Tests executed"
            echo "- Autopilot APK identity checked"
            echo "- No signing credentials required"
          } >> "$GITHUB_STEP_SUMMARY"

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Website sanity checks
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            found=1
            test -s "$f"
            grep -qi '<html' "$f" || true
          done < <(find . -maxdepth 3 -type f -name '*.html' -not -path './.git/*' | head -50)
          echo "Website files discovered: $found"
          if [ -f package.json ]; then
            node --version
            node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json: PASS')"
          fi


  video-flagship-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare media fixtures
        run: |
          set -euo pipefail
          mkdir -p fixtures
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > fixtures/tiny.png
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=red:s=320x180:r=24 -t 1 -c:v libvpx -b:v 400k fixtures/sample.webm
      - name: Serve candidate harness
        run: |
          python3 -m http.server 4173 --directory fresh-rebuild >/tmp/video-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/video-runtime-harness.html >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/video-http.log
          exit 1
      - name: Run video flagship browser QA
        run: node .github/scripts/video-flagship-runtime.mjs
