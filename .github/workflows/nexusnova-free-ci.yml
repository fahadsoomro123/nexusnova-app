name: NexusNova Free CI

on:
  push:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
  pull_request:
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-free-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare isolated debug Firebase package config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          app_dir = Path("NexusNovaAndroid/app")
          source = app_dir / "google-services.json"
          target = app_dir / "src/debug/google-services.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          clients = data.get("client", [])
          package = "com.nexusnova.app.novacutqa"
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
              for c in clients
          ):
              template = next(
                  (
                      c for c in clients
                      if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.nexusnova.app"
                  ),
                  clients[0] if clients else None
              )
              if template is None:
                  raise SystemExit("No Firebase client template found for isolated QA build.")
              qa_client = copy.deepcopy(template)
              qa_client["client_info"]["android_client_info"]["package_name"] = package
              data["client"].append(qa_client)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Generated temporary debug-only Firebase client for " + package)
          print("Production app/google-services.json left unchanged.")
          PY

      - name: Android preflight
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -d app
          test -d tracker
          grep -Fq 'include(":app")' settings.gradle.kts
          grep -Fq 'include(":tracker")' settings.gradle.kts
          echo "Android project structure (app + tracker): PASS"

      - name: Compile and test without signing
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :tracker:assembleDebug
          gradle --no-daemon test
          echo "Unsigned debug builds + tests: PASS"

      - name: Tracker module verification
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='tracker/build/outputs/apk/debug/tracker-debug.apk'
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          badging="$($AAPT dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.tracker'"
          echo "Tracker debug APK identity: PASS"

      - name: CI summary
        if: always()
        run: |
          {
            echo "### NexusNova Free CI"
            echo "- Android structure checked"
            echo "- Unsigned debug builds checked"
            echo "- Tests executed"
            echo "- Tracker APK identity checked"
            echo "- No signing credentials required"
          } >> "$GITHUB_STEP_SUMMARY"

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Website sanity checks
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            found=1
            test -s "$f"
            grep -qi '<html' "$f" || true
          done < <(find . -maxdepth 3 -type f -name '*.html' -not -path './.git/*' | head -50)
          echo "Website files discovered: $found"
          if [ -f package.json ]; then
            node --version
            node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json: PASS')"
          fi
