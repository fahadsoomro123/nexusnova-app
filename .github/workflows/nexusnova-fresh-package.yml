name: NexusNova Fresh APK Package Handoff

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-fresh-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fresh branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-fresh-rebuild-20260820
          fetch-depth: 0

      - name: Verify committed APK
        run: |
          set -euo pipefail
          test -f fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
          grep -q 'RESULT: PASS' fresh-build-output/BUILD-STATUS.txt

      - name: Upload committed fresh APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-fresh-rebuild-chat-handoff
          path: |
            fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
            fresh-build-output/BUILD-STATUS.txt
            fresh-build-output/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish artifact ID to fresh branch
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.upload.outputs.artifact-id }}' > fresh-build-output/ARTIFACT-ID.txt
          printf '%s\n' '${{ steps.upload.outputs.artifact-url }}' > fresh-build-output/ARTIFACT-URL.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fresh-build-output/ARTIFACT-ID.txt fresh-build-output/ARTIFACT-URL.txt
          git commit -m 'ci: publish fresh APK handoff artifact id [skip ci]'
          git push origin HEAD:nexusnova-fresh-rebuild-20260820
