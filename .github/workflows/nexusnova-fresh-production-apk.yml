name: NexusNova Fresh PRODUCTION APK

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-fresh-production-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-fresh-production-apk
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  production-apk:
    name: Fresh PRODUCTION APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate fresh source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile NexusNovaAndroid/prepare_fresh_rebuild.py NexusNovaAndroid/patch_admob.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find fresh-rebuild/src -type f -name '*.js' -print0 | sort -z)
          grep -Fq 'testOnly: status.testMode === true' fresh-rebuild/src/core/native-ads.js
          if grep -Fq 'testOnly: true' fresh-rebuild/src/core/native-ads.js; then
            echo 'Fresh native ad bridge still forces testOnly=true.' >&2
            exit 1
          fi

      - name: Prepare isolated PRODUCTION bundle
        env:
          NEXUSNOVA_BUILD_EDITION: production
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py

      - name: Apply native AdMob bridge
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/patch_admob.py

      - name: Verify production ad contract
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          grep -Fq 'NexusNova Fresh Rebuild PRODUCTION' "$WEB/FRESH-REBUILD-BUILD.txt"
          grep -Fq 'buildConfigField("boolean", "NEXUS_ADS_TEST_MODE", "false")' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'ca-app-pub-5070673529890078~1824799663' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'val TEST_MODE = BuildConfig.NEXUS_ADS_TEST_MODE' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'testOnly: status.testMode === true' "$WEB/src/core/native-ads.js"
          if grep -Fq 'WATCH TEST AD' "$WEB/src/features/apps/core-apps.js"; then
            echo 'Production bundle still exposes WATCH TEST AD.' >&2
            exit 1
          fi
          if grep -Fq 'Opening Google TEST rewarded ad' "$WEB/src/features/apps/core-apps.js"; then
            echo 'Production bundle still exposes Google TEST copy.' >&2
            exit 1
          fi
          node --check "$WEB/src/core/native-ads.js"
          node --check "$WEB/src/features/apps/core-apps.js"
          echo 'PASS production AdMob separation.'

      - name: Build unsigned production release
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify production APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          mkdir -p production-build-output
          cp "$APK" production-build-output/NexusNova-Fresh-PRODUCTION-UNSIGNED.apk
          sha256sum production-build-output/NexusNova-Fresh-PRODUCTION-UNSIGNED.apk > production-build-output/SHA256.txt
          {
            echo 'NexusNova Fresh PRODUCTION APK candidate'
            echo "Source commit: $GITHUB_SHA"
            echo 'Build type: release'
            echo 'AdMob: production IDs / NEXUS_ADS_TEST_MODE=false'
            echo 'Signature: unsigned; signing happens after CI verification'
          } > production-build-output/BUILD-STATUS.txt

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-fresh-production-unsigned-apk
          path: production-build-output/
          if-no-files-found: error
          retention-days: 14
