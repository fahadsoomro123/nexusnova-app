name: NexusNova Fresh Rebuild TEST APK

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-fresh-rebuild-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  fresh-test-apk:
    name: Fresh TEST APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fresh branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-fresh-rebuild-20260820
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate fresh web architecture
        id: web_validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-build-output
          {
            test -f fresh-rebuild/index.html
            test -f fresh-rebuild/src/main.js
            test -f fresh-rebuild/AUDIT-20260820.md

            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find fresh-rebuild/src -type f -name '*.js' -print0 | sort -z)

            python - <<'PY'
          from pathlib import Path
          import re

          html = Path('fresh-rebuild/index.html').read_text(encoding='utf-8')
          if html.count('class="nx-dock__item"') != 2:
              raise SystemExit('Fresh shell must have exactly two bottom-nav items')
          if 'page2.html' in html or 'js/page2' in html or 'switchTab(' in html:
              raise SystemExit('Legacy dashboard dependency detected in fresh entry')
          if 'nexusnova-tools-hub-v1.js' in html:
              raise SystemExit('Legacy Tools Hub dependency detected')

          registry = Path('fresh-rebuild/src/features/hub/app-registry.js').read_text(encoding='utf-8')
          for tool in ('notes','todo','calculator','unit-converter','expenses','pomodoro','bmi','tip','world-clock','qr'):
              if f"id: '{tool}'" not in registry:
                  raise SystemExit(f'Direct Nova Hub tool missing: {tool}')

          all_source = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in Path('fresh-rebuild').rglob('*')
              if p.is_file() and p.suffix in {'.js','.html','.css'}
          )
          forbidden_runtime = (
              'nexusnova-allapps-scroll-fix-v1.js',
              'nexusnova-nova-hub-nav-v1.js',
              'nexusnova-tools-hub-v1.js',
              'page2-core.js'
          )
          for name in forbidden_runtime:
              if re.search(r'(?:src|href)=["\'][^"\']*' + re.escape(name), all_source):
                  raise SystemExit(f'Legacy runtime loaded by fresh app: {name}')
          print('Fresh architecture checks passed')
          PY
          } 2>&1 | tee fresh-build-output/web-validate.log

      - name: Prepare isolated Android fresh bundle
        id: prepare_android
        if: ${{ steps.web_validate.outcome == 'success' }}
        continue-on-error: true
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py 2>&1 | tee fresh-build-output/prepare-android.log

      - name: Apply Android TEST AdMob bridge
        id: patch_admob
        if: ${{ steps.prepare_android.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python NexusNovaAndroid/patch_admob.py 2>&1 | tee fresh-build-output/patch-admob.log

      - name: Verify Android fresh bundle
        id: android_verify
        if: ${{ steps.patch_admob.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            test -f NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
            test -f NexusNovaAndroid/app/src/main/assets/www/src/main.js
            test ! -e NexusNovaAndroid/app/src/main/assets/www/page2.html
            test ! -e NexusNovaAndroid/app/src/main/assets/www/js/page2-core.js

            grep -q 'loadUrlSafely(LOCAL_APP_URL)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            grep -q 'private lateinit var adManager: NexusAdManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            grep -q 'ACTION_SHOW_REWARDED_AD' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            grep -q 'buildConfigField("boolean", "NEXUS_ADS_TEST_MODE", "true")' NexusNovaAndroid/app/build.gradle.kts
            echo 'Android fresh bundle checks passed'
          } 2>&1 | tee fresh-build-output/android-verify.log

      - name: Build fresh debug TEST APK
        id: android_build
        if: ${{ steps.android_verify.outcome == 'success' }}
        continue-on-error: true
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee ../fresh-build-output/gradle-build.log

      - name: Stage build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-build-output
          APK='NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          OUT='fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk'
          rm -f "$OUT" fresh-build-output/SHA256.txt

          {
            echo 'NexusNova Fresh Rebuild TEST APK'
            echo 'Branch: nexusnova-fresh-rebuild-20260820'
            echo "Source commit: $GITHUB_SHA"
            echo 'Edition: TEST/debug only'
            echo "Web validation: ${{ steps.web_validate.outcome }}"
            echo "Android preparation: ${{ steps.prepare_android.outcome }}"
            echo "AdMob patch: ${{ steps.patch_admob.outcome }}"
            echo "Android verification: ${{ steps.android_verify.outcome }}"
            echo "Gradle build: ${{ steps.android_build.outcome }}"
          } > fresh-build-output/BUILD-STATUS.txt

          if [[ "${{ steps.android_build.outcome }}" == 'success' && -f "$APK" ]]; then
            cp "$APK" "$OUT"
            sha256sum "$OUT" > fresh-build-output/SHA256.txt
            echo 'RESULT: PASS — fresh TEST APK built successfully.' >> fresh-build-output/BUILD-STATUS.txt
          else
            echo 'RESULT: FAIL — inspect diagnostics below.' >> fresh-build-output/BUILD-STATUS.txt
            for log in fresh-build-output/web-validate.log fresh-build-output/prepare-android.log fresh-build-output/patch-admob.log fresh-build-output/android-verify.log fresh-build-output/gradle-build.log; do
              if [[ -f "$log" ]]; then
                echo >> fresh-build-output/BUILD-STATUS.txt
                echo "===== $(basename "$log") =====" >> fresh-build-output/BUILD-STATUS.txt
                tail -n 160 "$log" >> fresh-build-output/BUILD-STATUS.txt
              fi
            done
          fi

      - name: Publish fresh build result to fresh branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f fresh-build-output/
          if git diff --cached --quiet; then
            echo 'No build-result changes to publish.'
          else
            git commit -m 'ci: publish fresh TEST APK build result [skip ci]'
            git push origin HEAD:nexusnova-fresh-rebuild-20260820
          fi

      - name: Upload fresh TEST APK artifact
        if: ${{ steps.android_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-fresh-rebuild-test-apk
          path: |
            fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
            fresh-build-output/BUILD-STATUS.txt
            fresh-build-output/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if validation or build failed
        if: ${{ always() && (steps.web_validate.outcome != 'success' || steps.prepare_android.outcome != 'success' || steps.patch_admob.outcome != 'success' || steps.android_verify.outcome != 'success' || steps.android_build.outcome != 'success') }}
        run: exit 1
