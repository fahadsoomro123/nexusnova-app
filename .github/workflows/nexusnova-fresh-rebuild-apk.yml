name: NexusNova Fresh Rebuild TEST APK

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-fresh-rebuild-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-fresh-rebuild-apk
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  fresh-test-apk:
    name: Fresh TEST APK + Android 11 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile NexusNovaAndroid/prepare_fresh_rebuild.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find fresh-rebuild/src -type f -name '*.js' -print0 | sort -z)

          MAIN=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ADS=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          VPN=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt

          grep -Fq 'private var adManager: NexusAdManager? = null' "$MAIN"
          grep -Fq 'private fun initializeAdsSafely()' "$MAIN"
          grep -Fq 'adManager?.showRewarded(' "$MAIN"
          grep -Fq 'adManager?.showInterstitial(' "$MAIN"
          grep -Fq 'fun showRewarded(rewardPurpose: String? = null, testOnly: Boolean = false, userId: String? = null)' "$ADS"
          grep -Fq 'fun showInterstitial(placement: String? = null, feature: String? = null, testOnly: Boolean = false)' "$ADS"
          grep -Fq 'val TEST_MODE = BuildConfig.NEXUS_ADS_TEST_MODE' "$ADS"
          grep -Fq 'ServerSideVerificationOptions' "$ADS"
          grep -Fq '"ssvIdentityReady" to true' "$ADS"
          grep -Fq 'const val REWARD_PURPOSE_WATCH_AD = "task-watch-ad"' "$ADS"
          grep -Fq 'private val backend by lazy(LazyThreadSafetyMode.SYNCHRONIZED)' "$VPN"
          grep -Fq 'private fun safeError(prefix: String, error: Throwable)' "$VPN"
          ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id|ROLE_CALL_SCREENING' \
            NexusNovaAndroid/app/src/main fresh-rebuild/src fresh-rebuild/index.html
          echo 'Canonical native/web source verified.'

      - name: Prepare isolated TEST bundle
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py
          test -f NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
          test ! -e NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -Fq 'NexusNova Fresh Rebuild TEST' NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt

      - name: Build fresh TEST APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Create Android 11 smoke script
        shell: bash
        run: |
          cat > runtime-smoke.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb install -r "$APK"

          adb logcat -c
          adb shell am force-stop com.nexusnova.app || true
          adb shell am start -W -n com.nexusnova.app/.MainActivity | tee "$GITHUB_WORKSPACE/main-launch.txt"
          sleep 12
          MAIN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$MAIN_PID"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/main-launch-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/main-launch-logcat.txt"; then
            echo 'NexusNova launcher runtime failure detected.' >&2
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/main-screen.png"

          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token | tee "$GITHUB_WORKSPACE/vpn-launch.txt"
          sleep 12
          VPN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$VPN_PID"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/vpn-launch-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/vpn-launch-logcat.txt"; then
            echo 'Nova VPN runtime failure detected.' >&2
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/vpn-screen.png"

          {
            echo "RUNTIME_MAIN_PASS pid=$MAIN_PID"
            echo "RUNTIME_VPN_PASS pid=$VPN_PID"
          } | tee "$GITHUB_WORKSPACE/RUNTIME-SMOKE.txt"
          BASH
          chmod +x runtime-smoke.sh

      - name: Android 11 launcher and Nova VPN smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/runtime-smoke.sh"

      - name: Package verified TEST APK
        shell: bash
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p fresh-build-output
          cp "$APK" fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
          sha256sum fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk | tee fresh-build-output/SHA256.txt
          cp RUNTIME-SMOKE.txt main-launch.txt main-launch-logcat.txt main-screen.png \
             vpn-launch.txt vpn-launch-logcat.txt vpn-screen.png fresh-build-output/
          {
            echo 'NexusNova Fresh Rebuild TEST APK'
            echo "Source commit: $GITHUB_SHA"
            echo 'Edition: TEST/debug only'
            echo 'Canonical source verification: success'
            echo 'Gradle build: success'
            echo 'Android 11 MainActivity runtime: success'
            echo 'Android 11 NovaVpnActivity runtime: success'
            echo 'RESULT: PASS'
          } > fresh-build-output/BUILD-STATUS.txt

      - name: Upload verified TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-fresh-test-android11-verified
          path: fresh-build-output/
          if-no-files-found: error
          retention-days: 7
