name: NexusNova Fresh Rebuild TEST APK

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - 'fresh-rebuild/**'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-fresh-rebuild-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-fresh-rebuild-apk
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  fresh-test-apk:
    name: Fresh TEST APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout fresh branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-fresh-rebuild-20260820
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Canonicalize native source and harden crash paths
        id: canonicalize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/patch_admob.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old_lines, new_lines, label, already_marker):
              old = "\n".join(old_lines) + "\n"
              new = "\n".join(new_lines) + "\n"
              if old in text:
                  return text.replace(old, new, 1)
              if already_marker in text:
                  return text
              raise SystemExit(f'{label} not found')

          manager_path = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt')
          manager = manager_path.read_text(encoding='utf-8')
          eager = '    private val backend = GoBackend(appContext)'
          lazy = '    private val backend by lazy(LazyThreadSafetyMode.SYNCHRONIZED) { GoBackend(appContext) }'
          if eager in manager:
              manager = manager.replace(eager, lazy, 1)
          elif lazy not in manager:
              raise SystemExit('NovaVpnManager backend initialization point not found')
          manager = manager.replace('} catch (error: Exception) {', '} catch (error: Throwable) {')
          manager = manager.replace(
              'private fun safeError(prefix: String, error: Exception): String',
              'private fun safeError(prefix: String, error: Throwable): String'
          )
          manager_path.write_text(manager, encoding='utf-8')

          activity_path = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt')
          activity = activity_path.read_text(encoding='utf-8')
          activity = replace_once(
              activity,
              [
                  '        manager = NovaVpnManager.getInstance(applicationContext)',
                  '        setContentView(buildContent())',
              ],
              [
                  '        try {',
                  '            manager = NovaVpnManager.getInstance(applicationContext)',
                  '        } catch (error: Throwable) {',
                  '            android.util.Log.e("NovaVpnStartup", "VPN manager initialization failed", error)',
                  '            Toast.makeText(this, "Nova VPN engine is unavailable on this device.", Toast.LENGTH_LONG).show()',
                  '            finish()',
                  '            return',
                  '        }',
                  '        setContentView(buildContent())',
              ],
              'NovaVpnActivity startup guard',
              'VPN manager initialization failed'
          )
          activity_path.write_text(activity, encoding='utf-8')

          main_path = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          main = replace_once(
              main,
              [
                  '        configureWebView()',
                  '        installNativeMessageListener()',
                  '        adManager = NexusAdManager(this, webView) { view -> isTrustedAppPage(view) }',
                  '        if (BuildConfig.NEXUS_ADS_TEST_MODE) {',
                  "            // Debug/development APKs always use Google's test inventory.",
                  '            adManager.initialize()',
                  '        } else {',
                  '            // Release APKs cannot initialize/request production ads until UMP',
                  '            // has refreshed consent state and says ad requests are allowed.',
                  '            NexusAdConsentManager(this).gather { canRequestAds ->',
                  '                if (canRequestAds) adManager.initialize()',
                  '            }',
                  '        }',
              ],
              [
                  '        configureWebView()',
                  '        runCatching { installNativeMessageListener() }',
                  '            .onFailure { android.util.Log.e("NexusNovaStartup", "Native bridge unavailable", it) }',
                  '        try {',
                  '            adManager = NexusAdManager(this, webView) { view -> isTrustedAppPage(view) }',
                  '            if (BuildConfig.NEXUS_ADS_TEST_MODE) {',
                  "                // Debug/development APKs always use Google's test inventory.",
                  '                adManager.initialize()',
                  '            } else {',
                  '                // Release APKs cannot initialize/request production ads until UMP',
                  '                // has refreshed consent state and says ad requests are allowed.',
                  '                NexusAdConsentManager(this).gather { canRequestAds ->',
                  '                    if (canRequestAds) adManager.initialize()',
                  '                }',
                  '            }',
                  '        } catch (error: Throwable) {',
                  '            android.util.Log.e("NexusNovaStartup", "Ad subsystem initialization failed", error)',
                  '        }',
              ],
              'MainActivity startup hardening',
              'Ad subsystem initialization failed'
          )

          main = replace_once(
              main,
              [
                  '            ACTION_SHOW_REWARDED_AD -> adManager.showRewarded(',
                  '                rewardPurpose = message.optString("rewardPurpose").trim(),',
                  '                testOnly = message.optBoolean("testOnly", false),',
                  '                userId = message.optString("userId").trim()',
                  '            )',
                  '            ACTION_SHOW_INTERSTITIAL_AD -> adManager.showInterstitial(',
                  '                placement = message.optString("placement", message.optString("reason")).trim(),',
                  '                feature = message.optString("feature").trim(),',
                  '                testOnly = message.optBoolean("testOnly", false)',
                  '            )',
                  '            ACTION_AD_STATUS -> adManager.publishStatus()',
              ],
              [
                  '            ACTION_SHOW_REWARDED_AD -> {',
                  '                if (!this::adManager.isInitialized) return',
                  '                adManager.showRewarded(',
                  '                    rewardPurpose = message.optString("rewardPurpose").trim(),',
                  '                    testOnly = message.optBoolean("testOnly", false),',
                  '                    userId = message.optString("userId").trim()',
                  '                )',
                  '            }',
                  '            ACTION_SHOW_INTERSTITIAL_AD -> {',
                  '                if (!this::adManager.isInitialized) return',
                  '                adManager.showInterstitial(',
                  '                    placement = message.optString("placement", message.optString("reason")).trim(),',
                  '                    feature = message.optString("feature").trim(),',
                  '                    testOnly = message.optBoolean("testOnly", false)',
                  '                )',
                  '            }',
                  '            ACTION_AD_STATUS -> if (this::adManager.isInitialized) adManager.publishStatus()',
              ],
              'MainActivity ad action guards',
              'if (!this::adManager.isInitialized) return'
          )
          main_path.write_text(main, encoding='utf-8')
          PY

          grep -Fq 'private val backend by lazy(LazyThreadSafetyMode.SYNCHRONIZED)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt
          grep -Fq 'VPN manager initialization failed' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt
          grep -Fq 'Ad subsystem initialization failed' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'fun showRewarded(rewardPurpose: String? = null, testOnly: Boolean = false, userId: String? = null)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'fun showInterstitial(placement: String? = null, feature: String? = null, testOnly: Boolean = false)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id' NexusNovaAndroid/app/src/main fresh-rebuild/src fresh-rebuild/index.html

      - name: Commit canonical native source
        id: canonical_commit
        if: ${{ steps.canonicalize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt \
                  NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt \
                  NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt \
                  NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: canonical Android startup and Nova VPN crash hardening [skip ci]'
            git push origin HEAD:nexusnova-fresh-rebuild-20260820
          fi
          echo "CANONICAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate fresh source
        id: web_validate
        if: ${{ steps.canonical_commit.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fresh-build-output
          mkdir -p fresh-build-output
          {
            test -f fresh-rebuild/index.html
            test -f fresh-rebuild/src/main.js
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find fresh-rebuild/src -type f -name '*.js' -print0 | sort -z)
            grep -Fq 'openHubApp: openAppWithAd' fresh-rebuild/src/main.js
            grep -Fq 'openAppWithAd(safeId)' fresh-rebuild/src/main.js
            ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id' NexusNovaAndroid/app/src/main fresh-rebuild/src fresh-rebuild/index.html
            echo 'Fresh source checks passed'
          } 2>&1 | tee fresh-build-output/web-validate.log

      - name: Prepare isolated Android fresh bundle
        id: prepare_android
        if: ${{ steps.web_validate.outcome == 'success' }}
        continue-on-error: true
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py 2>&1 | tee fresh-build-output/prepare-android.log

      - name: Apply idempotent TEST AdMob bridge
        id: patch_admob
        if: ${{ steps.prepare_android.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python NexusNovaAndroid/patch_admob.py 2>&1 | tee fresh-build-output/patch-admob.log

      - name: Verify Android crash guards
        id: android_verify
        if: ${{ steps.patch_admob.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            test -f NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
            test ! -e NexusNovaAndroid/app/src/main/assets/www/page2.html
            grep -Fq 'Ad subsystem initialization failed' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            grep -Fq 'if (!this::adManager.isInitialized) return' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            grep -Fq 'private val backend by lazy(LazyThreadSafetyMode.SYNCHRONIZED)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt
            grep -Fq 'VPN manager initialization failed' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt
            grep -Fq 'TEST_INTERSTITIAL_COOLDOWN_MS = 5_000L' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
            ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id' NexusNovaAndroid/app/src/main fresh-rebuild/src fresh-rebuild/index.html
            echo 'Android crash-guard checks passed'
          } 2>&1 | tee fresh-build-output/android-verify.log

      - name: Build fresh debug TEST APK
        id: android_build
        if: ${{ steps.android_verify.outcome == 'success' }}
        continue-on-error: true
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee ../fresh-build-output/gradle-build.log

      - name: Enable KVM
        id: kvm
        if: ${{ steps.android_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke launcher and Nova VPN
        id: runtime_smoke
        if: ${{ steps.android_build.outcome == 'success' && steps.kvm.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"

            adb logcat -c
            adb shell am force-stop com.nexusnova.app
            adb shell monkey -p com.nexusnova.app -c android.intent.category.LAUNCHER 1
            sleep 12
            adb logcat -d -v brief > fresh-build-output/main-launch-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.nexusnova\.app.*has died|AndroidRuntime.*com\.nexusnova\.app' fresh-build-output/main-launch-logcat.txt; then
              echo 'Launcher runtime crash detected.' >&2
              exit 1
            fi
            PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -Fq 'com.nexusnova.app/.MainActivity'

            adb logcat -c
            adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token
            sleep 10
            adb logcat -d -v brief > fresh-build-output/vpn-launch-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.nexusnova\.app.*has died|AndroidRuntime.*com\.nexusnova\.app' fresh-build-output/vpn-launch-logcat.txt; then
              echo 'Nova VPN screen runtime crash detected.' >&2
              exit 1
            fi
            PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -Fq 'com.nexusnova.app/.NovaVpnActivity'
            echo 'Runtime smoke passed.'

      - name: Stage result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-build-output
          APK='NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          OUT='fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk'
          rm -f "$OUT" fresh-build-output/SHA256.txt
          {
            echo 'NexusNova Fresh Rebuild TEST APK'
            echo 'Branch: nexusnova-fresh-rebuild-20260820'
            echo "Source commit: ${CANONICAL_SHA:-$GITHUB_SHA}"
            echo 'Edition: TEST/debug only'
            echo "Canonicalization: ${{ steps.canonicalize.outcome }}"
            echo "Canonical commit: ${{ steps.canonical_commit.outcome }}"
            echo "Web validation: ${{ steps.web_validate.outcome }}"
            echo "Android preparation: ${{ steps.prepare_android.outcome }}"
            echo "AdMob patch: ${{ steps.patch_admob.outcome }}"
            echo "Android verification: ${{ steps.android_verify.outcome }}"
            echo "Gradle build: ${{ steps.android_build.outcome }}"
            echo "KVM setup: ${{ steps.kvm.outcome }}"
            echo "Runtime smoke: ${{ steps.runtime_smoke.outcome }}"
          } > fresh-build-output/BUILD-STATUS.txt

          if [[ "${{ steps.android_build.outcome }}" == 'success' && "${{ steps.runtime_smoke.outcome }}" == 'success' && -f "$APK" ]]; then
            cp "$APK" "$OUT"
            sha256sum "$OUT" > fresh-build-output/SHA256.txt
            echo 'RESULT: PASS — TEST APK built; launcher and Nova VPN runtime smoke passed.' >> fresh-build-output/BUILD-STATUS.txt
          else
            echo 'RESULT: FAIL — APK rejected; inspect diagnostics.' >> fresh-build-output/BUILD-STATUS.txt
            for log in fresh-build-output/web-validate.log fresh-build-output/prepare-android.log fresh-build-output/patch-admob.log fresh-build-output/android-verify.log fresh-build-output/gradle-build.log fresh-build-output/main-launch-logcat.txt fresh-build-output/vpn-launch-logcat.txt; do
              if [[ -f "$log" ]]; then
                echo >> fresh-build-output/BUILD-STATUS.txt
                echo "===== $(basename "$log") =====" >> fresh-build-output/BUILD-STATUS.txt
                tail -n 120 "$log" >> fresh-build-output/BUILD-STATUS.txt
              fi
            done
          fi

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin nexusnova-fresh-rebuild-20260820
          git rebase origin/nexusnova-fresh-rebuild-20260820
          git add -f fresh-build-output/
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish fresh TEST APK build result [skip ci]'
            git push origin HEAD:nexusnova-fresh-rebuild-20260820
          fi

      - name: Upload TEST APK artifact
        if: ${{ steps.android_build.outcome == 'success' && steps.runtime_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-fresh-rebuild-test-apk
          path: |
            fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
            fresh-build-output/BUILD-STATUS.txt
            fresh-build-output/SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce all gates
        if: ${{ always() && (steps.canonicalize.outcome != 'success' || steps.canonical_commit.outcome != 'success' || steps.web_validate.outcome != 'success' || steps.prepare_android.outcome != 'success' || steps.patch_admob.outcome != 'success' || steps.android_verify.outcome != 'success' || steps.android_build.outcome != 'success' || steps.kvm.outcome != 'success' || steps.runtime_smoke.outcome != 'success') }}
        run: exit 1
