name: NexusNova Fresh Web Readiness

on:
  push:
    branches:
      - nexusnova-latest-full-apk-recovery-20260823
    paths:
      - 'fresh-rebuild/**'
      - '.github/workflows/nexusnova-fresh-web-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-web-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check all fresh JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find fresh-rebuild -type f -name '*.js' -print0)

      - name: Verify relative imports and index assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('fresh-rebuild')
          failures = []
          import_re = re.compile(r"(?:\bimport\s+(?:[^'\"]+?\s+from\s+)?|\bimport\s*\()\s*['\"](\.{1,2}/[^'\"]+)['\"]")

          for file in root.rglob('*.js'):
              text = file.read_text(encoding='utf-8')
              for spec in import_re.findall(text):
                  target = (file.parent / spec).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      failures.append(f'{file}: relative import escapes fresh-rebuild: {spec}')
                      continue
                  candidates = [target]
                  if target.suffix == '':
                      candidates.extend([target.with_suffix('.js'), target / 'index.js'])
                  if not any(candidate.is_file() for candidate in candidates):
                      failures.append(f'{file}: missing relative import {spec}')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          refs = re.findall(r'<(?:link|script)\b[^>]*(?:href|src)=["\'](\./[^"\']+)["\']', html, flags=re.I)
          for ref in refs:
              clean = ref.split('?', 1)[0].split('#', 1)[0]
              target = root / clean[2:]
              if not target.is_file():
                  failures.append(f'{index}: missing local asset {ref}')

          if failures:
              print('Fresh Web Readiness: FAIL')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)

          js_count = sum(1 for _ in root.rglob('*.js'))
          print(f'Fresh Web Readiness: PASS ({js_count} JavaScript files; {len(refs)} index local refs)')
          PY
