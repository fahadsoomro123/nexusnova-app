name: NexusNova Golden Disaster Recovery Export

on:
  push:
    branches:
      - nexusnova-golden-export-20260820
    paths:
      - '.github/workflows/nexusnova-golden-export-20260820.yml'

permissions:
  contents: write

jobs:
  export-golden:
    name: Export locked golden snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary export branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-golden-export-20260820
          fetch-depth: 0

      - name: Build one-file golden disaster recovery ZIP
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN_BRANCH='nexusnova-master-golden-disaster-recovery-20260820-ui-locked'
          OUT_DIR='golden-export'
          OUT_NAME='NexusNova-Golden-Disaster-Recovery-20260820-UI-LOCKED.zip'
          OUT_PATH="$OUT_DIR/$OUT_NAME"
          mkdir -p "$OUT_DIR"
          rm -f "$OUT_PATH"
          git fetch origin "$GOLDEN_BRANCH:refs/remotes/origin/$GOLDEN_BRANCH"
          git archive --format=zip --output="$OUT_PATH" "refs/remotes/origin/$GOLDEN_BRANCH"
          cat > /tmp/GOLDEN-DISASTER-RECOVERY-MANIFEST.txt <<'EOF'
          NEXUSNOVA GOLDEN DISASTER RECOVERY — UI/DESIGN LOCKED
          Date: 20 August 2026
          Golden branch: nexusnova-master-golden-disaster-recovery-20260820-ui-locked
          Golden snapshot commit: a8464b4bd43506c1b800294be9edec4175ace5ad
          Approved source commit: 6bf0798a3d25cb662f4260d0ee46b5348bc094f0
          Build result: PASS
          APK: fresh-build-output/NexusNova-Fresh-Rebuild-TEST-20260820.apk
          APK SHA256: 6ad2cdedd75cc3d777c08574930bf551b21449b290d5c8ed3c9f5d067b01d3c4
          Status: UI/DESIGN APPROVED AND LOCKED. Restore only on explicit disaster-recovery instruction.
          EOF
          zip -q -j "$OUT_PATH" /tmp/GOLDEN-DISASTER-RECOVERY-MANIFEST.txt
          sha256sum "$OUT_PATH"

      - name: Publish ZIP on temporary export branch
        shell: bash
        run: |
          set -euo pipefail
          OUT='golden-export/NexusNova-Golden-Disaster-Recovery-20260820-UI-LOCKED.zip'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          if git diff --cached --quiet; then
            echo 'Golden ZIP already current.'
            exit 0
          fi
          ZIP_SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          git commit -m "export: locked golden disaster recovery ZIP [skip ci]" -m "ZIP SHA256: $ZIP_SHA"
          git push origin HEAD:nexusnova-golden-export-20260820
