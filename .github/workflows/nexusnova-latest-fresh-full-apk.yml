name: NexusNova Latest Fresh Full APK

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - '.github/workflows/nexusnova-latest-fresh-full-apk.yml'
      - 'NexusNovaAndroid/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact latest fresh feature tree
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/emergency-sos.js
          test -s fresh-rebuild/src/features/apps/premium-weather.js
          test -s fresh-rebuild/src/features/apps/premium-prayer-times.js
          test -s fresh-rebuild/src/features/apps/premium-qibla.js
          test -s fresh-rebuild/src/features/apps/premium-world-clock.js
          test -s fresh-rebuild/src/features/apps/premium-quran-reader.js
          test -s fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          test -s fresh-rebuild/src/features/apps/premium-drive-tools.js
          test -s fresh-rebuild/src/features/apps/nova-vpn-suite.js
          grep -Fq './src/main.js' fresh-rebuild/index.html
          grep -Fq './src/emergency-sos.js' fresh-rebuild/index.html
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Stage fresh-rebuild SPA into Android assets
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp -a fresh-rebuild/. "$WEB/"
          printf 'source_commit=%s\nsource_tree=fresh-rebuild\n' "$GITHUB_SHA" > "$WEB/NEXUSNOVA_SOURCE.txt"
          test -s "$WEB/index.html"
          test -s "$WEB/src/main.js"
          test -s "$WEB/src/emergency-sos.js"
          test -s "$WEB/src/features/apps/premium-weather.js"
          test -s "$WEB/src/features/apps/nova-vpn-suite.js"

      - name: Wire verified web OTA into bundled launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'OTA launcher anchor missing: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '    private var rendererCrashRecoveries = 0\n',
              '    private var rendererCrashRecoveries = 0\n'
              '    private val otaWebManager by lazy { NexusOtaWebManager(this) }\n'
              '    private var otaCheckStarted = false\n',
              'fields'
          )

          replace_once(
              '                return assetLoader.shouldInterceptRequest(uri)\n'
              '                    ?: super.shouldInterceptRequest(view, request)\n',
              '                return otaWebManager.intercept(uri)\n'
              '                    ?: assetLoader.shouldInterceptRequest(uri)\n'
              '                    ?: super.shouldInterceptRequest(view, request)\n',
              'request interception'
          )

          old_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isProductionOrigin(uri) || usingOfflineFallback) return\n                finishedWatchdogToken = mainFrameWatchdogToken\n                scheduleBlankScreenCheck(target, mainFrameWatchdogToken)\n            }\n'''
          new_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isLocalOrigin(uri) || otaCheckStarted) return\n                otaCheckStarted = true\n                otaWebManager.checkForUpdate { updated ->\n                    if (!updated) return@checkForUpdate\n                    runOnUiThread {\n                        if (!isFinishing && !isDestroyed && target === webView) {\n                            target.reload()\n                        }\n                    }\n                }\n            }\n'''
          replace_once(old_finished, new_finished, 'page finished OTA check')

          replace_once(
              '                runCatching { target.destroy() }\n\n                if (isFinishing || isDestroyed) return true\n',
              '                runCatching { target.destroy() }\n\n'
              '                if (didCrash && otaWebManager.rollbackToBundled()) {\n'
              '                    window.decorView.postDelayed({\n'
              '                        if (!isFinishing && !isDestroyed) rebuildWebViewAfterRendererExit()\n'
              '                    }, RENDERER_CRASH_RECOVERY_DELAY_MS)\n'
              '                    return true\n'
              '                }\n\n'
              '                if (isFinishing || isDestroyed) return true\n',
              'renderer OTA rollback'
          )

          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'otaWebManager.checkForUpdate' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'otaWebManager.rollbackToBundled()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build exact latest full APK
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/latest-full-build.log"

      - name: Publish exact latest APK immediately
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p /tmp/latest-full
          cp "$APK" /tmp/latest-full/NexusNova-LATEST-FULL-PHONE-TEST.apk
          sha256sum /tmp/latest-full/NexusNova-LATEST-FULL-PHONE-TEST.apk > /tmp/latest-full/SHA256.txt
          cp "$GITHUB_WORKSPACE/latest-full-build.log" /tmp/latest-full/build.log
          cat > /tmp/latest-full/BUILD-STATUS.txt <<EOF
          NexusNova LATEST FULL PHONE TEST
          Source commit: $GITHUB_SHA
          Canonical source: fresh-rebuild/
          Android assets staged from fresh-rebuild: PASS
          Verified web OTA updater wired: PASS
          Bundled fallback retained: PASS
          Premium feature tree: PASS
          Emergency SOS: PASS
          Gradle build: PASS
          RESULT: OTA-ENABLED APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' /tmp/latest-full/BUILD-STATUS.txt
          git config user.name 'NexusNova Latest Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-latest-full
          git worktree add /tmp/nx-latest-full origin/apk-builds
          cd /tmp/nx-latest-full
          rm -rf latest-fresh-full-phone-test
          mkdir -p latest-fresh-full-phone-test
          cp -a /tmp/latest-full/. latest-fresh-full-phone-test/
          git add -A latest-fresh-full-phone-test
          git commit -m "Publish exact latest fresh full APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/latest-full-fail
          printf 'Source: %s\nRESULT: FAIL\n' "$GITHUB_SHA" > /tmp/latest-full-fail/FAILURE.txt
          [ -f "$GITHUB_WORKSPACE/latest-full-build.log" ] && cp "$GITHUB_WORKSPACE/latest-full-build.log" /tmp/latest-full-fail/build.log || true
          git config user.name 'NexusNova Latest Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          rm -rf /tmp/nx-latest-full-fail
          git worktree add /tmp/nx-latest-full-fail origin/apk-builds || exit 0
          cd /tmp/nx-latest-full-fail
          rm -rf latest-fresh-full-phone-test-failure
          mkdir -p latest-fresh-full-phone-test-failure
          cp -a /tmp/latest-full-fail/. latest-fresh-full-phone-test-failure/
          git add -A latest-fresh-full-phone-test-failure
          git commit -m "Publish latest fresh full APK failure $GITHUB_SHA" || exit 0
          git pull --rebase origin apk-builds || true
          git push origin HEAD:apk-builds || true
