name: NexusNova Latest TEST APK Publish

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-latest-test-apk-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-latest-test-apk-publish
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare exact fresh rebuild
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py
          test -s NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt

      - name: Build latest TEST APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Package latest TEST APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latest-test-output
          cp NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk latest-test-output/NexusNova-Latest-TEST.apk
          sha256sum latest-test-output/NexusNova-Latest-TEST.apk > latest-test-output/SHA256.txt
          {
            echo 'NexusNova Latest TEST APK'
            echo "Source commit: $GITHUB_SHA"
            echo 'Gradle build: PASS'
            echo 'Android runtime: NOT VERIFIED'
            echo 'RESULT: BUILD PASS'
          } > latest-test-output/BUILD-STATUS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-latest-test-apk
          path: latest-test-output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish TEST APK to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-latest-test
          git worktree add /tmp/nx-latest-test origin/apk-builds
          cd /tmp/nx-latest-test
          rm -rf latest-test-apk
          mkdir -p latest-test-apk
          cp -a "$GITHUB_WORKSPACE/latest-test-output/." latest-test-apk/
          git add -A latest-test-apk
          git commit -m "Publish latest TEST APK $GITHUB_SHA"
          git push origin HEAD:apk-builds
