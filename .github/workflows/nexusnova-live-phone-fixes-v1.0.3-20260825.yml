name: NexusNova Live Phone Fixes v1.0.3 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-live-phone-fixes-v1.0.3-20260825.yml'

permissions:
  contents: write
  statuses: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  VERSION_CODE: '4'
  VERSION_NAME: '1.0.3'

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - name: Apply phone-tested UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          drive = Path('fresh-rebuild/src/features/apps/premium-drive-tools.js')
          text = drive.read_text()
          replacements = [
              ('<p>Drive • Test • Weather • Live</p></div><div class="nx2-dr-sample">METER SAMPLE C</div>',
               '<p>Drive • GPS • Weather • Live</p></div><div class="nx2-dr-sample">GPS METER</div>'),
              ('<span class="is-selected">◷ METER SAMPLE C</span>',
               '<span class="is-selected">◷ LIVE METER</span>'),
              ('<article class="nx2-dr-card"><span>SATELLITES</span><strong data-dr-satellites>—</strong></article>',
               '<article class="nx2-dr-card"><span>GPS MODE</span><strong>HIGH ACC</strong></article>'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Drive replacement not unique/missing: {old[:60]}')
              text = text.replace(old, new, 1)
          drive.write_text(text)

          sos = Path('fresh-rebuild/src/emergency-sos.js')
          s = sos.read_text()
          marker = '.nx-sos-note{margin-top:12px!important;font-size:12px!important;color:#8da1b2!important}\n'
          if s.count(marker) != 1:
              raise SystemExit('SOS style marker missing/not unique')
          override = marker + f'''#${{SOS_BUTTON_ID}}{{width:36px;height:48px;right:0;bottom:calc(102px + env(safe-area-inset-bottom));border-radius:18px 0 0 18px;opacity:.34;font-size:10px;transition:width .16s ease,height .16s ease,right .16s ease,opacity .16s ease,border-radius .16s ease,font-size .16s ease}}\n#${{SOS_BUTTON_ID}}[data-active="1"],#${{SOS_BUTTON_ID}}[data-busy="1"]{{width:56px;height:56px;right:10px;border-radius:50%;opacity:1;font-size:15px}}\n#${{SOS_EDIT_ID}}{{right:15px;bottom:calc(158px + env(safe-area-inset-bottom))}}\n'''
          s = s.replace(marker, override, 1)
          sos.write_text(s)
          PY

          grep -Fq 'Drive • GPS • Weather • Live' fresh-rebuild/src/features/apps/premium-drive-tools.js
          grep -Fq 'GPS METER' fresh-rebuild/src/features/apps/premium-drive-tools.js
          grep -Fq '◷ LIVE METER' fresh-rebuild/src/features/apps/premium-drive-tools.js
          grep -Fq '<span>GPS MODE</span><strong>HIGH ACC</strong>' fresh-rebuild/src/features/apps/premium-drive-tools.js
          grep -Fq 'width:36px;height:48px;right:0' fresh-rebuild/src/emergency-sos.js

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Phone Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/premium-drive-tools.js fresh-rebuild/src/emergency-sos.js
          git commit -m 'fix: phone-tested Drive UI and SOS overlap'
          git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and publish permanent signed v1.0.3
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Building active source $SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" bash tools/run-permanent-signed-v4-safe.sh

      - name: Publish status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_SHA: ${{ github.sha }}
        run: |
          set +e
          if [ "${{ job.status }}" = "success" ]; then STATE=success; TEXT="NexusNova 1.0.3 phone fixes built"; else STATE=failure; TEXT="NexusNova 1.0.3 phone fixes failed"; fi
          jq -n --arg state "$STATE" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$TEXT" --arg context "NexusNova phone fixes v1.0.3" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${LAUNCHER_SHA}" -d @/tmp/status.json >/dev/null
