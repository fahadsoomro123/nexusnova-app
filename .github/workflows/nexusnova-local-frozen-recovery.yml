name: NexusNova Frozen Local Recovery

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-local-frozen-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-local-frozen-recovery
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify recovered feature inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt
          test -s fresh-rebuild/src/features/apps/premium-prayer-times.js
          test -s fresh-rebuild/src/features/apps/premium-qibla.js
          test -s fresh-rebuild/src/features/apps/premium-weather.js
          test -s fresh-rebuild/src/features/apps/premium-drive-tools.js
          test -s fresh-rebuild/src/features/apps/premium-world-clock.js
          test -s fresh-rebuild/src/features/apps/premium-quran-reader.js
          test -s fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          grep -Fq "import('./features/apps/app-screen.js')" fresh-rebuild/src/main.js
          echo 'FEATURE_INVENTORY_PASS' > FEATURE-INVENTORY.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare exact bundled web app
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_fresh_rebuild.py
          test -s NexusNovaAndroid/app/src/main/assets/www/index.html
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/premium-prayer-times.js
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/premium-qibla.js
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/premium-weather.js
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/premium-drive-tools.js
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/premium-world-clock.js
          test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/nova-vpn-suite.js
          grep -Fq 'usingOfflineFallback = true' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'webView.loadUrl(LOCAL_APP_URL)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          echo 'LOCAL_BUNDLE_PREP_PASS' > LOCAL-BUNDLE.txt

      - name: Build APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Create Android 11 runtime smoke
        shell: bash
        run: |
          cat > frozen-smoke.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          adb wait-for-device
          for i in $(seq 1 60); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

          adb shell am force-stop com.nexusnova.app || true
          adb uninstall com.nexusnova.app >/dev/null 2>&1 || true

          : > "$GITHUB_WORKSPACE/adb-install.txt"
          if adb install --no-streaming -r "$APK" 2>&1 | tee -a "$GITHUB_WORKSPACE/adb-install.txt" | grep -q '^Success$'; then
            echo 'INSTALL_METHOD=adb-no-streaming' >> "$GITHUB_WORKSPACE/adb-install.txt"
          else
            adb push "$APK" /data/local/tmp/nexusnova-test.apk 2>&1 | tee -a "$GITHUB_WORKSPACE/adb-install.txt"
            adb shell pm install -r /data/local/tmp/nexusnova-test.apk 2>&1 | tee -a "$GITHUB_WORKSPACE/adb-install.txt"
            grep -q 'Success' "$GITHUB_WORKSPACE/adb-install.txt"
            echo 'INSTALL_METHOD=pm-install' >> "$GITHUB_WORKSPACE/adb-install.txt"
          fi

          adb logcat -c
          adb shell am force-stop com.nexusnova.app || true
          adb shell am start -W -n com.nexusnova.app/.MainActivity | tee "$GITHUB_WORKSPACE/main-launch.txt"
          grep -q 'Activity: com.nexusnova.app/.MainActivity' "$GITHUB_WORKSPACE/main-launch.txt"

          : > "$GITHUB_WORKSPACE/stay-alive.txt"
          for i in 1 2 3 4 5 6; do
            sleep 10
            PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
            test -n "$PID"
            echo "sample=$i pid=$PID" >> "$GITHUB_WORKSPACE/stay-alive.txt"
          done

          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/main-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app|WebView renderer gone' "$GITHUB_WORKSPACE/main-logcat.txt"; then
            exit 1
          fi
          adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/main-state.txt"
          grep -E -q 'mResumedActivity:.*com\.nexusnova\.app/.MainActivity|topResumedActivity=.*com\.nexusnova\.app/.MainActivity|ResumedActivity:.*com\.nexusnova\.app/.MainActivity' "$GITHUB_WORKSPACE/main-state.txt"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/main-screen.png"
          test -s "$GITHUB_WORKSPACE/main-screen.png"

          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token | tee "$GITHUB_WORKSPACE/vpn-launch.txt"
          grep -q 'Activity: com.nexusnova.app/.NovaVpnActivity' "$GITHUB_WORKSPACE/vpn-launch.txt"
          sleep 20
          test -n "$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/vpn-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/vpn-logcat.txt"; then
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/vpn-screen.png"
          test -s "$GITHUB_WORKSPACE/vpn-screen.png"

          {
            echo 'LOCAL_BUNDLED_STARTUP_PASS'
            echo 'APK_INSTALL_PASS'
            echo 'MAIN_60S_STAY_ALIVE_PASS'
            echo 'NOVA_VPN_20S_LAUNCH_PASS'
            echo 'ANDROID_11_RUNTIME_PASS'
          } > "$GITHUB_WORKSPACE/LAUNCH-SMOKE.txt"
          BASH
          chmod +x frozen-smoke.sh

      - name: Android 11 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/frozen-smoke.sh"

      - name: Package frozen recovery APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen-recovery-output
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" frozen-recovery-output/NexusNova-Frozen-Recovery-Full-TEST.apk
          sha256sum frozen-recovery-output/NexusNova-Frozen-Recovery-Full-TEST.apk > frozen-recovery-output/SHA256.txt
          cp LAUNCH-SMOKE.txt FEATURE-INVENTORY.txt LOCAL-BUNDLE.txt build-log.txt adb-install.txt main-launch.txt stay-alive.txt main-logcat.txt main-state.txt main-screen.png vpn-launch.txt vpn-logcat.txt vpn-screen.png frozen-recovery-output/
          {
            echo 'NexusNova Frozen Local Recovery Full TEST APK'
            echo "Source commit: $GITHUB_SHA"
            echo 'Startup source: APK bundled local app'
            echo 'Feature inventory: PASS'
            echo 'Gradle build: PASS'
            echo 'Android 11 APK install: PASS'
            echo 'Android 11 MainActivity 60s: PASS'
            echo 'Android 11 Nova VPN 20s: PASS'
            echo 'RESULT: PHONE TEST READY'
          } > frozen-recovery-output/BUILD-STATUS.txt

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-frozen-recovery-full-test
          path: frozen-recovery-output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK and proof to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-frozen-recovery
          git worktree add /tmp/nx-frozen-recovery origin/apk-builds
          cd /tmp/nx-frozen-recovery
          rm -rf frozen-recovery-full frozen-recovery-full-failure
          mkdir -p frozen-recovery-full
          cp -a "$GITHUB_WORKSPACE/frozen-recovery-output/." frozen-recovery-full/
          git add -A frozen-recovery-full frozen-recovery-full-failure
          git commit -m "Publish frozen recovery full PASS $GITHUB_SHA"
          git push origin HEAD:apk-builds

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p frozen-recovery-failure
          echo "Source: $GITHUB_SHA" > frozen-recovery-failure/FAILURE.txt
          for f in FEATURE-INVENTORY.txt LOCAL-BUNDLE.txt build-log.txt adb-install.txt main-launch.txt stay-alive.txt main-logcat.txt main-state.txt vpn-launch.txt vpn-logcat.txt; do
            [ -f "$f" ] && cp "$f" frozen-recovery-failure/ || true
          done
          git config user.name 'NexusNova Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          rm -rf /tmp/nx-frozen-fail
          git worktree add /tmp/nx-frozen-fail origin/apk-builds || exit 0
          cd /tmp/nx-frozen-fail
          rm -rf frozen-recovery-full-failure
          mkdir -p frozen-recovery-full-failure
          cp -a "$GITHUB_WORKSPACE/frozen-recovery-failure/." frozen-recovery-full-failure/
          git add -A frozen-recovery-full-failure
          git commit -m "Publish frozen recovery FAIL $GITHUB_SHA" || exit 0
          git push origin HEAD:apk-builds || true
