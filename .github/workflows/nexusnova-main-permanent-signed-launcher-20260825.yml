name: NexusNova Main Permanent Signed Launcher 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-main-permanent-signed-launcher-20260825.yml'

permissions:
  actions: read
  contents: write
  statuses: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  VERSION_CODE: '2'
  VERSION_NAME: '1.0.1'

jobs:
  build-active-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish launcher run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Permanent signed build run ${GITHUB_RUN_ID} started" \
            --arg context "NexusNova permanent signed launcher" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/launcher-status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d @/tmp/launcher-status.json

      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build verify and publish active branch permanent signed APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Building active source $SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" bash tools/build-permanent-signed-v4.sh

      - name: Publish active branch build failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          SOURCE_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          OUT="$RUNNER_TEMP/nexusnova-permanent-signed-failure"
          rm -rf "$OUT" && mkdir -p "$OUT"
          {
            echo "Source commit: $SOURCE_SHA"
            echo "Launcher commit: $GITHUB_SHA"
            echo "RESULT: FAIL"
            test -s fresh-rebuild/index.html && echo 'CANONICAL_WEB=YES' || echo 'CANONICAL_WEB=NO'
            test -s tools/build-permanent-signed-v4.sh && echo 'BUILD_SCRIPT=YES' || echo 'BUILD_SCRIPT=NO'
            test -s NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk && echo 'APK_CREATED=YES' || echo 'APK_CREATED=NO'
          } > "$OUT/FAILURE.txt"
          test -s "$GITHUB_WORKSPACE/permanent-signed-release.log" && cp "$GITHUB_WORKSPACE/permanent-signed-release.log" "$OUT/build.log"
          test -s "$GITHUB_WORKSPACE/permanent-signature.txt" && cp "$GITHUB_WORKSPACE/permanent-signature.txt" "$OUT/signature.txt"
          git config user.name 'NexusNova Signed Failure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          PUB="$RUNNER_TEMP/nexusnova-apk-failure"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds || exit 0
          cd "$PUB"
          rm -rf permanent-signed-release permanent-signed-release-failure
          mkdir -p permanent-signed-release-failure
          cp -a "$OUT"/. permanent-signed-release-failure/
          git add -A permanent-signed-release permanent-signed-release-failure
          git commit -m "Publish permanent signed failure $SOURCE_SHA" || exit 0
          git pull --rebase origin apk-builds || true
          git push origin HEAD:apk-builds || true

      - name: Publish launcher success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg state success \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Permanent signed build run ${GITHUB_RUN_ID} succeeded" \
            --arg context "NexusNova permanent signed launcher" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/launcher-status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${LAUNCHER_SHA}" \
            -d @/tmp/launcher-status.json

      - name: Publish launcher failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_SHA: ${{ github.sha }}
        run: |
          set +e
          jq -n \
            --arg state failure \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Permanent signed build run ${GITHUB_RUN_ID} failed" \
            --arg context "NexusNova permanent signed launcher" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > /tmp/launcher-status.json
          curl --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${LAUNCHER_SHA}" \
            -d @/tmp/launcher-status.json >/dev/null
