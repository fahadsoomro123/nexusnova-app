name: NexusNova Navigation Stability

on:
  push:
    branches:
      - main
    paths:
      - 'js/page2.js'
      - 'js/page2-core.js'
      - 'js/nexusnova-navigation-stability-v1.js'
      - 'js/nexusnova-final-user-fixes-v1.js'
      - 'js/nexusnova-allapps-**'
      - 'page2.html'
      - '.github/scripts/nexusnova-navigation-stability-smoke.mjs'
      - '.github/workflows/nexusnova-navigation-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local NexusNova origin
        shell: bash
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>navigation-runtime</title>' > .runtime-origin.html
          python3 -m http.server 4173 > /tmp/nexusnova-navigation-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.runtime-origin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-navigation-http.log || true
          exit 1

      - name: Verify ALL APPS navigation and scroll stability
        run: node .github/scripts/nexusnova-navigation-stability-smoke.mjs
