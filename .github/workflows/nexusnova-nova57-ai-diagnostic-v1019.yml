name: NexusNova v1.0.19 NOVA 5.7 AI Diagnostic Signed

on:
  push:
    branches: [nova-sol57-ai-diagnostic-v120]
    paths:
      - '.github/workflows/nexusnova-nova57-ai-diagnostic-v1019.yml'
      - 'fresh-rebuild/src/nova57-ai-diagnostic.js'
      - 'fresh-rebuild/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1019-ai-diagnostic-release.jks
      CLEAN_CHAT_HEAD: 9eddc2144e5eec23903ee2540f4d65eadc85f1b0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify diagnostic-only isolated delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-ai-diagnostic-v120"
          git cat-file -e "$CLEAN_CHAT_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$CLEAN_CHAT_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-ai-diagnostic-v1019.yml|\
              fresh-rebuild/src/nova57-ai-diagnostic.js|\
              fresh-rebuild/index.html) ;;
              *) echo "Unexpected diagnostic change: $f"; exit 1 ;;
            esac
          done

          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- fresh-rebuild/assets/styles/nova57-clean-screen.css
          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- fresh-rebuild/src/features/apps/app-screen.js
          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- functions
          git diff --quiet "$CLEAN_CHAT_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          grep -Fq 'nova57-ai-diagnostic.js' fresh-rebuild/index.html
          grep -Fq 'NOVA_WARN_PREFIX' fresh-rebuild/src/nova57-ai-diagnostic.js
          grep -Fq 'data-nx57-ai-diagnostic' fresh-rebuild/src/nova57-ai-diagnostic.js
          grep -Fq 'AI diagnostic:' fresh-rebuild/src/nova57-ai-diagnostic.js
          node --check fresh-rebuild/src/nova57-ai-diagnostic.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.19 vc20 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 20', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.19"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed AI diagnostic APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-ai-diagnostic-v1019-build.log"

      - name: Verify signature and diagnostic bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-ai-diagnostic-v1019-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-ai-diagnostic-v1019-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/nova57-ai-diagnostic.js',
                  'assets/www/assets/styles/nova57-clean-screen.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
                  'assets/www/src/emergency-sos.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              diag = z.read('assets/www/src/nova57-ai-diagnostic.js').decode('utf-8')
              index = z.read('assets/www/index.html').decode('utf-8')
              nova = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              for marker in ('NOVA_WARN_PREFIX','data-nx57-ai-diagnostic','AI diagnostic:'):
                  if marker not in diag:
                      raise SystemExit(f'Diagnostic marker missing: {marker}')
              if 'nova57-ai-diagnostic.js' not in index:
                  raise SystemExit('Diagnostic module not loaded')
              for marker in ('data-nx57-clean-drawer',"classList.add('nx57-clean-mode')",'Ask NOVA'):
                  if marker not in nova:
                      raise SystemExit(f'Clean-screen renderer marker missing: {marker}')
          print('NOVA 5.7 AI diagnostic bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1019-ai-diagnostic
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.19-vc20-NOVA-5.7-AI-Diagnostic-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.19-vc20-NOVA-5.7-AI-Diagnostic-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-ai-diagnostic-v1019-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-ai-diagnostic-v1019-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.19 vc20
          NOVA AI: 5.7 Sol clean screen + temporary provider diagnostic capture
          Clean-chat source commit: $CLEAN_CHAT_HEAD
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Clean NOVA UI renderer: UNCHANGED FROM v1.0.18
          Clean NOVA CSS: UNCHANGED FROM v1.0.18
          Diagnostic behavior: captures provider error name/code/status/message after failed NOVA request
          Diagnostic redaction: API keys and bearer/token-like strings redacted
          SOS functionality source: UNCHANGED
          Permanent signature verification: PASS
          RESULT: SIGNED AI-DIAGNOSTIC APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1019-publish
          git worktree add /tmp/nx-v1019-publish origin/apk-builds
          cd /tmp/nx-v1019-publish
          rm -rf nova-v1.0.19-ai-diagnostic
          mkdir -p nova-v1.0.19-ai-diagnostic
          cp -a /tmp/nexusnova-v1019-ai-diagnostic/. nova-v1.0.19-ai-diagnostic/
          git add -A nova-v1.0.19-ai-diagnostic
          git commit -m "Publish NexusNova v1.0.19 NOVA AI diagnostic $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.19-vc20-NOVA-5.7-AI-Diagnostic-SIGNED
          path: /tmp/nexusnova-v1019-ai-diagnostic/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
