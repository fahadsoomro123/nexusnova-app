name: NexusNova v1.0.18 NOVA 5.7 Clean Chat Signed

on:
  push:
    branches: [nova-sol57-clean-chat-v119]
    paths:
      - '.github/workflows/nexusnova-nova57-clean-chat-v1018.yml'
      - 'fresh-rebuild/assets/styles/nova57-clean-screen.css'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/src/features/apps/nova-sol57-fresh.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1018-clean-chat-release.jks
      CLEAN_CHAT_BASE: 225b7b128dd21d278f49d80928eac6e5f369a045

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify NOVA clean-screen isolated delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-clean-chat-v119"
          git cat-file -e "$CLEAN_CHAT_BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$CLEAN_CHAT_BASE" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-clean-chat-v1018.yml|\
              fresh-rebuild/assets/styles/nova57-clean-screen.css|\
              fresh-rebuild/index.html|\
              fresh-rebuild/src/features/apps/nova-sol57-fresh.js) ;;
              *) echo "Unexpected clean-chat change: $f"; exit 1 ;;
            esac
          done

          git diff --quiet "$CLEAN_CHAT_BASE" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$CLEAN_CHAT_BASE" HEAD -- fresh-rebuild/src/features/apps/app-screen.js
          git diff --quiet "$CLEAN_CHAT_BASE" HEAD -- functions
          git diff --quiet "$CLEAN_CHAT_BASE" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          grep -Fq 'nova57-clean-screen.css' fresh-rebuild/index.html
          grep -Fq 'html.nx57-clean-mode .nx-dock' fresh-rebuild/assets/styles/nova57-clean-screen.css
          grep -Fq 'html.nx57-clean-mode #nxEmergencySosButton' fresh-rebuild/assets/styles/nova57-clean-screen.css
          grep -Fq '.nx57-clean-compose' fresh-rebuild/assets/styles/nova57-clean-screen.css
          grep -Fq 'data-nx57-clean-drawer' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "document.documentElement.classList.add('nx57-clean-mode')" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "document.documentElement.classList.remove('nx57-clean-mode')" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          ! grep -Fq 'function ensureStyle' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          ! grep -Fq 'data-nx57-model-button' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.18 vc19 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 19', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.18"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed clean-chat APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-clean-chat-v1018-build.log"

      - name: Verify signature and clean-screen bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-clean-chat-v1018-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-clean-chat-v1018-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/assets/styles/nova57-clean-screen.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
                  'assets/www/src/features/apps/app-screen.js',
                  'assets/www/src/emergency-sos.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              css = z.read('assets/www/assets/styles/nova57-clean-screen.css').decode('utf-8')
              nova = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              index = z.read('assets/www/index.html').decode('utf-8')
              registry = z.read('assets/www/src/features/hub/app-registry.js').decode('utf-8')
              for marker in ('html.nx57-clean-mode .nx-dock','.nx57-clean-compose','html.nx57-clean-mode #nxEmergencySosButton'):
                  if marker not in css:
                      raise SystemExit(f'Clean-screen CSS marker missing: {marker}')
              for marker in ('data-nx57-clean-drawer',"classList.add('nx57-clean-mode')",'Ask NOVA'):
                  if marker not in nova:
                      raise SystemExit(f'Clean-screen renderer marker missing: {marker}')
              if 'nova57-clean-screen.css' not in index:
                  raise SystemExit('Clean-screen stylesheet not loaded')
              if 'nova-internet-speed' in registry:
                  raise SystemExit('Internet Speed registry entry returned')
          print('NOVA 5.7 clean-screen bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1018-clean-chat
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.18-vc19-NOVA-5.7-Clean-Chat-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.18-vc19-NOVA-5.7-Clean-Chat-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-clean-chat-v1018-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-clean-chat-v1018-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.18 vc19
          NOVA AI: 5.7 Sol dedicated clean full-screen chat UI
          Clean-chat base commit: $CLEAN_CHAT_BASE
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Generic Nova app card/header on NOVA screen: HIDDEN BY SCREEN MODE
          Global Mine/Nova Hub dock on NOVA screen: HIDDEN BY SCREEN MODE
          NOVA composer: DEDICATED CLEAN LAYOUT
          NOVA sidebar: DEDICATED CLEAN LAYOUT
          SOS functionality source: UNCHANGED; button hidden only while NOVA clean screen is active
          Provider/tool truth state: PRESERVED
          Permanent signature verification: PASS
          RESULT: SIGNED CLEAN-CHAT APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1018-publish
          git worktree add /tmp/nx-v1018-publish origin/apk-builds
          cd /tmp/nx-v1018-publish
          rm -rf nova-v1.0.18-clean-chat
          mkdir -p nova-v1.0.18-clean-chat
          cp -a /tmp/nexusnova-v1018-clean-chat/. nova-v1.0.18-clean-chat/
          git add -A nova-v1.0.18-clean-chat
          git commit -m "Publish NexusNova v1.0.18 NOVA clean chat $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.18-vc19-NOVA-5.7-Clean-Chat-SIGNED
          path: /tmp/nexusnova-v1018-clean-chat/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
