name: NexusNova v1.0.24 NOVA 5.7 Current Grounding Signed

on:
  push:
    branches: [nova-sol57-current-grounding-v124]
    paths:
      - '.github/workflows/nexusnova-nova57-current-grounding-v1024.yml'
      - 'fresh-rebuild/src/nova57-web-research-router-compat.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1024-current-grounding-release.jks
      CURRENT_BASE_HEAD: 75d14e9dec15fb7bf8fdc582ba991452867f704c

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated current-grounding delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-current-grounding-v124"
          git cat-file -e "$CURRENT_BASE_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$CURRENT_BASE_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-current-grounding-v1024.yml|\
              fresh-rebuild/src/nova57-web-research-router-compat.js) ;;
              *) echo "Unexpected current-grounding change: $f"; exit 1 ;;
            esac
          done
          grep -Fq 'NOVA RUNTIME FACTS' fresh-rebuild/src/nova57-web-research-router-compat.js
          grep -Fq '__novaCurrentGrounding' fresh-rebuild/src/nova57-web-research-router-compat.js
          grep -Fq 'training-knowledge cutoff' fresh-rebuild/src/nova57-web-research-router-compat.js
          grep -Fq 'live web research ko latest/current request' fresh-rebuild/src/nova57-web-research-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-web-research-router-compat.js
          git diff --quiet "$CURRENT_BASE_HEAD" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$CURRENT_BASE_HEAD" HEAD -- fresh-rebuild/assets/styles/nova57-clean-screen.css
          git diff --quiet "$CURRENT_BASE_HEAD" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$CURRENT_BASE_HEAD" HEAD -- functions
          git diff --quiet "$CURRENT_BASE_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.24 vc25 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 25', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.24"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed current-grounding APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-current-grounding-v1024-build.log"

      - name: Verify signature and current-grounding bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-current-grounding-v1024-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-current-grounding-v1024-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/nova57-web-research-router-compat.js',
                  'assets/www/src/nova57-github-public-router-compat.js',
                  'assets/www/src/nova57-keyless-max-router-compat.js',
                  'assets/www/assets/styles/nova57-clean-screen.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              web = z.read('assets/www/src/nova57-web-research-router-compat.js').decode('utf-8')
              for marker in ('NOVA RUNTIME FACTS','__novaCurrentGrounding','Current year:','training-knowledge cutoff','live web research ko latest/current request'):
                  if marker not in web:
                      raise SystemExit(f'Current-grounding marker missing: {marker}')
          print('NOVA current-grounding bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1024-current-grounding
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.24-vc25-NOVA-5.7-Current-Grounding-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.24-vc25-NOVA-5.7-Current-Grounding-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-current-grounding-v1024-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-current-grounding-v1024-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.24 vc25
          NOVA AI keyless router: preserved
          Live web research: preserved
          Public GitHub read: preserved
          Added: current runtime UTC timestamp/year injected into every NOVA request
          Added: truthful capability grounding so old model self-descriptions cannot override NOVA tool capabilities
          Added: stale knowledge-cutoff / false browsing-unavailable response cleanup
          Current clean NOVA UI: UNCHANGED
          Mining/reward/wallet/core source delta: NONE
          Full-app remote OTA override: DISABLED
          Permanent signature verification: PASS
          RESULT: SIGNED CURRENT-GROUNDING APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1024-publish
          git worktree add /tmp/nx-v1024-publish origin/apk-builds
          cd /tmp/nx-v1024-publish
          rm -rf nova-v1.0.24-current-grounding
          mkdir -p nova-v1.0.24-current-grounding
          cp -a /tmp/nexusnova-v1024-current-grounding/. nova-v1.0.24-current-grounding/
          git add -A nova-v1.0.24-current-grounding
          git commit -m "Publish NexusNova v1.0.24 NOVA current-grounding $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
