name: NexusNova v1.0.25 Nova Drive Persistence Signed

on:
  push:
    branches: [nova-sol57-current-grounding-v124]
    paths:
      - '.github/workflows/nexusnova-nova57-drive-persistence-v1025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1025-drive-release.jks

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated Nova Drive and Track source
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/src/core/drive-track-persistence.js
          test -s fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          node --input-type=module --check < fresh-rebuild/src/core/drive-track-persistence.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          grep -Fq 'hydrateDriveTrackState' fresh-rebuild/src/core/drive-track-persistence.js
          grep -Fq 'persistDriveTrackState' fresh-rebuild/src/core/drive-track-persistence.js
          grep -Fq 'restoreActiveSnapshot()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq '.addAction(0, "Pause", pause)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq '.addAction(0, "Stop", stop)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_NATIVE_DRIVE_PAUSE' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_NATIVE_DRIVE_RESUME' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_NATIVE_DRIVE_STOP' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.25 vc26 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 26', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.25"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed v1.0.25 APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-drive-v1025-build.log"

      - name: Verify signature and bundled Drive update
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-drive-v1025-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-drive-v1025-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/core/drive-track-persistence.js',
                  'assets/www/src/features/apps/premium-drive-native-v2.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              persistence = z.read('assets/www/src/core/drive-track-persistence.js').decode('utf-8')
              native = z.read('assets/www/src/features/apps/premium-drive-native-v2.js').decode('utf-8')
              for marker in ('hydrateDriveTrackState','persistDriveTrackState'):
                  if marker not in persistence:
                      raise SystemExit(f'Persistence marker missing: {marker}')
              if 'hydrateDriveTrackState' not in native:
                  raise SystemExit('Native Drive hydration marker missing')
          print('Nova Drive/Track bundled update checks: PASS')
          PY

      - name: Publish verified update to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1025-drive
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.25-vc26-Nova-Drive-Persistence-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.25-vc26-Nova-Drive-Persistence-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-drive-v1025-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-drive-v1025-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.25 vc26
          Nova Drive completed history cloud persistence: INCLUDED
          Nova Track history restore after reinstall: INCLUDED
          Device-to-account Drive/Track migration: INCLUDED
          Active Drive crash/process recovery: INCLUDED
          Lock-screen Start/Resume, Pause, Stop controls: INCLUDED
          Mining/reward/wallet/NOVA AI: UNCHANGED
          Full-app remote OTA override: DISABLED
          Permanent signature verification: PASS
          RESULT: SIGNED NATIVE UPDATE READY FOR PHONE INSTALL
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1025-publish
          git worktree add /tmp/nx-v1025-publish origin/apk-builds
          cd /tmp/nx-v1025-publish
          rm -rf nova-v1.0.25-drive-persistence
          mkdir -p nova-v1.0.25-drive-persistence
          cp -a /tmp/nexusnova-v1025-drive/. nova-v1.0.25-drive-persistence/
          git add -A nova-v1.0.25-drive-persistence
          git commit -m "Publish NexusNova v1.0.25 Drive persistence $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
