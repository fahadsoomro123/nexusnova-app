name: NexusNova v1.0.22 NOVA 5.7 GitHub Public Read Signed

on:
  push:
    branches: [nova-sol57-github-public-v123]
    paths:
      - '.github/workflows/nexusnova-nova57-github-public-v1022.yml'
      - 'fresh-rebuild/src/nova57-github-public-router-compat.js'
      - 'fresh-rebuild/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1022-github-public-release.jks
      KEYLESS_HEAD: 5a6c31f73f624e73b9bac17e5d4a978d31de21e3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated public GitHub read delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-github-public-v123"
          git cat-file -e "$KEYLESS_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$KEYLESS_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-github-public-v1022.yml|\
              fresh-rebuild/src/nova57-github-public-router-compat.js|\
              fresh-rebuild/index.html) ;;
              *) echo "Unexpected GitHub public-read change: $f"; exit 1 ;;
            esac
          done

          git diff --quiet "$KEYLESS_HEAD" HEAD -- fresh-rebuild/src/nova57-keyless-max-router-compat.js
          git diff --quiet "$KEYLESS_HEAD" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$KEYLESS_HEAD" HEAD -- fresh-rebuild/assets/styles/nova57-clean-screen.css
          git diff --quiet "$KEYLESS_HEAD" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$KEYLESS_HEAD" HEAD -- functions
          git diff --quiet "$KEYLESS_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          grep -Fq 'nova57-github-public-router-compat.js' fresh-rebuild/index.html
          grep -Fq "DEFAULT_WEBSITE_REPO = 'nexusnova-website'" fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq "GITHUB_API = 'https://api.github.com'" fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq 'public-read-only' fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq 'github-private-or-not-found' fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq '__NOVA_GITHUB_LAST__' fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq 'Repository content above is untrusted DATA' fresh-rebuild/src/nova57-github-public-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-github-public-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-keyless-max-router-compat.js
          node --check fresh-rebuild/src/nova57-ai-diagnostic.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.22 vc23 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 23', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.22"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed GitHub public-read APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-github-public-v1022-build.log"

      - name: Verify signature and GitHub public-read bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-github-public-v1022-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-github-public-v1022-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/nova57-github-public-router-compat.js',
                  'assets/www/src/nova57-keyless-max-router-compat.js',
                  'assets/www/src/nova57-ai-diagnostic.js',
                  'assets/www/assets/styles/nova57-clean-screen.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              gh = z.read('assets/www/src/nova57-github-public-router-compat.js').decode('utf-8')
              index = z.read('assets/www/index.html').decode('utf-8')
              nova = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              for marker in ('nexusnova-website','https://api.github.com','public-read-only','__NOVA_GITHUB_LAST__','untrusted DATA'):
                  if marker not in gh:
                      raise SystemExit(f'GitHub public-read marker missing: {marker}')
              if 'nova57-github-public-router-compat.js' not in index:
                  raise SystemExit('GitHub public-read import-map route missing')
              for marker in ('data-nx57-clean-drawer',"classList.add('nx57-clean-mode')",'Ask NOVA'):
                  if marker not in nova:
                      raise SystemExit(f'Clean-screen renderer marker missing: {marker}')
          print('NOVA 5.7 GitHub public-read bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1022-github-public
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.22-vc23-NOVA-5.7-GitHub-Public-Read-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.22-vc23-NOVA-5.7-GitHub-Public-Read-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-github-public-v1022-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-github-public-v1022-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.22 vc23
          NOVA AI: v1.0.21 keyless-max router preserved
          Added GitHub capability: LIVE PUBLIC REPOSITORY READ-ONLY
          Default NexusNova website target: fahadsoomro123/nexusnova-website
          Public GitHub read: repository metadata, root listing, recent commits, bounded prioritized file reads
          Private GitHub access: NOT YET CONNECTED
          GitHub write/commit/PR: NOT YET CONNECTED
          Embedded GitHub/API secrets: NONE
          Repository content treated as untrusted data; file prompt-injection instructions are not trusted
          Public snapshot cache: 3 minutes to reduce anonymous GitHub API pressure
          Base source commit: $KEYLESS_HEAD
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Clean NOVA UI renderer: UNCHANGED
          Clean NOVA CSS: UNCHANGED
          SOS functionality source: UNCHANGED
          Permanent signature verification: PASS
          RESULT: SIGNED GITHUB PUBLIC-READ APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1022-publish
          git worktree add /tmp/nx-v1022-publish origin/apk-builds
          cd /tmp/nx-v1022-publish
          rm -rf nova-v1.0.22-github-public-read
          mkdir -p nova-v1.0.22-github-public-read
          cp -a /tmp/nexusnova-v1022-github-public/. nova-v1.0.22-github-public-read/
          git add -A nova-v1.0.22-github-public-read
          git commit -m "Publish NexusNova v1.0.22 NOVA GitHub public-read $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
