name: NexusNova v1.0.28 NOVA 5.7 High-End Signed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1028-highend-release.jks
      HIGHEND_BASE_HEAD: b6d37bfe1e07c95ffa5a7a8a5bb26120da87dc36

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated NOVA high-end delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-runtime-recovery-v128"
          git cat-file -e "$HIGHEND_BASE_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$HIGHEND_BASE_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-runtime-recovery-v1027.yml|\
              .github/workflows/nexusnova-nova57-highend-v1028.yml|\
              .github/workflows/nova57-adaptive-router-check.yml|\
              .github/workflows/nova57-brain-discovery-check.yml|\
              .github/workflows/nova57-living-experience-check.yml|\
              fresh-rebuild/index.html|\
              fresh-rebuild/src/nova57-runtime-recovery-router-compat.js|\
              fresh-rebuild/src/nova57-history-safety.js|\
              fresh-rebuild/src/nova57-adaptive-client-router-compat.js|\
              fresh-rebuild/src/nova57-living-experience.js|\
              fresh-rebuild/src/nova57-premium-runtime.js|\
              fresh-rebuild/assets/styles/nova57-living-experience.css|\
              fresh-rebuild/assets/styles/nova57-premium-runtime.css|\
              functions/main.js|\
              functions/novaAdaptiveRouter.js|\
              functions/novaBrainDiscovery.js) ;;
              *) echo "Unexpected high-end delta: $f"; exit 1 ;;
            esac
          done

          node --input-type=module --check < fresh-rebuild/src/nova57-runtime-recovery-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-history-safety.js
          node --input-type=module --check < fresh-rebuild/src/nova57-adaptive-client-router-compat.js
          node --check fresh-rebuild/src/nova57-living-experience.js
          node --check fresh-rebuild/src/nova57-premium-runtime.js
          node --check functions/novaAdaptiveRouter.js
          node --check functions/novaBrainDiscovery.js

          grep -Fq 'nova57-adaptive-client-router-compat.js' fresh-rebuild/index.html
          grep -Fq 'nova57-history-safety.js' fresh-rebuild/index.html
          grep -Fq 'nova57-living-experience.js' fresh-rebuild/index.html
          grep -Fq 'nova57-premium-runtime.js' fresh-rebuild/index.html
          grep -Fq 'nova57-living-experience.css' fresh-rebuild/index.html
          grep -Fq 'nova57-premium-runtime.css' fresh-rebuild/index.html
          grep -Fq 'foreground-fast-path' fresh-rebuild/src/nova57-runtime-recovery-router-compat.js
          grep -Fq 'STICKY_WINNER_TTL_MS' fresh-rebuild/src/nova57-adaptive-client-router-compat.js
          grep -Fq 'EXACT_CACHE_TTL_MS' fresh-rebuild/src/nova57-adaptive-client-router-compat.js
          grep -Fq 'nx57-jump-latest' fresh-rebuild/src/nova57-living-experience.js
          grep -Fq 'DRAFT_KEY' fresh-rebuild/src/nova57-premium-runtime.js
          grep -Fq 'foregroundIsolation: true' functions/novaAdaptiveRouter.js
          grep -Fq "schedule: 'every 30 minutes'" functions/novaBrainDiscovery.js

          # Protected product surfaces must remain byte-identical to the trusted base.
          git diff --quiet "$HIGHEND_BASE_HEAD" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$HIGHEND_BASE_HEAD" HEAD -- fresh-rebuild/assets/styles/nova57-chatgpt-native.css
          git diff --quiet "$HIGHEND_BASE_HEAD" HEAD -- fresh-rebuild/src/features/apps/mining-integrations.js
          git diff --quiet "$HIGHEND_BASE_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.28 vc29 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 29', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.28"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed NOVA high-end APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-highend-v1028-build.log"

      - name: Verify signature and high-end NOVA bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-highend-v1028-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-highend-v1028-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/nova57-runtime-recovery-router-compat.js',
                  'assets/www/src/nova57-history-safety.js',
                  'assets/www/src/nova57-adaptive-client-router-compat.js',
                  'assets/www/src/nova57-living-experience.js',
                  'assets/www/src/nova57-premium-runtime.js',
                  'assets/www/src/nova57-keyless-max-router-compat.js',
                  'assets/www/src/nova57-puter-keyless-provider.js',
                  'assets/www/assets/styles/nova57-chatgpt-native.css',
                  'assets/www/assets/styles/nova57-living-experience.css',
                  'assets/www/assets/styles/nova57-premium-runtime.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              index = z.read('assets/www/index.html').decode('utf-8')
              adaptive = z.read('assets/www/src/nova57-adaptive-client-router-compat.js').decode('utf-8')
              living = z.read('assets/www/src/nova57-living-experience.js').decode('utf-8')
              premium = z.read('assets/www/src/nova57-premium-runtime.js').decode('utf-8')
              recovery = z.read('assets/www/src/nova57-runtime-recovery-router-compat.js').decode('utf-8')
              for marker in ('nova57-adaptive-client-router-compat.js','nova57-history-safety.js','nova57-living-experience.js','nova57-premium-runtime.js','nova57-living-experience.css','nova57-premium-runtime.css'):
                  if marker not in index:
                      raise SystemExit(f'Index marker missing: {marker}')
              for marker in ('foreground-fast-path','resilient-public-read','Partial flags','BASE_FALLBACK_TIMEOUT_MS'):
                  if marker not in recovery:
                      raise SystemExit(f'Recovery marker missing: {marker}')
              for marker in ('STICKY_WINNER_TTL_MS','EXACT_CACHE_TTL_MS','Promise.any','obviouslySensitive'):
                  if marker not in adaptive:
                      raise SystemExit(f'Adaptive marker missing: {marker}')
              for marker in ('nx57-jump-latest','Retry','navigator.onLine'):
                  if marker not in living:
                      raise SystemExit(f'Living marker missing: {marker}')
              for marker in ('DRAFT_KEY','nx57-performance-lite','Draft restored'):
                  if marker not in premium:
                      raise SystemExit(f'Premium marker missing: {marker}')
          print('NOVA v1.0.28 high-end client bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1028-highend
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.28-vc29-NOVA-5.7-HighEnd-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.28-vc29-NOVA-5.7-HighEnd-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-highend-v1028-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-highend-v1028-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.28 vc29
          NOVA runtime recovery router: BUNDLED
          Adaptive foreground client gateway: BUNDLED with no-delay safe fallback
          Sticky winner + exact repeat cache + bounded hedging: BUNDLED
          Clean NOVA living interaction layer: BUNDLED
          Smart scroll + Latest jump + Copy/Listen/Retry actions: BUNDLED
          Draft recovery + device/network-aware lightweight mode: BUNDLED
          Truthful measured response feedback: BUNDLED
          Server adaptive/discovery source: VERIFIED IN REPO, NOT ASSERTED DEPLOYED BY THIS APK BUILD
          NOVA clean ChatGPT-style renderer/typography: PRESERVED
          Mining/reward/wallet/core source delta: NONE IN ALLOWED RELEASE DELTA
          Full-app remote OTA override: DISABLED/PRESERVED
          Permanent signature verification: PASS
          RESULT: SIGNED HIGH-END CLIENT APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1028-publish
          git worktree add /tmp/nx-v1028-publish origin/apk-builds
          cd /tmp/nx-v1028-publish
          rm -rf nova-v1.0.28-highend
          mkdir -p nova-v1.0.28-highend
          cp -a /tmp/nexusnova-v1028-highend/. nova-v1.0.28-highend/
          git add -A nova-v1.0.28-highend
          git commit -m "Publish NexusNova v1.0.28 NOVA high-end $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"