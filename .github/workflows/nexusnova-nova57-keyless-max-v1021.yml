name: NexusNova v1.0.21 NOVA 5.7 Keyless-Max Router Signed

on:
  push:
    branches: [nova-sol57-keyless150-sample-v122]
    paths:
      - '.github/workflows/nexusnova-nova57-keyless-max-v1021.yml'
      - 'fresh-rebuild/src/nova57-keyless-max-router-compat.js'
      - 'fresh-rebuild/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1021-keyless-max-release.jks
      KEYLESS_BASE_HEAD: 4637b392b41894bc274e467a9e4319046d4b2b56

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated keyless-max sample delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-keyless150-sample-v122"
          git cat-file -e "$KEYLESS_BASE_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$KEYLESS_BASE_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-keyless-max-v1021.yml|\
              fresh-rebuild/src/nova57-keyless-max-router-compat.js|\
              fresh-rebuild/index.html) ;;
              *) echo "Unexpected keyless-max sample change: $f"; exit 1 ;;
            esac
          done

          git diff --quiet "$KEYLESS_BASE_HEAD" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$KEYLESS_BASE_HEAD" HEAD -- fresh-rebuild/assets/styles/nova57-clean-screen.css
          git diff --quiet "$KEYLESS_BASE_HEAD" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$KEYLESS_BASE_HEAD" HEAD -- functions
          git diff --quiet "$KEYLESS_BASE_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          grep -Fq 'nova57-keyless-max-router-compat.js' fresh-rebuild/index.html
          grep -Fq 'MAX_ROUTES = 150' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'kilo-auto/free' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'Bearer unused' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'text.pollinations.ai' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'status/models?type=text' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'oai.endpoints.kepler.ai.cloud.ovh.net' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'new mod.GoogleAIBackend()' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-keyless-max-router-compat.js
          node --check fresh-rebuild/src/nova57-ai-diagnostic.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.21 vc22 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 22', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.21"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed keyless-max APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-keyless-max-v1021-build.log"

      - name: Verify signature and keyless-max bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-keyless-max-v1021-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-keyless-max-v1021-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/src/nova57-keyless-max-router-compat.js',
                  'assets/www/src/nova57-ai-diagnostic.js',
                  'assets/www/assets/styles/nova57-clean-screen.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              router = z.read('assets/www/src/nova57-keyless-max-router-compat.js').decode('utf-8')
              index = z.read('assets/www/index.html').decode('utf-8')
              nova = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              for marker in ('MAX_ROUTES = 150','kilo-auto/free','Bearer unused','text.pollinations.ai','status/models?type=text','oai.endpoints.kepler.ai.cloud.ovh.net','new mod.GoogleAIBackend()','__NOVA_KEYLESS_ROUTE_POOL__'):
                  if marker not in router:
                      raise SystemExit(f'Keyless-max marker missing: {marker}')
              if 'nova57-keyless-max-router-compat.js' not in index:
                  raise SystemExit('Keyless-max import-map route missing')
              for marker in ('data-nx57-clean-drawer',"classList.add('nx57-clean-mode')",'Ask NOVA'):
                  if marker not in nova:
                      raise SystemExit(f'Clean-screen renderer marker missing: {marker}')
          print('NOVA 5.7 keyless-max sample bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1021-keyless-max
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.21-vc22-NOVA-5.7-Keyless-Max-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.21-vc22-NOVA-5.7-Keyless-Max-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-keyless-max-v1021-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-keyless-max-v1021-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.21 vc22
          NOVA AI sample: keyless-max multi-provider router
          Base source commit: $KEYLESS_BASE_HEAD
          Source commit: $GITHUB_SHA
          Live route cap: 150 model routes discovered dynamically at runtime
          IMPORTANT: route cap is not a claim of 150 independent providers
          Keyless/anonymous provider paths: Kilo free gateway, LLM7 anonymous tier, Pollinations classic text, OVH anonymous discovery, AI Horde anonymous community network
          Fast failover: failing/rate-limited routes use temporary circuit breakers and the next route is attempted
          Sticky success: last working route is tried first on the next message
          Firebase fallback: rebuilt with a real GoogleAIBackend to remove v1.0.20 Invalid backend bug
          Embedded private API secrets: NONE
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Clean NOVA UI renderer: UNCHANGED
          Clean NOVA CSS: UNCHANGED
          SOS functionality source: UNCHANGED
          Permanent signature verification: PASS
          RESULT: SIGNED KEYLESS-MAX SAMPLE APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1021-publish
          git worktree add /tmp/nx-v1021-publish origin/apk-builds
          cd /tmp/nx-v1021-publish
          rm -rf nova-v1.0.21-keyless-max
          mkdir -p nova-v1.0.21-keyless-max
          cp -a /tmp/nexusnova-v1021-keyless-max/. nova-v1.0.21-keyless-max/
          git add -A nova-v1.0.21-keyless-max
          git commit -m "Publish NexusNova v1.0.21 NOVA keyless-max $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.21-vc22-NOVA-5.7-Keyless-Max-SIGNED
          path: /tmp/nexusnova-v1021-keyless-max/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
