name: NexusNova v1.0.17 NOVA 5.7 Measured Fit Signed

on:
  push:
    branches: [nova-sol57-measured-fit-v118]
    paths:
      - '.github/workflows/nexusnova-nova57-measured-fit-v1017.yml'
      - 'fresh-rebuild/assets/styles/nova57-viewport-fit.css'
      - 'fresh-rebuild/src/nova57-stage-compat.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1017-measured-fit-release.jks
      MEASURED_FIT_BASE: 225b7b128dd21d278f49d80928eac6e5f369a045

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify NOVA measured-fit isolated delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-measured-fit-v118"
          git cat-file -e "$MEASURED_FIT_BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$MEASURED_FIT_BASE" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-measured-fit-v1017.yml|\
              fresh-rebuild/assets/styles/nova57-viewport-fit.css|\
              fresh-rebuild/src/nova57-stage-compat.js) ;;
              *) echo "Unexpected measured-fit change: $f"; exit 1 ;;
            esac
          done
          git diff --quiet "$MEASURED_FIT_BASE" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$MEASURED_FIT_BASE" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$MEASURED_FIT_BASE" HEAD -- fresh-rebuild/src/features/apps/app-screen.js
          git diff --quiet "$MEASURED_FIT_BASE" HEAD -- functions
          git diff --quiet "$MEASURED_FIT_BASE" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq -- '--nx57-measured-height' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          grep -Fq 'padding-bottom: 0' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          grep -Fq 'dock.getBoundingClientRect().top' fresh-rebuild/src/nova57-stage-compat.js
          grep -Fq 'PREMIUM_GAP_PX = 8' fresh-rebuild/src/nova57-stage-compat.js
          grep -Fq 'window.visualViewport?.addEventListener' fresh-rebuild/src/nova57-stage-compat.js
          grep -Fq 'html.nx57-stage-active #nxEmergencySosButton' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          node --check fresh-rebuild/src/nova57-stage-compat.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.17 vc18 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 18', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.17"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed measured-fit APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-measured-fit-v1017-build.log"

      - name: Verify signature and measured-fit bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-measured-fit-v1017-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-measured-fit-v1017-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/assets/styles/nova57-viewport-fit.css',
                  'assets/www/src/nova57-stage-compat.js',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
                  'assets/www/src/features/apps/app-screen.js',
                  'assets/www/src/emergency-sos.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              fit = z.read('assets/www/assets/styles/nova57-viewport-fit.css').decode('utf-8')
              compat = z.read('assets/www/src/nova57-stage-compat.js').decode('utf-8')
              registry = z.read('assets/www/src/features/hub/app-registry.js').decode('utf-8')
              for marker in ('--nx57-measured-height','padding-bottom: 0','html.nx57-stage-active #nxEmergencySosButton'):
                  if marker not in fit:
                      raise SystemExit(f'Measured-fit marker missing: {marker}')
              for marker in ('dock.getBoundingClientRect().top','PREMIUM_GAP_PX = 8','window.visualViewport?.addEventListener'):
                  if marker not in compat:
                      raise SystemExit(f'Runtime measured-fit marker missing: {marker}')
              if 'nova-internet-speed' in registry:
                  raise SystemExit('Internet Speed registry entry returned')
          print('NOVA 5.7 measured-fit APK bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1017-measured-fit
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.17-vc18-NOVA-5.7-Measured-Fit-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.17-vc18-NOVA-5.7-Measured-Fit-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-measured-fit-v1017-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-measured-fit-v1017-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.17 vc18
          NOVA AI: 5.7 Sol measured dock fit
          Measured-fit base commit: $MEASURED_FIT_BASE
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Root cause: Android WebView viewport-unit math did not match the fixed dock's actual screen geometry
          Real dock-top runtime measurement: VERIFIED IN BUNDLE
          Target NOVA-to-dock gap: 8px
          Keyboard/viewport remeasurement hooks: VERIFIED IN BUNDLE
          SOS remains outside chat lane and compact: VERIFIED IN BUNDLE
          SOS functionality source: UNCHANGED
          Permanent signature verification: PASS
          RESULT: SIGNED MEASURED-FIT APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1017-publish
          git worktree add /tmp/nx-v1017-publish origin/apk-builds
          cd /tmp/nx-v1017-publish
          rm -rf nova-v1.0.17-measured-fit
          mkdir -p nova-v1.0.17-measured-fit
          cp -a /tmp/nexusnova-v1017-measured-fit/. nova-v1.0.17-measured-fit/
          git add -A nova-v1.0.17-measured-fit
          git commit -m "Publish NexusNova v1.0.17 NOVA measured fit $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.17-vc18-NOVA-5.7-Measured-Fit-SIGNED
          path: /tmp/nexusnova-v1017-measured-fit/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
