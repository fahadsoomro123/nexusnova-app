name: NexusNova v1.0.26 NOVA 5.7 Native Polish Signed

on:
  push:
    branches: [nova-sol57-polish-v127]
    paths:
      - '.github/workflows/nexusnova-nova57-native-polish-v1026.yml'
      - '.github/workflows/nova57-polish-check.yml'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/assets/styles/nova57-chatgpt-native.css'
      - 'fresh-rebuild/src/features/apps/nova-sol57-fresh.js'
      - 'fresh-rebuild/src/features/apps/nova57-task-status.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1026-native-polish-release.jks
      POLISH_BASE_HEAD: e23ff7273a22e1e3b62cea6e8f48676f48592cf8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated NOVA polish delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-polish-v127"
          git cat-file -e "$POLISH_BASE_HEAD^{commit}"
          mapfile -t changed < <(git diff --name-only "$POLISH_BASE_HEAD" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nova57-polish-check.yml|\
              .github/workflows/nexusnova-nova57-native-polish-v1026.yml|\
              fresh-rebuild/index.html|\
              fresh-rebuild/assets/styles/nova57-chatgpt-native.css|\
              fresh-rebuild/src/features/apps/nova-sol57-fresh.js|\
              fresh-rebuild/src/features/apps/nova57-task-status.js) ;;
              *) echo "Unexpected NOVA polish change: $f"; exit 1 ;;
            esac
          done
          node --input-type=module --check < fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/nova57-task-status.js
          node --input-type=module --check < fresh-rebuild/src/nova57-keyless-max-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-puter-keyless-provider.js
          grep -Fq 'nova57-chatgpt-native.css' fresh-rebuild/index.html
          grep -Fq 'createTaskStatus' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="images"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="library"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="projects"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="remote"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="scheduled"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-side-action="plugins"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'no fake timed progression' fresh-rebuild/src/features/apps/nova57-task-status.js
          ! grep -Fq 'setInterval' fresh-rebuild/src/features/apps/nova57-task-status.js
          grep -Fq 'discoverPuterFreeRoutes' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq 'PUTER_VERIFIED_FREE_SEED_COUNT' fresh-rebuild/src/nova57-keyless-max-router-compat.js
          git diff --quiet "$POLISH_BASE_HEAD" HEAD -- fresh-rebuild/src/features/apps/mining-integrations.js
          git diff --quiet "$POLISH_BASE_HEAD" HEAD -- functions
          git diff --quiet "$POLISH_BASE_HEAD" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.26 vc27 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 27', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.26"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed native-polish APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-native-polish-v1026-build.log"

      - name: Verify signature and NOVA bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-native-polish-v1026-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-native-polish-v1026-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/assets/styles/nova57-chatgpt-native.css',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
                  'assets/www/src/features/apps/nova57-task-status.js',
                  'assets/www/src/nova57-web-research-router-compat.js',
                  'assets/www/src/nova57-github-public-router-compat.js',
                  'assets/www/src/nova57-keyless-max-router-compat.js',
                  'assets/www/src/nova57-puter-keyless-provider.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              renderer = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              task = z.read('assets/www/src/features/apps/nova57-task-status.js').decode('utf-8')
              css = z.read('assets/www/assets/styles/nova57-chatgpt-native.css').decode('utf-8')
              router = z.read('assets/www/src/nova57-keyless-max-router-compat.js').decode('utf-8')
              for marker in ('createTaskStatus','data-nx57-side-action="remote"','nx57-native-drawer'):
                  if marker not in renderer and marker not in css:
                      raise SystemExit(f'NOVA polish marker missing: {marker}')
              if 'setInterval' in task:
                  raise SystemExit('Fake timed task status progression found')
              if 'discoverPuterFreeRoutes' not in router:
                  raise SystemExit('Puter keyless router integration missing')
          print('NOVA native-polish bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1026-native-polish
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.26-vc27-NOVA-5.7-Native-Polish-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.26-vc27-NOVA-5.7-Native-Polish-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-native-polish-v1026-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-native-polish-v1026-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.26 vc27
          NOVA clean screen: preserved
          Dedicated NOVA typography/style file: bundled
          Thinking/activity status: renderer-owned and no fake timed progression
          Sidebar: renderer-owned ChatGPT-style layout
          Sidebar actions: Images, Library, Projects, Remote, Scheduled, Plugins wired to real available app actions
          Response speed: Fast mode defaults to shorter context/output budget
          Keyless router + Puter free routes: preserved
          Live web research + public GitHub read: preserved
          Mining/reward/wallet/core source delta: NONE
          Full-app remote OTA override: DISABLED
          Permanent signature verification: PASS
          RESULT: SIGNED APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1026-publish
          git worktree add /tmp/nx-v1026-publish origin/apk-builds
          cd /tmp/nx-v1026-publish
          rm -rf nova-v1.0.26-native-polish
          mkdir -p nova-v1.0.26-native-polish
          cp -a /tmp/nexusnova-v1026-native-polish/. nova-v1.0.26-native-polish/
          git add -A nova-v1.0.26-native-polish
          git commit -m "Publish NexusNova v1.0.26 NOVA native polish $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
