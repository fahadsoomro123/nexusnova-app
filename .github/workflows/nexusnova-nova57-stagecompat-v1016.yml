name: NexusNova v1.0.16 NOVA 5.7 Stage Compat Signed

on:
  push:
    branches: [nova-sol57-stagecompat-sos-v117]
    paths:
      - '.github/workflows/nexusnova-nova57-stagecompat-v1016.yml'
      - 'fresh-rebuild/assets/styles/nova57-viewport-fit.css'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/src/nova57-stage-compat.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1016-stagecompat-release.jks
      STAGE_COMPAT_BASE: b9450cff3f94be3f7b5c5df5fb66fb9eed223734

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify NOVA stage-compat isolated delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-stagecompat-sos-v117"
          git cat-file -e "$STAGE_COMPAT_BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$STAGE_COMPAT_BASE" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-stagecompat-v1016.yml|\
              fresh-rebuild/assets/styles/nova57-viewport-fit.css|\
              fresh-rebuild/index.html|\
              fresh-rebuild/src/nova57-stage-compat.js) ;;
              *) echo "Unexpected stage-compat change: $f"; exit 1 ;;
            esac
          done
          git diff --quiet "$STAGE_COMPAT_BASE" HEAD -- fresh-rebuild/src/emergency-sos.js
          git diff --quiet "$STAGE_COMPAT_BASE" HEAD -- fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          git diff --quiet "$STAGE_COMPAT_BASE" HEAD -- fresh-rebuild/src/features/apps/app-screen.js
          git diff --quiet "$STAGE_COMPAT_BASE" HEAD -- functions
          git diff --quiet "$STAGE_COMPAT_BASE" HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq '.nx-stage.nx57-stage-active' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          grep -Fq '+ 8px' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          grep -Fq 'html.nx57-stage-active #nxEmergencySosButton' fresh-rebuild/assets/styles/nova57-viewport-fit.css
          grep -Fq 'nova57-stage-compat.js' fresh-rebuild/index.html
          grep -Fq "document.documentElement.classList.toggle(ACTIVE_CLASS, active)" fresh-rebuild/src/nova57-stage-compat.js
          grep -Fq "stage.classList.toggle(ACTIVE_CLASS, active)" fresh-rebuild/src/nova57-stage-compat.js
          node --check fresh-rebuild/src/nova57-stage-compat.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.16 vc17 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 17', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.16"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed stage-compat APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-stagecompat-v1016-build.log"

      - name: Verify signature and stage-compat bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-stagecompat-v1016-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-stagecompat-v1016-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          with zipfile.ZipFile(apk) as z:
              required = {
                  'assets/www/index.html',
                  'assets/www/assets/styles/nova57-viewport-fit.css',
                  'assets/www/src/nova57-stage-compat.js',
                  'assets/www/src/features/apps/nova-sol57-fresh.js',
                  'assets/www/src/features/apps/app-screen.js',
                  'assets/www/src/emergency-sos.js',
              }
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              fit = z.read('assets/www/assets/styles/nova57-viewport-fit.css').decode('utf-8')
              compat = z.read('assets/www/src/nova57-stage-compat.js').decode('utf-8')
              index = z.read('assets/www/index.html').decode('utf-8')
              registry = z.read('assets/www/src/features/hub/app-registry.js').decode('utf-8')
              for marker in ('.nx-stage.nx57-stage-active','+ 8px','html.nx57-stage-active #nxEmergencySosButton'):
                  if marker not in fit:
                      raise SystemExit(f'Stage-compat marker missing: {marker}')
              for marker in ('stage.classList.toggle(ACTIVE_CLASS, active)','document.documentElement.classList.toggle(ACTIVE_CLASS, active)'):
                  if marker not in compat:
                      raise SystemExit(f'Runtime marker missing: {marker}')
              if 'nova57-stage-compat.js' not in index:
                  raise SystemExit('Stage compatibility script not loaded')
              if 'nova-internet-speed' in registry:
                  raise SystemExit('Internet Speed registry entry returned')
          print('NOVA 5.7 stage compatibility bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1016-stagecompat
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.16-vc17-NOVA-5.7-Stage-Compat-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.16-vc17-NOVA-5.7-Stage-Compat-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-stagecompat-v1016-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-stagecompat-v1016-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.16 vc17
          NOVA AI: 5.7 Sol Android WebView stage compatibility + SOS placement
          Stage-compat base commit: $STAGE_COMPAT_BASE
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward/core source delta: NONE
          Root cause: Android WebView parent-selector compatibility left generic 58px stage reserve active
          Explicit NOVA stage class: VERIFIED IN BUNDLE
          Premium dock gap: 8px rule VERIFIED IN BUNDLE
          SOS moved to NOVA header lane: VERIFIED IN BUNDLE
          SOS functionality source: UNCHANGED
          Permanent signature verification: PASS
          RESULT: SIGNED STAGE-COMPAT APK READY FOR PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1016-publish
          git worktree add /tmp/nx-v1016-publish origin/apk-builds
          cd /tmp/nx-v1016-publish
          rm -rf nova-v1.0.16-stagecompat
          mkdir -p nova-v1.0.16-stagecompat
          cp -a /tmp/nexusnova-v1016-stagecompat/. nova-v1.0.16-stagecompat/
          git add -A nova-v1.0.16-stagecompat
          git commit -m "Publish NexusNova v1.0.16 NOVA stage compat $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.16-vc17-NOVA-5.7-Stage-Compat-SIGNED
          path: /tmp/nexusnova-v1016-stagecompat/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
