name: NexusNova v1.0.10 NOVA 5.7 Sol Signed

on:
  push:
    branches: [nova-sol57-fresh-ai-ota-v111]
    paths:
      - '.github/workflows/nexusnova-nova57-v1010.yml'
      - 'fresh-rebuild/src/features/apps/nova-sol57-fresh.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-v1010-sol57-release.jks
      STABLE_BASE: 9353ae89f769f4aaf13f5cfecfec722d9f98091e

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated NOVA-only source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-fresh-ai-ota-v111"
          git cat-file -e "$STABLE_BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$STABLE_BASE" HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nexusnova-nova57-v1010.yml|\
              fresh-rebuild/src/features/apps/nova-sol57-fresh.js|\
              fresh-rebuild/src/features/apps/app-screen.js) ;;
              *) echo "Unexpected non-NOVA change: $f"; exit 1 ;;
            esac
          done
          test -s fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "NOVA 5.7 Sol" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "novaSol57Renderers" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "novaSol57Renderers[id] ||" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          test ! -e fresh-rebuild/src/features/apps/premium-speed-safe-v2.js
          test ! -e fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          node --check fresh-rebuild/src/features/apps/news-resilient.js

      - name: Wire existing native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.10 vc11 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 11', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.10"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed update APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/nova57-v1010-build.log"

      - name: Verify signature and NOVA 5.7 bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/nova57-v1010-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/nova57-v1010-signature.txt"
          APK="$APK" python3 - <<'PY'
          import os, zipfile
          apk = os.environ['APK']
          required = {
              'assets/www/src/features/apps/nova-sol57-fresh.js',
              'assets/www/src/features/apps/app-screen.js',
              'assets/www/src/features/apps/premium-qibla-safe-v2.js',
              'assets/www/src/features/apps/news-resilient.js',
              'assets/www/src/features/apps/premium-drive-native-v2.js',
          }
          forbidden = {
              'assets/www/src/features/apps/premium-speed-safe-v2.js',
              'assets/www/src/features/apps/premium-nova-internet-speed.js',
          }
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = sorted(required - names)
              bad = sorted(forbidden & names)
              if missing:
                  raise SystemExit(f'Missing bundled files: {missing}')
              if bad:
                  raise SystemExit(f'Forbidden files bundled: {bad}')
              nova = z.read('assets/www/src/features/apps/nova-sol57-fresh.js').decode('utf-8')
              screen = z.read('assets/www/src/features/apps/app-screen.js').decode('utf-8')
              registry = z.read('assets/www/src/features/hub/app-registry.js').decode('utf-8')
              if 'NOVA 5.7 Sol' not in nova or 'novaSol57Renderers[id] ||' not in screen:
                  raise SystemExit('NOVA 5.7 mount verification failed')
              if 'nova-internet-speed' in registry:
                  raise SystemExit('Internet Speed registry entry returned')
          print('NOVA 5.7 APK bundle checks: PASS')
          PY

      - name: Prepare verified update
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-v1010-sol57
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.10-vc11-NOVA-5.7-Sol-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.10-vc11-NOVA-5.7-Sol-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/nova57-v1010-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/nova57-v1010-signature.txt" "$OUT/signature.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.10 vc11
          NOVA AI: 5.7 Sol fresh Android renderer
          Base stable commit: $STABLE_BASE
          Source commit: $GITHUB_SHA
          Full-app remote OTA override: DISABLED
          Mining/reward source delta: NONE
          Internet Speed feature: REMOVED
          Permanent signature verification: PASS
          RESULT: SIGNED UPDATE APK READY
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"

      - name: Publish verified APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v1010-publish
          git worktree add /tmp/nx-v1010-publish origin/apk-builds
          cd /tmp/nx-v1010-publish
          rm -rf nova-v1.0.10-sol57
          mkdir -p nova-v1.0.10-sol57
          cp -a /tmp/nexusnova-v1010-sol57/. nova-v1.0.10-sol57/
          git add -A nova-v1.0.10-sol57
          git commit -m "Publish NexusNova v1.0.10 NOVA 5.7 Sol $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.10-vc11-NOVA-5.7-Sol-SIGNED
          path: /tmp/nexusnova-v1010-sol57/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
