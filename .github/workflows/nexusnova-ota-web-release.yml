name: NexusNova OTA Web Release

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'fresh-rebuild/**'
      - '.github/workflows/nexusnova-ota-web-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified OTA package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexusnova-ota-package
          mkdir -p /tmp/nexusnova-ota-package/files
          cp -a fresh-rebuild/. /tmp/nexusnova-ota-package/files/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('/tmp/nexusnova-ota-package/files')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              files.append({
                  'path': rel,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })
          if not files:
              raise SystemExit('OTA package is empty')
          manifest = {
              'schema': 1,
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
          Path('/tmp/nexusnova-ota-package/manifest.json').write_text(
              json.dumps(manifest, separators=(',', ':'), sort_keys=True),
              encoding='utf-8'
          )
          print(f"OTA files: {len(files)}")
          print(f"OTA bytes: {sum(item['size'] for item in files)}")
          PY
          test -s /tmp/nexusnova-ota-package/manifest.json
          test -s /tmp/nexusnova-ota-package/files/index.html
          test -s /tmp/nexusnova-ota-package/files/src/main.js

      - name: Publish OTA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin nexusnova-ota-release
          rm -rf /tmp/nexusnova-ota-branch
          git worktree add /tmp/nexusnova-ota-branch origin/nexusnova-ota-release
          cd /tmp/nexusnova-ota-branch
          git rm -rf .
          cp -a /tmp/nexusnova-ota-package/. .
          git add -A
          git commit -m "Publish NexusNova web OTA $GITHUB_SHA"
          git pull --rebase origin nexusnova-ota-release
          git push origin HEAD:nexusnova-ota-release
