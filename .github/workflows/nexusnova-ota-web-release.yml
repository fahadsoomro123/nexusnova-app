name: NexusNova OTA Web Release

# Atomic OTA v2 package builder. The one-time native bootstrap now reads the
# public OTA channel hosted from the public NexusNova website repository.
on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823, nova-sol57-pro-v128]
    paths:
      - 'fresh-rebuild/**'
      - '.github/workflows/nexusnova-ota-web-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Exact web source bundled by the public-OTA-capable native bootstrap.
  OTA_BUNDLED_BASE: b6eb3d191ee35b58c0ffe14334674ea2c60d3b72

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'nexusnova-latest-full-apk-recovery-20260823' || contains(github.event.head_commit.message, '[ota-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            checked=$((checked + 1))
          done < <(find fresh-rebuild -type f -name '*.js' -print0)
          if [ "$checked" -lt 1 ]; then
            echo 'No JavaScript files found to verify.' >&2
            exit 1
          fi
          echo "JavaScript syntax verified: $checked files"

      - name: Verify registered app renderer coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const registryPath = 'fresh-rebuild/src/features/hub/app-registry.js';
          const appsDir = 'fresh-rebuild/src/features/apps';
          const registry = fs.readFileSync(registryPath, 'utf8');
          const ids = [...registry.matchAll(/\bid\s*:\s*(['"])([^'"]+)\1/g)].map(match => match[2]);
          if (!ids.length) throw new Error('No registered NexusNova app IDs were found.');

          const rendered = new Set();
          for (const name of fs.readdirSync(appsDir)) {
            if (!name.endsWith('.js')) continue;
            const text = fs.readFileSync(path.join(appsDir, name), 'utf8');
            const maps = text.matchAll(/export\s+const\s+\w*Renderers\s*=\s*Object\.freeze\(\{([\s\S]*?)\}\);/g);
            for (const map of maps) {
              const body = map[1];
              for (const match of body.matchAll(/(?:^|,)\s*(?:(['"])([^'"]+)\1|([A-Za-z_$][\w$-]*))\s*:/g)) {
                rendered.add(match[2] || match[3]);
              }
            }
          }

          const missing = [...new Set(ids)].filter(id => !rendered.has(id));
          if (missing.length) {
            console.error(`Registered apps without a concrete renderer: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Renderer coverage verified: ${new Set(ids).size} registered apps.`);
          NODE

      - name: Build verified cumulative differential OTA package
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OTA_BUNDLED_BASE"
          git cat-file -e "$BASE^{commit}"

          deleted="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- fresh-rebuild/ \
            | grep -vFx 'fresh-rebuild/src/features/apps/premium-nova-internet-speed.js' || true)"
          if [ -n "$deleted" ]; then
            echo 'Atomic differential OTA cannot safely represent deleted bundled web files:' >&2
            printf '%s\n' "$deleted" >&2
            exit 1
          fi

          rm -rf /tmp/nexusnova-ota-package
          mkdir -p /tmp/nexusnova-ota-package/files

          count=0
          while IFS= read -r full; do
            [ -n "$full" ] || continue
            rel="${full#fresh-rebuild/}"
            test -f "$full"
            mkdir -p "/tmp/nexusnova-ota-package/files/$(dirname "$rel")"
            cp "$full" "/tmp/nexusnova-ota-package/files/$rel"
            count=$((count + 1))
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE" "$GITHUB_SHA" -- fresh-rebuild/)

          if [ ! -f /tmp/nexusnova-ota-package/files/index.html ]; then
            cp fresh-rebuild/index.html /tmp/nexusnova-ota-package/files/index.html
            count=$((count + 1))
          fi

          if [ "$count" -lt 1 ]; then
            echo 'No web files available for OTA.' >&2
            exit 1
          fi

          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('/tmp/nexusnova-ota-package/files')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              data = path.read_bytes()
              files.append({
                  'path': rel,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })
          if not files:
              raise SystemExit('OTA package is empty')
          if not any(item['path'] == 'index.html' for item in files):
              raise SystemExit('OTA package entry point missing')
          manifest = {
              'schema': 2,
              'base': os.environ['OTA_DIFF_BASE'],
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
          Path('/tmp/nexusnova-ota-package/manifest.json').write_text(
              json.dumps(manifest, separators=(',', ':'), sort_keys=True),
              encoding='utf-8'
          )
          print(f"Differential OTA files: {len(files)}")
          print(f"Differential OTA bytes: {sum(item['size'] for item in files)}")
          PY

          test -s /tmp/nexusnova-ota-package/manifest.json
          test -s /tmp/nexusnova-ota-package/files/index.html

      - name: Publish private staging OTA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin nexusnova-ota-release
          rm -rf /tmp/nexusnova-ota-branch
          git worktree add /tmp/nexusnova-ota-branch origin/nexusnova-ota-release
          cd /tmp/nexusnova-ota-branch
          git rm -rf .
          cp -a /tmp/nexusnova-ota-package/. .
          git add -A
          git commit -m "Publish NexusNova differential web OTA $GITHUB_SHA"
          git pull --rebase origin nexusnova-ota-release
          git push origin HEAD:nexusnova-ota-release
