name: NexusNova Permanent Signed Build V3

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/signed-build-v3.txt'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks
  VERSION_CODE: '2'
  VERSION_NAME: '1.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and stage current app
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nexusnova-latest-full-apk-recovery-20260823"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/features/apps/entertainment-resilient.js
          test -s fresh-rebuild/src/features/apps/news-resilient.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          WEB=NexusNovaAndroid/app/src/main/assets/www
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp -a fresh-rebuild/. "$WEB/"
          printf 'source_commit=%s\nsource_tree=fresh-rebuild\n' "$GITHUB_SHA" > "$WEB/NEXUSNOVA_SOURCE.txt"

      - name: Wire OTA into launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          def ensure(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'OTA anchor missing: {label}')
              s = s.replace(old, new, 1)
          ensure(
              '    private var rendererCrashRecoveries = 0\n',
              '    private var rendererCrashRecoveries = 0\n    private val otaWebManager by lazy { NexusOtaWebManager(this) }\n    private var otaCheckStarted = false\n',
              'fields')
          ensure(
              '                return assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)\n',
              '                return otaWebManager.intercept(uri)\n                    ?: assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)\n',
              'intercept')
          old_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isProductionOrigin(uri) || usingOfflineFallback) return\n                finishedWatchdogToken = mainFrameWatchdogToken\n                scheduleBlankScreenCheck(target, mainFrameWatchdogToken)\n            }\n'''
          new_finished = '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                val target = view ?: return\n                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return\n                if (!isLocalOrigin(uri) || otaCheckStarted) return\n                otaCheckStarted = true\n                otaWebManager.checkForUpdate { updated ->\n                    if (!updated) return@checkForUpdate\n                    runOnUiThread {\n                        if (!isFinishing && !isDestroyed && target === webView) target.reload()\n                    }\n                }\n            }\n'''
          ensure(old_finished, new_finished, 'page finished')
          ensure(
              '                runCatching { target.destroy() }\n\n                if (isFinishing || isDestroyed) return true\n',
              '                runCatching { target.destroy() }\n\n                if (didCrash && otaWebManager.rollbackToBundled()) {\n                    window.decorView.postDelayed({\n                        if (!isFinishing && !isDestroyed) rebuildWebViewAfterRendererExit()\n                    }, RENDERER_CRASH_RECOVERY_DELAY_MS)\n                    return true\n                }\n\n                if (isFinishing || isDestroyed) return true\n',
              'rollback')
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'otaWebManager.checkForUpdate' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and verify permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          test -s "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Inject release version and permanent signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 2', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.1"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Android version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              anchor = '    buildTypes {\n'
              if anchor not in s:
                  raise SystemExit('buildTypes anchor missing')
              s = s.replace(anchor, block + anchor, 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              anchor = '        release {\n'
              if anchor not in s:
                  raise SystemExit('release buildType anchor missing')
              s = s.replace(anchor, anchor + line, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'create("nexusRelease")' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'signingConfig = signingConfigs.getByName("nexusRelease")' NexusNovaAndroid/app/build.gradle.kts

      - name: Build release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/permanent-signed-release.log"

      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/permanent-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/permanent-signature.txt"

      - name: Publish signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          OUT=/tmp/nx-signed-v3
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$APK" "$OUT/NexusNova-PERMANENT-SIGNED-v1.0.1-vc2.apk"
          sha256sum "$OUT/NexusNova-PERMANENT-SIGNED-v1.0.1-vc2.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/permanent-signature.txt" "$OUT/signature.txt"
          cp "$GITHUB_WORKSPACE/permanent-signed-release.log" "$OUT/build.log"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova PERMANENT SIGNED RELEASE
          Source commit: $GITHUB_SHA
          Version name: 1.0.1
          Version code: 2
          Latest fresh-rebuild staged: PASS
          Entertainment resilient renderer bundled: PASS
          News resilient renderer bundled: PASS
          OTA updater wired: PASS
          Permanent signature verification: PASS
          RESULT: PERMANENT-SIGNED APK READY
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-apk-publish
          git worktree add /tmp/nx-apk-publish origin/apk-builds
          cd /tmp/nx-apk-publish
          rm -rf permanent-signed-release
          mkdir -p permanent-signed-release
          cp -a "$OUT"/. permanent-signed-release/
          git add -A permanent-signed-release
          git commit -m "Publish permanent signed NexusNova v1.0.1 vc2 $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT=/tmp/nx-signed-failure
          rm -rf "$OUT" && mkdir -p "$OUT"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "RESULT: FAIL"
            test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/entertainment-resilient.js && echo 'STAGED_ENTERTAINMENT=YES' || echo 'STAGED_ENTERTAINMENT=NO'
            test -s NexusNovaAndroid/app/src/main/assets/www/src/features/apps/news-resilient.js && echo 'STAGED_NEWS=YES' || echo 'STAGED_NEWS=NO'
            test -s "$NEXUSNOVA_SIGNING_STORE_FILE" && echo 'KEYSTORE_RESTORED=YES' || echo 'KEYSTORE_RESTORED=NO'
            test -s NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk && echo 'APK_CREATED=YES' || echo 'APK_CREATED=NO'
          } > "$OUT/FAILURE.txt"
          test -f "$GITHUB_WORKSPACE/permanent-signed-release.log" && cp "$GITHUB_WORKSPACE/permanent-signed-release.log" "$OUT/build.log"
          test -f "$GITHUB_WORKSPACE/permanent-signature.txt" && cp "$GITHUB_WORKSPACE/permanent-signature.txt" "$OUT/signature.txt"
          git config user.name 'NexusNova Signed Failure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          rm -rf /tmp/nx-apk-failure
          git worktree add /tmp/nx-apk-failure origin/apk-builds || exit 0
          cd /tmp/nx-apk-failure
          rm -rf permanent-signed-release-failure
          mkdir -p permanent-signed-release-failure
          cp -a "$OUT"/. permanent-signed-release-failure/
          git add -A permanent-signed-release-failure
          git commit -m "Publish permanent signed failure $GITHUB_SHA" || exit 0
          git pull --rebase origin apk-builds || true
          git push origin HEAD:apk-builds || true

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
