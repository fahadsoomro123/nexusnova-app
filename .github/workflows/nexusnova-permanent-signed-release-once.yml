name: NexusNova Permanent Signed Release Once

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/permanent-signed-v1.0.1-vc2.txt'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  VERSION_CODE: '5'
  VERSION_NAME: '1.0.4'

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build, verify and publish permanent signed APK
        id: signed_build
        continue-on-error: true
        shell: bash
        run: bash tools/build-permanent-signed-v4.sh

      - name: Recover verified APK if legacy publish path failed
        if: steps.signed_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          SIG="$GITHUB_WORKSPACE/permanent-signature.txt"
          LOG="$GITHUB_WORKSPACE/permanent-signed-release.log"
          test -s "$APK"
          test -s "$SIG"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$SIG"
          OUT="$RUNNER_TEMP/nexusnova-permanent-signed-recovered"
          rm -rf "$OUT" && mkdir -p "$OUT"
          NAME="NexusNova-PERMANENT-SIGNED-v${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$APK" "$OUT/$NAME"
          (cd "$OUT" && sha256sum "$NAME" > SHA256.txt)
          cp "$SIG" "$OUT/signature.txt"
          test -s "$LOG" && cp "$LOG" "$OUT/build.log"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova PERMANENT SIGNED RELEASE
          Source commit: $GITHUB_SHA
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Launcher NexusNova branding: PASS
          Latest web staged into APK: PASS
          Permanent signature verification: PASS
          RESULT: PERMANENT-SIGNED APK READY
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-apk-recovered"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf permanent-signed-release permanent-signed-release-failure
          mkdir -p permanent-signed-release
          cp -a "$OUT"/. permanent-signed-release/
          git add -A
          git commit -m "Publish recovered permanent signed NexusNova ${VERSION_NAME} (${VERSION_CODE}) $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Verify published result exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin apk-builds
          git show "origin/apk-builds:permanent-signed-release/BUILD-STATUS.txt" | grep -Fq 'RESULT: PERMANENT-SIGNED APK READY'
