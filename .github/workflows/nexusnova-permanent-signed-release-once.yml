name: NexusNova Permanent Signed Release Once

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/permanent-signed-v1.0.1-vc2.txt'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  VERSION_CODE: '2'
  VERSION_NAME: '1.0.1'

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build, verify and publish permanent signed APK
        shell: bash
        run: bash tools/build-permanent-signed-v4.sh

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/nexusnova-permanent-signed-failure"
          rm -rf "$OUT" && mkdir -p "$OUT"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "RESULT: FAIL"
            test -s fresh-rebuild/index.html && echo 'CANONICAL_WEB=YES' || echo 'CANONICAL_WEB=NO'
            test -s tools/build-permanent-signed-v4.sh && echo 'BUILD_SCRIPT=YES' || echo 'BUILD_SCRIPT=NO'
            test -s NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk && echo 'APK_CREATED=YES' || echo 'APK_CREATED=NO'
          } > "$OUT/FAILURE.txt"
          test -s "$GITHUB_WORKSPACE/permanent-signed-release.log" && cp "$GITHUB_WORKSPACE/permanent-signed-release.log" "$OUT/build.log"
          test -s "$GITHUB_WORKSPACE/permanent-signature.txt" && cp "$GITHUB_WORKSPACE/permanent-signature.txt" "$OUT/signature.txt"
          git config user.name 'NexusNova Signed Failure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          PUB="$RUNNER_TEMP/nexusnova-apk-failure"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds || exit 0
          cd "$PUB"
          rm -rf permanent-signed-release permanent-signed-release-failure
          mkdir -p permanent-signed-release-failure
          cp -a "$OUT"/. permanent-signed-release-failure/
          git add -A permanent-signed-release permanent-signed-release-failure
          git commit -m "Publish permanent signed failure $GITHUB_SHA" || exit 0
          git pull --rebase origin apk-builds || true
          git push origin HEAD:apk-builds || true
