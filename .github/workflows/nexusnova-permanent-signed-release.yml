name: NexusNova Permanent Signed Release APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode
        required: true
        type: string
      version_name:
        description: Android versionName
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate manual release request
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            nova-sol57-pro-v128|nexusnova-latest-full-apk-recovery-20260823) ;;
            *)
              echo "Signed release is not allowed from branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$VERSION_CODE" -ge 2 ]
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z._+-]{1,40}$ ]]
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s NexusNovaAndroid/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list \
            -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" \
            -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" \
            -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject requested version and release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version_code = os.environ['VERSION_CODE'].strip()
          version_name = os.environ['VERSION_NAME'].strip()
          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')

          source, code_count = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {int(version_code)}', source, count=1)
          source, name_count = re.subn(r'versionName\s*=\s*"[^"]*"', f'versionName = "{version_name}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not patch Android version fields safely')

          signing_block = '''    signingConfigs {
              create("nexusRelease") {
                  storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
                  storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
                  keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
                  keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
              }
          }

          '''
          if 'create("nexusRelease")' not in source:
              anchor = '    buildTypes {\n'
              if anchor not in source:
                  raise SystemExit('Android buildTypes anchor not found')
              source = source.replace(anchor, signing_block + anchor, 1)

          signing_line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if signing_line not in source:
              anchor = '        release {\n'
              if anchor not in source:
                  raise SystemExit('Android release buildType anchor not found')
              source = source.replace(anchor, anchor + signing_line, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature and prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/nexusnova-signature.txt"
          grep -Eq 'Verified using v[23] scheme .*: true' "$RUNNER_TEMP/nexusnova-signature.txt"
          RELEASE_APK="$RUNNER_TEMP/NexusNova-v${VERSION_NAME}-vc${VERSION_CODE}-SIGNED.apk"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | tee "$RUNNER_TEMP/SHA256.txt"

      - name: Publish APK as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nexusnova-v${VERSION_NAME}-vc${VERSION_CODE}"
          APK="$RUNNER_TEMP/NexusNova-v${VERSION_NAME}-vc${VERSION_CODE}-SIGNED.apk"
          NOTES="$RUNNER_TEMP/release-notes.txt"
          cat > "$NOTES" <<EOF
          NexusNova permanent signed release
          Source commit: $GITHUB_SHA
          Version: $VERSION_NAME
          Version code: $VERSION_CODE
          Signature verification: PASS
          APK is stored as a GitHub Release asset, not committed into Git history.
          EOF
          sed -i 's/^          //' "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$RUNNER_TEMP/SHA256.txt" "$RUNNER_TEMP/nexusnova-signature.txt" --clobber
          else
            gh release create "$TAG" "$APK" "$RUNNER_TEMP/SHA256.txt" "$RUNNER_TEMP/nexusnova-signature.txt" \
              --target "$GITHUB_SHA" \
              --title "NexusNova $VERSION_NAME (vc$VERSION_CODE)" \
              --notes-file "$NOTES"
          fi

      - name: Secure cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
