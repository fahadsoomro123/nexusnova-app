name: NexusNova Permanent-Signed TEST APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-permanent-signed-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-permanent-signed-test-apk
  cancel-in-progress: true

jobs:
  permanent-signed-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate signing secrets are present
        shell: bash
        env:
          NEXUSNOVA_KEYSTORE_BASE64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          NEXUSNOVA_KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          NEXUSNOVA_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${NEXUSNOVA_KEYSTORE_BASE64:-}" || { echo 'Missing NEXUSNOVA_KEYSTORE_BASE64'; exit 1; }
          test -n "${NEXUSNOVA_KEYSTORE_PASSWORD:-}" || { echo 'Missing NEXUSNOVA_KEYSTORE_PASSWORD'; exit 1; }
          test -n "${NEXUSNOVA_KEY_ALIAS:-}" || { echo 'Missing NEXUSNOVA_KEY_ALIAS'; exit 1; }
          test -n "${NEXUSNOVA_KEY_PASSWORD:-}" || { echo 'Missing NEXUSNOVA_KEY_PASSWORD'; exit 1; }
          echo 'Signing secrets are configured.'

      - name: Prepare current NexusNova Android TEST shell
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_legal_pages.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_essential_settings_v3.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_nova_vault_10x_ads.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py
          python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Force release variant into TEST-only mode and set build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')

          text, n_false = re.subn(
              r'buildConfigField\("boolean",\s*"NEXUS_ADS_TEST_MODE",\s*"false"\)',
              'buildConfigField("boolean", "NEXUS_ADS_TEST_MODE", "true")',
              text,
              count=1,
          )
          text, n_appid = re.subn(
              r'manifestPlaceholders\["admobAppId"\]\s*=\s*"ca-app-pub-5070673529890078~1824799663"',
              'manifestPlaceholders["admobAppId"] = "ca-app-pub-3940256099942544~3347511713"',
              text,
              count=1,
          )
          text, n_code = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 116', text, count=1)
          text, n_name = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "1.1.6-permanent-signed-test"',
              text,
              count=1,
          )

          if (n_false, n_appid, n_code, n_name) != (1, 1, 1, 1):
              raise SystemExit(
                  f'Could not create TEST-only signed release variant: '
                  f'testMode={n_false}, appId={n_appid}, versionCode={n_code}, versionName={n_name}'
              )

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'versionCode = 116' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.6-permanent-signed-test"' NexusNovaAndroid/app/build.gradle.kts
          test "$(grep -Fc 'buildConfigField("boolean", "NEXUS_ADS_TEST_MODE", "true")' NexusNovaAndroid/app/build.gradle.kts)" -ge 2
          if grep -Fq 'ca-app-pub-5070673529890078~1824799663' NexusNovaAndroid/app/build.gradle.kts; then
            echo 'Production AdMob App ID must not be present in permanent-signed TEST build.' >&2
            exit 1
          fi
          echo 'TEST-only release variant prepared.'

      - name: Assemble unsigned TEST release APK
        run: gradle -p NexusNovaAndroid :app:assembleRelease --stacktrace --no-daemon

      - name: Restore permanent NexusNova keystore
        shell: bash
        env:
          NEXUSNOVA_KEYSTORE_BASE64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          NEXUSNOVA_KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-release.jks"
          printf '%s' "$NEXUSNOVA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$NEXUSNOVA_KEYSTORE_PASSWORD" -alias "$NEXUSNOVA_KEY_ALIAS" >/dev/null
          echo 'Permanent keystore restored and alias verified.'

      - name: Sign TEST APK with permanent NexusNova identity
        shell: bash
        env:
          NEXUSNOVA_KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          NEXUSNOVA_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED='NexusNovaAndroid/app/build/outputs/apk/release/app-release-unsigned.apk'
          SIGNED='NexusNova-v1.1.6-Permanent-Signed-TEST.apk'
          test -s "$UNSIGNED"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nexusnova-release.jks" \
            --ks-key-alias "$NEXUSNOVA_KEY_ALIAS" \
            --ks-pass env:NEXUSNOVA_KEYSTORE_PASSWORD \
            --key-pass env:NEXUSNOVA_KEY_PASSWORD \
            --out "$SIGNED" \
            "$UNSIGNED"

          test -s "$SIGNED"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Verify permanent APK signature
        shell: bash
        env:
          NEXUSNOVA_KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SIGNED='NexusNova-v1.1.6-Permanent-Signed-TEST.apk'

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee NexusNova-signature-verification.txt
          "$APKSIGNER" verify "$SIGNED"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/nexusnova-release.jks" \
            -storepass "$NEXUSNOVA_KEYSTORE_PASSWORD" \
            -alias "$NEXUSNOVA_KEY_ALIAS" \
            | sed -n '/SHA256:/p' \
            | tee NexusNova-keystore-sha256.txt

          sha256sum "$SIGNED" | tee NexusNova-v1.1.6-Permanent-Signed-TEST.apk.sha256
          echo 'Permanent signature verification passed.'

      - name: Upload permanent-signed TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.1.6-Permanent-Signed-TEST
          path: |
            NexusNova-v1.1.6-Permanent-Signed-TEST.apk
            NexusNova-v1.1.6-Permanent-Signed-TEST.apk.sha256
            NexusNova-signature-verification.txt
            NexusNova-keystore-sha256.txt
          if-no-files-found: error
          retention-days: 14
