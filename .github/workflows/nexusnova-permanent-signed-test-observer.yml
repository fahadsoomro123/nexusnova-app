name: NexusNova Permanent-Signed TEST Observer

on:
  workflow_run:
    workflows:
      - NexusNova Permanent-Signed TEST APK
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish-observed-status:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish connector-visible workflow result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          case "$CONCLUSION" in
            success) STATE=success ;;
            failure|cancelled|timed_out|action_required|startup_failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          DESCRIPTION="Permanent-signed TEST run ${RUN_ID}: ${CONCLUSION}"
          jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context "NexusNova Permanent-Signed TEST APK/observed" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            > /tmp/status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d @/tmp/status.json
