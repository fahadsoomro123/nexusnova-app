name: NexusNova Permanent Signed v1.0.2 vc3 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-permanent-signed-v1.0.2-vc3-20260825.yml'

permissions:
  contents: write
  statuses: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  VERSION_CODE: '3'
  VERSION_NAME: '1.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg state pending --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "NexusNova 1.0.2 build ${GITHUB_RUN_ID} started" --arg context "NexusNova signed v1.0.2" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json

      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build verify and publish signed APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Building active source $SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" bash tools/run-permanent-signed-v4-safe.sh

      - name: Publish result status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_SHA: ${{ github.sha }}
        run: |
          set +e
          if [ "${{ job.status }}" = "success" ]; then STATE=success; TEXT="NexusNova 1.0.2 signed build succeeded"; else STATE=failure; TEXT="NexusNova 1.0.2 signed build failed"; fi
          jq -n --arg state "$STATE" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg description "$TEXT" --arg context "NexusNova signed v1.0.2" '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/status.json
          curl --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${LAUNCHER_SHA}" -d @/tmp/status.json >/dev/null
