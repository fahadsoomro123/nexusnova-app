name: NexusNova Phone Fix Candidate

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-phone-fix-candidate.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source and self-clean helper
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          rm .github/workflows/nexusnova-phone-fix-candidate.yml
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/nexusnova-phone-fix-candidate.yml
          git commit -m 'ci: cleanup phone stability candidate builder'
          git push origin HEAD:nexusnova-fresh-rebuild-20260820

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify fixed startup source
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/main.js
          ! grep -Fq "import { appScreen, cleanupAppScreen }" fresh-rebuild/src/main.js
          grep -Fq "import('./features/apps/app-screen.js')" fresh-rebuild/src/main.js
          grep -Fq 'override fun onRenderProcessGone(' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Prepare bundle
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py
          test -s NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt

      - name: Build APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phone-fix-output
          cp NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk phone-fix-output/NexusNova-Phone-Fix-TEST.apk
          sha256sum phone-fix-output/NexusNova-Phone-Fix-TEST.apk > phone-fix-output/SHA256.txt
          cp build-log.txt phone-fix-output/
          {
            echo 'NexusNova Phone Fix TEST APK'
            echo "Source trigger commit: $SOURCE_SHA"
            echo 'App fix base: e324ff2a51676c788e5c22daae0b2e94c314f34f'
            echo 'Heavy app suites at startup: DEFERRED'
            echo 'WebView renderer recovery: ENABLED'
            echo 'Gradle build: PASS'
            echo 'Physical phone verification: REQUIRED'
            echo 'RESULT: PHONE TEST READY'
          } > phone-fix-output/BUILD-STATUS.txt

      - name: Publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-phone-fix
          git worktree add /tmp/nx-phone-fix origin/apk-builds
          cd /tmp/nx-phone-fix
          rm -rf phone-fix-candidate
          mkdir -p phone-fix-candidate
          cp -a "$GITHUB_WORKSPACE/phone-fix-output/." phone-fix-candidate/
          git add -A phone-fix-candidate
          git commit -m "Publish phone fix candidate $SOURCE_SHA"
          git push origin HEAD:apk-builds

      - name: Publish build failure
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p phone-fix-failure
          echo "Source: $GITHUB_SHA" > phone-fix-failure/FAILURE.txt
          [ -f build-log.txt ] && cp build-log.txt phone-fix-failure/ || true
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds || exit 0
          rm -rf /tmp/nx-phone-fix-fail
          git worktree add /tmp/nx-phone-fix-fail origin/apk-builds || exit 0
          cd /tmp/nx-phone-fix-fail
          rm -rf phone-fix-candidate-failure
          mkdir -p phone-fix-candidate-failure
          cp -a "$GITHUB_WORKSPACE/phone-fix-failure/." phone-fix-candidate-failure/
          git add -A phone-fix-candidate-failure
          git commit -m "Publish phone fix candidate FAIL $GITHUB_SHA" || exit 0
          git push origin HEAD:apk-builds || true
