name: NexusNova Cleaned Prepare Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-prepare-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run prepare chain with exact failure marker
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mark(){ echo "$1" > /tmp/nx-last-patch; echo "RUN $1"; }
          mark prepare_native_web_shell; python3 NexusNovaAndroid/prepare_native_web_shell.py
          mark patch_legal_pages; python3 NexusNovaAndroid/patch_legal_pages.py
          mark patch_family_demo_web_v1; python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          mark patch_essential_settings_v3; python3 NexusNovaAndroid/patch_essential_settings_v3.py
          mark patch_family_auth_recursion_fix; python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          mark patch_startup_reveal_v2; python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          mark patch_native_startup_escape_v3; python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          mark patch_mining_boost_sync; python3 NexusNovaAndroid/patch_mining_boost_sync.py
          mark patch_viewport; python3 NexusNovaAndroid/patch_viewport.py
          mark patch_admob; python3 NexusNovaAndroid/patch_admob.py
          mark patch_nova_vault_10x_ads; python3 NexusNovaAndroid/patch_nova_vault_10x_ads.py
          mark patch_rewarded_test_contract; python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          mark patch_test_boost_reward_fx; python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          mark patch_test_boost_reward_fx_hardening; python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          mark patch_test_boost_cooldown_gate; python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          mark patch_ad_privacy; python3 NexusNovaAndroid/patch_ad_privacy.py
          mark patch_session_restore; python3 NexusNovaAndroid/patch_session_restore.py
          mark patch_web_shell_reset; python3 NexusNovaAndroid/patch_web_shell_reset.py
          mark patch_native_shell; python3 NexusNovaAndroid/patch_native_shell.py
          mark patch_native_splash_release_v4; python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          mark patch_native_no_bounce_v1; python3 NexusNovaAndroid/patch_native_no_bounce_v1.py
          mark patch_dashboard_startup_lockfix_v1; python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py
          echo all_prepare_passed > /tmp/nx-last-patch

      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LAST=$(cat /tmp/nx-last-patch 2>/dev/null || echo before-chain)
          git config user.name 'NexusNova Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-prep-diag
          git worktree add /tmp/nx-prep-diag origin/apk-builds
          cat > /tmp/nx-prep-diag/NexusNova-v1.1.6-Prepare-Diagnostic.txt <<EOF
          source_commit=${GITHUB_SHA}
          prepare_status=${{ steps.prep.outcome }}
          last_patch=${LAST}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-prep-diag/NexusNova-v1.1.6-Prepare-Diagnostic.txt
          cd /tmp/nx-prep-diag
          git add NexusNova-v1.1.6-Prepare-Diagnostic.txt
          git commit -m "Record cleaned prepare diagnostic ${GITHUB_SHA}" || true
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
