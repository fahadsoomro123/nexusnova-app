name: NexusNova Redo Source Check

on:
  push:
    branches: [all-bugs-redo-v2]
    paths:
      - 'fresh-rebuild/**'
      - 'firestore.rules'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt'
      - '.github/workflows/nexusnova-redo-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify bugfix source without building APK
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "all-bugs-redo-v2"

          # Internet Speed is fully removed from the stable bundled build.
          test ! -e fresh-rebuild/src/features/apps/premium-speed-safe-v2.js
          test ! -e fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          ! grep -Fq "nova-internet-speed" fresh-rebuild/src/features/hub/app-registry.js
          ! grep -Fq "speedSafeV2Renderers" fresh-rebuild/src/features/apps/app-screen.js
          ! grep -Fq "premiumNovaInternetSpeedRenderers" fresh-rebuild/src/features/apps/app-screen.js

          # Current bugfix modules must exist and be wired.
          test -s fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          test -s fresh-rebuild/src/features/apps/news-resilient.js
          test -s fresh-rebuild/src/features/apps/articles-suite.js
          test -s fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          test -s fresh-rebuild/src/core/drive-cloud-store.js
          grep -Fq "qiblaSafeV2Renderers" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "driveNativeV2Renderers" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "syncDriveCloudStore" fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          grep -Fq "match /users/{uid}/driveData/{docId}" firestore.rules

          # Qibla keeps the gimbal path but removes the large filtered face layer.
          grep -Fq "rotor.removeAttribute('filter')" fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          grep -Fq "pointer.style.willChange = 'auto'" fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js

          # Android News uses the trusted native bridge before WebView network fallback.
          grep -Fq "bridgeFeed(query)" fresh-rebuild/src/features/apps/news-resilient.js
          grep -Fq 'ACTION_FETCH_NEWS = "fetchNews"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt
          grep -Fq 'news.google.com/rss/search' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt

          # Stable APK must not allow stale remote web files to override signed assets.
          grep -Fq "fun intercept(uri: Uri): WebResourceResponse? = null" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq "onComplete(false)" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          # Parse every JS file touched by this bugfix batch.
          node --check fresh-rebuild/src/features/hub/app-registry.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          node --check fresh-rebuild/src/features/apps/news-resilient.js
          node --check fresh-rebuild/src/features/apps/articles-suite.js
          node --check fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          node --check fresh-rebuild/src/core/drive-cloud-store.js

          echo 'NexusNova redo source verification PASS — no APK built.'
