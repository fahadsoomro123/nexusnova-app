name: NexusNova Release Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - 'fresh-rebuild/**'
      - 'ota/**'
      - '.github/workflows/**'
      - 'docs/NEXUSNOVA-RELEASE-ARCHITECTURE-VNEXT.md'

permissions:
  contents: read

jobs:
  release-governance:
    name: Native + Web Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect frozen production paths
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"

          blocked="$(printf '%s\n' "$changed" | grep -E '^(cloudflare/safepay-webhook-worker\.js|cloudflare/telegram-bot/|cloudflare/.*(worker|config|route|workflow)|assets/js/fbr-atl-status-checker\.js|assets/logo\.png|sitemap[^/]*$|robots\.txt$)' || true)"
          if [ -n "$blocked" ]; then
            echo "FROZEN_PATHS_CHANGED"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "FROZEN_PATH_GUARD=PASS"

      - name: Validate native package and versionCode
        shell: bash
        run: |
          set -euo pipefail
          current_file='NexusNovaAndroid/app/build.gradle.kts'
          base_file="$(mktemp)"

          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^NexusNovaAndroid/'; then
            echo 'ANDROID_RELEASE_GUARD=SKIP (web-only change)'
            exit 0
          fi

          git show "origin/${{ github.base_ref }}:$current_file" > "$base_file"
          current_app_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)"/\1/p' "$current_file" | head -n1)"
          base_app_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)"/\1/p' "$base_file" | head -n1)"
          current_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' "$current_file" | head -n1)"
          base_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' "$base_file" | head -n1)"

          test "$current_app_id" = 'com.nexusnova.app'
          test "$current_app_id" = "$base_app_id"
          test -n "$current_code"
          test -n "$base_code"
          test "$current_code" -gt "$base_code"

          echo "APPLICATION_ID=$current_app_id"
          echo "BASE_VERSION_CODE=$base_code"
          echo "PR_VERSION_CODE=$current_code"
          echo "ANDROID_VERSION_GUARD=PASS"

      - name: Validate OTA is web-only
        shell: bash
        run: |
          set -euo pipefail
          test -f ota/manifest.json

          if find ota/files -type f -iname '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'OTA payload contains an APK. Native APK distribution belongs to Google Play.'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest = json.loads(Path('ota/manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('schema') == 2, 'unexpected OTA schema'
          assert re.fullmatch(r'[0-9a-f]{40}', str(manifest.get('version', ''))), 'invalid OTA version'
          assert re.fullmatch(r'[0-9a-f]{40}', str(manifest.get('base', ''))), 'invalid OTA base'
          entries = manifest.get('files', [])
          assert isinstance(entries, list) and entries, 'OTA file list missing'
          for item in entries:
              path = str(item.get('path', ''))
              assert not path.lower().endswith('.apk'), f'APK listed in OTA manifest: {path}'
              assert re.fullmatch(r'[0-9a-f]{64}', str(item.get('sha256', '')).lower())
              assert isinstance(item.get('size'), int) and item['size'] >= 0
          assert any(item.get('path') == 'index.html' for item in entries), 'OTA entry point missing'
          print('OTA_WEB_ONLY_GUARD=PASS')
          PY

      - name: Reject custom native APK updater paths
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
            NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusPlayUpdateManager.kt
            fresh-rebuild/src/core/nn-ota-updater.js
            fresh-rebuild/assets/js/nn-ota-updater.js
          )
          for file in "${sources[@]}"; do
            test -f "$file"
            if grep -nE 'PackageInstaller|ACTION_INSTALL_PACKAGE|REQUEST_INSTALL_PACKAGES|downloadOtaApk|apkUrl.*install|installUpdate' "$file"; then
              echo "CUSTOM_NATIVE_APK_UPDATER_DETECTED in $file"
              exit 1
            fi
          done
          if grep -nE 'REQUEST_INSTALL_PACKAGES|androidx\.core\.content\.FileProvider' NexusNovaAndroid/app/src/main/AndroidManifest.xml; then
            echo 'LEGACY_APK_INSTALL_MANIFEST_CAPABILITY_DETECTED'
            exit 1
          fi
          legacy_workflows="$(find .github/workflows -type f ! -name 'nexusnova-release-governance.yml' -print0 | xargs -0 grep -IlE 'PackageInstaller|ACTION_INSTALL_PACKAGE|REQUEST_INSTALL_PACKAGES|downloadOtaApk|apk-builds/.+\.apk|apk-builds/ota-bootstrap|installUpdate' 2>/dev/null || true)"
          if [ -n "$legacy_workflows" ]; then
            echo 'LEGACY_APK_UPDATER_WORKFLOW_DETECTED'
            printf '%s\n' "$legacy_workflows"
            exit 1
          fi
          echo 'CUSTOM_NATIVE_APK_UPDATER_GUARD=PASS'
      - name: Require Google Play update dependency
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'com.google.android.play:app-update:2.1.0' NexusNovaAndroid/app/build.gradle.kts
          echo 'GOOGLE_PLAY_IN_APP_UPDATE_DEPENDENCY=PASS'
      - name: Verify generated Android web payload is APK-updater free
        shell: bash
        run: |
          set -euo pipefail
          if [ -d NexusNovaAndroid/app/src/main/assets/www ] && grep -RInE 'PackageInstaller|ACTION_INSTALL_PACKAGE|REQUEST_INSTALL_PACKAGES|FileProvider|downloadOtaApk|apkUrl.*install|installUpdate' NexusNovaAndroid/app/src/main/assets/www --include='*.js' --include='*.kt' --include='*.java' --include='*.ts' 2>/dev/null; then
            echo 'GENERATED_WEB_PAYLOAD_CONTAINS_CUSTOM_APK_UPDATER'
            exit 1
          fi
          echo 'GENERATED_WEB_PAYLOAD_APK_UPDATER_GUARD=PASS'
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android release candidate
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
          test -s app/build/outputs/apk/release/app-release.apk
          echo 'ANDROID_RELEASE_COMPILE=PASS'
