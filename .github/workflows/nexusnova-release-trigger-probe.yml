name: NexusNova Release Trigger Probe

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/permanent-signed-v1.0.1-vc2.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish trigger proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Release Probe'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-probe
          git worktree add /tmp/nx-probe origin/apk-builds
          cd /tmp/nx-probe
          printf 'triggered_from=%s\n' "$GITHUB_SHA" > release-trigger-probe.txt
          git add release-trigger-probe.txt
          git commit -m "Record release trigger $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
