name: NexusNova Repository Secret Readiness

on:
  push:
    branches:
      - nexusnova-latest-full-apk-recovery-20260823
  pull_request:
    branches:
      - nexusnova-latest-full-apk-recovery-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject tracked private signing and credential material
        run: python3 .github/scripts/repo-secret-readiness.py
