name: NexusNova Rewarded Backend Check

on:
  push:
    branches:
      - main
      - codex-final-audit
      - nexusnova-latest-full-apk-recovery-20260823
    paths:
      - 'functions/**'
      - '.github/scripts/rewarded-ads-backend-smoke.mjs'
      - '.github/workflows/nexusnova-rewarded-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewarded-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Functions syntax
        run: |
          node --check functions/rewardedAds.js
          node --check functions/admobRewardedSsv.js
          node --check functions/notifications.js
          node --check functions/index.js

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Load Functions modules
        run: |
          node -e "const m=require('./functions/rewardedAds.js'); if(typeof m.ayetRewardedVideoCallback!=='function') throw new Error('ayeT callback export missing'); console.log('ayeT rewarded callback module loaded')"
          node -e "const m=require('./functions/admobRewardedSsv.js'); if(typeof m.admobRewardedSsv!=='function') throw new Error('AdMob SSV export missing'); if(m.__admobSsvTest.REWARD_NVX!==2.5) throw new Error('AdMob reward invariant changed'); console.log('AdMob SSV module loaded')"
          node -e "const m=require('./functions/notifications.js'); if(typeof m.ayetRewardedVideoCallback!=='function') throw new Error('Rewarded callback bundle export missing'); console.log('Functions bundle loaded')"
          node -e "const m=require('./functions/index.js'); if(typeof m.admobRewardedSsv!=='function') throw new Error('AdMob SSV index export missing'); console.log('Functions index includes AdMob SSV')"

      - name: Verify rewarded-ad security invariants
        run: node .github/scripts/rewarded-ads-backend-smoke.mjs
