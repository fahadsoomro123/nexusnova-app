name: NexusNova Extra Runtime Check

on:
  push:
    branches:
      - main
      - codex-final-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extra-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local NexusNova origin
        shell: bash
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>runtime</title>' > .runtime-origin.html
          python3 -m http.server 4173 > /tmp/nexusnova-extra-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.runtime-origin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-extra-http.log || true
          exit 1

      - name: Run Browser Caller Qibla Smart QR and Wallet checks
        run: node .github/scripts/nexusnova-runtime-extra.mjs

      - name: Run NexusNova Browser in-app routing check
        run: node .github/scripts/nexusnova-browser-runtime.mjs

      - name: Run market integrity browser check
        run: node .github/scripts/nexusnova-market-runtime.mjs

      - name: Run rewarded ads security browser check
        run: node .github/scripts/nexusnova-rewarded-ads-runtime.mjs

      - name: Run Watch Ad Android touch-freeze regression
        run: node .github/scripts/nexusnova-watch-ad-touch-runtime.mjs

      - name: Run Community League browser check
        run: node .github/scripts/nexusnova-community-runtime.mjs

      - name: Run auth Enter and Complete Profile browser check
        run: node .github/scripts/nexusnova-auth-profile-runtime.mjs

      - name: Run Growth Center referral and mission browser check
        run: node .github/scripts/nexusnova-growth-runtime.mjs

      - name: Run onboarding and private insights browser check
        run: node .github/scripts/nexusnova-onboarding-runtime.mjs

      - name: Run analytics consent privacy and retention browser check
        run: node .github/scripts/nexusnova-analytics-runtime.mjs

      - name: Run automatic health monitor privacy and recovery browser check
        run: node .github/scripts/nexusnova-health-runtime.mjs

      - name: Run Travel and Learning real-action browser check
        run: node .github/scripts/nexusnova-travel-learning-runtime.mjs

      - name: Run Smart Camera and Daily Brief browser check
        run: node .github/scripts/nexusnova-smart-runtime.mjs

      - name: Run Documents Vault and Security browser check
        run: node .github/scripts/nexusnova-documents-vault-security-runtime.mjs

      - name: Run local tools browser checks
        run: node .github/scripts/nexusnova-local-tools-runtime.mjs
