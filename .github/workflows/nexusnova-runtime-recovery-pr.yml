name: NexusNova Final Android Runtime Gate

on:
  pull_request:
    branches:
      - nexusnova-fresh-rebuild-20260820
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android11-final-gate:
    name: Android 11 Main + Nova VPN runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify canonical source only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e NexusNovaAndroid/patch_admob.py
          python -m py_compile NexusNovaAndroid/prepare_fresh_rebuild.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find fresh-rebuild/src -type f -name '*.js' -print0 | sort -z)

          MAIN=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ADS=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          VPN=NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnManager.kt

          grep -Fq 'private var adManager: NexusAdManager? = null' "$MAIN"
          grep -Fq 'private fun initializeAdsSafely()' "$MAIN"
          grep -Fq 'adManager?.showRewarded(' "$MAIN"
          grep -Fq 'adManager?.showInterstitial(' "$MAIN"
          grep -Fq 'fun showRewarded(rewardPurpose: String? = null, testOnly: Boolean = false, userId: String? = null)' "$ADS"
          grep -Fq 'fun showInterstitial(placement: String? = null, feature: String? = null, testOnly: Boolean = false)' "$ADS"
          grep -Fq 'val TEST_MODE = BuildConfig.NEXUS_ADS_TEST_MODE' "$ADS"
          grep -Fq 'ServerSideVerificationOptions' "$ADS"
          grep -Fq '"ssvIdentityReady" to true' "$ADS"
          grep -Fq 'const val REWARD_PURPOSE_WATCH_AD = "task-watch-ad"' "$ADS"
          grep -Fq 'private val backend by lazy(LazyThreadSafetyMode.SYNCHRONIZED)' "$VPN"
          grep -Fq 'private fun safeError(prefix: String, error: Throwable)' "$VPN"
          ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id|ROLE_CALL_SCREENING' \
            NexusNovaAndroid/app/src/main/java \
            NexusNovaAndroid/app/src/main/AndroidManifest.xml \
            NexusNovaAndroid/app/src/main/res \
            fresh-rebuild/src fresh-rebuild/index.html

      - name: Prepare fresh TEST bundle
        shell: bash
        run: |
          set -euo pipefail
          python NexusNovaAndroid/prepare_fresh_rebuild.py
          test -f NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
          grep -Fq 'NexusNova Fresh Rebuild TEST' NexusNovaAndroid/app/src/main/assets/www/FRESH-REBUILD-BUILD.txt
          ! grep -REiq 'CallerSetupActivity|CallScreeningService|requestCallerRole|PhonebookStore|caller-id|ROLE_CALL_SCREENING' \
            NexusNovaAndroid/app/src/main/assets/www

      - name: Build exact candidate APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Create runtime script
        shell: bash
        run: |
          cat > final-runtime-smoke.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          adb install -r "$APK"

          adb logcat -c
          adb shell am force-stop com.nexusnova.app || true
          adb shell am start -W -n com.nexusnova.app/.MainActivity | tee "$GITHUB_WORKSPACE/main-launch.txt"
          sleep 12
          MAIN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$MAIN_PID"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/main-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/main-logcat.txt"; then
            echo 'MainActivity runtime failure detected.' >&2
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/main-screen.png"

          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token | tee "$GITHUB_WORKSPACE/vpn-launch.txt"
          sleep 12
          VPN_PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
          test -n "$VPN_PID"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/vpn-logcat.txt"
          if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/vpn-logcat.txt"; then
            echo 'NovaVpnActivity runtime failure detected.' >&2
            exit 1
          fi
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/vpn-screen.png"

          {
            echo "RUNTIME_MAIN_PASS pid=$MAIN_PID"
            echo "RUNTIME_VPN_PASS pid=$VPN_PID"
          } | tee "$GITHUB_WORKSPACE/RUNTIME-SMOKE.txt"
          BASH
          chmod +x final-runtime-smoke.sh

      - name: Android 11 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/final-runtime-smoke.sh"

      - name: Hash exact runtime-tested APK
        shell: bash
        run: |
          sha256sum NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk | tee APK-SHA256.txt

      - name: Upload final runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-final-android11-runtime
          path: |
            NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
            RUNTIME-SMOKE.txt
            main-launch.txt
            main-logcat.txt
            main-screen.png
            vpn-launch.txt
            vpn-logcat.txt
            vpn-screen.png
          if-no-files-found: error
          retention-days: 7
