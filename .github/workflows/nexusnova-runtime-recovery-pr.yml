name: NexusNova Runtime Recovery Gate

on:
  pull_request:
    branches:
      - nexusnova-fresh-rebuild-20260820
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android11-runtime-gate:
    name: Android 11 launcher runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout recovery candidate
        uses: actions/checkout@v4

      - name: Download exact Run 4 build candidate
        uses: actions/download-artifact@v4
        with:
          name: nexusnova-runtime-recovery-android11
          path: recovered-run4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32592358773

      - name: Verify recovered candidate
        shell: bash
        run: |
          set -euo pipefail
          APK='recovered-run4/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          ADS='recovered-run4/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt'
          test -s "$APK"
          test -s "$ADS"
          grep -Fq 'fun showRewarded(rewardPurpose: String? = null, testOnly: Boolean = false, userId: String? = null)' "$ADS"
          grep -Fq 'fun showInterstitial(placement: String? = null, feature: String? = null, testOnly: Boolean = false)' "$ADS"
          grep -Fq '"ssvIdentityReady" to true' "$ADS"
          grep -Fq 'const val REWARD_PURPOSE_WATCH_AD = "task-watch-ad"' "$ADS"
          sha256sum "$APK" | tee RUN4-APK-SHA256.txt

      - name: Android 11 launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -eu
            APK="$GITHUB_WORKSPACE/recovered-run4/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.nexusnova.app || true
            adb shell am start -W -n com.nexusnova.app/.MainActivity | tee "$GITHUB_WORKSPACE/launcher-start.txt"
            sleep 12
            PID="$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)"
            test -n "$PID"
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/launcher-logcat.txt"
            if grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/launcher-logcat.txt"; then
              echo 'NexusNova runtime crash detected'
              grep -E -A 30 -B 10 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/launcher-logcat.txt" || true
              exit 1
            fi
            echo "RUNTIME_SMOKE_PASS pid=$PID" | tee "$GITHUB_WORKSPACE/RUNTIME-SMOKE.txt"

      - name: Hash runtime-tested APK
        if: success()
        shell: bash
        run: |
          sha256sum recovered-run4/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk | tee APK-SHA256.txt

      - name: Upload runtime-tested APK and canonical source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-runtime-tested-android11
          path: |
            recovered-run4/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            recovered-run4/NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
            APK-SHA256.txt
            RUN4-APK-SHA256.txt
            RUNTIME-SMOKE.txt
            launcher-start.txt
            launcher-logcat.txt
          if-no-files-found: warn
          retention-days: 7
