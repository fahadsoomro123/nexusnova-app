name: NexusNova Runtime Browser Check

on:
  push:
    branches:
      - main
      - codex-final-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare exact final Android web shell
        run: |
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py
          python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_deferred_caller_setup.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/verify_user_commands.py

      - name: Start local NexusNova origin
        shell: bash
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>runtime</title>' > .runtime-origin.html
          python3 -m http.server 4173 > /tmp/nexusnova-runtime-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/.runtime-origin.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-runtime-http.log || true
          exit 1

      - name: Core browser runtime
        run: node .github/scripts/nexusnova-runtime-smoke.mjs

      - name: ALL APPS regression
        run: node .github/scripts/nexusnova-allapps-regression-smoke.mjs

      - name: Premium feature regression
        run: node .github/scripts/nexusnova-premium-features-smoke.mjs

      - name: Synthetic touch lifeline regression
        run: node .github/scripts/nexusnova-touch-lifeline-runtime.mjs

      - name: Real Android full-page freeze regression
        run: node .github/scripts/nexusnova-android-fullpage-stability.mjs
