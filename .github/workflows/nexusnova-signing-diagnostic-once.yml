name: NexusNova Signing Diagnostic Once

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/permanent-signed-v1.0.1-vc2.txt'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check permanent signing material safely
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/nexusnova-signing-diagnostic"
          mkdir -p "$OUT"
          STATUS=PASS
          : > "$OUT/STATUS.txt"
          echo "Source commit: $GITHUB_SHA" >> "$OUT/STATUS.txt"
          for NAME in NEXUSNOVA_SIGNING_KEYSTORE_B64 NEXUSNOVA_SIGNING_STORE_PASSWORD NEXUSNOVA_SIGNING_KEY_ALIAS NEXUSNOVA_SIGNING_KEY_PASSWORD; do
            if [ -n "${!NAME}" ]; then
              echo "$NAME=PRESENT" >> "$OUT/STATUS.txt"
            else
              echo "$NAME=MISSING" >> "$OUT/STATUS.txt"
              STATUS=FAIL
            fi
          done
          if [ "$STATUS" = PASS ]; then
            KEYSTORE="$RUNNER_TEMP/nexusnova-diagnostic.jks"
            printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            if [ ! -s "$KEYSTORE" ]; then
              echo 'KEYSTORE_DECODE=FAIL' >> "$OUT/STATUS.txt"
              STATUS=FAIL
            else
              echo 'KEYSTORE_DECODE=PASS' >> "$OUT/STATUS.txt"
              keytool -list -keystore "$KEYSTORE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null 2>&1
              if [ $? -eq 0 ]; then
                echo 'KEYSTORE_ALIAS_VERIFY=PASS' >> "$OUT/STATUS.txt"
              else
                echo 'KEYSTORE_ALIAS_VERIFY=FAIL' >> "$OUT/STATUS.txt"
                STATUS=FAIL
              fi
            fi
            rm -f "$KEYSTORE"
          fi
          echo "RESULT=$STATUS" >> "$OUT/STATUS.txt"
          git config user.name 'NexusNova Signing Diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf "$RUNNER_TEMP/nx-signing-diagnostic-worktree"
          git worktree add "$RUNNER_TEMP/nx-signing-diagnostic-worktree" origin/apk-builds
          cd "$RUNNER_TEMP/nx-signing-diagnostic-worktree"
          rm -rf signing-diagnostic
          mkdir -p signing-diagnostic
          cp "$OUT/STATUS.txt" signing-diagnostic/STATUS.txt
          git add -A signing-diagnostic
          git commit -m "Record signing diagnostic $GITHUB_SHA" || true
          git pull --rebase origin apk-builds || true
          git push origin HEAD:apk-builds || true
          exit 0
