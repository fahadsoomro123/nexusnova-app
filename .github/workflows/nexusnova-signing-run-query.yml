name: NexusNova Signing Run Query

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-signing-run-query.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  query-signing-run:
    runs-on: ubuntu-latest
    steps:
      - name: Find target permanent-signed TEST run and publish status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 08486b4736a9f2884a9a05bb9f430ed23d791e7a
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/nexusnova-permanent-signed-test-apk.yml/runs?branch=main&event=push&per_page=20"
          RUN=''
          for _ in $(seq 1 90); do
            BODY="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API")"
            RUN="$(printf '%s' "$BODY" | jq -c --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha==$sha) | . ' | head -n 1)"
            if [ -n "$RUN" ]; then
              STATUS="$(printf '%s' "$RUN" | jq -r '.status')"
              if [ "$STATUS" = completed ]; then
                break
              fi
            fi
            sleep 10
          done

          if [ -z "$RUN" ]; then
            STATE=error
            DESCRIPTION="No signing run found for ${TARGET_SHA:0:12}"
            TARGET_URL="https://github.com/${GITHUB_REPOSITORY}/actions"
          else
            RUN_ID="$(printf '%s' "$RUN" | jq -r '.id')"
            CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // "unknown"')"
            TARGET_URL="$(printf '%s' "$RUN" | jq -r '.html_url')"
            case "$CONCLUSION" in
              success) STATE=success ;;
              failure|cancelled|timed_out|action_required|startup_failure) STATE=failure ;;
              *) STATE=error ;;
            esac
            DESCRIPTION="Signing run ${RUN_ID}: ${CONCLUSION}"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg target_url "$TARGET_URL" \
            --arg description "$DESCRIPTION" \
            --arg context "NexusNova signing run query" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            > /tmp/status.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d @/tmp/status.json
