name: NexusNova Smoke Check

on:
  push:
    branches:
      - main
      - codex-final-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
          find functions -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "Checking sw.js"
          node --check sw.js

      - name: Verify single-owner mining architecture
        run: node .github/scripts/mining-architecture-smoke.mjs

      - name: Verify smart search rewards profile and growth guards
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const search = fs.readFileSync('js/nexusnova-allapps-smart-search-v1.js','utf8');
          const rewards = fs.readFileSync('js/nexusnova-rewards-spark-v1.js','utf8');
          const growth = fs.readFileSync('js/nexusnova-growth-center-v1.js','utf8');
          const referral = fs.readFileSync('js/nexusnova-referral-capture-v1.js','utf8');
          const integrity = fs.readFileSync('js/final-integrity-fix.js','utf8');
          const landing = fs.readFileSync('referral.html','utf8');

          if (!search.includes("local-first-v2")) throw new Error('Smart search v2 marker missing.');
          for (const token of ['quran','bukhari','surah','para','juz','tarjuma','hadith']) {
            if (!search.toLowerCase().includes(token)) throw new Error(`Islamic Hub search alias missing: ${token}`);
          }
          if (!search.includes('tabCorpus')) throw new Error('Smart search must index target-tab content.');
          if (search.includes('No strong tool match. NexusNova AI is the fallback for this request.')) {
            throw new Error('Old automatic AI-fallback search behavior returned.');
          }
          if (!search.includes('AI is optional')) throw new Error('Local-first no-match behavior missing.');

          if (!rewards.includes('spark-secure-v1.2')) throw new Error('Spark rewards v1.2 marker missing.');
          if (!rewards.includes('runTransaction')) throw new Error('Daily reward must use Firestore transaction.');
          if (!rewards.includes('nextBalance = balance + DAILY')) throw new Error('Exact daily +5 implementation missing.');
          if (!rewards.includes('nxSparkDailyBound')) throw new Error('Direct Daily Reward click guard missing.');
          if (/httpsCallable|getFunctions\(/.test(rewards)) throw new Error('Spark rewards must not depend on Cloud Functions.');

          if (!growth.includes("window.nexusGrowthCenterVersion = 'growth-v1'")) throw new Error('Growth Center version marker missing.');
          for (const text of ['Referral Center','Mission Center','Reward Activity','Referral mining multipliers and referral NVX rewards are intentionally OFF']) {
            if (!growth.includes(text)) throw new Error(`Growth Center safety/UI marker missing: ${text}`);
          }
          if (!growth.includes("fs.collection(db,'referrals')")) throw new Error('Growth Center referral metrics query missing.');
          if (!referral.includes("status:'pending'")) throw new Error('Referral capture must begin as pending.');
          if (!referral.includes("referrerUid === user.uid")) throw new Error('Client self-referral guard missing.');
          if (!landing.includes('nexusnova_pending_referral_v1')) throw new Error('Referral landing capture key missing.');

          for (const target of [
            './js/nexusnova-rewards-spark-v1.js?v=2',
            './js/nexusnova-allapps-smart-search-v1.js?v=4',
            './js/nexusnova-complete-profile-v1.js?v=1',
            './js/nexusnova-growth-center-v1.js?v=1',
            './js/nexusnova-referral-capture-v1.js?v=1'
          ]) {
            if (!integrity.includes(target)) throw new Error(`Direct critical loader missing: ${target}`);
          }
          console.log('Smart search + rewards + profile + Growth Center regression guards passed.');
          NODE

      - name: Verify critical live modules exist
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            js/rewards-security-v1.js \
            js/nexusnova-rewards-spark-v1.js \
            js/nexusnova-smart-live-v1.js \
            js/nexusnova-allapps-smart-search-v1.js \
            js/nexusnova-complete-profile-v1.js \
            js/nexusnova-community-progress-v1.js \
            js/nexusnova-growth-center-v1.js \
            js/nexusnova-referral-capture-v1.js \
            js/nexusnova-file-vault-v1.js \
            js/nexusnova-security-lock-v1.js \
            js/nexusnova-marketplace-live-v1.js \
            js/nexusnova-orders-live-v1.js \
            js/nexusnova-teacher-live-v2.js \
            js/nexusnova-documents-live-v1.js \
            js/nexusnova-learning-engine-v1.js \
            js/nexusnova-islamic-extras-v1.js \
            js/nexusnova-travel-live-v1.js \
            js/nexusnova-ai-authority-v2.js; do
              test -s "$file" || { echo "Missing/empty: $file"; exit 1; }
          done
          test -s referral.html || { echo "Missing/empty: referral.html"; exit 1; }

      - name: Verify Smart Live loader targets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('js/nexusnova-smart-live-v1.js','utf8');
          const refs = [...src.matchAll(/src:'\.\/js\/([^']+\.js)(?:\?[^']*)?'/g)].map(m => m[1]);
          if (!refs.length) throw new Error('No late-loader module references found.');
          const missing = refs.filter(name => !fs.existsSync('js/' + name));
          console.log('Loader refs:', refs.join(', '));
          if (missing.length) throw new Error('Missing loader files: ' + missing.join(', '));
          NODE

      - name: Verify approved ALL APPS order is still present
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('js/nexusnova-allapps-order-guard-v5.js','utf8');
          const expected = ['TOOLS','GOLD/FX','NEWS','CHAT','AI','LOCATION','SOS','FAMILY','PROFILE','DAILY','BUDGET','LEARN','TRAVEL','HEALTH','SMART','QIBLA','PK NEWS','WATCH','BROWSER','CALLER','SETTINGS','SUPER APP','DAILY TOOLS','CALENDAR','REMINDERS','FINANCE','WEATHER','LEARNING','PAKISTAN HUB','ISLAMIC HUB','BIBLE','HABITS','SAVINGS','CONTACTS','SHOPPING','DOCUMENTS','FILE VAULT','QR TOOLS','SECURITY','MARKETPLACE','ORDERS','NOTIFICATIONS','TEACHER TOOLKIT'];
          const match = src.match(/const ORDER=(\[[^;]+\]);/);
          if (!match) throw new Error('ALL APPS ORDER array not found.');
          const actual = Function('return ' + match[1])();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('ALL APPS order changed.\nExpected: ' + expected.join(' > ') + '\nActual: ' + actual.join(' > '));
          }
          console.log('ALL APPS order verified:', actual.length, 'items');
          NODE

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase emulator test packages
        run: npm install --no-save firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.1

      - name: Run Firestore rules smoke
        run: npx firebase emulators:exec --only firestore --project demo-nexusnova-rules "node .github/scripts/firestore-rules-smoke.mjs && node .github/scripts/nexusnova-profile-rules-smoke.mjs && node .github/scripts/referral-rules-smoke.mjs"
