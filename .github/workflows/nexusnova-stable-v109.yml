name: NexusNova Stable v1.0.9

on:
  push:
    branches: [all-bugs-redo-v2]
    paths:
      - '.github/workflows/nexusnova-stable-v109.yml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeNews.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt'
      - 'fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-stable-v109-release.jks

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stability source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "all-bugs-redo-v2"
          test ! -e fresh-rebuild/src/features/apps/premium-speed-safe-v2.js
          test ! -e fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          ! grep -Fq 'nova-internet-speed' fresh-rebuild/src/features/hub/app-registry.js
          grep -Fq "rotor.removeAttribute('filter')" fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          grep -Fq 'EMIT_INTERVAL_MS = 52' fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          ! grep -Fq 'requestAnimationFrame' fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          grep -Fq 'bridgeFeed(query)' fresh-rebuild/src/features/apps/news-resilient.js
          grep -Fq 'NexusNativeNews.ACTION_FETCH_NEWS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt
          ! grep -Fq 'Executors.newSingleThreadExecutor' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt
          grep -Fq 'object NexusNativeNews' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeNews.kt
          grep -Fq 'news.google.com/rss/search' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeNews.kt
          grep -Fq 'private val newsExecutor by lazy' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeNews.kt
          grep -Fq 'fun intercept(uri: Uri): WebResourceResponse? = null' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          node --check fresh-rebuild/src/features/apps/premium-qibla-safe-v2.js
          node --check fresh-rebuild/src/features/apps/news-resilient.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/hub/app-registry.js

      - name: Wire native Nova Drive bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-native-drive.py
          grep -Fq 'ACTION_NATIVE_DRIVE_START' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'NexusDriveForegroundService.start(this)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'otaWebManager' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject v1.0.9 vc10 release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, a = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 10', s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.0.9"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit('Version anchors missing')
          block = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s = s.replace('    buildTypes {\n', block + '    buildTypes {\n', 1)
          line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s = s.replace('        release {\n', '        release {\n' + line, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build permanent-signed stable APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/stable-v109-build.log"

      - name: Verify signature and bundled fixes
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/stable-v109-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme.*true' "$GITHUB_WORKSPACE/stable-v109-signature.txt"
          unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/premium-qibla-safe-v2.js'
          unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/news-resilient.js'
          unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/articles-suite.js'
          unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/premium-drive-native-v2.js'
          ! unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/premium-speed-safe-v2.js'
          ! unzip -l "$APK" | grep -Fq 'assets/www/src/features/apps/premium-nova-internet-speed.js'
          unzip -p "$APK" assets/www/src/features/apps/premium-qibla-safe-v2.js | grep -Fq 'EMIT_INTERVAL_MS = 52'
          ! unzip -p "$APK" assets/www/src/features/apps/premium-qibla-safe-v2.js | grep -Fq 'requestAnimationFrame'
          unzip -p "$APK" assets/www/src/features/apps/news-resilient.js | grep -Fq 'bridgeFeed(query)'
          ! unzip -p "$APK" assets/www/src/features/hub/app-registry.js | grep -Fq 'nova-internet-speed'
          unzip -p "$APK" classes.dex | strings | grep -Fq 'NexusNativeNews'
          printf 'source_commit=%s\nrelease=v1.0.9-vc10-stable\nota_remote_override=disabled\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/stable-v109-source.txt"

      - name: Publish verified stable APK
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/nexusnova-stable-v109
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-v1.0.9-vc10-STABLE-SIGNED.apk"
          sha256sum "$OUT/NexusNova-v1.0.9-vc10-STABLE-SIGNED.apk" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/stable-v109-build.log" "$OUT/build.log"
          cp "$GITHUB_WORKSPACE/stable-v109-signature.txt" "$OUT/signature.txt"
          cp "$GITHUB_WORKSPACE/stable-v109-source.txt" "$OUT/source.txt"
          cat > "$OUT/BUILD-STATUS.txt" <<EOF
          NexusNova v1.0.9 vc10 STABLE
          Source commit: $GITHUB_SHA
          Remote web OTA override: DISABLED
          Internet Speed feature: REMOVED
          Sign-in/App Check startup path: LIGHTWEIGHT
          Native News transport: LAZY / ISOLATED FROM STARTUP
          Qibla movement/math: PRESERVED
          Qibla background compositor fix: BUNDLED
          Qibla permanent animation loop: REMOVED
          Nova Drive native background bridge: BUILD PASS
          Release compile: PASS
          Permanent signature verification: PASS
          RESULT: SIGNED APK READY FOR STABILITY PHONE TEST
          EOF
          sed -i 's/^          //' "$OUT/BUILD-STATUS.txt"
          git config user.name 'NexusNova Signed Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-stable-v109-publish
          git worktree add /tmp/nx-stable-v109-publish origin/apk-builds
          cd /tmp/nx-stable-v109-publish
          rm -rf stable-v1.0.9-vc10
          mkdir -p stable-v1.0.9-vc10
          cp -a "$OUT"/. stable-v1.0.9-vc10/
          git add -A stable-v1.0.9-vc10
          git commit -m "Publish NexusNova stable v1.0.9 vc10 $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.9-vc10-STABLE-SIGNED
          path: /tmp/nexusnova-stable-v109/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
