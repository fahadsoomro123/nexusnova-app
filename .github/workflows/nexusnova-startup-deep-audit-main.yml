name: NexusNova Startup Deep Audit - NO APK

on:
  push:
    branches: [main]
    paths:
      - 'js/page2.js'
      - 'NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py'
      - '.github/scripts/nexusnova-dashboard-splash-deep-test.mjs'
      - '.github/workflows/nexusnova-startup-deep-audit-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  startup-deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare exact family Android shell
        run: |
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py

      - name: Apply shared dashboard startup lockfix
        id: target
        run: python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Static single-owner startup contract
        id: static
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          grep -q 'nx-android-dashboard-startup-lockfix-v1' "$WEB/page2.html"
          grep -q 'id="nxSplash" aria-hidden="true" style="display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important"' "$WEB/page2.html"
          grep -q 'nx-single-startup-owner-v4' "$WEB/js/page2.js"
          if grep -q 'nxSecureStartupShieldV3' "$WEB/js/page2.js"; then
            echo 'Deprecated secondary startup shield reappeared.' >&2
            exit 1
          fi
          grep -q 'id="balance">—</div>' "$WEB/page2.html"
          grep -q 'SYNCING SECURE BALANCE' "$WEB/page2.html"
          grep -q 'SYNCING MINING' "$WEB/page2.html"
          grep -q 'CHECKING SECURE SESSION' "$WEB/page2.html"
          grep -q 'scheduleNativeSplashRelease(target) // nx-native-splash-release-v4' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(2_600L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(4_800L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(8_000L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          node --check "$WEB/js/page2.js"
          echo 'PASS static single-owner startup contract'

      - name: Start local final prepared shell
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/nx-deep-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/NexusNovaAndroid/app/src/main/assets/www/page2.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nx-deep-audit-http.log || true
          exit 1

      - name: Runtime test without manually releasing splash
        id: runtime
        run: node .github/scripts/nexusnova-dashboard-splash-deep-test.mjs

      - name: Record result on isolated audit branch
        if: always()
        shell: bash
        run: |
          git fetch origin startup-deep-fix-audit
          rm -rf /tmp/nx-audit-status
          git worktree add /tmp/nx-audit-status origin/startup-deep-fix-audit
          cat > /tmp/nx-audit-status/STARTUP-DEEP-AUDIT-RESULT.txt <<EOF
          source_commit=${GITHUB_SHA}
          job_status=${{ job.status }}
          target=${{ steps.target.outcome }}
          static=${{ steps.static.outcome }}
          runtime=${{ steps.runtime.outcome }}
          sign_in_target_patch=untouched-by-hash
          startup_owners=1
          deprecated_secondary_shield=absent
          apk_built=no
          external_network_during_runtime=blocked
          test_manually_hides_splash=no
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-audit-status/STARTUP-DEEP-AUDIT-RESULT.txt
          cd /tmp/nx-audit-status
          git config user.name 'NexusNova Startup Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add STARTUP-DEEP-AUDIT-RESULT.txt
          git commit -m 'Record startup deep audit result' || true
          git push origin HEAD:startup-deep-fix-audit
