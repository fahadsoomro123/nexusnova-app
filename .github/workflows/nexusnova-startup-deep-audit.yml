name: NexusNova Startup Deep Audit - NO APK

on:
  push:
    branches: [startup-deep-fix-audit]
    paths:
      - 'NexusNovaAndroid/patch_android_dashboard_startup_lockfix_v1.py'
      - '.github/scripts/nexusnova-dashboard-splash-deep-test.mjs'
      - '.github/workflows/nexusnova-startup-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  startup-deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare same Android web shell used by family build
        run: |
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Optional TEST boost compatibility patches
        continue-on-error: true
        run: |
          python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py
          python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Prepare native shell and existing session behavior
        run: |
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py

      - name: Prove target patch does not touch sign-in document
        id: sign_in_hash
        shell: bash
        run: sha256sum NexusNovaAndroid/app/src/main/assets/www/index.html | awk '{print $1}' > /tmp/nx-index-before.sha

      - name: Apply dashboard-only startup lock fix
        run: python3 NexusNovaAndroid/patch_android_dashboard_startup_lockfix_v1.py

      - name: Static startup contract
        shell: bash
        run: |
          set -euo pipefail
          sha256sum NexusNovaAndroid/app/src/main/assets/www/index.html | awk '{print $1}' > /tmp/nx-index-after.sha
          cmp /tmp/nx-index-before.sha /tmp/nx-index-after.sha
          grep -q 'nx-android-dashboard-startup-lockfix-v1' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'id="nxSplash" aria-hidden="true" style="display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important"' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'nx-android-dashboard-no-secondary-shield-v1' NexusNovaAndroid/app/src/main/assets/www/js/page2.js
          grep -q 'id="balance">—</div>' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'SYNCING SECURE BALANCE' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'SYNCING MINING' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'CHECKING SECURE SESSION' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'scheduleNativeSplashRelease(target) // nx-native-splash-release-v4' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(2_600L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(4_800L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -q 'releaseAfter(8_000L)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          node --check NexusNovaAndroid/app/src/main/assets/www/js/page2.js
          echo 'PASS static: sign-in unchanged by target patch; Android dashboard overlays are impossible from first paint.'

      - name: Start local prepared Android shell
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/nx-startup-deep-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/NexusNovaAndroid/app/src/main/assets/www/page2.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nx-startup-deep-http.log || true
          exit 1

      - name: Real non-cheating startup runtime regression
        id: runtime
        run: node .github/scripts/nexusnova-dashboard-splash-deep-test.mjs

      - name: Record audit result on audit branch
        if: always()
        shell: bash
        run: |
          cat > STARTUP-DEEP-AUDIT-RESULT.txt <<EOF
          source_commit=${GITHUB_SHA}
          job_status=${{ job.status }}
          runtime=${{ steps.runtime.outcome }}
          target_patch=dashboard-only
          sign_in_target_patch=untouched
          apk_built=no
          test_rule=no_test_helper_may_hide_or_remove_splash
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' STARTUP-DEEP-AUDIT-RESULT.txt
          git config user.name 'NexusNova Startup Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add STARTUP-DEEP-AUDIT-RESULT.txt
          git commit -m 'Record startup deep audit result' || true
          git push origin HEAD:startup-deep-fix-audit
