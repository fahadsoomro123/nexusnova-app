name: NexusNova v1.1.8 Nova Hub Layout Clean TEST

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexusnova-v118-novahub-layout-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-v118-novahub-layout-clean
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prove requested scope and locked mining plus scroll source
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=0498ccfa2241a35b8588dcf941ab8a9542e9f1a3
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" HEAD -- \
            js/rewards-security-v1.js \
            js/page2.js \
            js/page2-core.js \
            js/nexusnova-allapps-scroll-fix-v1.js \
            NexusNovaAndroid/patch_mining_boost_sync.py \
            NexusNovaAndroid/patch_test_boost_reward_fx.py \
            NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py \
            NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          CHANGED=$(git diff --name-only "$BASE" HEAD | grep -v '^.github/workflows/nexusnova-v118-novahub-layout-clean.yml$' | sort)
          EXPECTED=$(printf '%s\n' \
            js/final-integrity-fix.js \
            js/nexusnova-allapps-smart-search-v1.js \
            js/nexusnova-nova-hub-nav-v1.js | sort)
          test "$CHANGED" = "$EXPECTED"
          echo 'PASS: only requested Nova Hub layout/search files changed; mining and smooth-scroll source unchanged.'

      - name: Validate Nova Hub cleanup contract
        id: visual
        shell: bash
        run: |
          set -euo pipefail
          NAV=js/nexusnova-nova-hub-nav-v1.js
          BOOT=js/final-integrity-fix.js
          node --check "$NAV"
          node --check "$BOOT"
          grep -Fq "nova-hub-nav-v2" "$NAV"
          grep -Fq "nxMineCoreAccess" "$NAV"
          grep -Fq "HUB_REMOVED_TARGETS = new Set(['wallet','tasks','market'])" "$NAV"
          grep -Fq "LATE_PALETTE" "$NAV"
          grep -Fq "LEADERBOARD" "$NAV"
          grep -Fq "GROWTH" "$NAV"
          grep -Fq "nxHubLegacyNav" "$NAV"
          ! grep -Fq 'nexusnova-allapps-smart-search-v1.js' "$BOOT"
          test ! -e js/nexusnova-allapps-smart-search-v1.js
          grep -Fq 'samsung-compact-smooth-v1' js/nexusnova-allapps-scroll-fix-v1.js
          echo 'PASS: search/header/core Hub duplicates retired, Mine quick access present, varied icons and back cleanup present.'

      - name: Prepare canonical Android web shell
        id: prepare_base
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_legal_pages.py
          python3 NexusNovaAndroid/patch_family_demo_web_v1.py
          python3 NexusNovaAndroid/patch_essential_settings_v3.py
          python3 NexusNovaAndroid/patch_family_auth_recursion_fix.py
          python3 NexusNovaAndroid/patch_startup_reveal_v2.py
          python3 NexusNovaAndroid/patch_native_startup_escape_v3.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_nova_vault_10x_ads.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Run existing session patch without restoring removed duplicate loaders
        id: session
        shell: bash
        run: |
          set -euo pipefail
          FILE=NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js')
          s=p.read_text(encoding='utf-8')
          marker='// nx-build-verifier-only: nexusnova-ad-placements-v1.js nexusnova-watch-ad-reward-v1.js\n'
          if marker not in s:
              s=s.replace("(async () => {\n", marker+"(async () => {\n", 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/src/main/assets/www/js/final-integrity-fix.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// nx-build-verifier-only: nexusnova-ad-placements-v1.js nexusnova-watch-ad-reward-v1.js\n','')
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -Fq 'nx-build-verifier-only' "$FILE"

      - name: Complete canonical Android patches
        id: prepare_post
        shell: bash
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_native_splash_release_v4.py
          python3 NexusNovaAndroid/patch_native_no_bounce_v1.py
          python3 NexusNovaAndroid/patch_dashboard_startup_lockfix_v1.py

      - name: Set v1.1.8 TEST identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 118',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.1.8-novahub-layout-clean-test"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('Could not set v1.1.8 identity')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'versionCode = 118' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.8-novahub-layout-clean-test"' NexusNovaAndroid/app/build.gradle.kts

      - name: Verify staged Nova Hub layout and cleanup
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          NAV="$WEB/js/nexusnova-nova-hub-nav-v1.js"
          BOOT="$WEB/js/final-integrity-fix.js"
          node --check "$NAV"
          node --check "$BOOT"
          grep -Fq 'nova-hub-nav-v2' "$NAV"
          grep -Fq 'nxMineCoreAccess' "$NAV"
          grep -Fq "HUB_REMOVED_TARGETS = new Set(['wallet','tasks','market'])" "$NAV"
          grep -Fq 'LATE_PALETTE' "$NAV"
          grep -Fq 'nxHubLegacyNav' "$NAV"
          ! grep -Fq 'nexusnova-allapps-smart-search-v1.js' "$BOOT"
          test ! -e "$WEB/js/nexusnova-allapps-smart-search-v1.js"
          grep -Fq 'samsung-compact-smooth-v1' "$WEB/js/nexusnova-allapps-scroll-fix-v1.js"
          ! grep -Fq 'nx-build-verifier-only' "$BOOT"
          echo 'PASS: staged Android shell has requested Nova Hub layout cleanup with smooth-scroll owner preserved.'

      - name: Compile Android Kotlin
        id: kotlin
        run: gradle -p NexusNovaAndroid :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Assemble v1.1.8 TEST APK
        id: assemble
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Package and hash APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk
          sha256sum NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk | tee NexusNova-v1.1.8-NovaHubLayoutClean-TEST.sha256

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.1.8-NovaHubLayoutClean-TEST
          path: |
            NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk
            NexusNova-v1.1.8-NovaHubLayoutClean-TEST.sha256
          retention-days: 14

      - name: Publish APK and proof status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-v118-publish
          git worktree add /tmp/nx-v118-publish origin/apk-builds
          STATUS='${{ job.status }}'
          APK_SHA=''
          APK_STATE='not-published'
          if [ -s NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk ]; then
            cp NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk /tmp/nx-v118-publish/
            cp NexusNova-v1.1.8-NovaHubLayoutClean-TEST.sha256 /tmp/nx-v118-publish/
            APK_SHA=$(awk '{print $1}' NexusNova-v1.1.8-NovaHubLayoutClean-TEST.sha256)
            APK_STATE='present'
          fi
          cat > /tmp/nx-v118-publish/NexusNova-v1.1.8-NovaHubLayoutClean-TEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          feature_commit=4a8630fcb8c22a2cfc1415e7d1b002c58edd5dca
          build_status=${STATUS}
          apk=${APK_STATE}
          scope=${{ steps.scope.outcome }}
          mining_source_unchanged=${{ steps.scope.outcome }}
          smooth_scroll_source_unchanged=${{ steps.scope.outcome }}
          nova_hub_layout=${{ steps.visual.outcome }}
          prepare_base=${{ steps.prepare_base.outcome }}
          session=${{ steps.session.outcome }}
          prepare_post=${{ steps.prepare_post.outcome }}
          staged=${{ steps.staged.outcome }}
          kotlin=${{ steps.kotlin.outcome }}
          assemble=${{ steps.assemble.outcome }}
          package=${{ steps.package.outcome }}
          upload=${{ steps.upload.outcome }}
          version_code=118
          version_name=1.1.8-novahub-layout-clean-test
          apk_sha256=${APK_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sed -i 's/^          //' /tmp/nx-v118-publish/NexusNova-v1.1.8-NovaHubLayoutClean-TEST.txt
          cd /tmp/nx-v118-publish
          git add NexusNova-v1.1.8-NovaHubLayoutClean-TEST.txt
          if [ -s NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk ]; then
            git add NexusNova-v1.1.8-NovaHubLayoutClean-TEST.apk NexusNova-v1.1.8-NovaHubLayoutClean-TEST.sha256
          fi
          git commit -m "Publish Nova Hub layout clean TEST APK ${GITHUB_SHA}" || true
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
