name: NexusNova Video Studio Flagship Signed APK

on:
  push:
    branches:
      - main
      - flagship-video-studio-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate flagship source
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'ADD MEDIA' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq 'EXPORT VIDEO' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          ! grep -Fq 'Choose File / No file chosen' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js

      - name: Lock bundled web baseline to exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_SHA="$(git rev-parse HEAD)"
          test "${#PUBLIC_SHA}" = 40
          echo "PUBLIC_SHA=$PUBLIC_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path("NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt")
          s = p.read_text(encoding="utf-8")
          sha = os.environ["PUBLIC_SHA"]
          s, count = re.subn(
              r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"',
              f'const val BUNDLED_WEB_BASE = "{sha}"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("BUNDLED_WEB_BASE injection failed")
          p.write_text(s, encoding="utf-8")
          PY
          grep -Fq "const val BUNDLED_WEB_BASE = \"$PUBLIC_SHA\"" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode signing key
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 --decode > /tmp/nexusnova-release.jks
          test -s /tmp/nexusnova-release.jks
          chmod 600 /tmp/nexusnova-release.jks
          keytool -list -keystore /tmp/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject flagship release version and signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("NexusNovaAndroid/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s, a = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 26092250", s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.50-video-flagship"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit("release version anchors missing")
          signing = """    signingConfigs {
        create("nexusFlagshipRelease") {
            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
        }
    }

"""
          if 'create("nexusFlagshipRelease")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          if 'signingConfig = signingConfigs.getByName("nexusFlagshipRelease")' not in s:
              s = s.replace('        release {', '        release {\n            signingConfig = signingConfigs.getByName("nexusFlagshipRelease")', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed APK
        shell: bash
        working-directory: NexusNovaAndroid
        env:
          NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-release.jks
          NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK
        shell: bash
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.nexusnova.app'"
          echo "$BADGING" | grep -q "versionCode='26092250'"
          echo "$BADGING" | grep -q "versionName='1.0.50-video-flagship'"
          mkdir -p /tmp/apk-check
          unzip -q "$APK" 'assets/www/src/features/apps/ai-video-studio-flagship.js' 'assets/www/src/features/apps/premium-studio-suite.js' -d /tmp/apk-check
          grep -Fq 'ADD MEDIA' /tmp/apk-check/assets/www/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "'ai-video-studio': renderAiVideoStudio" /tmp/apk-check/assets/www/src/features/apps/premium-studio-suite.js

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk
          sha256sum release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk > release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk.sha256
          printf "%s\n" "$PUBLIC_SHA" > release-output/PUBLIC-SOURCE-SHA.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.50-video-flagship-SIGNED
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
