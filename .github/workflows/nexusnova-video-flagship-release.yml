name: NexusNova Video Studio Flagship Release Gate

on:
  push:
    branches:
      - main
      - flagship-video-studio-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flagship-release:
    name: Build Signed Flagship APK + Android QA
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}

    steps:
      - name: Checkout exact source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate flagship web source before build
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq 'ADD MEDIA' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq 'EXPORT VIDEO' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          grep -Fq 'data-file' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          ! grep -Fq 'Choose File / No file chosen' fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js

      - name: Lock exact bundled web baseline to source SHA
        shell: bash
        run: |
          set -euo pipefail
          export PUBLIC_SHA="$(git rev-parse HEAD)"
          test "${#PUBLIC_SHA}" = 40
          echo "PUBLIC_SHA=$PUBLIC_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt")
          s = p.read_text(encoding="utf-8")
          sha = os.environ["PUBLIC_SHA"]
          s, count = re.subn(
              r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"',
              f'const val BUNDLED_WEB_BASE = "{sha}"',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("BUNDLED_WEB_BASE injection failed")
          p.write_text(s, encoding="utf-8")
          PY
          grep -Fq "const val BUNDLED_WEB_BASE = \"$PUBLIC_SHA\"" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

      - name: Verify signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Decode release signing key
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 --decode > /tmp/nexusnova-release.jks
          test -s /tmp/nexusnova-release.jks
          chmod 600 /tmp/nexusnova-release.jks
          keytool -list -keystore /tmp/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject verified flagship release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("NexusNovaAndroid/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s, a = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 26092250", s, count=1)
          s, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.50-video-flagship"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit("version anchors missing")
          signing = """    signingConfigs {
        create("nexusFlagshipRelease") {
            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
        }
    }

"""
          if 'create("nexusFlagshipRelease")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          if 'signingConfig = signingConfigs.getByName("nexusFlagshipRelease")' not in s:
              s = s.replace('        release {', '        release {\n            signingConfig = signingConfigs.getByName("nexusFlagshipRelease")', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build signed release + Android test APK
        shell: bash
        working-directory: NexusNovaAndroid
        env:
          NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-release.jks
          NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease assembleDebugAndroidTest

      - name: Verify APK identity and bundled baseline
        shell: bash
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$APK"
          test -s "$TEST_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.nexusnova.app'"
          echo "$BADGING" | grep -q "versionCode='26092250'"
          echo "$BADGING" | grep -q "versionName='1.0.50-video-flagship'"
          unzip -q "$APK" 'assets/www/src/features/apps/ai-video-studio-flagship.js' 'assets/www/src/features/apps/premium-studio-suite.js' -d /tmp/flagship-apk
          grep -Fq 'ADD MEDIA' /tmp/flagship-apk/assets/www/src/features/apps/ai-video-studio-flagship.js
          grep -Fq "'ai-video-studio': renderAiVideoStudio" /tmp/flagship-apk/assets/www/src/features/apps/premium-studio-suite.js

      - name: Create deterministic video fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gstreamer1.0-tools gstreamer1.0-plugins-good
          mkdir -p qa/fixtures
          gst-launch-1.0 -q videotestsrc num-buffers=30 pattern=ball ! video/x-raw,width=160,height=90,framerate=15/1 ! videoconvert ! vp8enc ! webmmux ! filesink location=qa/fixtures/generated.webm
          test -s qa/fixtures/generated.webm

      - name: Run signed APK on real Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            set -e
            mkdir -p "$GITHUB_WORKSPACE/qa/video-release-evidence"
            trap 'adb exec-out screencap -p > "$GITHUB_WORKSPACE/qa/video-release-evidence/final-screen.png" || true; adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/qa/video-release-evidence/logcat.txt" || true' EXIT
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push "$GITHUB_WORKSPACE/qa/fixtures/generated.webm" /sdcard/Download/video-studio-video-qa.webm
            adb shell am force-stop com.nexusnova.app
            gradle --no-daemon :app:connectedDebugAndroidTest --tests 'com.nexusnova.app.VideoStudioEmulatorQaTest'

      - name: Package verified release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          if [ -s NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk ]; then
            cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk
            sha256sum release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk > release-output/NexusNova-v1.0.50-video-flagship-SIGNED.apk.sha256
          fi
          printf "%s\\n" "${PUBLIC_SHA:-unknown}" > release-output/PUBLIC-SOURCE-SHA.txt
          cp -R qa/video-release-evidence release-output/ 2>/dev/null || true

      - name: Upload release evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.50-video-flagship-release-evidence
          path: release-output
          if-no-files-found: warn
          retention-days: 14
