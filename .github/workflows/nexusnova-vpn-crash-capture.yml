name: NexusNova VPN Crash Capture

on:
  push:
    branches:
      - nexusnova-fresh-rebuild-20260820
    paths:
      - '.github/workflows/nexusnova-vpn-crash-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare bundled app
        env:
          NEXUSNOVA_APP_CHECK_SITE_KEY: ${{ secrets.NEXUSNOVA_APP_CHECK_SITE_KEY }}
        run: python3 NexusNovaAndroid/prepare_fresh_rebuild.py

      - name: Build APK
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleDebug

      - name: Create runtime capture
        shell: bash
        run: |
          cat > vpn-capture.sh <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          adb wait-for-device
          for i in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          adb uninstall com.nexusnova.app >/dev/null 2>&1 || true
          adb install --no-streaming -r "$APK" > "$GITHUB_WORKSPACE/adb-install.txt" 2>&1 || true
          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.MainActivity > "$GITHUB_WORKSPACE/main-launch.txt" 2>&1 || true
          sleep 20
          echo "MAIN_PID=$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)" > "$GITHUB_WORKSPACE/pids.txt"
          adb logcat -c
          adb shell am start -W -n com.nexusnova.app/.NovaVpnActivity --es nova_vpn_auth_token smoke-token > "$GITHUB_WORKSPACE/vpn-launch.txt" 2>&1 || true
          sleep 20
          echo "VPN_PID=$(adb shell pidof com.nexusnova.app | tr -d '\r' | xargs)" >> "$GITHUB_WORKSPACE/pids.txt"
          adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/vpn-logcat.txt" 2>&1 || true
          adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/vpn-state.txt" 2>&1 || true
          grep -E 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal|NovaVpn|WireGuard|GoBackend|UnsatisfiedLinkError|NoClassDefFoundError|SecurityException|IllegalStateException' "$GITHUB_WORKSPACE/vpn-logcat.txt" > "$GITHUB_WORKSPACE/vpn-crash-extract.txt" || true
          test -n "$(grep '^VPN_PID=' "$GITHUB_WORKSPACE/pids.txt" | cut -d= -f2)"
          ! grep -E -q 'FATAL EXCEPTION|AndroidRuntime: Process: com\.nexusnova\.app|ANR in com\.nexusnova\.app|Fatal signal.*com\.nexusnova\.app' "$GITHUB_WORKSPACE/vpn-logcat.txt"
          BASH
          chmod +x vpn-capture.sh

      - name: Android 11 VPN runtime capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/vpn-capture.sh"

      - name: Publish diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          git config user.name 'NexusNova Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-vpn-capture
          git worktree add /tmp/nx-vpn-capture origin/apk-builds
          cd /tmp/nx-vpn-capture
          rm -rf vpn-crash-capture
          mkdir -p vpn-crash-capture
          for f in adb-install.txt main-launch.txt vpn-launch.txt pids.txt vpn-logcat.txt vpn-state.txt vpn-crash-extract.txt; do
            [ -f "$GITHUB_WORKSPACE/$f" ] && cp "$GITHUB_WORKSPACE/$f" vpn-crash-capture/
          done
          echo "Source: $GITHUB_SHA" > vpn-crash-capture/SOURCE.txt
          git add -A vpn-crash-capture
          git commit -m "Publish VPN crash capture $GITHUB_SHA" || exit 0
          git push origin HEAD:apk-builds || true
