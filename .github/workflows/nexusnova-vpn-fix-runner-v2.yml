name: NexusNova VPN Fix Runner V2

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths:
      - 'release-trigger/vpn-fix-runner-v2.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-vpn-disconnect-access-20260825
          fetch-depth: 0
      - name: Apply verified VPN accessibility patch
        run: bash tools/fix-vpn-disconnect-access.sh
      - name: Commit fix branch
        run: |
          git config user.name 'NexusNova Android Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NovaVpnActivity.kt
          git commit -m 'fix(vpn): keep disconnect control above server list'
          git push origin HEAD:nexusnova-vpn-disconnect-access-20260825
