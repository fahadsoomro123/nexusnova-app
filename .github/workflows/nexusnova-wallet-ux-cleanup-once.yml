name: NexusNova Wallet UX Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nexusnova-wallet-ux-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup-wallet-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate wallet UX and safe area
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wallet = Path('js/wallet-onchain-sync-v3.js')
          s = wallet.read_text(encoding='utf-8')
          replacements = {
            '0x833589fCD6eDb6E08f4a7fC32D4f71b54bdA02913': '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',
            'body{padding-bottom:118px!important}': 'body{padding-bottom:132px!important}',
            '.bottom-dock{left:8px!important;right:8px!important;bottom:12px!important;': '.bottom-dock{left:8px!important;right:8px!important;bottom:max(24px,env(safe-area-inset-bottom))!important;',
            '.more-menu{bottom:88px!important}': '.more-menu{bottom:calc(max(24px,env(safe-area-inset-bottom)) + 78px)!important}'
          }
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
          wallet.write_text(s, encoding='utf-8')

          page2 = Path('js/page2.js')
          p = page2.read_text(encoding='utf-8')
          p = p.replace("await import('./nexusnova-mobile-wallet-ux-v1.js?v=1');\n", '')
          page2.write_text(p, encoding='utf-8')

          extra = Path('js/nexusnova-mobile-wallet-ux-v1.js')
          if extra.exists():
            extra.unlink()
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "Wallet UX already consolidated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/page2.js js/wallet-onchain-sync-v3.js js/nexusnova-mobile-wallet-ux-v1.js
          git commit -m "consolidate wallet UX and Android safe area"
          git push
