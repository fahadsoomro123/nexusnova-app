name: NexusNova OTA Popup Android Build

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/assets/js/nn-ota-updater.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nn-ota-popup-android-build.yml'
      - 'qa/nn-ota-updater-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-popup-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon
      - name: Compile debug Android tests
        run: gradle -p NexusNovaAndroid :app:compileDebugAndroidTestKotlin --stacktrace --no-daemon
      - name: Verify metadata
        run: test -s NexusNovaAndroid/app/build/outputs/apk/debug/output-metadata.json
      - name: Upload OTA debug APK + metadata
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-ota-popup-debug-apk-${{ github.sha }}
          path: |
            NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            NexusNovaAndroid/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7