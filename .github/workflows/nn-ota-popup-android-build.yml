name: NexusNova OTA Popup Android Build

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/assets/js/nn-ota-updater.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
      - 'fresh-rebuild/src/main.js'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nn-ota-popup-android-build.yml'
      - 'qa/nn-ota-updater-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ota-popup-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode production release keystore
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject exact OTA-28 release version
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          version_code = 27010031
          version_name = "1.0.45-ota-31"
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version_name}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("OTA version injection failed")
          signing = """    signingConfigs {
              create("release") {
                  storeFile = file("nexusnova-release.jks")
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("KEY_ALIAS")
                  keyPassword = System.getenv("KEY_PASSWORD")
              }
          }

          """
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding='utf-8')
          print(f"OTA_VERSION_CODE={version_code}")
          print(f"OTA_VERSION_NAME={version_name}")
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify signed APK and capture metadata
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -Fq '30052faf26f112d88d48061b88e6a698371ef0cdc4203122a9350529405a716c' /tmp/apksigner.txt
          badging="$("$AAPT" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          VERSION_CODE="$("$AAPT" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          VERSION_NAME="$("$AAPT" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$VERSION_CODE" = "27010031"
          test "$VERSION_NAME" = "1.0.45-ota-31"
          SHA256="$(sha256sum "$apk" | awk '{print $1}')"
          APK_SIZE_BYTES="$(stat -c '%s' "$apk")"
          test "${#SHA256}" = 64
          echo "OTA_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "OTA_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "OTA_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "OTA_APK_SIZE_BYTES=$APK_SIZE_BYTES" >> "$GITHUB_ENV"
          echo "OTA_APK_SIZE_BYTES=$APK_SIZE_BYTES"
          echo "APK_SHA256=$SHA256"

      - name: Publish signed OTA package to apk-builds
        working-directory: NexusNovaAndroid
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          git clone --depth=1 --branch apk-builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          mkdir -p "$dir/ota-bootstrap-safe"
          cp app/build/outputs/apk/release/app-release.apk "$dir/ota-bootstrap-safe/NexusNova-OTA-LATEST.apk"
          printf '%s\n' "$OTA_SHA256" > "$dir/ota-bootstrap-safe/NexusNova-OTA-LATEST.apk.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          payload = {
              "schema": 1,
              "packageName": "com.nexusnova.app",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "message": "NexusNova signed OTA build",
              "versionCode": int(os.environ["OTA_VERSION_CODE"]),
              "versionName": os.environ["OTA_VERSION_NAME"],
              "sha256": os.environ["OTA_SHA256"],
              "apkSizeBytes": int(os.environ["OTA_APK_SIZE_BYTES"]),
              "apkUrl": f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/apk-builds/ota-bootstrap-safe/NexusNova-OTA-LATEST.apk?source={os.environ['GITHUB_SHA']}",
              "generatedAt": os.environ.get("GITHUB_RUN_STARTED_AT", "")
          }
          Path(os.environ["GITHUB_WORKSPACE"] + "/ota-bootstrap-safe-manifest.json").write_text(
              json.dumps(payload, separators=(",", ":")) + "\n",
              encoding="utf-8"
          )
          PY
          cp "$GITHUB_WORKSPACE/ota-bootstrap-safe-manifest.json" "$dir/ota-bootstrap-safe/manifest.json"
          printf '%s\n' "$GITHUB_SHA" > "$dir/ota-bootstrap-safe/SOURCE-SHA.txt"
          printf '%s\n' "$OTA_VERSION_CODE" > "$dir/ota-bootstrap-safe/VERSION-CODE.txt"
          printf '%s\n' "$OTA_VERSION_NAME" > "$dir/ota-bootstrap-safe/VERSION-NAME.txt"
          cd "$dir"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ota-bootstrap-safe
          git diff --cached --quiet && {
            echo "OTA publication produced no changes."
            exit 1
          }
          git commit -m "publish: NexusNova signed OTA build ${OTA_VERSION_NAME}"
          git push origin HEAD:apk-builds
          echo "OTA_PUBLICATION_BRANCH=apk-builds"
          echo "OTA_APK_PATH=ota-bootstrap-safe/NexusNova-OTA-LATEST.apk"
          echo "OTA_MANIFEST_PATH=ota-bootstrap-safe/manifest.json"
          echo "OTA_APK_SIZE_BYTES=${OTA_APK_SIZE_BYTES}"
          echo "OTA_SOURCE_COMMIT=${GITHUB_SHA}"

      - name: Upload signed OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-ota-popup-signed-${{ github.sha }}
          path: |
            NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
            NexusNovaAndroid/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 7
