name: NexusNova OTA Popup QA

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/assets/js/nn-ota-updater.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
      - 'fresh-rebuild/src/main.js'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/app/src/main/res/xml/file_paths.xml'
      - 'qa/nn-ota-updater-smoke.mjs'
      - '.github/workflows/nn-ota-popup-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-popup-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static scope and syntax guard
        run: |
          set -euo pipefail
          node --check fresh-rebuild/assets/js/nn-ota-updater.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          if git diff --name-only HEAD^ HEAD | grep -Ei '(^|/)mining|nova-mining' >/dev/null; then
            echo 'Mining path changed: FAIL'
            exit 1
          fi
          echo 'Mining safe bounds: PASS'
          changed="$(git diff --name-only HEAD^ HEAD)"
          allowed='^(.github/workflows/nn-ota-popup-(qa|android-build)\.yml|fresh-rebuild/assets/js/nn-ota-updater\.js|fresh-rebuild/src/main\.js|fresh-rebuild/src/features/apps/app-screen\.js|NexusNovaAndroid/app/build\.gradle\.kts|NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity\.kt|NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager\.kt|NexusNovaAndroid/app/src/main/AndroidManifest\.xml|NexusNovaAndroid/app/src/main/res/xml/file_paths\.xml|qa/nn-ota-updater-smoke\.mjs)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected modified files: FAIL'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo 'Unexpected modified files: 0'

          forbidden_release='releases/''latest'
          forbidden_golden='golden-''disaster-''recovery'
          for needle in "$forbidden_release" "$forbidden_golden"; do
            if git grep -n -F -- "$needle" -- . ':!.git' >/dev/null; then
              echo "Forbidden legacy OTA token remains: $needle"
              git grep -n -F -- "$needle" -- . ':!.git' || true
              exit 1
            fi
          done

          forbidden_window='window.''open'
          for file in             fresh-rebuild/assets/js/nn-ota-updater.js             fresh-rebuild/src/features/apps/app-screen.js             NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt             NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt; do
            if git grep -n -F -- "$forbidden_window" -- "$file" >/dev/null; then
              echo "OTA-scoped browser redirect remains: $file"
              git grep -n -F -- "$forbidden_window" -- "$file" || true
              exit 1
            fi
          done
          echo 'OTA-scoped redirect tokens: 0'
      - name: OTA engine smoke
        run: node qa/nn-ota-updater-smoke.mjs
