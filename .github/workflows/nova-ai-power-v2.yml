name: NOVA AI Power v2 Check

on:
  pull_request:
    paths:
      - 'js/nexusnova-ai-power-v2.js'
      - 'js/nexusnova-android-callerid-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-power-v2.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js'
      - '.github/workflows/nova-ai-power-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check NOVA AI JavaScript syntax
        run: |
          node --check js/nexusnova-ai-power-v2.js
          node --check js/nexusnova-android-callerid-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-power-v2.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
      - name: Verify Power v2 loader wiring
        run: |
          grep -q 'nexusnova-ai-power-v2.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-power-v2.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q "data-mode='power'\|data-mode=\"power\"\|dataset.mode='power'" js/nexusnova-ai-power-v2.js
