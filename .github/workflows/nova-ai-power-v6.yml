name: NOVA AI Power v6 Check

on:
  pull_request:
    paths:
      - 'js/nexusnova-ai-v6.js'
      - 'js/nexusnova-ai-v6-connection-test-v1.js'
      - 'js/nexusnova-ai-sol57-v1.js'
      - 'js/nexusnova-ai-sol57-context-v1.js'
      - 'js/nexusnova-ai-sol57-files-v1.js'
      - 'js/nexusnova-android-callerid-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6-connection-test-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-context-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-files-v1.js'
      - 'NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js'
      - '.github/workflows/nova-ai-power-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check NOVA AI V6 and Sol JavaScript syntax
        run: |
          node --check js/nexusnova-ai-v6.js
          node --check js/nexusnova-ai-v6-connection-test-v1.js
          node --check js/nexusnova-ai-sol57-v1.js
          node --check js/nexusnova-ai-sol57-context-v1.js
          node --check js/nexusnova-ai-sol57-files-v1.js
          node --check js/nexusnova-android-callerid-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6-connection-test-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-context-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-files-v1.js
          node --check NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
      - name: Verify V6 loader, secure connection test, Work MAX, Builder and Sol 5.7 wiring
        run: |
          grep -q 'nexusnova-ai-v6.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-v6.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-v6-connection-test-v1.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-v6-connection-test-v1.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-v1.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-v1.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-context-v1.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-context-v1.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-files-v1.js' js/nexusnova-android-callerid-v1.js
          grep -q 'nexusnova-ai-sol57-files-v1.js' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-android-callerid-v1.js
          grep -q "X-NexusNova-Token" js/nexusnova-ai-v6-connection-test-v1.js
          grep -q "'/api/chat'" js/nexusnova-ai-v6-connection-test-v1.js
          grep -q "builder" js/nexusnova-ai-v6.js
          grep -q "Work MAX" js/nexusnova-ai-v6.js
          grep -q "work_workspace" js/nexusnova-ai-v6.js
          grep -q "work_background" js/nexusnova-ai-v6.js
          grep -q "/api/work/job" js/nexusnova-ai-v6.js
          grep -q "/api/work/jobs" js/nexusnova-ai-v6.js
          grep -q "/api/work/instructions" js/nexusnova-ai-v6.js
          grep -q "Delegate in Background" js/nexusnova-ai-v6.js
          grep -q "Ultimate" js/nexusnova-ai-v6.js
          grep -q "NOVA 5.7 Sol" js/nexusnova-ai-sol57-v1.js
          grep -q "5.7.0-sol" js/nexusnova-ai-sol57-v1.js
          grep -q "Never claim that NOVA is ChatGPT" js/nexusnova-ai-sol57-v1.js
          grep -q "nova_client" js/nexusnova-ai-sol57-v1.js
          grep -q "nova_context" js/nexusnova-ai-sol57-context-v1.js
          grep -q "owner_context" js/nexusnova-ai-sol57-context-v1.js
          grep -q "Export chat" js/nexusnova-ai-sol57-context-v1.js
          grep -q "backend model" js/nexusnova-ai-sol57-context-v1.js
          grep -q "nova_files" js/nexusnova-ai-sol57-files-v1.js
          grep -q "Attach multiple files" js/nexusnova-ai-sol57-files-v1.js
          grep -q "MAX_FILES=6" js/nexusnova-ai-sol57-files-v1.js
          cmp -s js/nexusnova-ai-v6.js NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6.js
          cmp -s js/nexusnova-ai-v6-connection-test-v1.js NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-v6-connection-test-v1.js
          cmp -s js/nexusnova-ai-sol57-v1.js NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-v1.js
          cmp -s js/nexusnova-ai-sol57-context-v1.js NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-context-v1.js
          cmp -s js/nexusnova-ai-sol57-files-v1.js NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-ai-sol57-files-v1.js