name: Nova Drive Android CI

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128, nova-vehicle-premium-v1]
    paths:
      - '.github/workflows/nova-drive-android-ci.yml'
      - 'functions/main.js'
      - 'functions/novaVehicle.js'
      - 'NexusNovaAndroid/settings.gradle.kts'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDrivePermissionActivity.kt'
      - 'NexusNovaAndroid/tracker/**'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/src/core/drive-cloud-store.js'
      - 'fresh-rebuild/src/core/drive-track-persistence.js'
      - 'fresh-rebuild/src/core/nova-vehicle-premium-store.js'
      - 'fresh-rebuild/src/drive-background-sync.js'
      - 'fresh-rebuild/src/nova-vehicle-premium-ui.js'
      - 'fresh-rebuild/src/features/apps/premium-drive-native-v2.js'
      - 'fresh-rebuild/src/features/hub/hub-screen.js'

permissions:
  contents: read

concurrency:
  group: nova-drive-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Nova Drive and Vehicle sources
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          node --check fresh-rebuild/src/core/drive-cloud-store.js
          node --check fresh-rebuild/src/core/drive-track-persistence.js
          node --check fresh-rebuild/src/drive-background-sync.js
          node --check fresh-rebuild/src/features/hub/hub-screen.js
          node --check fresh-rebuild/src/core/nova-vehicle-premium-store.js
          node --check fresh-rebuild/src/nova-vehicle-premium-ui.js
          node --check functions/novaVehicle.js
          node --check functions/main.js
          grep -Fq 'ACTIVITY_RECOGNITION' NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq 'AUTO_PAUSE_AFTER_MS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'AUTO_END_AFTER_MS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'MODE_BICYCLE' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'WALKING' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'RECOVER' fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          grep -Fq 'nova-track' fresh-rebuild/src/features/hub/hub-screen.js
          grep -Fq 'Nova Vehicle Premium' fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq 'pushNovaVehicleTelemetry' functions/novaVehicle.js
          grep -Fq 'FOREGROUND_SERVICE_LOCATION' NexusNovaAndroid/tracker/src/main/AndroidManifest.xml
          echo 'Nova Drive + Nova Vehicle source validation PASS'

      - name: Validate Cloud Functions module
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          node -e "const f=require('./functions/novaVehicle.js'); for (const n of ['createNovaVehiclePairing','getNovaVehicleDashboard','revokeNovaVehicle','claimNovaVehiclePairing','pushNovaVehicleTelemetry']) if(typeof f[n]!=='function') throw new Error('missing '+n); console.log('Nova Vehicle Functions load PASS')"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile NexusNova and Tracker APKs
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean :app:assembleDebug :tracker:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s tracker/build/outputs/apk/debug/tracker-debug.apk
          test -s app/src/main/assets/www/src/features/apps/premium-drive-native-v2.js
          test -s app/src/main/assets/www/src/nova-vehicle-premium-ui.js
          grep -Fq 'drive-background-sync.js' app/src/main/assets/www/index.html
          grep -Fq 'nova-vehicle-premium-ui.js' app/src/main/assets/www/index.html
          grep -Fq 'AUTO-DETECT READY' app/src/main/assets/www/src/features/apps/premium-drive-native-v2.js
          echo 'Nova Drive + Nova Vehicle Android compile PASS'

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-drive-vehicle-debug-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
            NexusNovaAndroid/tracker/build/outputs/apk/debug/tracker-debug.apk
