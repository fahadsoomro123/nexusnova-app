name: Nova Drive Flagship Real Preview

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/src/nova-drive-flagship-shell-v1.js'
      - 'fresh-rebuild/src/nova-drive-flagship-polish-v2.js'
      - 'fresh-rebuild/src/nova-drive-flagship-clean-v3.js'
      - 'fresh-rebuild/src/nova-drive-flagship-preserve-v5.js'
      - 'fresh-rebuild/src/nova-vehicle-premium-ui.js'
      - '.github/workflows/nova-drive-flagship-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify flagship source syntax and activation
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/nova-drive-flagship-shell-v1.js
          node --check fresh-rebuild/src/nova-drive-flagship-polish-v2.js
          node --check fresh-rebuild/src/nova-drive-flagship-clean-v3.js
          node --check fresh-rebuild/src/nova-drive-flagship-preserve-v5.js
          grep -Fq "nova-drive-flagship-shell-v1.js?ota=drive-flagship-shell-v1" fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "nova-drive-flagship-polish-v2.js?ota=drive-flagship-polish-v2" fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "nova-drive-flagship-clean-v3.js?ota=drive-flagship-clean-v3" fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "nova-drive-flagship-preserve-v5.js?ota=drive-flagship-preserve-v5" fresh-rebuild/src/nova-vehicle-premium-ui.js
          ! grep -Fq "nova-drive-flagship-vector-v4.js?ota=drive-flagship-vector-v4" fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq 'data-nxfs-filter="today"' fresh-rebuild/src/nova-drive-flagship-shell-v1.js
          grep -Fq 'data-nxfs-filter="history"' fresh-rebuild/src/nova-drive-flagship-shell-v1.js
          grep -Fq 'www.nexusnovatools.com' fresh-rebuild/src/nova-drive-flagship-shell-v1.js
          grep -Fq 'nova-drive-approved-v7.png' fresh-rebuild/src/nova-drive-flagship-preserve-v5.js
          grep -Fq 'nova-vehicle-tracking-approved-v2.png' fresh-rebuild/src/nova-drive-flagship-preserve-v5.js

      - name: Build runtime-only preview harness from committed shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qa preview
          python3 - <<'PY'
          from pathlib import Path
          src = Path('fresh-rebuild/src/nova-drive-flagship-shell-v1.js').read_text()
          old = "import { loadDriveTrackState } from './core/drive-track-persistence.js';"
          stub = """const loadDriveTrackState = async () => ({store:{trips:[{nativeId:'preview-trip',at:new Date(Date.now()-48*60*1000).toISOString(),endedAt:new Date().toISOString(),distanceM:16000,movingMs:38*60*1000,durationMs:38*60*1000,avgKmh:25,topKmh:62,mode:'motor',startName:'Riverside Park',endName:'CBD, Moi Avenue',routePoints:[{lat:-1.2790,lng:36.8120},{lat:-1.2760,lng:36.8170},{lat:-1.2710,lng:36.8220},{lat:-1.2680,lng:36.8290},{lat:-1.2630,lng:36.8350}]}],days:{}}});"""
          if old not in src:
              raise SystemExit('Drive preview stub gate: expected import not found')
          Path('fresh-rebuild/src/nova-drive-flagship-preview-runtime.js').write_text(src.replace(old, stub, 1))
          PY
          node --check fresh-rebuild/src/nova-drive-flagship-preview-runtime.js
          cat > .github/qa/nova-drive-flagship-preview.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#000;font-size:18px;font-weight:850}.status small{font-size:12px;letter-spacing:.12em;color:#dbe8f3}.apphost{position:relative;width:100%;height:1294px;overflow:hidden;background:#01050a}.nxdr3,[data-nx-approved]{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.legacy,.approved-stubs{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}.osnav{height:46px;background:#000;display:flex;align-items:center;justify-content:space-around;color:#7d8995;font-size:26px}.proof{position:absolute;z-index:250;right:12px;top:8px;padding:4px 7px;border:1px solid rgba(71,218,255,.3);border-radius:999px;background:rgba(0,8,14,.75);color:#68dcff;font-size:8px;font-weight:900;letter-spacing:.08em;pointer-events:none}
          </style></head><body><div class="status"><span>1:59 PM</span><small>◉ 4G ▮▮ 48%</small></div><div class="apphost"><div class="nxdr3"><div class="legacy"><span data-dr-value>0 km/h</span><span data-dr-distance>0.00 km</span><span data-dr-average>0 km/h</span><span data-dr-top>0 km/h</span><span data-dr-duration>35:00</span><span data-dr-heading>NW 313°</span><span data-dr-cloud>LOCAL</span><span data-dr-activity>STILL</span><span data-dr-confidence>97% confidence • walking/running ignored</span><span data-dr-status>ARMED</span><span data-dr-accuracy>GPS ±2m</span><span data-dr-today>0.00 km</span><span data-dr-today-trips>0 trips</span><span data-dr-week>0.00 km</span><span data-dr-month>0.00 km</span><span data-dr-count>1 trip</span></div><div data-nx-approved><div class="approved-stubs"><button data-approved-drive-hit></button><button data-approved-vehicle-hit></button><button data-approved-premium-hit></button><button data-approved-recover></button><button data-approved-domain></button><button data-approved-hub-back></button><button data-tracker-pair></button><button data-tracker-map></button><button data-tracker-security></button><div data-tracker-paired class="is-visible"></div><div data-approved-value data-tracker-status>TRACKER LIVE</div><div data-approved-value data-tracker-speed>2 km/h</div><div data-approved-value data-tracker-battery>96%</div><div data-approved-value data-tracker-power>BATTERY</div><div data-approved-value data-tracker-heading>E 101°</div><div data-approved-value data-tracker-seen>Now</div><div data-approved-value data-tracker-gps>±4m</div><div data-nx-drive-recover-feedback></div></div></div></div><div class="proof">COMMITTED CODE RENDER</div></div><div class="osnav"><span>□</span><span>○</span><span>◁</span></div><script type="module">
          import '../../fresh-rebuild/src/nova-drive-flagship-preview-runtime.js';
          import '../../fresh-rebuild/src/nova-drive-flagship-polish-v2.js';
          import '../../fresh-rebuild/src/nova-drive-flagship-clean-v3.js';
          import '../../fresh-rebuild/src/nova-drive-flagship-preserve-v5.js';
          const wanted=new URLSearchParams(location.search).get('screen')||'dashboard';
          setTimeout(()=>{if(wanted==='history')document.querySelector('[data-nxfs-screen-btn="history"]')?.click();if(wanted==='tracking')document.querySelector('[data-nxfs-nav="tracking"]')?.click();},350);
          </script></body></html>
          HTML

      - name: Render exact phone previews in bounded Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nx-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for screen in dashboard history tracking; do
            set +e
            timeout 20s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=674,1386 --virtual-time-budget=1200 --screenshot="preview/${screen}.png" "http://127.0.0.1:8765/.github/qa/nova-drive-flagship-preview.html?screen=${screen}"
            code=$?
            set -e
            test -s "preview/${screen}.png" || { echo "${screen} screenshot missing, chrome=${code}"; cat /tmp/nx-preview-server.log; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          for name in ('dashboard','history','tracking'):
              p=Path(f'preview/{name}.png')
              if p.stat().st_size < 10000:
                  raise SystemExit(f'{name} preview suspiciously small: {p.stat().st_size}')
          Path('preview/PROOF.txt').write_text('Rendered from committed Nova Drive flagship v1 + polish v2 + clean v3 + approved-art preserve v5 at 674x1386 per screen. Live services are stubbed only for deterministic preview data. No AI-generated visual layer is imported.\n')
          PY

      - name: Upload real preview
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Drive-Flagship-REAL-PREVIEW
          path: preview/
          if-no-files-found: error
          retention-days: 7
