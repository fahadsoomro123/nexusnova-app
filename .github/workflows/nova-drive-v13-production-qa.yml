name: Nova Drive V13 Production QA

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/src/nova-vehicle-premium-ui.js'
      - 'fresh-rebuild/src/nova-drive-realworld-v13-*.js'
      - '.github/workflows/nova-drive-v13-production-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and production wiring gates
        run: |
          set -euo pipefail
          for f in \
            fresh-rebuild/src/nova-drive-realworld-v13-style-a.js \
            fresh-rebuild/src/nova-drive-realworld-v13-style-b.js \
            fresh-rebuild/src/nova-drive-realworld-v13-cockpit.js \
            fresh-rebuild/src/nova-drive-realworld-v13-map.js \
            fresh-rebuild/src/nova-drive-realworld-candidate-v13.js \
            fresh-rebuild/src/nova-drive-realworld-v13-production.js; do
            node --check "$f"
          done
          grep -Fq "nova-drive-realworld-v13-production.js" fresh-rebuild/src/nova-vehicle-premium-ui.js
          grep -Fq "setNovaVehiclePaused" fresh-rebuild/src/nova-drive-realworld-v13-production.js
          grep -Fq "hydrateDriveTrackState" fresh-rebuild/src/nova-drive-realworld-v13-production.js
          grep -Fq "height:100dvh" fresh-rebuild/src/nova-drive-realworld-v13-production.js
          grep -Fq "overflow:hidden" fresh-rebuild/src/nova-drive-realworld-v13-production.js
          if grep -Eq "nova-drive-flagship-(shell-v1|polish-v2|clean-v3|preserve-v5)" fresh-rebuild/src/nova-vehicle-premium-ui.js; then
            echo 'Rejected legacy visual layer is still active in loader' >&2
            exit 1
          fi
      - name: Build deterministic interaction harness
        run: |
          set -euo pipefail
          mkdir -p .github/qa
          cat > .github/qa/drive-v13-production-qa.html <<'HTML'
          <!doctype html>
          <html data-nx-realworld-preview="1">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style>
          </head>
          <body>
            <script src="../../fresh-rebuild/src/nova-drive-realworld-v13-style-a.js"></script>
            <script src="../../fresh-rebuild/src/nova-drive-realworld-v13-style-b.js"></script>
            <script src="../../fresh-rebuild/src/nova-drive-realworld-v13-cockpit.js"></script>
            <script src="../../fresh-rebuild/src/nova-drive-realworld-v13-map.js"></script>
            <script src="../../fresh-rebuild/src/nova-drive-realworld-candidate-v13.js"></script>
            <script>
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const fail=m=>{document.body.dataset.qa='FAIL';document.body.dataset.reason=m;throw new Error(m)};
            const active=()=>document.querySelector('#nxrw13 .screen.on')?.dataset.screen;
            const assert=(v,m)=>{if(!v)fail(m)};
            async function run(){
              await sleep(180);
              const api=window.NexusNovaRealWorldCandidateV13;
              assert(api,'candidate API missing');
              api.show('dashboard'); await sleep(40);
              const root=document.getElementById('nxrw13');
              assert(root,'root missing');
              assert(root.scrollHeight<=root.clientHeight+1,'root vertical scrolling detected');
              assert(root.scrollWidth<=root.clientWidth+1,'root horizontal scrolling detected');
              assert(document.scrollingElement.scrollHeight<=innerHeight+1,'document vertical scrolling detected');
              assert(document.scrollingElement.scrollWidth<=innerWidth+1,'document horizontal scrolling detected');

              const jumps=[['Today','Today'],['Week','Week'],['Month','Month'],['All','All']];
              for(const [jump,filter] of jumps){
                api.show('dashboard'); await sleep(15);
                root.querySelector(`[data-jump-filter="${jump}"]`).click(); await sleep(20);
                assert(active()==='history',`summary ${jump} did not open History`);
                const on=root.querySelector('.filterStrip button.on');
                assert(on?.dataset.filter===filter,`summary ${jump} selected ${on?.dataset.filter||'none'}`);
              }

              api.show('history'); await sleep(15);
              for(const filter of ['Today','Week','Month','All']){
                root.querySelector(`.filterStrip [data-filter="${filter}"]`).click(); await sleep(10);
                const selected=[...root.querySelectorAll('.filterStrip button.on')];
                assert(selected.length===1 && selected[0].dataset.filter===filter,`filter ${filter} not single-active`);
              }

              api.show('tracking'); await sleep(15);
              const toggle=root.querySelector('[data-toggle-track]');
              const before=toggle.textContent;
              toggle.click(); await sleep(10);
              assert(toggle.textContent!==before,'tracker pause/resume control did not change state');

              const navChecks=[['dashboard','dashboard'],['history','history'],['tracking','tracking']];
              for(const [nav,expected] of navChecks){
                root.querySelector(`.screen.on [data-nav="${nav}"]`)?.click(); await sleep(15);
                assert(active()===expected,`bottom/top nav ${nav} failed`);
              }

              api.show('tracking'); await sleep(15);
              root.querySelector('.screen.on .topTabs [data-nav="dashboard"]').click(); await sleep(15);
              assert(active()==='dashboard','top Dashboard failed');
              root.querySelector('.screen.on .topTabs [data-nav="history"]').click(); await sleep(15);
              assert(active()==='history','top Drive History failed');

              for(const screen of ['dashboard','history','tracking']){
                api.show(screen); await sleep(10);
                const dead=[...root.querySelectorAll('.screen.on button')].filter(b=>!b.matches('[data-nav],[data-filter],[data-jump-filter],[data-toggle-track]'));
                assert(dead.length===0,`${screen} has ${dead.length} unbound visible buttons`);
              }
              document.body.dataset.qa='PASS';
            }
            run().catch(e=>{document.body.dataset.reason=document.body.dataset.reason||String(e.message||e)});
            </script>
          </body>
          </html>
          HTML
      - name: Fullscreen and click sweep at phone sizes
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/nxv13qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for size in 360,740 674,1386 1080,2200; do
            out="/tmp/nxv13-${size//,/-}.html"
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --window-size="$size" --virtual-time-budget=1800 --dump-dom \
              http://127.0.0.1:8771/.github/qa/drive-v13-production-qa.html > "$out"
            grep -Fq 'data-qa="PASS"' "$out" || { cat "$out"; exit 1; }
          done
          echo 'Drive v13 FULLSCREEN + ALL VISIBLE BUTTONS functional QA PASS'
