name: Nova Mining Rewards Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [nova-mining-rewards-cloudflare-v1, nova-sol57-pro-v128]
    paths:
      - 'cloudflare/nova-mining-rewards-worker/**'
      - 'fresh-rebuild/src/core/nova-mining-rewards-store.js'
      - 'fresh-rebuild/src/features/apps/core-apps.js'
      - 'fresh-rebuild/src/features/apps/nova-vault-safe.js'
      - 'fresh-rebuild/src/features/apps/mining-integrations.js'
      - '.github/workflows/nova-mining-rewards-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: nova-mining-rewards-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_DIR: cloudflare/nova-mining-rewards-worker
  D1_NAME: nexusnova-mining-rewards
  API_HOST: nova-mining-rewards.fahadsoomro123.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate migration boundary and Worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check "$WORKER_DIR/src/index.js"
          node --check fresh-rebuild/src/core/nova-mining-rewards-store.js
          test -s "$WORKER_DIR/schema.sql"
          grep -Fq '/v1/tasks/daily/claim' "$WORKER_DIR/src/index.js"
          grep -Fq '/v1/vault/boosted/open' "$WORKER_DIR/src/index.js"
          grep -Fq '/v1/boost/time-warp' "$WORKER_DIR/src/index.js"
          grep -Fq '/v1/rewards/admob-ssv' "$WORKER_DIR/src/index.js"
          grep -Fq 'nova-mining-rewards.fahadsoomro123.workers.dev' fresh-rebuild/src/core/nova-mining-rewards-store.js
          test -s fresh-rebuild/src/features/mine/mine-screen.js
          echo 'Mine core source: untouched by Cloudflare deploy workflow'

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'A Firebase service-account JSON secret is required so Cloudflare can preserve the existing unified NVX account state without Firebase Functions.'; exit 3; }
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
          assert data.get('client_email'), 'service account client_email missing'
          assert 'BEGIN PRIVATE KEY' in data.get('private_key',''), 'service account private_key missing'
          assert data.get('project_id') == 'nexusnova-6ade2', 'unexpected Firebase project'
          print('Cloudflare Firestore compatibility credential: PRESENT')
          PY

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Resolve or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > /tmp/nmr-d1.json
          DB_ID="$(python3 - <<'PY'
          import json, os
          items=json.load(open('/tmp/nmr-d1.json', encoding='utf-8'))
          for item in items if isinstance(items,list) else []:
              if str(item.get('name','')) == os.environ['D1_NAME']:
                  print(item.get('uuid') or item.get('id') or item.get('database_id') or '')
                  break
          PY
          )"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create "$D1_NAME"
            wrangler d1 list --json > /tmp/nmr-d1.json
            DB_ID="$(python3 - <<'PY'
          import json, os
          items=json.load(open('/tmp/nmr-d1.json', encoding='utf-8'))
          for item in items if isinstance(items,list) else []:
              if str(item.get('name','')) == os.environ['D1_NAME']:
                  print(item.get('uuid') or item.get('id') or item.get('database_id') or '')
                  break
          PY
            )"
          fi
          test -n "$DB_ID" || { echo 'Could not resolve mining rewards D1 database ID'; exit 4; }
          echo "NMR_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Build production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_WEB_API_KEY="$(python3 - <<'PY'
          import re
          text=open('fresh-rebuild/src/core/firebase-backend.js', encoding='utf-8').read()
          m=re.search(r"apiKey:\s*['\"]([^'\"]+)['\"]", text)
          if not m: raise SystemExit('Firebase web API key not found')
          print(m.group(1))
          PY
          )"
          export FIREBASE_WEB_API_KEY
          python3 - <<'PY'
          import os
          from pathlib import Path
          def q(v): return '"'+str(v).replace('\\','\\\\').replace('"','\\"').replace('\n','')+'"'
          p=Path(os.environ['WORKER_DIR'])/'wrangler.toml'
          p.write_text('\n'.join([
            'name = "nova-mining-rewards"',
            'main = "src/index.js"',
            'compatibility_date = "2026-09-01"',
            'workers_dev = true',
            '',
            '[[d1_databases]]',
            'binding = "NOVA_MINING_REWARDS_DB"',
            f'database_name = {q(os.environ["D1_NAME"])}',
            f'database_id = {q(os.environ["NMR_D1_DATABASE_ID"])}',
            '',
            '[vars]',
            'FIREBASE_PROJECT_ID = "nexusnova-6ade2"',
            f'FIREBASE_WEB_API_KEY = {q(os.environ["FIREBASE_WEB_API_KEY"])}',
            ''
          ]), encoding='utf-8')
          PY

      - name: Install runtime service account secret
        shell: bash
        working-directory: cloudflare/nova-mining-rewards-worker
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config=wrangler.toml

      - name: Apply D1 schema
        shell: bash
        working-directory: cloudflare/nova-mining-rewards-worker
        run: wrangler d1 execute "$D1_NAME" --remote --file=schema.sql --config=wrangler.toml --yes

      - name: Deploy Worker
        shell: bash
        working-directory: cloudflare/nova-mining-rewards-worker
        run: wrangler deploy --config=wrangler.toml

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 12 "https://$API_HOST/health?attempt=$attempt" -o /tmp/nmr-health.json; then
              python3 - <<'PY'
          import json
          data=json.load(open('/tmp/nmr-health.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('service') == 'nova-mining-rewards', data
          assert data.get('execution') == 'cloudflare-worker', data
          assert data.get('serviceAccountReady') is True, data
          print('Nova Mining Rewards Cloudflare health: PASS')
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'Mining rewards Worker health check failed' >&2
          exit 1

      - name: Print AdMob SSV cutover endpoint
        run: echo 'AdMob rewarded SSV URL => https://nova-mining-rewards.fahadsoomro123.workers.dev/v1/rewards/admob-ssv'
