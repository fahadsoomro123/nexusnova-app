name: NOVA 5.7 Sol Download Build

on:
  push:
    branches:
      - main
    paths:
      - 'NOVA-PC/**'
      - 'scripts/build-nova-sol57-android.py'
      - '.github/workflows/nova-sol57-download-build.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NOVA_RELEASE_VERSION: '1.1.0'
  NOVA_RELEASE_CODE: '110'

jobs:
  android-signed-apk:
    name: Android signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate NOVA JavaScript
        shell: bash
        run: |
          node --check js/nexusnova-ai-sol57-v1.js
          node --check js/nexusnova-ai-sol57-interface-v1.js
          node --check js/nexusnova-ai-sol57-live-voice-v1.js
          node --check js/nexusnova-ai-sol57-final-v1.js

      - name: Restore permanent NexusNova signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Prepare NOVA signed Android source
        shell: bash
        run: python3 scripts/build-nova-sol57-android.py

      - name: Build signed Android release
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt
          grep -Eq 'Verified using v(2|3) scheme.*true' signature.txt
          mkdir -p release-android
          cp "$APK" "release-android/NexusNova-NOVA-5.7-Sol-v1.1.0-SIGNED.apk"
          sha256sum "release-android/NexusNova-NOVA-5.7-Sol-v1.1.0-SIGNED.apk" > release-android/SHA256.txt
          cp signature.txt release-android/signature.txt
          printf 'NOVA 5.7 Sol Android\nSource: %s\nVersion: 1.1.0 (110)\nSignature: VERIFIED\n' "$GITHUB_SHA" > release-android/BUILD-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNova-NOVA-5.7-Sol-Android-SIGNED
          path: release-android/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"

  windows-desktop:
    name: Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare app icon
        shell: pwsh
        run: Copy-Item 'icons/icon-512.png' 'NOVA-PC/icon.png' -Force

      - name: Install build dependencies
        working-directory: NOVA-PC
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate desktop code
        working-directory: NOVA-PC
        shell: pwsh
        run: node --check main.js

      - name: Build Windows installer and portable app
        working-directory: NOVA-PC
        shell: pwsh
        run: npm run dist

      - name: Collect Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item 'NOVA-PC/dist/*.exe' release-windows/ -Force
          Get-ChildItem 'release-windows/*.exe' | ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content release-windows/SHA256.txt }
          'NOVA 5.7 Sol Windows - local Ollama bridge enabled - unsigned Windows installer' | Set-Content release-windows/BUILD-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-5.7-Sol-Windows
          path: release-windows/
          if-no-files-found: error
          retention-days: 14
