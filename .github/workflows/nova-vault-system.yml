name: NexusNova Nova Vault System

on:
  push:
    branches:
      - main
    paths:
      - 'js/rewards-security-v1.js'
      - 'js/nexusnova-nova-vault-v1.js'
      - 'functions/index.js'
      - '.github/scripts/apply_nova_engagement_v2.py'
      - '.github/scripts/nova-vault-readiness.py'
      - '.github/scripts/nova-vault-rules-smoke.mjs'
      - '.github/scripts/mining-boost-rules-smoke.mjs'
      - '.github/scripts/mining-boost-security-readiness.py'
      - '.github/workflows/nova-vault-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply engagement v2
        run: python3 .github/scripts/apply_nova_engagement_v2.py

      - name: Validate security and feature contracts
        run: |
          python3 .github/scripts/mining-boost-security-readiness.py
          python3 .github/scripts/nova-vault-readiness.py
          python3 .github/scripts/firebase-security-readiness.py
          git diff --check

      - name: Check JavaScript and Python syntax
        run: |
          node --check js/rewards-security-v1.js
          node --check js/nexusnova-nova-vault-v1.js
          node --check js/nexusnova-admob-nexus-pass-v1.js
          node --check functions/index.js
          node --check .github/scripts/nova-vault-rules-smoke.mjs
          node --check .github/scripts/mining-boost-rules-smoke.mjs
          python3 -m py_compile .github/scripts/apply_nova_engagement_v2.py
          python3 -m py_compile NexusNovaAndroid/patch_admob.py
          python3 -m py_compile NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focused Firestore test packages
        run: npm install --no-save firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.1

      - name: Run Nova Vault and Mining Boost Firestore attack tests
        run: npx firebase emulators:exec --only firestore --project demo-nexusnova-nova-vault "node .github/scripts/nova-vault-rules-smoke.mjs && node .github/scripts/mining-boost-rules-smoke.mjs"

      - name: Commit tested engagement v2
        run: |
          git add \
            functions/index.js \
            js/rewards-security-v1.js \
            js/nexusnova-nova-vault-v1.js \
            .github/scripts/nova-vault-readiness.py
          if git diff --cached --quiet; then
            echo 'Engagement v2 already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Start mining before ads and gift Vaults on boosts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
