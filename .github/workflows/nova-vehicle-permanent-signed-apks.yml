name: Nova Vehicle Permanent Signed APKs

on:
  workflow_dispatch:
  push:
    branches: [nova-vehicle-premium-v1]
    paths:
      - '.github/workflows/nova-vehicle-permanent-signed-apks.yml'

permissions:
  contents: read

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
  NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks
  RELEASE_VERSION_CODE: '20260902'
  RELEASE_VERSION_NAME: '1.0.6'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"

      - name: Restore permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          test -s "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Inject permanent signing and update versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          code = int(os.environ['RELEASE_VERSION_CODE'])
          name = os.environ['RELEASE_VERSION_NAME']
          files = [
              Path('NexusNovaAndroid/app/build.gradle.kts'),
              Path('NexusNovaAndroid/tracker/build.gradle.kts'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', text, count=1)
              text, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', f'versionName = "{name}"', text, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'Could not patch version in {path}')

              signing_block = '''    signingConfigs {
                  create("nexusRelease") {
                      storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
                      storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
                      keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
                      keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
                  }
              }

              '''
              anchor = '    buildTypes {\n'
              if 'create("nexusRelease")' not in text:
                  if anchor not in text:
                      raise SystemExit(f'buildTypes anchor missing in {path}')
                  text = text.replace(anchor, signing_block + anchor, 1)

              release_anchor = '        release {\n'
              signing_line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
              if signing_line not in text:
                  if release_anchor not in text:
                      raise SystemExit(f'release block missing in {path}')
                  text = text.replace(release_anchor, release_anchor + signing_line, 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Build signed NexusNova and Tracker release APKs
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean :app:assembleRelease :tracker:assembleRelease

      - name: Verify signatures and package versions
        shell: bash
        run: |
          set -euo pipefail
          APP="NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          TRACKER="NexusNovaAndroid/tracker/build/outputs/apk/release/tracker-release.apk"
          test -s "$APP"
          test -s "$TRACKER"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APP" > app-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$TRACKER" > tracker-signature.txt
          "$AAPT" dump badging "$APP" | tee app-badging.txt
          "$AAPT" dump badging "$TRACKER" | tee tracker-badging.txt
          grep -Fq "versionCode='20260902'" app-badging.txt
          grep -Fq "versionCode='20260902'" tracker-badging.txt

      - name: Prepare named APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-apks
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk signed-apks/NexusNova-1.0.6-vc20260902-PERMANENT-SIGNED.apk
          cp NexusNovaAndroid/tracker/build/outputs/apk/release/tracker-release.apk signed-apks/NexusNova-Tracker-1.0.6-vc20260902-SIGNED.apk
          sha256sum signed-apks/*.apk > signed-apks/SHA256.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-permanent-signed-1.0.6-vc20260902
          retention-days: 14
          if-no-files-found: error
          path: signed-apks/

      - name: Secure cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
