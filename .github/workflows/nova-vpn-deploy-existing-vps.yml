name: Deploy Nova VPN to existing VPS

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'VPS DNS name, e.g. node-1.vpn.nexusnovatools.com'
        required: true
        type: string
      ssh_user:
        description: 'SSH user'
        required: true
        default: 'ubuntu'
        type: string
      node_id:
        description: 'Nova VPN node id, e.g. node-1'
        required: true
        type: string
      city:
        description: 'Server city'
        required: true
        type: string
      country:
        description: 'Server country'
        required: true
        type: string
      capacity_mbps:
        description: 'Verified/contracted node capacity metadata; benchmark before publishing'
        required: true
        default: '1000'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical VPN source
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          SSH_USER: ${{ inputs.ssh_user }}
          NODE_ID: ${{ inputs.node_id }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          CAPACITY: ${{ inputs.capacity_mbps }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]{4,253}$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$NODE_ID" =~ ^[a-z0-9][a-z0-9-]{1,63}$ ]]
          [[ "$CITY" =~ ^[A-Za-z0-9 ._-]{1,80}$ ]]
          [[ "$COUNTRY" =~ ^[A-Za-z0-9 ._-]{2,80}$ ]]
          [[ "$CAPACITY" =~ ^[0-9]{3,6}$ ]]
          (( CAPACITY >= 100 && CAPACITY <= 100000 ))
          test -f vpn-infra/node/bootstrap.sh
          test -f vpn-infra/node/nova-vpn-node.py
          test -n '${{ secrets.NOVA_VPN_SSH_PRIVATE_KEY }}'
          test -n '${{ secrets.NOVA_FIREBASE_WEB_API_KEY }}'
          test -n '${{ secrets.NOVA_VPN_TLS_EMAIL }}'

      - name: Prepare SSH trust and key
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          SSH_KEY: ${{ secrets.NOVA_VPN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/nova_vpn_deploy
          chmod 600 ~/.ssh/nova_vpn_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload canonical Nova VPN node software
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          SSH_USER: ${{ inputs.ssh_user }}
        run: |
          set -euo pipefail
          tar -C vpn-infra/node -czf /tmp/nova-vpn-node.tgz bootstrap.sh nova-vpn-node.py
          scp -i ~/.ssh/nova_vpn_deploy /tmp/nova-vpn-node.tgz "$SSH_USER@$HOST:/tmp/nova-vpn-node.tgz"

      - name: Bootstrap production WireGuard node
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          SSH_USER: ${{ inputs.ssh_user }}
          NODE_ID: ${{ inputs.node_id }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          CAPACITY: ${{ inputs.capacity_mbps }}
          FIREBASE_API_KEY: ${{ secrets.NOVA_FIREBASE_WEB_API_KEY }}
          TLS_EMAIL: ${{ secrets.NOVA_VPN_TLS_EMAIL }}
        run: |
          set -euo pipefail
          node_b64="$(printf '%s' "$NODE_ID" | base64 -w0)"
          host_b64="$(printf '%s' "$HOST" | base64 -w0)"
          city_b64="$(printf '%s' "$CITY" | base64 -w0)"
          country_b64="$(printf '%s' "$COUNTRY" | base64 -w0)"
          capacity_b64="$(printf '%s' "$CAPACITY" | base64 -w0)"
          api_b64="$(printf '%s' "$FIREBASE_API_KEY" | base64 -w0)"
          email_b64="$(printf '%s' "$TLS_EMAIL" | base64 -w0)"
          ssh -i ~/.ssh/nova_vpn_deploy "$SSH_USER@$HOST" \
            "NODE_B64='$node_b64' HOST_B64='$host_b64' CITY_B64='$city_b64' COUNTRY_B64='$country_b64' CAPACITY_B64='$capacity_b64' API_B64='$api_b64' EMAIL_B64='$email_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          work=/tmp/nova-vpn-deploy
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf /tmp/nova-vpn-node.tgz -C "$work"
          cd "$work"
          export NOVA_VPN_NODE_ID="$(printf '%s' "$NODE_B64" | base64 -d)"
          export NOVA_VPN_PUBLIC_HOST="$(printf '%s' "$HOST_B64" | base64 -d)"
          export NOVA_VPN_CITY="$(printf '%s' "$CITY_B64" | base64 -d)"
          export NOVA_VPN_COUNTRY="$(printf '%s' "$COUNTRY_B64" | base64 -d)"
          export NOVA_VPN_CAPACITY_MBPS="$(printf '%s' "$CAPACITY_B64" | base64 -d)"
          export NOVA_FIREBASE_WEB_API_KEY="$(printf '%s' "$API_B64" | base64 -d)"
          export NOVA_VPN_TLS_EMAIL="$(printf '%s' "$EMAIL_B64" | base64 -d)"
          sudo -E bash ./bootstrap.sh
          rm -rf "$work" /tmp/nova-vpn-node.tgz
          REMOTE

      - name: Verify node health
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          NODE_ID: ${{ inputs.node_id }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body="$(curl --fail --silent --show-error --max-time 8 "https://$HOST/health" || true)"
            if [[ -n "$body" ]] && python3 - "$NODE_ID" "$body" <<'PY'
          import json, sys
          expected, raw = sys.argv[1], sys.argv[2]
          data = json.loads(raw)
          if data.get('ok') is not True or data.get('nodeId') != expected or data.get('protocol') != 'wireguard':
              raise SystemExit(1)
          print('Nova VPN node health verified:', data.get('nodeId'), 'load', data.get('loadPercent'), 'capacityMbps', data.get('capacityMbps'))
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo 'Nova VPN node health verification failed' >&2
          exit 1

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/nova_vpn_deploy /tmp/nova-vpn-node.tgz
