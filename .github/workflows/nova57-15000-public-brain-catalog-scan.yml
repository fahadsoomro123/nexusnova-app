name: NOVA 5.7 15K Public Brain Catalog Scan

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-15000-public-brain-catalog-scan.mjs'
      - '.github/workflows/nova57-15000-public-brain-catalog-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/nova57-15000-public-brain-catalog-scan.mjs
      - name: Scan 15000 public AI model records
        run: node scripts/nova57-15000-public-brain-catalog-scan.mjs
      - name: Print compact summary
        if: always()
        run: cat nova57-15000-public-brain-catalog-summary.json || true
