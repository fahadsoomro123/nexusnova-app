name: NOVA 5.7 200K Brain Registry CI

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'functions/novaBrainRegistry.js'
      - 'functions/novaBrainProfiler.js'
      - 'functions/novaAtomicChain.js'
      - 'functions/main.js'
      - '.github/workflows/nova57-200k-registry-ci.yml'
  workflow_dispatch:

jobs:
  registry-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check functions/novaBrainRegistry.js
          node --check functions/novaBrainProfiler.js
          node --check functions/novaAtomicChain.js
          node --check functions/main.js
      - name: Sharded registry architecture checks
        run: |
          set -euo pipefail
          grep -Fq 'const MAX_REGISTRY = 200000' functions/novaBrainRegistry.js
          grep -Fq "const CATALOG_SHARDS = 'novaBrainCatalogShards'" functions/novaBrainRegistry.js
          grep -Fq "schedule: 'every 60 minutes'" functions/novaBrainRegistry.js
          grep -Fq "storageMode: 'sharded-catalog-v2'" functions/novaBrainRegistry.js
          grep -Fq 'writeHuggingFaceShard' functions/novaBrainRegistry.js
          grep -Fq 'fingerprintRecords' functions/novaBrainRegistry.js
          grep -Fq 'upsertActiveCatalog' functions/novaBrainRegistry.js
          grep -Fq 'novaBrainDiscoveryRefresh' functions/novaBrainRegistry.js
          grep -Fq 'novaBrainRegistryStatus' functions/novaBrainRegistry.js
          grep -Fq 'novaSelectBrains' functions/novaBrainRegistry.js
          grep -Fq 'ingestHuggingFaceIncremental' functions/novaBrainRegistry.js
          grep -Fq 'ingestOpenRouter' functions/novaBrainRegistry.js
          grep -Fq 'ingestHorde' functions/novaBrainRegistry.js
          grep -Fq 'ingestPollinations' functions/novaBrainRegistry.js
          grep -Fq 'require("./novaBrainRegistry")' functions/main.js
      - name: Protect learned health from catalog refresh
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('functions/novaBrainRegistry.js').read_text(encoding='utf-8')
          start = s.index('function normalizeCatalogRecord')
          end = s.index('function fingerprintRecords')
          block = s[start:end]
          forbidden = ['healthScore:', 'latencyEwmaMs:', 'successes:', 'failures:']
          bad = [x for x in forbidden if x in block]
          if bad:
              raise SystemExit(f'Catalog metadata must not reset learned health: {bad}')
          print('Catalog metadata is isolated from learned health counters.')
          PY
      - name: Cost-safe profiler and leaderboard checks
        run: |
          set -euo pipefail
          grep -Fq 'const PROBE_LIMIT = 8' functions/novaBrainProfiler.js
          grep -Fq "schedule: 'every 2 hours'" functions/novaBrainProfiler.js
          grep -Fq 'discoverPublicInferenceRoutes' functions/novaBrainProfiler.js
          grep -Fq 'rebuildLeaderboards' functions/novaBrainProfiler.js
          grep -Fq "provider: 'Kilo'" functions/novaBrainProfiler.js
          grep -Fq "provider: 'OVHcloud'" functions/novaBrainProfiler.js
          grep -Fq "probeEligible: true" functions/novaBrainProfiler.js
          grep -Fq "content: 'Reply exactly with NOVA_OK and nothing else.'" functions/novaBrainProfiler.js
          grep -Fq 'novaBrainProfilerRefresh' functions/novaBrainProfiler.js
          grep -Fq 'novaBrainProfilerStatus' functions/novaBrainProfiler.js
          grep -Fq 'require("./novaBrainProfiler")' functions/main.js
      - name: Confirm no raw user prompt persistence in profiler
        run: |
          set -euo pipefail
          if grep -Eq "\.set\([^\n]*(prompt|messages)|prompt\s*:|userPrompt|rawPrompt" functions/novaBrainProfiler.js; then
            echo 'Profiler must never persist user prompts.' >&2
            exit 1
          fi
      - name: Confirm protected mining/reward files untouched in this commit
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r HEAD | tee /tmp/changed.txt
          if grep -Eq '^functions/(index.js|novaVault10x.js|admobRewardedSsv.*\.js)$' /tmp/changed.txt; then
            echo 'Protected mining/reward file changed unexpectedly.' >&2
            exit 1
          fi
      - name: Keep registry CI storage-free
        run: |
          set -euo pipefail
          if grep -Eq 'uses:[[:space:]]*actions/(upload-artifact|cache)@' .github/workflows/nova57-200k-registry-ci.yml; then
            echo 'Registry CI must not upload artifacts or caches.' >&2
            exit 1
          fi
