name: NOVA 5.7 One-Time App Check Feedback Hardening

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-appcheck-feedback-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: nova57-cloudflare-appcheck-hardening
  cancel-in-progress: false

jobs:
  harden-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: nexusnova-brain-router
      DB_NAME: nexusnova-brain-registry
      CF_DIR: cloudflare/nova-brain-worker
    steps:
      - name: Checkout approved NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Patch App Check protected feedback path
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/nova57-appcheck-hardening.py
          node --check "$CF_DIR/src/index.js"
          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "APP_CHECK_JWKS_URL = 'https://firebaseappcheck.googleapis.com/v1/jwks'" "$CF_DIR/src/index.js"
          grep -Fq "request.headers.get('x-firebase-appcheck')" "$CF_DIR/src/index.js"
          grep -Fq "throw new Error('unknown-route')" "$CF_DIR/src/index.js"
          grep -Fq "requireFreshAppCheck" fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "'X-Firebase-AppCheck': appCheckToken" fresh-rebuild/src/nova57-atomic-backend-client.js
          if git diff --name-only | grep -Ei '(^|/)(mining|mine|rewards?|wallet|nvx)(/|\.|-|_)'; then
            echo 'Protected mining/reward/wallet/NVX path changed.' >&2
            exit 1
          fi

      - name: Install Wrangler and resolve existing D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --global wrangler@4 --no-audit --no-fund
          curl -fsS -G "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=$DB_NAME" > "$RUNNER_TEMP/d1-list.json"
          DB_ID=$(jq -r --arg name "$DB_NAME" '.result[]? | select(.name == $name) | .uuid' "$RUNNER_TEMP/d1-list.json" | head -n1)
          test -n "$DB_ID"
          sed "s/__D1_DATABASE_ID__/$DB_ID/g" "$CF_DIR/wrangler.template.toml" > "$CF_DIR/wrangler.runtime.toml"

      - name: Deploy hardened Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config="$CF_DIR/wrangler.runtime.toml"

      - name: Verify public reads and protected feedback live
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexusnova-brain-router.fahadsoomro123.workers.dev'
          READY=0
          for attempt in $(seq 1 12); do
            HTTP=$(curl -sS -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "$URL/v1/status" || true)
            if [ "$HTTP" = '200' ] && jq -e '.ok == true and .targetCatalog == 200000' "$RUNNER_TEMP/status.json" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = '1'
          curl -fsS "$URL/v1/plan" -X POST -H 'Content-Type: application/json' \
            --data '{"capability":"reasoning"}' > "$RUNNER_TEMP/plan.json"
          jq -e '.source == "cloudflare-d1" and (.candidates | length) >= 2' "$RUNNER_TEMP/plan.json" >/dev/null

          HTTP=$(curl -sS -o "$RUNNER_TEMP/no-token.json" -w '%{http_code}' "$URL/v1/outcome" \
            -X POST -H 'Content-Type: application/json' \
            --data '{"provider":"Kilo","modelId":"openrouter/free","capability":"reasoning","outcome":"success","latencyMs":100,"quality":1}')
          test "$HTTP" = '401'
          jq -e '.error == "app-check-required"' "$RUNNER_TEMP/no-token.json" >/dev/null

          HTTP=$(curl -sS -o "$RUNNER_TEMP/fake-token.json" -w '%{http_code}' "$URL/v1/outcome" \
            -X POST -H 'Content-Type: application/json' -H 'X-Firebase-AppCheck: fake.fake.fake' \
            --data '{"provider":"Kilo","modelId":"openrouter/free","capability":"reasoning","outcome":"success","latencyMs":100,"quality":1}')
          test "$HTTP" = '401'
          jq -e '.error == "app-check-required"' "$RUNNER_TEMP/fake-token.json" >/dev/null
          echo 'Live Cloudflare: public plan healthy; feedback rejects missing/invalid App Check.'

      - name: Benchmark and ARIM integrity after hardening
        shell: bash
        run: |
          set -euo pipefail
          node scripts/nova57-hard-benchmark.mjs
          node scripts/nova57-arim-live-smoke.mjs
          rm -f nova57-hard-benchmark-results.json

      - name: Commit hardened source and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CF_DIR/wrangler.runtime.toml"
          git rm .github/workflows/nova57-appcheck-feedback-hardening-once.yml
          git rm .github/scripts/nova57-appcheck-hardening.py
          git config user.name 'NexusNova Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$CF_DIR/src/index.js" fresh-rebuild/src/nova57-atomic-backend-client.js
          git commit -m 'Protect NOVA route learning with Firebase App Check'
          git push origin HEAD:nova-sol57-pro-v128

      - name: Cleanup runner files
        if: always()
        shell: bash
        run: |
          rm -f "$CF_DIR/wrangler.runtime.toml" "$RUNNER_TEMP"/d1-list.json \
            "$RUNNER_TEMP"/status.json "$RUNNER_TEMP"/plan.json \
            "$RUNNER_TEMP"/no-token.json "$RUNNER_TEMP"/fake-token.json \
            nova57-hard-benchmark-results.json
