name: NOVA 5.7 ARIM Architecture Gate

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'fresh-rebuild/src/nova57-atomic-brain-pool.js'
      - 'fresh-rebuild/src/nova57-atomic-chain.js'
      - 'fresh-rebuild/src/nova57-pro-orchestrator.js'
      - 'fresh-rebuild/src/features/apps/nova-sol57-fresh.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
      - 'functions/novaAtomicChain.js'
      - 'scripts/nova57-hard-benchmark.mjs'
      - '.github/workflows/nova57-arim-ci.yml'

permissions:
  contents: read

jobs:
  arim-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: JavaScript syntax
        run: |
          node --check fresh-rebuild/src/nova57-atomic-brain-pool.js
          node --check fresh-rebuild/src/nova57-atomic-chain.js
          node --check fresh-rebuild/src/nova57-pro-orchestrator.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check functions/novaAtomicChain.js
          node --check scripts/nova57-hard-benchmark.mjs

      - name: Verify adaptive multiplying mesh contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const chain = fs.readFileSync('fresh-rebuild/src/nova57-atomic-chain.js', 'utf8');
          const pool = fs.readFileSync('fresh-rebuild/src/nova57-atomic-brain-pool.js', 'utf8');
          const orchestrator = fs.readFileSync('fresh-rebuild/src/nova57-pro-orchestrator.js', 'utf8');
          const backend = fs.readFileSync('functions/novaAtomicChain.js', 'utf8');
          const requiredChain = [
            'MAX_MESH_BRAINS = 9',
            'widths: [2, 2, 4]',
            "'solver-A2'",
            'critic-B${index + 1}',
            'specialist-C${index + 1}-${specialty}',
            "'judge'",
            'agreementScore',
            'remainingMs()',
            "strategy: 'ARIM'"
          ];
          const requiredPool = [
            'laneWavePlan',
            'waveTimeoutMs',
            'control.lane',
            'hedgeWidth',
            '__novaAtomicBrain',
            '__novaAtomicFailures',
            'reportBackendFailures',
            'backendOutcome',
            'quality: 0'
          ];
          const requiredOrchestrator = [
            'const groundedPrompt = original + evidenceContext(evidence)',
            'const atomic = shouldUseAtomicChain(request)',
            'runAtomicChain({',
            'prompt: groundedPrompt',
            'generate: nextPrompt => hedgeModel.generateContent(nextPrompt)'
          ];
          const requiredBackend = ["strategy: 'ARIM'", 'buildGenerations', 'widths: [2, 2, 4]', 'novaRecordBrainOutcome'];
          const missing = [
            ...requiredChain.filter(x => !chain.includes(x)).map(x => `chain:${x}`),
            ...requiredPool.filter(x => !pool.includes(x)).map(x => `pool:${x}`),
            ...requiredOrchestrator.filter(x => !orchestrator.includes(x)).map(x => `orchestrator:${x}`),
            ...requiredBackend.filter(x => !backend.includes(x)).map(x => `backend:${x}`)
          ];
          if (missing.length) {
            console.error('Missing ARIM contracts:', missing);
            process.exit(1);
          }
          if (pool.includes('function laneSlice(')) {
            console.error('Legacy single-slice lane selector must not return.');
            process.exit(1);
          }
          console.log('ARIM topology, grounded research, multi-wave failover, isolation and learning contracts present.');
          NODE

      - name: Verify live NOVA screen uses ARIM router
        run: |
          node <<'NODE'
          const fs = require('fs');
          const nova = fs.readFileSync('fresh-rebuild/src/features/apps/nova-sol57-fresh.js', 'utf8');
          const screen = fs.readFileSync('fresh-rebuild/src/features/apps/app-screen.js', 'utf8');
          const required = [
            "from '../../nova57-pro-orchestrator.js'",
            'getNovaAI(firebaseApp',
            'new NovaAIBackend()',
            'getNovaModel(ai',
            "const ROUTER_PROFILE = 'NOVA 5.7 Sol / ARIM'"
          ];
          const missing = required.filter(value => !nova.includes(value));
          if (missing.length) throw new Error(`Actual NOVA screen routing missing: ${missing.join(', ')}`);
          if (nova.includes('firebase-ai.js') || nova.includes("PROVIDER_MODEL = 'gemini")) {
            throw new Error('Actual NOVA screen must not bypass ARIM through direct Firebase AI routing.');
          }
          if (!screen.includes('const renderer = novaSol57Renderers[id] ||')) {
            throw new Error('NOVA 5.7 renderer is not first-priority for the AI app screen.');
          }
          console.log('Actual AI app screen resolves to NOVA 5.7 ARIM Pro Orchestrator.');
          NODE

      - name: Verify internal reasoning leak rejection
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('fresh-rebuild/src/nova57-atomic-brain-pool.js', 'utf8');
          const encoded = Buffer.from(source, 'utf8').toString('base64');
          const pool = await import(`data:text/javascript;base64,${encoded}`);
          const cases = [
            ['clean', 'NOVA clean answer.', true],
            ['think', '<think>\nprivate reasoning', false],
            ['analysis', '<analysis>\nprivate reasoning', false],
            ['meta-user', 'The user asks: do something', false],
            ['meta-we', 'We need to respond with an answer.', false],
            ['transport', '{"choices":[{"message":{"content":"hi"}}]}', false]
          ];
          for (const [name, value, expected] of cases) {
            const result = pool.assessAtomicResponseQuality(value);
            if (result.ok !== expected) throw new Error(`${name} quality expectation failed: ${JSON.stringify(result)}`);
          }
          console.log('Internal reasoning/meta/transport leaks are rejected; clean answer passes.');
          NODE

      - name: Verify hard benchmark cannot false-pass live web
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bench = fs.readFileSync('scripts/nova57-hard-benchmark.mjs', 'utf8');
          const required = [
            'const routeWorked = Boolean(state.route?.provider && state.route?.model)',
            'const notFallback = !/',
            'const hasOpenAISource = /(?:platform\\.)?openai\\.com/i.test(value)',
            'const hasCapability = /',
            'passed: toolWorked && routeWorked && notFallback && hasOpenAISource && hasCapability && conciseEnough',
            'globalThis.__NOVA_ATOMIC_CHAIN_LAST__ = null'
          ];
          const missing = required.filter(value => !bench.includes(value));
          if (missing.length) throw new Error(`Hard benchmark verifier regression: ${missing.join(', ')}`);
          const weakPattern = /passed:\s*toolWorked\s*&&\s*value\.length\s*>=\s*35/;
          if (weakPattern.test(bench)) throw new Error('Legacy weak live-web verifier returned.');
          console.log('Live-web benchmark requires a real answer route, non-fallback answer, source/domain, and capability evidence.');
          NODE

      - name: Verify privacy-safe route memory and failure telemetry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pool = fs.readFileSync('fresh-rebuild/src/nova57-atomic-brain-pool.js', 'utf8');
          const chain = fs.readFileSync('fresh-rebuild/src/nova57-atomic-chain.js', 'utf8');
          if (!pool.includes("JSON.stringify({ version: 1, routes: rows })")) throw new Error('Expected route-stat-only memory payload missing.');
          if (/localStorage|sessionStorage|indexedDB/i.test(chain)) throw new Error('Chain module must not persist user prompts.');
          const start = pool.indexOf('function reportBackendFailures');
          const end = pool.indexOf('function markSuccess', start);
          if (start < 0 || end < 0) throw new Error('Failure telemetry function missing.');
          const feedback = pool.slice(start, end);
          if (/prompt|messages|answerText|raw/i.test(feedback)) throw new Error('Failure telemetry must contain route stats only, never prompt/output text.');
          for (const required of ['provider', 'modelId', 'capability', 'outcome', 'latencyMs', 'quality']) {
            if (!feedback.includes(required)) throw new Error(`Failure telemetry field missing: ${required}`);
          }
          console.log('ARIM persists and reports route stats only; prompt/output data is excluded.');
          NODE

      - name: Protected mining reward wallet NVX guard
        run: |
          BASE=$(git rev-parse HEAD~1)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Ei '(^|/)(mining|mine|rewards?|wallet|nvx)(/|\.|-|_)'; then
            echo 'Protected mining/reward/wallet/NVX path changed.' >&2
            exit 1
          fi
          echo 'Protected domains untouched by this change.'

      - name: No artifact or cache storage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const yml = fs.readFileSync('.github/workflows/nova57-arim-ci.yml', 'utf8');
          const forbidden = ['upload', 'artifact'].join('-');
          const cacheAction = ['actions', 'cache'].join('/');
          if (yml.includes(forbidden) || yml.includes(cacheAction)) throw new Error('ARIM CI must remain artifact/cache free.');
          console.log('No artifact/cache upload in ARIM CI.');
          NODE
