name: NOVA 5.7 ARIM Dashboard Mobile Hotfix

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-arim-dashboard-mobile-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Patch truthful numeric rendering and status-first hydration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('fresh-rebuild/src/features/apps/nova57-control-center.js')
          text = path.read_text()

          num_pattern = re.compile(
              r"function num\(value\) \{\s*return Number\.isFinite\(Number\(value\)\) \? Number\(value\) : null;\s*\}"
          )
          num_replacement = """function num(value) {
            if (value === null || value === undefined || value === '') return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }"""

          refresh_pattern = re.compile(
              r"const \[nextStatus, \.\.\.planRows\] = await Promise\.all\(\[\s*"
              r"getAtomicBackendStatus\(\),\s*"
              r"\.\.\.CAPABILITIES\.map\(capability => getAtomicCapabilityPlan\(capability\)\)\s*"
              r"\]\);\s*"
              r"status = nextStatus;\s*"
              r"plans = Object\.fromEntries\(CAPABILITIES\.map\(\(capability, index\) => \[capability, planRows\[index\] \|\| null\]\)\);"
          )
          refresh_replacement = """// Mobile WebViews are more reliable when the authoritative status request
              // gets the Worker connection first. Preserve the last good snapshot if one refresh
              // is transiently unavailable instead of replacing real telemetry with fake zeros.
              const nextStatus = await getAtomicBackendStatus();
              if (nextStatus) status = nextStatus;

              const planRows = await Promise.all(
                CAPABILITIES.map(capability => getAtomicCapabilityPlan(capability))
              );
              plans = Object.fromEntries(CAPABILITIES.map((capability, index) => [capability, planRows[index] || plans[capability] || null]));"""

          text, num_count = num_pattern.subn(num_replacement, text, count=1)
          text, refresh_count = refresh_pattern.subn(refresh_replacement, text, count=1)
          if num_count != 1:
              raise SystemExit(f'Expected one num() block; matched {num_count}.')
          if refresh_count != 1:
              raise SystemExit(f'Expected one concurrent refresh block; matched {refresh_count}.')
          path.write_text(text)
          PY

          node --check fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "value === null || value === undefined || value === ''" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "if (nextStatus) status = nextStatus" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "planRows[index] || plans[capability] || null" fresh-rebuild/src/features/apps/nova57-control-center.js

      - name: Commit verified dashboard hydration fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- fresh-rebuild/src/features/apps/nova57-control-center.js; then
            echo 'Dashboard hotfix already present.'
            exit 0
          fi
          git config user.name 'NexusNova ARIM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/nova57-control-center.js
          git commit -m '[ARIM] Fix mobile dashboard live hydration'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
