name: NOVA 5.7 ARIM Live Distinct-Mesh Smoke

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-arim-live-smoke.mjs'
      - 'fresh-rebuild/src/nova57-atomic-brain-pool.js'
      - 'fresh-rebuild/src/nova57-atomic-chain.js'
      - 'fresh-rebuild/src/nova57-atomic-backend-client.js'
      - 'fresh-rebuild/src/nova57-pro-orchestrator.js'
      - 'scripts/nova57-hard-benchmark.mjs'
      - '.github/workflows/nova57-arim-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: nova57-arim-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: ARIM live distinct-mesh smoke
        run: node scripts/nova57-arim-live-smoke.mjs

      - name: NOVA hard answer benchmark
        run: node scripts/nova57-hard-benchmark.mjs
