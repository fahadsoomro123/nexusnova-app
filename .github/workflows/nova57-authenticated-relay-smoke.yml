name: NOVA 5.7 Authenticated Phone Relay Smoke

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-authenticated-relay-smoke.mjs'
      - 'cloudflare/nova-brain-worker/**'
      - 'fresh-rebuild/src/nova57-atomic-backend-client.js'
      - 'fresh-rebuild/src/nova57-pro-orchestrator.js'
      - '.github/workflows/nova57-authenticated-relay-smoke.yml'

permissions:
  contents: read

concurrency:
  group: nova57-authenticated-phone-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-phone-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify production phone auth and generation chain
        run: node scripts/nova57-authenticated-relay-smoke.mjs
