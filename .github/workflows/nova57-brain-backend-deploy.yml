name: NOVA 5.7 Brain Backend Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_NOVA_BRAIN_BACKEND to deploy only NOVA brain functions
        required: true
        default: 'NO'
      bootstrap_cycles:
        description: Initial bounded registry bootstrap cycles (max 5; 4K HF records per cycle target)
        required: true
        type: choice
        default: '2'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

permissions:
  contents: read

concurrency:
  group: nova57-brain-backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy-brain-backend:
    if: ${{ inputs.confirm == 'DEPLOY_NOVA_BRAIN_BACKEND' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: nexusnova-6ade2
      NOVA_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.NOVA_FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout approved NOVA branch
        uses: actions/checkout@v6

      - name: Verify deployment scope and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128" || {
            echo "Deploy is locked to nova-sol57-pro-v128; got $GITHUB_REF_NAME" >&2
            exit 1
          }
          test "${{ inputs.confirm }}" = "DEPLOY_NOVA_BRAIN_BACKEND"
          test -s firebase.json
          test -s .firebaserc
          test -s functions/main.js
          test -s functions/novaBrainRegistry.js
          test -s functions/novaAtomicChain.js
          test -s functions/novaBrainProfiler.js
          test -s functions/novaBrainBootstrap.cjs

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Syntax and protected-scope preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/novaBrainRegistry.js
          node --check functions/novaAtomicChain.js
          node --check functions/novaBrainProfiler.js
          node --check functions/novaBrainBootstrap.cjs
          grep -Fq 'require("./novaBrainRegistry")' functions/main.js
          grep -Fq 'require("./novaAtomicChain")' functions/main.js
          grep -Fq 'require("./novaBrainProfiler")' functions/main.js
          grep -Fq '"default": "nexusnova-6ade2"' .firebaserc

      - name: Require Firebase production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOVA_FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "Missing repository secret NOVA_FIREBASE_SERVICE_ACCOUNT_JSON." >&2
            exit 1
          }
          CREDENTIAL_FILE="$RUNNER_TEMP/nova-firebase-service-account.json"
          printf '%s' "$NOVA_FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          jq -e --arg project "$FIREBASE_PROJECT_ID" '.type == "service_account" and .project_id == $project and (.client_email | type == "string")' "$CREDENTIAL_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Install Functions dependencies and Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions install --omit=dev --no-audit --no-fund
          npm install --global firebase-tools --no-audit --no-fund
          firebase --version

      - name: Deploy only NOVA brain functions
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --only "functions:novaBrainDiscoveryRefresh,functions:novaBrainRegistryStatus,functions:novaSelectBrains,functions:novaAtomicPlan,functions:novaRecordBrainOutcome,functions:novaAtomicStatus,functions:novaBrainProfilerRefresh,functions:novaBrainProfilerStatus"

      - name: Bootstrap sharded registry and initial leaderboards
        shell: bash
        run: |
          set -euo pipefail
          node functions/novaBrainBootstrap.cjs --cycles=${{ inputs.bootstrap_cycles }}

      - name: Secure credential cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nova-firebase-service-account.json"
