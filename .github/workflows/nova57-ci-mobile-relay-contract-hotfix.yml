name: NOVA 5.7 Relay-Aware ARIM Gate Hotfix

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-ci-mobile-relay-contract-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - name: Patch ARIM gate for mobile relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nova57-ci-mobile-relay-contract.py
          grep -Fq 'generateViaAtomicRelay' .github/workflows/nova57-arim-ci.yml
          grep -Fq 'generateForRuntime' .github/workflows/nova57-arim-ci.yml
      - name: Commit gate update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/nova57-arim-ci.yml
          git commit -m '[CI] Require authenticated Android generation relay'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
