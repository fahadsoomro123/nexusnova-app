name: NOVA 5.7 One-Time Cloudflare Brain Deploy

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-cloudflare-brain-deploy-once.yml'

permissions:
  contents: write

concurrency:
  group: nova57-cloudflare-brain-deploy
  cancel-in-progress: false

jobs:
  deploy-and-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: nexusnova-brain-router
      DB_NAME: nexusnova-brain-registry
      CF_DIR: cloudflare/nova-brain-worker
    steps:
      - name: Checkout approved NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Verify source and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s "$CF_DIR/src/index.js"
          test -s "$CF_DIR/schema.sql"
          test -s "$CF_DIR/wrangler.template.toml"
          test -s fresh-rebuild/src/nova57-atomic-backend-client.js
          node --check "$CF_DIR/src/index.js"
          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          if git diff --name-only HEAD~1 HEAD | grep -Ei '(^|/)(mining|mine|rewards?|wallet|nvx)(/|\.|-|_)'; then
            echo 'Protected mining/reward/wallet/NVX path changed.' >&2
            exit 1
          fi

      - name: Node 22 and Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4 --no-audit --no-fund
          wrangler --version

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/cf-subdomain.json"
          jq -e '.success == true and (.result.subdomain | type == "string")' "$RUNNER_TEMP/cf-subdomain.json" >/dev/null

      - name: Find or create D1 registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -G "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "name=$DB_NAME" > "$RUNNER_TEMP/d1-list.json"
          DB_ID=$(jq -r --arg name "$DB_NAME" '.result[]? | select(.name == $name) | .uuid' "$RUNNER_TEMP/d1-list.json" | head -n1)
          if [ -z "$DB_ID" ]; then
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$DB_NAME\",\"primary_location_hint\":\"apac\"}" > "$RUNNER_TEMP/d1-create.json"
            jq -e '.success == true and (.result.uuid | type == "string")' "$RUNNER_TEMP/d1-create.json" >/dev/null
            DB_ID=$(jq -r '.result.uuid' "$RUNNER_TEMP/d1-create.json")
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          sed "s/__D1_DATABASE_ID__/$DB_ID/g" "$CF_DIR/wrangler.template.toml" > "$CF_DIR/wrangler.runtime.toml"
          grep -Fq "$DB_ID" "$CF_DIR/wrangler.runtime.toml"
          echo "D1 registry ready: $DB_NAME"

      - name: Apply D1 schema
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute "$DB_NAME" --remote --yes \
            --file="$CF_DIR/schema.sql" \
            --config="$CF_DIR/wrangler.runtime.toml"

      - name: Deploy NOVA brain Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config="$CF_DIR/wrangler.runtime.toml"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' > "$RUNNER_TEMP/worker-subdomain-enable.json"
          jq -e '.success == true' "$RUNNER_TEMP/worker-subdomain-enable.json" >/dev/null
          SUBDOMAIN=$(jq -r '.result.subdomain' "$RUNNER_TEMP/cf-subdomain.json")
          WORKER_URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "NOVA Worker URL: $WORKER_URL"

      - name: Set private refresh key
        shell: bash
        run: |
          set -euo pipefail
          REFRESH_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$REFRESH_KEY"
          printf '%s' "$REFRESH_KEY" | wrangler secret put REFRESH_KEY --config="$CF_DIR/wrangler.runtime.toml"
          echo "REFRESH_KEY=$REFRESH_KEY" >> "$GITHUB_ENV"

      - name: Bootstrap registry and active routes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Bootstrap cycle $i"
            curl -fsS "$WORKER_URL/v1/refresh" \
              -X POST \
              -H "x-nova-refresh-key: $REFRESH_KEY" > "$RUNNER_TEMP/bootstrap-$i.json"
            jq -e '.ok == true' "$RUNNER_TEMP/bootstrap-$i.json" >/dev/null
          done

      - name: Live Worker and D1 verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$WORKER_URL/v1/status" > "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
          jq -e '.ok == true and .targetCatalog == 200000 and .catalogRecords >= 1000 and .shardCount >= 10 and .activeRoutes >= 6' "$RUNNER_TEMP/status.json" >/dev/null
          curl -fsS "$WORKER_URL/v1/plan" \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"capability":"reasoning"}' > "$RUNNER_TEMP/plan.json"
          jq -e '.source == "cloudflare-d1" and (.candidates | length) >= 2' "$RUNNER_TEMP/plan.json" >/dev/null
          echo 'Cloudflare Worker, D1 shards and ARIM shortlist verified live.'

      - name: Wire deployed Worker into NOVA client and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('fresh-rebuild/src/nova57-atomic-backend-client.js')
          source = path.read_text(encoding='utf-8')
          placeholder = '__NOVA_CLOUDFLARE_BRAIN_BACKEND_URL__'
          url = os.environ['WORKER_URL']
          if placeholder not in source:
              raise SystemExit('Cloudflare backend URL placeholder missing.')
          path.write_text(source.replace(placeholder, url, 1), encoding='utf-8')
          PY
          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "$WORKER_URL" fresh-rebuild/src/nova57-atomic-backend-client.js
          rm -f "$CF_DIR/wrangler.runtime.toml"
          git rm .github/workflows/nova57-cloudflare-brain-deploy-once.yml
          git config user.name 'NexusNova Cloudflare Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/nova57-atomic-backend-client.js
          git commit -m 'Wire live Cloudflare brain registry into NOVA'
          git push origin HEAD:nova-sol57-pro-v128

      - name: Cleanup runner secrets
        if: always()
        shell: bash
        run: |
          rm -f "$CF_DIR/wrangler.runtime.toml" \
            "$RUNNER_TEMP"/cf-subdomain.json \
            "$RUNNER_TEMP"/d1-list.json "$RUNNER_TEMP"/d1-create.json \
            "$RUNNER_TEMP"/worker-subdomain-enable.json \
            "$RUNNER_TEMP"/bootstrap-*.json "$RUNNER_TEMP"/status.json "$RUNNER_TEMP"/plan.json
