name: Deploy NOVA Cloudflare Brain

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'cloudflare/nova-brain-worker/**'
      - '.github/workflows/nova57-cloudflare-brain-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova57-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: cloudflare/nova-brain-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOVA_D1_DATABASE_ID: ${{ secrets.NOVA_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Worker and schema
        shell: bash
        run: |
          node --check src/index.js
          grep -F 'CREATE TABLE IF NOT EXISTS route_semantics' schema.sql >/dev/null
          grep -F 'CREATE TABLE IF NOT EXISTS route_semantic_dimensions' schema.sql >/dev/null
          grep -F 'database_id = "__D1_DATABASE_ID__"' wrangler.template.toml >/dev/null

      - name: Validate deployment credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NOVA_D1_DATABASE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub environment secret is missing: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Build deployment config
        shell: bash
        run: |
          sed "s/__D1_DATABASE_ID__/$NOVA_D1_DATABASE_ID/" wrangler.template.toml > wrangler.toml
          grep -F 'name = "nexusnova-brain-router"' wrangler.toml >/dev/null
          grep -F 'binding = "DB"' wrangler.toml >/dev/null

      - name: Apply append-only D1 schema
        run: npx --yes wrangler@4 d1 execute nexusnova-brain-registry --remote --file=schema.sql --config=wrangler.toml

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config=wrangler.toml

      - name: Verify production status
        shell: bash
        run: |
          node - <<'NODE'
          const endpoint = 'https://nexusnova-brain-router.fahadsoomro123.workers.dev/v1/status';
          const response = await fetch(endpoint);
          if (!response.ok) throw new Error(`status HTTP ${response.status}`);
          const data = await response.json();
          for (const key of ['catalogRecords', 'activeRoutes', 'healthyRoutes', 'semanticallyEvaluatedRoutes', 'semanticBenchmarkAttempts']) {
            if (!Number.isFinite(Number(data[key]))) throw new Error(`missing metric: ${key}`);
          }
          console.log(JSON.stringify({
            ok: true,
            catalogRecords: Number(data.catalogRecords),
            activeRoutes: Number(data.activeRoutes),
            healthyRoutes: Number(data.healthyRoutes),
            semanticallyEvaluatedRoutes: Number(data.semanticallyEvaluatedRoutes),
            semanticBenchmarkAttempts: Number(data.semanticBenchmarkAttempts)
          }));
          NODE
