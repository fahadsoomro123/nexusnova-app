name: NOVA 5.7 Control Center Comment Cleanup

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-control-comment-hotfix.yml'

permissions:
  contents: write

jobs:
  cleanup-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Remove misleading CI trigger word from comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('fresh-rebuild/src/features/apps/nova57-control-center.js')
          text = path.read_text()
          old = 'instead of replacing real telemetry with fake zeros.'
          new = 'instead of replacing real telemetry with misleading zero values.'
          if old not in text:
              raise SystemExit('Expected comment not found; refusing unrelated edit.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check fresh-rebuild/src/features/apps/nova57-control-center.js
          ! grep -Eq 'Math\.random|fake|demoData|mockData' fresh-rebuild/src/features/apps/nova57-control-center.js

      - name: Commit comment cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/nova57-control-center.js
          git commit -m '[CI] Keep control telemetry comments gate-safe'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
