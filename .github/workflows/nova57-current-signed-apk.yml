name: NOVA 5.7 Gemini Reset Installable APK

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-current-signed-apk.yml'

permissions:
  contents: write

concurrency:
  group: nova57-gemini-reset-install-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-gemini-reset-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact Gemini reset source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          test -s fresh-rebuild/src/nova57-human-response.js
          test -s NexusNovaAndroid/app/build.gradle.kts

          grep -Fq "const PRODUCT = 'NOVA 5.7 Sol';" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "const PROVIDER_MODEL = 'gemini-3.6-flash';" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "firebasejs/12.1.0/firebase-ai.js" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="chat"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="work"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq './src/nova57-human-response.js' fresh-rebuild/index.html

          ! grep -Fq 'mountNovaControlCenter' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          ! grep -Fq 'data-nx57-control' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          ! grep -Eq '200K|ARIM' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          echo 'Direct Gemini + Chat/Work-only NOVA source: PASS'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK with current web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          # Gradle syncFreshWebAssets must have staged the exact current renderer.
          grep -Fq "const PROVIDER_MODEL = 'gemini-3.6-flash';" app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="chat"' app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="work"' app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          grep -Fq './src/nova57-human-response.js' app/src/main/assets/www/index.html
          ! grep -Fq 'mountNovaControlCenter' app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          ! grep -Fq 'data-nx57-control' app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          ! grep -Eq '200K|ARIM' app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js

          OUT="$GITHUB_WORKSPACE/gemini-reset-apk"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/NexusNova-GEMINI-RESET-INSTALL.apk"
          sha256sum "$OUT/NexusNova-GEMINI-RESET-INSTALL.apk" > "$OUT/SHA256.txt"
          printf 'Source commit: %s\nBranch: %s\nBuild type: installable debug APK\nDirect Gemini 3.6: PASS\nDashboard removed from active NOVA renderer: PASS\n200K/ARIM removed from active NOVA renderer: PASS\nChat + Work: PASS\nHuman response script bundled: PASS\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$OUT/BUILD-STATUS.txt"

      - name: Publish APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-gemini-reset-publish"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf gemini-reset
          mkdir -p gemini-reset
          cp -a "$GITHUB_WORKSPACE/gemini-reset-apk"/. gemini-reset/
          git add -A gemini-reset/BUILD-STATUS.txt gemini-reset/SHA256.txt
          git add -f gemini-reset/NexusNova-GEMINI-RESET-INSTALL.apk
          git commit -m "Publish Gemini reset install APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
