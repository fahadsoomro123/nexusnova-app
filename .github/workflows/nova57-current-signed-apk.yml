name: NOVA 5.7 Gemini Reset Signed APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode
        required: true
        default: '202608291'
      version_name:
        description: Android versionName
        required: true
        default: '1.5.7-gemini-reset-20260829'
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-current-signed-apk.yml'

permissions:
  contents: write

concurrency:
  group: nova57-gemini-reset-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
  VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '202608291' }}
  VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '1.5.7-gemini-reset-20260829' }}

jobs:
  build-current-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Gemini reset source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          test -s fresh-rebuild/src/nova57-human-response.js
          test -s NexusNovaAndroid/app/build.gradle.kts

          grep -Fq "const PRODUCT = 'NOVA 5.7 Sol';" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "const PROVIDER_MODEL = 'gemini-3.6-flash';" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "firebasejs/12.1.0/firebase-ai.js" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="chat"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq 'data-nx57-mode="work"' fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq './src/nova57-human-response.js' fresh-rebuild/index.html

          if grep -Fq 'mountNovaControlCenter' fresh-rebuild/src/features/apps/nova-sol57-fresh.js; then
            echo 'Dashboard control center is still wired' >&2
            exit 1
          fi
          if grep -Fq 'data-nx57-control' fresh-rebuild/src/features/apps/nova-sol57-fresh.js; then
            echo 'Dashboard button is still present' >&2
            exit 1
          fi
          if grep -Eq '200K|ARIM' fresh-rebuild/src/features/apps/nova-sol57-fresh.js; then
            echo '200K/ARIM runtime marker is still present in active NOVA renderer' >&2
            exit 1
          fi
          echo 'Direct Gemini + Chat/Work-only NOVA source: PASS'

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build, sign, verify and publish APK
        shell: bash
        run: bash tools/build-permanent-signed-v4.sh
