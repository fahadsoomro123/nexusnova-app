name: NOVA 5.7 Enable Safe Atomic OTA Bootstrap

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-enable-safe-ota-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova57-enable-safe-ota-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified OTA engine and harden it
        shell: bash
        run: |
          set -euo pipefail
          MANAGER='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
          MAIN='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
          OTA='.github/workflows/nexusnova-ota-web-release.yml'
          BASE='0b455023342e94fe8c199ae25c0bcde03af80d59'

          git show 69a0e77f8d9973c93abb06c3689460810197ef94:"$MANAGER" > "$MANAGER"

          python3 - <<'PY'
          from pathlib import Path

          base = '0b455023342e94fe8c199ae25c0bcde03af80d59'
          manager_path = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          main_path = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          ota_path = Path('.github/workflows/nexusnova-ota-web-release.yml')

          manager = manager_path.read_text()
          manager = manager.replace('const val PREFS_NAME = "nexusnova_ota_web_v1"', 'const val PREFS_NAME = "nexusnova_ota_web_v3_atomic"')
          manager = manager.replace('const val MANIFEST_SCHEMA = 1', 'const val MANIFEST_SCHEMA = 2')
          manager = manager.replace(
              'const val MANIFEST_URL = "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/ota/manifest.json"',
              'const val MANIFEST_URL = "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app/nexusnova-ota-release/manifest.json"'
          )
          manager = manager.replace(
              'const val FILE_BASE_URL = "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/ota/files/"',
              'const val FILE_BASE_URL = "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app/nexusnova-ota-release/files/"'
          )
          needle = 'if (manifest.optInt("schema", 0) != MANIFEST_SCHEMA) {\n            throw IOException("Unsupported OTA manifest schema")\n        }\n\n        val version = manifest.optString("version").trim().lowercase()'
          replacement = 'if (manifest.optInt("schema", 0) != MANIFEST_SCHEMA) {\n            throw IOException("Unsupported OTA manifest schema")\n        }\n        val base = manifest.optString("base").trim().lowercase()\n        if (base != BUNDLED_WEB_BASE) throw IOException("OTA base mismatch")\n\n        val version = manifest.optString("version").trim().lowercase()'
          if needle not in manager:
              raise SystemExit('manager schema anchor missing')
          manager = manager.replace(needle, replacement, 1)
          anchor = 'const val ASSET_PATH = "/assets/www/"\n'
          if anchor not in manager:
              raise SystemExit('manager asset anchor missing')
          manager = manager.replace(anchor, anchor + f'        const val BUNDLED_WEB_BASE = "{base}"\n', 1)
          manager_path.write_text(manager)

          main = main_path.read_text()
          old = '    private var adManager: NexusAdManager? = null\n\n    private val assetLoader by lazy {'
          new = '    private var adManager: NexusAdManager? = null\n    private val otaWebManager by lazy { NexusOtaWebManager(this) }\n\n    private val assetLoader by lazy {'
          if old not in main:
              raise SystemExit('MainActivity manager anchor missing')
          main = main.replace(old, new, 1)

          old = '                return assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)'
          new = '                return otaWebManager.intercept(uri)\n                    ?: assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)'
          if old not in main:
              raise SystemExit('MainActivity intercept anchor missing')
          main = main.replace(old, new, 1)

          old = '        loadProductionApp()\n    }\n\n    private fun initializeAdsSafely()'
          new = '        loadProductionApp()\n        checkForWebUpdate()\n    }\n\n    private fun initializeAdsSafely()'
          if old not in main:
              raise SystemExit('MainActivity startup anchor missing')
          main = main.replace(old, new, 1)

          old = '''    private fun loadProductionApp(forceFresh: Boolean = false) {
        usingOfflineFallback = false
        if (forceFresh) webView.clearCache(true)
        val suffix = if (forceFresh) "?androidRecovery=${System.currentTimeMillis()}" else ""
        webView.loadUrl(LOCAL_APP_URL)
    }
'''
          new = '''    private fun loadProductionApp(forceFresh: Boolean = false) {
        usingOfflineFallback = false
        if (forceFresh) webView.clearCache(true)
        val suffix = if (forceFresh) "?androidRecovery=${System.currentTimeMillis()}" else ""
        webView.loadUrl(LOCAL_APP_URL + suffix)
    }

    private fun checkForWebUpdate() {
        otaWebManager.checkForUpdate { updated ->
            if (!updated || isFinishing || isDestroyed || !::webView.isInitialized) return@checkForUpdate
            webView.post {
                if (!isFinishing && !isDestroyed && ::webView.isInitialized) {
                    webRecoveryAttempts = 0
                    loadProductionApp(forceFresh = true)
                }
            }
        }
    }
'''
          if old not in main:
              raise SystemExit('MainActivity load anchor missing')
          main = main.replace(old, new, 1)

          main = main.replace('if (!isProductionOrigin(uri) || usingOfflineFallback) return', 'if (!isTrustedAppPage(uri) || usingOfflineFallback) return')
          main = main.replace('if (!isProductionOrigin(failed.url)) return', 'if (!isTrustedAppPage(failed.url)) return')

          old = '''        // A technically successful but visually blank remote page is just as unusable
        // as a network failure. Fall back to the bundled shell instead of leaving the
        // user on an empty WebView. Value-bearing mining remains disabled offline.
        usingOfflineFallback = true
        mainFrameWatchdogToken += 1
        target.stopLoading()
        target.loadUrl(LOCAL_APP_URL)
        android.util.Log.w("NexusNovaWeb", "Using local fallback after $reason")
'''
          new = '''        // An OTA that cannot render must never strand the app. Block that exact
        // version and immediately return to the signed bundled web baseline.
        val rolledBackOta = otaWebManager.rollbackToBundled()
        usingOfflineFallback = true
        mainFrameWatchdogToken += 1
        target.stopLoading()
        target.clearCache(true)
        target.loadUrl(LOCAL_APP_URL + "?otaRollback=${System.currentTimeMillis()}")
        android.util.Log.w("NexusNovaWeb", "Using bundled fallback after $reason; otaRollback=$rolledBackOta")
'''
          if old not in main:
              raise SystemExit('MainActivity rollback anchor missing')
          main = main.replace(old, new, 1)

          old = '                if (didCrash) rendererCrashRecoveries += 1\n'
          new = '                if (didCrash) {\n                    otaWebManager.rollbackToBundled()\n                    rendererCrashRecoveries += 1\n                }\n'
          if old not in main:
              raise SystemExit('MainActivity crash anchor missing')
          main = main.replace(old, new, 1)
          main_path.write_text(main)

          ota = ota_path.read_text()
          import re
          ota, count = re.subn(r'OTA_BUNDLED_BASE: [0-9a-f]{40}', f'OTA_BUNDLED_BASE: {base}', ota, count=1)
          if count != 1:
              raise SystemExit('OTA base anchor missing')

          old = '''          if [ "$count" -lt 1 ]; then
            echo 'No web files differ from the bundled OTA baseline.' >&2
            exit 1
          fi

          python3 - <<'PY'
'''
          new = '''          # index.html is always shipped so every activated differential has a
          # deterministic entry point even when a future change is CSS-only.
          if [ ! -f /tmp/nexusnova-ota-package/files/index.html ]; then
            cp fresh-rebuild/index.html /tmp/nexusnova-ota-package/files/index.html
            count=$((count + 1))
          fi

          if [ "$count" -lt 1 ]; then
            echo 'No web files available for OTA.' >&2
            exit 1
          fi

          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
'''
          if old not in ota:
              raise SystemExit('OTA package anchor missing')
          ota = ota.replace(old, new, 1)
          old = """          manifest = {
              'schema': 1,
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
"""
          new = """          manifest = {
              'schema': 2,
              'base': os.environ['OTA_DIFF_BASE'],
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
"""
          if old not in ota:
              raise SystemExit('OTA manifest anchor missing')
          ota = ota.replace(old, new, 1)
          ota_path.write_text(ota)
          PY

      - name: Verify patch contract
        shell: bash
        run: |
          set -euo pipefail
          MAIN='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
          MANAGER='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
          OTA='.github/workflows/nexusnova-ota-web-release.yml'
          grep -Fq 'otaWebManager.intercept(uri)' "$MAIN"
          grep -Fq 'checkForWebUpdate()' "$MAIN"
          grep -Fq 'otaWebManager.rollbackToBundled()' "$MAIN"
          grep -Fq 'nexusnova_ota_web_v3_atomic' "$MANAGER"
          grep -Fq 'nexusnova-app/nexusnova-ota-release/manifest.json' "$MANAGER"
          grep -Fq 'OTA base mismatch' "$MANAGER"
          grep -Fq 'MANIFEST_SCHEMA = 2' "$MANAGER"
          grep -Fq "'schema': 2" "$OTA"
          grep -Fq "'base': os.environ['OTA_DIFF_BASE']" "$OTA"
          grep -Fq 'OTA_BUNDLED_BASE: 0b455023342e94fe8c199ae25c0bcde03af80d59' "$OTA"
          git diff --check

      - name: Commit safe OTA bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'NexusNova OTA Bootstrap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt \
            NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt \
            .github/workflows/nexusnova-ota-web-release.yml
          git commit -m 'Enable safe atomic web OTA bootstrap'
          git push origin HEAD:nova-sol57-pro-v128
