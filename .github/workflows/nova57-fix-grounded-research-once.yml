name: NOVA 5.7 Grounded Research Patch
on:
  push:
    branches: [nova-sol57-pro-v128]
    paths: ['.github/workflows/nova57-fix-grounded-research-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Patch research routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fresh-rebuild/src/nova57-atomic-chain.js'); s=p.read_text()
          a=s.index("  let primary;\n  try {\n    primary = await runLegacy('solver-A1', 1, prompt, dna.complexity >= 3 ? 3900 : 3200);")
          b=s.index("\n\n  if (primary.brain.deterministic && primary.brain.verified) {",a)
          lines=[
          "  let primary;",
          "  if (dna.capability === 'research') {",
          "    try {",
          "      primary = await runDistinct('solver-A1', 1, prompt, 5000, 0, 2);",
          "    } catch (primaryError) {",
          "      try { primary = await runLegacy('solver-A1-rescue', 1, prompt, 3600); }",
          "      catch {",
          "        finalizeTelemetry({ dna, started, hops, outcome: 'primary-failed', backendPlan, expansionReason: 'research-primary-unavailable', agreement: 0 });",
          "        throw primaryError;",
          "      }",
          "    }",
          "  } else {",
          "    try { primary = await runLegacy('solver-A1', 1, prompt, dna.complexity >= 3 ? 3900 : 3200); }",
          "    catch (primaryError) {",
          "      try { primary = await runDistinct('solver-A1-rescue', 1, prompt, 3300, 0, 2); }",
          "      catch {",
          "        finalizeTelemetry({ dna, started, hops, outcome: 'primary-failed', backendPlan, expansionReason, agreement: 0 });",
          "        throw primaryError;",
          "      }",
          "    }",
          "  }"
          ]
          p.write_text(s[:a]+'\n'.join(lines)+s[b:])

          p=Path('fresh-rebuild/src/nova57-pro-orchestrator.js'); s=p.read_text()
          old="async function searchWeb(request) {\n  const query = request.replace(/\\s+/g, ' ').trim().slice(0, 500);"
          new="""function focusedWebQuery(request) {
            const raw = String(request || '').replace(/\s+/g, ' ').trim();
            const first = raw.split(/(?<=[.!?])\s+/)[0] || raw;
            let query = first.replace(/^(?:please\s+)?(?:research|search|browse|look\s+up)\s+(?:the\s+)?(?:web|internet)\s+(?:live\s+)?(?:for\s+)?/i, '').replace(/^(?:please\s+)?(?:research|search|browse|look\s+up)\s+(?:live\s+)?(?:for\s+)?/i, '').trim();
            return (query.length >= 4 ? query : raw).slice(0, 320);
          }

          async function searchWeb(request) {
            const query = focusedWebQuery(request);"""
          new='\n'.join(x[10:] if x.startswith('          ') else x for x in new.splitlines())
          if old not in s: raise SystemExit('search anchor missing')
          s=s.replace(old,new,1)
          pos=s.index('      if (webIntent(request)) {')
          old="                options,\n                generate: nextPrompt => hedgeModel.generateContent(nextPrompt)\n              })"
          i=s.index(old,pos)
          new="                options,\n                totalBudgetMs: 12000,\n                generate: nextPrompt => hedgeModel.generateContent(nextPrompt)\n              })"
          p.write_text(s[:i]+new+s[i+len(old):])
          PY
          node --check fresh-rebuild/src/nova57-atomic-chain.js
          node --check fresh-rebuild/src/nova57-pro-orchestrator.js
      - name: Commit patch
        run: |
          git config user.name 'NexusNova Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/nova57-atomic-chain.js fresh-rebuild/src/nova57-pro-orchestrator.js
          git commit -m 'Strengthen grounded research ARIM routing'
          git push origin HEAD:nova-sol57-pro-v128
