name: NOVA 5.7 One-Time Think Leak Hardening

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-fix-think-leak-once.yml'

permissions:
  contents: write

jobs:
  harden-and-self-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: Harden internal reasoning leak detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pool_path = Path('fresh-rebuild/src/nova57-atomic-brain-pool.js')
          pool = pool_path.read_text(encoding='utf-8')
          replacements = {
              r"/^<think>\\b/i,": r"/^<think>(?:\\s|$)/i,",
              r"/^<analysis>\\b/i,": r"/^<analysis>(?:\\s|$)/i,",
          }
          for old, new in replacements.items():
              if old not in pool:
                  raise SystemExit(f'Expected quality regex missing: {old}')
              pool = pool.replace(old, new, 1)
          pool_path.write_text(pool, encoding='utf-8')

          smoke_path = Path('scripts/nova57-arim-live-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          anchor = "  rawJson: pool.assessAtomicResponseQuality('{\"choices\":[{\"message\":{\"content\":\"hi\"}}]}')\n};"
          replacement = "  rawJson: pool.assessAtomicResponseQuality('{\"choices\":[{\"message\":{\"content\":\"hi\"}}]}'),\n  leakThink: pool.assessAtomicResponseQuality('<think>\\ninternal reasoning must never reach the user')\n};"
          if anchor not in smoke:
              raise SystemExit('Smoke quality-unit anchor missing.')
          smoke = smoke.replace(anchor, replacement, 1)
          old_pass = "  && qualityUnit.leakWeNeed.ok === false\n  && qualityUnit.rawJson.ok === false;"
          new_pass = "  && qualityUnit.leakWeNeed.ok === false\n  && qualityUnit.rawJson.ok === false\n  && qualityUnit.leakThink.ok === false;"
          if old_pass not in smoke:
              raise SystemExit('Smoke pass-condition anchor missing.')
          smoke = smoke.replace(old_pass, new_pass, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          node --check fresh-rebuild/src/nova57-atomic-brain-pool.js
          node --check scripts/nova57-arim-live-smoke.mjs
          grep -Fq '/^<think>(?:\s|$)/i' fresh-rebuild/src/nova57-atomic-brain-pool.js
          grep -Fq "leakThink: pool.assessAtomicResponseQuality('<think>\\n" scripts/nova57-arim-live-smoke.mjs

      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          if git diff --name-only | grep -Ei '(^|/)(mining|mine|rewards?|wallet|nvx)(/|\.|-|_)'; then
            echo 'Protected mining/reward/wallet/NVX path changed.' >&2
            exit 1
          fi
          git rm .github/workflows/nova57-fix-think-leak-once.yml
          git config user.name 'NexusNova ARIM Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/nova57-atomic-brain-pool.js scripts/nova57-arim-live-smoke.mjs
          git commit -m 'Harden ARIM internal reasoning leak rejection'
          git push origin HEAD:nova-sol57-pro-v128
