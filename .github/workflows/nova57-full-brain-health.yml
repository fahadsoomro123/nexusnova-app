name: NOVA 5.7 Full Live Brain Health

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-full-brain-health-scan.mjs'
      - '.github/workflows/nova57-full-brain-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-brain-health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/nova57-full-brain-health-scan.mjs
      - name: Live-scan every discovered route
        run: node scripts/nova57-full-brain-health-scan.mjs
      - name: Print final report
        if: always()
        run: cat nova57-full-brain-health-results.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova57-full-brain-health-results
          path: nova57-full-brain-health-results.json
          if-no-files-found: warn
          retention-days: 7
