name: NOVA 5.7 Gemini 3.7 Fallback Hotfix

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-gemini37-fallback-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - name: Apply Gemini fallback compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nova57-gemini37-fallback-hotfix.py
          node --check fresh-rebuild/src/nova57-pro-keyless-router.js
          grep -Fq 'firebaseCompatibleOptions' fresh-rebuild/src/nova57-pro-keyless-router.js
          grep -Fq "gemini-3.5-flash" fresh-rebuild/src/nova57-pro-keyless-router.js
      - name: Commit fallback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/nova57-pro-keyless-router.js
          git commit -m '[NOVA] Make Firebase fallback Gemini 3.7 compatible'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
