name: NOVA 5.7 One-Time Hardened Benchmark

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-hard-benchmark-once.yml'

permissions:
  contents: write

jobs:
  benchmark-and-self-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run hardened benchmark
        id: bench
        shell: bash
        run: |
          set +e
          node scripts/nova57-hard-benchmark.mjs
          STATUS=$?
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          rm -f nova57-hard-benchmark-results.json
          echo "Hardened benchmark exit status: $STATUS"

      - name: Self-clean temporary benchmark runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/nova57-hard-benchmark-once.yml
          git config user.name 'NexusNova Benchmark Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove one-time hardened benchmark runner'
          git push origin HEAD:nova-sol57-pro-v128

      - name: Enforce benchmark result
        if: always()
        shell: bash
        run: test "${{ steps.bench.outputs.status }}" = "0"
