name: NOVA 5.7 Hard Live Benchmark

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-hard-benchmark.mjs'
      - 'fresh-rebuild/src/nova57-pro-keyless-router.js'
      - 'fresh-rebuild/src/nova57-pro-tool-router.js'
      - 'fresh-rebuild/index.html'
      - '.github/workflows/nova57-hard-benchmark.yml'
  workflow_dispatch:

jobs:
  hard-live-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and wiring checks
        run: |
          set -euo pipefail
          node --check scripts/nova57-hard-benchmark.mjs
          node --input-type=module --check < fresh-rebuild/src/nova57-pro-keyless-router.js
          node --input-type=module --check < fresh-rebuild/src/nova57-pro-tool-router.js
          grep -Fq './src/nova57-pro-tool-router.js' fresh-rebuild/index.html
          grep -Fq 'openrouter/free' fresh-rebuild/src/nova57-pro-keyless-router.js
          grep -Fq 'simpleGithubFactsRequest' fresh-rebuild/src/nova57-pro-tool-router.js
      - name: Ask NOVA real questions and hard tool tasks
        run: node scripts/nova57-hard-benchmark.mjs
      - name: Show benchmark results
        if: always()
        run: cat nova57-hard-benchmark-results.json || true
