name: NOVA 5.7 Horde Throttled Health

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'scripts/nova57-horde-throttled-health.mjs'
      - '.github/workflows/nova57-horde-throttled-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horde-health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/nova57-horde-throttled-health.mjs
      - name: Throttled live Horde verification
        run: node scripts/nova57-horde-throttled-health.mjs
