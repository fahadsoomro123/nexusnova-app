name: NOVA 5.7 Mobile Relay Hotfix

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-mobile-relay-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout active NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Apply authenticated mobile generation relay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nova57-mobile-relay-hotfix.py
          node --check cloudflare/nova-brain-worker/src/index.js
          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          node --check fresh-rebuild/src/nova57-pro-orchestrator.js
          grep -Fq "url.pathname === '/v1/generate'" cloudflare/nova-brain-worker/src/index.js
          grep -Fq 'generateViaAtomicRelay' fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq 'generateForRuntime' fresh-rebuild/src/nova57-pro-orchestrator.js
          grep -Fq 'instant-conversation' fresh-rebuild/src/nova57-pro-orchestrator.js

      - name: Commit relay fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/nova-brain-worker/src/index.js fresh-rebuild/src/nova57-atomic-backend-client.js fresh-rebuild/src/nova57-pro-orchestrator.js
          git commit -m '[NOVA] Route Android AI generation through authenticated Worker relay'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
