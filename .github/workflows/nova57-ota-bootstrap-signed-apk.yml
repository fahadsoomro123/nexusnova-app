name: NexusNova TEST Ads Permanent Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - nova-sol57-pro-v128
    paths:
      - '.github/workflows/nova57-ota-bootstrap-signed-apk.yml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdConsentManager.kt'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'fresh-rebuild/src/core/native-ads.js'
      - 'fresh-rebuild/src/core/ad-policy.js'
      - 'fresh-rebuild/src/core/backend-adapter.js'
      - 'fresh-rebuild/src/core/nova-mining-rewards-store.js'
      - 'fresh-rebuild/src/core/release-mining-safety.js'

permissions:
  contents: write

env:
  VERSION_CODE: '20260902'
  VERSION_NAME: '1.0.6-test-ads'
  V14_BASE: '8d1aaaee6f28b974a8c8b3ff213beb1318ec7405'

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current TEST ad bridge, Cloudflare v2, and OTA baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/core/native-ads.js
          test -s fresh-rebuild/src/core/backend-adapter.js
          test -s fresh-rebuild/src/core/nova-mining-rewards-store.js
          test -s fresh-rebuild/src/core/release-mining-safety.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -s NexusNovaAndroid/app/build.gradle.kts

          grep -Fq 'ACTION_SHOW_REWARDED_AD = "showRewardedAd"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_SHOW_INTERSTITIAL_AD = "showInterstitialAd"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_AD_STATUS = "adStatus"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'showRewardedAd' fresh-rebuild/src/core/native-ads.js
          grep -Fq 'showInterstitialAd' fresh-rebuild/src/core/native-ads.js
          grep -Fq 'NEXUS_ADS_TEST_MODE", "true"' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'ca-app-pub-3940256099942544~3347511713' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'BuildConfig.NEXUS_ADS_TEST_MODE' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq '/21775744923/example/rewarded' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq '/21775744923/example/interstitial' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          grep -Fq 'https://nova-mining-rewards.fahadsoomro123.workers.dev' fresh-rebuild/src/core/nova-mining-rewards-store.js
          grep -Fq "toggleMiningCloudflare({ source:'fresh-rebuild-cloudflare-v2' })" fresh-rebuild/src/core/backend-adapter.js
          grep -Fq "BUNDLED_WEB_BASE = \"$V14_BASE\"" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          echo 'Native TEST ad bridge + Cloudflare v2 + OTA baseline: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo 'Permanent signing secrets: PRESENT'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject release version and signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = ' + os.environ['VERSION_CODE'], text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "' + os.environ['VERSION_NAME'] + '"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Android version fields not found')
          signing = '''    signingConfigs {
              create("nexusRelease") {
                  storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
                  storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
                  keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
                  keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
              }
          }

          '''
          build_types = '    buildTypes {\n'
          if build_types not in text:
              raise SystemExit('Android buildTypes block not found')
          text = text.replace(build_types, signing + build_types, 1)
          release = '        release {\n'
          if release not in text:
              raise SystemExit('Android release block not found')
          text = text.replace(release, release + '            signingConfig = signingConfigs.getByName("nexusRelease")\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build permanently signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          # Canonical current web bundle must be inside the APK build, not only OTA.
          test -s app/src/main/assets/www/src/core/native-ads.js
          test -s app/src/main/assets/www/src/core/backend-adapter.js
          test -s app/src/main/assets/www/src/core/nova-mining-rewards-store.js
          test -s app/src/main/assets/www/src/core/release-mining-safety.js
          grep -Fq 'showRewardedAd' app/src/main/assets/www/src/core/native-ads.js
          grep -Fq 'showInterstitialAd' app/src/main/assets/www/src/core/native-ads.js
          grep -Fq 'https://nova-mining-rewards.fahadsoomro123.workers.dev' app/src/main/assets/www/src/core/nova-mining-rewards-store.js
          grep -Fq "toggleMiningCloudflare({ source:'fresh-rebuild-cloudflare-v2' })" app/src/main/assets/www/src/core/backend-adapter.js
          echo 'Signed APK bundles current TEST ad + Cloudflare web bridge: PASS'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme .*: true' "$GITHUB_WORKSPACE/apk-signature.txt"

      - name: Publish signed TEST ad APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/test-ads-signed"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          APK_NAME="NexusNova-${VERSION_NAME}-vc${VERSION_CODE}-SIGNED.apk"
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" "$OUT/$APK_NAME"
          sha256sum "$OUT/$APK_NAME" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/apk-signature.txt" "$OUT/signature.txt"
          printf 'Source commit: %s\nBranch: %s\nVersion name: %s\nVersion code: %s\nPermanent signature: PASS\nNative rewarded bridge: PASS\nNative interstitial bridge: PASS\nCloudflare v2 bundled: PASS\nOTA baseline: %s\nAdMob mode: GOOGLE TEST LOCKED\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$VERSION_NAME" "$VERSION_CODE" "$V14_BASE" > "$OUT/BUILD-STATUS.txt"

          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-test-ads-signed"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf test-ads-signed
          mkdir -p test-ads-signed
          cp -a "$OUT"/. test-ads-signed/
          git add -A test-ads-signed/BUILD-STATUS.txt test-ads-signed/SHA256.txt test-ads-signed/signature.txt
          git add -f test-ads-signed/*.apk
          git commit -m "Publish signed TEST ad APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}"
