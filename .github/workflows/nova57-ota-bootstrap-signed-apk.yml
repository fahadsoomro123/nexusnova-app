name: NOVA 5.7 Public OTA Bootstrap Signed APK

# Native APK builds are normally MANUAL ONLY. A narrowly-scoped push trigger is
# temporarily armed for the one-time public OTA transport bootstrap.
on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
  NEXUSNOVA_SIGNING_STORE_FILE: ${{ runner.temp }}/nexusnova-release.jks
  VERSION_CODE: '20260830'
  VERSION_NAME: '1.0.3-ota-public'

jobs:
  build-signed-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current NOVA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact public OTA bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/assets/styles/nova57-gradient-premium.css
          test -s fresh-rebuild/assets/styles/premium-mine-tactile-3d.css
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'premium-mine-tactile-3d.css' fresh-rebuild/index.html
          grep -Fq 'MANIFEST_SCHEMA = 2' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'BUNDLED_WEB_BASE = "b6eb3d191ee35b58c0ffe14334674ea2c60d3b72"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'nexusnova-website/nexusnova-ota-public/ota/manifest.json' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'checkForWebUpdate()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          echo 'Public atomic OTA bootstrap source: PASS'

      - name: Verify public OTA v2 manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/ota-manifest.json"
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/manifest.json" \
            -o "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('schema') == 2, data
          assert data.get('base') == 'b6eb3d191ee35b58c0ffe14334674ea2c60d3b72', data
          assert isinstance(data.get('version'), str) and len(data['version']) == 40, data
          assert any(x.get('path') == 'index.html' for x in data.get('files', [])), data
          print('Published public atomic OTA manifest: PASS')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64" || { echo 'Missing NEXUSNOVA_SIGNING_KEYSTORE_B64' >&2; exit 1; }
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD" || { echo 'Missing NEXUSNOVA_SIGNING_STORE_PASSWORD' >&2; exit 1; }
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS" || { echo 'Missing NEXUSNOVA_SIGNING_KEY_ALIAS' >&2; exit 1; }
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD" || { echo 'Missing NEXUSNOVA_SIGNING_KEY_PASSWORD' >&2; exit 1; }

      - name: Restore permanent signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          test -s "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list \
            -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" \
            -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" \
            -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject signing and bootstrap version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', f"versionCode = {int(os.environ['VERSION_CODE'])}", text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', f"versionName = \"{os.environ['VERSION_NAME']}\"", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not patch Android version fields')
          signing_block = '''    signingConfigs {
              create("nexusRelease") {
                  storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
                  storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
                  keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
                  keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
              }
          }

          '''
          if 'create("nexusRelease")' not in text:
              anchor = '    buildTypes {\n'
              if anchor not in text: raise SystemExit('buildTypes anchor missing')
              text = text.replace(anchor, signing_block + anchor, 1)
          signing_line = '            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if signing_line not in text:
              anchor = '        release {\n'
              if anchor not in text: raise SystemExit('release anchor missing')
              text = text.replace(anchor, anchor + signing_line, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build permanently signed public OTA bootstrap APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/ota-bootstrap-build.log"
          test -s app/build/outputs/apk/release/app-release.apk
          grep -Fq 'premium-mine-tactile-3d.css' app/src/main/assets/www/index.html

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/ota-bootstrap-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme .*: true' "$GITHUB_WORKSPACE/ota-bootstrap-signature.txt"

      - name: Prepare phone APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ota-bootstrap-apk"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" \
            "$OUT/NexusNova-NOVA57-PUBLIC-OTA-BOOTSTRAP-v${VERSION_NAME}-vc${VERSION_CODE}.apk"
          sha256sum "$OUT"/*.apk > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/ota-bootstrap-signature.txt" "$OUT/signature.txt"
          printf 'Source commit: %s\nBranch: %s\nVersion name: %s\nVersion code: %s\nSigned release: PASS\nPublic atomic OTA v2: PASS\nTactile Mine visual bundled: PASS\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$VERSION_NAME" "$VERSION_CODE" > "$OUT/BUILD-STATUS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-NOVA57-PUBLIC-OTA-BOOTSTRAP
          path: ota-bootstrap-apk/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-ota-bootstrap-publish"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf ota-bootstrap
          mkdir -p ota-bootstrap
          cp -a "$GITHUB_WORKSPACE/ota-bootstrap-apk"/. ota-bootstrap/
          git add -A ota-bootstrap/BUILD-STATUS.txt ota-bootstrap/SHA256.txt ota-bootstrap/signature.txt
          git add -f ota-bootstrap/*.apk
          git commit -m "Publish signed NOVA 5.7 public OTA bootstrap $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Secure cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
