name: NexusNova Vault v13 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - nova-sol57-pro-v128
    paths:
      - '.github/workflows/nova57-ota-bootstrap-signed-apk.yml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'

permissions:
  contents: write

env:
  VERSION_CODE: '20260831'
  VERSION_NAME: '1.0.4-vault-v13'

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Vault v13 and OTA source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/features/apps/nova-vault-screen-v13.js
          test -s fresh-rebuild/src/features/apps/nova-vault-safe.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq './src/main.js?ota=nv13' fresh-rebuild/index.html
          grep -Fq 'nx-vault-v13-shell-fix' fresh-rebuild/index.html
          grep -Fq 'nxEmergencySosButton' fresh-rebuild/index.html
          grep -Fq "nova-vault-screen-v13.js?ota=nv13" fresh-rebuild/src/main.js
          grep -Fq "payload.id === 'nova-vault'" fresh-rebuild/src/main.js
          grep -Fq "nova-vault-safe.js?ota=nv13" fresh-rebuild/src/features/apps/nova-vault-screen-v13.js
          grep -Fq 'UPDATE_CHECK_ATTEMPTS = 4' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'Cache-Control", "no-cache, no-store, max-age=0' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          echo 'Vault v13 + OTA cache hardening: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo 'Permanent signing secrets: PRESENT'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject release version and signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = ' + os.environ['VERSION_CODE'], text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "' + os.environ['VERSION_NAME'] + '"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Android version fields not found')

          signing = '''    signingConfigs {
              create("nexusRelease") {
                  storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))
                  storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")
                  keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")
                  keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")
              }
          }

          '''
          build_types = '    buildTypes {\n'
          if build_types not in text:
              raise SystemExit('Android buildTypes block not found')
          text = text.replace(build_types, signing + build_types, 1)

          release = '        release {\n'
          if release not in text:
              raise SystemExit('Android release block not found')
          text = text.replace(release, release + '            signingConfig = signingConfigs.getByName("nexusRelease")\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build permanently signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          # Prove the fix is inside the APK bundle and not dependent on OTA.
          test -s app/src/main/assets/www/src/features/apps/nova-vault-screen-v13.js
          test -s app/src/main/assets/www/src/features/apps/nova-vault-safe.js
          grep -Fq './src/main.js?ota=nv13' app/src/main/assets/www/index.html
          grep -Fq 'nx-vault-v13-shell-fix' app/src/main/assets/www/index.html
          grep -Fq 'nxEmergencySosButton' app/src/main/assets/www/index.html
          grep -Fq "nova-vault-screen-v13.js?ota=nv13" app/src/main/assets/www/src/main.js
          grep -Fq "payload.id === 'nova-vault'" app/src/main/assets/www/src/main.js
          echo 'Signed APK contains Vault v13 directly: PASS'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme .*: true' "$GITHUB_WORKSPACE/apk-signature.txt"

      - name: Publish signed APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/vault-v13-signed"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          APK_NAME="NexusNova-${VERSION_NAME}-vc${VERSION_CODE}-SIGNED.apk"
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" "$OUT/$APK_NAME"
          sha256sum "$OUT/$APK_NAME" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/apk-signature.txt" "$OUT/signature.txt"
          printf 'Source commit: %s\nBranch: %s\nVersion name: %s\nVersion code: %s\nPermanent signature: PASS\nVault v13 bundled directly: PASS\nVault SOS suppression bundled: PASS\nOTA stale-cache hardening: PASS\nAdMob mode: TEST LOCKED\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$VERSION_NAME" "$VERSION_CODE" > "$OUT/BUILD-STATUS.txt"

          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-vault-v13-signed"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf vault-v13-signed
          mkdir -p vault-v13-signed
          cp -a "$OUT"/. vault-v13-signed/
          git add -A vault-v13-signed/BUILD-STATUS.txt vault-v13-signed/SHA256.txt vault-v13-signed/signature.txt
          git add -f vault-v13-signed/*.apk
          git commit -m "Publish signed Vault v13 APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}"
