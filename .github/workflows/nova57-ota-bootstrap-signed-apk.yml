name: NexusNova Premium Studio Permanent Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - nova-sol57-pro-v128
    paths:
      - '.github/workflows/nova57-ota-bootstrap-signed-apk.yml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdConsentManager.kt'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'fresh-rebuild/src/core/native-ads.js'
      - 'fresh-rebuild/src/core/ad-policy.js'
      - 'fresh-rebuild/src/core/backend-adapter.js'
      - 'fresh-rebuild/src/core/nova-mining-rewards-store.js'
      - 'fresh-rebuild/src/core/release-mining-safety.js'
      - 'fresh-rebuild/src/features/apps/ai-photo-studio.js'
      - 'fresh-rebuild/src/features/apps/ai-video-studio.js'
      - 'fresh-rebuild/src/features/apps/pdf-pro-studio.js'
      - 'fresh-rebuild/src/features/apps/ai-transcribe-studio.js'
      - 'fresh-rebuild/src/features/apps/ai-writing-studio.js'
      - 'fresh-rebuild/src/features/apps/digital-sign-studio.js'
      - 'fresh-rebuild/src/features/apps/premium-studio-core.js'
      - 'fresh-rebuild/src/features/apps/premium-studio-suite.js'
      - 'fresh-rebuild/src/features/hub/app-registry.js'
      - 'fresh-rebuild/src/features/hub/hub-screen.js'
      - 'fresh-rebuild/assets/icons/nova-hub/*.webp'

permissions:
  contents: write

env:
  VERSION_CODE: '20260903'
  VERSION_NAME: '1.0.7-premium-studio'
  V14_BASE: '8d1aaaee6f28b974a8c8b3ff213beb1318ec7405'

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current native bridge, OTA baseline, and Premium Studio
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/main.js
          test -s fresh-rebuild/src/core/native-ads.js
          test -s fresh-rebuild/src/core/backend-adapter.js
          test -s fresh-rebuild/src/core/nova-mining-rewards-store.js
          test -s fresh-rebuild/src/core/release-mining-safety.js
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusAdManager.kt
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -s NexusNovaAndroid/app/build.gradle.kts

          grep -Fq 'ACTION_SHOW_REWARDED_AD = "showRewardedAd"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_SHOW_INTERSTITIAL_AD = "showInterstitialAd"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_AD_STATUS = "adStatus"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'showRewardedAd' fresh-rebuild/src/core/native-ads.js
          grep -Fq 'showInterstitialAd' fresh-rebuild/src/core/native-ads.js
          grep -Fq 'https://nova-mining-rewards.fahadsoomro123.workers.dev' fresh-rebuild/src/core/nova-mining-rewards-store.js
          grep -Fq "toggleMiningCloudflare({ source:'fresh-rebuild-cloudflare-v2' })" fresh-rebuild/src/core/backend-adapter.js
          grep -Fq "BUNDLED_WEB_BASE = \"$V14_BASE\"" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt

          for js in ai-photo-studio ai-video-studio pdf-pro-studio ai-transcribe-studio ai-writing-studio digital-sign-studio premium-studio-core premium-studio-suite; do
            test -s "fresh-rebuild/src/features/apps/$js.js"
            node --check "fresh-rebuild/src/features/apps/$js.js"
          done
          grep -Fq "'ai-photo-studio': renderAiPhotoStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-video-studio': renderAiVideoStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'pdf-pro': renderPdfProStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-transcribe': renderAiTranscribeStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'ai-writing-pro': renderAiWritingStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          grep -Fq "'digital-sign': renderDigitalSignStudio" fresh-rebuild/src/features/apps/premium-studio-suite.js
          for icon in ai-photo-studio ai-video-studio pdf-pro ai-transcribe ai-writing-pro digital-sign; do
            test -s "fresh-rebuild/assets/icons/nova-hub/$icon.webp"
          done
          echo 'Native bridge + OTA baseline + Premium Studio source: PASS'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo 'Permanent signing secrets: PRESENT'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexusnova-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "NEXUSNOVA_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Inject release version and signing config
        env:
          STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXUSNOVA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUSNOVA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('NexusNovaAndroid/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = ' + os.environ['VERSION_CODE'], text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "' + os.environ['VERSION_NAME'] + '"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Android version fields not found')
          signing = '''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          build_types = '    buildTypes {\n'
          if build_types not in text:
              raise SystemExit('Android buildTypes block not found')
          text = text.replace(build_types, signing + build_types, 1)
          release = '        release {\n'
          if release not in text:
              raise SystemExit('Android release block not found')
          text = text.replace(release, release + '            signingConfig = signingConfigs.getByName("nexusRelease")\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build permanently signed Premium Studio APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          for js in ai-photo-studio ai-video-studio pdf-pro-studio ai-transcribe-studio ai-writing-studio digital-sign-studio premium-studio-core premium-studio-suite; do
            test -s "app/src/main/assets/www/src/features/apps/$js.js"
          done
          for icon in ai-photo-studio ai-video-studio pdf-pro ai-transcribe ai-writing-pro digital-sign; do
            test -s "app/src/main/assets/www/assets/icons/nova-hub/$icon.webp"
          done
          grep -Fq "'ai-photo-studio': renderAiPhotoStudio" app/src/main/assets/www/src/features/apps/premium-studio-suite.js
          grep -Fq "'digital-sign': renderDigitalSignStudio" app/src/main/assets/www/src/features/apps/premium-studio-suite.js
          echo 'Signed APK bundles all six Premium Studio tools and icons: PASS'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          grep -Eq 'Verified using v(2|3) scheme .*: true' "$GITHUB_WORKSPACE/apk-signature.txt"

      - name: Publish signed Premium Studio APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/premium-studio-signed"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          APK_NAME="NexusNova-${VERSION_NAME}-vc${VERSION_CODE}-SIGNED.apk"
          cp "$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk" "$OUT/$APK_NAME"
          sha256sum "$OUT/$APK_NAME" > "$OUT/SHA256.txt"
          cp "$GITHUB_WORKSPACE/apk-signature.txt" "$OUT/signature.txt"
          printf 'Source commit: %s\nBranch: %s\nVersion name: %s\nVersion code: %s\nPermanent signature: PASS\nPremium Studio 6 tools bundled: PASS\nPremium Studio 6 WebP icons bundled: PASS\nOTA baseline: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$VERSION_NAME" "$VERSION_CODE" "$V14_BASE" > "$OUT/BUILD-STATUS.txt"

          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-premium-studio-signed"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf premium-studio-signed
          mkdir -p premium-studio-signed
          cp -a "$OUT"/. premium-studio-signed/
          git add -A premium-studio-signed/BUILD-STATUS.txt premium-studio-signed/SHA256.txt premium-studio-signed/signature.txt
          git add -f premium-studio-signed/*.apk
          git commit -m "Publish signed Premium Studio APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "${NEXUSNOVA_SIGNING_STORE_FILE:-}"
