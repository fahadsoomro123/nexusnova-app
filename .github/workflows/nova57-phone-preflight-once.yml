name: NOVA 5.7 One-Time Phone Preflight

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-phone-preflight-once.yml'

permissions:
  contents: write

jobs:
  phone-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync canonical web source into Android assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          cd NexusNovaAndroid
          /tmp/gradle-8.13/bin/gradle :app:syncFreshWebAssets --no-daemon

      - name: Verify critical NOVA assets byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          for rel in \
            src/nova57-atomic-backend-client.js \
            src/nova57-atomic-brain-pool.js \
            src/nova57-atomic-chain.js \
            src/nova57-pro-orchestrator.js \
            src/nova57-pro-hedge-router.js \
            src/features/apps/nova-sol57-fresh.js \
            src/features/apps/app-screen.js \
            src/core/firebase-backend.js; do
            cmp --silent "fresh-rebuild/$rel" "NexusNovaAndroid/app/src/main/assets/www/$rel" || {
              echo "Android asset mismatch: $rel" >&2
              exit 1
            }
            echo "MATCH $rel"
          done
          grep -Fq "https://nexusnova-brain-router.fahadsoomro123.workers.dev" NexusNovaAndroid/app/src/main/assets/www/src/nova57-atomic-backend-client.js
          grep -Fq "requireFreshAppCheck" NexusNovaAndroid/app/src/main/assets/www/src/nova57-atomic-backend-client.js
          grep -Fq "'X-Firebase-AppCheck': appCheckToken" NexusNovaAndroid/app/src/main/assets/www/src/nova57-atomic-backend-client.js
          grep -Fq "const ROUTER_PROFILE = 'NOVA 5.7 Sol / ARIM'" NexusNovaAndroid/app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          echo 'Canonical NOVA source is bundled byte-for-byte into Android assets.'

      - name: Compile current Android source without APK packaging
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          /tmp/gradle-8.13/bin/gradle \
            :app:processDebugMainManifest \
            :app:compileDebugKotlin \
            --no-daemon --stacktrace
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          echo 'Current Android source compiles; no APK was packaged.'

      - name: Verify protected domains unchanged in this preflight
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD | tee /tmp/preflight-diff.txt
          if grep -Ei '(^|/)(mining|mine|rewards?|wallet|nvx)(/|\.|-|_)' /tmp/preflight-diff.txt; then
            echo 'Protected mining/reward/wallet/NVX path changed.' >&2
            exit 1
          fi
          echo 'Protected domains untouched.'

      - name: Self-clean preflight runner
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git rm .github/workflows/nova57-phone-preflight-once.yml
          git config user.name 'NexusNova Preflight Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove one-time NOVA phone preflight runner'
          git push origin HEAD:nova-sol57-pro-v128
