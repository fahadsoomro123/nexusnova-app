name: NOVA 5.7 Phone Proof Latency Fix

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-phone-proof-latency-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch phone proof race and bound direct fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  print(f'{label}: already applied')
                  return
              if old not in s:
                  raise SystemExit(f'{label}: anchor missing')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: patched')

          backend = 'fresh-rebuild/src/nova57-atomic-backend-client.js'
          replace_once(
              backend,
              """let backendCoolingUntil = 0;\n""",
              """let backendCoolingUntil = 0;\nlet relayProofCache = { kind: '', token: '', expiresAt: 0 };\n""",
              'relay proof cache'
          )

          anchor = """async function freshFirebaseAuthToken() {\n  if (typeof document === 'undefined') return '';\n  try {\n    const firebase = await import('./core/firebase-backend.js');\n    const user = firebase?.firebaseAuth?.currentUser\n      || (typeof firebase?.waitForFirebaseUser === 'function' ? await firebase.waitForFirebaseUser(900) : null);\n    if (!user || typeof user.getIdToken !== 'function') return '';\n    return String(await user.getIdToken(false) || '').trim();\n  } catch (error) {\n    console.warn('[NOVA Relay] Firebase Auth proof unavailable.', error);\n    return '';\n  }\n}\n"""
          replacement = anchor + """\nasync function firstRelayProof() {\n  if (relayProofCache.token && relayProofCache.expiresAt > Date.now() + 30_000) {\n    return { kind: relayProofCache.kind, token: relayProofCache.token };\n  }\n\n  // Android WebView token acquisition is slower than desktop CI. Start both\n  // acceptable proofs together and continue as soon as either succeeds.\n  // Never force the native bridge into the old 1.4s cutoff.\n  const tasks = [\n    bounded(freshFirebaseAuthToken(), 4200)\n      .then(token => ({ kind: 'auth', token: String(token || '').trim() }))\n      .catch(() => ({ kind: 'auth', token: '' })),\n    bounded(freshAppCheckToken(), 4200)\n      .then(token => ({ kind: 'appcheck', token: String(token || '').trim() }))\n      .catch(() => ({ kind: 'appcheck', token: '' }))\n  ];\n\n  return new Promise(resolve => {\n    let pending = tasks.length;\n    let settled = false;\n    const finish = proof => {\n      if (settled) return;\n      if (proof?.token) {\n        settled = true;\n        relayProofCache = { ...proof, expiresAt: Date.now() + 8 * 60_000 };\n        resolve(proof);\n        return;\n      }\n      pending -= 1;\n      if (pending <= 0) {\n        settled = true;\n        resolve(null);\n      }\n    };\n    tasks.forEach(task => task.then(finish));\n    setTimeout(() => {\n      if (!settled) {\n        settled = true;\n        resolve(null);\n      }\n    }, 4300);\n  });\n}\n"""
          replace_once(backend, anchor, replacement, 'parallel phone relay proof')

          replace_once(
              backend,
              """  const [appCheckToken, authToken] = await Promise.all([\n    bounded(freshAppCheckToken(), 1400).catch(() => ''),\n    bounded(freshFirebaseAuthToken(), 1400).catch(() => '')\n  ]);\n  if (!appCheckToken && !authToken) throw new Error('NOVA relay authentication is unavailable.');\n\n  const allowed = new Set(['general', 'coding', 'reasoning', 'research', 'multilingual']);\n  const capability = allowed.has(String(options.capability || '')) ? String(options.capability) : capabilityOf(value);\n  const headers = {};\n  if (appCheckToken) headers['X-Firebase-AppCheck'] = appCheckToken;\n  if (authToken) headers.Authorization = `Bearer ${authToken}`;\n""",
              """  const proof = await firstRelayProof();\n  if (!proof?.token) throw new Error('NOVA relay authentication is unavailable.');\n\n  const allowed = new Set(['general', 'coding', 'reasoning', 'research', 'multilingual']);\n  const capability = allowed.has(String(options.capability || '')) ? String(options.capability) : capabilityOf(value);\n  const headers = proof.kind === 'appcheck'\n    ? { 'X-Firebase-AppCheck': proof.token }\n    : { Authorization: `Bearer ${proof.token}` };\n""",
              'remove 1.4s proof cutoff'
          )

          orchestrator = 'fresh-rebuild/src/nova57-pro-orchestrator.js'
          replace_once(
              orchestrator,
              """async function generateForRuntime(model, prompt, capability, options = {}) {\n""",
              """async function boundedGeneration(promise, timeoutMs, label) {\n  let timer;\n  try {\n    return await Promise.race([\n      promise,\n      new Promise((_, reject) => {\n        timer = setTimeout(() => reject(new Error(`${label} exceeded ${timeoutMs}ms.`)), timeoutMs);\n      })\n    ]);\n  } finally {\n    if (timer) clearTimeout(timer);\n  }\n}\n\nasync function generateForRuntime(model, prompt, capability, options = {}) {\n""",
              'bounded generation helper'
          )

          replace_once(
              orchestrator,
              """  return model.generateContent(prompt);\n}\n""",
              """  // Relay failure must never fall into a minutes-long Firebase/WebView wait.\n  // The direct router has its own adaptive attempts; cap the whole safety path.\n  return boundedGeneration(model.generateContent(prompt), 9500, 'NOVA direct fallback');\n}\n""",
              'bound direct fallback'
          )
          PY

          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          node --check fresh-rebuild/src/nova57-pro-orchestrator.js
          grep -Fq "firstRelayProof" fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "4200" fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "NOVA direct fallback" fresh-rebuild/src/nova57-pro-orchestrator.js
          if grep -Fq "bounded(freshAppCheckToken(), 1400)" fresh-rebuild/src/nova57-atomic-backend-client.js; then
            echo 'Old 1.4s relay proof cutoff still present' >&2
            exit 1
          fi

      - name: Commit exact phone latency fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Runtime Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/nova57-atomic-backend-client.js fresh-rebuild/src/nova57-pro-orchestrator.js
          if git diff --cached --quiet; then
            echo 'Phone proof latency fix already applied.'
            exit 0
          fi
          git commit -m '[NOVA] Fix Android relay proof cutoff and endless fallback wait'
          git pull --rebase origin nova-sol57-pro-v128
          git push origin HEAD:nova-sol57-pro-v128
