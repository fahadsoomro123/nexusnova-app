name: NOVA 5.7 Phone Test APK

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-phone-test-apk.yml'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDrivePermissionActivity.kt'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/src/core/drive-cloud-store.js'
      - 'fresh-rebuild/src/core/drive-track-persistence.js'
      - 'fresh-rebuild/src/drive-background-sync.js'
      - 'fresh-rebuild/src/features/apps/premium-drive-native-v2.js'
      - 'fresh-rebuild/src/features/hub/hub-screen.js'
      - 'fresh-rebuild/src/nova57-atomic-backend-client.js'
      - 'fresh-rebuild/src/nova57-atomic-brain-pool.js'
      - 'fresh-rebuild/src/features/apps/nova57-control-center.js'
      - 'fresh-rebuild/assets/styles/nova57-control-center.css'
      - 'fresh-rebuild/src/features/apps/nova-sol57-fresh.js'
      - 'fresh-rebuild/src/nova57-pro-orchestrator.js'
      - 'fresh-rebuild/src/nova57-atomic-chain.js'

permissions:
  contents: write

concurrency:
  group: nova57-phone-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact latest NOVA source and dashboard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/nova57-atomic-chain.js
          test -s fresh-rebuild/src/nova57-atomic-brain-pool.js
          test -s fresh-rebuild/src/nova57-atomic-backend-client.js
          test -s fresh-rebuild/src/nova57-pro-orchestrator.js
          test -s fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          test -s fresh-rebuild/src/features/apps/nova57-control-center.js
          test -s fresh-rebuild/assets/styles/nova57-control-center.css
          test -s cloudflare/nova-brain-worker/src/index.js
          node --check fresh-rebuild/src/nova57-pro-orchestrator.js
          node --check fresh-rebuild/src/nova57-atomic-backend-client.js
          node --check fresh-rebuild/src/nova57-atomic-brain-pool.js
          node --check fresh-rebuild/src/nova57-atomic-chain.js
          node --check fresh-rebuild/src/features/apps/nova57-control-center.js
          node --check fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          node --check fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          node --check fresh-rebuild/src/core/drive-cloud-store.js
          node --check fresh-rebuild/src/core/drive-track-persistence.js
          node --check fresh-rebuild/src/drive-background-sync.js
          node --check fresh-rebuild/src/features/hub/hub-screen.js
          grep -Fq "NOVA 5.7 Sol / ARIM" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "FIREBASE_FALLBACK_MODEL = 'gemini-3.7-flash'" fresh-rebuild/src/nova57-pro-orchestrator.js
          grep -Fq "const runtimeOptions = providerOptions(options)" fresh-rebuild/src/nova57-pro-orchestrator.js
          grep -Fq "mountNovaControlCenter" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "FINALIZER_RESERVE_MS" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "judge-rescue" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "laneSpan = 1" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "laneSpan," fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "criticCapacity" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "here(?:'s| is)" fresh-rebuild/src/nova57-atomic-brain-pool.js
          grep -Fq "thinking|reasoning|analysis" fresh-rebuild/src/nova57-atomic-brain-pool.js
          grep -Fq "fetchStatus(4500)" fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "fetchStatus(3000)" fresh-rebuild/src/nova57-atomic-backend-client.js
          grep -Fq "value === null || value === undefined || value === ''" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "if (nextStatus) status = nextStatus" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "planRows[index] || plans[capability] || null" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "200K Brains" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Learning Center" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Route Health" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Benchmarks" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Quarantine" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Analytics" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Documentation" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "Support" fresh-rebuild/src/features/apps/nova57-control-center.js
          grep -Fq "route_semantic_dimensions" cloudflare/nova-brain-worker/src/index.js
          grep -Fq "AUTO_PAUSE_AFTER_MS" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq "MODE_BICYCLE" NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq "ACTIVITY_RECOGNITION" NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq "RECOVER" fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          echo "Latest NOVA dashboard + smart Nova Drive + mobile hydration + distinct ARIM lanes: PASS"

      - name: Verify live ARIM registry status
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="$RUNNER_TEMP/nova57-status.json"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 8 --max-time 20 \
            'https://nexusnova-brain-router.fahadsoomro123.workers.dev/v1/status' \
            -o "$STATUS_FILE"
          node - "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data?.ok !== true) throw new Error('ARIM live status did not return ok=true');
          const catalog = Number(data.catalogRecords);
          if (!Number.isFinite(catalog) || catalog < 1) throw new Error(`ARIM catalogRecords invalid: ${data.catalogRecords}`);
          console.log(`ARIM LIVE STATUS PASS — catalogRecords=${catalog}, healthyRoutes=${data.healthyRoutes ?? 'unknown'}, generatedAt=${data.generatedAt ?? 'unknown'}`);
          NODE

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          grep -Fq "mountNovaControlCenter" app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          grep -Fq "FIREBASE_FALLBACK_MODEL = 'gemini-3.7-flash'" app/src/main/assets/www/src/nova57-pro-orchestrator.js
          grep -Fq "fetchStatus(4500)" app/src/main/assets/www/src/nova57-atomic-backend-client.js
          grep -Fq "fetchStatus(3000)" app/src/main/assets/www/src/nova57-atomic-backend-client.js
          grep -Fq "value === null || value === undefined || value === ''" app/src/main/assets/www/src/features/apps/nova57-control-center.js
          grep -Fq "if (nextStatus) status = nextStatus" app/src/main/assets/www/src/features/apps/nova57-control-center.js
          grep -Fq "planRows[index] || plans[capability] || null" app/src/main/assets/www/src/features/apps/nova57-control-center.js
          grep -Fq "laneSpan = 1" app/src/main/assets/www/src/nova57-atomic-chain.js
          grep -Fq "laneSpan," app/src/main/assets/www/src/nova57-atomic-chain.js
          grep -Fq "here(?:'s| is)" app/src/main/assets/www/src/nova57-atomic-brain-pool.js
          grep -Fq "200K Brains" app/src/main/assets/www/src/features/apps/nova57-control-center.js
          grep -Fq "Quarantine" app/src/main/assets/www/src/features/apps/nova57-control-center.js
          grep -Fq "FINALIZER_RESERVE_MS" app/src/main/assets/www/src/nova57-atomic-chain.js
          grep -Fq "drive-background-sync.js" app/src/main/assets/www/index.html
          grep -Fq "AUTO-DETECT READY" app/src/main/assets/www/src/features/apps/premium-drive-native-v2.js
          mkdir -p "$GITHUB_WORKSPACE/phone-apk"
          cp "$APK" "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk"
          sha256sum "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk" > "$GITHUB_WORKSPACE/phone-apk/SHA256.txt"
          APK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk")
          printf 'Source commit: %s\nBranch: %s\nBuild type: debug/installable phone test\nAPK bytes: %s\nNOVA 5.7 ARIM source staged: PASS\nSmart Nova Drive native compile: PASS\nNova Drive zero-scroll dashboard staged: PASS\nNova Track merged + recovery staged: PASS\nLive ARIM registry status: PASS\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$APK_SIZE" > "$GITHUB_WORKSPACE/phone-apk/BUILD-STATUS.txt"

      - name: Publish phone APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-phone-apk-publish"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf nova57-phone-test
          mkdir -p nova57-phone-test
          cp -a "$GITHUB_WORKSPACE/phone-apk"/. nova57-phone-test/
          git add -A nova57-phone-test/BUILD-STATUS.txt nova57-phone-test/SHA256.txt
          git add -f nova57-phone-test/NexusNova-NOVA57-LATEST-phone-test.apk
          test -s nova57-phone-test/NexusNova-NOVA57-LATEST-phone-test.apk
          git commit -m "Publish NOVA 5.7 phone test APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
