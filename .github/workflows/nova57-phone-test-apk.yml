name: NOVA 5.7 Phone Test APK

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-phone-test-apk.yml'

permissions:
  contents: read

concurrency:
  group: nova57-phone-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest NOVA branch
        uses: actions/checkout@v6

      - name: Verify exact latest NOVA source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/nova57-atomic-chain.js
          test -s fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          test -s fresh-rebuild/src/features/apps/nova57-control-center.js
          test -s cloudflare/nova-brain-worker/src/index.js
          grep -Fq "NOVA 5.7 Sol / ARIM" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "mountNovaControlCenter" fresh-rebuild/src/features/apps/nova-sol57-fresh.js
          grep -Fq "FINALIZER_RESERVE_MS" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "judge-rescue" fresh-rebuild/src/nova57-atomic-chain.js
          grep -Fq "route_semantic_dimensions" cloudflare/nova-brain-worker/src/index.js
          echo "Latest NOVA source anchors: PASS"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          grep -Fq "mountNovaControlCenter" app/src/main/assets/www/src/features/apps/nova-sol57-fresh.js
          grep -Fq "FINALIZER_RESERVE_MS" app/src/main/assets/www/src/nova57-atomic-chain.js
          mkdir -p "$GITHUB_WORKSPACE/phone-apk"
          cp "$APK" "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk"
          sha256sum "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk" > "$GITHUB_WORKSPACE/phone-apk/SHA256.txt"
          printf 'Source commit: %s\nBranch: %s\nBuild type: debug/installable phone test\nNOVA 5.7 ARIM source staged: PASS\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$GITHUB_WORKSPACE/phone-apk/BUILD-STATUS.txt"

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-NOVA57-LATEST-phone-test
          path: phone-apk/
          if-no-files-found: error
          retention-days: 7
