name: NOVA 5.7 Phone Test APK

on:
  workflow_dispatch:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/nova57-phone-test-apk.yml'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - 'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDrivePermissionActivity.kt'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/src/core/drive-cloud-store.js'
      - 'fresh-rebuild/src/core/drive-track-persistence.js'
      - 'fresh-rebuild/src/drive-background-sync.js'
      - 'fresh-rebuild/src/features/apps/premium-drive-native-v2.js'
      - 'fresh-rebuild/src/nova-drive-approved-ui-v2.js'
      - 'fresh-rebuild/src/nova-drive-final-approved-v5.js'
      - 'fresh-rebuild/src/nova-drive-final-v7-fit.js'
      - 'fresh-rebuild/assets/styles/nova-drive-final-v7-fit.css'

permissions:
  contents: write

concurrency:
  group: nova57-phone-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest NOVA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify current Nova Drive source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "nova-sol57-pro-v128"
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          test -s fresh-rebuild/src/nova-drive-approved-ui-v2.js
          test -s fresh-rebuild/src/nova-drive-final-approved-v5.js
          test -s fresh-rebuild/src/nova-drive-final-v7-fit.js
          test -s fresh-rebuild/assets/styles/nova-drive-final-v7-fit.css
          test -s NexusNovaAndroid/app/src/main/AndroidManifest.xml
          test -s NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          node --check fresh-rebuild/src/features/apps/premium-drive-native-v2.js
          node --check fresh-rebuild/src/nova-drive-approved-ui-v2.js
          node --check fresh-rebuild/src/nova-drive-final-approved-v5.js
          node --check fresh-rebuild/src/nova-drive-final-v7-fit.js
          node --check fresh-rebuild/src/core/drive-cloud-store.js
          node --check fresh-rebuild/src/core/drive-track-persistence.js
          node --check fresh-rebuild/src/drive-background-sync.js
          grep -Fq 'nova-drive-final-v7-fit.css' fresh-rebuild/index.html
          grep -Fq 'nova-drive-final-v7-fit.js' fresh-rebuild/index.html
          grep -Fq 'android:screenOrientation="fullSensor"' NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq 'orientation|screenSize|smallestScreenSize|keyboardHidden' NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq 'ACTIVITY_RECOGNITION' NexusNovaAndroid/app/src/main/AndroidManifest.xml
          grep -Fq 'AUTO_PAUSE_AFTER_MS' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          echo "Current Nova Drive/Tracker responsive + native rotation source: PASS"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd NexusNovaAndroid
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s app/src/main/assets/www/index.html
          grep -Fq 'drive-background-sync.js' app/src/main/assets/www/index.html
          grep -Fq 'nova-drive-final-v7-fit.css' app/src/main/assets/www/index.html
          grep -Fq 'nova-drive-final-v7-fit.js' app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/src/nova-drive-final-v7-fit.js
          test -s app/src/main/assets/www/assets/styles/nova-drive-final-v7-fit.css
          node --check app/src/main/assets/www/src/nova-drive-final-v7-fit.js
          mkdir -p "$GITHUB_WORKSPACE/phone-apk"
          cp "$APK" "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk"
          sha256sum "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk" > "$GITHUB_WORKSPACE/phone-apk/SHA256.txt"
          APK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/phone-apk/NexusNova-NOVA57-LATEST-phone-test.apk")
          printf 'Source commit: %s\nBranch: %s\nBuild type: debug/installable phone test\nAPK bytes: %s\nNova Drive v7 no-crop web assets staged: PASS\nNova Drive native compile: PASS\nMainActivity sensor rotation source: PASS\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$APK_SIZE" > "$GITHUB_WORKSPACE/phone-apk/BUILD-STATUS.txt"

      - name: Publish phone APK to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-phone-apk-publish"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf nova57-phone-test
          mkdir -p nova57-phone-test
          cp -a "$GITHUB_WORKSPACE/phone-apk"/. nova57-phone-test/
          git add -A nova57-phone-test/BUILD-STATUS.txt nova57-phone-test/SHA256.txt
          git add -f nova57-phone-test/NexusNova-NOVA57-LATEST-phone-test.apk
          test -s nova57-phone-test/NexusNova-NOVA57-LATEST-phone-test.apk
          git commit -m "Publish NOVA 5.7 phone test APK $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds
