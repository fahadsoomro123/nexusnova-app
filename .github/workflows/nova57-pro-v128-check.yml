name: NOVA 5.7 Pro v128 Source Check

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - 'fresh-rebuild/src/features/apps/nova57-task-status.js'
      - 'fresh-rebuild/src/nova57-web-research-router-compat.js'
      - 'fresh-rebuild/src/nova57-github-public-router-compat.js'
      - 'fresh-rebuild/src/nova57-keyless-max-router-compat.js'
      - 'fresh-rebuild/src/nova57-puter-keyless-provider.js'
      - '.github/workflows/nova57-pro-v128-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated professional NOVA delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nova-sol57-polish-v127
          mapfile -t changed < <(git diff --name-only origin/nova-sol57-polish-v127...HEAD)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/nova57-pro-v128-check.yml|\
              fresh-rebuild/src/features/apps/nova57-task-status.js|\
              fresh-rebuild/src/nova57-web-research-router-compat.js|\
              fresh-rebuild/src/nova57-github-public-router-compat.js|\
              fresh-rebuild/src/nova57-keyless-max-router-compat.js|\
              fresh-rebuild/src/nova57-puter-keyless-provider.js) ;;
              *) echo "Unexpected v128 change: $f"; exit 1 ;;
            esac
          done

          node --input-type=module --check < fresh-rebuild/src/features/apps/nova57-task-status.js
          node --input-type=module --check < fresh-rebuild/src/nova57-web-research-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-github-public-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-keyless-max-router-compat.js
          node --input-type=module --check < fresh-rebuild/src/nova57-puter-keyless-provider.js

          grep -Fq "nova57:activity" fresh-rebuild/src/features/apps/nova57-task-status.js
          grep -Fq "__novaFreshnessFailClosed" fresh-rebuild/src/nova57-web-research-router-compat.js
          grep -Fq "__novaGithubFailClosed" fresh-rebuild/src/nova57-github-public-router-compat.js
          grep -Fq "__novaBackgroundDiscovery" fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq "__novaAdaptiveRouting" fresh-rebuild/src/nova57-keyless-max-router-compat.js
          grep -Fq "getPuterVerifiedSeedRoutes" fresh-rebuild/src/nova57-puter-keyless-provider.js

          ! git diff --name-only origin/nova-sol57-polish-v127...HEAD | grep -Eq 'mining|reward|wallet|functions/|NexusOtaWebManager'
          echo 'NOVA v128 professional source checks: PASS'
