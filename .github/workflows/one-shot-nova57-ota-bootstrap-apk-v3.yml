name: One Shot NOVA57 OTA Bootstrap APK v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-nova57-ota-bootstrap-apk-v3.yml'

permissions:
  contents: write

env:
  NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
  NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
  NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
  NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
  NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-release.jks
  VERSION_CODE: '20260830'
  VERSION_NAME: '1.0.2-ota-safe'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova-sol57-pro-v128
          fetch-depth: 0

      - name: Verify OTA source
        shell: bash
        run: |
          set -euo pipefail
          test -s fresh-rebuild/index.html
          test -s fresh-rebuild/assets/styles/nova57-gradient-premium.css
          grep -Fq 'nova57-gradient-premium.css' fresh-rebuild/index.html
          grep -Fq 'MANIFEST_SCHEMA = 2' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore proven permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject version signing and crash-safe release mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,a=re.subn(r'versionCode\s*=\s*\d+','versionCode = '+os.environ['VERSION_CODE'],s,count=1)
          s,b=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "'+os.environ['VERSION_NAME']+'"',s,count=1)
          if a!=1 or b!=1: raise SystemExit('version anchors missing')
          block='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in s:
              s=s.replace('    buildTypes {\n',block+'    buildTypes {\n',1)
          line='            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if line not in s:
              s=s.replace('        release {\n','        release {\n'+line,1)
          s,c=re.subn(r'isMinifyEnabled\s*=\s*true','isMinifyEnabled = false',s,count=1)
          if c!=1: raise SystemExit('release minify anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'isMinifyEnabled = false' NexusNovaAndroid/app/build.gradle.kts

      - name: Build signed crash-safer release
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and Gradient Premium bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/signature.txt" || grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$GITHUB_WORKSPACE/signature.txt"
          unzip -p "$APK" assets/www/index.html | grep -Fq 'nova57-gradient-premium.css'

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUT"
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk "$OUT/NexusNova-NOVA57-OTA-BOOTSTRAP-v1.0.2-ota-safe-vc20260830.apk"
          sha256sum "$OUT"/*.apk > "$OUT/SHA256.txt"
          cp signature.txt "$OUT/"
          printf 'Source branch: nova-sol57-pro-v128\nSource commit: %s\nSigned release: PASS\nR8/minify: OFF\nAtomic OTA v2: PASS\nGradient Premium bundled: PASS\n' "$(git rev-parse HEAD)" > "$OUT/BUILD-STATUS.txt"

      - name: Publish APK direct to apk-builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          rm -rf /tmp/nx-publish
          git worktree add /tmp/nx-publish origin/apk-builds
          cd /tmp/nx-publish
          rm -rf ota-bootstrap-safe
          mkdir -p ota-bootstrap-safe
          cp -a "$GITHUB_WORKSPACE/output"/. ota-bootstrap-safe/
          git add -A ota-bootstrap-safe/BUILD-STATUS.txt ota-bootstrap-safe/SHA256.txt ota-bootstrap-safe/signature.txt
          git add -f ota-bootstrap-safe/*.apk
          git commit -m "Publish crash-safer NOVA57 OTA bootstrap $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
