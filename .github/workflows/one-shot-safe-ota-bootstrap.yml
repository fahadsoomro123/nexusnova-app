name: One Shot Safe OTA Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-safe-ota-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova-sol57-pro-v128
          fetch-depth: 0

      - name: Patch native OTA bootstrap safely
        shell: bash
        run: |
          set -euo pipefail
          MANAGER='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
          MAIN='NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
          OTA='.github/workflows/nexusnova-ota-web-release.yml'
          git show 69a0e77f8d9973c93abb06c3689460810197ef94:"$MANAGER" > "$MANAGER"
          python3 - <<'PY'
          from pathlib import Path
          import re
          base='0b455023342e94fe8c199ae25c0bcde03af80d59'
          mp=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt')
          ap=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          op=Path('.github/workflows/nexusnova-ota-web-release.yml')

          s=mp.read_text()
          s=s.replace('const val PREFS_NAME = "nexusnova_ota_web_v1"','const val PREFS_NAME = "nexusnova_ota_web_v3_atomic"')
          s=s.replace('const val MANIFEST_SCHEMA = 1','const val MANIFEST_SCHEMA = 2')
          s=s.replace('https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/ota/manifest.json','https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app/nexusnova-ota-release/manifest.json')
          s=s.replace('https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/ota/files/','https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app/nexusnova-ota-release/files/')
          a='''if (manifest.optInt("schema", 0) != MANIFEST_SCHEMA) {
            throw IOException("Unsupported OTA manifest schema")
        }

        val version = manifest.optString("version").trim().lowercase()'''
          b='''if (manifest.optInt("schema", 0) != MANIFEST_SCHEMA) {
            throw IOException("Unsupported OTA manifest schema")
        }
        val base = manifest.optString("base").trim().lowercase()
        if (base != BUNDLED_WEB_BASE) throw IOException("OTA base mismatch")

        val version = manifest.optString("version").trim().lowercase()'''
          if a not in s: raise SystemExit('manager schema anchor missing')
          s=s.replace(a,b,1)
          anchor='        const val ASSET_PATH = "/assets/www/"\n'
          if anchor not in s: raise SystemExit('manager asset anchor missing')
          s=s.replace(anchor,anchor+f'        const val BUNDLED_WEB_BASE = "{base}"\n',1)
          mp.write_text(s)

          s=ap.read_text()
          reps=[
          ('    private var adManager: NexusAdManager? = null\n\n    private val assetLoader by lazy {','    private var adManager: NexusAdManager? = null\n    private val otaWebManager by lazy { NexusOtaWebManager(this) }\n\n    private val assetLoader by lazy {'),
          ('                return assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)','                return otaWebManager.intercept(uri)\n                    ?: assetLoader.shouldInterceptRequest(uri)\n                    ?: super.shouldInterceptRequest(view, request)'),
          ('        loadProductionApp()\n    }\n\n    private fun initializeAdsSafely()','        loadProductionApp()\n        checkForWebUpdate()\n    }\n\n    private fun initializeAdsSafely()'),
          ('                if (didCrash) rendererCrashRecoveries += 1\n','                if (didCrash) {\n                    otaWebManager.rollbackToBundled()\n                    rendererCrashRecoveries += 1\n                }\n')]
          for old,new in reps:
              if old not in s: raise SystemExit('MainActivity anchor missing')
              s=s.replace(old,new,1)
          old='''    private fun loadProductionApp(forceFresh: Boolean = false) {
        usingOfflineFallback = false
        if (forceFresh) webView.clearCache(true)
        val suffix = if (forceFresh) "?androidRecovery=${System.currentTimeMillis()}" else ""
        webView.loadUrl(LOCAL_APP_URL)
    }
'''
          new='''    private fun loadProductionApp(forceFresh: Boolean = false) {
        usingOfflineFallback = false
        if (forceFresh) webView.clearCache(true)
        val suffix = if (forceFresh) "?androidRecovery=${System.currentTimeMillis()}" else ""
        webView.loadUrl(LOCAL_APP_URL + suffix)
    }

    private fun checkForWebUpdate() {
        otaWebManager.checkForUpdate { updated ->
            if (!updated || isFinishing || isDestroyed || !::webView.isInitialized) return@checkForUpdate
            webView.post {
                if (!isFinishing && !isDestroyed && ::webView.isInitialized) {
                    webRecoveryAttempts = 0
                    loadProductionApp(forceFresh = true)
                }
            }
        }
    }
'''
          if old not in s: raise SystemExit('loadProductionApp anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('if (!isProductionOrigin(uri) || usingOfflineFallback) return','if (!isTrustedAppPage(uri) || usingOfflineFallback) return')
          s=s.replace('if (!isProductionOrigin(failed.url)) return','if (!isTrustedAppPage(failed.url)) return')
          old='''        // A technically successful but visually blank remote page is just as unusable
        // as a network failure. Fall back to the bundled shell instead of leaving the
        // user on an empty WebView. Value-bearing mining remains disabled offline.
        usingOfflineFallback = true
        mainFrameWatchdogToken += 1
        target.stopLoading()
        target.loadUrl(LOCAL_APP_URL)
        android.util.Log.w("NexusNovaWeb", "Using local fallback after $reason")
'''
          new='''        val rolledBackOta = otaWebManager.rollbackToBundled()
        usingOfflineFallback = true
        mainFrameWatchdogToken += 1
        target.stopLoading()
        target.clearCache(true)
        target.loadUrl(LOCAL_APP_URL + "?otaRollback=${System.currentTimeMillis()}")
        android.util.Log.w("NexusNovaWeb", "Using bundled fallback after $reason; otaRollback=$rolledBackOta")
'''
          if old not in s: raise SystemExit('rollback anchor missing')
          s=s.replace(old,new,1)
          ap.write_text(s)

          s=op.read_text()
          s,n=re.subn(r'OTA_BUNDLED_BASE: [0-9a-f]{40}',f'OTA_BUNDLED_BASE: {base}',s,count=1)
          if n!=1: raise SystemExit('OTA base anchor missing')
          old='''          if [ "$count" -lt 1 ]; then
            echo 'No web files differ from the bundled OTA baseline.' >&2
            exit 1
          fi

          python3 - <<'PY'
'''
          new='''          if [ ! -f /tmp/nexusnova-ota-package/files/index.html ]; then
            cp fresh-rebuild/index.html /tmp/nexusnova-ota-package/files/index.html
            count=$((count + 1))
          fi

          if [ "$count" -lt 1 ]; then
            echo 'No web files available for OTA.' >&2
            exit 1
          fi

          export OTA_DIFF_BASE="$BASE"
          python3 - <<'PY'
'''
          if old not in s: raise SystemExit('OTA package anchor missing')
          s=s.replace(old,new,1)
          old="""          manifest = {
              'schema': 1,
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
"""
          new="""          manifest = {
              'schema': 2,
              'base': os.environ['OTA_DIFF_BASE'],
              'version': os.environ['GITHUB_SHA'],
              'files': files,
          }
"""
          if old not in s: raise SystemExit('OTA manifest anchor missing')
          s=s.replace(old,new,1)
          op.write_text(s)
          PY

      - name: Verify and push target branch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'otaWebManager.intercept(uri)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'checkForWebUpdate()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'nexusnova_ota_web_v3_atomic' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'OTA base mismatch' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq "'schema': 2" .github/workflows/nexusnova-ota-web-release.yml
          git diff --check
          git config user.name 'NexusNova OTA Bootstrap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt .github/workflows/nexusnova-ota-web-release.yml
          git commit -m 'Enable safe atomic web OTA bootstrap'
          git push origin HEAD:nova-sol57-pro-v128
