name: One-time bundled WebView cleanup

on:
  push:
    branches: [nexusnova-latest-full-apk-recovery-20260823]
    paths: ['.github/workflows/one-time-bundled-webview-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale remote WebView recovery path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s = main.read_text(encoding='utf-8')

          def exact(old, new, label, count=1):
              global s
              found = s.count(old)
              if found != count:
                  raise SystemExit(f'{label}: expected {count}, found {found}')
              s = s.replace(old, new)

          exact('import android.webkit.WebResourceError\n', '', 'unused WebResourceError import')
          exact(
              '    private var usingOfflineFallback = false\n'
              '    private var mainFrameWatchdogToken = 0\n'
              '    private var finishedWatchdogToken = -1\n'
              '    private var webRecoveryAttempts = 0\n'
              '    private var rendererCrashRecoveries = 0\n',
              '    private var rendererCrashRecoveries = 0\n',
              'stale recovery state block'
          )
          exact('        loadProductionApp()\n', '        loadBundledApp()\n', 'bundled app launch calls', count=2)

          page_watch = '''            override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                super.onPageStarted(view, url, favicon)
                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return
                if (!isProductionOrigin(uri) || usingOfflineFallback) return
                armMainFrameWatchdog(view ?: return)
            }

            override fun onPageFinished(view: WebView?, url: String?) {
                super.onPageFinished(view, url)
                val target = view ?: return
                val uri = url?.let { runCatching { Uri.parse(it) }.getOrNull() } ?: return
                if (!isProductionOrigin(uri) || usingOfflineFallback) return
                finishedWatchdogToken = mainFrameWatchdogToken
                scheduleBlankScreenCheck(target, mainFrameWatchdogToken)
            }

'''
          exact(page_watch, '', 'remote page watchdog callbacks')

          network_recovery = '''            override fun onReceivedError(
                view: WebView?,
                request: WebResourceRequest?,
                error: WebResourceError?
            ) {
                super.onReceivedError(view, request, error)
                val failed = request ?: return
                if (!failed.isForMainFrame || usingOfflineFallback) return
                if (!isProductionOrigin(failed.url)) return

                recoverProductionWebView(view, "main-frame network error")
            }

            override fun onReceivedHttpError(
                view: WebView?,
                request: WebResourceRequest?,
                errorResponse: WebResourceResponse?
            ) {
                super.onReceivedHttpError(view, request, errorResponse)
                val failed = request ?: return
                val status = errorResponse?.statusCode ?: return
                if (!failed.isForMainFrame || status < 400 || usingOfflineFallback) return
                if (!isProductionOrigin(failed.url)) return
                recoverProductionWebView(view, "HTTP $status")
            }

'''
          exact(network_recovery, '', 'remote network recovery callbacks')
          exact(
              '                // at least prove the top-level document remains one of our two exact\n'
              '                // trusted app locations before opening the picker.\n',
              '                // at least prove the top-level document remains the trusted bundled\n'
              '                // app location before opening the picker.\n',
              'file chooser trust comment'
          )

          pattern = re.compile(
              r'\n    private fun loadProductionApp\(forceFresh: Boolean = false\) \{.*?\n    private fun installNativeMessageListener\(\) \{',
              re.S,
          )
          replacement = '''
    private fun loadBundledApp() {
        webView.loadUrl(LOCAL_APP_URL)
    }

    private fun installNativeMessageListener() {'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'stale recovery methods: expected 1 block, found {n}')

          exact(
              '        val trustedOrigins = setOf(LOCAL_APP_ORIGIN, PRODUCTION_APP_ORIGIN)\n',
              '        val trustedOrigins = setOf(LOCAL_APP_ORIGIN)\n',
              'native bridge trusted origins'
          )

          origins = '''    private fun isProductionOrigin(uri: Uri): Boolean =
        isHttpsDefaultPort(uri) && uri.host.equals(PRODUCTION_HOST, ignoreCase = true)

    private fun isTrustedOrigin(uri: Uri): Boolean =
        isLocalOrigin(uri) || isProductionOrigin(uri)

    private fun isTrustedAppPage(uri: Uri): Boolean = when {
        isLocalOrigin(uri) -> uri.path?.startsWith(ASSET_PATH) == true
        isProductionOrigin(uri) -> uri.path?.startsWith(PRODUCTION_PATH) == true
        else -> false
    }
'''
          exact(
              origins,
              '''    private fun isTrustedOrigin(uri: Uri): Boolean = isLocalOrigin(uri)

    private fun isTrustedAppPage(uri: Uri): Boolean =
        isLocalOrigin(uri) && uri.path?.startsWith(ASSET_PATH) == true
''',
              'remote origin trust helpers'
          )

          production_constants = '''
        const val PRODUCTION_HOST = "fahadsoomro123.github.io"
        const val PRODUCTION_APP_ORIGIN = "https://fahadsoomro123.github.io"
        const val PRODUCTION_PATH = "/nexusnova-app/"
        const val PRODUCTION_APP_URL = "https://fahadsoomro123.github.io/nexusnova-app/"
'''
          exact(production_constants, '', 'production origin constants')

          watchdog_constants = '''        const val MAIN_FRAME_LOAD_TIMEOUT_MS = 12_000L
        const val BLANK_SCREEN_GRACE_MS = 3_500L
        const val WEB_RECOVERY_RELOAD_DELAY_MS = 350L
        const val MAX_WEB_RECOVERY_ATTEMPTS = 1
'''
          exact(watchdog_constants, '', 'remote watchdog constants')

          blank_probe = re.compile(
              r'        const val BLANK_SCREEN_PROBE = """.*?        """\n\n',
              re.S,
          )
          s, n = blank_probe.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'blank-screen probe: expected 1, found {n}')

          forbidden = [
              'loadProductionApp', 'usingOfflineFallback', 'mainFrameWatchdogToken',
              'finishedWatchdogToken', 'webRecoveryAttempts', 'recoverProductionWebView',
              'PRODUCTION_APP_ORIGIN', 'PRODUCTION_HOST', 'BLANK_SCREEN_PROBE',
              'androidRecovery=',
          ]
          leftovers = [token for token in forbidden if token in s]
          if leftovers:
              raise SystemExit('stale MainActivity tokens remain: ' + ', '.join(leftovers))
          if s.count('loadBundledApp()') != 3:
              raise SystemExit('expected loadBundledApp declaration + 2 calls')
          main.write_text(s, encoding='utf-8')

          workflow = Path('.github/workflows/nexusnova-latest-fresh-full-apk.yml')
          w = workflow.read_text(encoding='utf-8')
          freeze = '''      - name: Freeze launcher to bundled latest fresh SPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='        loadProductionApp()\\n'
          new='        usingOfflineFallback = true\\n        webView.loadUrl(LOCAL_APP_URL)\\n'
          if old not in s:
              raise SystemExit('latest MainActivity startup anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'webView.loadUrl(LOCAL_APP_URL)' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

'''
          if w.count(freeze) != 1:
              raise SystemExit(f'APK workflow freeze block: expected 1, found {w.count(freeze)}')
          w = w.replace(freeze, '')
          workflow.write_text(w, encoding='utf-8')
          PY

          rm .github/workflows/one-time-bundled-webview-cleanup.yml

          grep -Fq 'private fun loadBundledApp()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'PRODUCTION_APP_ORIGIN' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'loadProductionApp' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          ! grep -Fq 'Freeze launcher to bundled latest fresh SPA' .github/workflows/nexusnova-latest-fresh-full-apk.yml

      - name: Commit cleaned native source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt \
            .github/workflows/nexusnova-latest-fresh-full-apk.yml \
            .github/workflows/one-time-bundled-webview-cleanup.yml
          git commit -m 'fix: remove stale remote WebView recovery path'
          git pull --rebase origin nexusnova-latest-full-apk-recovery-20260823
          git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823
