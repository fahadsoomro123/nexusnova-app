name: One-time public-build full sync

on:
  push:
    branches:
      - migration-public-build-full-sync-20260910
    paths:
      - .github/workflows/one-time-public-build-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original repo branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration-public-build-full-sync-20260910

      - name: Clone complete public-build snapshot
        run: |
          set -euo pipefail
          rm -rf /tmp/nexusnova-app-public-build
          git clone --depth 1 --branch main https://github.com/fahadsoomro123/nexusnova-app-public-build.git /tmp/nexusnova-app-public-build

      - name: Copy every non-workflow public-build file
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/nexusnova-app-public-build/ ./

      - name: Stage public workflow files safely for later exact relocation
        run: |
          set -euo pipefail
          rm -rf .migration/public-workflows
          mkdir -p .migration/public-workflows
          rsync -a /tmp/nexusnova-app-public-build/.github/workflows/ .migration/public-workflows/

      - name: Verify every source file matches byte-for-byte
        run: |
          set -euo pipefail
          while IFS= read -r -d '' src; do
            rel="${src#/tmp/nexusnova-app-public-build/}"
            if [[ "$rel" == .github/workflows/* ]]; then
              dst=".migration/public-workflows/${rel#.github/workflows/}"
            else
              dst="$rel"
            fi
            if [ ! -f "$dst" ]; then
              echo "MISSING: $rel"
              exit 1
            fi
            if ! cmp -s "$src" "$dst"; then
              echo "MISMATCH: $rel"
              exit 1
            fi
          done < <(find /tmp/nexusnova-app-public-build -type f -not -path '/tmp/nexusnova-app-public-build/.git/*' -print0)

      - name: Commit complete migrated snapshot staging
        run: |
          set -euo pipefail
          git config user.name "NexusNova Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes were required."
          else
            git commit -m "sync: stage complete public-build snapshot in original repo [skip ci]"
            git push origin HEAD:migration-public-build-full-sync-20260910
          fi
