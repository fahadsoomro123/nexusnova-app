name: One-time Public OTA Bootstrap v2

on:
  push:
    branches: [nova-sol57-pro-v128]
    paths:
      - '.github/workflows/one-time-public-ota-bootstrap-v2.yml'

permissions:
  contents: write

env:
  VERSION_CODE: '20260830'
  VERSION_NAME: '1.0.3-ota-public'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUSNOVA_SIGNING_KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      NEXUSNOVA_SIGNING_STORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      NEXUSNOVA_SIGNING_KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      NEXUSNOVA_SIGNING_KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
      NEXUSNOVA_SIGNING_STORE_FILE: /tmp/nexusnova-release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public OTA source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nexusnova-website/nexusnova-ota-public/ota/manifest.json' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'BUNDLED_WEB_BASE = "b6eb3d191ee35b58c0ffe14334674ea2c60d3b72"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          grep -Fq 'premium-mine-tactile-3d.css' fresh-rebuild/index.html
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/manifest.json' -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/manifest.json',encoding='utf-8'))
          assert data['schema']==2
          assert data['base']=='b6eb3d191ee35b58c0ffe14334674ea2c60d3b72'
          assert any(x['path']=='index.html' for x in data['files'])
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUSNOVA_SIGNING_KEYSTORE_B64"
          test -n "$NEXUSNOVA_SIGNING_STORE_PASSWORD"
          test -n "$NEXUSNOVA_SIGNING_KEY_ALIAS"
          test -n "$NEXUSNOVA_SIGNING_KEY_PASSWORD"

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXUSNOVA_SIGNING_KEYSTORE_B64" | base64 --decode > "$NEXUSNOVA_SIGNING_STORE_FILE"
          test -s "$NEXUSNOVA_SIGNING_STORE_FILE"
          chmod 600 "$NEXUSNOVA_SIGNING_STORE_FILE"
          keytool -list -keystore "$NEXUSNOVA_SIGNING_STORE_FILE" -storepass "$NEXUSNOVA_SIGNING_STORE_PASSWORD" -alias "$NEXUSNOVA_SIGNING_KEY_ALIAS" >/dev/null

      - name: Inject release signing and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          t,n1=re.subn(r'versionCode\s*=\s*\d+',f"versionCode = {os.environ['VERSION_CODE']}",t,count=1)
          t,n2=re.subn(r'versionName\s*=\s*"[^"]*"',f"versionName = \"{os.environ['VERSION_NAME']}\"",t,count=1)
          if n1!=1 or n2!=1: raise SystemExit('version patch failed')
          block='''    signingConfigs {\n        create("nexusRelease") {\n            storeFile = file(System.getenv("NEXUSNOVA_SIGNING_STORE_FILE"))\n            storePassword = System.getenv("NEXUSNOVA_SIGNING_STORE_PASSWORD")\n            keyAlias = System.getenv("NEXUSNOVA_SIGNING_KEY_ALIAS")\n            keyPassword = System.getenv("NEXUSNOVA_SIGNING_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'create("nexusRelease")' not in t:
              t=t.replace('    buildTypes {\n',block+'    buildTypes {\n',1)
          signing='            signingConfig = signingConfigs.getByName("nexusRelease")\n'
          if signing not in t:
              t=t.replace('        release {\n','        release {\n'+signing,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Build signed release
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          grep -Fq 'premium-mine-tactile-3d.css' app/src/main/assets/www/index.html

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK='NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -Eq 'Verified using v(2|3) scheme .*: true' signature.txt

      - name: Package bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-ota-bootstrap
          cp NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk public-ota-bootstrap/NexusNova-PUBLIC-OTA-BOOTSTRAP.apk
          sha256sum public-ota-bootstrap/NexusNova-PUBLIC-OTA-BOOTSTRAP.apk > public-ota-bootstrap/SHA256.txt
          cp signature.txt public-ota-bootstrap/signature.txt
          printf 'Source commit: %s\nVersion: %s (%s)\nSigned release: PASS\nPublic OTA endpoint: PASS\nTactile Mine visual bundled: PASS\n' "$GITHUB_SHA" "$VERSION_NAME" "$VERSION_CODE" > public-ota-bootstrap/BUILD-STATUS.txt

      - name: Publish signed bootstrap to apk-builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Signed APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin apk-builds
          PUB="$RUNNER_TEMP/nexusnova-bootstrap-publish"
          rm -rf "$PUB"
          git worktree add "$PUB" origin/apk-builds
          cd "$PUB"
          rm -rf ota-bootstrap
          mkdir -p ota-bootstrap
          cp -a "$GITHUB_WORKSPACE/public-ota-bootstrap"/. ota-bootstrap/
          git add -A ota-bootstrap/BUILD-STATUS.txt ota-bootstrap/SHA256.txt ota-bootstrap/signature.txt
          git add -f ota-bootstrap/NexusNova-PUBLIC-OTA-BOOTSTRAP.apk
          git commit -m "Publish signed public OTA bootstrap $GITHUB_SHA"
          git pull --rebase origin apk-builds
          git push origin HEAD:apk-builds

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$NEXUSNOVA_SIGNING_STORE_FILE"
