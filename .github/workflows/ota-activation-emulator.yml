name: NexusNova OTA Activation Android Emulator

on:
  push:
    branches:
      - agent/video-flagship-complete-20260921
    paths:
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/androidTest/java/com/nexusnova/app/OtaActivationEmulatorQaTest.kt'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - '.github/workflows/ota-activation-emulator.yml'
  workflow_dispatch:

concurrency:
  group: ota-activation-branch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ota-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build current Android test APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot Android 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            for i in $(seq 1 60); do
              if adb shell service check package 2>/dev/null | grep -q 'found'; then
                break
              fi
              sleep 2
            done
            adb shell service check package 2>/dev/null | grep -q 'found'
            adb shell pm list packages >/dev/null
            cd NexusNovaAndroid && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nexusnova.app.OtaActivationEmulatorQaTest
