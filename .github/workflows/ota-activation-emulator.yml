name: NexusNova OTA Activation Android Emulator

on:
  push:
    branches:
      - agent/video-flagship-complete-20260921
    paths:
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
      - 'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
      - 'NexusNovaAndroid/app/src/androidTest/java/com/nexusnova/app/OtaActivationEmulatorQaTest.kt'
      - 'NexusNovaAndroid/app/build.gradle.kts'
      - '.github/workflows/ota-activation-emulator.yml'
  workflow_dispatch:

concurrency:
  group: ota-activation-branch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ota-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build current Android test APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot Android 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: >-
            set -eu; adb wait-for-device; adb shell service check package 2>/dev/null | grep -q 'found'; adb shell pm list packages >/dev/null; cd NexusNovaAndroid; gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nexusnova.app.OtaActivationEmulatorQaTest
