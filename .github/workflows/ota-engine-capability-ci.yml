name: NexusNova OTA Engine Capability CI

on:
  push:
    branches: [ota-engine-ci-exec-20260915]
  pull_request:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/ota-engine-capability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_RELEASE_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: 76fa4bc81be45ab1d53350ea996e85e61518379f82cb9a1ec0e2a19d2e303f25

    steps:
      - name: Checkout exact capability snapshot
        uses: actions/checkout@v4

      - name: Verify capability snapshot and Travel purge invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/OtaPathPolicy.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/NexusOtaWebManagerTest.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/OtaPathPolicyTest.kt
          test -f NexusNovaAndroid/app/src/main/assets/www/assets/icons/nova-hub/travel.webp
          test -f NexusNovaAndroid/app/src/main/res/drawable/ic_travel.xml
          if find NexusNovaAndroid/app/src/main/assets/www -type f -name 'travel-*.js' -print -quit | grep -q .; then
            echo 'Unexpected Travel JS bundle found in APK source tree.' >&2
            exit 1
          fi
          if find NexusNovaAndroid/app/src/main/assets/www -type f -name '*travel*.js' -print -quit | grep -q .; then
            echo 'Unexpected Travel JavaScript asset found in APK source tree.' >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Diagnose Google Maven UMP resolution
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies dependencyInsight --dependency user-messaging-platform --configuration debugRuntimeClasspath

      - name: Run native OTA unit tests
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies --info --stacktrace testDebugUnitTest --tests 'com.nexusnova.app.NexusOtaWebManagerTest' --tests 'com.nexusnova.app.OtaPathPolicyTest'

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode permanent release keystore
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject one-time capability build version for build workspace only
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','26091501',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.38-ota-engine-capability"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s: s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s: s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon clean assembleRelease

      - name: Inspect signed APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          aapt_out="$($AAPT dump badging "$apk")"
          first_badging_line="$(printf '%s\n' "$aapt_out" | sed -n '1p')"
          echo "$first_badging_line"
          echo "$first_badging_line" | grep -q "name='com.nexusnova.app'"
          echo "$first_badging_line" | grep -q "versionCode='26091501'"
          echo "$first_badging_line" | grep -q "versionName='1.0.38-ota-engine-capability'"
          sha256sum "$apk"
          cert="$($APKSIGNER verify --verbose --print-certs "$apk" 2>&1 | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "CERT_SHA256=$cert"
          test "$cert" = "$EXPECTED_CERT_SHA256"
          unzip -l "$apk" | grep -Fq 'assets/www/assets/icons/nova-hub/travel.webp'
          ! unzip -l "$apk" | grep -Eq 'assets/www/src/features/apps/travel-[^ ]*\.js'
          echo 'Signed OTA-engine-only APK verified.'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-OTA-Engine-Upgrade-SIGNED
          path: NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

