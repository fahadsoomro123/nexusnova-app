name: NexusNova OTA Engine Capability CI

on:
  push:
    branches: [ota-engine-ci-exec-20260915]
  pull_request:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/ota-engine-capability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout exact capability snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify capability snapshot and Travel purge invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/OtaPathPolicy.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/NexusOtaWebManagerTest.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/OtaPathPolicyTest.kt
          WEB='fresh-rebuild'
          test -s "$WEB/assets/icons/nova-hub/travel.webp"
          grep -Eq "id: ['\"]travel['\"]" "$WEB/src/features/hub/app-registry.js"
          grep -Fq "const ICON_ONLY_HUB_APP_IDS = new Set(['travel']);" "$WEB/src/features/hub/hub-screen.js"
          grep -Fq 'if (ICON_ONLY_HUB_APP_IDS.has(appId)) return;' "$WEB/src/features/hub/hub-screen.js"
          if find "$WEB/src/features/apps" -maxdepth 1 -type f -name 'travel-*.js' -print | grep -q .; then exit 1; fi
          if find "$WEB/assets/travel" -type f -print 2>/dev/null | grep -q .; then exit 1; fi
          ! grep -Fq './travel-suite.js' "$WEB/src/features/apps/app-screen.js"
          ! grep -Fq './travel-integrations.js' "$WEB/src/features/apps/app-screen.js"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Diagnose Google Maven UMP resolution
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set +e
          set -u
          HOST='maven.google.com'
          POM='https://maven.google.com/com/google/android/ump/user-messaging-platform/4.0.0/user-messaging-platform-4.0.0.pom'
          AAR='https://maven.google.com/com/google/android/ump/user-messaging-platform/4.0.0/user-messaging-platform-4.0.0.aar'
          echo '=== repository configuration ==='
          sed -n '1,200p' settings.gradle.kts
          echo '=== Gradle properties ==='
          sed -n '1,200p' gradle.properties
          echo '=== DNS ==='
          getent ahosts "$HOST"
          echo "getent_exit=$?"
          echo '=== HTTPS headers / redirects: POM ==='
          curl -sS -D /tmp/ump-pom.headers -o /tmp/ump-pom "$POM"
          echo "curl_pom_exit=$?"
          cat /tmp/ump-pom.headers
          echo '=== POM response metadata ==='
          file /tmp/ump-pom
          head -c 200 /tmp/ump-pom; echo
          echo '=== HTTPS headers / redirects: AAR ==='
          curl -sS -D /tmp/ump-aar.headers -o /tmp/ump-aar "$AAR"
          echo "curl_aar_exit=$?"
          cat /tmp/ump-aar.headers
          echo '=== AAR response metadata ==='
          file /tmp/ump-aar
          ls -lh /tmp/ump-aar
          echo '=== curl final/status/content-type/redirect diagnostics ==='
          curl -sS -L -o /dev/null -w 'POM final=%{url_effective} status=%{http_code} type=%{content_type} redirects=%{num_redirects} remote_ip=%{remote_ip}\n' "$POM"
          curl -sS -L -o /dev/null -w 'AAR final=%{url_effective} status=%{http_code} type=%{content_type} redirects=%{num_redirects} remote_ip=%{remote_ip}\n' "$AAR"
          echo '=== Gradle dependencyInsight (with info/stacktrace) ==='
          gradle --no-daemon --refresh-dependencies --info --stacktrace :app:dependencyInsight --dependency com.google.android.ump:user-messaging-platform --configuration debugCompileClasspath
          echo "dependencyInsight_exit=$?"
          echo '=== Gradle repository/resolution diagnostics captured above ==='
          exit 0

      - name: Run native OTA unit tests
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies --info --stacktrace testDebugUnitTest --tests 'com.nexusnova.app.NexusOtaWebManagerTest' --tests 'com.nexusnova.app.OtaPathPolicyTest'

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode permanent release keystore
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          test -s app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Inject one-time capability build version for build workspace only
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','26091501',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.38-ota-engine-capability"',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit('version injection failed')
          signing='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s: s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s: s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: gradle --no-daemon clean assembleRelease

      - name: Inspect signed APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"

          mapfile -t apksigner_candidates < <(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V)
          mapfile -t aapt_candidates < <(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V)
          test "${#apksigner_candidates[@]}" -gt 0
          test "${#aapt_candidates[@]}" -gt 0
          APKSIGNER="${apksigner_candidates[${#apksigner_candidates[@]}-1]}"
          AAPT="${aapt_candidates[${#aapt_candidates[@]}-1]}"
          test -x "$APKSIGNER" || test -f "$APKSIGNER"
          test -x "$AAPT" || test -f "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$apk" > /tmp/apksigner-verify.txt 2>&1
          cat /tmp/apksigner-verify.txt

          "$AAPT" dump badging "$apk" > /tmp/aapt-badging.txt
          first_badging_line="$(sed -n '1p' /tmp/aapt-badging.txt)"
          test -n "$first_badging_line"
          echo "$first_badging_line"
          grep -Fq "name='com.nexusnova.app'" <<<"$first_badging_line"
          grep -Fq "versionCode='26091501'" <<<"$first_badging_line"
          grep -Fq "versionName='1.0.38-ota-engine-capability'" <<<"$first_badging_line"

          sha256sum "$apk"
          cert="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' /tmp/apksigner-verify.txt | tr -d '\r')"
          test -n "$cert"
          echo "CERT_SHA256=$cert"
          test "$cert" = '76fa4bc81be45ab1d53350ea996e85e61518379f82cb9a1ec0e2a19d2e303f25'

          unzip -l "$apk" > /tmp/apk-contents.txt
          grep -Fq 'assets/www/assets/icons/nova-hub/travel.webp' /tmp/apk-contents.txt
          ! grep -Eq 'assets/www/src/features/apps/travel-[^ ]*\.js' /tmp/apk-contents.txt
          echo 'Signed OTA-engine-only APK verified.'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-OTA-Engine-Upgrade-SIGNED
          path: NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
