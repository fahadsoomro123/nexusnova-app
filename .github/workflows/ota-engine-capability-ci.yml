name: NexusNova OTA Engine Capability CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'NexusNovaAndroid/**'
      - '.github/workflows/ota-engine-capability-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout exact capability snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          test -f NexusNovaAndroid/app/src/main/java/com/nexusnova/app/OtaPathPolicy.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/NexusOtaWebManagerTest.kt
          test -f NexusNovaAndroid/app/src/test/java/com/nexusnova/app/OtaPathPolicyTest.kt
          WEB=fresh-rebuild
          test -s "$WEB/assets/icons/nova-hub/travel.webp"
          grep -Eq "id: ['\"]travel['\"]" "$WEB/src/features/hub/app-registry.js"
          grep -Fq "const ICON_ONLY_HUB_APP_IDS = new Set(['travel']);" "$WEB/src/features/hub/hub-screen.js"
          grep -Fq 'if (ICON_ONLY_HUB_APP_IDS.has(appId)) return;' "$WEB/src/features/hub/hub-screen.js"
          ! find "$WEB/src/features/apps" -maxdepth 1 -type f -name 'travel(-*)?.js' -print | grep -q .
          ! find "$WEB/assets/travel" -type f -print 2>/dev/null | grep -q .
          ! grep -Fq './travel-suite.js' "$WEB/src/features/apps/app-screen.js"
          ! grep -Fq './travel-integrations.js' "$WEB/src/features/apps/app-screen.js"
          TEST_AD='ca-app-pub-3940256099942544'
          grep -RIl "$TEST_AD" fresh-rebuild NexusNovaAndroid/app/src 2>/dev/null | head -n 1 >/dev/null
          ! grep -RIEq 'ca-app-pub-[0-9]{16}' NexusNovaAndroid/app/src fresh-rebuild/src 2>/dev/null | grep -v '3940256099942544' | head -n 1

      - name: Setup Java and Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run OTA unit tests
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon testDebugUnitTest --tests 'com.nexusnova.app.NexusOtaWebManagerTest' --tests 'com.nexusnova.app.OtaPathPolicyTest'

      - name: Decode signing key and build
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"; test -n "$KEYSTORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts'); s=p.read_text()
          s,n1=re.subn(r'versionCode\s*=\s*\d+','26091501',s,1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.38-ota-engine-capability"',s,1)
          if n1!=1 or n2!=1: raise SystemExit('version injection failed')
          cfg='''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s: s=s.replace('    buildTypes {',cfg+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s: s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s)
          PY
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          "$SIGNER" verify --verbose --print-certs "$apk" > /tmp/apksigner.txt 2>&1
          grep -Fq 'Verified using v1 scheme' /tmp/apksigner.txt || true
          cert=$(grep -Eio 'certificate SHA-256 digest: [0-9a-f:]{64,95}' /tmp/apksigner.txt | head -n1 | grep -Eio '[0-9a-f]{64}' | tr '[:upper:]' '[:lower:]')
          test "$cert" = '76fa4bc81be45ab1d53350ea996e85e61518379f82cb9a1ec0e2a19d2e303f25'
          "$AAPT" dump badging "$apk" | head -n1 | grep -Fq "name='com.nexusnova.app'"
          "$AAPT" dump badging "$apk" | head -n1 | grep -Fq "versionCode='26091501'"
          "$AAPT" dump badging "$apk" | head -n1 | grep -Fq "versionName='1.0.38-ota-engine-capability'"
          unzip -l "$apk" > /tmp/apk-list.txt
          grep -Fq 'assets/www/assets/icons/nova-hub/travel.webp' /tmp/apk-list.txt
          ! grep -Eiq 'assets/www/.*/fare[-_ ]?lens|assets/www/.*/fare-lens|Fare Lens' /tmp/apk-list.txt
          ! grep -Eiq 'assets/www/src/features/apps/travel(-[^ ]*)?\.js' /tmp/apk-list.txt
          sha256sum "$apk" | tee /tmp/SHA256.txt
          cat /tmp/apksigner.txt

      - name: Publish to apk-builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
          dir=$(mktemp -d)
          git clone --depth=1 --branch apk-builds "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          mkdir -p "$dir/ota-bootstrap-safe"
          cp "$apk" "$dir/ota-bootstrap-safe/NexusNova-OTA-Engine-Capability-SIGNED-vc26091501.apk"
          cp /tmp/SHA256.txt "$dir/ota-bootstrap-safe/SHA256.txt"
          cat > "$dir/ota-bootstrap-safe/BUILD-STATUS.txt" <<EOF
Source commit: $GITHUB_SHA
Workflow run: $GITHUB_RUN_ID
Version code: 26091501
Version name: 1.0.38-ota-engine-capability
Package: com.nexusnova.app
APK signature: PASS
Certificate SHA-256: 76fa4bc81be45ab1d53350ea996e85e61518379f82cb9a1ec0e2a19d2e303f25
Travel baseline: PASS
Fare Lens absent: PASS
AdMob TEST-only safeguard: PASS
EOF
          cp /tmp/apksigner.txt "$dir/ota-bootstrap-safe/signature.txt"
          cd "$dir"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ota-bootstrap-safe
          git commit -m "publish: NexusNova OTA Engine capability vc26091501"
          git push origin HEAD:apk-builds
          echo "PUBLICATION_COMMIT=$(git rev-parse HEAD)"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-OTA-Engine-Upgrade-SIGNED
          path: NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
