name: NexusNova OTA Workflow Lint

on:
  push:
    branches:
      - ota-engine-ci-exec-20260915

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/latest/download/actionlint_1.7.7_linux_x86_64.tar.gz -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp
          install -m 0755 /tmp/actionlint/actionlint /usr/local/bin/actionlint
      - name: Lint OTA workflow
        run: actionlint .github/workflows/ota-engine-capability-ci.yml
