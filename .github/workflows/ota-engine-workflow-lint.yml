name: NexusNova OTA Workflow Lint

on:
  push:
    branches:
      - ota-engine-ci-exec-20260915

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          actionlint -version
      - name: Show failing YAML region
        run: |
          nl -ba .github/workflows/ota-engine-capability-ci.yml | sed -n '205,228p'
      - name: Lint OTA workflow
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          actionlint .github/workflows/ota-engine-capability-ci.yml
