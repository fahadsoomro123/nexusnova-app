name: Phase 3 Remove BG hardening

on:
  push:
    branches:
      - ai-photo-real-canva-ai-generator-correction
    paths:
      - '.github/workflows/phase3-remove-bg-race-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-photo-real-canva-ai-generator-correction
          fetch-depth: 0
      - name: Apply Remove BG hardening patch
        run: python .github/scripts/phase3_remove_bg_patch.py
      - name: Syntax check
        run: |
          node --check fresh-rebuild/src/features/apps/ai-photo-remove-bg-ml-v16.js
          node --check tools/ai-photo-flagship-qa/behavior-qa.mjs
      - name: Commit Phase 3 hardening
        run: |
          git config user.name "NexusNova QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fresh-rebuild/src/features/apps/ai-photo-remove-bg-ml-v16.js tools/ai-photo-flagship-qa/behavior-qa.mjs
          git commit -m "fix: harden AI Remove BG matte and refine handoff"
          git push origin HEAD:ai-photo-real-canva-ai-generator-correction
