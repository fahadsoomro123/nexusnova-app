name: Play Store Readiness Verification

on:
  push:
    branches: [repo-cleanup-v2-20260911]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout exact cleanup source
        uses: actions/checkout@v4

      - name: Verify Play Store source requirements
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.nexusnova.app"' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'compileSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Eq 'versionCode = [1-9][0-9]*' NexusNovaAndroid/app/build.gradle.kts
          grep -Eq 'versionName = "[^"]+"' NexusNovaAndroid/app/build.gradle.kts
          test -s fresh-rebuild/index.html
          if git ls-files 'NexusNovaAndroid/app/src/main/assets/www/**' | grep -q .; then
            echo 'Generated Android web assets must not be tracked.' >&2
            exit 1
          fi

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare ephemeral release signing
        shell: bash
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-upload.jks
          test -s app/nexusnova-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in s:
              signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-upload.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          marker = '        release {\n'
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(marker, marker + '            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'signingConfig = signingConfigs.getByName("release")' app/build.gradle.kts

      - name: Build signed Play Store AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:bundleRelease --stacktrace --no-daemon

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB='NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB" | tee /tmp/aab-signature.txt
          grep -Fq 'jar verified.' /tmp/aab-signature.txt
          sha256sum "$AAB" | tee NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab.sha256
          test "$(git status --porcelain --untracked-files=no | wc -l)" -le 1
          echo 'PASS: signed API-36 AAB built from exact cleanup source.'

      - name: Upload Play Store proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-PlayStore-AAB-proof
          path: |
            NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab
            NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
