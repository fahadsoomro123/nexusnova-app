name: Play Store Readiness Verification

on:
  push:
    branches: [repo-cleanup-v2-20260911]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - name: Checkout exact cleanup source
        uses: actions/checkout@v4

      - name: Verify Play Store source requirements
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.nexusnova.app"' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'compileSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Eq 'versionCode = [1-9][0-9]*' NexusNovaAndroid/app/build.gradle.kts
          grep -Eq 'versionName = "[^"]+"' NexusNovaAndroid/app/build.gradle.kts
          test -s fresh-rebuild/index.html
          if git ls-files 'NexusNovaAndroid/app/src/main/assets/www/**' | grep -q .; then
            echo 'Generated Android web assets must not be tracked.' >&2
            exit 1
          fi

      - name: Checkout proven production auth baseline
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-app
          ref: 5b0f3c0d905c66264d7591131d7224ff441e0742
          path: production-auth-source
          sparse-checkout: |
            fresh-rebuild/src/core/firebase-backend.js
            fresh-rebuild/src/core/auth-service.js
            NexusNovaAndroid/app/google-services.json
          sparse-checkout-cone-mode: false

      - name: Restore production auth only in release workspace
        shell: bash
        run: |
          set -euo pipefail
          cp production-auth-source/fresh-rebuild/src/core/firebase-backend.js fresh-rebuild/src/core/firebase-backend.js
          cp production-auth-source/fresh-rebuild/src/core/auth-service.js fresh-rebuild/src/core/auth-service.js
          cp production-auth-source/NexusNovaAndroid/app/google-services.json NexusNovaAndroid/app/google-services.json
          grep -Fq 'waitForFirebaseUser' fresh-rebuild/src/core/firebase-backend.js
          grep -Fq 'signInWithEmailAndPassword' fresh-rebuild/src/core/auth-service.js
          grep -Fq 'globalThis.NexusAppCheckAndroid' fresh-rebuild/src/core/firebase-backend.js
          grep -Fq 'const val JS_BRIDGE_NAME = "NexusAppCheckAndroid"' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusNativeAppCheck.kt
          ! grep -Fq 'PUBLIC_DISABLED_ERROR' fresh-rebuild/src/core/firebase-backend.js
          ! grep -Fq 'public-mirror auth shim' fresh-rebuild/src/core/auth-service.js
          ! grep -Fq 'PUBLIC_BUILD_FIREBASE_DISABLED' NexusNovaAndroid/app/google-services.json
          echo 'PASS: production Firebase/auth payload staged only in ephemeral release workspace.'

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare ephemeral release signing
        shell: bash
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-upload.jks
          test -s app/nexusnova-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in s:
              signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-upload.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          marker = '        release {\n'
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(marker, marker + '            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq 'signingConfig = signingConfigs.getByName("release")' app/build.gradle.kts

      - name: Build debug app, tracker and signed Play Store AAB
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v32.js
          node --check fresh-rebuild/src/features/apps/travel-result-details-v1.js
          node --check fresh-rebuild/src/features/apps/calculator-fullscreen-v1.js
          node --check fresh-rebuild/src/features/apps/everyday-tools.js
          grep -Fq 'travel-result-details-v1.js?ota=travel-map-runtime-v2' fresh-rebuild/index.html
          grep -Fq 'travel-phone-layout-v31.js?ota=travel-v31-proof36' fresh-rebuild/index.html
          grep -Fq "NexusNovaTravelLayoutOwner='v32'" fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          gradle -p NexusNovaAndroid :app:assembleDebug :tracker:assembleDebug :app:bundleRelease --stacktrace --no-daemon

      - name: Verify signed production AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB='NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB" | tee /tmp/aab-signature.txt
          grep -Fq 'jar verified.' /tmp/aab-signature.txt
          unzip -l "$AAB" | grep -Fq 'base/assets/www/src/core/firebase-backend.js'
          unzip -l "$AAB" | grep -Fq 'base/assets/www/src/core/auth-service.js'
          unzip -l "$AAB" | grep -Fq 'base/assets/www/src/features/apps/travel-phone-layout-v32.js'
          unzip -l "$AAB" | grep -Fq 'base/assets/www/src/features/apps/travel-result-details-v1.js'
          unzip -l "$AAB" | grep -Fq 'base/assets/www/src/features/apps/everyday-tools.js'
          unzip -p "$AAB" base/assets/www/src/core/firebase-backend.js > /tmp/aab-firebase-backend.js
          unzip -p "$AAB" base/assets/www/src/core/auth-service.js > /tmp/aab-auth-service.js
          cmp fresh-rebuild/src/core/firebase-backend.js /tmp/aab-firebase-backend.js
          cmp fresh-rebuild/src/core/auth-service.js /tmp/aab-auth-service.js
          unzip -p "$AAB" base/assets/www/index.html | grep -Fq 'travel-result-details-v1.js?ota=travel-map-runtime-v2'
          unzip -p "$AAB" base/assets/www/index.html | grep -Fq 'travel-phone-layout-v31.js?ota=travel-v31-proof36'
          unzip -p "$AAB" base/assets/www/src/features/apps/travel-phone-layout-v31.js | grep -Fq "NexusNovaTravelLayoutOwner='v32'"
          unzip -p "$AAB" base/assets/www/src/features/apps/everyday-tools.js | grep -Fq "paint('ENTER NEXT VALUE')"
          grep -Fq 'waitForFirebaseUser' /tmp/aab-firebase-backend.js
          grep -Fq 'signInWithEmailAndPassword' /tmp/aab-auth-service.js
          ! grep -Fq 'PUBLIC_DISABLED_ERROR' /tmp/aab-firebase-backend.js
          ! grep -Fq 'public-mirror auth shim' /tmp/aab-auth-service.js
          sha256sum "$AAB" | tee NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab.sha256
          echo 'PASS: signed API-36 AAB contains production Firebase/auth payload.'

      - name: Upload Play Store proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-PlayStore-AAB-production-proof
          path: |
            NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab
            NexusNovaAndroid/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 7
