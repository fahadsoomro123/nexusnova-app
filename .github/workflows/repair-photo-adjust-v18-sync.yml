name: Repair Photo Adjust v18 sync

on:
  push:
    branches:
      - ai-photo-real-canva-ai-generator-correction
    paths:
      - .github/workflows/repair-photo-adjust-v18-sync.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-photo-real-canva-ai-generator-correction
          fetch-depth: 0
      - name: Patch missing sync state wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fresh-rebuild/src/features/apps/ai-photo-adjust-editor.js')
          s=p.read_text()
          marker="  const applyView=()=>{canvas.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.zoom})`;const p=`${Math.round(view.zoom*100)}%`;zoom.value=Math.round(view.zoom*100);zoomOut.textContent=p;zoomLabel.textContent=p},fit=()=>{view.zoom=1;view.x=0;view.y=0;applyView()},fmt=(k,v)=>(k==='exposure'||k==='gamma')?Number(v).toFixed(2):k==='straighten'?`${Number(v).toFixed(1)}°`:k==='blur'?`${Number(v).toFixed(1)}px`:`${Math.round(v)}`;"
          if 'const sync=()=>{' in s:
              print('sync already present; no patch needed')
          else:
              if marker not in s:
                  raise SystemExit('sync insertion marker not found')
              insert=marker+"\n  const sync=()=>{\n    qa('[data-photo-range]').forEach(i=>{const k=i.dataset.photoRange;let v;if(k==='maskSize')v=state.mask.size;else if(k==='maskFeather')v=state.mask.feather;else if(k==='maskTolerance')v=state.mask.tolerance;else v=state[k];if(v!==undefined&&v!==null){i.value=String(v);if(i.nextElementSibling)i.nextElementSibling.textContent=fmt(k,v)}});\n    qa('[data-photo-mix]').forEach(i=>{const v=state.mix?.[mix]?.[i.dataset.photoMix]??0;i.value=String(v);if(i.nextElementSibling)i.nextElementSibling.textContent=String(Math.round(v))});\n    const strength=q('[data-mask-strength]');if(strength){strength.value=String(state.mask.strength);if(strength.nextElementSibling)strength.nextElementSibling.textContent=String(Math.round(state.mask.strength))}\n    qa('[data-mask-adjust]').forEach(i=>{const v=state.mask.adjust?.[i.dataset.maskAdjust]??0;i.value=String(v);if(i.nextElementSibling)i.nextElementSibling.textContent=String(Math.round(v))});\n    qa('[data-photo-ratio]').forEach(b=>b.classList.toggle('is-active',b.dataset.photoRatio===state.cropRatio));\n    qa('[data-photo-mix-color]').forEach(b=>b.classList.toggle('is-active',b.dataset.photoMixColor===mix));\n    qa('[data-mask-base]').forEach(b=>b.classList.toggle('is-active',b.dataset.maskBase===state.mask.base));\n    q('[data-mask-invert]')?.classList.toggle('is-active',Boolean(state.mask.invert));\n    q('[data-photo-fliph]')?.classList.toggle('is-active',Boolean(state.flipX));q('[data-photo-flipv]')?.classList.toggle('is-active',Boolean(state.flipY));\n    syncHistory();renderCurve();\n  };"
              p.write_text(s.replace(marker,insert,1))
              print('patched sync state wiring')
          PY
      - name: Syntax check
        run: node --check fresh-rebuild/src/features/apps/ai-photo-adjust-editor.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- fresh-rebuild/src/features/apps/ai-photo-adjust-editor.js; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "NexusNova QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fresh-rebuild/src/features/apps/ai-photo-adjust-editor.js
          git commit -m "fix: restore Photo Adjust v18 state sync"
          git push origin HEAD:ai-photo-real-canva-ai-generator-correction
