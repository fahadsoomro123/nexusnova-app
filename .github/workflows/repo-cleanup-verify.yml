name: Repo Cleanup Verification

on:
  push:
    branches: [repo-cleanup-v2-20260911]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch fresh main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "MAIN_SHA=$(git rev-parse origin/main)"
          echo "CLEANUP_SHA=$(git rev-parse HEAD)"
          test "$(git rev-list --count origin/main..HEAD)" -gt 0
          test "$(git rev-list --count HEAD..origin/main)" -eq 0

      - name: Audit residual references to deleted cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          mapfile -t deleted < <(git diff --diff-filter=D --name-only origin/main...HEAD | grep -E '^(\.github/(workflows|scripts)/|release-trigger/)' || true)
          echo "Deleted workflow/script/trigger paths under audit: ${#deleted[@]}"
          for path in "${deleted[@]}"; do
            base="${path##*/}"
            hits="$(git grep -n -F -- "$path" HEAD -- . 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "STALE FULL PATH: $path"
              echo "$hits"
              fail=1
            fi
            hits="$(git grep -n -F -- "$base" HEAD -- . 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              echo "STALE BASENAME: $base (deleted path: $path)"
              echo "$hits"
              fail=1
            fi
          done
          test "$fail" -eq 0
          echo 'PASS: no residual references to deleted cleanup workflow/script/trigger helpers.'

      - name: Verify canonical source and native modules are preserved
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'fresh-rebuild/index.html'
            'fresh-rebuild/src/features/apps/travel-phone-layout-v31.js'
            'fresh-rebuild/src/features/apps/travel-phone-layout-v32.js'
            'fresh-rebuild/src/features/apps/travel-phone-interaction-v28.js'
            'fresh-rebuild/src/core/drive-track-persistence.js'
            'fresh-rebuild/src/core/router.js'
            'fresh-rebuild/src/core/firebase-backend.js'
            'fresh-rebuild/src/core/auth-service.js'
            'fresh-rebuild/src/nova-drive-gold-maptiler-v14-ui.js'
            'fresh-rebuild/src/nova-drive-gold-maptiler-v14-production.js'
            'NexusNovaAndroid/app/src/main/AndroidManifest.xml'
            'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt'
            'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'
            'NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt'
            'NexusNovaAndroid/tracker/build.gradle.kts'
            'NexusNovaAndroid/tracker/src/main/AndroidManifest.xml'
          )
          for path in "${required[@]}"; do test -s "$path"; done
          grep -Fq 'include(":tracker")' NexusNovaAndroid/settings.gradle.kts
          grep -Fq 'compileSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'rootProject.projectDir.parentFile.resolve("fresh-rebuild")' NexusNovaAndroid/app/build.gradle.kts
          grep -Fq 'dependsOn(syncFreshWebAssets)' NexusNovaAndroid/app/build.gradle.kts
          if git ls-files 'NexusNovaAndroid/app/src/main/assets/www/**' | grep -q .; then
            echo 'Generated Android web bundle is still tracked.' >&2
            exit 1
          fi
          echo 'PASS: canonical source/native modules preserved and generated web bundle untracked.'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Focused Travel Drive startup and security source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v32.js
          node --check fresh-rebuild/src/features/apps/travel-phone-interaction-v28.js
          node --check fresh-rebuild/src/core/drive-track-persistence.js
          node --check fresh-rebuild/src/core/router.js
          node --check fresh-rebuild/src/nova-drive-gold-maptiler-v14-ui.js
          node --check fresh-rebuild/src/nova-drive-gold-maptiler-v14-production.js
          grep -Fq "import './travel-phone-layout-v32.js';" fresh-rebuild/src/features/apps/travel-phone-layout-v31.js
          grep -Fq "window.NexusNovaTravelLayoutOwner='v32'" fresh-rebuild/src/features/apps/travel-phone-layout-v32.js
          grep -Fq 'for (const candidate of candidates)' fresh-rebuild/src/core/drive-track-persistence.js
          grep -Fq 'ROUTE_MAX_ACCURACY_M = 45.0' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/NexusDriveForegroundService.kt
          grep -Fq 'private val otaWebManager by lazy { NexusOtaWebManager(this) }' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          python3 .github/scripts/android-webview-security-readiness.py
          python3 .github/scripts/admob-production-readiness.py
          echo 'PASS: focused Travel/Drive/startup/security source checks.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile app and tracker debug plus release
        shell: bash
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid \
            :app:assembleDebug :app:assembleRelease \
            :tracker:assembleDebug :tracker:assembleRelease \
            --stacktrace --no-daemon

      - name: Prove Android web assets regenerate exactly from fresh-rebuild
        shell: bash
        run: |
          set -euo pipefail
          WEB='NexusNovaAndroid/app/src/main/assets/www'
          test -s "$WEB/index.html"
          diff -qr fresh-rebuild "$WEB"
          cmp fresh-rebuild/index.html "$WEB/index.html"
          cmp fresh-rebuild/src/features/apps/travel-phone-layout-v31.js "$WEB/src/features/apps/travel-phone-layout-v31.js"
          cmp fresh-rebuild/src/features/apps/travel-phone-layout-v32.js "$WEB/src/features/apps/travel-phone-layout-v32.js"
          cmp fresh-rebuild/src/core/drive-track-persistence.js "$WEB/src/core/drive-track-persistence.js"
          cmp fresh-rebuild/src/core/router.js "$WEB/src/core/router.js"
          cmp fresh-rebuild/src/core/firebase-backend.js "$WEB/src/core/firebase-backend.js"
          cmp fresh-rebuild/src/core/auth-service.js "$WEB/src/core/auth-service.js"
          echo 'PASS: Gradle regenerated an exact Android web bundle from canonical fresh-rebuild.'

      - name: Verify compiled APK contains exact canonical payload
        shell: bash
        run: |
          set -euo pipefail
          APK='NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$APK" \
            'assets/www/index.html' \
            'assets/www/src/features/apps/travel-phone-layout-v31.js' \
            'assets/www/src/features/apps/travel-phone-layout-v32.js' \
            'assets/www/src/core/drive-track-persistence.js' \
            'assets/www/src/core/router.js' \
            'assets/www/src/core/firebase-backend.js' \
            'assets/www/src/core/auth-service.js' \
            -d "$d"
          cmp fresh-rebuild/index.html "$d/assets/www/index.html"
          cmp fresh-rebuild/src/features/apps/travel-phone-layout-v31.js "$d/assets/www/src/features/apps/travel-phone-layout-v31.js"
          cmp fresh-rebuild/src/features/apps/travel-phone-layout-v32.js "$d/assets/www/src/features/apps/travel-phone-layout-v32.js"
          cmp fresh-rebuild/src/core/drive-track-persistence.js "$d/assets/www/src/core/drive-track-persistence.js"
          cmp fresh-rebuild/src/core/router.js "$d/assets/www/src/core/router.js"
          cmp fresh-rebuild/src/core/firebase-backend.js "$d/assets/www/src/core/firebase-backend.js"
          cmp fresh-rebuild/src/core/auth-service.js "$d/assets/www/src/core/auth-service.js"
          echo 'PASS: compiled APK contains exact canonical Travel/Drive/router/auth payload.'
