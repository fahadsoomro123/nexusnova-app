name: Self-hosted Runner Build Gate

on:
  push:
    branches:
      - self-hosted-runner-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gate:
    name: Windows self-hosted Android build gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      ANDROID_HOME: C:\Android\Sdk
      ANDROID_SDK_ROOT: C:\Android\Sdk
    steps:
      - name: Confirm runner identity
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner arch: %RUNNER_ARCH%
          echo Service user: %USERNAME%
          ver

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify installed toolchain
        shell: cmd
        run: |
          where git
          git --version
          where java
          java -version
          where adb
          adb version
          where apksigner
          apksigner version
          if not exist "C:\Android\Sdk\platforms\android-35\android.jar" exit /b 1
          echo Android SDK 35: PASS

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle
        shell: cmd
        run: gradle --version

      - name: Build NexusNova debug APK
        working-directory: NexusNovaAndroid
        shell: cmd
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK exists
        shell: cmd
        run: |
          if not exist "NexusNovaAndroid\app\build\outputs\apk\debug\app-debug.apk" exit /b 1
          for %%I in ("NexusNovaAndroid\app\build\outputs\apk\debug\app-debug.apk") do echo APK size: %%~zI bytes
          echo SELF_HOSTED_ANDROID_BUILD=PASS
