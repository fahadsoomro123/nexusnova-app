name: Self-hosted Runner Smoke Test

on:
  push:
    branches:
      - self-hosted-runner-smoke-test
  workflow_dispatch:

jobs:
  smoke:
    name: Windows self-hosted smoke
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Confirm runner identity
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner arch: %RUNNER_ARCH%
          echo Service user: %USERNAME%
          echo Working directory: %CD%
          ver

      - name: Probe basic build tools without failing
        shell: cmd
        run: |
          where git 2>nul && git --version || echo git=NOT_FOUND
          where java 2>nul && java -version || echo java=NOT_FOUND
          where adb 2>nul && adb --version || echo adb=NOT_FOUND
          where sdkmanager 2>nul && sdkmanager --version || echo sdkmanager=NOT_FOUND
