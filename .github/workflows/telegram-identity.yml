name: Telegram Identity Check

on:
  pull_request:
    paths:
      - 'functions/telegram-init-data.js'
      - 'functions/telegram-link-policy.js'
      - 'functions/telegramAuth.js'
      - 'functions/test/**'
      - 'functions/main.js'
      - 'functions/package.json'
      - '.github/workflows/telegram-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check telegramAuth.js
