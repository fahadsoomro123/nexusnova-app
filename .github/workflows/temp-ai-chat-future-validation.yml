name: TEMP AI Chat Future Validation

on:
  push:
    branches:
      - ai-chat-future-20260819

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check js/nexusnova-ai-chat-future-v1.js
          node --check js/nexusnova-page2-after-core-v2.js

      - name: Verify protected owners unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- js/nexusnova-ai-authority-v2.js
          git diff --exit-code origin/main...HEAD -- js/page2-core.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-natural-voice-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-allapps-scroll-fix-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-navigation-stability-v1.js
          git diff --exit-code origin/main...HEAD -- js/rewards-security-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-nova-vault-v1.js
          git diff --exit-code origin/main...HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Verify AI chat modernization contract
        run: |
          set -euo pipefail
          grep -q "nexusAiChatFutureVersion = 'ai-chat-future-v1'" js/nexusnova-ai-chat-future-v1.js
          grep -q '#tab-ai .ai-box' js/nexusnova-ai-chat-future-v1.js
          grep -q '#tab-chat .chat-box' js/nexusnova-ai-chat-future-v1.js
          grep -q 'height:auto!important' js/nexusnova-ai-chat-future-v1.js
          grep -q 'grid-template-columns:minmax(0,1fr) 36px 36px 40px' js/nexusnova-ai-chat-future-v1.js
          grep -q 'REAL-TIME COMMUNITY' js/nexusnova-ai-chat-future-v1.js
          grep -q "observer.observe(box, {childList:true, subtree:false})" js/nexusnova-ai-chat-future-v1.js
          grep -q "import('./nexusnova-ai-chat-future-v1.js?v=1')" js/nexusnova-page2-after-core-v2.js
          echo 'AI + Community Chat futuristic UI contract passed.'
