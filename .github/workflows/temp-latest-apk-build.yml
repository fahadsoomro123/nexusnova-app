name: TEMP Latest NexusNova APK Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-latest-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify latest UI modules
        run: |
          set -euo pipefail
          node --check js/nexusnova-compact-premium-v1.js
          node --check js/nexusnova-ai-chat-future-v1.js
          node --check js/nexusnova-nine-screen-modern-v1.js
          node --check js/nexusnova-page2-after-core-v2.js
          grep -q "nexusnova-ai-chat-future-v1.js?v=1" js/nexusnova-page2-after-core-v2.js
          grep -q "nexusnova-nine-screen-modern-v1.js?v=1" js/nexusnova-page2-after-core-v2.js

      - name: Prepare deterministic Android web shell
        run: python3 NexusNovaAndroid/prepare_native_web_shell.py

      - name: Synchronize mining boost countdown state
        run: python3 NexusNovaAndroid/patch_mining_boost_sync.py

      - name: Apply Android viewport lock
        run: python3 NexusNovaAndroid/patch_viewport.py

      - name: Apply native AdMob bridge
        run: python3 NexusNovaAndroid/patch_admob.py

      - name: Enforce rewarded test-only production guard
        run: python3 NexusNovaAndroid/patch_rewarded_test_contract.py

      - name: Apply TEST mining reward preview and booster FX
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx.py

      - name: Harden TEST reward cooldown and FX
        run: python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py

      - name: Enforce TEST cooldown across all boost entry points
        run: python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py

      - name: Prevent wasted TEST boost ads in final two hours
        run: python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py

      - name: Enforce authoritative TEST mining timer
        run: python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py

      - name: Apply UMP privacy options bridge
        run: python3 NexusNovaAndroid/patch_ad_privacy.py

      - name: Restore same-device session
        run: python3 NexusNovaAndroid/patch_session_restore.py

      - name: Defer Caller ID setup until feature use
        run: python3 NexusNovaAndroid/patch_deferred_caller_setup.py

      - name: Reset stale WebView shell once
        run: python3 NexusNovaAndroid/patch_web_shell_reset.py

      - name: Apply native shell and startup stabilization
        run: python3 NexusNovaAndroid/patch_native_shell.py

      - name: Apply readable splash timing
        run: python3 NexusNovaAndroid/patch_splash_timing.py

      - name: Verify latest UI is staged inside Android shell
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          grep -q "nexusnova-ai-chat-future-v1.js?v=1" "$WEB/js/nexusnova-page2-after-core-v2.js"
          grep -q "nexusnova-nine-screen-modern-v1.js?v=1" "$WEB/js/nexusnova-page2-after-core-v2.js"
          test -s "$WEB/js/nexusnova-ai-chat-future-v1.js"
          test -s "$WEB/js/nexusnova-nine-screen-modern-v1.js"
          grep -q 'setTimeout(releaseSplash, 1900);' "$WEB/index.html"
          grep -q 'setTimeout(nxForceReleaseSplash, 1400);' "$WEB/page2.html"

      - name: Assemble latest TEST APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK contains latest UI modules
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/nx-apk-check
          mkdir -p /tmp/nx-apk-check
          unzip -qq "$APK" 'assets/www/js/nexusnova-ai-chat-future-v1.js' 'assets/www/js/nexusnova-nine-screen-modern-v1.js' 'assets/www/js/nexusnova-page2-after-core-v2.js' -d /tmp/nx-apk-check
          grep -q "ai-chat-future-v1" /tmp/nx-apk-check/assets/www/js/nexusnova-ai-chat-future-v1.js
          grep -q "nine-screen-modern-v1" /tmp/nx-apk-check/assets/www/js/nexusnova-nine-screen-modern-v1.js
          sha256sum "$APK" | tee /tmp/nexusnova-latest.sha256
          cp "$APK" NexusNova-2026-08-19-LatestModernization-TEST.apk

      - name: Upload latest TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-2026-08-19-LatestModernization-TEST
          path: NexusNova-2026-08-19-LatestModernization-TEST.apk
          if-no-files-found: error
