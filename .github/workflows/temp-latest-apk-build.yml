name: TEMP Latest NexusNova APK Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-latest-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify latest UI modules
        run: |
          set -euo pipefail
          node --check js/nexusnova-compact-premium-v1.js
          node --check js/nexusnova-ai-chat-future-v1.js
          node --check js/nexusnova-nine-screen-modern-v1.js
          node --check js/nexusnova-page2-after-core-v2.js
          grep -q "nexusnova-ai-chat-future-v1.js?v=1" js/nexusnova-page2-after-core-v2.js
          grep -q "nexusnova-nine-screen-modern-v1.js?v=1" js/nexusnova-page2-after-core-v2.js

      - name: Restore phone-confirmed v1.1.12 Android web assets
        run: |
          set -euo pipefail
          git fetch --no-tags origin apk-builds:refs/remotes/origin/apk-builds
          git show origin/apk-builds:NexusNova-v1.1.12-CallerStartupFix-TEST.apk > /tmp/nx-v112.apk
          echo '91645d8431fd0fee843cb51a5b32b32ec4e4b2bf5bd7a18f14c648f415a13817  /tmp/nx-v112.apk' | sha256sum -c -
          rm -rf /tmp/nx-v112-assets NexusNovaAndroid/app/src/main/assets/www
          mkdir -p /tmp/nx-v112-assets NexusNovaAndroid/app/src/main/assets/www
          unzip -qq /tmp/nx-v112.apk 'assets/www/*' -d /tmp/nx-v112-assets
          cp -a /tmp/nx-v112-assets/assets/www/. NexusNovaAndroid/app/src/main/assets/www/
          test -s NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-allapps-scroll-fix-v1.js
          test -s NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-navigation-stability-v1.js
          test -s NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-nova-hub-nav-v1.js

      - name: Overlay latest presentation-only modules
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          cp js/nexusnova-compact-premium-v1.js "$WEB/js/nexusnova-compact-premium-v1.js"
          cp js/nexusnova-ai-chat-future-v1.js "$WEB/js/nexusnova-ai-chat-future-v1.js"
          cp js/nexusnova-nine-screen-modern-v1.js "$WEB/js/nexusnova-nine-screen-modern-v1.js"
          cp js/nexusnova-page2-after-core-v2.js "$WEB/js/nexusnova-page2-after-core-v2.js"
          node --check "$WEB/js/nexusnova-compact-premium-v1.js"
          node --check "$WEB/js/nexusnova-ai-chat-future-v1.js"
          node --check "$WEB/js/nexusnova-nine-screen-modern-v1.js"
          node --check "$WEB/js/nexusnova-page2-after-core-v2.js"

      - name: Apply requested readable splash timing only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          web = Path('NexusNovaAndroid/app/src/main/assets/www')
          targets = [
              (web/'index.html', r'setTimeout\(\s*releaseSplash\s*,\s*\d+\s*\);', 'setTimeout(releaseSplash, 1900);'),
              (web/'page2.html', r'setTimeout\(\s*nxForceReleaseSplash\s*,\s*\d+\s*\);', 'setTimeout(nxForceReleaseSplash, 1400);'),
          ]
          for path, pattern, replacement in targets:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Splash timing marker not found exactly once: {path}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Preserve deferred Caller ID startup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '        loadProductionApp()\n        showCallerSetupOnce()\n'
          if s.count(old) != 1:
              raise SystemExit('Expected Caller ID startup sequence not found exactly once')
          s = s.replace(old, '        loadProductionApp()\n', 1)
          if 'private fun showCallerSetupOnce()' not in s:
              raise SystemExit('Caller ID feature method missing; refusing to build')
          p.write_text(s, encoding='utf-8')
          print('Removed only automatic Caller ID startup call; feature remains available.')
          PY

      - name: Verify stable owners plus latest UI contract
        run: |
          set -euo pipefail
          WEB=NexusNovaAndroid/app/src/main/assets/www
          BASE=/tmp/nx-v112-assets/assets/www
          grep -q "nexusnova-ai-chat-future-v1.js?v=1" "$WEB/js/nexusnova-page2-after-core-v2.js"
          grep -q "nexusnova-nine-screen-modern-v1.js?v=1" "$WEB/js/nexusnova-page2-after-core-v2.js"
          grep -q "ai-chat-future-v1" "$WEB/js/nexusnova-ai-chat-future-v1.js"
          grep -q "nine-screen-modern-v1" "$WEB/js/nexusnova-nine-screen-modern-v1.js"
          grep -q "compact-premium-v1" "$WEB/js/nexusnova-compact-premium-v1.js"
          grep -q 'setTimeout(releaseSplash, 1900);' "$WEB/index.html"
          grep -q 'setTimeout(nxForceReleaseSplash, 1400);' "$WEB/page2.html"
          cmp "$BASE/js/nexusnova-navigation-stability-v1.js" "$WEB/js/nexusnova-navigation-stability-v1.js"
          cmp "$BASE/js/nexusnova-allapps-scroll-fix-v1.js" "$WEB/js/nexusnova-allapps-scroll-fix-v1.js"
          cmp "$BASE/js/nexusnova-hub-ad-gate-v1.js" "$WEB/js/nexusnova-hub-ad-gate-v1.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          start=s.find('override fun onCreate')
          end=s.find('\n    private fun ', start)
          block=s[start:end if end > start else len(s)]
          if 'showCallerSetupOnce()' in block:
              raise SystemExit('Caller ID startup regression detected')
          if 'private fun showCallerSetupOnce()' not in s:
              raise SystemExit('Caller ID feature was accidentally removed')
          print('Caller ID remains deferred from app startup and feature method is preserved.')
          PY
          echo 'Stable v1.1.12 navigation/scroll/ad owners preserved byte-for-byte.'

      - name: Assemble latest TEST APK
        run: gradle -p NexusNovaAndroid :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK payload and checksum
        run: |
          set -euo pipefail
          APK=NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/nx-apk-check
          mkdir -p /tmp/nx-apk-check
          unzip -qq "$APK" \
            'assets/www/index.html' \
            'assets/www/page2.html' \
            'assets/www/js/nexusnova-compact-premium-v1.js' \
            'assets/www/js/nexusnova-ai-chat-future-v1.js' \
            'assets/www/js/nexusnova-nine-screen-modern-v1.js' \
            'assets/www/js/nexusnova-page2-after-core-v2.js' \
            'assets/www/js/nexusnova-navigation-stability-v1.js' \
            'assets/www/js/nexusnova-allapps-scroll-fix-v1.js' \
            -d /tmp/nx-apk-check
          grep -q "ai-chat-future-v1" /tmp/nx-apk-check/assets/www/js/nexusnova-ai-chat-future-v1.js
          grep -q "nine-screen-modern-v1" /tmp/nx-apk-check/assets/www/js/nexusnova-nine-screen-modern-v1.js
          grep -q "compact-premium-v1" /tmp/nx-apk-check/assets/www/js/nexusnova-compact-premium-v1.js
          grep -q 'setTimeout(releaseSplash, 1900);' /tmp/nx-apk-check/assets/www/index.html
          grep -q 'setTimeout(nxForceReleaseSplash, 1400);' /tmp/nx-apk-check/assets/www/page2.html
          sha256sum "$APK" | tee /tmp/nexusnova-latest.sha256
          cp "$APK" NexusNova-2026-08-19-LatestModernization-TEST.apk

      - name: Upload latest TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-2026-08-19-LatestModernization-TEST
          path: NexusNova-2026-08-19-LatestModernization-TEST.apk
          if-no-files-found: error
