name: temp travel fare polish
on:
  push:
    branches:
      - agent/travel-fare-lens-flagship
    paths:
      - .github/workflows/temp-travel-fare-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const path = 'fresh-rebuild/src/features/apps/travel-fare-lens.js';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(current.data.content, 'base64').toString('utf8');
            const oldMarkup = '<button type="button" class="nnfl-pak-mode" data-nnfl-pak-mode>PK MODE</button><button type="button" class="nnfl-route-link" data-nnfl-brand>OPEN IN NOVA BROWSER ↗</button>';
            const newMarkup = '<button type="button" class="nnfl-pak-mode" data-nnfl-pak-mode aria-pressed="false"><span class="nnfl-pak-flag" aria-hidden="true">🇵🇰</span><span class="nnfl-pak-copy"><b>PK</b><small>MODE</small></span></button><button type="button" class="nnfl-route-link" data-nnfl-brand><span>OPEN IN NOVA</span><small>BROWSER ↗</small></button>';
            if (!text.includes(oldMarkup)) throw new Error('Expected Pakistan/browser markup not found; aborting.');
            text = text.replace(oldMarkup, newMarkup);
            const oldCss = '.nnfl-top-actions{display:flex;align-items:center;gap:7px}.nnfl-pak-mode{border:1px solid #cfe0ff;background:#fff;color:#1769ff;border-radius:7px;padding:5px 6px;font-size:8px;font-weight:900}.nnfl-pak-mode.is-active{background:#1769ff;color:#fff}.nnfl-brand{padding:0;text-align:left;font-size:11px;font-weight:900;letter-spacing:.08em}.nnfl-brand span{color:#1769ff}.nnfl-brand small{display:block;color:#748196;font-size:8px;letter-spacing:.04em;margin-top:2px}.nnfl-route-link{font-size:8px;color:#1769ff;font-weight:800}';
            const newCss = '.nnfl-top-actions{display:flex;align-items:center;gap:7px}.nnfl-pak-mode{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:76px;height:38px;padding:4px 9px;border:1px solid #cfe0ff;background:linear-gradient(180deg,#fff,#f6f9ff);color:#1769ff;border-radius:10px;box-shadow:0 2px 8px rgba(23,105,255,.08)}.nnfl-pak-flag{font-size:18px;line-height:1;filter:drop-shadow(0 1px 1px rgba(17,24,39,.12))}.nnfl-pak-copy{display:grid;gap:0;text-align:left;line-height:1}.nnfl-pak-copy b{font-size:10px;font-weight:950;letter-spacing:.06em}.nnfl-pak-copy small{font-size:7px;font-weight:800;letter-spacing:.08em;margin-top:3px;color:#748196}.nnfl-pak-mode.is-active{background:linear-gradient(180deg,#1769ff,#0f5bdd);border-color:#1769ff;color:#fff;box-shadow:0 4px 12px rgba(23,105,255,.22)}.nnfl-pak-mode.is-active .nnfl-pak-copy small{color:rgba(255,255,255,.82)}.nnfl-brand{padding:0;text-align:left;font-size:11px;font-weight:900;letter-spacing:.08em}.nnfl-brand span{color:#1769ff}.nnfl-brand small{display:block;color:#748196;font-size:8px;letter-spacing:.04em;margin-top:2px}.nnfl-route-link{display:grid;justify-items:center;gap:2px;min-width:112px;padding:6px 8px;border:1px solid #d7e2f0;border-radius:10px;background:#fff;color:#1769ff;font-size:9px;line-height:1.05;font-weight:900;letter-spacing:.02em;box-shadow:0 2px 7px rgba(17,24,39,.05)}.nnfl-route-link small{font-size:8px;color:#1769ff;font-weight:900}';
            if (!text.includes(oldCss)) throw new Error('Expected top-button CSS not found; aborting.');
            text = text.replace(oldCss, newCss);
            const response = await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, message: 'Polish Pakistan mode and Nova Browser buttons', content: Buffer.from(text, 'utf8').toString('base64'), sha: current.data.sha });
            core.info(`Updated ${path} at ${response.data.commit.sha}`);
