# Trigger after workflow registration
name: Temporary Wallet and Speed Exact Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-patch-wallet-speed-20260824.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-latest-full-apk-recovery-20260823
          fetch-depth: 0

      - name: Apply exact isolated patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          wallet = Path('fresh-rebuild/src/features/apps/core-apps.js')
          text = wallet.read_text(encoding='utf-8')
          old = """  connect.addEventListener('click', () => refresh({ requestAccounts:true }));
  refresh();
  const p = provider();
  p?.on?.('accountsChanged', () => refresh());
  p?.on?.('chainChanged', () => refresh());
  root.__cleanup = () => off?.();
  return root;"""
          new = """  connect.addEventListener('click', () => refresh({ requestAccounts:true }));
  refresh();
  const p = provider();
  const handleAccountsChanged = () => refresh();
  const handleChainChanged = () => refresh();
  p?.on?.('accountsChanged', handleAccountsChanged);
  p?.on?.('chainChanged', handleChainChanged);
  root.__cleanup = () => {
    off?.();
    p?.removeListener?.('accountsChanged', handleAccountsChanged);
    p?.removeListener?.('chainChanged', handleChainChanged);
  };
  return root;"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Wallet anchor count {count}, expected 1')
          wallet.write_text(text.replace(old, new, 1), encoding='utf-8')

          speed = Path('fresh-rebuild/src/features/apps/premium-nova-internet-speed.js')
          text = speed.read_text(encoding='utf-8')
          old = """  const loadPrevious = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(NIS_RESULT_KEY) || 'null');
      if (saved && Number.isFinite(saved.download) && Number.isFinite(saved.upload)) applyResult(saved);
    } catch {}
  };"""
          new = """  const loadPrevious = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(NIS_RESULT_KEY) || 'null');
      if (saved && Number.isFinite(saved.download) && Number.isFinite(saved.upload)) {
        applyResult(saved);
        return saved;
      }
    } catch {}
    return null;
  };"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Speed load anchor count {count}, expected 1')
          text = text.replace(old, new, 1)
          old = "  updateOnline(); loadPrevious(); paintMeter(Number(localStorage.getItem(NIS_RESULT_KEY) ? JSON.parse(localStorage.getItem(NIS_RESULT_KEY)).download : 0) || 0, 'DOWNLOAD');"
          new = "  updateOnline();\n  const previous = loadPrevious();\n  paintMeter(Number(previous?.download) || 0, 'DOWNLOAD');"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Speed init anchor count {count}, expected 1')
          speed.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify only intended files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = $'fresh-rebuild/src/features/apps/core-apps.js\nfresh-rebuild/src/features/apps/premium-nova-internet-speed.js'
          git diff --check
          node --input-type=module --check < fresh-rebuild/src/features/apps/core-apps.js
          node --input-type=module --check < fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          git diff -- fresh-rebuild/src/features/apps/core-apps.js fresh-rebuild/src/features/apps/premium-nova-internet-speed.js

      - name: Commit exact patches to active branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Exact Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/core-apps.js fresh-rebuild/src/features/apps/premium-nova-internet-speed.js
          git commit -m 'fix: clean wallet listeners and speed saved state'
          git pull --rebase origin nexusnova-latest-full-apk-recovery-20260823
          git push origin HEAD:nexusnova-latest-full-apk-recovery-20260823
