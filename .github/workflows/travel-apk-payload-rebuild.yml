name: NexusNova Travel APK Payload Provenance Gate
on:
  workflow_dispatch:
  push:
    branches: [travel-fare-lens-final]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Provider contract tests
        working-directory: functions
        run: node --test travel-provider.test.js travel-master-provider.test.js hotel-value.test.js travel-contracts.test.js travelport-provider.test.js
      - name: Security and source provenance
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RFn 'Travel planning and live sources' fresh-rebuild/src
          ! grep -RFn 'SMART DEFAULT' fresh-rebuild/src
          ! grep -RFn 'rgba(20,45,78' fresh-rebuild/src
          grep -Fq "{ id: 'travel', name: 'Fare Lens', category: 'Travel'" fresh-rebuild/src/features/hub/app-registry.js
          grep -Fq 'travel-runtime-shell-bridge.js' fresh-rebuild/index.html
          grep -Fq 'fare-lens-runtime-repair-v2.css' fresh-rebuild/index.html
          grep -Fq "['./travel-fare-lens.js', 'fareLensRenderers']" fresh-rebuild/src/features/apps/app-screen.js
          ! grep -REiq '(AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' fresh-rebuild/src functions docs
      - name: Android asset provenance before build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NexusNovaAndroid/app/src/main/assets/www
          mkdir -p NexusNovaAndroid/app/src/main/assets/www
          cp -a fresh-rebuild/. NexusNovaAndroid/app/src/main/assets/www/
          diff -qr fresh-rebuild NexusNovaAndroid/app/src/main/assets/www
          ! grep -RFn 'Travel planning and live sources' NexusNovaAndroid/app/src/main/assets/www/src
          ! grep -RFn 'SMART DEFAULT' NexusNovaAndroid/app/src/main/assets/www/src
          grep -Fq 'travel-runtime-shell-bridge.js' NexusNovaAndroid/app/src/main/assets/www/index.html
          grep -Fq 'fare-lens-runtime-repair-v2.css' NexusNovaAndroid/app/src/main/assets/www/index.html
      - name: Setup Java 17 and Gradle 8.13
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Configure signing and version
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt'); s=p.read_text(); s,n=re.subn(r'const val BUNDLED_WEB_BASE = "[0-9a-f]{40}"', f'const val BUNDLED_WEB_BASE = "{os.environ["GITHUB_SHA"].lower()}"', s, count=1); assert n == 1; p.write_text(s)
          p=Path('app/build.gradle.kts'); s=p.read_text(); s,n1=re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 26091510', s, count=1); s,n2=re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.42-travel-apk-payload"', s, count=1); assert n1 == n2 == 1
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {','    signingConfigs {\n        create("release") {\n            storeFile = file("nexusnova-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n\n    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("release")\n',1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: NexusNovaAndroid
        run: gradle --no-daemon clean assembleRelease
      - name: Inspect actual APK payload
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -n1 | tee /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q "name='com.nexusnova.app'" /tmp/badging.txt
          grep -q "versionCode='26091510'" /tmp/badging.txt
          grep -q "versionName='1.0.42-travel-apk-payload'" /tmp/badging.txt
          unzip -t "$APK" >/tmp/unzip-test.txt
          rm -rf /tmp/nxapk && mkdir -p /tmp/nxapk
          unzip -q "$APK" 'assets/www/*' -d /tmp/nxapk
          INDEX=/tmp/nxapk/assets/www/index.html
          MAIN=/tmp/nxapk/assets/www/src/main.js
          APP=/tmp/nxapk/assets/www/src/features/apps/app-screen.js
          REG=/tmp/nxapk/assets/www/src/features/hub/app-registry.js
          CTX=/tmp/nxapk/assets/www/src/features/apps/smart-travel-context.js
          BRIDGE=/tmp/nxapk/assets/www/src/travel-runtime-shell-bridge.js
          CSS=/tmp/nxapk/assets/www/assets/styles/fare-lens-runtime-repair-v2.css
          test -f "$INDEX" && test -f "$MAIN" && test -f "$APP" && test -f "$REG" && test -f "$CTX" && test -f "$BRIDGE" && test -f "$CSS"
          grep -Fq 'src/travel-runtime-shell-bridge.js' "$INDEX"
          grep -Fq 'src/main.js?ota=nv16' "$INDEX"
          test "$(grep -n 'travel-runtime-shell-bridge.js' "$INDEX" | cut -d: -f1 | head -1)" -lt "$(grep -n 'src/main.js?ota=nv16' "$INDEX" | cut -d: -f1 | head -1)"
          grep -Fq "{ id: 'travel', name: 'Fare Lens', category: 'Travel'" "$REG"
          ! grep -Fq 'Travel planning and live sources' "$REG"
          ! grep -Fq 'SMART DEFAULT' "$CTX"
          ! grep -Fq 'rgba(20,45,78' "$CTX"
          grep -Fq 'nx-travel-runtime-screen' "$BRIDGE"
          grep -Fq 'screen.querySelectorAll' "$BRIDGE"
          grep -Fq 'fare-lens-runtime-repair-v2.css' "$INDEX"
          grep -Fq "['./travel-fare-lens.js', 'fareLensRenderers']" "$APP"
          ! grep -RFn 'Travel planning and live sources' /tmp/nxapk/assets/www/src
          ! grep -RFn 'SMART DEFAULT' /tmp/nxapk/assets/www/src
          ! grep -RFn 'Smart Travel Context' /tmp/nxapk/assets/www/src
          sha256sum "$APK" | tee signed-output-sha.txt
          cp "$APK" NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED.apk
          sha256sum NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED.apk | tee NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED.apk.sha256
      - name: Upload inspected APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED
          path: |
            NexusNovaAndroid/NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED.apk
            NexusNovaAndroid/NexusNova-v1.0.42-TRAVEL-APK-PAYLOAD-SIGNED.apk.sha256
            NexusNovaAndroid/signed-output-sha.txt
          if-no-files-found: error
          retention-days: 14
