name: Travel V30 and Drive Recovery Real Preview

on:
  push:
    branches: ['fix/travel-v30-drive-recovery']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify edited source
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v30.js
          node --check fresh-rebuild/src/core/drive-track-persistence.js
          grep -Fq 'dockRect.top - 10' fresh-rebuild/src/features/apps/travel-phone-layout-v30.js
          grep -Fq 'for (const candidate of candidates)' fresh-rebuild/src/core/drive-track-persistence.js
      - name: Create Drive runtime harness
        run: |
          mkdir -p preview
          cat > fresh-rebuild/drive-v30-preview.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020706;font-family:Inter,system-ui,sans-serif}#nxgold14{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}</style></head><body><script type="module">
          import './src/nova-drive-gold-maptiler-v14-ui.js';
          const api=window.NexusNovaGoldV14;api.mount();
          api.setHistory({filter:'All',distance:'48.7',time:'1h 42m',avg:'28',top:'57',trips:4,start:'Home, Karachi',end:'School, Karachi',routePoints:[{lat:24.8607,lng:67.0011},{lat:24.8622,lng:67.0100},{lat:24.8660,lng:67.0200},{lat:24.8710,lng:67.0310},{lat:24.8780,lng:67.0420},{lat:24.8870,lng:67.0530}]});
          api.show('history');
          </script></body></html>
          HTML
      - name: Render actual code
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/preview.log 2>&1 &
          trap 'kill $! || true' EXIT
          sleep 1
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=674,1500 --virtual-time-budget=2200 --screenshot=preview/travel-v30.png 'http://127.0.0.1:8765/fresh-rebuild/travel-flagship-v16-harness.html?bottom=4&dock=62'
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=674,1500 --virtual-time-budget=2200 --screenshot=preview/drive-recovery-v30.png 'http://127.0.0.1:8765/fresh-rebuild/drive-v30-preview.html'
          test "$(stat -c%s preview/travel-v30.png)" -gt 20000
          test "$(stat -c%s preview/drive-recovery-v30.png)" -gt 20000
      - uses: actions/upload-artifact@v4
        with:
          name: Travel-Drive-V30-ACTUAL-CODE-PREVIEWS
          path: preview/*.png
          retention-days: 7
