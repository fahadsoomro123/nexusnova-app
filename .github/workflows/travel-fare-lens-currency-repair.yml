name: Travel Fare Lens Currency Repair

on:
  push:
    branches: [travel-fare-lens-final]
    paths:
      - '.github/workflows/travel-fare-lens-currency-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: travel-fare-lens-final
          fetch-depth: 0

      - name: Apply exact currency propagation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          provider=Path('functions/flightapi-provider.js')
          s=provider.read_text()
          s2=s.replace('function normalizeItineraryRows(payload){', "function normalizeItineraryRows(payload,fallbackCurrency=''){")
          s2=s2.replace("const currency=cheapest?.price?.currency||cp?.currency||itinerary?.currency||root?.currency||'';", "const currency=cheapest?.price?.currency||cp?.currency||itinerary?.currency||root?.currency||fallbackCurrency||'';")
          s2=s2.replace('results:normalizeItineraryRows(payload)', 'results:normalizeItineraryRows(payload,input.currency)')
          if s2==s:
              raise SystemExit('Expected FlightAPI normalization source pattern was not found')
          provider.write_text(s2)

          travel=Path('fresh-rebuild/src/features/apps/travel-fare-lens.js')
          t=travel.read_text()
          t2=t.replace("const API_BASE=String(globalThis.NexusNovaTravelConfig?.apiBase||'/api/travel').replace(/\\/$/,'');", "const API_BASE='https://nexusnova-6ade2.web.app/api/travel';", 1)
          t2=re.sub(r'<style>.*?</style>', '<style></style>', t2, count=1, flags=re.S)
          travel.write_text(t2)
          PY
          git diff --check
          grep -q "normalizeItineraryRows(payload,fallbackCurrency='')" functions/flightapi-provider.js
          grep -q 'normalizeItineraryRows(payload,input.currency)' functions/flightapi-provider.js
          ! grep -q '#020611' fresh-rebuild/src/features/apps/travel-fare-lens.js
          ! grep -q '#07111f' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -q 'https://nexusnova-6ade2.web.app/api/travel' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -qi '#087f5b' fresh-rebuild/assets/styles/fare-lens-flagship-v1.css

      - name: REAL FlightAPI KHI to ISB USD verification after repair
        env:
          FLIGHTAPI_API_KEY: ${{ secrets.FLIGHTAPI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLIGHTAPI_API_KEY:-}" || { echo 'LIVE_VERIFICATION_BLOCKED missing FLIGHTAPI_API_KEY'; exit 1; }
          departure="$(date -u -d '+30 days' +%F)"
          curl -sS --fail --get "https://api.flightapi.io/onewaytrip/${FLIGHTAPI_API_KEY}/KHI/ISB/${departure}/1/0/0/Economy/USD" --data-urlencode 'region=PK' -o /tmp/flightapi.json
          node - <<'NODE'
          const fs=require('fs');
          const {normalizeItineraryRows}=require('./functions/flightapi-provider');
          const x=JSON.parse(fs.readFileSync('/tmp/flightapi.json','utf8'));
          const raw=x.itineraries||x.data?.itineraries||[];
          if(!Array.isArray(raw)||raw.length!==42) console.log('LIVE_API_ITINERARIES='+raw.length);
          if(!raw.length) throw new Error('EMPTY_FLIGHT_INVENTORY');
          const rows=normalizeItineraryRows(x,'USD');
          const priced=rows.filter(r=>r.price!=null);
          if(!priced.length) throw new Error('NORMALIZED_NO_PRICED_INVENTORY');
          const bad=priced.filter(r=>String(r.currency).toUpperCase()!=='USD');
          if(bad.length) throw new Error('NORMALIZED_CURRENCY_MISMATCH='+bad.length);
          console.log('REAL_NORMALIZATION_OK provider=FlightAPI raw_itineraries='+raw.length+' normalized='+rows.length+' priced='+priced.length+' currency=USD');
          console.log('FIRST_OFFER='+JSON.stringify({airline:priced[0].airline,route:priced[0].route,price:priced[0].price,currency:priced[0].currency}));
          NODE

      - name: Commit repair to source branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions/flightapi-provider.js fresh-rebuild/src/features/apps/travel-fare-lens.js; then
            echo 'Repair already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/flightapi-provider.js fresh-rebuild/src/features/apps/travel-fare-lens.js
          git commit -m 'fix(travel): propagate requested FlightAPI currency through normalization'
          git push origin HEAD:travel-fare-lens-final
