name: NexusNova Travel Fare Lens Final Gate
on:
  push:
    branches: [travel-fare-lens-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 19 provider and contract tests
        working-directory: functions
        run: node --test travel-provider.test.js travel-master-provider.test.js hotel-value.test.js travel-contracts.test.js travelport-provider.test.js
      - name: Security and source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "['./travel-fare-lens.js', 'fareLensRenderers']" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq 'data-pick="origin"' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'data-pick="destination"' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'Fare Calendar' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'Rescue' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'provider data only' fresh-rebuild/src/features/apps/travel-fare-lens.js
          ! grep -REiq '(AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' fresh-rebuild/src functions docs
          ! grep -REq '\b(eval|Function)\s*\(' fresh-rebuild/src functions
      - name: Real Chromium mobile 390x844 and 412x915
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium
          python3 -m pip install --user --break-system-packages websocket-client
          cat > fresh-rebuild/.ci-fare-lens-mobile.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;padding:0;width:100%;min-height:100%;}</style><link rel="stylesheet" href="./assets/styles/phone-visible-fixes.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-v1.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-layout-v1.css"></head><body><script type="module">import {renderTravel} from './src/features/apps/travel-fare-lens.js';document.body.append(renderTravel());</script></body></html>
          EOF
          python3 -m http.server 8765 --directory fresh-rebuild >/tmp/nx-http.log 2>&1 & HP=$!
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/nx-chrome" --remote-debugging-port=9222 --remote-allow-origins=* about:blank >/tmp/nx-chrome.log 2>&1 & CP=$!
          trap 'kill "$HP" "$CP" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/.ci-fare-lens-mobile.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep 1; done
          python3 - <<'PY'
          import json,time,urllib.request,websocket
          pages=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list')); page=next(p for p in pages if p.get('type')=='page'); ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=30); seq=0
          def call(method,params=None):
            global seq; seq+=1; ws.send(json.dumps({'id':seq,'method':method,'params':params or {}}))
            while True:
              m=json.loads(ws.recv())
              if m.get('id')==seq:
                if 'error' in m: raise RuntimeError(m['error'])
                return m.get('result',{})
          call('Page.enable');call('Runtime.enable')
          for width,height in ((390,844),(412,915)):
            call('Emulation.setDeviceMetricsOverride',{'width':width,'height':height,'deviceScaleFactor':1,'mobile':True,'screenWidth':width,'screenHeight':height})
            call('Page.navigate',{'url':'http://127.0.0.1:8765/.ci-fare-lens-mobile.html'});time.sleep(2)
            expr="""(()=>{try{const d=document.documentElement,b=document.body,t=document.querySelector('.nxf-travel'),panel=t&&t.querySelector('.nxf-panel'),primary=t&&t.querySelector('.nxf-primary');if(!t)return{error:'TRAVEL_NOT_RENDERED'};const text=b.innerText;const pick=s=>{const e=document.querySelector(s);if(!e)return{s,ok:false,missing:true};const r=e.getBoundingClientRect();return{s,ok:r.width>0&&r.height>0&&r.left>=0&&r.right<=innerWidth+.5&&r.top>=0&&r.bottom<=innerHeight+.5,width:r.width,height:r.height}};const geom=[pick('.nxf-tabs button'),pick('.nxf-route [data-pick="origin"]'),pick('.nxf-route [data-pick="destination"]'),pick('[data-search]')];const bg=[getComputedStyle(t).backgroundColor,getComputedStyle(panel).backgroundColor,getComputedStyle(primary).backgroundColor];const rgb=c=>{const m=String(c).match(/(\\d+)[^\\d]+(\\d+)[^\\d]+(\\d+)/);return m?[+m[1],+m[2],+m[3]]:null};const vals=bg.map(rgb).filter(Boolean);const dark=vals.some(([r,g,b])=>Math.max(r,g,b)<80);const blue=vals.some(([r,g,b])=>b>r*1.12&&b>g*1.08);const emerald=bg.includes('rgb(8, 127, 91)')||bg.includes('rgb(5, 103, 71)');return{width:innerWidth,height:innerHeight,docW:d.scrollWidth,bodyW:b.scrollWidth,docH:d.scrollHeight,labels:['Compare before you book.','Fare Calendar','Disruption Rescue','Flight status','SEARCH FLIGHTS'].every(x=>text.includes(x)),geom,dark,blue,emerald}}catch(e){return{error:String(e&&e.stack||e)}}})()"""
            out=call('Runtime.evaluate',{'expression':expr,'returnByValue':True}); r=out.get('result',{}).get('value')
            if not r: raise RuntimeError('BROWSER_EVALUATION_RETURNED_NO_VALUE '+json.dumps(out))
            ok=r.get('width')==width and r.get('height')==height and r['docW']<=width and r['bodyW']<=width and r['labels'] and all(x['ok'] for x in r['geom']) and r['geom'][1]['height']>=34 and r['geom'][2]['height']>=34 and r['geom'][3]['height']>=40 and not r['dark'] and not r['blue'] and r['emerald']
            print(f'BROWSER {width}x{height}: {"PASS" if ok else "FAIL"}',json.dumps(r,sort_keys=True))
            if not ok: raise SystemExit(1)
          PY
