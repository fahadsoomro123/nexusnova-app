name: Travel Fare Lens Gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Attach Travel renderer and restore Hub tap behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('fresh-rebuild/src/features/apps/app-screen.js')
          s=app.read_text(encoding='utf-8')
          line="  ['./travel-fare-lens.js', 'fareLensRenderers'],\n"
          marker="const rendererSources = [\n"
          if line not in s:
              if marker not in s: raise SystemExit('rendererSources marker missing')
              s=s.replace(marker, marker+line, 1)
              app.write_text(s, encoding='utf-8')
          hub=Path('fresh-rebuild/src/features/hub/hub-screen.js')
          h=hub.read_text(encoding='utf-8')
          h=h.replace("const ICON_ONLY_HUB_APP_IDS = new Set(['travel']);", "const ICON_ONLY_HUB_APP_IDS = new Set();")
          h=h.replace("aria-label=\"${ICON_ONLY_HUB_APP_IDS.has(app.id) ? app.name : `Open ${app.name}`}\"", "aria-label=\"Open ${app.name}\"")
          h=h.replace("        if (ICON_ONLY_HUB_APP_IDS.has(appId)) return;\n", "")
          hub.write_text(h, encoding='utf-8')
          PY
      - name: Validate Travel files
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-fare-lens.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/hub/hub-screen.js
          grep -Fq "./travel-fare-lens.js" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq "www.nexusnovatools.com" fresh-rebuild/src/features/apps/travel-fare-lens.js
          ! grep -Fq "Always opens inside Nova Browser" fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq "const ICON_ONLY_HUB_APP_IDS = new Set();" fresh-rebuild/src/features/hub/hub-screen.js
      - name: Commit integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Travel Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add fresh-rebuild/src/features/apps/app-screen.js fresh-rebuild/src/features/hub/hub-screen.js
          git diff --cached --quiet || git commit -m 'feat(travel): wire Fare Lens into app and hub'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Travel Gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/travel-fare-lens-gate.yml
          git commit -m 'chore(travel): remove temporary Fare Lens gate'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
