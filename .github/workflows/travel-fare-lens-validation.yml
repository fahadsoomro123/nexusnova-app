name: Travel Fare Lens Validation
on:
  push:
    branches: [travel-fare-lens-final]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-fare-lens.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/hub/hub-screen.js
          node --check fresh-rebuild/src/features/apps/smart-travel-context.js
          node --check fresh-rebuild/src/features/apps/travel-master-enhancer.js
          node --check functions/travel-provider.js
          node --check functions/travel-provider.test.js
          node --check functions/travel-api.js
          node --check functions/travel-api-v2.js
          node --check functions/flightapi-provider.js
          node --check functions/duffel-stays-provider.js
          node --check functions/travelport-provider.js
          node --check functions/travelport-provider.test.js
          node --check functions/hotel-value.js
          node --check functions/travel-master-provider.test.js
          node --check functions/hotel-value.test.js
          node --check functions/travel-contracts.js
          node --check functions/travel-contracts.test.js
      - name: Provider unit tests
        working-directory: functions
        run: node --test travel-provider.test.js travel-master-provider.test.js hotel-value.test.js travel-contracts.test.js travelport-provider.test.js
      - name: Travel contract checks
        shell: bash
        run: |
          set -euo pipefail
          assert_contains() {
            local file="$1"; local needle="$2"
            if grep -Fq -- "$needle" "$file"; then echo "PASS: $file contains: $needle"; else echo "FAIL: $file is missing required travel contract: $needle"; exit 1; fi
          }
          assert_absent() {
            local file="$1"; local needle="$2"
            if grep -Fq -- "$needle" "$file"; then echo "FAIL: $file contains forbidden travel contract: $needle"; exit 1; else echo "PASS: $file omits forbidden travel contract: $needle"; fi
          }
          assert_contains fresh-rebuild/src/features/apps/app-screen.js "['./travel-fare-lens.js', 'fareLensRenderers']"
          assert_contains fresh-rebuild/src/features/apps/app-screen.js 'enhanceSmartTravelContext'
          assert_contains fresh-rebuild/src/features/apps/travel-fare-lens.js 'data-pick="origin"'
          assert_contains fresh-rebuild/src/features/apps/travel-fare-lens.js 'data-pick="destination"'
          assert_contains fresh-rebuild/src/features/apps/travel-fare-lens.js 'Fare Calendar'
          assert_contains fresh-rebuild/src/features/apps/travel-fare-lens.js 'Rescue'
          assert_contains fresh-rebuild/src/features/apps/travel-fare-lens.js 'provider data only'
          assert_contains functions/travel-api.js 'exports.travelApi=onRequest'
          assert_contains functions/index.js 'travel-api-v2'
          assert_contains functions/travel-provider.js 'DUFFEL_ACCESS_TOKEN'
          assert_contains functions/flightapi-provider.js 'FLIGHTAPI_API_KEY'
          assert_contains functions/travelport-provider.js 'TRAVELPORT_CLIENT_ID'
          assert_contains functions/travelport-provider.js 'client_credentials'
          assert_contains functions/travel-api-v2.js 'createTravelportProvider'
          assert_contains functions/travel-provider.js '/air/offer_requests'
          assert_contains functions/duffel-stays-provider.js '/stays/search'
          assert_contains functions/duffel-stays-provider.js '/stays/quotes'
          assert_contains functions/duffel-stays-provider.js '/stays/bookings'
          assert_contains functions/duffel-stays-provider.js 'guests:validated.guests'
          assert_contains functions/duffel-stays-provider.js 'booking_unknown'
          assert_contains functions/hotel-value.js 'analyzeHotelValue'
          assert_contains functions/hotel-value.test.js 'analyzeHotelValue'
          assert_contains functions/travel-provider.js 'ourairports-data/main/airports.csv'
          assert_contains firebase.json '"source": "/api/travel/**"'
          assert_contains firebase.json '"function": "travelApi"'
          assert_contains fresh-rebuild/index.html 'fare-lens-flagship-v1.css'
          assert_contains fresh-rebuild/index.html 'fare-lens-flagship-layout-v1.css'
          assert_contains fresh-rebuild/assets/styles/fare-lens-flagship-v1.css '#087f5b'
          assert_contains fresh-rebuild/assets/styles/fare-lens-flagship-layout-v1.css 'grid-template-columns'
          assert_contains functions/travel-contracts.js 'PAYMENT_UNKNOWN'
          assert_contains functions/travel-contracts.js 'UNKNOWN'
          assert_contains functions/travel-contracts.js 'TRAVEL_DEMO_MODE'
          assert_contains functions/travel-api-v2.js 'requireUser'
          assert_contains functions/travel-api-v2.js 'Idempotency-Key'
          assert_contains functions/travel-api-v2.js 'X-Frame-Options'
          assert_contains TRAVEL-PARTNER-READINESS.md 'Provider Adapter'
          assert_contains fresh-rebuild/partner-demo.html 'DEMO / TEST DATA'
          assert_absent fresh-rebuild/src/features/apps/travel-fare-lens.js 'Always opens inside Nova Browser'
          assert_absent fresh-rebuild/src/features/apps/travel-fare-lens.js 'SELECT & BOOK'
      - name: Secret and dynamic-code scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REiq '(AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' fresh-rebuild/src functions docs
          ! grep -REq '\b(eval|Function)\s*\(' fresh-rebuild/src functions
          ! grep -REiq 'DUFFEL_ACCESS_TOKEN[[:space:]]*[:=][[:space:]]*.*duffel_' fresh-rebuild/src functions
          ! grep -REiq 'FLIGHTAPI_API_KEY[[:space:]]*[:=][[:space:]]*.*[A-Za-z0-9_-]{20,}' fresh-rebuild/src functions
          ! grep -REiq 'TRAVELPORT_(CLIENT_ID|CLIENT_SECRET|ACCESS_GROUP)[[:space:]]*[:=][[:space:]]*.*[A-Za-z0-9_-]{12,}' fresh-rebuild/src functions
          ! grep -REiq 'console\.(log|error|warn).*?(cardNumber|cvv|cvc|DUFFEL_ACCESS_TOKEN|FLIGHTAPI_API_KEY|TRAVELPORT_CLIENT_SECRET|Authorization)' fresh-rebuild/src functions
      - name: Real browser Fare Lens viewport validation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v chromium >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y chromium; fi
          python3 -m pip install --user --break-system-packages websocket-client
          BROWSER_BIN="$(command -v chromium || command -v google-chrome)"
          cat > fresh-rebuild/.ci-fare-lens-mobile-test.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./assets/styles/phone-visible-fixes.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-v1.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-layout-v1.css"></head><body><script type="module">import { renderTravel } from './src/features/apps/travel-fare-lens.js'; document.body.append(renderTravel());</script></body></html>
          EOF
          python3 -m http.server 8765 --directory fresh-rebuild >/tmp/fare-lens-http.log 2>&1 & SERVER_PID=$!
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/fare-lens-chrome" --remote-debugging-port=9222 --remote-allow-origins=* about:blank >/tmp/fare-lens-chrome.log 2>&1 & BROWSER_PID=$!
          cleanup(){ kill "$SERVER_PID" >/dev/null 2>&1 || true; kill "$BROWSER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/.ci-fare-lens-mobile-test.html >/dev/null 2>&1 && break; sleep 1; done
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/.ci-fare-lens-mobile-test.html >/dev/null
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          python3 - <<'PY'
          import base64,json,os,time,urllib.request,websocket
          pages=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list')); page_data=next(p for p in pages if p.get('type')=='page')
          ws=websocket.create_connection(page_data['webSocketDebuggerUrl'],timeout=30); seq=0
          def call(method,params=None):
              global seq; seq+=1; ws.send(json.dumps({'id':seq,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==seq:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          call('Page.enable'); call('Runtime.enable'); results={}
          for width,height,mobile in ((390,844,True),(412,915,True),(1280,800,False)):
              call('Emulation.setDeviceMetricsOverride',{'width':width,'height':height,'deviceScaleFactor':1,'mobile':mobile,'screenWidth':width,'screenHeight':height})
              call('Page.navigate',{'url':'http://127.0.0.1:8765/.ci-fare-lens-mobile-test.html'}); time.sleep(1.5)
              expr="""(async()=>{await new Promise(r=>setTimeout(r,250));document.documentElement.scrollTop=0;document.body.scrollTop=0;window.scrollTo(0,0);const body=document.body,doc=document.documentElement,travel=document.querySelector('.nxf-travel'),main=document.querySelector('.nxf-main');window.scrollTo(0,100);const forced={y:scrollY,x:scrollX};window.scrollTo(0,0);const interactive=[...document.querySelectorAll('.nxf-travel button,.nxf-travel input,.nxf-travel select,.nxf-travel a')].map((el,i)=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return {i,tag:el.tagName,text:(el.innerText||el.getAttribute('aria-label')||el.getAttribute('placeholder')||'').trim().slice(0,80),display:cs.display,visibility:cs.visibility,width:r.width,height:r.height,left:r.left,top:r.top,right:r.right,bottom:r.bottom,inside:cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0&&r.left>=0&&r.top>=0&&r.right<=innerWidth+0.5&&r.bottom<=innerHeight+0.5}});const internal=[...document.querySelectorAll('*')].filter(el=>{const cs=getComputedStyle(el);return(cs.overflowY==='auto'||cs.overflowY==='scroll')&&el.scrollHeight>el.clientHeight+1}).map(el=>({class:String(el.className||el.id||el.tagName),scrollHeight:el.scrollHeight,clientHeight:el.clientHeight}));const cssColor=el=>{if(!el)return'';const s=getComputedStyle(el);return[s.backgroundColor,s.color,s.borderTopColor].join('|')};const primary=travel?.querySelector('.nxf-primary,.nxf-tabs button.on');const surface=travel?.querySelector('.nxf-panel');const renderedColors={travelBg:cssColor(travel),appBg:cssColor(travel?.querySelector('.nxf-app')),surface:cssColor(surface),primary:cssColor(primary)};const colors=Object.values(renderedColors).join('|');const backgrounds=Object.values(renderedColors).map(v=>v.split('|')[0]).filter(v=>v&&v!=='rgba(0, 0, 0, 0)');const rgb=backgrounds.map(v=>v.match(/(\\d+)[^\\d]+(\\d+)[^\\d]+(\\d+)/)).filter(Boolean).map(m=>[Number(m[1]),Number(m[2]),Number(m[3])]);const darkSurface=rgb.some(([r,g,b])=>Math.max(r,g,b)<80);const blueDominant=rgb.some(([r,g,b])=>b>r*1.12&&b>g*1.08);const emeraldPresent=colors.includes('rgb(8, 127, 91)')||colors.includes('rgb(5, 103, 71)');const text=document.body.innerText;return{width:innerWidth,height:innerHeight,documentScrollHeight:doc.scrollHeight,bodyScrollHeight:body.scrollHeight,documentScrollWidth:doc.scrollWidth,bodyScrollWidth:body.scrollWidth,forcedScrollY:forced.y,forcedScrollX:forced.x,windowScrollY:scrollY,windowScrollX:scrollX,mainScrollHeight:main?.scrollHeight||0,mainClientHeight:main?.clientHeight||0,mainOverflow:main?getComputedStyle(main).overflowY:'',internalScrollable:internal,travelPresent:!!travel,requiredLabels:['Compare before you book.','Fare Calendar','Disruption Rescue','Flight status','SEARCH FLIGHTS'].map(t=>[t,text.includes(t)]),interactiveCount:interactive.length,interactiveGeometry:interactive,renderedColors,backgrounds,darkSurface,blueDominant,emeraldPresent}})()"""
              r=call('Runtime.evaluate',{'expression':expr,'awaitPromise':True,'returnByValue':True})['result']['value']; results[f'{width}x{height}']=r
              out=os.environ['RUNNER_TEMP']+f'/fare-lens-{width}x{height}.png';open(out,'wb').write(base64.b64decode(call('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False,'fromSurface':True})['data']))
          print(json.dumps(results,indent=2,sort_keys=True))
          for key,r in results.items():
              geometry_ok=bool(r['interactiveCount']) and all(x['inside'] for x in r['interactiveGeometry']); labels_ok=all(v for _,v in r['requiredLabels'])
              mobile_ok=(key in ('390x844','412x915') and r['documentScrollHeight']==r['height'] and r['documentScrollWidth']==r['width'] and r['forcedScrollY']==0 and r['forcedScrollX']==0 and r['windowScrollY']==0 and r['windowScrollX']==0)
              desktop_ok=(key=='1280x800' and r['documentScrollHeight']<=r['height'] and r['documentScrollWidth']<=r['width'] and r['forcedScrollY']==0 and r['forcedScrollX']==0 and r['windowScrollY']==0 and r['windowScrollX']==0)
              palette_ok=(not r['darkSurface']) and (not r['blueDominant']) and r['emeraldPresent']; ok=r['travelPresent'] and (mobile_ok or desktop_ok) and geometry_ok and labels_ok and palette_ok
              print(f'ACCEPT {key}: {"PASS" if ok else "FAIL"}')
              if not ok: raise SystemExit(1)
          PY
          mkdir -p "$RUNNER_TEMP/fare-lens-screenshots"
          cp "$RUNNER_TEMP"/fare-lens-390x844.png "$RUNNER_TEMP/fare-lens-screenshots/"
          cp "$RUNNER_TEMP"/fare-lens-412x915.png "$RUNNER_TEMP/fare-lens-screenshots/"
          cp "$RUNNER_TEMP"/fare-lens-1280x800.png "$RUNNER_TEMP/fare-lens-screenshots/"
      - name: Upload real browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fare-lens-real-browser-390-412-desktop
          path: ${{ runner.temp }}/fare-lens-screenshots/
          if-no-files-found: error
