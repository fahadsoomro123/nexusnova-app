name: Travel Fare Lens Validation
on:
  push:
    branches: [travel-fare-lens-final]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-fare-lens.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/hub/hub-screen.js
          node --check fresh-rebuild/src/features/apps/smart-travel-context.js
          node --check fresh-rebuild/src/features/apps/travel-master-enhancer.js
          node --check functions/travel-provider.js
          node --check functions/travel-api.js
          node --check functions/travel-api-v2.js
          node --check functions/flightapi-provider.js
          node --check functions/duffel-stays-provider.js
          node --check functions/travelport-provider.js
          node --check functions/travel-master-provider.test.js
          node --check functions/travel-contracts.test.js
      - name: Provider unit tests — exactly 19
        working-directory: functions
        run: node --test travel-provider.test.js travel-master-provider.test.js hotel-value.test.js travel-contracts.test.js travelport-provider.test.js
      - name: Travel contract and security checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "['./travel-fare-lens.js', 'fareLensRenderers']" fresh-rebuild/src/features/apps/app-screen.js
          grep -Fq 'data-pick="origin"' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'data-pick="destination"' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'Fare Calendar' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'Rescue' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'provider data only' fresh-rebuild/src/features/apps/travel-fare-lens.js
          grep -Fq 'FLIGHTAPI_API_KEY' functions/flightapi-provider.js
          ! grep -REiq '(AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' fresh-rebuild/src functions docs
          ! grep -REq '\b(eval|Function)\s*\(' fresh-rebuild/src functions
          ! grep -REiq 'DUFFEL_ACCESS_TOKEN[[:space:]]*[:=][[:space:]]*.*duffel_' fresh-rebuild/src functions
          ! grep -REiq 'FLIGHTAPI_API_KEY[[:space:]]*[:=][[:space:]]*.*[A-Za-z0-9_-]{20,}' fresh-rebuild/src functions
      - name: Real Chromium mobile validation — 390x844 and 412x915 only
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v chromium >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq chromium; fi
          python3 -m pip install --user --break-system-packages websocket-client
          BROWSER_BIN="$(command -v chromium || command -v google-chrome)"
          cat > fresh-rebuild/.ci-fare-lens-mobile-test.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;padding:0;width:100%;min-height:100%;}</style><link rel="stylesheet" href="./assets/styles/phone-visible-fixes.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-v1.css"><link rel="stylesheet" href="./assets/styles/fare-lens-flagship-layout-v1.css"></head><body><script type="module">import {renderTravel} from './src/features/apps/travel-fare-lens.js';document.body.append(renderTravel());</script></body></html>
          EOF
          python3 -m http.server 8765 --directory fresh-rebuild >/tmp/fare-lens-http.log 2>&1 & SERVER_PID=$!
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/fare-lens-chrome" --remote-debugging-port=9222 --remote-allow-origins=* about:blank >/tmp/fare-lens-chrome.log 2>&1 & BROWSER_PID=$!
          trap 'kill "$SERVER_PID" "$BROWSER_PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/.ci-fare-lens-mobile-test.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep 1; done
          python3 - <<'PY'
          import json,time,urllib.request,websocket
          pages=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list')); page=next(p for p in pages if p.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=30); seq=0
          def call(method,params=None):
              global seq; seq+=1; ws.send(json.dumps({'id':seq,'method':method,'params':params or {}}))
              while True:
                  m=json.loads(ws.recv())
                  if m.get('id')==seq:
                      if 'error' in m: raise RuntimeError(m['error'])
                      return m.get('result',{})
          call('Page.enable');call('Runtime.enable')
          for w,h in ((390,844),(412,915)):
              call('Emulation.setDeviceMetricsOverride',{'width':w,'height':h,'deviceScaleFactor':1,'mobile':True,'screenWidth':w,'screenHeight':h})
              call('Page.navigate',{'url':'http://127.0.0.1:8765/.ci-fare-lens-mobile-test.html'});time.sleep(2)
              expr="""(()=>{try{const d=document.documentElement,b=document.body,t=document.querySelector('.nxf-travel'),panel=t&&t.querySelector('.nxf-panel'),primary=t&&t.querySelector('.nxf-primary');const text=b.innerText;const pick=s=>{const e=document.querySelector(s);if(!e)return{s,ok:false,missing:true};const r=e.getBoundingClientRect();return{s,ok:r.width>0&&r.height>0&&r.left>=0&&r.right<=innerWidth+.5&&r.top>=0&&r.bottom<=innerHeight+.5,width:r.width,height:r.height}};const geom=[pick('.nxf-tabs button'),pick('.nxf-route [data-pick="origin"]'),pick('.nxf-route [data-pick="destination"]'),pick('[data-search]')];const bg=[t&&getComputedStyle(t).backgroundColor,panel&&getComputedStyle(panel).backgroundColor,primary&&getComputedStyle(primary).backgroundColor].filter(Boolean);const rgb=c=>{const m=String(c).match(/(\\d+)[^\\d]+(\\d+)[^\\d]+(\\d+)/);return m?[+m[1],+m[2],+m[3]]:null};const vals=bg.map(rgb).filter(Boolean);const dark=vals.some(([r,g,b])=>Math.max(r,g,b)<80);const blue=vals.some(([r,g,b])=>b>r*1.12&&b>g*1.08);const emerald=bg.includes('rgb(8, 127, 91)')||bg.includes('rgb(5, 103, 71)');return{w,h,travel:!!t,panel:!!panel,primary:!!primary,docW:d.scrollWidth,bodyW:b.scrollWidth,docH:d.scrollHeight,labels:['Compare before you book.','Fare Calendar','Disruption Rescue','Flight status','SEARCH FLIGHTS'].every(x=>text.includes(x)),geom,dark,blue,emerald,bodyText:text.slice(0,240)}}catch(e){return{error:String(e&&e.stack||e)}}})()"""
              out=call('Runtime.evaluate',{'expression':expr,'returnByValue':True})
              r=out.get('result',{}).get('value')
              if not r: raise RuntimeError('BROWSER_EVALUATION_RETURNED_NO_VALUE '+json.dumps(out))
              ok=r.get('travel') and r.get('panel') and r.get('primary') and r['docW']<=w and r['bodyW']<=w and r['labels'] and all(x['ok'] for x in r['geom']) and r['geom'][1]['height']>=34 and r['geom'][2]['height']>=34 and r['geom'][3]['height']>=40 and not r['dark'] and not r['blue'] and r['emerald']
              print(f'BROWSER {w}x{h}: {"PASS" if ok else "FAIL"}',json.dumps(r,sort_keys=True))
              if not ok: raise SystemExit(1)
          PY
