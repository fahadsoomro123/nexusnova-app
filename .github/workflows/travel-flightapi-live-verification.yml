name: Travel FlightAPI Live Verification
on:
  workflow_dispatch:
  push:
    branches: [travel-fare-lens-final]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Real FlightAPI request
        env:
          FLIGHTAPI_API_KEY: ${{ secrets.FLIGHTAPI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLIGHTAPI_API_KEY:-}" || { echo 'LIVE_VERIFICATION_BLOCKED missing FLIGHTAPI_API_KEY'; exit 0; }
          departure="$(date -u -d '+30 days' +%F)"
          curl -sS --fail --get "https://api.flightapi.io/onewaytrip/${FLIGHTAPI_API_KEY}/KHI/ISB/${departure}/1/0/0/Economy/USD" --data-urlencode 'region=PK' -o /tmp/flightapi.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flightapi.json','utf8'));const a=x.itineraries||x.data?.itineraries||[];if(!Array.isArray(a)||!a.length)throw new Error('EMPTY_FLIGHT_INVENTORY');console.log('REAL_API_OK provider=FlightAPI http=200 itineraries='+a.length);"
      - name: NexusNova normalization check
        env:
          FLIGHTAPI_API_KEY: ${{ secrets.FLIGHTAPI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLIGHTAPI_API_KEY:-}" || exit 0
          FLIGHTAPI_CAPTURE=/tmp/flightapi.json node -e "const fs=require('fs');const {normalizeItineraryRows}=require('./functions/flightapi-provider');const x=normalizeItineraryRows(JSON.parse(fs.readFileSync(process.env.FLIGHTAPI_CAPTURE,'utf8')));const p=x.filter(r=>r.price!=null&&r.currency).length;if(!x.length)throw new Error('NORMALIZED_EMPTY');if(!p)throw new Error('NORMALIZED_NO_PRICED_INVENTORY');console.log('NORMALIZED_OK provider=FlightAPI normalized='+x.length+' priced='+p);"
