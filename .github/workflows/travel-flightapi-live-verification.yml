name: Travel FlightAPI Live Verification
on:
  workflow_dispatch:
  push:
    branches: [travel-fare-lens-final]
permissions:
  contents: read
jobs:
  verify-flightapi-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Real FlightAPI KHI to ISB — single live request
        env:
          FLIGHTAPI_API_KEY: ${{ secrets.FLIGHTAPI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLIGHTAPI_API_KEY:-}" || { echo 'LIVE_VERIFICATION_BLOCKED missing FLIGHTAPI_API_KEY'; exit 1; }
          departure="$(date -u -d '+30 days' +%F)"
          echo "REQUEST=FlightAPI KHI->ISB departure=${departure}"
          curl -sS --fail --get "https://api.flightapi.io/onewaytrip/${FLIGHTAPI_API_KEY}/KHI/ISB/${departure}/1/0/0/Economy/USD" --data-urlencode 'region=PK' -o /tmp/flightapi.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/flightapi.json','utf8'));const a=x.itineraries||x.data?.itineraries||[];if(!Array.isArray(a)||!a.length)throw new Error('EMPTY_FLIGHT_INVENTORY');console.log('REAL_FLIGHTAPI_HTTP=200 raw_itineraries='+a.length);"
      - name: Raw to normalized to priced offers
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const {normalizeItineraryRows}=require('./functions/flightapi-provider');
          const input=JSON.parse(fs.readFileSync('/tmp/flightapi.json','utf8'));
          const raw=Array.isArray(input.itineraries)?input.itineraries:(Array.isArray(input.data?.itineraries)?input.data.itineraries:[]);
          const normalized=normalizeItineraryRows(input,'USD');
          const priced=normalized.filter(r=>r.price!=null&&r.currency);
          if(!raw.length) throw new Error('RAW_EMPTY');
          if(!normalized.length) throw new Error('NORMALIZED_EMPTY');
          if(!priced.length) throw new Error('PRICED_EMPTY');
          console.log(`REAL_NORMALIZATION_OK provider=FlightAPI raw_itineraries=${raw.length} normalized=${normalized.length} priced=${priced.length} currency=${priced[0].currency}`);
          console.log('FIRST_PRICED_OFFER='+JSON.stringify({price:priced[0].price,currency:priced[0].currency,originCode:priced[0].originCode,destinationCode:priced[0].destinationCode,flightNumber:priced[0].flightNumber,airline:priced[0].airline}));
          NODE
      - name: Production Travel path — truth gate
        shell: bash
        run: |
          set -u
          departure="$(date -u -d '+30 days' +%F)"
          payload="{\"origin\":\"KHI\",\"destination\":\"ISB\",\"departure\":\"${departure}\",\"tripType\":\"oneway\",\"adults\":1,\"children\":0,\"childrenAges\":[],\"cabin\":\"Economy\",\"currency\":\"USD\",\"region\":\"PK\"}"
          for url in \
            'https://nexusnova-6ade2.web.app/api/travel/flights/search' \
            'https://us-central1-nexusnova-6ade2.cloudfunctions.net/travelApi/flights/search'
          do
            code="$(curl -sS -o /tmp/production-travel.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data "$payload" || true)"
            echo "PRODUCTION_TRAVEL_HTTP=$code url=$url"
            if [ "$code" = 200 ]; then
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/production-travel.json','utf8'));const r=Array.isArray(x.results)?x.results:[];const p=r.filter(v=>v&&v.price!=null);if(!r.length||!p.length)process.exit(1);console.log('PRODUCTION_TRAVEL_OK results='+r.length+' priced='+p.length);"
              exit 0
            fi
          done
          echo 'PRODUCTION_TRAVEL_BLOCKED: deployed Travel API did not return HTTP 200 on Hosting or direct Firebase travelApi.'
          exit 2
