name: NexusNova Travel Host Regression QA V2

on:
  push:
    branches:
      - travel-reference-v7-final-staging
    paths:
      - '.github/workflows/travel-host-regression-qa-v2.yml'
      - 'fresh-rebuild/travel-flagship-v16-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-suite.js'
      - 'fresh-rebuild/src/features/apps/travel-integrations.js'
      - 'fresh-rebuild/src/features/apps/travel-ground.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate 1 - module graph and host source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check fresh-rebuild/src/features/apps/travel-suite.js
          node --check fresh-rebuild/src/features/apps/travel-integrations.js
          node --check fresh-rebuild/src/features/apps/travel-ground.js
          $src = Get-Content -Raw fresh-rebuild/src/features/apps/travel-integrations.js
          foreach ($needle in @('nn-travel-host-lock','nn-travel-keyboard-open','nn-travel-route-focus','--nn-travel-vv-height','installLockedTravelHost(root)')) {
            if (-not $src.Contains($needle)) { throw "Missing host fix marker: $needle" }
          }
          Write-Host 'Travel host source contract PASS'

      - name: Install browser and local server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm init -y | Out-Null
          npm install --no-save playwright@1.55.0 http-server@14.1.1 | Out-Null
          npx playwright install chromium
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','npx http-server fresh-rebuild -p 4175 -c-1' -PassThru -WindowStyle Hidden
          $server.Id | Set-Content '.travel-host-v2-http.pid'
          Start-Sleep -Seconds 2

      - name: Gate 2 - fullscreen scroll gap and keyboard location editing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const { chromium } = require('playwright');
          const profiles=[
            {w:360,h:800,name:'small'},
            {w:390,h:844,name:'reference'},
            {w:412,h:915,name:'tall'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              const page=await browser.newPage({viewport:{width:p.w,height:p.h},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4175/travel-flagship-v16-harness.html?bottom=24&dock=62',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.nn-travel-v19',{state:'attached',timeout:15000});
              await page.waitForTimeout(600);

              const base=await page.evaluate(()=>{
                const root=document.querySelector('.nn-travel-v19');
                const screen=document.querySelector('.nx-screen');
                const stage=document.querySelector('.nx-stage');
                const dock=document.querySelector('.nx-dock.global');
                const card=document.querySelector('.nn-search-card');
                const rr=root.getBoundingClientRect();
                const sr=screen.getBoundingClientRect();
                const dr=dock.getBoundingClientRect();
                const cr=card.getBoundingClientRect();
                const sc=getComputedStyle(stage);
                return {
                  root:{x:rr.x,y:rr.y,w:rr.width,h:rr.height,bottom:rr.bottom},
                  screen:{w:sr.width,h:sr.height},
                  cardBottom:cr.bottom,dockTop:dr.top,dockBottom:dr.bottom,
                  stagePosition:sc.position,stageOverflow:sc.overflow,stagePaddingBottom:sc.paddingBottom,
                  stageScroll:stage.scrollHeight>stage.clientHeight+2,
                  bodyScroll:document.body.scrollHeight>innerHeight+2,
                  docScroll:document.documentElement.scrollHeight>innerHeight+2,
                  hostLock:document.documentElement.classList.contains('nn-travel-host-lock')
                };
              });
              if(!base.hostLock) throw new Error(`${p.name}: host lock missing`);
              if(base.stagePosition!=='fixed'||base.stageOverflow!=='hidden'||base.stagePaddingBottom!=='0px') throw new Error(`${p.name}: host shell not fullscreen ${JSON.stringify(base)}`);
              if(base.stageScroll||base.bodyScroll||base.docScroll) throw new Error(`${p.name}: whole-screen scrolling remains ${JSON.stringify(base)}`);
              if(Math.abs(base.root.w-p.w)>2||Math.abs(base.root.h-p.h)>2||Math.abs(base.screen.w-p.w)>2||Math.abs(base.screen.h-p.h)>2) throw new Error(`${p.name}: Travel does not fill viewport ${JSON.stringify(base)}`);
              if(Math.abs(p.h-base.dockBottom)>7) throw new Error(`${p.name}: bottom dock dead gap ${p.h-base.dockBottom}px`);
              if(base.cardBottom < base.dockTop-40) throw new Error(`${p.name}: large dead content gap remains ${base.dockTop-base.cardBottom}px`);

              const origin=page.locator('[data-flight-origin]');
              await origin.focus();
              await origin.fill('KARACHI');
              const keyboardH=Math.max(420,Math.round(p.h*0.58));
              await page.setViewportSize({width:p.w,height:keyboardH});
              await page.waitForTimeout(500);
              const focused=await page.evaluate(()=>{
                const root=document.querySelector('.nn-travel-v19');
                const input=document.querySelector('[data-flight-origin]');
                const ir=input.getBoundingClientRect();
                const rr=root.getBoundingClientRect();
                const dock=document.querySelector('.nx-dock.global');
                return {
                  value:input.value,inputTop:ir.top,inputBottom:ir.bottom,rootH:rr.height,
                  keyboard:root.dataset.keyboardOpen,routeFocus:root.classList.contains('nn-travel-route-focus'),
                  dockDisplay:getComputedStyle(dock).display,
                  bodyScroll:document.body.scrollHeight>innerHeight+2,
                  docScroll:document.documentElement.scrollHeight>innerHeight+2
                };
              });
              if(focused.value!=='KARACHI') throw new Error(`${p.name}: location edit failed ${focused.value}`);
              if(focused.keyboard!=='true'||!focused.routeFocus) throw new Error(`${p.name}: keyboard route guard missing ${JSON.stringify(focused)}`);
              if(focused.inputTop<0||focused.inputBottom>keyboardH) throw new Error(`${p.name}: location field disappeared ${JSON.stringify(focused)}`);
              if(Math.abs(focused.rootH-keyboardH)>3) throw new Error(`${p.name}: visible viewport resize failed ${JSON.stringify(focused)}`);
              if(focused.dockDisplay!=='none') throw new Error(`${p.name}: dock overlaps keyboard`);
              if(focused.bodyScroll||focused.docScroll) throw new Error(`${p.name}: keyboard caused page scroll`);
              await page.screenshot({path:`travel-host-v2-${p.name}-keyboard.png`,fullPage:false});

              await page.setViewportSize({width:p.w,height:p.h});
              await origin.blur();
              await page.waitForTimeout(350);
              const restored=await page.evaluate(()=>({
                h:document.querySelector('.nn-travel-v19').getBoundingClientRect().height,
                keyboard:document.querySelector('.nn-travel-v19').dataset.keyboardOpen,
                docScroll:document.documentElement.scrollHeight>innerHeight+2
              }));
              if(Math.abs(restored.h-p.h)>3||restored.keyboard==='true'||restored.docScroll) throw new Error(`${p.name}: fullscreen restore failed ${JSON.stringify(restored)}`);
              if(errors.length) throw new Error(`${p.name}: page errors ${errors.join(' | ')}`);
              await page.screenshot({path:`travel-host-v2-${p.name}-restored.png`,fullPage:false});
              await page.close();
              console.log(`HOST V2 PASS ${p.name}`);
            }
            await browser.close();
            console.log('TRAVEL HOST V2 FULLSCREEN + KEYBOARD + NO-GAP PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | node

      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-host-v2-evidence
          path: travel-host-v2-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop server
        if: always()
        shell: powershell
        run: |
          if (Test-Path '.travel-host-v2-http.pid') {
            $pidValue = Get-Content '.travel-host-v2-http.pid' | Select-Object -First 1
            if ($pidValue) { Stop-Process -Id ([int]$pidValue) -Force -ErrorAction SilentlyContinue }
          }
