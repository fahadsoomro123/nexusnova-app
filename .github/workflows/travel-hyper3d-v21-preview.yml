name: NexusNova Travel Hyper3D Flagship Preview

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-layout-v21.js'
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-polish-v22.js'
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-hd-v23.js'
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js'
      - '.github/workflows/travel-hyper3d-v21-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify flagship source
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js
          grep -q "hyper3dFlagshipV25" fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js

      - name: Overlay staged OTA 19 Travel runtime
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/files'
          files=(
            'index.html'
            'assets/travel/reference-from-exact.webp.b64'
            'assets/travel/reference-hero-right.webp.b64'
            'assets/travel/reference-to-exact.webp.b64'
            'src/features/apps/travel-suite.js'
            'src/features/apps/travel-integrations.js'
            'src/features/apps/travel-edge-client.js'
            'src/features/apps/travel-edge-config.js'
            'src/features/apps/travel-ground.js'
            'src/features/apps/travel-flagship-runtime-v8.js'
            'src/features/apps/travel-inline-layout-v11.js'
            'src/features/apps/travel-phone-layout-v12.js'
            'src/features/apps/travel-phone-layout-v13.js'
            'src/features/apps/travel-phone-layout-v17.js'
            'src/features/apps/travel-exit-isolation-v10.js'
            'src/features/apps/travel-ota-revision-v13.js'
          )
          for f in "${files[@]}"; do
            mkdir -p "fresh-rebuild/$(dirname "$f")"
            curl -fsSL "$BASE/$f" -o "fresh-rebuild/$f"
          done
          grep -q "const REVISION = '19'" fresh-rebuild/src/features/apps/travel-ota-revision-v13.js

      - name: Build production-shell flagship preview
        run: |
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('fresh-rebuild/index.html','utf8');
          html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');
          const boot=`
          <script type="module">
            import { icon } from './src/components/icons.js';
            import { appScreen } from './src/features/apps/app-screen.js?ota=nv16';
            const dock=document.querySelector('.nx-dock');
            const labels={mine:['MINE','mine'],hub:['NOVA HUB','hub']};
            document.querySelectorAll('.nx-dock__item').forEach(button=>{const route=button.dataset.route||'mine';const [label,iconName]=labels[route];button.innerHTML=\`${'${'}icon(iconName)}<span>${'${'}label}</span>\`;if(route==='hub')button.setAttribute('aria-current','page')});
            if(dock)dock.hidden=false;
            document.body.classList.remove('nx-auth-mode','nx-splash-mode');
            await import('./src/features/apps/travel-flagship-runtime-v8.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-inline-layout-v11.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v12.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v13.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v17.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-exit-isolation-v10.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-ota-revision-v13.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-hyper3d-layout-v21.js?preview=v21');
            await import('./src/features/apps/travel-hyper3d-hd-v23.js?preview=v23');
            await import('./src/features/apps/travel-hyper3d-flagship-v25.js?preview=v25');
            const root=await appScreen({id:'travel',backToHub(){},backToMine(){}});
            document.getElementById('nx-stage').replaceChildren(root);
            await new Promise(r=>setTimeout(r,300));
            window.__travelHyper3dPreviewReady=true;
          </script>`;
          html=html.replace('</body>',`${boot}\n</body>`);
          fs.writeFileSync('fresh-rebuild/travel-v25-preview.html',html);
          NODE

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          nohup npx http-server fresh-rebuild -p 4173 -c-1 >/tmp/travel-v25-preview-http.log 2>&1 &
          sleep 2

      - name: Render and gate flagship tactile mobile UI
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:337,height:694},deviceScaleFactor:2});
            const payloads=[];
            await page.route('**/health',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({architecture:'cloudflare-only',coverage:{globalFlights:true,globalHotels:true}})}));
            await page.route('**/rpc/**',async route=>{
              const req=route.request();
              let body={};try{body=req.postDataJSON()||{}}catch{}
              payloads.push({url:req.url(),body});
              if(req.url().includes('searchWorldwideFlights')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,offers:[{live:true,provider:'QA Live',originCode:'LHR',destinationCode:'CDG',departingAt:'2026-09-15T09:00:00Z',arrivingAt:'2026-09-15T10:15:00Z',durationMinutes:75,stops:0,total:42000,currency:'PKR',compareTotal:42000,compareCurrency:'PKR',carriers:['QA Air']}]})});
              if(req.url().includes('searchPakistanAgencyFlights')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,offers:[]})});
              if(req.url().includes('searchWorldwideHotels')) return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,offers:[]})});
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,offers:[]})});
            });

            await page.goto('http://127.0.0.1:4173/travel-v25-preview.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__travelHyper3dPreviewReady===true,null,{timeout:20000});
            await page.waitForSelector('.nn-travel-v19[data-ota-revision="19"]',{timeout:15000});
            await page.waitForFunction(()=>document.querySelector('.nn-travel-v19')?.dataset.hdHeroSource==='true',null,{timeout:20000});
            await page.waitForFunction(()=>document.querySelector('.nn-travel-v19')?.dataset.hyper3dFlagshipV25==='true',null,{timeout:15000});
            await page.waitForTimeout(800);

            const state=await page.evaluate(()=>{
              const root=document.querySelector('.nn-travel-v19');
              const search=root?.querySelector('.nn-search-button');
              const control=root?.querySelector('.nn-control');
              const filter=root?.querySelector('.nn-filter');
              const route=root?.querySelector('.nn-route');
              const trust=root?.querySelector('.nn-trust');
              const swap=root?.querySelector('.nn-swap');
              const hero=root?.querySelector('.nn-hero-art');
              const trigger=root?.querySelector('.nn-passenger-trigger');
              const dock=document.querySelector('#nx-app>.nx-dock');
              const h=el=>el?Math.round(el.getBoundingClientRect().height):0;
              const vis=el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1&&r.bottom>0&&r.top<innerHeight};
              const ss=search?getComputedStyle(search):null;
              return {v25:root?.dataset.hyper3dFlagshipV25||'',hd:root?.dataset.hdHeroSource||'',heroW:hero?.naturalWidth||0,heroH:hero?.naturalHeight||0,swapVisible:vis(swap),searchH:h(search),controlH:h(control),filterH:h(filter),routeH:h(route),trustVisible:vis(trust),dockVisible:vis(dock),passengerTrigger:vis(trigger),searchShadow:ss?.boxShadow||'',searchTransform:ss?.transform||'',searchBg:ss?.backgroundImage||''};
            });
            console.log('TRAVEL_V25_FLAGSHIP',JSON.stringify(state));
            if(state.v25!=='true')throw new Error('V25 flagship layer missing');
            if(state.hd!=='true'||state.heroW<1800||state.heroH<1000)throw new Error(`HD hero invalid ${state.heroW}x${state.heroH}`);
            if(state.swapVisible)throw new Error('Floating swap returned');
            if(state.searchH<48||state.searchH>60||state.controlH<50||state.controlH>64||state.filterH<38||state.filterH>50||state.routeH<74||state.routeH>88)throw new Error(`Geometry regression ${JSON.stringify(state)}`);
            if(!state.trustVisible||!state.dockVisible||!state.passengerTrigger)throw new Error('Required flagship elements hidden');
            if(state.searchShadow.length<120||!state.searchBg.includes('radial-gradient')||state.searchTransform==='none')throw new Error('Tactile material stack missing');
            await page.screenshot({path:'travel-v25-flagship-preview.png',fullPage:false});

            const search=page.locator('.nn-search-button');
            await search.dispatchEvent('pointerdown');
            if(!(await search.evaluate(el=>el.classList.contains('nn-tactile-pressed'))))throw new Error('Tactile press state did not engage');
            await search.dispatchEvent('pointerup');
            if(await search.evaluate(el=>el.classList.contains('nn-tactile-pressed')))throw new Error('Tactile press state stuck');

            const trigger=page.locator('.nn-passenger-trigger');
            await trigger.click();
            const pop=page.locator('.nn-passenger-popover');
            await page.waitForFunction(()=>document.querySelector('.nn-passenger-popover')?.dataset.open==='true');
            const plus=kind=>page.locator(`.nn-passenger-row[data-kind="${kind}"] [data-delta="1"]`);
            for(let i=0;i<3;i++)await plus('adults').click();
            for(let i=0;i<2;i++)await plus('children').click();
            await plus('infants').click();
            const pax=await page.evaluate(()=>{const r=document.querySelector('.nn-travel-v19');return {a:r?.dataset.nn25Adults,c:r?.dataset.nn25Children,i:r?.dataset.nn25Infants,text:r?.querySelector('.nn-passenger-trigger span')?.textContent||'',opts:r?.querySelectorAll('select[data-flight-adults] option').length||0}});
            console.log('TRAVEL_V25_PASSENGERS',JSON.stringify(pax));
            if(pax.a!=='4'||pax.c!=='2'||pax.i!=='1'||pax.opts!==9||!pax.text.includes('4 Adults')||!pax.text.includes('2 Children')||!pax.text.includes('1 Infant'))throw new Error(`Passenger picker failed ${JSON.stringify(pax)}`);
            await page.screenshot({path:'travel-v25-passengers-preview.png',fullPage:false});
            await page.keyboard.press('Escape');

            await page.locator('[data-flight-origin]').fill('LHR');
            await page.locator('[data-flight-destination]').fill('CDG');
            await page.locator('[data-flight-departure]').fill('2026-09-15');
            const card=page.locator('.nn-search-card');await card.evaluate(el=>el.scrollTop=el.scrollHeight);await page.waitForTimeout(80);await search.click();
            await page.waitForTimeout(500);
            const flightBodies=payloads.filter(x=>/searchWorldwideFlights|searchPakistanAgencyFlights/.test(x.url)).map(x=>x.body);
            if(!flightBodies.length||flightBodies.some(x=>Number(x.adults)!==4||Number(x.children)!==2||Number(x.infants)!==1))throw new Error(`Passenger payload bridge failed ${JSON.stringify(flightBodies)}`);
            console.log('TRAVEL_V25_PAYLOAD_PASS',JSON.stringify(flightBodies));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-v25-flagship-preview
          path: |
            travel-v25-flagship-preview.png
            travel-v25-passengers-preview.png
          if-no-files-found: error
