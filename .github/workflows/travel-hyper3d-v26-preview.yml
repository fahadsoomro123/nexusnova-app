name: NexusNova Travel Flagship V27 Preview

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-layout-v21.js'
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-hd-v23.js'
      - 'fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js'
      - 'fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js'
      - 'fresh-rebuild/src/features/apps/travel-clean-ui-v27.js'
      - '.github/workflows/travel-hyper3d-v26-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify additive flagship sources
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js
          node --check fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js
          node --check fresh-rebuild/src/features/apps/travel-clean-ui-v27.js
          grep -q 'hyper3dFlagshipV25' fresh-rebuild/src/features/apps/travel-hyper3d-flagship-v25.js
          grep -q 'passengerPopoverV26' fresh-rebuild/src/features/apps/travel-passenger-popover-v26.js
          grep -q 'cleanUiV27' fresh-rebuild/src/features/apps/travel-clean-ui-v27.js

      - name: Overlay staged recovery Travel runtime
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/files'
          files=(
            'index.html'
            'assets/travel/reference-from-exact.webp.b64'
            'assets/travel/reference-hero-right.webp.b64'
            'assets/travel/reference-to-exact.webp.b64'
            'src/features/apps/travel-suite.js'
            'src/features/apps/travel-integrations.js'
            'src/features/apps/travel-edge-client.js'
            'src/features/apps/travel-edge-config.js'
            'src/features/apps/travel-ground.js'
            'src/features/apps/travel-flagship-runtime-v8.js'
            'src/features/apps/travel-inline-layout-v11.js'
            'src/features/apps/travel-phone-layout-v12.js'
            'src/features/apps/travel-phone-layout-v13.js'
            'src/features/apps/travel-phone-layout-v17.js'
            'src/features/apps/travel-exit-isolation-v10.js'
            'src/features/apps/travel-ota-revision-v13.js'
          )
          for f in "${files[@]}"; do
            mkdir -p "fresh-rebuild/$(dirname "$f")"
            curl -fsSL "$BASE/$f" -o "fresh-rebuild/$f"
          done
          grep -q "const REVISION = '19'" fresh-rebuild/src/features/apps/travel-ota-revision-v13.js

      - name: Build real production-shell preview
        run: |
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('fresh-rebuild/index.html','utf8');
          html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');
          const boot=`
          <script type="module">
            import { icon } from './src/components/icons.js';
            import { appScreen } from './src/features/apps/app-screen.js?ota=nv16';
            const dock=document.querySelector('.nx-dock');
            const labels={mine:['MINE','mine'],hub:['NOVA HUB','hub']};
            document.querySelectorAll('.nx-dock__item').forEach(button=>{const route=button.dataset.route||'mine';const [label,iconName]=labels[route];button.innerHTML=\`${'${'}icon(iconName)}<span>${'${'}label}</span>\`;if(route==='hub')button.setAttribute('aria-current','page')});
            if(dock)dock.hidden=false;
            document.body.classList.remove('nx-auth-mode','nx-splash-mode');
            await import('./src/features/apps/travel-flagship-runtime-v8.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-inline-layout-v11.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v12.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v13.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-phone-layout-v17.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-exit-isolation-v10.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-ota-revision-v13.js?ota=travel-v19-recovery');
            await import('./src/features/apps/travel-hyper3d-layout-v21.js?preview=v21');
            await import('./src/features/apps/travel-hyper3d-hd-v23.js?preview=v23');
            await import('./src/features/apps/travel-hyper3d-flagship-v25.js?preview=v25');
            await import('./src/features/apps/travel-passenger-popover-v26.js?preview=v26');
            await import('./src/features/apps/travel-clean-ui-v27.js?preview=v27');
            const root=await appScreen({id:'travel',backToHub(){},backToMine(){}});
            document.getElementById('nx-stage').replaceChildren(root);
            await new Promise(r=>setTimeout(r,400));
            window.__travelV27Ready=true;
          </script>`;
          html=html.replace('</body>',`${boot}\n</body>`);
          fs.writeFileSync('fresh-rebuild/travel-v27-preview.html',html);
          NODE

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          nohup npx http-server fresh-rebuild -p 4173 -c-1 >/tmp/travel-v27-http.log 2>&1 &
          sleep 2

      - name: Gate flagship render tactile press passengers payload and clean chrome
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:337,height:694},deviceScaleFactor:2});
            const payloads=[];
            await page.route('**/health',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({architecture:'cloudflare-only',coverage:{globalFlights:true,globalHotels:true}})}));
            await page.route('**/rpc/**',async r=>{
              const req=r.request();let body={};try{body=req.postDataJSON()||{}}catch{}payloads.push({url:req.url(),body});
              if(req.url().includes('searchWorldwideFlights'))return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,offers:[{live:true,provider:'QA Live',originCode:'LHR',destinationCode:'CDG',departingAt:'2026-09-15T09:00:00Z',arrivingAt:'2026-09-15T10:15:00Z',durationMinutes:75,stops:0,total:42000,currency:'PKR',compareTotal:42000,compareCurrency:'PKR',carriers:['QA Air']}]})});
              return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:false,offers:[]})});
            });
            await page.goto('http://127.0.0.1:4173/travel-v27-preview.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__travelV27Ready===true,null,{timeout:20000});
            await page.waitForSelector('.nn-travel-v19[data-ota-revision="19"]',{timeout:15000});
            await page.waitForFunction(()=>{const r=document.querySelector('.nn-travel-v19');return r?.dataset.hdHeroSource==='true'&&r?.dataset.hyper3dFlagshipV25==='true'&&r?.dataset.passengerPopoverV26==='true'&&r?.dataset.cleanUiV27==='true'},null,{timeout:20000});
            await page.waitForTimeout(800);
            const state=await page.evaluate(()=>{
              const root=document.querySelector('.nn-travel-v19'),hero=root?.querySelector('.nn-hero-art'),swap=root?.querySelector('.nn-swap'),search=root?.querySelector('.nn-search-button'),control=root?.querySelector('.nn-control'),filter=root?.querySelector('.nn-filter'),route=root?.querySelector('.nn-route'),trust=root?.querySelector('.nn-trust'),dock=document.querySelector('#nx-app>.nx-dock');
              const h=e=>e?Math.round(e.getBoundingClientRect().height):0,vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1&&r.bottom>0&&r.top<innerHeight};
              const ss=getComputedStyle(search);
              return {heroW:hero?.naturalWidth||0,heroH:hero?.naturalHeight||0,swap:vis(swap),searchH:h(search),controlH:h(control),filterH:h(filter),routeH:h(route),trust:vis(trust),dock:vis(dock),shadow:ss.boxShadow,bg:ss.backgroundImage,transform:ss.transform,badgeCount:root?.querySelectorAll('.nn-ota-badge').length||0,revision:root?.dataset.otaRevision||'',clean:root?.dataset.cleanUiV27||''};
            });
            console.log('V27_RENDER',JSON.stringify(state));
            assert(state.heroW>=1800&&state.heroH>=1000,'HD Earth failed');assert(!state.swap,'Swap visible');assert(state.searchH>=48&&state.searchH<=60,'Search size');assert(state.controlH>=50&&state.controlH<=64,'Control size');assert(state.filterH>=38&&state.filterH<=50,'Filter size');assert(state.routeH>=74&&state.routeH<=88,'Route size');assert(state.trust&&state.dock,'Trust/dock hidden');assert(state.shadow.length>120&&state.bg.includes('radial-gradient')&&state.transform!=='none','Tactile stack missing');assert(state.badgeCount===0,'Visible OTA numbering returned');assert(state.revision==='19'&&state.clean==='true','Internal revision metadata lost');
            await page.screenshot({path:'travel-v27-flagship-preview.png',fullPage:false});

            const search=page.locator('.nn-search-button');await search.dispatchEvent('pointerdown');assert(await search.evaluate(e=>e.classList.contains('nn-tactile-pressed')),'Press state missing');await search.dispatchEvent('pointerup');assert(!(await search.evaluate(e=>e.classList.contains('nn-tactile-pressed'))),'Press state stuck');

            const trigger=page.locator('.nn-passenger-trigger');await trigger.click();await page.waitForFunction(()=>document.querySelector('.nn-passenger-popover')?.dataset.open==='true');
            const stack=await page.evaluate(()=>{const pop=document.querySelector('.nn-passenger-popover');return {pairZ:getComputedStyle(pop.closest('.nn-passenger-pair')).zIndex,popZ:getComputedStyle(pop).zIndex}});
            console.log('V27_STACK',JSON.stringify(stack));assert(stack.pairZ==='720'&&stack.popZ==='1000','Passenger stack CSS missing');
            const plus=kind=>page.locator(`.nn-passenger-row[data-kind="${kind}"] [data-delta="1"]`);
            for(let i=0;i<3;i++)await plus('adults').click({timeout:5000});for(let i=0;i<2;i++)await plus('children').click({timeout:5000});await plus('infants').click({timeout:5000});
            const pax=await page.evaluate(()=>{const r=document.querySelector('.nn-travel-v19');return {a:r.dataset.nn25Adults,c:r.dataset.nn25Children,i:r.dataset.nn25Infants,text:r.querySelector('.nn-passenger-trigger span')?.textContent||'',opts:r.querySelectorAll('select[data-flight-adults] option').length,badge:r.querySelectorAll('.nn-ota-badge').length}});
            console.log('V27_PAX',JSON.stringify(pax));assert(pax.a==='4'&&pax.c==='2'&&pax.i==='1'&&pax.opts===9&&pax.text.includes('4 Adults')&&pax.text.includes('2 Children')&&pax.text.includes('1 Infant')&&pax.badge===0,'Passenger picker or clean UI failed');
            await page.screenshot({path:'travel-v27-passengers-preview.png',fullPage:false});await page.keyboard.press('Escape');

            await page.locator('[data-flight-origin]').fill('LHR');await page.locator('[data-flight-destination]').fill('CDG');await page.locator('[data-flight-departure]').fill('2026-09-15');const card=page.locator('.nn-search-card');await card.evaluate(e=>e.scrollTop=e.scrollHeight);await page.waitForTimeout(80);await search.click();await page.waitForTimeout(500);
            const bodies=payloads.filter(x=>/searchWorldwideFlights|searchPakistanAgencyFlights/.test(x.url)).map(x=>x.body);console.log('V27_PAYLOAD',JSON.stringify(bodies));assert(bodies.length>0&&bodies.every(x=>Number(x.adults)===4&&Number(x.children)===2&&Number(x.infants)===1),'Passenger payload bridge failed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-v27-flagship-preview
          path: |
            travel-v27-flagship-preview.png
            travel-v27-passengers-preview.png
          if-no-files-found: error
