name: Travel Production Diagnose
on:
  push:
    branches: [travel-fare-lens-final]
    paths:
      - '.github/workflows/travel-production-diagnose.yml'
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/travel-production-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_NEXUSNOVA_6ADE2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUSNOVA_6ADE2 }}
    steps:
      - name: Safely identify Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT_NEXUSNOVA_6ADE2:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_NEXUSNOVA_6ADE2" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          node - <<'NODE'
            const fs=require('fs');
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/firebase-service-account.json','utf8'));
            if(!x.client_email || !x.project_id) throw new Error('Missing client_email or project_id');
            console.log('FIREBASE_SECRET_CLIENT_EMAIL='+x.client_email);
            console.log('FIREBASE_SECRET_PROJECT_ID='+x.project_id);
          NODE
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
