name: Travel Fare Lens Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Attach Travel renderer to app router
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fresh-rebuild/src/features/apps/app-screen.js')
          s=p.read_text(encoding='utf-8')
          line="  ['./travel-flagship.js', 'travelFlagshipRenderers'],\n"
          marker="const rendererSources = [\n"
          if line not in s:
              if marker not in s: raise SystemExit('rendererSources marker missing')
              s=s.replace(marker, marker+line, 1)
              p.write_text(s, encoding='utf-8')
          assert line in p.read_text(encoding='utf-8')
          PY
          if ! git diff --quiet -- fresh-rebuild/src/features/apps/app-screen.js; then
            git config user.name 'NexusNova Travel Validation'
            git config user.email 'actions@users.noreply.github.com'
            git add fresh-rebuild/src/features/apps/app-screen.js
            git commit -m 'feat(travel): attach Fare Lens renderer to app router'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-flagship.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
      - name: Fare Lens safety assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "Always opens inside Nova Browser" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "KHI" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "ISB" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "www.nexusnovatools.com" fresh-rebuild/src/features/apps/travel-flagship.js || grep -Fq "nexusnovatools.com" fresh-rebuild/src/features/apps/travel-flagship.js
