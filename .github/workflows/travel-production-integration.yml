name: Travel Fare Lens Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-travel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Travel renderer is attached
        shell: bash
        run: |
          set -euo pipefail
          test -f fresh-rebuild/src/features/apps/travel-flagship.js
          grep -F "['./travel-flagship.js', 'travelFlagshipRenderers']" fresh-rebuild/src/features/apps/app-screen.js
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-flagship.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
      - name: Travel safety assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "Always opens inside Nova Browser" fresh-rebuild/src/features/apps/travel-flagship.js
          ! grep -Eiq "(fake|demo|sample) (fare|flight|hotel|booking)" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "www.nexusnovatools.com" fresh-rebuild/src/features/apps/travel-flagship.js || grep -Fq "nexusnovatools.com" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "KHI" fresh-rebuild/src/features/apps/travel-flagship.js
          grep -Fq "ISB" fresh-rebuild/src/features/apps/travel-flagship.js
