name: NexusNova Travel Reference V19 QA

on:
  push:
    branches:
      - travel-reference-v7-final-staging
    paths:
      - '.github/workflows/travel-reference-visual-qa.yml'
      - 'fresh-rebuild/travel-flagship-v16-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-suite.js'
      - 'fresh-rebuild/src/features/apps/travel-edge-client.js'
      - 'fresh-rebuild/src/features/apps/travel-edge-config.js'
      - 'fresh-rebuild/assets/travel/reference-hero-right.webp.b64'
      - 'fresh-rebuild/assets/travel/reference-from-exact.webp.b64'
      - 'fresh-rebuild/assets/travel/reference-to-exact.webp.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-reference-v19-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_URL: https://nexusnova-travel-api.fahadsoomro123.workers.dev

jobs:
  reference-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate 1 - fresh source contract and syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check fresh-rebuild/src/features/apps/travel-suite.js
          node --check fresh-rebuild/src/features/apps/travel-edge-client.js
          node --check fresh-rebuild/src/features/apps/travel-edge-config.js
          @'
          const fs=require('fs');
          const travel=fs.readFileSync('fresh-rebuild/src/features/apps/travel-suite.js','utf8');
          const edge=fs.readFileSync('fresh-rebuild/src/features/apps/travel-edge-client.js','utf8');
          for(const needle of [
            'fresh-reference-v19-pixel-map',
            'measured-reference-hybrid',
            "OTA_RELEASE_ID = 'travel-reference-ota-1'",
            'reference-from-exact.webp.b64',
            'reference-to-exact.webp.b64',
            'searchWorldwideFlights',
            'searchWorldwideHotels',
            'searchWorldwideGroundTransport',
            'searchPakistanGroundTransport'
          ]) if(!travel.includes(needle)) throw new Error(`Missing source contract: ${needle}`);
          if(!edge.includes("from './travel-edge-config.js'")) throw new Error('Travel edge config import contract missing');
          for(const file of [
            'fresh-rebuild/src/features/apps/travel-edge-config.js',
            'fresh-rebuild/assets/travel/reference-from-exact.webp.b64',
            'fresh-rebuild/assets/travel/reference-to-exact.webp.b64',
            'fresh-rebuild/assets/travel/reference-hero-right.webp.b64'
          ]) if(!fs.existsSync(file)||fs.statSync(file).size<1) throw new Error(`Missing asset/dependency: ${file}`);
          console.log('Fresh measured-reference V19 source + OTA dependency graph PASS');
          '@ | node

      - name: Gate 2 - live Cloudflare provider smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const base=process.env.WORKER_URL;
          async function json(url,options={}){
            const r=await fetch(url,{...options,signal:AbortSignal.timeout(80000)});
            if(!r.ok) throw new Error(`${url} HTTP ${r.status}`);
            return r.json();
          }
          (async()=>{
            const health=await json(`${base}/health`);
            if(health.architecture!=='cloudflare-only') throw new Error('Cloudflare-only architecture missing');
            if(health.coverage?.globalFlights!==true||health.coverage?.globalHotels!==true) throw new Error('Live provider coverage missing');
            console.log('Health PASS:',health.coverage);
            const headers={'Content-Type':'application/json','Accept':'application/json','X-NexusNova-Client':'fresh-rebuild'};
            const flight=await json(`${base}/rpc/searchWorldwideFlights`,{method:'POST',headers,body:JSON.stringify({origin:'KHI',destination:'DXB',departureDate:'2026-09-12',returnDate:'',adults:1,cabin:'economy',currency:'PKR'})});
            const flights=flight.offers||[];
            if(flight.ok!==true||!flights.length||!flights.every(x=>x.live===true)) throw new Error('Real flight smoke failed');
            console.log('Real flight PASS:',flights.length);
            const hotel=await json(`${base}/rpc/searchWorldwideHotels`,{method:'POST',headers,body:JSON.stringify({destination:'Karachi, Pakistan',checkIn:'2026-09-15',checkOut:'2026-09-17',adults:1,rooms:1,currency:'PKR'})});
            const hotels=hotel.offers||[];
            if(hotel.ok!==true||!hotels.length||!hotels.every(x=>x.live===true)) throw new Error('Real hotel smoke failed');
            console.log('Real hotel PASS:',hotels.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | node

      - name: Install browser and local server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm init -y | Out-Null
          npm install --no-save playwright@1.55.0 http-server@14.1.1 | Out-Null
          npx playwright install chromium
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','npx http-server fresh-rebuild -p 4173 -c-1' -PassThru -WindowStyle Hidden
          $server.Id | Set-Content '.travel-v19-http.pid'
          Start-Sleep -Seconds 2

      - name: Gate 3 - adaptive layout, interactions and OTA badge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const { chromium } = require('playwright');
          const worker='https://nexusnova-travel-api.fahadsoomro123.workers.dev';
          const json=(route,obj)=>route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*','access-control-allow-headers':'Content-Type, Accept, X-NexusNova-Client'},body:JSON.stringify(obj)});
          const profiles=[
            {w:360,h:800,top:24,bottom:48,dock:58,name:'small-3button'},
            {w:390,h:844,top:34,bottom:24,dock:62,name:'reference-gesture'},
            {w:412,h:915,top:42,bottom:32,dock:62,name:'punchhole'},
            {w:550,h:1215,top:28,bottom:48,dock:66,name:'large-phone'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              const page=await browser.newPage({viewport:{width:p.w,height:p.h},deviceScaleFactor:1});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.route(`${worker}/**`,async route=>{
                const url=route.request().url();
                if(route.request().method()==='OPTIONS') return route.fulfill({status:204,headers:{'access-control-allow-origin':'*','access-control-allow-headers':'Content-Type, Accept, X-NexusNova-Client','access-control-allow-methods':'GET,POST,OPTIONS'}});
                if(url.endsWith('/health')) return json(route,{architecture:'cloudflare-only',providers:{scrappa:true,scrappaFlights:true,scrappaHotels:true,distribusion:false,pakistanBusPartner:false},coverage:{globalFlights:true,globalHotels:true,globalRailBus:false,pakistanBusFares:false}});
                if(url.includes('/rpc/searchWorldwideFlights')) return json(route,{ok:true,offers:[
                  {live:true,provider:'QA Live',originCode:'KHI',destinationCode:'DXB',departingAt:'2026-09-12T10:00:00Z',arrivingAt:'2026-09-12T12:05:00Z',durationMinutes:125,stops:0,total:60400,currency:'PKR',compareTotal:60400,compareCurrency:'PKR',carriers:['QA Air']},
                  {live:true,provider:'QA Live',originCode:'KHI',destinationCode:'DXB',departingAt:'2026-09-12T11:00:00Z',arrivingAt:'2026-09-12T15:15:00Z',durationMinutes:255,stops:1,total:56000,currency:'PKR',compareTotal:56000,compareCurrency:'PKR',carriers:['QA Connect']}
                ]});
                if(url.includes('/rpc/searchPakistanAgencyFlights')) return json(route,{ok:false,offers:[]});
                if(url.includes('/rpc/searchWorldwideHotels')) return json(route,{ok:true,offers:[{live:true,name:'QA Hotel',cityCode:'KHI',countryCode:'PK',stayTotal:12000,pricePerNight:6000,currency:'PKR',compareTotal:12000,comparePerNight:6000,compareCurrency:'PKR',nights:2}]});
                if(url.includes('/rpc/searchWorldwideGroundTransport')) return json(route,{ok:false,reason:'provider-not-configured',message:'Worldwide rail/bus provider key pending.',offers:[]});
                if(url.includes('/rpc/searchPakistanGroundTransport')) return json(route,{ok:false,reason:'pakistan-bus-partner-contract-required',message:'Pakistan bus partner approval pending.',offers:[]});
                return json(route,{ok:false,message:'QA route not mocked'});
              });
              const url=`http://127.0.0.1:4173/travel-flagship-v16-harness.html?top=${p.top}&bottom=${p.bottom}&dock=${p.dock}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.nn-travel-v19',{timeout:15000});
              await page.waitForTimeout(250);
              const base=await page.evaluate(()=>{
                const root=document.querySelector('.nn-travel-v19');
                const rr=root.getBoundingClientRect();
                const tabs=root.querySelectorAll('[data-travel-tab]');
                const visible=[...root.querySelectorAll('[data-panel]')].filter(x=>!x.hidden&&getComputedStyle(x).display!=='none').map(x=>x.dataset.panel);
                return {
                  root:{x:rr.x,y:rr.y,w:rr.width,h:rr.height,right:rr.right,bottom:rr.bottom},
                  visible,tabs:tabs.length,modes:root.querySelectorAll('[data-v16-trip-mode]').length,
                  ota:root.querySelector('[data-ota-badge]')?.textContent,
                  bodyScroll:document.body.scrollHeight>innerHeight+2,
                  docScroll:document.documentElement.scrollHeight>innerHeight+2,
                  screen:document.querySelector('.nx-screen').getBoundingClientRect().toJSON()
                };
              });
              if(base.visible.length!==1||base.visible[0]!=='flights') throw new Error(`${p.name}: initial panel leak ${JSON.stringify(base.visible)}`);
              if(base.tabs!==4) throw new Error(`${p.name}: expected exactly four Travel tabs, got ${base.tabs}`);
              if(base.modes!==2) throw new Error(`${p.name}: trip mode controls missing`);
              if(base.ota!=='1') throw new Error(`${p.name}: source OTA badge must be revision 1 before release stamping, got ${base.ota}`);
              if(base.bodyScroll||base.docScroll) throw new Error(`${p.name}: whole page scroll detected`);
              if(base.root.x<-0.5||base.root.right>p.w+0.5||base.root.h<120) throw new Error(`${p.name}: Travel root overflow/zero ${JSON.stringify(base.root)}`);
              if(Math.abs(base.root.w-base.screen.width)>1||Math.abs(base.root.h-base.screen.height)>1) throw new Error(`${p.name}: root does not fill safe app rectangle`);
              await page.screenshot({path:`travel-v19-${p.w}x${p.h}-${p.name}-flights.png`,fullPage:false});

              for(const tab of ['hotels','ground','plan','flights']){
                await page.locator(`[data-travel-tab="${tab}"]`).click();
                const visible=await page.locator('.nn-travel-v19').evaluate(el=>[...el.querySelectorAll('[data-panel]')].filter(x=>!x.hidden&&getComputedStyle(x).display!=='none').map(x=>x.dataset.panel));
                if(visible.length!==1||visible[0]!==tab) throw new Error(`${p.name}: ${tab} panel isolation failed: ${visible}`);
              }

              await page.locator('[data-v16-trip-mode="oneway"]').click();
              if(await page.locator('[data-flight-return]').isVisible()) throw new Error(`${p.name}: one-way did not hide return`);
              await page.locator('[data-v16-trip-mode="roundtrip"]').click();
              if(!(await page.locator('[data-flight-return]').isVisible())) throw new Error(`${p.name}: round-trip did not restore return`);

              await page.locator('[data-flight-origin]').fill('KHI');
              await page.locator('[data-flight-destination]').fill('DXB');
              await page.locator('.nn-swap').click();
              let swapped=await page.evaluate(()=>[document.querySelector('[data-flight-origin]').value,document.querySelector('[data-flight-destination]').value]);
              if(swapped[0]!=='DXB'||swapped[1]!=='KHI') throw new Error(`${p.name}: swap failed ${swapped}`);
              await page.locator('.nn-swap').click();
              await page.locator('[data-flight-departure]').fill('2026-09-12');
              await page.locator('[data-flight-search]').click();
              await page.waitForFunction(()=>document.querySelector('[data-flight-status]')?.textContent.includes('genuine live fare'),null,{timeout:5000});
              if((await page.locator('.nn-result').count())<1) throw new Error(`${p.name}: flight results absent`);
              if(!(await page.locator('[data-results]').isVisible())) throw new Error(`${p.name}: results overlay did not open`);
              for(const filter of ['cheapest','fastest','direct','best']) await page.locator(`[data-v16-sort="${filter}"]`).click({timeout:3000});
              await page.screenshot({path:`travel-v19-${p.w}x${p.h}-${p.name}-results.png`,fullPage:false});

              await page.locator('[data-travel-tab="hotels"]').click();
              await page.locator('[data-hotel-destination]').fill('Karachi, Pakistan');
              await page.locator('[data-hotel-checkin]').fill('2026-09-15');
              await page.locator('[data-hotel-checkout]').fill('2026-09-17');
              await page.locator('[data-hotel-search]').click();
              await page.waitForFunction(()=>document.querySelector('[data-hotel-status]')?.textContent.includes('genuine live hotel'),null,{timeout:5000});

              await page.locator('[data-travel-tab="ground"]').click();
              await page.locator('[data-ground-origin]').fill('London');
              await page.locator('[data-ground-destination]').fill('Paris');
              await page.locator('[data-ground-date]').fill('2026-09-12');
              await page.locator('[data-ground-search]').click();
              await page.waitForFunction(()=>/pending|provider|contract/i.test(document.querySelector('[data-ground-status]')?.textContent||''),null,{timeout:5000});

              await page.locator('[data-travel-tab="plan"]').click();
              await page.locator('[data-trip-destination]').fill('Dubai');
              await page.locator('[data-trip-save]').click();
              await page.waitForFunction(()=>document.querySelector('[data-trip-status]')?.textContent.includes('saved privately'),null,{timeout:3000});

              if(errors.length) throw new Error(`${p.name}: page errors ${errors.join(' | ')}`);
              await page.close();
              console.log(`PASS ${p.name} ${p.w}x${p.h}`);
            }
            await browser.close();
            console.log('TRAVEL V19 ADAPTIVE + INTERACTION QA PASS');
          })().catch(error=>{console.error(error);process.exit(1)});
          '@ | node

      - name: Upload reference visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-v19-reference-evidence
          path: travel-v19-*.png
          if-no-files-found: warn
          retention-days: 7
