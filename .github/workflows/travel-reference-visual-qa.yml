name: NexusNova Travel Reference Visual QA

on:
  push:
    branches:
      - travel-reference-v7-final-staging
    paths:
      - '.github/workflows/travel-reference-visual-qa.yml'
      - 'fresh-rebuild/travel-reference-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-suite.js'
      - 'fresh-rebuild/src/features/apps/travel-suite-v5.js'
      - 'fresh-rebuild/src/features/apps/travel-suite-v6.js'
      - 'fresh-rebuild/src/features/apps/travel-suite-v7.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-gate-reference-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate 1 - JavaScript syntax
        run: |
          node --check fresh-rebuild/src/features/apps/travel-suite-v6.js
          node --check fresh-rebuild/src/features/apps/travel-suite-v7.js
          node --check fresh-rebuild/src/features/apps/travel-suite.js

      - name: Gate 2 - locked reference contract
        run: |
          set -euo pipefail
          grep -q "referenceLocked = 'true'" fresh-rebuild/src/features/apps/travel-suite-v6.js
          grep -q "grid-template-columns:repeat(12" fresh-rebuild/src/features/apps/travel-suite-v6.js
          grep -q "grid-template-rows:132px 386px" fresh-rebuild/src/features/apps/travel-suite-v6.js
          grep -q "width:550px" fresh-rebuild/src/features/apps/travel-suite-v6.js
          grep -q "height:1032px" fresh-rebuild/src/features/apps/travel-suite-v6.js

      - name: Gate 3 - live-only API contract
        run: |
          set -euo pipefail
          grep -q "searchWorldwideFlights" fresh-rebuild/src/features/apps/travel-suite-v5.js
          grep -q "searchPakistanAgencyFlights" fresh-rebuild/src/features/apps/travel-suite-v5.js
          grep -q "searchWorldwideHotels" fresh-rebuild/src/features/apps/travel-suite-v7.js
          grep -q "searchWorldwideGroundTransport" fresh-rebuild/src/features/apps/travel-suite-v7.js
          grep -q "searchPakistanUmrahPackages" fresh-rebuild/src/features/apps/travel-suite-v7.js
          grep -q "dataset.liveOnly='true'" fresh-rebuild/src/features/apps/travel-suite-v7.js

      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start local Fresh server
        run: |
          python3 -m http.server 4173 --directory fresh-rebuild >/tmp/nexusnova-travel-http.log 2>&1 &
          echo $! > /tmp/nexusnova-travel-http.pid
          sleep 2

      - name: Gates 4-6 - runtime geometry, no-scroll and control wiring
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:550,height:1215},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/travel-reference-harness.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('[data-reference-locked="true"]',{timeout:15000});
            await page.waitForTimeout(1200);
            const report=await page.evaluate(()=>{
              const root=document.querySelector('[data-reference-locked="true"]');
              const rect=sel=>{const e=root.querySelector(sel);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,r:r.right};};
              const tabs=[...root.querySelectorAll('[data-travel-tab]')].map(e=>({name:e.dataset.travelTab,...rect(`[data-travel-tab="${e.dataset.travelTab}"]`)}));
              const from=rect('.nn-from'),to=rect('.nn-to'),depart=rect('.nn-depart'),ret=rect('.nn-return'),adults=rect('.nn-adults'),cabin=rect('.nn-cabin'),currency=rect('.nn-currency');
              const rootRect=root.getBoundingClientRect();
              const pageOverflow=document.documentElement.scrollHeight>1215||document.body.scrollHeight>1215;
              const geometry={
                fourTabs:tabs.length===4,
                row1:Boolean(from&&to&&Math.abs(from.y-to.y)<2&&from.r<to.x),
                row2:Boolean(depart&&ret&&Math.abs(depart.y-ret.y)<2&&depart.r<=ret.x+2),
                row3:Boolean(adults&&cabin&&currency&&Math.abs(adults.y-cabin.y)<2&&Math.abs(cabin.y-currency.y)<2&&adults.r<=cabin.x+2&&cabin.r<=currency.x+2),
                rootContained:rootRect.height>0&&rootRect.bottom<=document.querySelector('.nx-dock.global').getBoundingClientRect().top,
                pageOverflow,
                liveOnly:root.dataset.liveOnly==='true',
                controls:[...root.querySelectorAll('button')].filter(b=>!b.classList.contains('nn-tab')).map(b=>b.getAttribute('data-flight-search')!==null||b.getAttribute('data-hotel-search')!==null||b.getAttribute('data-ground-search')!==null||b.getAttribute('data-trip-save')!==null||b.getAttribute('data-trip-clear')!==null||b.getAttribute('data-pakistan-tours')!==null).filter(Boolean).length
              };
              return {geometry,tabs,root:{x:rootRect.x,y:rootRect.y,w:rootRect.width,h:rootRect.height}};
            });
            console.log(JSON.stringify(report,null,2));
            if(!report.geometry.fourTabs||!report.geometry.row1||!report.geometry.row2||!report.geometry.row3) throw new Error('Gate 4 failed: approved reference field geometry is not locked.');
            if(report.geometry.pageOverflow||!report.geometry.rootContained) throw new Error('Gate 5 failed: Travel page is not scroll-free/contained.');
            if(!report.geometry.liveOnly||report.geometry.controls<6) throw new Error('Gate 6 failed: live-only/control wiring contract incomplete.');
            await page.screenshot({path:'travel-reference-actual.png',fullPage:false});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-reference-visual-evidence
          path: travel-reference-actual.png
          if-no-files-found: warn
          retention-days: 7
