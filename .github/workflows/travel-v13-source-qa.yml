name: NexusNova Travel V13 Source QA

on:
  push:
    branches: [main]
    paths:
      - 'fresh-rebuild/src/features/apps/travel-futuristic-v13.js'
      - 'fresh-rebuild/src/features/apps/travel-futuristic-v13-integrity.js'
      - 'fresh-rebuild/src/features/apps/travel-phone-layout-v32.js'
      - 'fresh-rebuild/src/features/apps/travel-edge-client.js'
      - '.github/workflows/travel-v13-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-futuristic-v13.js
          node --check fresh-rebuild/src/features/apps/travel-futuristic-v13-integrity.js
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v32.js
          node --check fresh-rebuild/src/features/apps/travel-edge-client.js
      - name: V13 production contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base='fresh-rebuild/src/features/apps/';
          const v13=fs.readFileSync(base+'travel-futuristic-v13.js','utf8');
          const integrity=fs.readFileSync(base+'travel-futuristic-v13-integrity.js','utf8');
          const v32=fs.readFileSync(base+'travel-phone-layout-v32.js','utf8');
          const edge=fs.readFileSync(base+'travel-edge-client.js','utf8');

          for(const token of [
            "const BRAND_URL='https://nexusnovatools.com/'",
            'searchWorldwideHotels',
            'offer.live===true',
            'collectImages',
            'roomImages',
            'propertyImages',
            'nn-v13-compare',
            'data-v13-route'
          ]) if(!v13.includes(token)) throw new Error(`V13 contract missing: ${token}`);

          for(const token of [
            "window.NexusBrowserAndroid?.postMessage",
            "action:'open'",
            'external browser fallback blocked',
            "https://www.google.com/maps/dir/?api=1&destination="
          ]) if(!integrity.includes(token)) throw new Error(`V13 integrity contract missing: ${token}`);

          if(/window\.open\s*\(|openExternal/.test(integrity)) throw new Error('V13 integrity must not fall back to an external browser.');
          if(!integrity.includes("heading.innerHTML='Travel,<br>beautifully routed.'")) throw new Error('Route-independent hero copy guard missing.');

          for(const token of [
            "window.NexusNovaTravelLayoutOwner='v32'",
            "import('./travel-futuristic-v13.js')",
            "import('./travel-futuristic-v13-integrity.js')",
            'overflow-x:hidden!important',
            'overflow-y:hidden!important'
          ]) if(!v32.includes(token)) throw new Error(`V32 contract missing: ${token}`);

          if(!edge.includes("new CustomEvent('nexusnova:travel-rpc'")) throw new Error('Travel RPC event bridge missing.');
          console.log('Travel V13 source contracts PASS');
          NODE
