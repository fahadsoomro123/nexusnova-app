name: NexusNova Travel V19 OTA Publish

on:
  push:
    branches:
      - travel-reference-v7-final-staging
    paths:
      - '.github/workflows/travel-v19-ota-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TRAVEL_SOURCE_SHA: 19f8fd8c6d448a2371971b2812f45163181f81c6
  OTA_BUNDLED_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
  PUBLIC_OTA_REPO: fahadsoomro123/nexusnova-website
  PUBLIC_OTA_BRANCH: nexusnova-ota-public

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Lock release commit to verified Travel source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:TRAVEL_SOURCE_SHA) { throw "Release parent mismatch: $parent" }
          $changed = @(git diff --name-only $env:TRAVEL_SOURCE_SHA $env:GITHUB_SHA)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/travel-v19-ota-publish.yml') {
            throw "Release commit changed unexpected files: $($changed -join ', ')"
          }
          Write-Host "Travel release source locked: $env:TRAVEL_SOURCE_SHA"

      - name: Require successful Travel V19 QA for source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:TRAVEL_SOURCE_SHA&status=completed&per_page=50"
          $runs = (Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri $uri -Method Get).workflow_runs
          $passed = @($runs | Where-Object {
            $_.path -eq '.github/workflows/travel-reference-visual-qa.yml' -and
            $_.head_sha -eq $env:TRAVEL_SOURCE_SHA -and
            $_.conclusion -eq 'success'
          })
          if ($passed.Count -lt 1) { throw "No successful Travel V19 QA exists for $env:TRAVEL_SOURCE_SHA" }
          Write-Host "Travel QA gate PASS via run $($passed[0].id)"

      - name: Verify OTA Travel source contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'fresh-rebuild/src/features/apps/travel-suite.js',
            'fresh-rebuild/src/features/apps/travel-edge-client.js',
            'fresh-rebuild/src/features/apps/travel-integrations.js',
            'fresh-rebuild/assets/travel/reference-hero-right.webp.b64',
            'fresh-rebuild/assets/travel/reference-from-exact.webp.b64',
            'fresh-rebuild/assets/travel/reference-to-exact.webp.b64'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 1) { throw "Missing OTA source file: $file" }
          }
          node --check fresh-rebuild/src/features/apps/travel-suite.js
          node --check fresh-rebuild/src/features/apps/travel-edge-client.js
          node --check fresh-rebuild/src/features/apps/travel-integrations.js
          $travel = Get-Content -Raw fresh-rebuild/src/features/apps/travel-suite.js
          foreach ($needle in @('fresh-reference-v19-pixel-map','measured-reference-hybrid',"OTA_RELEASE_ID = 'travel-reference-ota-1'")) {
            if (-not $travel.Contains($needle)) { throw "Travel release marker missing: $needle" }
          }
          $integration = Get-Content -Raw fresh-rebuild/src/features/apps/travel-integrations.js
          if (-not $integration.Contains(".nn-travel-v16,[data-runtime-repair]")) { throw 'Fresh Travel legacy-injection guard missing' }
          Write-Host 'OTA Travel source contract PASS'

      - name: Require public OTA credential
        shell: powershell
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_OTA_TOKEN)) { throw 'Public OTA credential missing' }

      - name: Build cumulative Travel OTA over current public OTA
        id: build
        shell: powershell
        env:
          PUBLIC_OTA_TOKEN: ${{ secrets.GH_PUBLIC_OTA_TOKEN || secrets.OTA_PUBLIC_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $public = Join-Path $env:RUNNER_TEMP 'nx-travel-v19-public'
          if (Test-Path $public) { Remove-Item -Recurse -Force $public }
          git clone --depth 1 --branch $env:PUBLIC_OTA_BRANCH "https://github.com/$env:PUBLIC_OTA_REPO.git" $public
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone public OTA repository' }

          $ota = Join-Path $public 'ota'
          $filesRoot = Join-Path $ota 'files'
          $manifestPath = Join-Path $ota 'manifest.json'
          if (-not (Test-Path $manifestPath)) { throw 'Current public OTA manifest missing' }
          if (-not (Test-Path $filesRoot)) { throw 'Current public OTA files missing' }

          $old = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ([int]$old.schema -ne 2) { throw 'Current public OTA schema is not 2' }
          if ([string]$old.base -ne $env:OTA_BUNDLED_BASE) { throw "Current public OTA base mismatch: $($old.base)" }
          foreach ($entry in @($old.files)) {
            $oldPath = Join-Path $filesRoot ([string]$entry.path).Replace('/','\')
            if (-not (Test-Path $oldPath)) { throw "Existing OTA file missing before Travel merge: $($entry.path)" }
          }

          $overlay = @{
            'fresh-rebuild/src/features/apps/travel-suite.js' = 'src/features/apps/travel-suite.js'
            'fresh-rebuild/src/features/apps/travel-edge-client.js' = 'src/features/apps/travel-edge-client.js'
            'fresh-rebuild/src/features/apps/travel-integrations.js' = 'src/features/apps/travel-integrations.js'
            'fresh-rebuild/assets/travel/reference-hero-right.webp.b64' = 'assets/travel/reference-hero-right.webp.b64'
            'fresh-rebuild/assets/travel/reference-from-exact.webp.b64' = 'assets/travel/reference-from-exact.webp.b64'
            'fresh-rebuild/assets/travel/reference-to-exact.webp.b64' = 'assets/travel/reference-to-exact.webp.b64'
          }
          foreach ($src in $overlay.Keys) {
            $rel = $overlay[$src]
            $dest = Join-Path $filesRoot $rel.Replace('/','\')
            $parent = Split-Path -Parent $dest
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            Copy-Item -Force $src $dest
          }

          $entries = @()
          Get-ChildItem -Path $filesRoot -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($filesRoot.Length).TrimStart('\','/').Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            $entries += [ordered]@{ path=$rel; sha256=$hash; size=[int64]$_.Length }
          }
          if (-not ($entries.path -contains 'index.html')) { throw 'OTA entry point index.html missing after merge' }
          if (-not ($entries.path -contains 'src/features/apps/ai-photo-studio-review.js')) { throw 'Existing AI Photo OTA overlay was not preserved' }
          foreach ($rel in $overlay.Values) {
            if (-not ($entries.path -contains $rel)) { throw "Travel OTA file missing after merge: $rel" }
          }

          $manifest = [ordered]@{
            schema = 2
            base = $env:OTA_BUNDLED_BASE
            version = $env:GITHUB_SHA.ToLowerInvariant()
            source = $env:TRAVEL_SOURCE_SHA
            proof_number = [string]$old.proof_number
            travel_revision = 1
            files = $entries
          }
          $json = $manifest | ConvertTo-Json -Depth 6 -Compress
          [System.IO.File]::WriteAllText($manifestPath, $json, (New-Object System.Text.UTF8Encoding($false)))

          Push-Location $public
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A ota
          git commit -m "Publish Travel V19 OTA revision 1 $env:TRAVEL_SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Public OTA commit failed' }
          $publicSha = (git rev-parse HEAD).Trim()
          $authText = "x-access-token:$env:PUBLIC_OTA_TOKEN"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($authText))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$env:PUBLIC_OTA_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Public OTA push failed' }
          Pop-Location

          "public_sha=$publicSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Published public OTA commit: $publicSha"

      - name: Verify public Travel OTA end-to-end
        shell: powershell
        env:
          PUBLIC_SHA: ${{ steps.build.outputs.public_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_SHA)) { throw 'Published OTA SHA missing' }
          $baseUrl = "https://raw.githubusercontent.com/$env:PUBLIC_OTA_REPO/$env:PUBLIC_SHA/ota"
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'nx-travel-v19-verify'
          if (Test-Path $verifyRoot) { Remove-Item -Recurse -Force $verifyRoot }
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null
          $publicManifest = Join-Path $verifyRoot 'manifest.json'
          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/manifest.json" -OutFile $publicManifest
          $m = Get-Content -Raw $publicManifest | ConvertFrom-Json
          if ([int]$m.schema -ne 2) { throw 'Published OTA schema mismatch' }
          if ([string]$m.base -ne $env:OTA_BUNDLED_BASE) { throw 'Published OTA base mismatch' }
          if ([string]$m.version -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Published OTA version mismatch' }
          if ([string]$m.source -ne $env:TRAVEL_SOURCE_SHA) { throw 'Published OTA source mismatch' }
          if ([int]$m.travel_revision -ne 1) { throw 'Published Travel revision is not 1' }

          $paths = @($m.files | ForEach-Object { [string]$_.path })
          foreach ($required in @(
            'index.html',
            'src/features/apps/ai-photo-studio-review.js',
            'src/features/apps/travel-suite.js',
            'src/features/apps/travel-edge-client.js',
            'src/features/apps/travel-integrations.js',
            'assets/travel/reference-hero-right.webp.b64',
            'assets/travel/reference-from-exact.webp.b64',
            'assets/travel/reference-to-exact.webp.b64'
          )) {
            if (-not ($paths -contains $required)) { throw "Published OTA missing required file: $required" }
          }

          foreach ($entry in @($m.files)) {
            $rel = [string]$entry.path
            $target = Join-Path $verifyRoot $rel.Replace('/','\')
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            $encoded = (($rel -split '/') | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
            Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/files/$encoded" -OutFile $target
            if ((Get-Item $target).Length -ne [int64]$entry.size) { throw "Published OTA size mismatch: $rel" }
            $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
            if ($hash -ne [string]$entry.sha256) { throw "Published OTA hash mismatch: $rel" }
          }
          Write-Host "PUBLIC TRAVEL OTA REVISION 1 VERIFIED: $env:PUBLIC_SHA"
