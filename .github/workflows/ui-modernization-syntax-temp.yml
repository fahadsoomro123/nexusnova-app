name: TEMP Final UI and Splash Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/**'
      - 'NexusNovaAndroid/**'
      - '.github/workflows/nexusnova-android-build.yml'
      - '.github/workflows/ui-modernization-syntax-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check targeted files
        run: |
          set -euo pipefail
          node --check js/nexusnova-compact-premium-v1.js
          node --check js/nexusnova-page2-after-core-v2.js
          node --check js/nexusnova-auth-page-v2.js
          python3 -m py_compile NexusNovaAndroid/patch_splash_timing.py

      - name: Verify protected owners unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- js/nexusnova-allapps-scroll-fix-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-navigation-stability-v1.js
          git diff --exit-code origin/main...HEAD -- js/rewards-security-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-nova-vault-v1.js
          git diff --exit-code origin/main...HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Prepare Android shell through splash stage
        run: |
          set -euo pipefail
          python3 NexusNovaAndroid/prepare_native_web_shell.py
          python3 NexusNovaAndroid/patch_mining_boost_sync.py
          python3 NexusNovaAndroid/patch_viewport.py
          python3 NexusNovaAndroid/patch_admob.py
          python3 NexusNovaAndroid/patch_rewarded_test_contract.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx.py
          python3 NexusNovaAndroid/patch_test_boost_reward_fx_hardening.py
          python3 NexusNovaAndroid/patch_test_boost_cooldown_gate.py
          python3 NexusNovaAndroid/patch_test_boost_final2h_guard.py
          python3 NexusNovaAndroid/patch_test_boost_authoritative_timer.py
          python3 NexusNovaAndroid/patch_ad_privacy.py
          python3 NexusNovaAndroid/patch_session_restore.py
          python3 NexusNovaAndroid/patch_deferred_caller_setup.py
          python3 NexusNovaAndroid/patch_web_shell_reset.py
          python3 NexusNovaAndroid/patch_native_shell.py
          python3 NexusNovaAndroid/patch_splash_timing.py

      - name: Verify readable splash and UI shell
        run: |
          set -euo pipefail
          grep -q 'setTimeout(releaseSplash, 1900);' NexusNovaAndroid/app/src/main/assets/www/index.html
          grep -q 'setTimeout(nxForceReleaseSplash, 1400);' NexusNovaAndroid/app/src/main/assets/www/page2.html
          grep -q 'nexusnova-compact-premium-v1.js?v=1' NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-page2-after-core-v2.js
          test -s NexusNovaAndroid/app/src/main/assets/www/js/nexusnova-compact-premium-v1.js
          ! grep -q 'showCallerSetupOnce()' NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt
          echo 'Final UI and splash validation passed.'
