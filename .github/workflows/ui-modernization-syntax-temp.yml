name: TEMP UI Modernization Syntax Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/**'
      - '.github/workflows/ui-modernization-syntax-temp.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nexusnova-compact-premium-v1.js
          node --check js/nexusnova-page2-after-core-v2.js
          node --check js/nexusnova-auth-page-v2.js

      - name: Verify stability owners remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- js/nexusnova-allapps-scroll-fix-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-navigation-stability-v1.js
          git diff --exit-code origin/main...HEAD -- js/rewards-security-v1.js
          git diff --exit-code origin/main...HEAD -- js/nexusnova-nova-vault-v1.js
          git diff --exit-code origin/main...HEAD -- NexusNovaAndroid/app/src/main/java/com/nexusnova/app/MainActivity.kt

      - name: Verify targeted UI contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const ui = fs.readFileSync('js/nexusnova-compact-premium-v1.js','utf8');
          const after = fs.readFileSync('js/nexusnova-page2-after-core-v2.js','utf8');
          const auth = fs.readFileSync('js/nexusnova-auth-page-v2.js','utf8');
          for (const token of [
            'nx-compact-premium-v1',
            'installActiveDockGuard',
            'nxNovaVaultPanel',
            'nxMiningBoostPanel',
            'nxProgressMini',
            'System Status',
            'compactSetting'
          ]) if (!ui.includes(token)) throw new Error('Missing UI contract token: ' + token);
          if (!after.includes("import('./nexusnova-compact-premium-v1.js?v=1')")) throw new Error('Compact UI loader missing.');
          if (!auth.includes('AUTH_SPLASH_TARGET_MS = 1900')) throw new Error('Auth splash target missing.');
          if (!auth.includes('AUTH_SUCCESS_HOLD_MS = 650')) throw new Error('Auth success hold missing.');
          if (/__nxShellV2\s*=\s*true/.test(auth)) throw new Error('Forbidden auth shell preload flag returned.');
          console.log('Targeted UI modernization contract passed.');
          NODE
