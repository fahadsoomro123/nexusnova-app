name: VEYTRIX QA
on:
  push:
    branches: [veytrix-autonomous-control]
    paths:
      - 'veytrix/**'
      - 'server.js'
      - 'screenshots/**'
      - '.github/workflows/veytrix-qa.yml'
  pull_request:
    branches: [ai-photo-real-canva-ai-generator-correction]
    paths:
      - 'veytrix/**'
      - 'server.js'
      - '.github/workflows/veytrix-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check veytrix/js/app.js
          node --check veytrix/js/state.js
          node --check veytrix/js/data.js
      - name: Install QA dependencies
        working-directory: veytrix/qa
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: veytrix/qa
        run: npx playwright install --with-deps chromium
      - name: Browser QA and screenshots
        working-directory: veytrix/qa
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix-screenshots-${{ github.sha }}
          path: screenshots/*.png
          if-no-files-found: warn
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix-playwright-report-${{ github.sha }}
          path: veytrix/qa/playwright-report
          if-no-files-found: warn
      - name: Build preview ZIP
        if: always()
        run: |
          mkdir -p preview-package
          cp -R veytrix preview-package/veytrix
          if [ -d screenshots ]; then cp -R screenshots preview-package/screenshots; fi
          cd preview-package
          zip -r ../veytrix_preview_complete.zip veytrix screenshots >/dev/null 2>&1 || zip -r ../veytrix_preview_complete.zip veytrix >/dev/null 2>&1
      - name: Upload complete preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix_preview_complete-${{ github.sha }}
          path: veytrix_preview_complete.zip
          if-no-files-found: error
