name: VEYTRIX QA
on:
  push:
    branches: [veytrix-autonomous-control]
    paths:
      - 'veytrix/**'
      - 'server.js'
      - 'screenshots/**'
      - '.github/workflows/veytrix-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check veytrix/js/app.js
          node --check veytrix/js/state.js
          node --check veytrix/js/data.js
      - name: Install Playwright
        working-directory: veytrix/qa
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Browser QA and screenshots
        working-directory: veytrix/qa
        run: npx --yes playwright@1.55.0 test --config=playwright.config.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix-screenshots-${{ github.sha }}
          path: screenshots/*.png
          if-no-files-found: warn
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix-playwright-report-${{ github.sha }}
          path: veytrix/qa/playwright-report
          if-no-files-found: warn
