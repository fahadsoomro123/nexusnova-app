name: NexusNova Video Android Emulator Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/video-flagship-complete-20260921]
    paths:
      - 'fresh-rebuild/src/main.js'
      - 'fresh-rebuild/src/features/apps/app-screen.js'
      - 'fresh-rebuild/src/features/apps/ai-video-studio-flagship.js'
      - 'NexusNovaAndroid/app/**'
      - 'NexusNovaAndroid/build.gradle.kts'
      - 'NexusNovaAndroid/settings.gradle.kts'
      - '.github/workflows/video-android-emulator-gate.yml'

permissions:
  contents: read

jobs:
  android-emulator-video:
    name: Video Studio Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build debug APK and test APK
        working-directory: NexusNovaAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Create deterministic VP8 WebM fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gstreamer1.0-tools gstreamer1.0-plugins-good
          mkdir -p qa/fixtures
          gst-launch-1.0 -q videotestsrc num-buffers=30 pattern=ball ! video/x-raw,width=160,height=90,framerate=15/1 ! videoconvert ! vp8enc ! webmmux ! filesink location=qa/fixtures/generated.webm
          test -s qa/fixtures/generated.webm

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Video Studio on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: NexusNovaAndroid
          script: |
            set -eu
            mkdir -p ../artifacts/video-emulator
            trap 'adb exec-out screencap -p > ../artifacts/video-emulator/final-screen.png || true; adb logcat -d -t 5000 > ../artifacts/video-emulator/logcat.txt || true; adb pull /sdcard/Android/data/com.nexusnova.app/files/Pictures ../artifacts/video-emulator/pictures >/dev/null 2>&1 || true' EXIT
            adb wait-for-device
            adb push ../qa/fixtures/generated.webm /sdcard/Download/video-studio-video-qa.webm
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/video-studio-video-qa.webm >/dev/null 2>&1 || true
            adb shell test -s /sdcard/Download/video-studio-video-qa.webm
            adb shell am force-stop com.nexusnova.app
            gradle --no-daemon :app:connectedDebugAndroidTest --tests com.nexusnova.app.VideoStudioEmulatorQaTest

      - name: Collect emulator test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/video-emulator
          cp -R NexusNovaAndroid/app/build/outputs/androidTest-results artifacts/video-emulator/ || true
          cp -R NexusNovaAndroid/app/build/outputs/logs artifacts/video-emulator/ || true
          find artifacts/video-emulator -maxdepth 5 -type f -print | sort || true

      - name: Upload emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Video-Android-Emulator-Proof
          path: artifacts/video-emulator
          if-no-files-found: warn
          retention-days: 7
