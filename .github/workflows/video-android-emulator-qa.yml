name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"
      - "qa/run_video_android_emulator_qa.sh"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if 'name="caller_setup_title"' not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Build app and Android test APKs
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: bash "$GITHUB_WORKSPACE/qa/run_video_android_emulator_qa.sh"

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn

      - name: Build unsigned release APK for bootstrap
        if: always()
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Sign and verify bootstrap APK
        if: always()
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/nexusnova-release.jks
          keytool -list -keystore /tmp/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release-unsigned.apk' -print -quit)"
          if [ -z "$unsigned" ]; then
            unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release.apk' -print -quit)"
          fi
          test -n "$unsigned"
          test -s "$unsigned"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          rm -rf bootstrap-output
          mkdir -p bootstrap-output
          "$ZIPALIGN" -p -f 4 "$unsigned" bootstrap-output/unaligned-signed.apk
          "$APKSIGNER" sign             --ks /tmp/nexusnova-release.jks             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out bootstrap-output/NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP.apk             bootstrap-output/unaligned-signed.apk

          "$APKSIGNER" verify --verbose --print-certs bootstrap-output/NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP.apk

          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q bootstrap-output/NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP.apk             'assets/www/index.html'             'assets/www/src/features/apps/ai-video-studio-flagship.js'             -d "$d"

          grep -Fq 'nx-video-file-input' "$d/assets/www/src/features/apps/ai-video-studio-flagship.js"
          echo "PASS — signed bootstrap APK verified with native media-fix source."

          sha256sum bootstrap-output/NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP.apk > bootstrap-output/NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP.apk.sha256

      - name: Upload signed OTA12 bootstrap APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP
          path: NexusNovaAndroid/bootstrap-output/*
          if-no-files-found: error
          retention-days: 14
