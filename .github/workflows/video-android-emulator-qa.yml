name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install media fixture tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Create deterministic Android media fixtures
        run: |
          set -euo pipefail
          mkdir -p qa/fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=160x90:r=12:d=1 -c:v libvpx -b:v 200k -an qa/fixtures/video-picker.webm
          cp qa/fixtures/video-picker.webm qa/fixtures/video-import.webm
          cp qa/fixtures/video-picker.webm qa/fixtures/video-preview.webm
          cp qa/fixtures/video-picker.webm qa/fixtures/format-webm.webm
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=160x90:r=24:d=1 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -crf 30 -an qa/fixtures/format-mp4.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 8 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -b:v 8M -maxrate 8M -bufsize 16M -an qa/fixtures/large-video.mp4
          for f in qa/fixtures/video-picker.webm qa/fixtures/format-mp4.mp4 qa/fixtures/large-video.mp4; do test -s "$f"; stat -c "%n %s bytes" "$f"; done

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if "name="caller_setup_title"" not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY


      - name: Build app and Android test APKs
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            set -u
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push "$GITHUB_WORKSPACE/qa/fixtures/video-picker.webm" /data/local/tmp/video-picker.webm
            adb push "$GITHUB_WORKSPACE/qa/fixtures/format-mp4.mp4" /data/local/tmp/format-mp4.mp4
            adb push "$GITHUB_WORKSPACE/qa/fixtures/large-video.mp4" /data/local/tmp/large-video.mp4
            adb shell run-as com.nexusnova.app sh -c 'mkdir -p files/qa && cp /data/local/tmp/video-picker.webm files/qa/video-picker.webm && cp /data/local/tmp/format-mp4.mp4 files/qa/format-mp4.mp4 && cp /data/local/tmp/large-video.mp4 files/qa/large-video.mp4'

            adb shell am instrument -w -r -e class com.nexusnova.app.VideoStudioEmulatorQaTest#videoStudioFullscreenScopedDockAndNativeMediaPicker com.nexusnova.app.test/androidx.test.runner.AndroidJUnitRunner
            status=$?

            mkdir -p "$GITHUB_WORKSPACE/qa/android-emulator-results"
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/qa/android-emulator-results/logcat.txt" || true
            adb shell ls -la /sdcard/Android/data/com.nexusnova.app/files/Pictures/ || true
            adb pull /sdcard/Android/data/com.nexusnova.app/files/Pictures "$GITHUB_WORKSPACE/qa/android-emulator-results/" || true

            exit $status


      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn
