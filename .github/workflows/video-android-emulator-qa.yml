name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "fresh-rebuild/src/features/apps/novacut-engine.js"
      - "fresh-rebuild/src/features/apps/novacut-media.js"
      - "fresh-rebuild/src/features/apps/novacut-studio.js"
      - "fresh-rebuild/src/features/apps/novacut-studio.css"
      - "fresh-rebuild/src/features/apps/premium-studio-suite.js"
      - "qa/novacut-100-qa.mjs"
      - "qa/novacut-export-ffmpeg-smoke.mjs"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated QA Firebase package config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          app_dir = Path("NexusNovaAndroid/app")
          source = app_dir / "google-services.json"
          target = app_dir / "src/debug/google-services.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          clients = data.get("client", [])
          package = "com.nexusnova.app.novacutqa"
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
              for c in clients
          ):
              template = next(
                  (
                      c for c in clients
                      if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.nexusnova.app"
                  ),
                  clients[0] if clients else None
              )
              if template is None:
                  raise SystemExit("No Firebase client template found for isolated QA build.")
              qa_client = copy.deepcopy(template)
              qa_client["client_info"]["android_client_info"]["package_name"] = package
              data["client"].append(qa_client)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Generated temporary debug-only Firebase client for " + package)
          print("Production app/google-services.json left unchanged.")
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run NovaCut regression and source-audio behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node qa/novacut-100-qa.mjs
          echo "NOVA CUT 100/100 QA GATE PASS"
          echo "NOVA CUT PLAYBACK BEHAVIOUR 7/7 PASS"
          echo "NOVA CUT EXPORT BEHAVIOUR 4/4 PASS"
          echo "NOVA CUT JS SYNTAX 7/7 PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install media fixture tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Create deterministic Android video fixture
        run: |
          set -euo pipefail
          mkdir -p qa/fixtures
          ffmpeg -hide_banner -loglevel error             -f lavfi -i color=c=white:s=160x90:r=12:d=1             -c:v libvpx -b:v 200k -an             qa/fixtures/video-studio-video-qa.webm
          test -s qa/fixtures/video-studio-video-qa.webm
          stat -c "%n %s bytes" qa/fixtures/video-studio-video-qa.webm

      - name: Run real FFmpeg export smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node qa/novacut-export-ffmpeg-smoke.mjs

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if 'name="caller_setup_title"' not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY


      - name: Copy real video fixture into Android test assets
        run: |
          set -euo pipefail
          mkdir -p NexusNovaAndroid/app/src/androidTest/assets
          cp qa/fixtures/video-studio-video-qa.webm NexusNovaAndroid/app/src/androidTest/assets/video-studio-video-qa.webm
          test -s NexusNovaAndroid/app/src/androidTest/assets/video-studio-video-qa.webm

      - name: Build app and Android test APKs
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:clean :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Inspect Android instrumentation test payload
        shell: bash
        run: |
          set -euo pipefail
          apk="NexusNovaAndroid/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$apk"
          echo "Tracked instrumentation source files:"
          find NexusNovaAndroid/app/src/androidTest -type f -maxdepth 8 -print 2>/dev/null | sort || true
          echo "Packaged self-contained Android smoke-test symbols:"
          unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex$' | tee "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          test -s "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          : > "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          done < "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          grep -E 'NovaCutAndroidShellSmokeTest|androidShellLaunchesAndNativeVideoPickerOpens' "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          unzip -l "$apk" | tail -n 8
          grep -Fq 'class NovaCutAndroidShellSmokeTest' NexusNovaAndroid/app/src/androidTest/java/com/nexusnova/app/NovaCutAndroidShellSmokeTest.java

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            set +e
            RESULTS="$GITHUB_WORKSPACE/qa/android-emulator-results"
            mkdir -p "$RESULTS"

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            app_install_status=$?
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test_install_status=$?
            if [ "$app_install_status" -ne 0 ] || [ "$test_install_status" -ne 0 ]; then
              echo "Instrumentation setup failed: app=$app_install_status test=$test_install_status" | tee "$RESULTS/setup-status.txt"
              adb logcat -d -v threadtime > "$RESULTS/logcat.txt" 2>&1 || true
              exit 1
            fi

            test -s "$GITHUB_WORKSPACE/qa/fixtures/video-studio-video-qa.webm"
            timeout --signal=TERM --kill-after=10s 150s adb shell am instrument -w -r -e class com.nexusnova.app.NovaCutAndroidShellSmokeTest#androidShellLaunchesAndNativeVideoPickerOpens com.nexusnova.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RESULTS/instrumentation.txt"
            instrumentation_status=${PIPESTATUS[0]}
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_STATUS_CODE: -2|Tests run: [0-9]+, Failures: [1-9]' "$RESULTS/instrumentation.txt"; then
              instrumentation_status=1
            fi
            if ! grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$RESULTS/instrumentation.txt"; then
              instrumentation_status=1
            fi
            echo "$instrumentation_status" > "$RESULTS/instrumentation-exit-code.txt"

            adb logcat -d -v threadtime > "$RESULTS/logcat.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$RESULTS/activity.txt" 2>&1 || true
            adb shell dumpsys window > "$RESULTS/window.txt" 2>&1 || true
            adb shell getprop > "$RESULTS/device-properties.txt" 2>&1 || true
            adb shell ls -la /sdcard/Android/data/com.nexusnova.app.novacutqa/files/Pictures/ > "$RESULTS/pictures-directory.txt" 2>&1 || true
            adb pull /sdcard/Android/data/com.nexusnova.app.novacutqa/files/Pictures "$RESULTS/" > "$RESULTS/pictures-pull.txt" 2>&1 || true

            if [ "$instrumentation_status" -ne 0 ]; then
              echo "Android instrumentation failed (exit $instrumentation_status). Captured logs under $RESULTS."
            fi
            exit "$instrumentation_status"


      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn
 | tee "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          test -s "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          : > "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          while IFS= read -r dex; do
            unzip -p "$apk" "$dex" | strings >> "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          done < "$RUNNER_TEMP/novacut-test-dex-entries.txt"
          grep -E 'NovaCutAndroidShellSmokeTest|androidShellLaunchesAndNativeVideoPickerOpens' "$RUNNER_TEMP/novacut-test-dex-strings.txt"
          unzip -l "$apk" | tail -n 8
          grep -Fq 'class NovaCutAndroidShellSmokeTest' NexusNovaAndroid/app/src/androidTest/java/com/nexusnova/app/NovaCutAndroidShellSmokeTest.java

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            set +e
            RESULTS="$GITHUB_WORKSPACE/qa/android-emulator-results"
            mkdir -p "$RESULTS"

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            app_install_status=$?
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test_install_status=$?
            if [ "$app_install_status" -ne 0 ] || [ "$test_install_status" -ne 0 ]; then
              echo "Instrumentation setup failed: app=$app_install_status test=$test_install_status" | tee "$RESULTS/setup-status.txt"
              adb logcat -d -v threadtime > "$RESULTS/logcat.txt" 2>&1 || true
              exit 1
            fi

            test -s "$GITHUB_WORKSPACE/qa/fixtures/video-studio-video-qa.webm"
            timeout --signal=TERM --kill-after=10s 150s adb shell am instrument -w -r -e class com.nexusnova.app.NovaCutAndroidShellSmokeTest#androidShellLaunchesAndNativeVideoPickerOpens com.nexusnova.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RESULTS/instrumentation.txt"
            instrumentation_status=${PIPESTATUS[0]}
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_STATUS_CODE: -2|Tests run: [0-9]+, Failures: [1-9]' "$RESULTS/instrumentation.txt"; then
              instrumentation_status=1
            fi
            if ! grep -Eq 'OK \(1 test\)|OK \(1 tests\)' "$RESULTS/instrumentation.txt"; then
              instrumentation_status=1
            fi
            echo "$instrumentation_status" > "$RESULTS/instrumentation-exit-code.txt"

            adb logcat -d -v threadtime > "$RESULTS/logcat.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$RESULTS/activity.txt" 2>&1 || true
            adb shell dumpsys window > "$RESULTS/window.txt" 2>&1 || true
            adb shell getprop > "$RESULTS/device-properties.txt" 2>&1 || true
            adb shell ls -la /sdcard/Android/data/com.nexusnova.app.novacutqa/files/Pictures/ > "$RESULTS/pictures-directory.txt" 2>&1 || true
            adb pull /sdcard/Android/data/com.nexusnova.app.novacutqa/files/Pictures "$RESULTS/" > "$RESULTS/pictures-pull.txt" 2>&1 || true

            if [ "$instrumentation_status" -ne 0 ]; then
              echo "Android instrumentation failed (exit $instrumentation_status). Captured logs under $RESULTS."
            fi
            exit "$instrumentation_status"


      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn
