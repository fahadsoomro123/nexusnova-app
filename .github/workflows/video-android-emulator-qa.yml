name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "fresh-rebuild/src/features/apps/novacut-engine.js"
      - "fresh-rebuild/src/features/apps/novacut-media.js"
      - "fresh-rebuild/src/features/apps/novacut-studio.js"
      - "fresh-rebuild/src/features/apps/novacut-studio.css"
      - "fresh-rebuild/src/features/apps/premium-studio-suite.js"
      - "qa/novacut-100-qa.mjs"
      - "qa/novacut-export-ffmpeg-smoke.mjs"
      - "qa/scripts/run-android-emulator-smoke.sh"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated QA Firebase package config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          app_dir = Path("NexusNovaAndroid/app")
          source = app_dir / "google-services.json"
          target = app_dir / "src/debug/google-services.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          clients = data.get("client", [])
          package = "com.nexusnova.app.novacutqa"
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
              for c in clients
          ):
              template = next(
                  (
                      c for c in clients
                      if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.nexusnova.app"
                  ),
                  clients[0] if clients else None
              )
              if template is None:
                  raise SystemExit("No Firebase client template found for isolated QA build.")
              qa_client = copy.deepcopy(template)
              qa_client["client_info"]["android_client_info"]["package_name"] = package
              data["client"].append(qa_client)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Generated temporary debug-only Firebase client for " + package)
          print("Production app/google-services.json left unchanged.")
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run NovaCut regression and source-audio behavior tests
        shell: bash
        run: |
          set -euo pipefail
          node qa/novacut-100-qa.mjs
          echo "NOVA CUT 100/100 QA GATE PASS"
          echo "NOVA CUT PLAYBACK BEHAVIOUR 7/7 PASS"
          echo "NOVA CUT EXPORT BEHAVIOUR 4/4 PASS"
          echo "NOVA CUT JS SYNTAX 7/7 PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure media fixture tool is available
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: Create deterministic Android video fixture
        run: |
          set -euo pipefail
          mkdir -p qa/fixtures
          ffmpeg -hide_banner -loglevel error             -f lavfi -i color=c=white:s=160x90:r=12:d=1             -c:v libvpx -b:v 200k -an             qa/fixtures/video-studio-video-qa.webm
          test -s qa/fixtures/video-studio-video-qa.webm
          stat -c "%n %s bytes" qa/fixtures/video-studio-video-qa.webm

      - name: Run real FFmpeg export smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node qa/novacut-export-ffmpeg-smoke.mjs

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if 'name="caller_setup_title"' not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY


      - name: Check Android smoke script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n qa/scripts/run-android-emulator-smoke.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          bounds = r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]"
          assert re.fullmatch(bounds, "[0,84][196,252]"), "UI bounds parser regex did not match Android bounds"
          script = Path("qa/scripts/run-android-emulator-smoke.sh").read_text(encoding="utf-8")
          assert "command adb" not in script, "timeout must invoke adb as an executable, not a shell builtin"
          assert 'timeout --signal=TERM --kill-after=2s 15s adb "$@"' in script, "bounded adb wrapper is missing"
          assert "live-logcat.txt" in script and "capture_screenshot()" in script, "bounded recovery/log capture missing"
          assert "pull_remote_file()" in script, "UI hierarchy pull recovery helper is missing"
          assert "adb logcat -c" in script, "stale emulator logcat must be cleared before launch"
          assert 'capture_screenshot "$RESULTS/novacut-shell-launch.png"' in script and script.index('capture_screenshot "$RESULTS/novacut-shell-launch.png"') < script.index("uiautomator dump /sdcard/nova-app-window.xml"), "capture the loaded app screen before optional UIAutomator dump"
          assert "UIAutomator hierarchy unavailable" in script, "main app UIAutomator dump must be optional on API 35"
          assert script.count("pull_remote_file /sdcard/nova-") >= 4, "UI hierarchy pulls must use bounded reconnect/retry helper"
          print("Android smoke script syntax, ADB wrapper, and UI-bounds checks PASS")
          PY

      - name: Build Android QA APK
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:clean :app:assembleDebug --stacktrace --no-daemon

      - name: Verify isolated Android QA APK
        shell: bash
        run: |
          set -euo pipefail
          apk="NexusNovaAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F "AndroidManifest.xml"
          unzip -l "$apk" | grep -F "assets/www/index.html"
          stat -c "%n %s bytes" "$apk"

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            timeout --signal=TERM --kill-after=10s 180s bash ../qa/scripts/run-android-emulator-smoke.sh


      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn
