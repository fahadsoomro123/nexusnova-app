name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if 'name="caller_setup_title"' not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY


      - name: Build app and Android test APKs
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: |
            set -u
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb uninstall com.nexusnova.app || true
            adb uninstall com.nexusnova.app.test || true

            mkdir -p "$GITHUB_WORKSPACE/qa/android-emulator-results"
            runner_output="$GITHUB_WORKSPACE/qa/android-emulator-results/connected-test.txt"

            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.nexusnova.app.VideoStudioEmulatorQaTest \
              --stacktrace > "$runner_output" 2>&1
            status=$?
            set -e

            cat "$runner_output"
            cp -R app/build/outputs/androidTest-results "$GITHUB_WORKSPACE/qa/android-emulator-results/" || true
            cp -R app/build/outputs/logs "$GITHUB_WORKSPACE/qa/android-emulator-results/" || true
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/qa/android-emulator-results/logcat.txt" || true

            if [ "$status" -ne 0 ]; then
              echo "Connected Android test task failed with exit code $status"
              exit "$status"
            fi

            result_xml_count=$(find app/build/outputs/androidTest-results -type f -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$result_xml_count" -lt 1 ]; then
              echo "No Android instrumentation result XML was produced."
              exit 1
            fi

            completed_tests=$(grep -Roh 'tests="[0-9]*"' app/build/outputs/androidTest-results 2>/dev/null | sed 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')
            failures=$(grep -Roh 'failures="[0-9]*"' app/build/outputs/androidTest-results 2>/dev/null | sed 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')
            errors=$(grep -Roh 'errors="[0-9]*"' app/build/outputs/androidTest-results 2>/dev/null | sed 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')

            echo "RESULTS: tests=$completed_tests failures=$failures errors=$errors"

            if [ "$completed_tests" -ne 15 ] || [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then
              echo "Expected exactly 15 passing tests."
              exit 1
            fi

            echo "15/15 Video Studio emulator tests PASS."


      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn
