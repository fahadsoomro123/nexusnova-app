name: Video Android Emulator QA

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-rebuild/src/features/apps/ai-video-studio-flagship.js"
      - "NexusNovaAndroid/app/**"
      - ".github/workflows/video-android-emulator-qa.yml"
      - "NexusNovaAndroid/gradle/**"
      - "qa/run_video_android_emulator_qa.sh"

jobs:
  android-emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Apply build-only missing caller strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NexusNovaAndroid/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          additions = '''
              <string name="caller_setup_title">Caller ID</string>
              <string name="caller_setup_body">Enable Caller ID to use the Android call-screening feature.</string>
              <string name="enable_caller_id">ENABLE CALLER ID</string>
          '''
          if 'name="caller_setup_title"' not in text:
              text = text.replace("</resources>", additions + "\n</resources>")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Build app and Android test APKs
        run: |
          set -euo pipefail
          gradle -p NexusNovaAndroid :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: nexusnova-video-avd-api35

      - name: Prepare KVM when available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo "KVM available"
          else
            echo "KVM unavailable; emulator runner will use software acceleration"
          fi

      - name: Run real Android emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: NexusNovaAndroid
          script: bash "$GITHUB_WORKSPACE/qa/run_video_android_emulator_qa.sh"

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-android-emulator-evidence
          path: qa/android-emulator-results/
          if-no-files-found: warn

      - name: Prepare signed OTA12 bootstrap APK
        if: always()
        shell: bash
        working-directory: NexusNovaAndroid
        env:
          KEYSTORE_B64: ${{ secrets.NEXUSNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXUSNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUSNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUSNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/nexusnova-release.jks
          keytool -list -keystore app/nexusnova-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          grep -Fq 'allowContentAccess = true' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'ACTION_OPEN_DOCUMENT' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'FLAG_GRANT_READ_URI_PERMISSION' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'acceptedExtensionMatches' app/src/main/java/com/nexusnova/app/MainActivity.kt
          grep -Fq 'const val BUNDLED_WEB_BASE = "28ad58de566e42621dad6198aa01be885ccc9769"' app/src/main/java/com/nexusnova/app/NexusOtaWebManager.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s*=\s*\d+','versionCode = 27091224',s,count=1)
          s,n2=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "1.0.24-ota12-native-fix-bootstrap"',s,count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('version anchors missing')
          signing='''    signingConfigs {
          create("ota12Bootstrap") {
              storeFile = file("nexusnova-release.jks")
              storePassword = System.getenv("KEYSTORE_PASSWORD")
              keyAlias = System.getenv("KEY_ALIAS")
              keyPassword = System.getenv("KEY_PASSWORD")
          }
      }

      '''
          if 'create("ota12Bootstrap")' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig = signingConfigs.getByName("ota12Bootstrap")' not in s:
              s=s.replace('        release {\n','        release {\n            signingConfig = signingConfigs.getByName("ota12Bootstrap")\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          gradle --no-daemon clean assembleRelease

      - name: Verify signed OTA12 bootstrap APK
        if: always()
        shell: bash
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          badging="$("$AAPT" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "name='com.nexusnova.app'"
          echo "$badging" | grep -q "versionCode='27091224'"
          echo "$badging" | grep -q "versionName='1.0.24-ota12-native-fix-bootstrap'"
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          unzip -q "$apk" 'assets/www/index.html' 'assets/www/src/features/apps/ai-video-studio-flagship.js' -d "$d"
          grep -Fq 'OTA12 • ACTIVE' "$d/assets/www/index.html"
          grep -Fq 'nx-video-file-input' "$d/assets/www/src/features/apps/ai-video-studio-flagship.js"

      - name: Upload signed OTA12 bootstrap APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-v1.0.24-OTA12-NATIVE-FIX-BOOTSTRAP
          path: NexusNovaAndroid/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
