name: Video Android Integration QA
on:
  push:
    branches:
      - agent/video-flagship-complete-20260921
concurrency:
  group: video-android-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android build and tests
        working-directory: NexusNovaAndroid
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :tracker:assembleDebug
          gradle --no-daemon test
          echo "ANDROID VIDEO CANDIDATE INTEGRATION PASS"
