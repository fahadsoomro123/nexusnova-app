name: Video Flagship Candidate QA
on:
  workflow_dispatch:
  push:
    branches:
      - agent/video-flagship-complete-20260921
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare fixtures
        run: |
          set -euo pipefail
          mkdir -p fixtures
          python3 - <<'PY'
import base64
png=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
open('fixtures/tiny.png','wb').write(png)
PY
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=red:s=320x180:r=24 -t 1 -c:v libvpx -b:v 400k fixtures/sample.webm
      - name: Syntax and module import
        run: |
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --input-type=module -e "import('./fresh-rebuild/src/features/apps/ai-video-studio-flagship.js').then(m=>{if(typeof m.renderAiVideoStudio!=='function'||typeof m.__videoFlagshipTestUtils!=='object')process.exit(2)})"
      - name: Serve fresh rebuild
        run: |
          python3 -m http.server 4173 --directory fresh-rebuild >/tmp/video-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/video-runtime-harness.html >/dev/null 2>&1 && exit 0; sleep 1; done
          cat /tmp/video-http.log
          exit 1
      - name: Run browser runtime QA
        run: node .github/scripts/video-flagship-runtime.mjs