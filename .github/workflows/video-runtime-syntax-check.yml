name: Video Runtime Syntax Check
on:
  push:
    branches:
      - agent/video-flagship-complete-20260921

concurrency:
  group: video-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and module contract
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/premium-studio-suite.js
          node --input-type=module -e "import('./fresh-rebuild/src/features/apps/ai-video-studio-flagship.js').then(m=>{if(typeof m.renderAiVideoStudio!=='function'||typeof m.__videoFlagshipTestUtils!=='object')process.exit(2);console.log('FLAGSHIP MODULE IMPORT PASS')})"
      - name: Install Playwright for candidate runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate deterministic browser WebM fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gstreamer1.0-tools gstreamer1.0-plugins-good
          mkdir -p fresh-rebuild/fixtures
          gst-launch-1.0 -q             videotestsrc num-buffers=30 pattern=ball !             video/x-raw,width=160,height=90,framerate=15/1 !             videoconvert ! vp8enc ! webmmux !             filesink location=fresh-rebuild/fixtures/generated.webm
          test -s fresh-rebuild/fixtures/generated.webm

      - name: Serve candidate harness
        run: |
          python3 -m http.server 4173 --directory fresh-rebuild >/tmp/video-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/video-runtime-harness.html >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/video-http.log
          exit 1
      - name: Run candidate browser runtime QA
        run: node .github/scripts/video-flagship-runtime.mjs
      - name: Upload browser QA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Video-Browser-QA-Proof
          path: artifacts/video-browser
          if-no-files-found: warn
          retention-days: 7
      - name: Candidate QA marker
        run: echo "VIDEO FLAGSHIP CANDIDATE QA PASS"
