name: Video Runtime Syntax Check
on:
  push:
    branches:
      - main
      - agent/video-flagship-complete-20260921
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and module contract
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/ai-video-studio-flagship.js
          node --check fresh-rebuild/src/features/apps/app-screen.js
          node --check fresh-rebuild/src/features/apps/premium-studio-suite.js
          node --input-type=module -e "import('./fresh-rebuild/src/features/apps/ai-video-studio-flagship.js').then(m=>{if(typeof m.renderAiVideoStudio!=='function'||typeof m.__videoFlagshipTestUtils!=='object')process.exit(2);console.log('FLAGSHIP MODULE IMPORT PASS')})"
      - name: Install Playwright for candidate runtime
        if: github.ref == 'refs/heads/agent/video-flagship-complete-20260921'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare candidate media fixtures
        if: github.ref == 'refs/heads/agent/video-flagship-complete-20260921'
        run: |
          set -euo pipefail
          mkdir -p fixtures
          python3 - <<'PY'
import base64
png=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
open('fixtures/tiny.png','wb').write(png)
PY
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=red:s=320x180:r=24 -t 1 -c:v libvpx -b:v 400k fixtures/sample.webm
      - name: Serve candidate harness
        if: github.ref == 'refs/heads/agent/video-flagship-complete-20260921'
        run: |
          python3 -m http.server 4173 --directory fresh-rebuild >/tmp/video-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/video-runtime-harness.html >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/video-http.log
          exit 1
      - name: Run candidate browser runtime QA
        if: github.ref == 'refs/heads/agent/video-flagship-complete-20260921'
        run: node .github/scripts/video-flagship-runtime.mjs
      - name: Candidate QA marker
        if: github.ref == 'refs/heads/agent/video-flagship-complete-20260921'
        run: echo "VIDEO FLAGSHIP CANDIDATE QA PASS"
