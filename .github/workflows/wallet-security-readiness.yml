name: NexusNova Wallet Security Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'js/wallet-connect-fix-v2.js'
      - 'js/wallet-onchain-sync-v3.js'
      - 'js/wallet-actions-v2.js'
      - '.github/scripts/wallet-security-readiness.py'
      - '.github/workflows/wallet-security-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate wallet financial security contract
        run: python3 .github/scripts/wallet-security-readiness.py

      - name: Check wallet JavaScript syntax
        run: |
          node --check js/wallet-connect-fix-v2.js
          node --check js/wallet-onchain-sync-v3.js
          node --check js/wallet-actions-v2.js
