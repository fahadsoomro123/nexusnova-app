name: NexusNova Travel Phone Layout V12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-phone-layout-v12.yml'
      - 'fresh-rebuild/index.html'
      - 'fresh-rebuild/travel-flagship-v16-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-phone-layout-v12.js'
      - 'fresh-rebuild/src/features/apps/travel-flagship-runtime-v8.js'
      - 'fresh-rebuild/src/features/apps/travel-inline-layout-v11.js'
      - 'fresh-rebuild/src/features/apps/travel-integrations.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static v12 contract
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v12.js
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('fresh-rebuild/index.html','utf8');
          const harness=fs.readFileSync('fresh-rebuild/travel-flagship-v16-harness.html','utf8');
          const v12=fs.readFileSync('fresh-rebuild/src/features/apps/travel-phone-layout-v12.js','utf8');
          for(const host of [index,harness]) if(!host.includes('travel-phone-layout-v12.js')) throw new Error('v12 loader missing');
          for(const needle of [
            "const LEGACY_STYLE_ID = 'nn-travel-host-guard-v8'",
            'bottom:4px!important',
            'top:0!important;bottom:0!important',
            '.nn-route-editor-v8{display:none!important}',
            'overflow-y:auto!important',
            'legacy.textContent = SAFE_HOST_CSS'
          ]) if(!v12.includes(needle)) throw new Error(`Missing v12 contract: ${needle}`);
          console.log('Static v12 contract PASS');
          NODE
      - name: Install browser and server
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          nohup npx http-server fresh-rebuild -p 4173 -c-1 >/tmp/travel-v12-http.log 2>&1 &
          sleep 2
      - name: Physical-shape browser regression
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const profiles=[
            {w:360,h:800,bottom:48,name:'small-3button'},
            {w:390,h:844,bottom:24,name:'reference-gesture'},
            {w:412,h:915,bottom:32,name:'punchhole'}
          ];
          const rect=async l=>l.evaluate(el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}});
          const visible=async l=>l.evaluate(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1&&r.bottom>0&&r.top<innerHeight});
          const hit=async l=>l.evaluate(el=>{const r=el.getBoundingClientRect();const x=Math.max(0,Math.min(innerWidth-1,r.left+r.width/2));const y=Math.max(0,Math.min(innerHeight-1,r.top+r.height/2));const t=document.elementFromPoint(x,y);return Boolean(t&&(t===el||el.contains(t)))});
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const p of profiles){
              const page=await browser.newPage({viewport:{width:p.w,height:p.h}});
              await page.goto(`http://127.0.0.1:4173/travel-flagship-v16-harness.html?bottom=${p.bottom}&dock=62`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.nn-travel-v19[data-flagship-runtime-v8="true"]',{timeout:15000});
              await page.waitForTimeout(700);
              const root=page.locator('.nn-travel-v19');
              const dock=page.locator('#nx-app>.nx-dock');
              const frame=page.locator('.nn-travel-frame');
              const card=page.locator('.nn-search-card');
              const [rr,dr,fr]=await Promise.all([rect(root),rect(dock),rect(frame)]);
              assert(Math.abs(rr.top)<=1,`${p.name}: double top inset ${rr.top}`);
              assert(Math.abs((p.h-dr.bottom)-4)<=2,`${p.name}: dock too high bottomGap=${p.h-dr.bottom}`);
              assert(dr.top-fr.bottom>=3&&dr.top-fr.bottom<=14,`${p.name}: frame/dock gap ${dr.top-fr.bottom}`);
              assert(['auto','scroll'].includes(await card.evaluate(el=>getComputedStyle(el).overflowY)),`${p.name}: card not internally scrollable`);
              const legacy=page.locator('#nn-travel-host-guard-v8');
              assert((await legacy.getAttribute('data-phone-layout-v12'))==='true',`${p.name}: legacy host style not neutralized`);
              await page.screenshot({path:`travel-v12-${p.name}-normal.png`});

              const input=page.locator('[data-flight-origin]');
              await input.click();
              await page.setViewportSize({width:p.w,height:Math.max(480,Math.round(p.h*.62))});
              await page.waitForTimeout(220);
              await input.fill('KARACHI');
              await page.waitForTimeout(100);
              assert(await visible(input)&&await hit(input),`${p.name}: route input hidden/covered`);
              assert((await input.inputValue())==='KARACHI',`${p.name}: route typing failed`);
              assert(await input.evaluate(el=>Boolean(el.closest('.nn-search-card'))),`${p.name}: route left original card`);
              assert(await visible(page.locator('.nn-travel-head')),`${p.name}: header hidden while editing`);
              assert(await visible(page.locator('.nn-tab-dock')),`${p.name}: tabs hidden while editing`);
              assert(await visible(page.locator('.nn-hero')),`${p.name}: hero hidden while editing`);
              assert((await dock.evaluate(el=>getComputedStyle(el).display))==='none',`${p.name}: dock not hidden during edit`);
              assert((await page.locator('.nn-route-editor-v8').count())===0,`${p.name}: fullscreen editor returned`);
              await page.screenshot({path:`travel-v12-${p.name}-edit.png`});
              await page.close();
            }
            await browser.close();
            console.log('Travel phone layout v12 PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-phone-layout-v12-evidence
          path: travel-v12-*.png
          if-no-files-found: ignore
