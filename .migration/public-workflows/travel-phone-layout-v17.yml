name: NexusNova Travel Phone Layout V30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-phone-layout-v17.yml'
      - 'fresh-rebuild/travel-flagship-v16-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-phone-layout-v30.js'
      - 'fresh-rebuild/src/features/apps/travel-exit-isolation-v10.js'
      - 'fresh-rebuild/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-layout-v30:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static v30 contract
        run: |
          set -euo pipefail
          node --check fresh-rebuild/src/features/apps/travel-phone-layout-v30.js
          node --check fresh-rebuild/src/features/apps/travel-exit-isolation-v10.js
          node <<'NODE'
          const fs=require('fs');
          const v30=fs.readFileSync('fresh-rebuild/src/features/apps/travel-phone-layout-v30.js','utf8');
          const exit=fs.readFileSync('fresh-rebuild/src/features/apps/travel-exit-isolation-v10.js','utf8');
          for(const n of ['dockRect.top - 10','--nn-v30-frame-height','nn-travel-v30-active','phoneLayoutV30','display:grid!important']) if(!v30.includes(n)) throw new Error(`Missing v30 contract: ${n}`);
          if(v30.includes('v17NormalBottom')) throw new Error('v30 reintroduced cached dock-top geometry');
          if(!exit.includes("import './travel-phone-layout-v30.js'")) throw new Error('v30 is not loaded by Travel exit isolation');
          console.log('Static v30 contract PASS');
          NODE

      - name: Install browser and server
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          nohup npx http-server fresh-rebuild -p 4173 -c-1 >/tmp/travel-v30-http.log 2>&1 &
          sleep 2

      - name: Physical WebView short-innerHeight regression
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const profiles=[
            {w:360,h:800,name:'small'},
            {w:390,h:844,name:'reference'},
            {w:412,h:915,name:'tall'}
          ];
          const rect=async l=>l.evaluate(el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,width:r.width,height:r.height}});
          const visible=async l=>l.evaluate(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el),vh=window.__realViewportHeight||document.documentElement.clientHeight;return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1&&r.bottom>0&&r.top<vh});
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const failures=[];
            for(const p of profiles){
              const page=await browser.newPage({viewport:{width:p.w,height:p.h}});
              await page.addInitScript(()=>{
                const realInnerHeight=window.innerHeight;
                window.__realViewportHeight=realInnerHeight;
                window.__reportedInnerHeight=Math.max(420,realInnerHeight-155);
                try{Object.defineProperty(window,'innerHeight',{configurable:true,get(){return window.__reportedInnerHeight}})}catch{}
                const listeners={resize:new Set(),scroll:new Set()};
                const vv={height:realInnerHeight,offsetTop:0,width:innerWidth,offsetLeft:0,scale:1,
                  addEventListener(type,fn){listeners[type]?.add(fn)},removeEventListener(type,fn){listeners[type]?.delete(fn)},
                  __setHeight(value){this.height=Math.max(1,Number(value)||1);for(const fn of listeners.resize)try{fn(new Event('resize'))}catch{}},
                  __setOffsetTop(value){this.offsetTop=Math.max(0,Number(value)||0);for(const fn of listeners.scroll)try{fn(new Event('scroll'))}catch{}}};
                Object.defineProperty(window,'visualViewport',{configurable:true,value:vv});
              });
              await page.goto('http://127.0.0.1:4173/travel-flagship-v16-harness.html?bottom=4&dock=62',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.nn-travel-v19[data-phone-layout-v30="true"]',{timeout:15000});
              await page.waitForTimeout(1500);
              const root=page.locator('.nn-travel-v19');
              const dock=page.locator('#nx-app>.nx-dock');
              const panel=page.locator('.nn-flight-panel:not([hidden])');
              const card=page.locator('.nn-search-card');
              const search=page.locator('[data-flight-search]');
              const trust=page.locator('.nn-trust');
              const [dr,pr,cr]=await Promise.all([rect(dock),rect(panel),rect(card)]);
              const state=await page.evaluate(()=>({reported:window.innerHeight,real:window.__realViewportHeight}));
              const normal={
                reportedInnerHeight:state.reported,
                realViewportHeight:state.real,
                dockTop:dr.top,
                cardGap:Math.round((dr.top-cr.bottom)*10)/10,
                panelGap:Math.round((dr.top-pr.bottom)*10)/10,
                searchVisible:await visible(search),
                trustVisible:await visible(trust),
                keyboard:await page.locator('html').evaluate(el=>el.classList.contains('nn-travel-v30-keyboard')?'true':'false'),
                targetBottom:await root.getAttribute('data-v30-target-bottom')
              };
              console.log(`${p.name} NORMAL ${JSON.stringify(normal)}`);
              if(!(state.reported<dr.top-80)) failures.push(`${p.name}: short-innerHeight scenario not reproduced`);
              if(normal.keyboard!=='false') failures.push(`${p.name}: false keyboard detected`);
              if(!(normal.cardGap>=4&&normal.cardGap<=24)) failures.push(`${p.name}: card-to-dock gap ${normal.cardGap}`);
              if(!(normal.panelGap>=4&&normal.panelGap<=24)) failures.push(`${p.name}: panel-to-dock gap ${normal.panelGap}`);
              if(!normal.searchVisible) failures.push(`${p.name}: Search Flights hidden`);
              if(!normal.trustVisible) failures.push(`${p.name}: trust footer hidden`);
              await page.screenshot({path:`travel-v30-${p.name}-normal.png`,fullPage:false});

              const input=page.locator('[data-flight-origin]');
              await input.click();
              await page.evaluate(()=>window.visualViewport.__setHeight(Math.max(410,window.__realViewportHeight-330)));
              await page.waitForTimeout(700);
              await input.fill('KARACHI');
              await page.waitForTimeout(300);
              const edit={
                value:await input.inputValue(),
                inputVisible:await visible(input),
                headVisible:await visible(page.locator('.nn-travel-head')),
                tabsVisible:await visible(page.locator('.nn-tab-dock')),
                heroVisible:await visible(page.locator('.nn-hero')),
                insideCard:await input.evaluate(el=>Boolean(el.closest('.nn-search-card'))),
                editorCount:await page.locator('.nn-route-editor-v8').count(),
                dockDisplay:await dock.evaluate(el=>getComputedStyle(el).display),
                keyboard:await page.locator('html').evaluate(el=>el.classList.contains('nn-travel-v30-keyboard')?'true':'false')
              };
              console.log(`${p.name} EDIT ${JSON.stringify(edit)}`);
              if(edit.value!=='KARACHI') failures.push(`${p.name}: route typing failed`);
              if(!edit.inputVisible||!edit.insideCard) failures.push(`${p.name}: route left original box`);
              if(!edit.headVisible||!edit.tabsVisible||!edit.heroVisible) failures.push(`${p.name}: Travel shell collapsed during edit`);
              if(edit.editorCount!==0) failures.push(`${p.name}: fullscreen editor returned`);
              if(edit.dockDisplay!=='none') failures.push(`${p.name}: dock visible during route edit`);
              if(edit.keyboard!=='true') failures.push(`${p.name}: keyboard not detected`);
              await page.screenshot({path:`travel-v30-${p.name}-edit.png`,fullPage:false});
              await page.close();
            }
            await browser.close();
            if(failures.length){console.error(`V30 FAILURES\n${failures.join('\n')}`);process.exit(1)}
            console.log('Travel v30 physical WebView regression PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-phone-layout-v30-evidence
          path: travel-v30-*.png
          if-no-files-found: ignore
