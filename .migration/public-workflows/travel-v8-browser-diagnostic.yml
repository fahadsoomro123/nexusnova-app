name: NexusNova Travel V8 Browser Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-v8-browser-diagnostic.yml'
      - 'fresh-rebuild/travel-flagship-v16-harness.html'
      - 'fresh-rebuild/src/features/apps/travel-flagship-runtime-v8.js'
      - 'fresh-rebuild/src/features/apps/travel-suite.js'
      - 'fresh-rebuild/src/features/apps/travel-integrations.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 http-server@14.1.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          nohup npx http-server fresh-rebuild -p 4173 -c-1 >/tmp/travel-http.log 2>&1 &
          sleep 2
      - name: Diagnose module and mount chain
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; const logs=[]; const failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`));
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const response=await page.goto('http://127.0.0.1:4173/travel-flagship-v16-harness.html?bottom=24&dock=62',{waitUntil:'networkidle',timeout:30000});
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>({
              status:document.readyState,
              rootCount:document.querySelectorAll('.nn-travel-v19').length,
              runtimeScript:Boolean(document.querySelector('style#nn-travel-flagship-runtime-v8')),
              runtimeBound:document.querySelector('.nn-travel-v19')?.dataset.flagshipRuntimeV8||null,
              bodyText:document.body.innerText.slice(0,500),
              htmlClass:document.documentElement.className
            }));
            console.log('HTTP',response?.status());
            console.log('STATE',JSON.stringify(state));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            console.log('REQUEST_FAILED',JSON.stringify(failed));
            console.log('CONSOLE',JSON.stringify(logs));
            await page.screenshot({path:'travel-v8-diagnostic.png',fullPage:true});
            await browser.close();
            if(errors.length||failed.length||state.rootCount!==1||state.runtimeBound!=='true') process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: travel-v8-browser-diagnostic
          path: travel-v8-diagnostic.png
          if-no-files-found: ignore
