name: Travel V8 Runtime Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-v8-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Travel result text QA selector deterministic
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/travel-public-flagship-qa.yml';
          let s = fs.readFileSync(path, 'utf8');
          const from = "first.locator('strong').evaluate(el=>parseFloat(getComputedStyle(el).fontSize))";
          const to = "first.locator('strong').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize))";
          if (!s.includes(from)) throw new Error('Travel result text QA selector contract missing');
          s = s.replace(from, to);
          fs.writeFileSync(path, s);
          NODE

          grep -Fq "first.locator('strong').first().evaluate" .github/workflows/travel-public-flagship-qa.yml
          ! grep -Fq "first.locator('strong').evaluate" .github/workflows/travel-public-flagship-qa.yml
          git diff --check

          git config user.name 'NexusNova Travel Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/travel-public-flagship-qa.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m 'travel: make result text QA selector deterministic'
          git pull --rebase origin main
          git push origin HEAD:main
