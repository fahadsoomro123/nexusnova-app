<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <title>NexusNova Fresh</title>
  <link rel="stylesheet" href="./assets/styles/tokens.css">
  <link rel="stylesheet" href="./assets/styles/app.css">
</head>
<body>
  <div id="nx-app" class="nx-app" aria-live="polite">
    <main id="nx-stage" class="nx-stage" tabindex="-1"></main>
    <nav class="nx-dock" aria-label="Primary navigation">
      <button class="nx-dock__item" type="button" data-route="mine" aria-label="Open Mine"></button>
      <button class="nx-dock__item" type="button" data-route="hub" aria-label="Open Nova Hub"></button>
    </nav>
  </div>
  <noscript>NexusNova requires JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
