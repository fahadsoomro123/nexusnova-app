<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaCut Section 2 Live Preview</title>
<style>
/* NovaCut Elite Fluid Mobile Editor */
.nx-novacut-host,
.nx-novacut-host * { box-sizing: border-box; }

.nx-novacut-host {
  min-height: 0 !important;
  width: 100% !important;
}

.nx-novacut {
  --nc-bg: #050507;
  --nc-panel: rgba(24,24,29,.94);
  --nc-panel-soft: rgba(255,255,255,.055);
  --nc-panel-strong: rgba(255,255,255,.09);
  --nc-line: rgba(255,255,255,.10);
  --nc-line-strong: rgba(255,255,255,.16);
  --nc-text: #f7f7fa;
  --nc-muted: #858590;
  --nc-blue: #63b9ff;
  --nc-green: #63f1bd;

  position: relative !important;
  display: grid !important;
  grid-template-rows: auto minmax(300px, 1fr) minmax(220px, 38vh) auto !important;
  width: 100% !important;
  min-height: min(780px, calc(100dvh - 170px)) !important;
  height: 100% !important;
  overflow: hidden !important;
  color: var(--nc-text) !important;
  background:
    radial-gradient(circle at 50% -15%, rgba(99,185,255,.11), transparent 34%),
    linear-gradient(180deg, #0a0a0d 0%, #050507 64%, #030304 100%) !important;
  border: 1px solid rgba(255,255,255,.09) !important;
  border-radius: 28px !important;
  box-shadow:
    0 30px 90px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.05) !important;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
}

.nx-novacut__header {
  display: grid !important;
  grid-template-columns: minmax(0,1fr) auto !important;
  align-items: center !important;
  gap: 14px !important;
  min-height: 68px !important;
  padding: 10px 12px !important;
  background: linear-gradient(180deg, rgba(28,28,34,.98), rgba(16,16,20,.96)) !important;
  border-bottom: 1px solid var(--nc-line) !important;
}

.nx-novacut__project {
  min-width: 0 !important;
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
}

.nx-novacut__brand-mark {
  width: 38px !important;
  height: 38px !important;
  display: grid !important;
  place-items: center !important;
  border-radius: 12px !important;
  background: linear-gradient(145deg, #1f242c, #101114) !important;
  border: 1px solid var(--nc-line-strong) !important;
  color: #fff !important;
  font-size: 15px !important;
  font-weight: 950 !important;
  letter-spacing: -.04em !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08) !important;
}

.nx-novacut__eyebrow {
  display: block !important;
  margin: 0 0 2px !important;
  color: var(--nc-muted) !important;
  font-size: 7px !important;
  line-height: 1 !important;
  font-weight: 900 !important;
  letter-spacing: .18em !important;
  text-transform: uppercase !important;
}

.nx-novacut__project strong,
.nx-novacut__timeline-head strong {
  display: block !important;
  font-size: 15px !important;
  line-height: 1.05 !important;
  font-weight: 900 !important;
  letter-spacing: -.02em !important;
}

.nx-novacut__top-actions {
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
}

.nx-novacut__icon-button,
.nx-novacut__export-button {
  border: 1px solid var(--nc-line) !important;
  background: rgba(255,255,255,.035) !important;
  color: #efeff4 !important;
  border-radius: 12px !important;
}

.nx-novacut__icon-button {
  width: 38px !important;
  height: 38px !important;
  display: grid !important;
  place-items: center !important;
  padding: 0 !important;
}

.nx-novacut__icon-button svg,
.nx-novacut__export-button svg,
.nx-novacut__dock-item svg,
.nx-novacut__add-button svg,
.nx-novacut__media-drop svg,
.nx-novacut__lane-add svg,
.nx-novacut__lane-tool svg,
.nx-novacut__track-icon svg {
  width: 16px !important;
  height: 16px !important;
  display: block !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 1.8 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
}

.nx-novacut__icon-button:active,
.nx-novacut__dock-item:active,
.nx-novacut__add-button:active,
.nx-novacut__media-drop:active,
.nx-novacut__lane-add:active,
.nx-novacut__lane-tool:active {
  transform: scale(.97) !important;
}

.nx-novacut__export-button {
  min-height: 38px !important;
  padding: 0 12px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  color: #dff5ff !important;
  border-color: rgba(99,185,255,.55) !important;
  background: linear-gradient(180deg, rgba(40,73,100,.72), rgba(22,38,53,.72)) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 20px rgba(0,0,0,.24) !important;
  font-size: 10px !important;
  font-weight: 900 !important;
}

.nx-novacut__canvas-area {
  min-height: 0 !important;
  display: grid !important;
  grid-template-rows: minmax(0,1fr) 46px !important;
  background: #030304 !important;
}

.nx-novacut__canvas-shell {
  position: relative !important;
  min-height: 0 !important;
  margin: 12px !important;
  overflow: hidden !important;
  border: 1px solid rgba(255,255,255,.11) !important;
  border-radius: 20px !important;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,255,255,.03), transparent 42%),
    #050507 !important;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.018),
    inset 0 30px 80px rgba(0,0,0,.28) !important;
}

.nx-novacut__canvas {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  background: #050507 !important;
  display: block !important;
}

.nx-novacut__canvas-empty {
  position: absolute !important;
  inset: 0 !important;
  z-index: 2 !important;
  display: grid !important;
  place-items: center !important;
  background: linear-gradient(180deg, rgba(5,5,7,.12), rgba(5,5,7,.42)) !important;
}

.nx-novacut__canvas-empty[hidden] { display: none !important; }

.nx-novacut__media-drop {
  width: min(210px, 72%) !important;
  min-height: 112px !important;
  display: grid !important;
  place-items: center !important;
  align-content: center !important;
  gap: 6px !important;
  padding: 16px !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  border-radius: 18px !important;
  background: rgba(255,255,255,.045) !important;
  color: var(--nc-text) !important;
  backdrop-filter: blur(18px) saturate(120%) !important;
  -webkit-backdrop-filter: blur(18px) saturate(120%) !important;
  box-shadow: 0 18px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06) !important;
}

.nx-novacut__media-drop > span {
  width: 38px !important;
  height: 38px !important;
  display: grid !important;
  place-items: center !important;
  border-radius: 12px !important;
  color: var(--nc-blue) !important;
  background: rgba(99,185,255,.11) !important;
  border: 1px solid rgba(99,185,255,.18) !important;
}

.nx-novacut__media-drop strong {
  font-size: 12px !important;
  font-weight: 900 !important;
}

.nx-novacut__media-drop small {
  color: var(--nc-muted) !important;
  font-size: 8px !important;
  font-weight: 700 !important;
}

.nx-novacut__canvas-overlay {
  position: absolute !important;
  z-index: 3 !important;
  top: 10px !important;
  right: 10px !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  padding: 7px 9px !important;
  border: 1px solid rgba(255,255,255,.11) !important;
  border-radius: 999px !important;
  background: rgba(5,5,7,.72) !important;
  color: #c9c9d1 !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  font-size: 7px !important;
  font-weight: 850 !important;
  letter-spacing: .08em !important;
  text-transform: uppercase !important;
}

.nx-novacut__live-dot {
  width: 6px !important;
  height: 6px !important;
  border-radius: 50% !important;
  background: var(--nc-green) !important;
  box-shadow: 0 0 0 4px rgba(99,241,189,.08) !important;
}

.nx-novacut__transport {
  display: grid !important;
  grid-template-columns: 1fr 44px 1fr !important;
  align-items: center !important;
  gap: 10px !important;
  padding: 0 14px !important;
  color: var(--nc-muted) !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
  font-size: 8px !important;
  font-weight: 800 !important;
  letter-spacing: .04em !important;
}

.nx-novacut__transport > :last-child {
  text-align: right !important;
}

.nx-novacut__play {
  width: 42px !important;
  height: 42px !important;
  display: grid !important;
  place-items: center !important;
  padding: 0 !important;
  border: 1px solid rgba(255,255,255,.14) !important;
  border-radius: 50% !important;
  background: rgba(255,255,255,.07) !important;
  color: #fff !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.28) !important;
}

.nx-novacut__play span,
.nx-novacut__play svg {
  width: 15px !important;
  height: 15px !important;
}

.nx-novacut__play.is-playing {
  border-color: rgba(99,185,255,.55) !important;
  box-shadow: 0 0 0 6px rgba(99,185,255,.06), 0 10px 26px rgba(0,0,0,.28) !important;
}

.nx-novacut__timeline-shell {
  min-height: 0 !important;
  overflow: hidden !important;
  display: grid !important;
  grid-template-rows: 48px minmax(0,1fr) !important;
  background: linear-gradient(180deg, rgba(24,24,29,.92), rgba(13,13,17,.97)) !important;
  border-top: 1px solid var(--nc-line) !important;
}

.nx-novacut__timeline-head {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 10px !important;
  padding: 7px 12px !important;
  border-bottom: 1px solid var(--nc-line) !important;
}

.nx-novacut__timeline-head-actions {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: flex-end !important;
  gap: 6px !important;
}

.nx-novacut__timeline-action {
  width: 32px !important;
  height: 32px !important;
  display: grid !important;
  place-items: center !important;
  padding: 0 !important;
}

.nx-novacut__timeline-action svg {
  width: 14px !important;
  height: 14px !important;
}

.nx-novacut__timeline-action:disabled {
  opacity: .34 !important;
  cursor: not-allowed !important;
  box-shadow: none !important;
}

.nx-novacut__add-button {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  min-height: 32px !important;
  padding: 0 9px !important;
  border: 1px solid var(--nc-line-strong) !important;
  border-radius: 10px !important;
  background: rgba(255,255,255,.045) !important;
  color: #ececf2 !important;
  font-size: 8px !important;
  font-weight: 900 !important;
}

.nx-novacut__timeline {
  position: relative !important;
  min-height: 0 !important;
  overflow: auto !important;
  scroll-behavior: smooth !important;
  scrollbar-width: none !important;
  overscroll-behavior-x: contain !important;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 18%),
    #111116 !important;
}

.nx-novacut__timeline::-webkit-scrollbar { width: 0 !important; height: 0 !important; }

.nx-novacut__ruler,
.nx-novacut__track {
  display: grid !important;
  grid-template-columns: 72px minmax(640px, 1fr) !important;
  min-width: 712px !important;
}

.nx-novacut__ruler {
  min-height: 28px !important;
  border-bottom: 1px solid rgba(255,255,255,.075) !important;
  background: rgba(255,255,255,.018) !important;
}

.nx-novacut__ruler-pad,
.nx-novacut__track-label {
  border-right: 1px solid rgba(255,255,255,.075) !important;
}

.nx-novacut__ticks {
  position: relative !important;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 40px) !important;
}

.nx-novacut__ticks span {
  position: absolute !important;
  top: 9px !important;
  left: calc(var(--i) * 12.5%) !important;
  transform: translateX(-50%) !important;
  color: #676773 !important;
  font-size: 7px !important;
  font-weight: 800 !important;
}

.nx-novacut__track {
  min-height: 62px !important;
  padding: 5px 0 !important;
  border-bottom: 1px solid rgba(255,255,255,.07) !important;
}

.nx-novacut__track:last-of-type { border-bottom: 0 !important; }

.nx-novacut__track-label {
  display: flex !important;
  align-items: center !important;
  gap: 7px !important;
  padding: 0 10px !important;
  color: #a0a0aa !important;
  background: linear-gradient(90deg, rgba(255,255,255,.018), transparent) !important;
}

.nx-novacut__track-index {
  display: grid !important;
  place-items: center !important;
  width: 24px !important;
  height: 24px !important;
  border-radius: 8px !important;
  background: rgba(255,255,255,.04) !important;
  border: 1px solid rgba(255,255,255,.08) !important;
  color: #777782 !important;
  font-size: 7px !important;
  font-weight: 900 !important;
}

.nx-novacut__track-name {
  font-size: 8px !important;
  font-weight: 900 !important;
  letter-spacing: .04em !important;
  text-transform: uppercase !important;
}

.nx-novacut__lane {
  position: relative !important;
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
  min-width: 0 !important;
  padding: 5px 8px !important;
  border-radius: 13px !important;
  background:
    linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.035)) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.022) !important;
}

.nx-novacut__lane::before {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  border-radius: inherit !important;
  pointer-events: none !important;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 40px) !important;
}

.nx-novacut__lane-add,
.nx-novacut__lane-tool {
  position: relative !important;
  z-index: 1 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  min-height: 34px !important;
  padding: 0 11px !important;
  border: 1px dashed rgba(255,255,255,.12) !important;
  border-radius: 10px !important;
  background: rgba(255,255,255,.025) !important;
  color: #85858f !important;
  font-size: 8px !important;
  font-weight: 850 !important;
}

.nx-novacut__lane-hint {
  position: relative !important;
  z-index: 1 !important;
  color: #666670 !important;
  font-size: 7px !important;
  font-weight: 750 !important;
  letter-spacing: .04em !important;
  text-transform: uppercase !important;
}

.nx-novacut__clip {
  position: relative !important;
  z-index: 2 !important;
  display: flex !important;
  align-items: center !important;
  flex: 0 0 auto !important;
  min-width: 160px !important;
  height: 46px !important;
  padding: 4px 7px !important;
  border: 1px solid rgba(255,255,255,.12) !important;
  border-radius: 11px !important;
  background: linear-gradient(180deg, rgba(52,52,59,.96), rgba(31,31,37,.96)) !important;
  color: #eeeeF2 !important;
  box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.06) !important;
}

.nx-novacut__clip--video {
  overflow: hidden !important;
  gap: 7px !important;
  text-align: left !important;
}

.nx-novacut__clip.is-selected {
  border-color: rgba(99,185,255,.85) !important;
  box-shadow: 0 0 0 2px rgba(99,185,255,.11), 0 8px 20px rgba(0,0,0,.2) !important;
}

.nx-novacut__clip--video {
  cursor: grab !important;
}

.nx-novacut__clip--video:active {
  cursor: grabbing !important;
}

.novacut-clip__handle {
  position: absolute !important;
  top: 0 !important;
  bottom: 0 !important;
  width: 28px !important;
  z-index: 8 !important;
  display: block !important;
  touch-action: none !important;
  opacity: .96 !important;
  border-radius: 8px !important;
}

.novacut-clip__handle::before {
  content: "‹";
  position: absolute !important;
  top: 50% !important;
  left: 4px !important;
  transform: translateY(-50%) !important;
  font-size: 19px !important;
  line-height: 1 !important;
  color: #fff !important;
  text-shadow: 0 1px 3px rgba(0,0,0,.8) !important;
}

.novacut-clip__handle::after {
  content: "";
  position: absolute !important;
  top: 5px !important;
  bottom: 5px !important;
  width: 4px !important;
  border-radius: 4px !important;
  background: #fff !important;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 10px rgba(99,185,255,.55) !important;
}

.novacut-clip__handle[data-novacut-edge="start"] {
  left: 0 !important;
  cursor: ew-resize !important;
  background: linear-gradient(90deg, rgba(99,185,255,.24), transparent) !important;
}

.novacut-clip__handle[data-novacut-edge="start"]::after {
  left: 4px !important;
}

.novacut-clip__handle[data-novacut-edge="end"] {
  right: 0 !important;
  cursor: ew-resize !important;
  background: linear-gradient(270deg, rgba(99,185,255,.24), transparent) !important;
}

.novacut-clip__handle[data-novacut-edge="end"]::before {
  content: "›" !important;
  left: auto !important;
  right: 4px !important;
}

.novacut-clip__handle[data-novacut-edge="end"]::after {
  right: 4px !important;
}

.novacut-clip__move-affordance {
  position: absolute !important;
  left: 50% !important;
  top: 5px !important;
  transform: translateX(-50%) !important;
  z-index: 7 !important;
  pointer-events: none !important;
  padding: 2px 6px !important;
  border: 1px solid rgba(255,255,255,.24) !important;
  border-radius: 999px !important;
  background: rgba(5,5,7,.72) !important;
  color: #eaf7ff !important;
  font-size: 7px !important;
  line-height: 1 !important;
  font-weight: 900 !important;
  letter-spacing: .12em !important;
  box-shadow: 0 4px 12px rgba(0,0,0,.25) !important;
  opacity: 0 !important;
  transition: opacity 100ms ease !important;
}

.nx-novacut__clip.novacut-selected .novacut-clip__move-affordance,
.nx-novacut__clip.is-selected .novacut-clip__move-affordance,
.nx-novacut__clip:hover .novacut-clip__move-affordance {
  opacity: 1 !important;
}

.nx-novacut__clip.novacut-selected .novacut-clip__handle,
.nx-novacut__clip.is-selected .novacut-clip__handle {
  opacity: 1 !important;
}

.nx-novacut__clip-thumb {
  width: 38px !important;
  height: 36px !important;
  flex: 0 0 auto !important;
  border-radius: 7px !important;
  background:
    linear-gradient(135deg, rgba(99,185,255,.22), rgba(160,112,255,.18)),
    repeating-linear-gradient(135deg, rgba(255,255,255,.11) 0 3px, transparent 3px 7px) !important;
}

.nx-novacut__clip-copy {
  min-width: 42px !important;
  display: grid !important;
  gap: 3px !important;
}

.nx-novacut__clip-copy strong {
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  white-space: nowrap !important;
  max-width: 76px !important;
  font-size: 8px !important;
  font-weight: 900 !important;
}

.nx-novacut__clip-copy small {
  color: #81818b !important;
  font-size: 6px !important;
  font-weight: 800 !important;
}

.nx-novacut__clip-wave {
  width: 42px !important;
  height: 22px !important;
  margin-left: auto !important;
  border-radius: 6px !important;
  opacity: .66 !important;
  background: repeating-linear-gradient(90deg, rgba(99,185,255,.9) 0 2px, transparent 2px 5px) !important;
}

.nx-novacut__clip--audio {
  min-width: 180px !important;
  gap: 8px !important;
  border-color: rgba(99,241,189,.16) !important;
  background: linear-gradient(180deg, rgba(32,60,51,.86), rgba(23,42,36,.9)) !important;
}

.nx-novacut__clip--text {
  min-width: 170px !important;
  gap: 8px !important;
  border-color: rgba(171,141,255,.19) !important;
  background: linear-gradient(180deg, rgba(55,42,76,.83), rgba(35,28,50,.9)) !important;
}

.nx-novacut__track-icon {
  width: 26px !important;
  height: 26px !important;
  display: grid !important;
  place-items: center !important;
  flex: 0 0 auto !important;
  border-radius: 8px !important;
  background: rgba(255,255,255,.05) !important;
}

.nx-novacut__audio-bars {
  width: 58px !important;
  height: 20px !important;
  margin-left: auto !important;
  opacity: .68 !important;
  background:
    linear-gradient(90deg,
      transparent 0 3px,
      #63f1bd 3px 5px,
      transparent 5px 8px,
      #63f1bd 8px 11px,
      transparent 11px 14px,
      #63f1bd 14px 16px,
      transparent 16px 20px,
      #63f1bd 20px 24px,
      transparent 24px 28px,
      #63f1bd 28px 31px,
      transparent 31px 35px,
      #63f1bd 35px 39px,
      transparent 39px 44px,
      #63f1bd 44px 47px,
      transparent 47px 52px,
      #63f1bd 52px 56px,
      transparent 56px 58px) !important;
  border-radius: 5px !important;
}

.nx-novacut__interaction-surface {
  position: absolute !important;
  top: 28px !important;
  left: 72px !important;

pper\n      )\n    );\n  }\n\n  getVideoClipsInOrder() {\n    return [\n      ...this.engine.registry.videoTracks\n    ].sort(\n      (a, b) =>\n        finite(a.startTime) -\n        finite(b.startTime)\n    );\n  }\n\n  getPreviousVideoClip(\n    clip\n  ) {\n    const ordered =\n      this.getVideoClipsInOrder();\n\n    const index =\n      ordered.findIndex(\n        (item) =>\n          item.id === clip.id\n      );\n\n    return index > 0\n      ? ordered[index - 1]\n      : null;\n  }\n\n  getNextVideoClip(\n    clip\n  ) {\n    const ordered =\n      this.getVideoClipsInOrder();\n\n    const index =\n      ordered.findIndex(\n        (item) =>\n          item.id === clip.id\n      );\n\n    return index >= 0 &&\n      index < ordered.length - 1\n      ? ordered[index + 1]\n      : null;\n  }\n\n  commitClipMutation() {\n    const state =\n      this.touchState;\n\n    if (!state) {\n      return;\n    }\n\n    const clip =\n      state.clip;\n\n    const mode =\n      state.mode;\n\n    clip.startTime =\n      Math.max(\n        0,\n        finite(clip.startTime)\n      );\n\n    clip.duration =\n      Math.max(\n        this.options.minFrameMs,\n        finite(clip.duration)\n      );\n\n    clip.sourceStartTime =\n      Math.max(\n        0,\n        finite(clip.sourceStartTime)\n      );\n\n    this.engine.activeTrackId =\n      clip.id;\n\n    /*\n     * One state refresh at gesture end only.\n     * The live frames are mutated locally during touchmove.\n     */\n    if (\n      typeof this.engine.refresh ===\n      \"function\"\n    ) {\n      this.engine.refresh();\n    } else {\n      this.engine.events?.emit(\n        \"statechange\",\n        this.engine.getState?.()\n      );\n    }\n\n    if (state.historyBefore && typeof this.engine.recordExternalMutation === \"function\") {\n      const label = mode === \"drag\"\n        ? \"Move clip\"\n        : mode === \"trim-start\"\n          ? \"Trim start\"\n          : \"Trim end\";\n      this.engine.recordExternalMutation(state.historyBefore, label);\n    }\n  }\n\n  restoreClipMutation() {\n    const state =\n      this.touchState;\n\n    if (!state?.clip) {\n      return;\n    }\n\n    state.clip.startTime =\n      state.originalStartTime;\n\n    state.clip.duration =\n      state.originalDuration;\n\n    state.clip.sourceStartTime =\n      state.originalSourceStartTime;\n\n    this.applyClipGeometry(\n      state.element,\n      state.clip\n    );\n  }\n\n  edgeScroll(clientX) {\n    if (!this.timeline) {\n      return;\n    }\n\n    const rect =\n      this.timeline.getBoundingClientRect();\n\n    const distanceLeft =\n      clientX -\n      rect.left;\n\n    const distanceRight =\n      rect.right -\n      clientX;\n\n    if (\n      distanceLeft <\n      this.options.edgeAutoScrollPx\n    ) {\n      this.timeline.scrollLeft =\n        Math.max(\n          0,\n          this.timeline.scrollLeft -\n            8\n        );\n    } else if (\n      distanceRight <\n      this.options.edgeAutoScrollPx\n    ) {\n      this.timeline.scrollLeft +=\n        8;\n    }\n  }\n\n  decorateVideoClips() {\n    if (!this.timeline) {\n      return;\n    }\n\n    const elements =\n      this.timeline.querySelectorAll(\n        \"[data-clip-id], [data-clip]\"\n      );\n\n    elements.forEach(\n      (element) => {\n        const clipId =\n          getClipId(element);\n\n        if (!clipId) {\n          return;\n        }\n\n        const record =\n          this.engine.registry.getById(\n            clipId\n          );\n\n        if (\n          !record ||\n          record.type !==\n            \"videoTracks\"\n        ) {\n          return;\n        }\n\n        this.ensureTrimHandles(\n          element\n        );\n\n        this.applyClipGeometry(\n          element,\n          record.item\n        );\n\n        element.classList.toggle(\n          \"novacut-selected\",\n          this.engine.activeTrackId ===\n            record.item.id\n        );\n      }\n    );\n  }\n\n  ensureTrimHandles(\n    element\n  ) {\n    const hasStart =\n      element.querySelector(\n        \".novacut-clip__handle[data-novacut-edge='start']\"\n      );\n\n    const hasEnd =\n      element.querySelector(\n        \".novacut-clip__handle[data-novacut-edge='end']\"\n      );\n\n    if (!hasStart) {\n      const start =\n        this.root.ownerDocument.createElement(\n          \"span\"\n        );\n\n      start.className =\n        \"novacut-clip__handle\";\n\n      start.dataset.novacutEdge =\n        \"start\";\n\n      start.setAttribute(\n        \"aria-label\",\n        \"Trim clip start\"\n      );\n\n      start.setAttribute(\n        \"role\",\n        \"presentation\"\n      );\n\n      start.title = \"Trim clip start\";\n\n      element.prepend(\n        start\n      );\n    }\n\n    if (!hasEnd) {\n      const end =\n        this.root.ownerDocument.createElement(\n          \"span\"\n        );\n\n      end.className =\n        \"novacut-clip__handle\";\n\n      end.dataset.novacutEdge =\n        \"end\";\n\n      end.setAttribute(\n        \"aria-label\",\n        \"Trim clip end\"\n      );\n\n      end.setAttribute(\n        \"role\",\n        \"presentation\"\n      );\n\n      end.title = \"Trim clip end\";\n      element.append(\n        end\n      );\n    }\n\n    if (!element.querySelector(\".novacut-clip__move-affordance\")) {\n      const move = this.root.ownerDocument.createElement(\"span\");\n      move.className = \"novacut-clip__move-affordance\";\n      move.textContent = \"MOVE\";\n      move.setAttribute(\"aria-hidden\", \"true\");\n      move.title = \"Drag clip to move\";\n      element.append(move);\n    }\n  }\n\n  applyClipGeometry(\n    element,\n    clip\n  ) {\n    if (!element || !clip) {\n      return;\n    }\n\n    const scale =\n      this.options.pixelsPerSecond /\n      1000;\n\n    const width =\n      Math.max(\n        46,\n        finite(clip.duration) *\n          scale\n      );\n\n    const start =\n      Math.max(\n        0,\n        finite(clip.startTime)\n      );\n\n    element.style.width =\n      width + \"px\";\n\n    element.style.minWidth =\n      width + \"px\";\n\n    element.style.flex =\n      \"0 0 \" + width + \"px\";\n\n    element.style.marginLeft =\n      start * scale + \"px\";\n\n    element.style.transform =\n      \"translate3d(0,0,0)\";\n  }\n\n  syncTimeline() {\n    if (!this.timeline) {\n      return;\n    }\n\n    this.installPlayhead();\n    this.decorateVideoClips();\n    this.syncPlayhead();\n  }\n\n  syncPlayhead() {\n    if (\n      !this.timeline ||\n      !this.playhead\n    ) {\n      return;\n    }\n\n    const target =\n      this.timeline.querySelector(\n        \"[data-role='video-lane'], .nx-novacut__lane\"\n      );\n\n    if (!target) {\n      return;\n    }\n\n    const timelineRect =\n      this.timeline.getBoundingClientRect();\n\n    const laneRect =\n      target.getBoundingClientRect();\n\n    const pxPerMs =\n      this.pixelsPerMs();\n\n    const contentX =\n      this.engine.currentTimestamp *\n      pxPerMs;\n\n    const viewportX =\n      laneRect.left -\n      timelineRect.left +\n      contentX;\n\n    const boundedX =\n      clamp(\n        viewportX,\n        0,\n        Math.max(\n          0,\n          this.timeline.clientWidth\n        )\n      );\n\n    this.playhead.style.left =\n      boundedX + \"px\";\n  }\n\n  scheduleSync() {\n    if (\n      this.pendingFrame\n    ) {\n      return;\n    }\n\n    this.pendingFrame =\n      requestAnimationFrame(() => {\n        this.pendingFrame = 0;\n\n        try {\n          this.syncTimeline();\n        } catch (error) {\n          this.engine.reportError(\n            \"interaction-sync\",\n            error\n          );\n        }\n      });\n  }\n\n  pixelsPerMs() {\n    return (\n      this.options.pixelsPerSecond /\n      1000\n    );\n  }\n\n  cancelLongPress() {\n    if (\n      this.longPressTimer\n    ) {\n      window.clearTimeout(\n        this.longPressTimer\n      );\n\n      this.longPressTimer = 0;\n    }\n  }\n\n  cleanupGesture() {\n    this.cancelLongPress();\n\n    this.pendingTimelineSeekX =\n      null;\n\n    this.pendingClipDx =\n      null;\n\n    this.mode =\n      \"idle\";\n\n    if (\n      this.touchState?.element\n    ) {\n      delete this.touchState.element.dataset.novacutDragging;\n      delete this.touchState.element.dataset.novacutTrimming;\n      this.touchState.element.style.transform =\n        \"translate3d(0,0,0)\";\n    }\n\n    this.timeline?.classList.remove(\n      \"novacut-gesture-active\"\n    );\n\n    this.touchState =\n      null;\n\n    this.activePointerId =\n      null;\n\n    this.scheduleSync();\n  }\n\n  dispose() {\n    this.cancelLongPress();\n\n    if (\n      this.pendingFrame\n    ) {\n      cancelAnimationFrame(\n        this.pendingFrame\n      );\n\n      this.pendingFrame = 0;\n    }\n\n    if (\n      this.pendingMutationFrame\n    ) {\n      cancelAnimationFrame(\n        this.pendingMutationFrame\n      );\n\n      this.pendingMutationFrame = 0;\n    }\n\n    this.abortController?.abort();\n\n    this.unsubscribe.forEach(\n      (unsubscribe) => {\n        try {\n          unsubscribe();\n        } catch {\n          /* ignored */\n        }\n      }\n    );\n\n    this.unsubscribe = [];\n\n    this.resizeObserver?.disconnect();\n    this.mutationObserver?.disconnect();\n\n    this.resizeObserver = null;\n    this.mutationObserver = null;\n    this.playhead?.remove();\n\n    this.playhead = null;\n    this.timeline = null;\n    this.touchState = null;\n  }\n}\n\nexport function createNovaCutStudioInteractions(\n  root,\n  engine,\n  options = {}\n) {\n  return new NovaCutStudioInteractions(\n    root,\n    engine,\n    options\n  );\n}\n\nexport function attachNovaCutInteractions(\n  root,\n  engine,\n  options = {}\n) {\n  return createNovaCutStudioInteractions(\n    root,\n    engine,\n    options\n  );\n}\n";

const historyUrl = URL.createObjectURL(new Blob([HISTORY_SOURCE], {type:"text/javascript"}));
const engineModuleSource = ENGINE_SOURCE
  .replace(/^import\s+\{\s*createNovaCutHistory\s*\}\s+from\s+["'][^"']+["'];?\s*/m,
    'import { createNovaCutHistory } from ' + JSON.stringify(historyUrl) + ';\n')
  .replace(/\nexport\s*\{[\s\S]*?\};\s*export\s+const\s+createNovaCutEngine[\s\S]*$/m, "\n")
  + '\nexport { NovaCutEngine, NovaCutCanvasPreview };\nexport const createNovaCutEngine = (options = {}) => new NovaCutEngine(options);\n';
const engineUrl = URL.createObjectURL(new Blob([engineModuleSource], {type:"text/javascript"}));
const studioUrl = URL.createObjectURL(new Blob([STUDIO_SOURCE], {type:"text/javascript"}));

const [{createNovaCutEngine}, {createNovaCutStudioInteractions}] = await Promise.all([
  import(engineUrl),
  import(studioUrl)
]);

const SVG = {
 media:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="m3 16 5-5 4 4 3-3 6 6"></path><circle cx="8" cy="9" r="1.4" fill="currentColor" stroke="none"></circle></svg>',
 play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12 8 5.2Z" fill="currentColor" stroke="none"></path></svg>',
 pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"></path></svg>',
 undo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5v4"></path><path d="M5 11c1.9-3.6 6.3-5.2 10.1-3.4 2 .9 3.4 2.8 3.4 5.1 0 3.1-2.5 5.6-5.6 5.6H9"></path></svg>',
 redo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h4v4"></path><path d="M19 11c-1.9-3.6-6.3-5.2-10.1-3.4C6.9 8.5 5.5 10.4 5.5 12.7c0 3.1 2.5 5.6 5.6 5.6H15"></path></svg>',
 split:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v5M16 14v5M8 10l8 4M16 14l-5-4"></path><circle cx="8" cy="4" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="20" r="1.5" fill="currentColor" stroke="none"></circle></svg>',
};
const root=document.getElementById("mount");
root.innerHTML=`
<section class="nx-novacut nx-novacut--elite" aria-label="NovaCut editor">
<header class="nx-novacut__header">
  <div class="nx-novacut__project"><span class="nx-novacut__brand-mark">N</span><div><span class="nx-novacut__eyebrow">NOVA EDITOR</span><strong>NovaCut</strong></div></div>
  <div class="nx-novacut__top-actions">
    <button type="button" class="nx-novacut__icon-button" data-action="undo" aria-label="Undo">${SVG.undo}</button>
    <button type="button" class="nx-novacut__icon-button" data-action="redo" aria-label="Redo">${SVG.redo}</button>
    <button type="button" class="nx-novacut__export-button" data-action="export" disabled>Export</button>
  </div>
</header>
<section class="nx-novacut__canvas-area">
  <div class="nx-novacut__canvas-shell">
    <canvas class="nx-novacut__canvas" data-role="preview-canvas"></canvas>
    <div class="nx-novacut__canvas-empty" data-role="canvas-empty">
      <label class="nx-novacut__media-drop" for="filePicker"><span>${SVG.media}</span><strong>Upload video</strong><small>Choose a local video for the staging test</small></label>
      <input id="filePicker" type="file" accept="video/*" hidden>
    </div>
    <div class="nx-novacut__canvas-overlay"><span class="nx-novacut__live-dot"></span><span data-role="status">Ready</span></div>
  </div>
  <div class="nx-novacut__transport">
    <span data-role="current-time">00:00:00</span>
    <button type="button" class="nx-novacut__play" data-action="play" aria-label="Play"><span data-role="play-icon">${SVG.play}</span></button>
    <span data-role="duration">00:00:00</span>
  </div>
</section>
<section class="nx-novacut__timeline-shell">
  <div class="nx-novacut__timeline-head">
    <div><span class="nx-novacut__eyebrow">TIMELINE</span><strong>Project sequence</strong></div>
    <div class="nx-novacut__timeline-head-actions">
      <button type="button" class="nx-novacut__icon-button nx-novacut__timeline-action" data-action="duplicate" aria-label="Duplicate selected clip" title="Duplicate">${SVG.redo}</button>
      <button type="button" class="nx-novacut__icon-button nx-novacut__timeline-action" data-action="delete" aria-label="Delete selected clip" title="Delete">×</button>
    </div>
  </div>
  <div class="nx-novacut__timeline">
    <div class="nx-novacut__ruler"><div class="nx-novacut__ruler-pad"></div><div class="nx-novacut__ticks">
      <span style="--i:0">0:00</span><span style="--i:1">0:01</span><span style="--i:2">0:02</span><span style="--i:3">0:03</span><span style="--i:4">0:04</span><span style="--i:5">0:05</span><span style="--i:6">0:06</span><span style="--i:7">0:07</span><span style="--i:8">0:08</span>
    </div></div>
    <div class="nx-novacut__track nx-novacut__track--video"><div class="nx-novacut__track-label"><span class="nx-novacut__track-index">01</span><span class="nx-novacut__track-name">Video</span></div><div class="nx-novacut__lane" data-role="video-lane"><span class="nx-novacut__lane-hint">Upload a video to begin</span></div></div>
    <div class="nx-novacut__track nx-novacut__track--audio"><div class="nx-novacut__track-label"><span class="nx-novacut__track-index">02</span><span class="nx-novacut__track-name">Audio</span></div><div class="nx-novacut__lane"><span class="nx-novacut__lane-hint">Audio comes later in the staged flow</span></div></div>
    <div class="nx-novacut__track nx-novacut__track--text"><div class="nx-novacut__track-label"><span class="nx-novacut__track-index">03</span><span class="nx-novacut__track-name">History</span></div><div class="nx-novacut__lane"><span class="nx-novacut__lane-hint">Move · Trim · Split · Duplicate · Delete · Undo · Redo</span></div></div>
  </div>
</section>
</section>`;

const engine=createNovaCutEngine({root});
createNovaCutStudioInteractions(root,engine);
const picker=root.querySelector("#filePicker");
const lane=root.querySelector("[data-role='video-lane']");
const canvasEmpty=root.querySelector("[data-role='canvas-empty']");
const status=root.querySelector("[data-role='status']");
const undo=root.querySelector("[data-action='undo']");
const redo=root.querySelector("[data-action='redo']");
const duplicate=root.querySelector("[data-action='duplicate']");
const del=root.querySelector("[data-action='delete']");
const play=root.querySelector("[data-action='play']");
const icon=root.querySelector("[data-role='play-icon']");

function render(){
  const state=engine.getState();
  lane.innerHTML=state.videoTracks.length?state.videoTracks.map((clip)=>`<button type="button" class="nx-novacut__clip nx-novacut__clip--video" data-clip-id="${clip.id}">
    <span class="nx-novacut__clip-thumb"></span><span class="nx-novacut__clip-copy"><strong>${clip.file?.name || "Video"}</strong><small>${(clip.duration/1000).toFixed(1)}s</small></span>
  </button>`).join(""):'<span class="nx-novacut__lane-hint">Upload a video to begin</span>';
  canvasEmpty.hidden=state.videoTracks.length>0;
  undo.disabled=!state.canUndo;
  redo.disabled=!state.canRedo;
  duplicate.disabled=!state.activeTrackId;
  del.disabled=!state.activeTrackId;
}
engine.on("statechange",render);
engine.on("historychange",render);
engine.on("playbackchange",({isPlaying})=>{icon.innerHTML=isPlaying?SVG.pause:SVG.play;});
engine.on("media:status",({status:s})=>{status.textContent={decoding:"Decoding…",ready:"Ready","decode-error":"Decode error"}[s]||s;});
engine.on("error",()=>{status.textContent="Error";});
render();

picker.addEventListener("change",async()=>{
 const file=picker.files?.[0]; if(!file)return;
 const video=document.createElement("video");
 video.preload="metadata"; video.muted=true; video.playsInline=true;
 const url=URL.createObjectURL(file);
 video.src=url;
 try{await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error("Browser could not read this video."));});}
 catch(e){status.textContent=e.message;URL.revokeObjectURL(url);return;}
 URL.revokeObjectURL(url);
 engine.addVideoClip({file,startTime:0,duration:Math.max(1000,video.duration*1000),sourceStartTime:0,x_offset:0,scale:1});
 status.textContent="Preparing media…";
 picker.value="";
});

root.querySelector("[data-action='export']").addEventListener("click",()=>alert("Export remains intentionally outside this Section 2 timeline gate."));
</script>
</body>
</html>
