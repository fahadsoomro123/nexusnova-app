<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NexusNova Travel Reference Host Harness</title>
<style>
:root{--nx-pad:16px;--nx-dock-height:62px;--nx-safe-bottom:24px}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070d;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef7ff}
*{box-sizing:border-box}
.nx-app{width:min(100%,760px);min-height:100dvh;margin:0 auto;position:relative;overflow:visible}
.nx-stage{min-height:100dvh;padding:var(--nx-pad) var(--nx-pad) calc(var(--nx-dock-height) + var(--nx-safe-bottom) + 58px);scroll-padding-bottom:calc(var(--nx-dock-height) + var(--nx-safe-bottom) + 58px);overflow:auto;outline:none}
.nx-screen{animation:none}
.nx-app-head{min-height:74px;padding:10px}.nx-app-head [data-app-back]{display:block}
[data-app-mount]{min-height:1px}
.nx-dock.global{position:fixed;z-index:20;left:50%;bottom:max(8px,var(--nx-safe-bottom));width:min(calc(100% - 22px),520px);min-height:66px;transform:translateX(-50%);border:1px solid #15547b;border-radius:20px;background:linear-gradient(180deg,rgba(6,47,78,.98),rgba(3,28,49,.98));display:grid;grid-template-columns:1fr 1.45fr;gap:8px;padding:6px}
.nx-dock.global button{border:0;background:transparent;color:#acd4ee;font-weight:900;font-size:11px;border-radius:14px}.nx-dock.global button:last-child{background:linear-gradient(120deg,#0f6ea9,#075b91);border:1px solid #1bbef5;color:#eefbff}
</style>
</head>
<body>
<div class="nx-app">
  <main class="nx-stage" tabindex="-1">
    <section class="nx-screen">
      <header class="nx-app-head"><button type="button" data-app-back aria-label="Back">‹</button></header>
      <div data-app-mount id="travel-mount"></div>
    </section>
  </main>
  <nav class="nx-dock global"><button>MINE</button><button>NOVA HUB</button></nav>
</div>
<script type="module">
  const params=new URLSearchParams(location.search);
  const clamp=(value,min,max,fallback)=>{const n=Number(value);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback};
  const safeBottom=clamp(params.get('bottom'),0,70,24);
  const dock=clamp(params.get('dock'),48,76,62);
  document.documentElement.style.setProperty('--nx-safe-bottom',`${safeBottom}px`);
  document.documentElement.style.setProperty('--nx-dock-height',`${dock}px`);
  document.documentElement.dataset.insetProfile=`safe-${safeBottom}-${dock}`;
  const [{ renderTravelSuite },{ enhanceTravelApp }]=await Promise.all([
    import('./src/features/apps/travel-suite.js'),
    import('./src/features/apps/travel-integrations.js')
  ]);
  const root=renderTravelSuite();
  enhanceTravelApp('travel',root);
  document.getElementById('travel-mount').appendChild(root);
</script>
</body>
</html>
