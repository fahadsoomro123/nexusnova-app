<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Set only to a real Firebase App Check Enterprise site key. It is public,
         but must be registered for every deployed origin before secure calls work. -->
    <meta name="nexusnova-app-check-site-key" content="">

    <title>NexusNova - Login</title>
    <!--
      DEVELOPMENT NOTE:
      This file uses Google's official reCAPTCHA v2 TEST site key.
      Replace data-sitekey with your production site key before deployment.
    -->

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans", system-ui, sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 22px; color: #e9f5f2;
            background:
              radial-gradient(ellipse 70% 50% at 15% 0%, rgba(10,147,150,0.16), transparent 55%),
              #001219;
        }
        .card {
            width: 100%; max-width: 400px; padding: 28px 24px; border-radius: 22px;
            background: #0f2a35;
            border: 1px solid rgba(148, 210, 189, 0.14);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .logo { text-align: center; margin-bottom: 26px; }
        .logo h1 {
            font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;
            color: #fff; margin-bottom: 8px;
        }
        .logo h1 span { color: #94d2bd; }
        .logo p { color: #5f7a76; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block; margin-bottom: 6px; color: #8ba8a3;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        }
        .input-group input {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid rgba(148,210,189,0.12); background: #0a1f29;
            color: #fff; outline: none; font-size: 1rem; font-weight: 500;
        }
        .input-group input:focus {
            border-color: #0a9396; box-shadow: 0 0 0 3px rgba(10,147,150,0.2);
        }
        .captcha-box {
            background: #0a1f29; border: 1px solid rgba(148,210,189,0.1);
            border-radius: 12px; padding: 12px; margin-bottom: 16px; overflow: hidden;
        }
        .captcha-help { color: #5f7a76; font-size: 0.74rem; margin-top: 6px; }
        .btn-primary, #authBtn, .auth-btn {
            width: 100%; margin-top: 6px; padding: 15px; border: 0; border-radius: 14px;
            font-weight: 700; font-size: 0.95rem; color: #001219; cursor: pointer;
            background: #94d2bd;
            box-shadow: 0 4px 16px rgba(148,210,189,0.25);
        }
        .switch-auth { text-align: center; margin-top: 16px; color: #8ba8a3; font-size: 0.9rem; font-weight: 500; }
        .switch-auth a, .switch-auth span.link, #toggleAuth { color: #94d2bd; font-weight: 700; cursor: pointer; }
        .divider {
            display: flex; align-items: center; gap: 12px; margin: 18px 0;
            color: #5f7a76; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148,210,189,0.2), transparent);
        }
        .btn-google {
            width: 100%; padding: 13px; border-radius: 14px;
            border: 1px solid rgba(148,210,189,0.12); background: #fff; color: #0f172a;
            font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .error-msg { color: #e76f51; text-align: center; margin-top: 10px; font-weight: 600; }
        .success-msg { color: #52b788; text-align: center; margin-top: 10px; font-weight: 600; }
    </style>

    <!-- Google reCAPTCHA v2 ("I'm not a robot") -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
<link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/index.css">

<style id="nxAuthMobileSplashPolish">
@media(max-width:700px){
  #nxSplash{
    min-height:100dvh!important;
    padding:max(12px,env(safe-area-inset-top)) 16px calc(7vh + max(18px,env(safe-area-inset-bottom)))!important;
  }
}
</style>
</head>

<body>

<div id="nxSplash" aria-hidden="false">
  <div class="nx-splash-grid" aria-hidden="true"></div>
  <div class="nx-orbit nx-orbit-a" aria-hidden="true"></div>
  <div class="nx-orbit nx-orbit-b" aria-hidden="true"></div>
  <div class="nx-logo-3d" aria-hidden="true">
    <div class="nx-logo-halo"></div>
    <div class="nx-logo-face"><span>N</span></div>
  </div>
  <div class="nx-splash-kicker">NEXUSNOVA OS</div>
  <div class="nx-splash-name">Nexus<span>Nova</span></div>
  <div class="nx-splash-slogan">One grid. Every tool. Your daily universe.</div>
  <div class="nx-splash-status"><span class="nx-status-dot"></span><span>Initializing secure workspace</span></div>
  <div class="nx-splash-bar"><i></i></div>
  <div class="nx-splash-version">SUPER APP • SECURE • CONNECTED</div>
</div>
<script>
(function(){
  var minMs = 3200;
  var start = Date.now();
  function hide(){
    var el = document.getElementById("nxSplash");
    if(!el) return;
    el.classList.add("hide");
    setTimeout(function(){ try{el.remove();}catch(e){} }, 600);
  }
  function ready(){
    var left = minMs - (Date.now() - start);
    setTimeout(hide, Math.max(0, left));
  }
  if(document.readyState === "complete") ready();
  else window.addEventListener("load", ready);
})();
</script>


<div class="auth-shell">
  <div class="auth-ambient auth-ambient-one" aria-hidden="true"></div>
  <div class="auth-ambient auth-ambient-two" aria-hidden="true"></div>
  <div class="card auth-card">

    <div class="logo">
      <div class="auth-logo-mark" aria-hidden="true"><span>N</span></div>
      <div class="auth-eyebrow"><span class="auth-live-dot"></span> SECURE NEXUS ACCESS</div>
      <h1 id="title">Nexus<span>Nova</span></h1>
      <p id="subtitle">Sign up to start mining</p>
      <div class="auth-trust-row" aria-hidden="true">
        <span>256-bit feel</span><i></i><span>Fast access</span><i></i><span>Cloud sync</span>
      </div>
    </div>


    <div class="input-group">

        <label for="email">
            Email address
        </label>

        <input
            type="email"
            id="email"
            placeholder="name@example.com"
            autocomplete="email"
        >

    </div>


    <div class="input-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            autocomplete="current-password"
        >

    </div>

    <div class="captcha-box" id="captchaBox">
        <div
            class="g-recaptcha"
            data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
            data-theme="dark"
            data-size="normal">
        </div>
        <div class="captcha-help">
            Protected by Google reCAPTCHA
        </div>
    </div>

<button
        id="authBtn"
        class="auth-btn"
    >
        Sign up with Email
    </button>


    <div id="message"></div>


    <div class="toggle-text">

        <span id="toggleBtn">
            Already have an account? Log in
        </span>

    </div>


    <div class="divider">
        <span>OR</span>
    </div>


    <button
        id="googleLoginBtn"
        class="google-btn"
    >

        <svg
            width="18"
            height="18"
            viewBox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />

            <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />

            <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z"
            />

            <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />

        </svg>

        Continue with Google

    </button>

</div>
</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getToken,
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
     signInWithEmailAndPassword,
     GoogleAuthProvider,
     signInWithPopup,
     sendEmailVerification,
     onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBU75WYp5ioaMD1LrNcDyAvROFW2wrTil0",

    authDomain:
        "nexusnova-6ade2.firebaseapp.com",

    projectId:
        "nexusnova-6ade2",

    storageBucket:
        "nexusnova-6ade2.firebasestorage.app",

    messagingSenderId:
        "49791194817",

    appId:
        "1:49791194817:web:07f28326e0f15979536640",

    measurementId:
        "G-YLPFKWSS12"
};


/* =========================================================
   START FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

/*
   App Check site keys are public, but must be provisioned in Firebase Console.
   Leave the HTML meta value blank until a production Enterprise key and every
   serving origin have been registered. Callable features then fail clearly.
*/
const appCheckSiteKey = String(
    document.querySelector('meta[name="nexusnova-app-check-site-key"]')
        ?.getAttribute("content") || ""
).trim();

let nexusAppCheck = null;
let nexusAppCheckStatus;

if(!appCheckSiteKey){
    nexusAppCheckStatus = {
        ready:false,
        message:"App Check is not configured. Add the production site key before using secure account actions."
    };
    console.warn("NexusNova App Check is not configured.");
}else{
    try{
        nexusAppCheck = initializeAppCheck(
            app,
            {
                provider:new ReCaptchaEnterpriseProvider(appCheckSiteKey),
                isTokenAutoRefreshEnabled:true
            }
        );
        nexusAppCheckStatus = {ready:true,message:""};
    }catch(error){
        console.error("NexusNova App Check initialization:",error);
        nexusAppCheckStatus = {
            ready:false,
            message:"App Check could not be initialized. Check the configured site key and allowed domain."
        };
    }
}

window.nexusAppCheckReady = Promise.resolve(nexusAppCheckStatus);
window.nexusRequireAppCheck = async function(){
    const status = await window.nexusAppCheckReady;

    if(!status?.ready || !nexusAppCheck){
        throw new Error(status?.message || "App Check is unavailable.");
    }

    try{
        const token = await getToken(nexusAppCheck,false);
        if(!token?.token) throw new Error("No App Check token was returned.");
        return token;
    }catch(error){
        console.warn("NexusNova App Check token:",error);
        throw new Error(
            "App Check could not obtain a token. Check the configured site key and allowed domain."
        );
    }
};

const auth =
    getAuth(app);

// The Android caller store is tied to the authenticated account. If Firebase
// restores no user on the login page, clear its last active-account marker.
// This is a safe no-op in a normal browser/PWA build.
onAuthStateChanged(auth, user => {
    if(user || typeof window.NexusAndroid?.postMessage !== "function") return;
    try{
        window.NexusAndroid.postMessage(
            JSON.stringify({action:"clearActiveAccount"})
        );
    }catch(error){
        console.warn("NexusNova Android active-account clear:",error);
    }
});

const db =
    getFirestore(app);

const googleProvider =
    new GoogleAuthProvider();


/* =========================================================
   ELEMENTS
========================================================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const captchaBox =
    document.getElementById("captchaBox");

const authBtn =
    document.getElementById("authBtn");

const googleLoginBtn =
    document.getElementById("googleLoginBtn");

const toggleBtn =
    document.getElementById("toggleBtn");

const title =
    document.getElementById("title");

const subtitle =
    document.getElementById("subtitle");

const message =
    document.getElementById("message");

// Keyboard users should get the exact same auth path as clicking the button.
// In signup mode reCAPTCHA validation still happens inside the existing click handler.
function submitEmailAuthFromKeyboard(event) {
    if (event.key !== "Enter" || event.isComposing) return;
    event.preventDefault();
    if (authBtn.disabled) return;
    authBtn.click();
}

emailInput.addEventListener("keydown", submitEmailAuthFromKeyboard);
passwordInput.addEventListener("keydown", submitEmailAuthFromKeyboard);


/* =========================================================
   MODE
========================================================= */

let loginMode = false;


/* =========================================================
   GOOGLE reCAPTCHA v2
========================================================= */

function resetRecaptcha() {
    if (typeof grecaptcha !== "undefined") {
        try {
            grecaptcha.reset();
        } catch (e) {
            console.warn("reCAPTCHA reset:", e);
        }
    }
}

function recaptchaPassed() {
    return (
        typeof grecaptcha !== "undefined" &&
        typeof grecaptcha.getResponse === "function" &&
        grecaptcha.getResponse().length > 0
    );
}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, success = false) {

    // Auth/provider errors are not trusted HTML. Keeping this as text also
    // preserves the existing visible message styling without an injection sink.
    message.textContent = String(text || "");
    message.style.color = success ? "#22c55e" : "#ef4444";
}


/* =========================================================
   CREATE FIRESTORE USER
========================================================= */

async function createUserProfile(user, name = "") {

    const userRef =
        doc(db, "users", user.uid);

    const userSnap =
        await getDoc(userRef);


    /* Already exists */

    if (userSnap.exists()) {
        return;
    }
    const profileName = String(
        name || user.displayName || "Miner User"
    ).trim().slice(0, 80) || "Miner User";
    const profileEmail = String(user.email || "").trim().slice(0, 320);


    /* Create user */

    await setDoc(
        userRef,
        {

            uid:
                user.uid,

            name:
                profileName,

            email:
                profileEmail,

            balance:
                0,

            totalMined:
                0,

            tasksCompleted:
                0,

            completedTasks:
                {},

            miningActive:
                false,

            miningStartedAt:
                0,

            miningLastUpdate:
                0,

            sessionEarned:
                0,

            lastDailyReward:
                0,

            dailyRewardStreak:
                0,

            createdAt:
                serverTimestamp()

        }
    );

}


/* =========================================================
   GO TO PAGE 2
========================================================= */

function openDashboard(successMessage = "Login successful! Opening dashboard...") {

    showMessage(
        successMessage,
        true
    );

    setTimeout(() => {

        window.location.replace(
            "./page2.html"
        );

    }, 500);

}


/* =========================================================
   LOGIN / SIGNUP SWITCH
========================================================= */

toggleBtn.addEventListener(
    "click",
    () => {

        loginMode =
            !loginMode;

        message.innerHTML = "";

        emailInput.value = "";
        passwordInput.value = "";


        resetRecaptcha();

        if (loginMode) {

            title.textContent =
                "Welcome Back";

            subtitle.textContent =
                "Log in to your account";

            authBtn.textContent =
                "Log in with Email";

            captchaBox.style.display =
                "none";

            toggleBtn.textContent =
                "Don't have an account? Sign up";

        } else {

            title.textContent =
                "NexusNova";

            subtitle.textContent =
                "Sign up to start mining";

            authBtn.textContent =
                "Sign up with Email";

            captchaBox.style.display =
                "flex";

            toggleBtn.textContent =
                "Already have an account? Log in";

            resetRecaptcha();

        }

    }
);


/* =========================================================
   EMAIL LOGIN / SIGNUP
========================================================= */

authBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;
        }


        /* GOOGLE reCAPTCHA ONLY FOR SIGNUP */

        if (!loginMode && !recaptchaPassed()) {

            showMessage(
                "Please tick the \"I'm not a robot\" box first."
            );

            return;
        }

        authBtn.disabled = true;


        if (loginMode) {

            authBtn.textContent =
                "Logging in...";

        } else {

            authBtn.textContent =
                "Creating account...";

        }


        try {


            /* =================================================
               LOGIN
            ================================================= */

            if (loginMode) {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                /*
                   IMPORTANT:
                   If old account has no Firestore profile,
                   create it now.
                */

                await createUserProfile(
                    result.user
                );


                openDashboard();

                return;
            }


            /* =================================================
               SIGNUP
            ================================================= */

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            /* Value-bearing actions require a verified Auth token. */
            try {
                await sendEmailVerification(result.user);
            } catch (verificationError) {
                console.warn("EMAIL VERIFICATION ERROR:", verificationError);
            }


            /* Create Firestore profile */

            await createUserProfile(
                result.user
            );


            openDashboard(
                "Account created. Check your email to verify it before using rewards. Opening dashboard..."
            );


        } catch (error) {

            console.error(
                "AUTH ERROR:",
                error
            );


            let errorText =
                "Something went wrong. Please try again.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorText =
                    "This email is already registered. Please use Login.";

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                errorText =
                    "Incorrect email or password.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorText =
                    "Please enter a valid email address.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorText =
                    "Password must contain at least 6 characters.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorText =
                    "Internet connection problem.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                errorText =
                    "Firebase Firestore permission denied. Check Firestore rules.";

            }

            else {

                errorText =
                    error.message || errorText;

            }


            showMessage(
                errorText
            );


            if (!loginMode) {
                resetRecaptcha();
            }


            authBtn.disabled =
                false;


            authBtn.textContent =
                loginMode
                    ? "Log in with Email"
                    : "Sign up with Email";

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleLoginBtn.addEventListener(
    "click",
    async () => {

        googleLoginBtn.disabled =
            true;

        googleLoginBtn.textContent =
            "Connecting to Google...";


        try {

            const result =
                await signInWithPopup(
                    auth,
                    googleProvider
                );


            /*
               IMPORTANT:
               Create Firestore profile for Google user
               if it does not already exist.
            */

            await createUserProfile(
                result.user
            );


            openDashboard();


        } catch (error) {

            console.error(
                "GOOGLE ERROR:",
                error
            );


            let errorText =
                error.message ||
                "Google login failed.";


            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                errorText =
                    "Google login was cancelled.";

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                errorText =
                    "Browser blocked Google popup. Allow popups.";

            }

            else if (
                error.code ===
                "auth/unauthorized-domain"
            ) {

                errorText =
                    "This StackBlitz domain is not authorized in Firebase.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                errorText =
                    "Firestore permission denied. Check Firestore rules.";

            }


            showMessage(
                errorText
            );


            googleLoginBtn.disabled =
                false;

            googleLoginBtn.innerHTML = `
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 48 48"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                    />

                    <path
                        fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z"
                    />

                    <path
                        fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                    />
                </svg>

                Continue with Google
            `;

        }

    }
);

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
