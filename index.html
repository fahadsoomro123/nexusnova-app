<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusNova - Register & Login</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161b26;
      --accent-color: #00ffcc;
      --text-main: #ffffff;
      --text-sub: #8a99ad;
      --secondary: #1f293d;
      --danger: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #222c3d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .tab-header {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--secondary);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }
    .form-container { display: none; }
    .form-container.active { display: block; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 12px;
      background: #111520;
      border: 1px solid var(--secondary);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--accent-color); }
    .captcha-box {
      background: #111520;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .captcha-text { font-weight: bold; color: var(--accent-color); font-size: 1.1rem; letter-spacing: 2px; }
    .action-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.9; }
    .msg { font-size: 0.8rem; margin-top: 8px; text-align: center; }
    .error-msg { color: var(--danger); }
    .success-msg { color: var(--accent-color); }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('register', this)">Register</button>
      <button class="tab-btn" onclick="switchTab('login', this)">Login</button>
    </div>

    <!-- REGISTER FORM WITH CAPTCHA -->
    <div id="tab-register" class="form-container active">
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Email address</label>
          <input type="email" id="regEmail" required placeholder="name@company.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="regPass" required placeholder="••••••••">
        </div>
        
        <div class="input-group">
          <label>Security Verification (CAPTCHA)</label>
          <div class="captcha-box">
            <span id="captchaQuestion" class="captcha-text"></span>
            <button type="button" onclick="generateCaptcha()" style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:0.8rem;">🔄 Refresh</button>
          </div>
          <input type="number" id="captchaInput" required placeholder="Enter the answer">
        </div>

        <button type="submit" class="action-btn">Sign Up</button>
        <div id="regMsg" class="msg"></div>
      </form>
    </div>

    <!-- LOGIN FORM (CLEAN WITHOUT CAPTCHA) -->
    <div id="tab-login" class="form-container">
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Email address</label>
          <input type="email" id="logEmail" required placeholder="name@company.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="logPass" required placeholder="••••••••">
        </div>

        <button type="submit" class="action-btn">Login</button>
        <div id="logMsg" class="msg error-msg"></div>
      </form>
    </div>
  </div>

  <script>
    let currentAnswer = 0;

    function generateCaptcha() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      currentAnswer = num1 + num2;
      const qEl = document.getElementById('captchaQuestion');
      if(qEl) qEl.innerText = num1 + " + " + num2 + " = ?";
    }

    window.onload = generateCaptcha;

    function switchTab(tabName, btn) {
      document.querySelectorAll('.form-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
      if(tabName === 'register') generateCaptcha();
    }

    function handleRegister(e) {
      e.preventDefault();
      const userCaptcha = parseInt(document.getElementById('captchaInput').value);
      const msg = document.getElementById('regMsg');

      if (userCaptcha !== currentAnswer) {
        msg.className = "msg error-msg";
        msg.innerText = "Galat CAPTCHA! Dobara koshish karein.";
        generateCaptcha();
        document.getElementById('captchaInput').value = '';
        return;
      }

      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;

      localStorage.setItem('nvx_saved_email', email);
      localStorage.setItem('nvx_saved_pass', pass);

      msg.className = "msg success-msg";
      msg.innerText = "Account registered successfully! Now please Login.";
      
      setTimeout(() => {
        document.querySelectorAll('.tab-btn')[1].click();
      }, 1500);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('logEmail').value;
      const pass = document.getElementById('logPass').value;
      const msg = document.getElementById('logMsg');

      const savedEmail = localStorage.getItem('nvx_saved_email');
      const savedPass = localStorage.getItem('nvx_saved_pass');

      if ((savedEmail && savedEmail === email && savedPass === pass) || !savedEmail) {
        localStorage.setItem('nvx_logged', 'true');
        localStorage.setItem('nvx_user_email', email);
        window.location.href = "page2.html";
      } else {
        msg.innerText = "Galat Email ya Password!";
      }
    }
  </script>

</body>
</html>
