```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexusNova - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0f17;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #151b27;
            border: 1px solid #263247;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo h1 {
            color: #00ffcc;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #e2e8f0;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f1724;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #00ffcc;
        }

        .captcha-box {
            background: #0f1724;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
        }

        .captcha-box input {
            width: 80px;
            padding: 8px;
            text-align: center;
            background: #151b27;
            border: 1px solid #475569;
            color: #ffffff;
            border-radius: 5px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00ffcc;
            color: #00110d;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-btn:hover {
            background: #00d9ad;
        }

        .auth-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .toggle-text {
            text-align: center;
            margin-top: 17px;
            color: #94a3b8;
            font-size: 13px;
        }

        .toggle-text span {
            color: #00ffcc;
            cursor: pointer;
            font-weight: bold;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: #64748b;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #334155;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
            color: #222222;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #f1f5f9;
        }

        .google-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="logo">

        <h1 id="title">
            NexusNova
        </h1>

        <p id="subtitle">
            Sign up to start mining
        </p>

    </div>


    <div class="input-group">

        <label for="email">
            Email address
        </label>

        <input
            type="email"
            id="email"
            placeholder="name@example.com"
            autocomplete="email"
        >

    </div>


    <div class="input-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            autocomplete="current-password"
        >

    </div>


    <div class="captcha-box" id="captchaBox">

        <span id="captchaQuestion">
            Solve: 3 + 4 =
        </span>

        <input
            type="number"
            id="captchaInput"
            placeholder="Ans"
        >

    </div>


    <button
        id="authBtn"
        class="auth-btn"
    >
        Sign up with Email
    </button>


    <div id="message"></div>


    <div class="toggle-text">

        <span id="toggleBtn">
            Already have an account? Log in
        </span>

    </div>


    <div class="divider">
        <span>OR</span>
    </div>


    <button
        id="googleLoginBtn"
        class="google-btn"
    >

        <svg
            width="18"
            height="18"
            viewBox="0 0 48 48"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />

            <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />

            <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z"
            />

            <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />

        </svg>

        Continue with Google

    </button>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBU75WYp5ioaMD1LrNcDyAvROFW2wrTil0",

    authDomain:
        "nexusnova-6ade2.firebaseapp.com",

    projectId:
        "nexusnova-6ade2",

    storageBucket:
        "nexusnova-6ade2.firebasestorage.app",

    messagingSenderId:
        "49791194817",

    appId:
        "1:49791194817:web:07f28326e0f15979536640",

    measurementId:
        "G-YLPFKWSS12"
};


/* =========================================================
   START FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const googleProvider =
    new GoogleAuthProvider();


/* =========================================================
   ELEMENTS
========================================================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const captchaInput =
    document.getElementById("captchaInput");

const captchaBox =
    document.getElementById("captchaBox");

const captchaQuestion =
    document.getElementById("captchaQuestion");

const authBtn =
    document.getElementById("authBtn");

const googleLoginBtn =
    document.getElementById("googleLoginBtn");

const toggleBtn =
    document.getElementById("toggleBtn");

const title =
    document.getElementById("title");

const subtitle =
    document.getElementById("subtitle");

const message =
    document.getElementById("message");


/* =========================================================
   MODE
========================================================= */

let loginMode = false;


/* =========================================================
   CAPTCHA
========================================================= */

let correctAnswer = 0;


function createCaptcha() {

    const num1 =
        Math.floor(Math.random() * 9) + 1;

    const num2 =
        Math.floor(Math.random() * 9) + 1;

    correctAnswer =
        num1 + num2;

    captchaQuestion.textContent =
        `Solve: ${num1} + ${num2} =`;

    captchaInput.value = "";
}


createCaptcha();


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, success = false) {

    message.innerHTML =
        `<span style="color:${success ? "#22c55e" : "#ef4444"}">
            ${text}
        </span>`;
}


/* =========================================================
   CREATE FIRESTORE USER
========================================================= */

async function createUserProfile(user, name = "") {

    const userRef =
        doc(db, "users", user.uid);

    const userSnap =
        await getDoc(userRef);


    /* Already exists */

    if (userSnap.exists()) {
        return;
    }


    /* Referral code */

    const referralCode =
        "NVX" +
        user.uid.substring(0, 8).toUpperCase();


    /* Create user */

    await setDoc(
        userRef,
        {

            uid:
                user.uid,

            name:
                name ||
                user.displayName ||
                "Miner User",

            email:
                user.email || "",

            balance:
                0,

            totalMined:
                0,

            tasksCompleted:
                0,

            completedTasks:
                {},

            miningActive:
                false,

            miningStartedAt:
                0,

            miningLastUpdate:
                0,

            sessionEarned:
                0,

            lastDailyReward:
                0,

            referralCode:
                referralCode,

            createdAt:
                serverTimestamp()

        }
    );

}


/* =========================================================
   GO TO PAGE 2
========================================================= */

function openDashboard() {

    showMessage(
        "Login successful! Opening dashboard...",
        true
    );

    setTimeout(() => {

        window.location.replace(
            "./page2.html"
        );

    }, 500);

}


/* =========================================================
   LOGIN / SIGNUP SWITCH
========================================================= */

toggleBtn.addEventListener(
    "click",
    () => {

        loginMode =
            !loginMode;

        message.innerHTML = "";

        emailInput.value = "";
        passwordInput.value = "";
        captchaInput.value = "";


        if (loginMode) {

            title.textContent =
                "Welcome Back";

            subtitle.textContent =
                "Log in to your account";

            authBtn.textContent =
                "Log in with Email";

            captchaBox.style.display =
                "none";

            toggleBtn.textContent =
                "Don't have an account? Sign up";

        } else {

            title.textContent =
                "NexusNova";

            subtitle.textContent =
                "Sign up to start mining";

            authBtn.textContent =
                "Sign up with Email";

            captchaBox.style.display =
                "flex";

            toggleBtn.textContent =
                "Already have an account? Log in";

            createCaptcha();

        }

    }
);


/* =========================================================
   EMAIL LOGIN / SIGNUP
========================================================= */

authBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;
        }


        /* CAPTCHA ONLY FOR SIGNUP */

        if (!loginMode) {

            const answer =
                Number(captchaInput.value);

            if (
                !captchaInput.value ||
                answer !== correctAnswer
            ) {

                showMessage(
                    "Incorrect CAPTCHA. Please try again."
                );

                createCaptcha();

                return;
            }

        }


        authBtn.disabled = true;


        if (loginMode) {

            authBtn.textContent =
                "Logging in...";

        } else {

            authBtn.textContent =
                "Creating account...";

        }


        try {


            /* =================================================
               LOGIN
            ================================================= */

            if (loginMode) {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                /*
                   IMPORTANT:
                   If old account has no Firestore profile,
                   create it now.
                */

                await createUserProfile(
                    result.user
                );


                openDashboard();

                return;
            }


            /* =================================================
               SIGNUP
            ================================================= */

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            /* Create Firestore profile */

            await createUserProfile(
                result.user
            );


            openDashboard();


        } catch (error) {

            console.error(
                "AUTH ERROR:",
                error
            );


            let errorText =
                "Something went wrong. Please try again.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorText =
                    "This email is already registered. Please use Login.";

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                errorText =
                    "Incorrect email or password.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorText =
                    "Please enter a valid email address.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorText =
                    "Password must contain at least 6 characters.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorText =
                    "Internet connection problem.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                errorText =
                    "Firebase Firestore permission denied. Check Firestore rules.";

            }

            else {

                errorText =
                    error.message || errorText;

            }


            showMessage(
                errorText
            );


            authBtn.disabled =
                false;


            authBtn.textContent =
                loginMode
                    ? "Log in with Email"
                    : "Sign up with Email";

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleLoginBtn.addEventListener(
    "click",
    async () => {

        googleLoginBtn.disabled =
            true;

        googleLoginBtn.textContent =
            "Connecting to Google...";


        try {

            const result =
                await signInWithPopup(
                    auth,
                    googleProvider
                );


            /*
               IMPORTANT:
               Create Firestore profile for Google user
               if it does not already exist.
            */

            await createUserProfile(
                result.user
            );


            openDashboard();


        } catch (error) {

            console.error(
                "GOOGLE ERROR:",
                error
            );


            let errorText =
                error.message ||
                "Google login failed.";


            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                errorText =
                    "Google login was cancelled.";

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                errorText =
                    "Browser blocked Google popup. Allow popups.";

            }

            else if (
                error.code ===
                "auth/unauthorized-domain"
            ) {

                errorText =
                    "This StackBlitz domain is not authorized in Firebase.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                errorText =
                    "Firestore permission denied. Check Firestore rules.";

            }


            showMessage(
                errorText
            );


            googleLoginBtn.disabled =
                false;

            googleLoginBtn.innerHTML = `
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 48 48"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                    />

                    <path
                        fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z"
                    />

                    <path
                        fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                    />
                </svg>

                Continue with Google
            `;

        }

    }
);

</script>

</body>
</html>
