<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusNova - Login / Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 5px; font-size: 24px; }
        p { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            color: #e2e8f0;
            font-size: 13px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #22c55e;
        }

        .captcha-box {
            background-color: #334155;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
        .captcha-box input {
            width: 70px;
            padding: 6px;
            text-align: center;
            background-color: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 4px;
        }

        .signup-btn {
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .signup-btn:hover {
            background-color: #16a34a;
        }

        .divider {
            margin: 15px 0;
            display: flex;
            align-items: center;
            color: #64748b;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #475569;
        }
        .divider span {
            padding: 0 10px;
            font-size: 13px;
        }

        .google-btn {
            background-color: #ffffff;
            color: #333333;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .google-btn:hover {
            background-color: #f1f5f9;
        }

        .toggle-text {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .toggle-text span {
            color: #22c55e;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        #message {
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="title">Welcome to NexusNova</h1>
        <p id="subtitle">Sign up to start mining</p>

        <div class="input-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="name@company.com" required>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <!-- Math Captcha -->
        <div class="captcha-box" id="captchaBox">
            <span id="captchaQuestion">Solve: 3 + 4 =</span>
            <input type="number" id="captchaInput" placeholder="Ans">
        </div>

        <button id="authBtn" class="signup-btn">Sign up with Email</button>

        <div id="message"></div>

        <!-- Toggle Switch -->
        <div class="toggle-text">
            <span id="toggleBtn">Already have an account? Log in</span>
        </div>

        <div class="divider"><span>OR</span></div>

        <button id="googleLoginBtn" class="google-btn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
        </button>
    </div>

    <!-- Firebase & App Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBU75WYp5ioaMD1LrNcDyAvROFW2wrTil0",
            authDomain: "nexusnova-6ade2.firebaseapp.com",
            projectId: "nexusnova-6ade2",
            storageBucket: "nexusnova-6ade2.firebasestorage.app",
            messagingSenderId: "49791194817",
            appId: "1:49791194817:web:07f28326e0f15979536640",
            measurementId: "G-YLPFKWSS12"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let isLoginMode = false;

        // Math Captcha Logic
        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        let correctAnswer = num1 + num2;
        document.getElementById('captchaQuestion').innerText = `Solve: ${num1} + ${num2} =`;

        const toggleBtn = document.getElementById('toggleBtn');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const authBtn = document.getElementById('authBtn');
        const captchaBox = document.getElementById('captchaBox');
        const messageDiv = document.getElementById('message');

        // Toggle Switch Event
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            messageDiv.innerHTML = "";

            if (isLoginMode) {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Log in to your account";
                authBtn.innerText = "Log in with Email";
                captchaBox.style.display = "none";
                toggleBtn.innerText = "Don't have an account? Sign up";
            } else {
                title.innerText = "Welcome to NexusNova";
                subtitle.innerText = "Sign up to start mining";
                authBtn.innerText = "Sign up with Email";
                captchaBox.style.display = "flex";
                toggleBtn.innerText = "Already have an account? Log in";
            }
        });

        // Form Action (Login & Signup Handler)
        authBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                messageDiv.innerHTML = "<span style='color: red;'>Please fill all fields.</span>";
                return;
            }

            if (!isLoginMode) {
                const userCaptcha = parseInt(document.getElementById('captchaInput').value);
                if (isNaN(userCaptcha) || userCaptcha !== correctAnswer) {
                    messageDiv.innerHTML = "<span style='color: red;'>Incorrect Captcha! Try again.</span>";
                    return;
                }

                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        messageDiv.innerHTML = "<span style='color: #22c55e;'>Account created! Redirecting...</span>";
                        setTimeout(() => { window.location.href = "page2.html"; }, 1000);
                    })
                    .catch((error) => {
                        messageDiv.innerHTML = "<span style='color: red;'>Error: " + error.message + "</span>";
                    });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        messageDiv.innerHTML = "<span style='color: #22c55e;'>Login successful! Redirecting...</span>";
                        setTimeout(() => { window.location.href = "page2.html"; }, 1000);
                    })
                    .catch((error) => {
                        messageDiv.innerHTML = "<span style='color: red;'>Error: " + error.message + "</span>";
                    });
            }
        });

        // Google Authentication
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then((result) => {
                    window.location.href = "page2.html";
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        });
    </script>
</body>
</html>
