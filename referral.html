<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>NexusNova Invite</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 0,#18234d 0,transparent 32%),linear-gradient(145deg,#050b14,#081626 58%,#06101c);color:#eaf6ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(440px,100%);padding:26px;border-radius:24px;border:1px solid rgba(103,232,249,.22);background:rgba(8,20,36,.92);box-shadow:0 22px 70px rgba(0,0,0,.36);text-align:center}.logo{width:68px;height:68px;margin:auto;border-radius:20px;display:grid;place-items:center;font-size:32px;font-weight:900;background:linear-gradient(145deg,#54f5d1,#5ba8ff 55%,#c76dff);color:#04111b}.card h1{font-size:25px;margin:16px 0 6px}.sub{font-size:12px;line-height:1.55;color:#8ca1b5}.code{margin:16px 0 10px;padding:12px;border-radius:13px;background:#030a12;border:1px solid rgba(103,232,249,.16);font-weight:900;color:#b8fff0;letter-spacing:.06em}.status{font-size:11px;color:#67e8f9;margin-top:12px}.bad{color:#fb7185}.btn{display:inline-block;width:100%;margin-top:16px;padding:12px 14px;border:0;border-radius:13px;background:linear-gradient(135deg,#54f5d1,#5ba8ff 55%,#a886ff);color:#04111b;text-decoration:none;font-size:12px;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">N</div>
    <h1>You've been invited to NexusNova</h1>
    <div class="sub">Secure account creation now happens on the official NexusNova website.</div>
    <div class="code" id="code">Checking invite…</div>
    <div class="status" id="status">Opening official signup…</div>
    <a class="btn" id="continue" href="https://nexusnovatools.com/register.html">CONTINUE TO SECURE SIGNUP</a>
  </main>
  <script>
    (()=>{
      const raw=new URLSearchParams(location.search).get('ref')||'';
      const code=String(raw).trim().toUpperCase();
      const valid=/^NVX-[A-Z0-9]{8,16}$/.test(code);
      const codeEl=document.getElementById('code');
      const status=document.getElementById('status');
      const button=document.getElementById('continue');
      const base='https://nexusnovatools.com/register.html';
      const target=valid?`${base}?ref=${encodeURIComponent(code)}`:base;
      button.href=target;
      if(!valid){
        codeEl.textContent='Invite code unavailable';
        status.textContent='Opening NexusNova signup without referral attribution.';
        status.classList.add('bad');
      }else{
        codeEl.textContent=code;
        status.textContent='Opening secure NexusNova website signup…';
      }
      setTimeout(()=>location.replace(target),800);
    })();
  </script>
</body>
</html>
