<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>NexusNova Invite</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 0,#18234d 0,transparent 32%),linear-gradient(145deg,#050b14,#081626 58%,#06101c);color:#eaf6ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(440px,100%);padding:26px;border-radius:24px;border:1px solid rgba(139,92,246,.28);background:rgba(8,20,36,.92);box-shadow:0 22px 70px rgba(0,0,0,.36);text-align:center}.logo{width:68px;height:68px;margin:auto;border-radius:20px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#7c3aed,#0891b2);box-shadow:0 14px 34px rgba(124,58,237,.26)}h1{font-size:25px;margin:16px 0 6px}.sub{font-size:12px;line-height:1.55;color:#8ca1b5}.code{margin:16px 0 10px;padding:12px;border-radius:13px;background:#030a12;border:1px solid rgba(103,232,249,.16);font-weight:900;color:#c4b5fd;letter-spacing:.06em}.status{font-size:11px;color:#67e8f9;margin-top:12px}.bad{color:#fb7185}.btn{display:inline-block;width:100%;margin-top:16px;padding:12px 14px;border:0;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#0891b2);color:white;text-decoration:none;font-size:12px;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">N</div>
    <h1>You've been invited to NexusNova</h1>
    <div class="sub">Your referral will only count after a genuine new account verifies its email and completes the first 24-hour mining cycle.</div>
    <div class="code" id="code">Checking invite…</div>
    <div class="status" id="status">Preparing secure signup…</div>
    <a class="btn" id="continue" href="./index.html">CONTINUE TO NEXUSNOVA</a>
  </main>
  <script>
    (()=>{
      const KEY='nexusnova_pending_referral_v1';
      const raw=new URLSearchParams(location.search).get('ref')||'';
      const code=String(raw).trim().toUpperCase();
      const valid=/^NVX-[A-Z0-9]{8,16}$/.test(code);
      const codeEl=document.getElementById('code');
      const status=document.getElementById('status');
      const button=document.getElementById('continue');
      if(!valid){
        codeEl.textContent='Invalid referral link';
        status.textContent='You can still continue to NexusNova without referral attribution.';
        status.classList.add('bad');
        return;
      }
      try{localStorage.setItem(KEY,code);}catch(_){ }
      codeEl.textContent=code;
      status.textContent='Invite saved securely. Opening signup…';
      button.href='./index.html';
      setTimeout(()=>location.replace('./index.html'),650);
    })();
  </script>
</body>
</html>
